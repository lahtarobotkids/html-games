<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Миниган с перезарядкой</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
    #ui {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      color: white; font-size: 24px; text-shadow: 2px 2px 4px black; z-index: 10;
      display: flex; gap: 30px;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.9); font-size: 40px; pointer-events: none; z-index: 10;
    }
    #instruction {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: #ccc; background: rgba(0,0,0,0.6); padding: 10px 25px;
      border-radius: 20px; font-size: 18px; z-index: 10;
    }
    #ammo {
      position: absolute; bottom: 100px; right: 30px; color: white;
      font-size: 28px; text-shadow: 2px 2px 4px black; z-index: 10;
    }
    #reload {
      position: absolute; bottom: 60px; right: 30px; color: #ffaa00;
      font-size: 20px; text-shadow: 2px 2px 4px black; z-index: 10;
      display: none;
    }
  </style>
</head>
<body>
<div id="ui">
  <span>💀 <span id="score">0</span></span>
  <span>❤️ <span id="health">5</span></span>
</div>
<div id="crosshair">➕</div>
<div id="instruction">🖱 Клик для захвата | ЛКМ — огонь | R — перезарядка | ESC — выход</div>
<div id="ammo">🔫 <span id="bullets">100</span> / 100</div>
<div id="reload">ПЕРЕЗАРЯДКА...</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

<script>
  // ---------- НАСТРОЙКИ ----------
  const ENEMY_SPEED = 0.06;
  const SPAWN_INTERVAL = 2.0;
  const FIRE_COOLDOWN = 0.08;
  const BULLET_SPEED = 120;
  const BULLET_LIFETIME = 0.3;
  const PLAYER_MAX_HEALTH = 5;
  const MAX_AMMO = 100;
  const RELOAD_TIME = 3.0;

  // ---------- СЦЕНА ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 10, 40);

  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 1.7, 0);
  camera.rotation.order = 'YXZ';
  let yaw = 0, pitch = 0;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x404040));
  const sun = new THREE.DirectionalLight(0xffeedd, 1);
  sun.position.set(20, 30, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 1024;
  sun.shadow.mapSize.height = 1024;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 60;
  sun.shadow.camera.left = -15;
  sun.shadow.camera.right = 15;
  sun.shadow.camera.top = 15;
  sun.shadow.camera.bottom = -5;
  scene.add(sun);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color: 0x4a7c3f, roughness: 0.9 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------- МИНИГАН ----------
  const gunGroup = new THREE.Group();
  camera.add(gunGroup);
  gunGroup.position.set(0, -0.35, -0.5); // нижняя центральная часть экрана

  // Тренога
  const tripod = new THREE.Group();
  gunGroup.add(tripod);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x5a3d2b, roughness: 0.7 });
  const addLeg = (angle, radius) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.9, 6), legMat);
    leg.castShadow = true; leg.receiveShadow = true;
    const pivot = new THREE.Group(); pivot.rotation.y = angle;
    tripod.add(pivot);
    leg.position.set(radius, -0.45, 0);
    leg.rotation.x = Math.PI / 6;
    pivot.add(leg);
  };
  addLeg(0, 0.4);
  addLeg(Math.PI * 2 / 3, 0.4);
  addLeg(Math.PI * 4 / 3, 0.4);

  // Корпус
  const bodyGeom = new THREE.BoxGeometry(0.5, 0.32, 1.1);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.4 });
  const body = new THREE.Mesh(bodyGeom, bodyMat);
  body.castShadow = true; body.receiveShadow = true;
  body.position.set(0, 0.25, -0.4);
  gunGroup.add(body);

  // Кожух с прорезями
  const shroudGroup = new THREE.Group();
  shroudGroup.position.set(0, 0.25, -0.85);
  gunGroup.add(shroudGroup);
  const shroudOuter = new THREE.Mesh(
    new THREE.CylinderGeometry(0.38, 0.38, 0.45, 16, 1, true),
    new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.5, metalness: 0.8, side: THREE.DoubleSide })
  );
  shroudOuter.castShadow = true; shroudOuter.receiveShadow = true;
  shroudOuter.rotation.x = Math.PI / 2;
  shroudGroup.add(shroudOuter);

  const ringGeom = new THREE.TorusGeometry(0.38, 0.05, 8, 16);
  const ringMat = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.3, metalness: 0.9 });
  for (let zOff of [-0.22, 0.22]) {
    const ring = new THREE.Mesh(ringGeom, ringMat);
    ring.position.z = zOff;
    ring.rotation.x = Math.PI / 2;
    ring.castShadow = true; ring.receiveShadow = true;
    shroudGroup.add(ring);
  }

  // Вращающийся блок стволов (6 стволов)
  const barrelsGroup = new THREE.Group();
  barrelsGroup.position.copy(shroudGroup.position);
  gunGroup.add(barrelsGroup);

  const barrelGeom = new THREE.CylinderGeometry(0.12, 0.12, 2.4, 8);
  const barrelMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.15, metalness: 0.95 });
  const numBarrels = 6;
  const barrelRadius = 0.28;
  for (let i = 0; i < numBarrels; i++) {
    const angle = (i / numBarrels) * Math.PI * 2;
    const barrel = new THREE.Mesh(barrelGeom, barrelMat);
    barrel.castShadow = true; barrel.receiveShadow = true;
    barrel.rotation.x = -Math.PI / 2; // вдоль Z
    barrel.position.set(Math.cos(angle) * barrelRadius, Math.sin(angle) * barrelRadius, 0);
    barrelsGroup.add(barrel);
  }

  // Точка дула (в центре спереди)
  const muzzleMarker = new THREE.Object3D();
  muzzleMarker.position.set(0, 0, -1.2);
  barrelsGroup.add(muzzleMarker);

  // Приклад
  const stockGeom = new THREE.BoxGeometry(0.24, 0.2, 0.55);
  const stock = new THREE.Mesh(stockGeom, bodyMat);
  stock.castShadow = true; stock.receiveShadow = true;
  stock.position.set(0, 0.25, 0.55);
  gunGroup.add(stock);

  // ---------- ПРОТИВНИКИ (С ГОЛОВОЙ) ----------
  const enemies = [];
  function createEnemyMesh() {
    const group = new THREE.Group();
    const bodyGeom = new THREE.CylinderGeometry(0.25, 0.3, 1.2, 8);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcc3333, roughness: 0.6 });
    const body = new THREE.Mesh(bodyGeom, bodyMat);
    body.castShadow = true; body.receiveShadow = true;
    body.position.y = 0.6;
    group.add(body);

    const headGeom = new THREE.SphereGeometry(0.22, 8, 8);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffaa88, roughness: 0.5 });
    const head = new THREE.Mesh(headGeom, headMat);
    head.castShadow = true; head.receiveShadow = true;
    head.position.y = 1.25;
    group.add(head);
    return group;
  }

  function spawnEnemy() {
    const angle = Math.random() * Math.PI * 2;
    const dist = 16 + Math.random() * 10;
    const group = createEnemyMesh();
    group.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
    scene.add(group);
    enemies.push({
      group,
      speed: ENEMY_SPEED + Math.random() * 0.03,
      children: [group.children[0], group.children[1]]
    });
  }

  // ---------- ИГРОВОЕ СОСТОЯНИЕ ----------
  let score = 0, health = PLAYER_MAX_HEALTH, gameOver = false;
  let currentAmmo = MAX_AMMO;
  let isReloading = false, reloadTimer = 0;
  let lastFireTime = 0;

  const scoreEl = document.getElementById('score');
  const healthEl = document.getElementById('health');
  const bulletsEl = document.getElementById('bullets');
  const reloadEl = document.getElementById('reload');

  function updateUI() {
    scoreEl.textContent = score;
    healthEl.textContent = health;
    bulletsEl.textContent = currentAmmo;
    reloadEl.style.display = isReloading ? 'block' : 'none';
  }

  // ---------- УПРАВЛЕНИЕ ----------
  const canvas = renderer.domElement;
  let mouseCaptured = false;
  canvas.addEventListener('click', () => {
    if (!mouseCaptured && !gameOver) canvas.requestPointerLock();
  });
  document.addEventListener('pointerlockchange', () => {
    mouseCaptured = document.pointerLockElement === canvas;
  });
  document.addEventListener('mousemove', (e) => {
    if (!mouseCaptured || gameOver) return;
    const sensitivity = 0.002;
    yaw -= e.movementX * sensitivity;
    pitch -= e.movementY * sensitivity;
    pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 6, pitch));
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
  });

  let isFiring = false;
  canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0 && mouseCaptured && !gameOver && !isReloading) isFiring = true;
  });
  canvas.addEventListener('mouseup', (e) => {
    if (e.button === 0) isFiring = false;
  });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') {
      if (!isReloading && currentAmmo < MAX_AMMO && !gameOver) startReload();
    }
    if (e.key === 'Escape') document.exitPointerLock();
  });

  function startReload() {
    isReloading = true;
    reloadTimer = RELOAD_TIME;
    isFiring = false;
    updateUI();
  }

  // ---------- ВСПЫШКИ И ПУЛИ ----------
  const bullets = [];
  const bulletGeom = new THREE.CylinderGeometry(0.05, 0.05, 0.25, 4);
  const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });

  function createMuzzleFlash(position, cameraQuat) {
    const group = new THREE.Group();
    group.position.copy(position);
    group.quaternion.copy(cameraQuat);
    const mat = new THREE.MeshBasicMaterial({ color: 0xff6600 });
    const barH = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.06), mat);
    const barV = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.5, 0.06), mat);
    group.add(barH);
    group.add(barV);
    scene.add(group);
    setTimeout(() => scene.remove(group), 60);
  }

  function fireBullet() {
    if (isReloading || currentAmmo <= 0) {
      if (currentAmmo <= 0 && !isReloading) startReload();
      return;
    }
    if (Date.now() - lastFireTime < FIRE_COOLDOWN * 1000) return;
    lastFireTime = Date.now();
    currentAmmo--;
    updateUI();

    const muzzleWorld = muzzleMarker.getWorldPosition(new THREE.Vector3());
    createMuzzleFlash(muzzleWorld, camera.quaternion);

    const bullet = new THREE.Mesh(bulletGeom, bulletMat);
    bullet.position.copy(muzzleWorld);
    const flightDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    bullet.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      flightDir.clone().normalize()
    );
    scene.add(bullet);
    bullets.push({
      mesh: bullet,
      velocity: flightDir.multiplyScalar(BULLET_SPEED),
      life: BULLET_LIFETIME
    });

    // Хитскан
    const rayOrigin = new THREE.Vector3();
    camera.getWorldPosition(rayOrigin);
    const rayDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const raycaster = new THREE.Raycaster(rayOrigin, rayDir, 0, 200);
    const allMeshes = enemies.reduce((arr, e) => arr.concat(e.children), []);
    const hits = raycaster.intersectObjects(allMeshes, false);

    if (hits.length > 0) {
      const hitMesh = hits[0].object;
      const enemy = enemies.find(e => e.children.includes(hitMesh));
      if (enemy) {
        const hitFlash = new THREE.Mesh(
          new THREE.SphereGeometry(0.25, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0xffff00 })
        );
        hitFlash.position.copy(hits[0].point);
        scene.add(hitFlash);
        setTimeout(() => scene.remove(hitFlash), 100);

        scene.remove(enemy.group);
        enemies.splice(enemies.indexOf(enemy), 1);
        score++;
        updateUI();
      }
    }

    if (currentAmmo <= 0) startReload();
  }

  // ---------- ВРАГИ ----------
  function updateEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const enemy = enemies[i];
      const dir = new THREE.Vector3(0, 0, 0).sub(enemy.group.position).normalize();
      enemy.group.position.add(dir.multiplyScalar(enemy.speed));
      enemy.group.lookAt(new THREE.Vector3(0, 0.6, 0));

      if (enemy.group.position.length() < 1.2) {
        scene.remove(enemy.group);
        enemies.splice(i, 1);
        health--;
        updateUI();
        if (health <= 0) {
          gameOver = true;
          document.getElementById('instruction').textContent = '💀 Вы погибли. Обновите страницу.';
          document.exitPointerLock();
        }
      }
    }
  }

  // ---------- АНИМАЦИЯ СТВОЛОВ И ПУЛЬ ----------
  let barrelRotationSpeed = 0;
  function updateBullets(delta) {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.life -= delta;
      if (b.life <= 0) {
        scene.remove(b.mesh);
        bullets.splice(i, 1);
      } else {
        b.mesh.position.add(b.velocity.clone().multiplyScalar(delta));
      }
    }
  }

  function updateBarrels(delta) {
    if (isFiring && !isReloading && currentAmmo > 0) {
      barrelRotationSpeed = Math.min(barrelRotationSpeed + delta * 40, 25);
    } else {
      barrelRotationSpeed = Math.max(barrelRotationSpeed - delta * 30, 0);
    }
    barrelsGroup.rotation.z += barrelRotationSpeed * delta;
  }

  // ---------- ИГРОВОЙ ЦИКЛ ----------
  const clock = new THREE.Clock();
  function animate() {
    const delta = Math.min(clock.getDelta(), 0.1);
    if (gameOver) {
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
      return;
    }

    if (isReloading) {
      reloadTimer -= delta;
      if (reloadTimer <= 0) {
        currentAmmo = MAX_AMMO;
        isReloading = false;
        updateUI();
      }
    }

    if (isFiring && mouseCaptured && !isReloading && currentAmmo > 0) {
      fireBullet();
    }

    updateEnemies();
    updateBullets(delta);
    updateBarrels(delta);

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  setInterval(() => {
    if (!gameOver && mouseCaptured) spawnEnemy();
  }, SPAWN_INTERVAL * 1000);

  updateUI();
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
