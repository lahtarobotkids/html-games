<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смешарики: Секретный бункер (Серия 3) - с озвучкой</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a0a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 40%, #7EC850 60%, #5DAE3B 100%);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            overflow: hidden;
            cursor: pointer;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #dialogue-box {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #FF9800;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            color: #333;
            text-align: center;
            min-width: 200px;
            max-width: 85%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            z-index: 10;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 0.5s forwards;
        }
        #dialogue-box::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 15px solid #FF9800;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        #subtitles {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #FFD700;
            font-size: 20px;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 30px;
            letter-spacing: 1px;
            text-align: center;
            white-space: nowrap;
            z-index: 9;
            opacity: 0;
            transition: opacity 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            border: 2px solid #FFD700;
            font-family: 'Courier New', monospace;
            text-shadow: 2px 2px 0 #000;
        }
        #subtitles.show {
            opacity: 1;
            animation: subtitlePulse 0.4s ease-out;
        }

        @keyframes subtitlePulse {
            0% { transform: translateX(-50%) scale(0.9); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }

        #title {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 3px 3px 0 #FF6B35, -1px -1px 0 #333;
            z-index: 5;
            text-align: center;
            letter-spacing: 2px;
        }

        #sound-indicator {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #4FC3F7;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #sound-indicator.active {
            opacity: 1;
        }

        #restart-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            border: 2px solid #FF9800;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        #restart-btn:hover {
            background: #FF9800;
            color: white;
            transform: scale(1.1);
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>

        <div id="dialogue-box">▶ Нажмите, чтобы начать!</div>
        <div id="subtitles"></div>
        <div id="sound-indicator">🔊 Говорит...</div>
        <button id="restart-btn" title="Начать заново">🔄</button>
        <div id="loading-screen">
            <p>🎙️ Подготовка голоса...</p>
            <p style="font-size:14px;color:#aaa;">(проверка синтезатора речи)</p>
        </div>
    </div>

    <script>
        // ==================== ОСНОВНЫЕ ЭЛЕМЕНТЫ ====================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('container');
        const dialogueBox = document.getElementById('dialogue-box');
        const subtitles = document.getElementById('subtitles');
        const soundIndicator = document.getElementById('sound-indicator');

        let currentScene = 0;

        let speechSynth = window.speechSynthesis;
        let currentUtterance = null;
        let bunkerRevealed = 0; // 0 - скрыт, 1 - частично, 2 - полностью

        // ==================== ГОЛОСОВЫЕ ПРОФИЛИ ====================
        const voiceProfiles = {
            'КОПАТЫЧ': { pitch: 0.75, rate: 0.8, voiceName: 'Google русский' },
            'АГЕНТ': { pitch: 1.05, rate: 1.1, voiceName: 'Google русский' },
            'КРОШ': { pitch: 1.6, rate: 1.2, voiceName: 'Google русский' },
            'ЛОСЯШ': { pitch: 0.85, rate: 0.9, voiceName: 'Google русский' },
            'ЁЖИК': { pitch: 1.2, rate: 1.0, voiceName: 'Google русский' },
            'КАРЫЧ': { pitch: 0.7, rate: 0.85, voiceName: 'Google русский' },
            'СОВУНЬЯ': { pitch: 1.4, rate: 0.95, voiceName: 'Google русский' },
            'РАССКАЗЧИК': { pitch: 0.95, rate: 0.95, voiceName: 'Google русский' }
        };

        function detectSpeaker(text) {
            if (text.startsWith('КОПАТЫЧ:')) return 'КОПАТЫЧ';
            if (text.startsWith('АГЕНТ:')) return 'АГЕНТ';
            if (text.startsWith('КРОШ:')) return 'КРОШ';
            if (text.startsWith('ЛОСЯШ:')) return 'ЛОСЯШ';
            if (text.startsWith('ЁЖИК:')) return 'ЁЖИК';
            if (text.startsWith('КАРЫЧ:')) return 'КАРЫЧ';
            if (text.startsWith('СОВУНЬЯ:')) return 'СОВУНЬЯ';
            return 'РАССКАЗЧИК';
        }

        function getRussianVoice() {
            const voices = speechSynth.getVoices();
            let ruVoice = voices.find(v => v.lang.startsWith('ru') && v.name.includes('Google'));
            if (!ruVoice) ruVoice = voices.find(v => v.lang.startsWith('ru'));
            if (!ruVoice) ruVoice = voices.find(v => v.lang.startsWith('ru') || v.name.includes('Russian'));
            return ruVoice || voices[0];
        }

        function speakText(text) {
            if (speechSynth.speaking) speechSynth.cancel();
            const speaker = detectSpeaker(text);
            const profile = voiceProfiles[speaker];
            let cleanText = text;
            if (text.includes(':')) cleanText = text.split(':')[1].trim();
            cleanText = cleanText.replace(/"/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'ru-RU';
            utterance.pitch = profile.pitch;
            utterance.rate = profile.rate;
            const voice = getRussianVoice();
            if (voice) utterance.voice = voice;
            subtitles.textContent = cleanText;
            subtitles.classList.add('show');
            soundIndicator.classList.add('active');
            isSpeaking = true;
            utterance.onend = () => {
                subtitles.classList.remove('show');
                soundIndicator.classList.remove('active');
                isSpeaking = false;
                currentUtterance = null;
            };
            utterance.onerror = () => {
                subtitles.classList.remove('show');
                soundIndicator.classList.remove('active');
                isSpeaking = false;
                currentUtterance = null;
            };
            currentUtterance = utterance;
            speechSynth.speak(utterance);
        }

        function stopSpeech() {
            if (speechSynth.speaking) speechSynth.cancel();
            subtitles.classList.remove('show');
            soundIndicator.classList.remove('active');
            isSpeaking = false;
        }

                voiceText: 'АГЕНТ: "Так-так... Подземное сооружение. Запасы моркови. Всё ясно — готовится к апокалипсису! Надо выяснить подробности!"',

                voiceText: 'КОПАТЫЧ: "Ой-ёй! Раскрыли! Но... постойте. Какой вы агент? Вы же просто... в красном платье и с рыжей шевелюрой! Это маскировка?"',

        // ==================== РИСОВАНИЕ ПЕРСОНАЖЕЙ ====================
        function drawKrosh(x, y, scale = 1, expression = 'normal') {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            
            ctx.beginPath();
            ctx.arc(0, 0, 35, 0, Math.PI * 2);
            ctx.fillStyle = '#4FC3F7';
            ctx.fill();
            ctx.strokeStyle = '#0288D1';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = '#4FC3F7';
            ctx.strokeStyle = '#0288D1';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(-15, -40, 8, 22, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(15, -40, 8, 22, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(-12, -5, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(12, -5, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-9, -3, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(15, -3, 5, 0, Math.PI * 2);
            ctx.fill();
            
            if (expression === 'excited') {
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-20, -18);
                ctx.lineTo(-6, -10);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(20, -18);
                ctx.lineTo(6, -10);
                ctx.stroke();
                ctx.fillStyle = '#E57373';
                ctx.beginPath();
                ctx.arc(0, 8, 10, 0, Math.PI);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.rect(-4, 4, 3, 5);
                ctx.fill();
                ctx.beginPath();
                ctx.rect(1, 4, 3, 5);
                ctx.fill();
            } else {
                ctx.fillStyle = '#E57373';
                ctx.beginPath();
                ctx.arc(0, 5, 6, 0, Math.PI);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.rect(-4, 4, 3, 5);
                ctx.fill();
                ctx.beginPath();
                ctx.rect(1, 4, 3, 5);
                ctx.fill();
            }
            
            ctx.fillStyle = '#FF8A80';
            ctx.beginPath();
            ctx.arc(0, -8, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }

        function drawYojik(x, y, scale = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            
            ctx.beginPath();
            ctx.arc(0, 0, 33, 0, Math.PI * 2);
            ctx.fillStyle = '#E57373';
            ctx.fill();
            ctx.strokeStyle = '#B71C1C';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = '#5D4037';
            for (let i = -3; i <= 3; i++) {
                ctx.beginPath();
                ctx.moveTo(i * 8, -33);
                ctx.lineTo(i * 8 - 5, -48);
                ctx.lineTo(i * 8 + 5, -48);
                ctx.fill();
            }
            
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(-10, -5, 10, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(10, -5, 10, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -5);
            ctx.lineTo(3, -5);
            ctx.stroke();
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(-10, -5, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(10, -5, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-8, -3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(12, -3, 3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(0, 5, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 10, 8, 0.2, Math.PI - 0.2);
            ctx.stroke();
            
            ctx.restore();
        }

        function drawLosyash(x, y, scale = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            
            ctx.beginPath();
            ctx.arc(0, 0, 38, 0, Math.PI * 2);
            ctx.fillStyle = '#FFD54F';
            ctx.fill();
            ctx.strokeStyle = '#F57F17';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.strokeStyle = '#5D4037';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-15, -35);
            ctx.lineTo(-25, -55);
            ctx.lineTo(-30, -50);
            ctx.moveTo(-25, -55);
            ctx.lineTo(-18, -60);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(15, -35);
            ctx.lineTo(25, -55);
            ctx.lineTo(30, -50);
            ctx.moveTo(25, -55);
            ctx.lineTo(18, -60);
            ctx.stroke();
            
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(-12, -5, 12, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(12, -5, 12, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -5);
            ctx.lineTo(3, -5);
            ctx.stroke();
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(-12, -5, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(12, -5, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-10, -3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(14, -3, 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#8D6E63';
            ctx.beginPath();
            ctx.ellipse(0, 5, 10, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }

        function drawKarich(x, y, scale = 1) {
            ctx.save();

            ctx.beginPath();

            ctx.stroke();
            
            ctx.fillStyle = '#3E2723';
            ctx.beginPath();
            ctx.ellipse(0, -32, 25, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.rect(-15, -45, 30, 15);
            ctx.fill();
            
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(10, -8, 10, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(10, -18);
            ctx.lineTo(15, -30);
            ctx.stroke();
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(10, -8, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(12, -7, 3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(-10, -8, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-8, -7, 3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#FF8F00';
            ctx.beginPath();
            ctx.moveTo(-8, 5);
            ctx.lineTo(0, 22);
            ctx.lineTo(8, 5);
            ctx.fill();
            
            ctx.fillStyle = '#E53935';
            ctx.beginPath();
            ctx.moveTo(0, -2);
            ctx.lineTo(-12, -12);
            ctx.lineTo(-12, 8);
            ctx.lineTo(0, -2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(0, -2);
            ctx.lineTo(12, -12);
            ctx.lineTo(12, 8);
            ctx.lineTo(0, -2);
            ctx.fill();
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(0, -2, 3, 0, Math.PI * 2);

            ctx.restore();
        }

        function drawKopatych(x, y, scale = 1, expression = 'normal') {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            
            // Тело (коричневый медведь)
            ctx.beginPath();
            ctx.arc(0, 0, 40, 0, Math.PI * 2);
            ctx.fillStyle = '#8D6E63';
            ctx.fill();
            ctx.strokeStyle = '#4E342E';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Уши (медвежьи, круглые)
            ctx.fillStyle = '#8D6E63';
            ctx.strokeStyle = '#4E342E';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(-20, -35, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(20, -35, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // Шляпа (соломенная)
            ctx.fillStyle = '#FFB74D';
            ctx.beginPath();
            ctx.ellipse(0, -28, 30, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#E65100';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#FFB74D';
            ctx.beginPath();
            ctx.rect(-18, -45, 36, 18);
            ctx.fill();
            ctx.stroke();
            
            // Глаза
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(-14, -2, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(14, -2, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-10, 0, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(18, 0, 5, 0, Math.PI * 2);
            ctx.fill();
            
            // Нос (большой медвежий)
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.ellipse(0, 8, 10, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Рот
            if (expression === 'surprised') {
                ctx.fillStyle = '#C62828';
                ctx.beginPath();
                ctx.arc(0, 22, 10, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(-5, 20, 8, 0.2, Math.PI - 0.2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(5, 20, 8, 0.2, Math.PI - 0.2);
                ctx.stroke();
            }
            
            ctx.restore();
        }

        function drawAgent(x, y, scale = 1, hiding = false) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            
            // Тело (круглое, в красном платье)
            ctx.beginPath();
            ctx.arc(0, 0, 35, 0, Math.PI * 2);
            ctx.fillStyle = '#E53935'; // Красное платье
            ctx.fill();
            ctx.strokeStyle = '#B71C1C';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Рыжая шевелюра (пышная)
            ctx.fillStyle = '#FF6F00';
            ctx.beginPath();
            ctx.arc(0, -20, 22, Math.PI, 0);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(-15, -25, 10, Math.PI * 1.5, 0);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(15, -25, 10, Math.PI, Math.PI * 1.5);
            ctx.fill();
            // Кудряшки
            for (let i = -3; i <= 3; i++) {
                ctx.beginPath();
                ctx.arc(i * 8, -33, 6, Math.PI, 0);
                ctx.fill();
            }
            
            // Чёрные очки
            ctx.fillStyle = '#212121';
            ctx.beginPath();
            ctx.rect(-18, -10, 16, 12);
            ctx.fill();
            ctx.beginPath();
            ctx.rect(2, -10, 16, 12);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-2, -4);
            ctx.lineTo(2, -4);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-18, -4);
            ctx.lineTo(-25, -10);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(18, -4);
            ctx.lineTo(25, -10);
            ctx.stroke();
            
            // Чёрный нос
            ctx.fillStyle = '#212121';
            ctx.beginPath();
            ctx.arc(0, 2, 6, 0, Math.PI * 2);
            ctx.fill();
            
            // Улыбка (загадочная)
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 10, 10, 0.2, Math.PI - 0.2);
            ctx.stroke();
            
            // Если прячется — добавить куст
            if (hiding) {
                ctx.fillStyle = '#388E3C';
                ctx.beginPath();
                ctx.arc(-25, 15, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(25, 15, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(0, 5, 20, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }

        // ==================== ФОН ====================
        function drawBackground(timeOfDay) {
            let skyGradient;
            if (timeOfDay === 'morning') {
                skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
                skyGradient.addColorStop(0, '#87CEEB');
                skyGradient.addColorStop(1, '#FFF9C4');
            } else if (timeOfDay === 'day') {
                skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
                skyGradient.addColorStop(0, '#64B5F6');
                skyGradient.addColorStop(1, '#BBDEFB');
            } else if (timeOfDay === 'evening') {
                skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
                skyGradient.addColorStop(0, '#FF6F00');
                skyGradient.addColorStop(0.5, '#FF8F00');
                skyGradient.addColorStop(1, '#FFB74D');
            } else if (timeOfDay === 'night') {
                skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
                skyGradient.addColorStop(0, '#0D1B2A');
                skyGradient.addColorStop(0.5, '#1B2838');
                skyGradient.addColorStop(1, '#415A77');
            } else if (timeOfDay === 'sunset') {
                skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
                skyGradient.addColorStop(0, '#E91E63');
                skyGradient.addColorStop(0.5, '#FF6F00');
                skyGradient.addColorStop(1, '#FFD54F');
            }
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.6);
            
            // Звёзды ночью
            if (timeOfDay === 'night') {
                ctx.fillStyle = 'white';
                for (let i = 0; i < 30; i++) {
                    const sx = (Math.sin(i * 73.37) * 0.5 + 0.5) * canvas.width;
                    const sy = (Math.cos(i * 47.13) * 0.5 + 0.3) * canvas.height * 0.4;
                    ctx.beginPath();
                    ctx.arc(sx, sy, Math.random() * 2 + 1, 0, Math.PI * 2);
                    ctx.fill();
                }
                // Луна
                ctx.fillStyle = '#FFF9C4';
                ctx.beginPath();
                ctx.arc(canvas.width * 0.8, canvas.height * 0.18, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#0D1B2A';
                ctx.beginPath();
                ctx.arc(canvas.width * 0.82, canvas.height * 0.16, 30, 0, Math.PI * 2);
                ctx.fill();
            } else if (timeOfDay === 'sunset') {
                ctx.fillStyle = '#FF6F00';
                ctx.beginPath();
                ctx.arc(canvas.width * 0.7, canvas.height * 0.4, 45, 0, Math.PI * 2);
                ctx.fill();
            } else if (timeOfDay === 'evening') {
                ctx.fillStyle = '#FF8F00';
                ctx.beginPath();
                ctx.arc(canvas.width * 0.7, canvas.height * 0.35, 40, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#FFF176';
                ctx.beginPath();
                ctx.arc(canvas.width * 0.8, canvas.height * 0.2, 45, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Холмы
            ctx.fillStyle = timeOfDay === 'night' ? '#2E4A2E' : '#7EC850';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.55);
            ctx.quadraticCurveTo(canvas.width * 0.3, canvas.height * 0.4, canvas.width * 0.6, canvas.height * 0.55);
            ctx.quadraticCurveTo(canvas.width * 0.8, canvas.height * 0.5, canvas.width, canvas.height * 0.55);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
            
            ctx.fillStyle = timeOfDay === 'night' ? '#1B3A1B' : '#5DAE3B';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.7);
            ctx.quadraticCurveTo(canvas.width * 0.5, canvas.height * 0.65, canvas.width, canvas.height * 0.7);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
            
            drawTree(canvas.width * 0.1, canvas.height * 0.5);
            drawTree(canvas.width * 0.85, canvas.height * 0.52);
            if (timeOfDay !== 'night') {
                drawCloud(canvas.width * 0.2, canvas.height * 0.15);
                drawCloud(canvas.width * 0.55, canvas.height * 0.1);
            }
        }

        function drawTree(x, y) {
            ctx.fillStyle = '#5D4037';
            ctx.fillRect(x - 4, y, 8, 40);
            ctx.fillStyle = '#388E3C';
            ctx.beginPath();
            ctx.arc(x, y - 10, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#43A047';
            ctx.beginPath();
            ctx.arc(x - 8, y - 5, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 8, y - 5, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawCloud(x, y) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.arc(x + 20, y - 5, 18, 0, Math.PI * 2);
            ctx.arc(x + 15, y + 5, 15, 0, Math.PI * 2);
            ctx.arc(x - 15, y, 16, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawBunker(x, y, revealed = 0) {
            ctx.save();
            ctx.translate(x, y);
            
            // Холм над бункером
            ctx.fillStyle = '#6D8B4A';
            ctx.beginPath();
            ctx.ellipse(0, -5, 50, 25, 0, 0, Math.PI * 2);
            ctx.fill();
            
            if (revealed >= 1) {
                // Открытый вход
                ctx.fillStyle = '#3E2723';
                ctx.fillRect(-15, -10, 30, 20);
                ctx.fillStyle = '#1B1B1B';
                ctx.fillRect(-12, -8, 24, 16);
                
                // Дверь бункера (металлическая)
                ctx.fillStyle = '#607D8B';
                ctx.fillRect(-14, -12, 28, 24);
                ctx.strokeStyle = '#37474F';
                ctx.lineWidth = 2;
                ctx.strokeRect(-14, -12, 28, 24);
                // Ручка-колесо
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 5, 0, Math.PI * 2);
                ctx.stroke();
                
                if (revealed >= 2) {
                    // Дверь открыта
                    ctx.fillStyle = '#1B1B1B';
                    ctx.fillRect(-14, -12, 6, 24);
                    ctx.fillStyle = '#FFD700';
                    ctx.font = '8px Arial';
                    ctx.fillText('☢', 4, 4);
                }
            }
            
            // Лопата рядом
            if (revealed >= 1) {
                ctx.strokeStyle = '#8D6E63';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(35, 10);
                ctx.lineTo(35, -15);
                ctx.stroke();
                ctx.fillStyle = '#607D8B';
                ctx.beginPath();
                ctx.moveTo(30, -15);
                ctx.lineTo(40, -15);
                ctx.lineTo(38, -20);
                ctx.lineTo(32, -20);
                ctx.fill();
            }
            
            ctx.restore();
        }

        // ==================== ЧАСТИЦЫ ====================
        function spawnSparkles(x, y, count = 8) {
            for (let i = 0; i < count; i++) {
                sparkles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 3,
                    vy: (Math.random() - 0.5) * 3 - 2,
                    life: 1,
                    size: Math.random() * 4 + 2,
                    color: ['#FFD700', '#FF6B35', '#FF9800', '#E53935'][Math.floor(Math.random() * 4)]
                });
            }
        }

        function updateSparkles() {
            for (let i = sparkles.length - 1; i >= 0; i--) {
                const s = sparkles[i];
                s.x += s.vx;
                s.y += s.vy;
                s.life -= 0.02;
                if (s.life <= 0) sparkles.splice(i, 1);
            }
        }

        function drawSparkles() {
            for (const s of sparkles) {
                ctx.fillStyle = s.color;
                ctx.globalAlpha = s.life;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        // ==================== ОТРИСОВКА СЦЕНЫ ====================
        function drawScene(sceneIndex) {
            const scene = scenes[sceneIndex];
            const W = canvas.width;
            const H = canvas.height;
            
            // Плавное появление бункера
            const targetBunker = scene.bunker || 0;
            bunkerRevealed += (targetBunker - bunkerRevealed) * 0.2;
            
            ctx.clearRect(0, 0, W, H);
            drawBackground(scene.time);
            
            if (scene.id === 'intro') {
                drawKopatych(W * 0.4, H * 0.55, 1.3, 'normal');
                // Лопата в руке
                ctx.strokeStyle = '#8D6E63';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(W * 0.48, H * 0.4);
                ctx.lineTo(W * 0.52, H * 0.25);
                ctx.stroke();
                ctx.fillStyle = '#607D8B';
                ctx.beginPath();
                ctx.moveTo(W * 0.5, H * 0.25);
                ctx.lineTo(W * 0.56, H * 0.22);
                ctx.lineTo(W * 0.55, H * 0.2);
                ctx.lineTo(W * 0.49, H * 0.23);
                ctx.fill();
                drawBunker(W * 0.65, H * 0.45, bunkerRevealed);
            } else if (scene.id === 'agent_arrives') {
                drawAgent(W * 0.5, H * 0.55, 1.4);
                // Чемодан
                ctx.fillStyle = '#5D4037';
                ctx.fillRect(W * 0.56, H * 0.55, 20, 15);
                ctx.strokeStyle = '#3E2723';
                ctx.lineWidth = 2;
                ctx.strokeRect(W * 0.56, H * 0.55, 20, 15);
                spawnSparkles(W * 0.5, H * 0.4, 5);
            } else if (scene.id === 'agent_meets' || scene.id === 'krosh_clueless') {
                drawAgent(W * 0.35, H * 0.55, 1.3);
                drawKrosh(W * 0.65, H * 0.57, 1.3, 'excited');
            } else if (scene.id === 'digging') {
                drawKopatych(W * 0.35, H * 0.52, 1.4, 'normal');
                drawBunker(W * 0.65, H * 0.45, bunkerRevealed);
                // Кучки земли
                ctx.fillStyle = '#5D4037';
                ctx.beginPath();
                ctx.arc(W * 0.55, H * 0.55, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(W * 0.7, H * 0.57, 8, 0, Math.PI * 2);
                ctx.fill();
            } else if (scene.id === 'spying') {
                drawAgent(W * 0.25, H * 0.55, 1.2, true); // hiding = true (куст)
                drawKopatych(W * 0.65, H * 0.52, 1.4, 'normal');
                drawBunker(W * 0.75, H * 0.45, bunkerRevealed);
            } else if (scene.id === 'confrontation') {
                drawAgent(W * 0.35, H * 0.55, 1.3);
                drawKopatych(W * 0.65, H * 0.52, 1.4, 'surprised');
                drawBunker(W * 0.8, H * 0.45, bunkerRevealed);
                // Восклицательный знак
                ctx.fillStyle = '#FF0000';
                ctx.font = '30px Arial';
                ctx.fillText('❗', W * 0.6, H * 0.3);
            } else if (scene.id === 'caught') {
                drawKopatych(W * 0.4, H * 0.52, 1.4, 'surprised');
                drawAgent(W * 0.65, H * 0.55, 1.3);
                drawBunker(W * 0.5, H * 0.5, bunkerRevealed);
            } else if (scene.id === 'reveal') {
                drawAgent(W * 0.4, H * 0.55, 1.3);
                drawKopatych(W * 0.65, H * 0.52, 1.3, 'normal');
                drawBunker(W * 0.55, H * 0.48, bunkerRevealed);
                spawnSparkles(W * 0.5, H * 0.4, 6);
            } else if (scene.id === 'everyone' || scene.id === 'losyash_approves') {
                drawKopatych(W * 0.3, H * 0.52, 1.2, 'normal');
                drawAgent(W * 0.15, H * 0.55, 1.1);
                drawKrosh(W * 0.55, H * 0.57, 1.1, 'excited');
                drawYojik(W * 0.7, H * 0.58, 1.1);
                drawLosyash(W * 0.5, H * 0.5, 1.0);
                drawKarich(W * 0.82, H * 0.55, 1.1);
                drawBunker(W * 0.4, H * 0.48, bunkerRevealed);
            } else if (scene.id === 'krosh_excited') {
                drawKopatych(W * 0.35, H * 0.52, 1.2, 'normal');
                drawAgent(W * 0.2, H * 0.55, 1.1);
                drawKrosh(W * 0.6, H * 0.57, 1.3, 'excited');
                drawYojik(W * 0.75, H * 0.58, 1.1);
                drawBunker(W * 0.5, H * 0.48, bunkerRevealed);
                spawnSparkles(W * 0.6, H * 0.4, 5);
            } else if (scene.id === 'ending' || scene.id === 'final') {
                drawAgent(W * 0.35, H * 0.55, 1.3);
                drawKopatych(W * 0.6, H * 0.52, 1.3, 'normal');
                drawKrosh(W * 0.2, H * 0.58, 1.0, 'excited');
                drawYojik(W * 0.78, H * 0.58, 1.0);
                drawBunker(W * 0.5, H * 0.48, bunkerRevealed);
                // Сердечки
                ctx.fillStyle = '#E91E63';
                ctx.font = '16px Arial';
                ctx.fillText('❤️', W * 0.45, H * 0.35);
                ctx.fillText('❤️', W * 0.55, H * 0.32);
            }
            
            updateSparkles();
            drawSparkles();
        }

        // ==================== АНИМАЦИЯ ====================
        function animate() {
            time += 0.02;
            drawScene(currentScene);
            animationFrame = requestAnimationFrame(animate);
        }

        // ==================== НАВИГАЦИЯ ====================
        function nextScene() {
            if (isSpeaking) stopSpeech();
            
            if (currentScene < scenes.length - 1) {
                currentScene++;
                const scene = scenes[currentScene];
                dialogueBox.textContent = scene.text;
                dialogueBox.style.animation = 'none';
                dialogueBox.offsetHeight;
                dialogueBox.style.animation = 'fadeInUp 0.5s forwards';
                sparkles = [];
                if (scene.voiceText) {
                    setTimeout(() => speakText(scene.voiceText), 300);
                }
            } else if (currentScene === scenes.length - 1) {
                dialogueBox.textContent = '🎬 КОНЕЦ ТРЕТЬЕЙ СЕРИИ. Продолжение следует...';
                subtitles.textContent = 'Конец';
                subtitles.classList.add('show');
                speakText('Конец третьей серии. Продолжение следует.');
            }
        }

        function restartAll() {
            stopSpeech();
            currentScene = 0;
            bunkerRevealed = 0;
            sparkles = [];
            dialogueBox.textContent = scenes[0].text;
            dialogueBox.style.animation = 'none';
            dialogueBox.offsetHeight;
            dialogueBox.style.animation = 'fadeInUp 0.5s forwards';
            subtitles.classList.remove('show');
            soundIndicator.classList.remove('active');
            setTimeout(() => speakText(scenes[0].voiceText), 300);
        }

        // ==================== ОБРАБОТЧИКИ ====================
        container.addEventListener('click', (e) => {
            if (e.target === restartBtn) return;
            if (loadingScreen.style.display !== 'none') return;
            nextScene();
        });

        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            restartAll();
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') {
                e.preventDefault();
                nextScene();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                if (currentScene > 0) {
                    stopSpeech();
                    currentScene--;
                    dialogueBox.textContent = scenes[currentScene].text;
                    subtitles.classList.remove('show');
                }
            } else if (e.code === 'KeyR') {
                e.preventDefault();
                restartAll();
            }
        });

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', () => {
            resizeCanvas();
            drawScene(currentScene);
        });

        function init() {
            resizeCanvas();
            if (speechSynth.getVoices().length === 0) {
                speechSynth.addEventListener('voiceschanged', () => {
                    loadingScreen.style.display = 'none';
                    dialogueBox.textContent = scenes[0].text;
                    drawScene(0);
                    animate();
                    console.log('🎙️ Голосовой движок готов!');
                });
            } else {
                loadingScreen.style.display = 'none';
                dialogueBox.textContent = scenes[0].text;
                drawScene(0);
                animate();
            }
            console.log('🕵️ Смешарики: Секретный бункер - Серия 3 с озвучкой!');
            console.log('👆 Кликайте / пробел для навигации');
        }

        init();
    </script>
</body>
</html>
