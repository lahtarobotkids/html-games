<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крош: Дорога к домику 🏡</title>
    <style>
        :root {
            --bg: #87CEEB;
            --ground: #7ec850;
            --ui-bg: rgba(0, 0, 0, 0.6);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(180deg, #5ba3d9 0%, #87CEEB 30%, #b8e0f7 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .game-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .game-header {
            display: flex;
            align-items: center;
            gap: 24px;
            background: var(--ui-bg);
            padding: 10px 24px;
            border-radius: 40px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        }
        .score-display {
            color: #fff;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .score-display .icon { font-size: 1.6rem; }
        .score-value {
            background: #ff6b35;
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            min-width: 60px;
            text-align: center;
            font-size: 1.3rem;
        }
        .highscore-display {
            color: #ffd700;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .highscore-value {
            background: rgba(255, 215, 0, 0.2);
            padding: 3px 10px;
            border-radius: 14px;
            border: 1px solid rgba(255, 215, 0, 0.5);
        }
        canvas {
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25), 0 0 0 4px rgba(255, 255, 255, 0.3), inset 0 0 0 2px rgba(255, 255, 255, 0.05);
            cursor: pointer;
            display: block;
            max-width: 95vw;
            max-height: 75vh;
            image-rendering: auto;
        }
        .controls-hint {
            display: flex;
            gap: 20px;
            background: var(--ui-bg);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
        .key-hint {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .key-badge {
            background: #fff;
            color: #333;
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: 0 3px 0 #ccc;
            letter-spacing: 0.5px;
            min-width: 36px;
            text-align: center;
            transition: transform 0.1s;
        }
        .key-badge.pressed {
            transform: translateY(3px);
            box-shadow: 0 0px 0 #ccc;
            background: #e0ffe0;
        }
        .key-badge.space-key { min-width: 70px; letter-spacing: 1px; }
        .overlay-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 20px 36px;
            border-radius: 20px;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-align: center;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
        .overlay-message.visible { transform: translate(-50%, -50%) scale(1); }
        .overlay-message .sub { font-size: 0.9rem; font-weight: 400; opacity: 0.8; margin-top: 6px; }
        .overlay-message .emoji { font-size: 2.8rem; display: block; }
        @media (max-width: 600px) {
            .game-header { gap: 14px; padding: 8px 16px; border-radius: 30px; }
            .score-display { font-size: 1.1rem; }
            .score-value { font-size: 1.1rem; padding: 3px 10px; }
            .controls-hint { gap: 10px; padding: 8px 14px; }
            .key-hint { font-size: 0.8rem; gap: 5px; }
            .key-badge { padding: 4px 8px; font-size: 0.75rem; border-radius: 7px; }
            .key-badge.space-key { min-width: 50px; }
            canvas { border-radius: 14px; max-width: 98vw; max-height: 60vh; }
        }
    </style>
</head>
<body>
<div class="game-wrapper" id="gameWrapper">
    <div class="game-header">
        <div class="score-display"><span class="icon">⭐</span> Счёт: <span class="score-value" id="scoreDisplay">0</span></div>
        <div class="highscore-display">🏆 Рекорд: <span class="highscore-value" id="highscoreDisplay">0</span></div>
    </div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="controls-hint">
        <div class="key-hint"><span class="key-badge space-key" id="spaceBadge">ПРОБЕЛ</span> Прыжок</div>
        <div class="key-hint"><span class="key-badge" id="downBadge">↓</span> Пригнуться</div>
    </div>
    <div class="overlay-message" id="overlayMessage">
        <span class="emoji">🐰</span> Нажми ПРОБЕЛ
        <div class="sub">или кликни по игре</div>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const highscoreDisplay = document.getElementById('highscoreDisplay');
        const overlayMessage = document.getElementById('overlayMessage');
        const spaceBadge = document.getElementById('spaceBadge');
        const downBadge = document.getElementById('downBadge');

        const W = canvas.width;
        const H = canvas.height;
        const GROUND_Y = 320;
        const WIN_SCORE = 100000;

        let gameState = 'waiting'; // 'waiting', 'playing', 'gameover', 'victory'
        let score = 0;
        let highscore = 0;
        let frameCount = 0;
        let gameSpeed = 4.5;
        let speedIncrement = 0.0015;
        let maxSpeed = 11;

        const krosh = {
            x: 160,
            y: GROUND_Y,
            width: 48,
            height: 56,
            vy: 0,
            isJumping: false,
            isDucking: false,
            duckHeight: 28,
            normalHeight: 56,
            groundY: GROUND_Y,
            jumpForce: -14.5,
            gravity: 0.7,
            earWiggle: 0,
            blinkTimer: 0,
            isBlinking: false,
            trailParticles: [],
        };

        let obstacles = [];
        const OBSTACLE_TYPES = { BENCH: 'bench', CARROT: 'carrot' };
        let spawnTimer = 0;
        let spawnInterval = 90;
        let minSpawnInterval = 38;
        let spawnIntervalDecrease = 0.04;

        let particles = [];
        let screenShake = 0;

        const keys = { space: false, arrowDown: false };

        // Победа
        let victoryPhase = 0;        // 0 - идём к домику, 1 - стоим у домика, 2 - табличка показана
        let victoryTimer = 0;
        const HOUSE_X = 680;
        const HOUSE_Y = GROUND_Y - 110; // верхняя точка домика
        const VICTORY_WALK_SPEED = 3.5;

        const savedHighscore = localStorage.getItem('kroshRunnerHighscore');
        if (savedHighscore !== null) highscore = parseInt(savedHighscore, 10) || 0;
        highscoreDisplay.textContent = highscore;

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playBeep(freq, duration, type = 'square', vol = 0.08) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }
        function sfxJump() { playBeep(520, 0.12, 'square', 0.07); playBeep(680, 0.08, 'square', 0.05); }
        function sfxDuck() { playBeep(180, 0.15, 'triangle', 0.06); }
        function sfxScore() { playBeep(880, 0.1, 'square', 0.08); playBeep(1100, 0.08, 'square', 0.05); }
        function sfxHit() { playBeep(70, 0.3, 'sawtooth', 0.12); playBeep(45, 0.4, 'triangle', 0.1); }
        function sfxWin() { 
            for(let i=0;i<5;i++){ 
                setTimeout(()=>{ playBeep(660 + i*110, 0.15, 'square', 0.07); }, i*80);
            }
        }

        function resetGame() {
            krosh.y = GROUND_Y;
            krosh.vy = 0;
            krosh.isJumping = false;
            krosh.isDucking = false;
            krosh.earWiggle = 0;
            krosh.blinkTimer = 0;
            krosh.isBlinking = false;
            krosh.trailParticles = [];
            obstacles = [];
            particles = [];
            screenShake = 0;
            score = 0;
            gameSpeed = 4.5;
            spawnTimer = 0;
            spawnInterval = 90;
            frameCount = 0;
            scoreDisplay.textContent = '0';
            victoryPhase = 0;
            victoryTimer = 0;
            krosh.x = 160;
            updateOverlay(false);
        }

        function startGame() {
            initAudio();
            resetGame();
            gameState = 'playing';
            updateOverlay(false);
            spawnObstacle();
            spawnTimer = Math.floor(spawnInterval * 0.6);
        }

        function gameOver() {
            if (gameState !== 'playing') return;
            gameState = 'gameover';
            sfxHit();
            screenShake = 18;
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: krosh.x + Math.random() * krosh.width - krosh.width/2,
                    y: krosh.y - Math.random() * krosh.height,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.8) * 8,
                    life: 1,
                    decay: 0.02 + Math.random() * 0.04,
                    size: 3 + Math.random() * 7,
                    color: Math.random() < 0.5 ? '#4da6e8' : '#6dc5f5',
                });
            }
            if (score > highscore) {
                highscore = score;
                highscoreDisplay.textContent = highscore;
                localStorage.setItem('kroshRunnerHighscore', highscore);
            }
            updateOverlay(true);
        }

        function triggerVictory() {
            if (gameState !== 'playing') return;
            gameState = 'victory';
            victoryPhase = 0;
            victoryTimer = 0;
            sfxWin();
            obstacles = []; // убираем все препятствия
            particles = [];
            screenShake = 0;
            krosh.isJumping = false;
            krosh.isDucking = false;
            krosh.vy = 0;
            krosh.y = GROUND_Y;
            // Обновим рекорд
            if (score > highscore) {
                highscore = score;
                highscoreDisplay.textContent = highscore;
                localStorage.setItem('kroshRunnerHighscore', highscore);
            }
        }

        function updateOverlay(isGameOver) {
            if (isGameOver) {
                overlayMessage.innerHTML = '<span class="emoji">💥</span>Игра окончена!<div class="sub">Счёт: ' + score + ' &nbsp;|&nbsp; Нажми ПРОБЕЛ чтобы начать заново</div>';
                overlayMessage.classList.add('visible');
            } else if (gameState === 'waiting') {
                overlayMessage.innerHTML = '<span class="emoji">🐰</span>Крош ждёт!<div class="sub">ПРОБЕЛ — прыжок &nbsp;|&nbsp; ↓ — пригнуться</div>';
                overlayMessage.classList.add('visible');
            } else {
                overlayMessage.classList.remove('visible');
            }
        }

        function showVictoryMessage() {
            overlayMessage.innerHTML = '<span class="emoji">🏡🎉</span>Ты победил!<div class="sub">Счёт: ' + score + ' &nbsp;|&nbsp; Нажми ПРОБЕЛ, чтобы сыграть ещё</div>';
            overlayMessage.classList.add('visible');
            victoryPhase = 2;
        }

        function spawnObstacle() {
            const rand = Math.random();
            let type;
            if (obstacles.length > 0) {
                const lastType = obstacles[obstacles.length-1].type;
                if (lastType === OBSTACLE_TYPES.BENCH && rand < 0.55) type = OBSTACLE_TYPES.CARROT;
                else if (lastType === OBSTACLE_TYPES.CARROT && rand < 0.5) type = OBSTACLE_TYPES.BENCH;
                else type = rand < 0.5 ? OBSTACLE_TYPES.BENCH : OBSTACLE_TYPES.CARROT;
            } else {
                type = rand < 0.55 ? OBSTACLE_TYPES.BENCH : OBSTACLE_TYPES.CARROT;
            }

            if (type === OBSTACLE_TYPES.BENCH) {
                obstacles.push({
                    type: OBSTACLE_TYPES.BENCH,
                    x: W + 40,
                    y: GROUND_Y - 22,
                    width: 44,
                    height: 28,
                    passed: false,
                });
            } else {
                const carrotY = 210 + Math.random() * 30;
                obstacles.push({
                    type: OBSTACLE_TYPES.CARROT,
                    x: W + 50,
                    y: carrotY,
                    width: 32,
                    height: 50,
                    passed: false,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.08,
                });
            }
        }

        function getKroshHitbox() {
            let h = krosh.isDucking ? krosh.duckHeight : krosh.normalHeight;
            let y = krosh.y - h;
            const marginX = 8;
            return {
                x: krosh.x + marginX,
                y: y,
                w: krosh.width - marginX * 2,
                h: h,
            };
        }

        function checkCollision(kroshBox, obs) {
            const obsBox = { x: obs.x, y: obs.y, w: obs.width, h: obs.height };
            const shrink = 6;
            obsBox.x += shrink;
            obsBox.y += shrink;
            obsBox.w -= shrink * 2;
            obsBox.h -= shrink * 2;
            return (
                kroshBox.x < obsBox.x + obsBox.w &&
                kroshBox.x + kroshBox.w > obsBox.x &&
                kroshBox.y < obsBox.y + obsBox.h &&
                kroshBox.y + kroshBox.h > obsBox.y
            );
        }

        function update() {
            if (gameState === 'waiting') {
                krosh.earWiggle = Math.sin(frameCount * 0.08) * 0.4;
                krosh.blinkTimer++;
                if (krosh.blinkTimer > 70 && Math.random() < 0.03) { krosh.isBlinking = true; krosh.blinkTimer = 0; }
                if (krosh.isBlinking && krosh.blinkTimer > 6) { krosh.isBlinking = false; krosh.blinkTimer = 0; }
                krosh.y = GROUND_Y + Math.sin(frameCount * 0.05) * 2;
                frameCount++;
                return;
            }

            if (gameState === 'victory') {
                // Анимация движения к домику
                frameCount++;
                if (victoryPhase === 0) {
                    // Крош идёт вправо
                    krosh.x += VICTORY_WALK_SPEED;
                    krosh.y = GROUND_Y; // на земле
                    krosh.isDucking = false;
                    krosh.isJumping = false;
                    krosh.earWiggle = Math.sin(frameCount * 0.2) * 0.5;
                    // лёгкий подпрыгивающий шаг
                    krosh.y = GROUND_Y + Math.sin(frameCount * 0.3) * 2;
                    // когда дошли до дома
                    if (krosh.x + krosh.width/2 >= HOUSE_X - 15) {
                        krosh.x = HOUSE_X - 15 - krosh.width/2;
                        victoryPhase = 1;
                        victoryTimer = 0;
                        krosh.y = GROUND_Y;
                    }
                } else if (victoryPhase === 1) {
                    // Стоим у домика, небольшая пауза
                    victoryTimer++;
                    krosh.earWiggle = Math.sin(frameCount * 0.1) * 0.3;
                    if (victoryTimer > 90) {
                        showVictoryMessage();
                    }
                }
                // Обновление частиц (если есть) и трейла
                for (let i = krosh.trailParticles.length-1; i >= 0; i--) {
                    const p = krosh.trailParticles[i];
                    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
                    if (p.life <= 0) krosh.trailParticles.splice(i,1);
                }
                return;
            }

            // Игровое состояние 'playing'
            frameCount++;
            score++;
            scoreDisplay.textContent = score;
            if (score % 25 === 0 && score > 0) sfxScore();

            // Проверка на победу
            if (score >= WIN_SCORE) {
                triggerVictory();
                return;
            }

            if (gameSpeed < maxSpeed) gameSpeed += speedIncrement;
            if (spawnInterval > minSpawnInterval) spawnInterval -= spawnIntervalDecrease;

            if (krosh.isJumping) {
                krosh.vy += krosh.gravity;
                krosh.y += krosh.vy;
                if (krosh.y >= GROUND_Y) { krosh.y = GROUND_Y; krosh.vy = 0; krosh.isJumping = false; }
            }

            if (keys.arrowDown && !krosh.isJumping) krosh.isDucking = true;
            else if (!keys.arrowDown || krosh.isJumping) krosh.isDucking = false;

            if (krosh.isJumping) krosh.earWiggle = Math.sin(frameCount * 0.5) * 0.7;
            else if (krosh.isDucking) krosh.earWiggle = -0.9;
            else krosh.earWiggle = Math.sin(frameCount * 0.06) * 0.3;

            krosh.blinkTimer++;
            if (!krosh.isBlinking && krosh.blinkTimer > 55 && Math.random() < 0.025) { krosh.isBlinking = true; krosh.blinkTimer = 0; }
            if (krosh.isBlinking && krosh.blinkTimer > 5) { krosh.isBlinking = false; krosh.blinkTimer = 0; }

            if (frameCount % 2 === 0 && !krosh.isDucking) {
                krosh.trailParticles.push({
                    x: krosh.x - 5, y: krosh.y - 15 + Math.random() * 10,
                    vx: -1.5 - Math.random() * 2, vy: (Math.random() - 0.5) * 1,
                    life: 1, decay: 0.06 + Math.random() * 0.06, size: 2 + Math.random() * 4,
                });
            }
            for (let i = krosh.trailParticles.length-1; i >= 0; i--) {
                const p = krosh.trailParticles[i];
                p.x += p.vx; p.y += p.vy; p.life -= p.decay;
                if (p.life <= 0) krosh.trailParticles.splice(i,1);
            }
            if (krosh.trailParticles.length > 25) krosh.trailParticles.shift();

            for (let i = obstacles.length-1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= gameSpeed;
                if (obs.type === OBSTACLE_TYPES.CARROT) obs.rotation += obs.rotSpeed;
                if (obs.x < -80) { obstacles.splice(i,1); continue; }
                if (!obs.passed && obs.x + obs.width < krosh.x) obs.passed = true;
            }

            spawnTimer--;
            if (spawnTimer <= 0) {
                spawnObstacle();
                spawnTimer = Math.floor(spawnInterval + Math.random() * 25);
                if (Math.random() < 0.2 && gameSpeed > 6) {
                    setTimeout(() => { if (gameState === 'playing') spawnObstacle(); }, 200 + Math.random() * 300);
                }
            }

            const kroshBox = getKroshHitbox();
            for (const obs of obstacles) {
                if (checkCollision(kroshBox, obs)) { gameOver(); return; }
            }

            for (let i = particles.length-1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= p.decay;
                if (p.life <= 0) particles.splice(i,1);
            }
            if (screenShake > 0) screenShake *= 0.85;
            if (screenShake < 0.2) screenShake = 0;
        }

        function drawSky() {
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#b8e0f7'); grad.addColorStop(0.4, '#d4eefc'); grad.addColorStop(0.75, '#e8f4fd'); grad.addColorStop(1, '#c8e6c9');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            drawCloud(80, 55, 1); drawCloud(280, 35, 0.8); drawCloud(520, 70, 1.1); drawCloud(680, 40, 0.9); drawCloud(400, 95, 0.6);
            const sunX = 700, sunY = 70;
            const sunGrad = ctx.createRadialGradient(sunX, sunY, 15, sunX, sunY, 55);
            sunGrad.addColorStop(0, 'rgba(255,255,200,1)'); sunGrad.addColorStop(0.4, 'rgba(255,240,180,0.8)'); sunGrad.addColorStop(1, 'rgba(255,200,100,0)');
            ctx.fillStyle = sunGrad;
            ctx.beginPath(); ctx.arc(sunX, sunY, 55, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fffde8';
            ctx.beginPath(); ctx.arc(sunX, sunY, 28, 0, Math.PI*2); ctx.fill();
        }

        function drawCloud(x, y, scale) {
            ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
            ctx.beginPath();
            ctx.arc(0,0,20,0,Math.PI*2); ctx.arc(22,-8,16,0,Math.PI*2); ctx.arc(40,2,18,0,Math.PI*2); ctx.arc(18,8,14,0,Math.PI*2); ctx.arc(-10,5,12,0,Math.PI*2);
            ctx.fill(); ctx.restore();
        }

        function drawGround() {
            const grassGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
            grassGrad.addColorStop(0, '#7ec850'); grassGrad.addColorStop(0.15, '#6ab840'); grassGrad.addColorStop(0.5, '#5a9e35'); grassGrad.addColorStop(1, '#3d6e22');
            ctx.fillStyle = grassGrad;
            ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            ctx.strokeStyle = '#5a9e35'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();
            ctx.strokeStyle = '#8dd865'; ctx.lineWidth = 1.5;
            for (let i = 0; i < W; i += 18) {
                const h = 6 + Math.sin(i * 0.3 + frameCount * 0.02) * 5;
                ctx.beginPath(); ctx.moveTo(i, GROUND_Y); ctx.quadraticCurveTo(i+4, GROUND_Y-h, i+8, GROUND_Y-1); ctx.stroke();
            }
        }

        function drawHouse() {
            if (gameState !== 'victory' && score < WIN_SCORE) return;
            const hx = HOUSE_X;
            const hy = HOUSE_Y;
            // Тень
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath(); ctx.ellipse(hx+45, GROUND_Y-2, 55, 8, 0, 0, Math.PI*2); ctx.fill();
            // Стены
            ctx.fillStyle = '#f5e6d3';
            ctx.fillRect(hx, hy+30, 90, GROUND_Y - hy - 30);
            ctx.strokeStyle = '#8b7355';
            ctx.lineWidth = 3;
            ctx.strokeRect(hx, hy+30, 90, GROUND_Y - hy - 30);
            // Крыша
            ctx.fillStyle = '#c0392b';
            ctx.beginPath();
            ctx.moveTo(hx-15, hy+30);
            ctx.lineTo(hx+45, hy-10);
            ctx.lineTo(hx+105, hy+30);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#7b2c26';
            ctx.lineWidth = 3;
            ctx.stroke();
            // Окно
            ctx.fillStyle = '#fdf5e6';
            ctx.fillRect(hx+15, hy+50, 25, 25);
            ctx.strokeStyle = '#5a4a3a';
            ctx.lineWidth = 2;
            ctx.strokeRect(hx+15, hy+50, 25, 25);
            ctx.beginPath();
            ctx.moveTo(hx+27.5, hy+50); ctx.lineTo(hx+27.5, hy+75);
            ctx.moveTo(hx+15, hy+62.5); ctx.lineTo(hx+40, hy+62.5);
            ctx.stroke();
            // Дверь
            ctx.fillStyle = '#a0522d';
            ctx.fillRect(hx+55, hy+70, 22, GROUND_Y - hy - 70);
            ctx.strokeStyle = '#5a3a1e';
            ctx.lineWidth = 2;
            ctx.strokeRect(hx+55, hy+70, 22, GROUND_Y - hy - 70);
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath(); ctx.arc(hx+72, hy+82, 3, 0, Math.PI*2); ctx.fill();
        }

        function drawKrosh() {
            ctx.save();
            const shakeX = (screenShake && gameState !== 'victory') ? (Math.random()-0.5)*screenShake : 0;
            const shakeY = (screenShake && gameState !== 'victory') ? (Math.random()-0.5)*screenShake : 0;
            ctx.translate(shakeX, shakeY);
            const kx = krosh.x;
            const ky = krosh.isDucking ? krosh.y - krosh.duckHeight : krosh.y - krosh.normalHeight;
            const kh = krosh.isDucking ? krosh.duckHeight : krosh.normalHeight;
            const kw = krosh.width;
            const centerX = kx + kw/2, centerY = ky + kh/2;

            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath(); ctx.ellipse(kx+kw/2, krosh.y-2, kw/2+2, 6, 0, 0, Math.PI*2); ctx.fill();

            const bodyGrad = ctx.createRadialGradient(centerX-4, centerY-6, kh*0.1, centerX, centerY, kh*0.65);
            bodyGrad.addColorStop(0, '#a8dff5'); bodyGrad.addColorStop(0.5, '#5db8e8'); bodyGrad.addColorStop(1, '#3a9dd4');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            if (krosh.isDucking) ctx.ellipse(centerX, centerY+2, kw/2, kh/2, 0, 0, Math.PI*2);
            else ctx.ellipse(centerX, centerY, kw/2+1, kh/2, 0, 0, Math.PI*2);
            ctx.fill(); ctx.strokeStyle = '#2b7eb5'; ctx.lineWidth = 2.5; ctx.stroke();

            const bellyGrad = ctx.createRadialGradient(centerX-2, centerY+5, kh*0.05, centerX, centerY+3, kh*0.35);
            bellyGrad.addColorStop(0, '#eaf7fc'); bellyGrad.addColorStop(1, '#c5e8f5');
            ctx.fillStyle = bellyGrad;
            ctx.beginPath(); ctx.ellipse(centerX, centerY+4, kw*0.32, kh*0.3, 0, 0, Math.PI*2); ctx.fill();

            const earBaseX = centerX, earBaseY = ky + kh*0.2;
            const earLen = krosh.isDucking ? 18 : 38;
            const earSpread = krosh.isDucking ? 8 : 16;
            const wiggle = krosh.earWiggle * (krosh.isDucking ? 0.3 : 1);
            drawEar(earBaseX - earSpread, earBaseY, -0.35 + wiggle, earLen, krosh.isDucking);
            drawEar(earBaseX + earSpread, earBaseY, 0.35 - wiggle*0.7, earLen, krosh.isDucking);

            const eyeY = ky + kh*0.32, eyeOffsetX = kw*0.22, eyeR = 8;
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(centerX-eyeOffsetX, eyeY, eyeR, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(centerX+eyeOffsetX, eyeY, eyeR, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1.8; ctx.stroke();

            if (!krosh.isBlinking) {
                ctx.fillStyle = '#111';
                ctx.beginPath(); ctx.arc(centerX-eyeOffsetX+1, eyeY-1, 4.2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(centerX+eyeOffsetX+1, eyeY-1, 4.2, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(centerX-eyeOffsetX-1, eyeY-3, 2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(centerX+eyeOffsetX-1, eyeY-3, 2, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.strokeStyle = '#111'; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.moveTo(centerX-eyeOffsetX-eyeR+2, eyeY); ctx.lineTo(centerX-eyeOffsetX+eyeR-2, eyeY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(centerX+eyeOffsetX-eyeR+2, eyeY); ctx.lineTo(centerX+eyeOffsetX+eyeR-2, eyeY); ctx.stroke();
                ctx.lineWidth = 1.8;
            }

            const browY = eyeY - eyeR - 4;
            ctx.strokeStyle = '#1a5a80'; ctx.lineWidth = 2.2;
            ctx.beginPath(); ctx.moveTo(centerX-eyeOffsetX-eyeR+1, browY); ctx.quadraticCurveTo(centerX-eyeOffsetX, browY-5, centerX-eyeOffsetX+eyeR-1, browY+1); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(centerX+eyeOffsetX-eyeR+1, browY+1); ctx.quadraticCurveTo(centerX+eyeOffsetX, browY-5, centerX+eyeOffsetX+eyeR-1, browY); ctx.stroke();

            const noseY = eyeY + 10;
            ctx.fillStyle = '#f9a8c8';
            ctx.beginPath(); ctx.arc(centerX, noseY, 5.5, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#d47090'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(centerX-1.5, noseY-2, 1.8, 0, Math.PI*2); ctx.fill();

            ctx.strokeStyle = '#3a6075'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(centerX, noseY+3, 8, 0.15, Math.PI-0.15); ctx.stroke();
            ctx.beginPath(); ctx.arc(centerX, noseY+5, 7, 0.2, Math.PI-0.2); ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.roundRect(centerX-3, noseY+7, 3, 4, 1); ctx.fill();
            ctx.beginPath(); ctx.roundRect(centerX+1, noseY+7, 3, 4, 1); ctx.fill();
            ctx.strokeStyle = '#3a6075'; ctx.lineWidth = 1; ctx.stroke();

            const pawY = ky + kh*0.75;
            drawPaw(centerX - kw*0.35, pawY, 0.8);
            drawPaw(centerX + kw*0.35, pawY, 0.8);

            ctx.fillStyle = '#a8dff5'; ctx.strokeStyle = '#2b7eb5'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(kx+kw-2, ky+kh*0.55, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#c5e8f5'; ctx.beginPath(); ctx.arc(kx+kw+1, ky+kh*0.5, 4, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        function drawEar(baseX, baseY, angle, length, isDucking) {
            ctx.save(); ctx.translate(baseX, baseY); ctx.rotate(angle);
            const width = isDucking ? 7 : 10;
            const earGrad = ctx.createLinearGradient(0, 0, 0, -length);
            earGrad.addColorStop(0, '#5db8e8'); earGrad.addColorStop(0.5, '#7cc8f0'); earGrad.addColorStop(1, '#a0d8f5');
            ctx.fillStyle = earGrad; ctx.strokeStyle = '#2b7eb5'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-width, 0); ctx.quadraticCurveTo(-width, -length*0.6, 0, -length); ctx.quadraticCurveTo(width, -length*0.6, width, 0);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#d4a8c8'; ctx.strokeStyle = 'transparent';
            ctx.beginPath();
            ctx.moveTo(-width*0.45, -2); ctx.quadraticCurveTo(-width*0.4, -length*0.5, 0, -length*0.85); ctx.quadraticCurveTo(width*0.4, -length*0.5, width*0.45, -2);
            ctx.closePath(); ctx.fill();
            ctx.restore();
        }

        function drawPaw(x, y, scale) {
            ctx.fillStyle = '#5db8e8'; ctx.strokeStyle = '#2b7eb5'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.ellipse(x, y, 8*scale, 6*scale, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#a8dff5'; ctx.strokeStyle = 'transparent';
            for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(x + i*3*scale, y-2*scale, 2.5*scale, 0, Math.PI*2); ctx.fill(); }
        }

        function drawBench(obs) {
            ctx.save();
            const bx = obs.x, by = obs.y, bw = obs.width, bh = obs.height;
            ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(bx+2, by+bh-2, bw, 5);
            ctx.fillStyle = '#8B5E3C'; ctx.fillRect(bx+4, by+bh*0.45, 7, bh*0.55); ctx.fillRect(bx+bw-11, by+bh*0.45, 7, bh*0.55);
            ctx.strokeStyle = '#5c3a1e'; ctx.lineWidth = 1.5; ctx.strokeRect(bx+4, by+bh*0.45, 7, bh*0.55); ctx.strokeRect(bx+bw-11, by+bh*0.45, 7, bh*0.55);
            const seatGrad = ctx.createLinearGradient(0, by, 0, by+bh*0.4);
            seatGrad.addColorStop(0, '#d4a86a'); seatGrad.addColorStop(0.5, '#c99550'); seatGrad.addColorStop(1, '#a6753a');
            ctx.fillStyle = seatGrad; ctx.fillRect(bx, by, bw, bh*0.45);
            ctx.strokeStyle = '#5c3a1e'; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, bh*0.45);
            ctx.fillStyle = '#c99550'; ctx.fillRect(bx+2, by-bh*0.25, bw-4, bh*0.3);
            ctx.strokeStyle = '#5c3a1e'; ctx.lineWidth = 1.5; ctx.strokeRect(bx+2, by-bh*0.25, bw-4, bh*0.3);
            ctx.fillStyle = '#a6753a';
            for (let i = 0; i < 3; i++) ctx.fillRect(bx+6 + i*(bw-16)/2, by-bh*0.2, 4, bh*0.22);
            ctx.restore();
        }

        function drawCarrot(obs) {
            ctx.save();
            const cx = obs.x + obs.width/2, cy = obs.y + obs.height/2;
            ctx.translate(cx, cy); ctx.rotate(obs.rotation);
            const w = obs.width, h = obs.height;
            ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(3, h*0.35, w*0.4, h*0.12, 0.1, 0, Math.PI*2); ctx.fill();
            const carrotGrad = ctx.createLinearGradient(0, -h/2, 0, h/2);
            carrotGrad.addColorStop(0, '#ff8c42'); carrotGrad.addColorStop(0.4, '#f06a2a'); carrotGrad.addColorStop(1, '#d94a10');
            ctx.fillStyle = carrotGrad;
            ctx.beginPath();
            ctx.moveTo(0, -h/2); ctx.quadraticCurveTo(w/2, -h*0.2, w/2, h*0.2); ctx.quadraticCurveTo(w/2+2, h*0.35, 0, h/2);
            ctx.quadraticCurveTo(-w/2-2, h*0.35, -w/2, h*0.2); ctx.quadraticCurveTo(-w/2, -h*0.2, 0, -h/2);
            ctx.fill(); ctx.strokeStyle = '#b33a08'; ctx.lineWidth = 2; ctx.stroke();
            ctx.strokeStyle = 'rgba(255,200,150,0.4)'; ctx.lineWidth = 1.5;
            for (let sy = -h*0.2; sy < h*0.3; sy += h*0.14) {
                ctx.beginPath(); ctx.moveTo(-w*0.35, sy); ctx.quadraticCurveTo(0, sy+3, w*0.35, sy); ctx.stroke();
            }
            const leafColors = ['#5cb840', '#4a9e30', '#6cc850', '#3d8a28'];
            for (let i = 0; i < 4; i++) {
                const lx = (i-1.5)*6, ly = -h/2-4, leafLen = 14 + Math.sin(i*1.8)*6;
                ctx.fillStyle = leafColors[i]; ctx.strokeStyle = '#2d6b1a'; ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(lx-1, ly); ctx.quadraticCurveTo(lx-6, ly-leafLen*0.7, lx+2, ly-leafLen);
                ctx.quadraticCurveTo(lx+8, ly-leafLen*0.5, lx+3, ly+2); ctx.closePath(); ctx.fill(); ctx.stroke();
            }
            ctx.restore();
        }

        function drawParticles() {
            for (const p of particles) {
                ctx.fillStyle = `rgba(${p.color === '#4da6e8' ? '77,166,232' : '109,197,245'},${p.life})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill();
            }
            for (const p of krosh.trailParticles) {
                ctx.fillStyle = `rgba(200,230,250,${p.life*0.5})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            }
        }

        function drawUI() {
            if (gameState === 'playing') {
                const speedPercent = (gameSpeed - 4.5) / (maxSpeed - 4.5);
                const barX = W - 80, barY = 15, barW = 60, barH = 8;
                ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, 4); ctx.fill();
                const speedGrad = ctx.createLinearGradient(barX, 0, barX+barW, 0);
                speedGrad.addColorStop(0, '#4caf50'); speedGrad.addColorStop(0.6, '#ff9800'); speedGrad.addColorStop(1, '#f44336');
                ctx.fillStyle = speedGrad; ctx.beginPath(); ctx.roundRect(barX, barY, barW * speedPercent, barH, 4); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 9px "Segoe UI", Arial, sans-serif'; ctx.textAlign = 'right';
                ctx.fillText('СКОРОСТЬ', barX-6, barY+8);
            }
        }

        function render() {
            ctx.clearRect(0, 0, W, H);
            const sx = (screenShake && gameState !== 'victory') ? (Math.random()-0.5)*screenShake : 0;
            const sy = (screenShake && gameState !== 'victory') ? (Math.random()-0.5)*screenShake : 0;
            ctx.save(); ctx.translate(sx, sy);
            drawSky();
            drawGround();
            drawHouse(); // рисуем домик (появляется только в состоянии победы)
            for (const obs of obstacles) {
                if (obs.type === OBSTACLE_TYPES.BENCH) drawBench(obs);
                else drawCarrot(obs);
            }
            drawParticles();
            drawKrosh();
            ctx.restore();
            drawUI();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function handleKeyDown(e) {
            initAudio();
            if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') {
                e.preventDefault();
                keys.space = true;
                spaceBadge.classList.add('pressed');
                if (gameState === 'waiting') startGame();
                else if (gameState === 'gameover') { resetGame(); startGame(); }
                else if (gameState === 'victory' && victoryPhase === 2) { resetGame(); startGame(); }
                else if (gameState === 'playing' && !krosh.isJumping && !krosh.isDucking) {
                    krosh.vy = krosh.jumpForce; krosh.isJumping = true; krosh.y = GROUND_Y; sfxJump();
                }
            }
            if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                e.preventDefault();
                keys.arrowDown = true;
                downBadge.classList.add('pressed');
                if (gameState === 'playing' && !krosh.isJumping) {
                    if (!krosh.isDucking) sfxDuck();
                    krosh.isDucking = true;
                }
            }
        }

        function handleKeyUp(e) {
            if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') {
                e.preventDefault(); keys.space = false; spaceBadge.classList.remove('pressed');
            }
            if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                e.preventDefault(); keys.arrowDown = false; downBadge.classList.remove('pressed');
                krosh.isDucking = false;
            }
        }

        canvas.addEventListener('click', (e) => {
            e.preventDefault(); initAudio();
            if (gameState === 'waiting') startGame();
            else if (gameState === 'gameover') { resetGame(); startGame(); }
            else if (gameState === 'victory' && victoryPhase === 2) { resetGame(); startGame(); }
            else if (gameState === 'playing' && !krosh.isJumping && !krosh.isDucking) {
                krosh.vy = krosh.jumpForce; krosh.isJumping = true; krosh.y = GROUND_Y; sfxJump();
            }
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault(); initAudio();
            if (gameState === 'playing' && !krosh.isJumping) {
                if (!krosh.isDucking) sfxDuck();
                krosh.isDucking = true; keys.arrowDown = true; downBadge.classList.add('pressed');
                clearTimeout(canvas._duckTimeout);
                canvas._duckTimeout = setTimeout(() => {
                    keys.arrowDown = false; krosh.isDucking = false; downBadge.classList.remove('pressed');
                }, 400);
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); initAudio();
            const touchY = e.touches[0].clientY;
            const canvasRect = canvas.getBoundingClientRect();
            const relativeY = touchY - canvasRect.top;
            const canvasHalf = canvasRect.height / 2;
            if (gameState === 'waiting') startGame();
            else if (gameState === 'gameover') { resetGame(); startGame(); }
            else if (gameState === 'victory' && victoryPhase === 2) { resetGame(); startGame(); }
            else if (gameState === 'playing') {
                if (relativeY < canvasHalf) {
                    if (!krosh.isJumping && !krosh.isDucking) {
                        krosh.vy = krosh.jumpForce; krosh.isJumping = true; krosh.y = GROUND_Y; sfxJump();
                    }
                } else {
                    if (!krosh.isJumping) {
                        if (!krosh.isDucking) sfxDuck();
                        krosh.isDucking = true; keys.arrowDown = true; downBadge.classList.add('pressed');
                    }
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault(); keys.arrowDown = false; krosh.isDucking = false; downBadge.classList.remove('pressed');
        });
        canvas.addEventListener('touchcancel', (e) => {
            keys.arrowDown = false; krosh.isDucking = false; downBadge.classList.remove('pressed');
        });

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'ArrowUp') {
                if (document.activeElement === document.body || document.activeElement === canvas) e.preventDefault();
            }
        });

        updateOverlay(false);
        resetGame();
        gameState = 'waiting';
        updateOverlay(false);
        gameLoop();
    })();
</script>
</body>
</html>
