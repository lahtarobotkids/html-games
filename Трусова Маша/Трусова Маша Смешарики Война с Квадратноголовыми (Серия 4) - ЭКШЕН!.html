            z-index: 10;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 0.5s forwards;
            text-shadow: 1px 1px 2px black;
        }
        #dialogue-box::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 15px solid #FF4444;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        #subtitles {
            position: absolute;
            bottom: 105px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #FFD700;
            font-size: 20px;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 30px;
            letter-spacing: 1px;
            text-align: center;

            border: 2px solid #FFD700;

        }
        #subtitles.show {

            animation: subtitlePulse 0.4s ease-out;
        }

        @keyframes subtitlePulse {
            0% { transform: translateX(-50%) scale(0.9); }

            100% { transform: translateX(-50%) scale(1); }
        }

            position: absolute;

            left: 50%;
            transform: translateX(-50%);

            font-size: 24px;
            font-weight: bold;
            text-shadow: 3px 3px 0 #FFD700, -1px -1px 0 #000, 0 0 20px #FF0000;

            text-align: center;
            letter-spacing: 3px;
            animation: titleGlow 1s infinite alternate;
        }
        @keyframes titleGlow {
            from { text-shadow: 3px 3px 0 #FFD700, 0 0 20px #FF0000; }
            to { text-shadow: 3px 3px 0 #FFD700, 0 0 40px #FF0000, 0 0 60px #FF4444; }
        }

        #sound-indicator {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(255,0,0,0.7);
            color: #FFD700;

            font-size: 12px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
            border: 2px solid #FFD700;

        #sound-indicator.active {
            opacity: 1;
            animation: pulse 0.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        #restart-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #FF4444;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            z-index: 20;

            align-items: center;
            justify-content: center;

        // ==================== ГОЛОСОВЫЕ ПРОФИЛИ ====================
        const voiceProfiles = {
            'КРОШ': { pitch: 1.7, rate: 1.3, voiceName: 'Google русский' },
            'ЛОСЯШ': { pitch: 0.85, rate: 0.9, voiceName: 'Google русский' },
            'ПИН': { pitch: 1.15, rate: 1.0, voiceName: 'Google русский' },
            'КАРЫЧ': { pitch: 0.7, rate: 0.85, voiceName: 'Google русский' },
            'ЁЖИК': { pitch: 1.25, rate: 1.05, voiceName: 'Google русский' },
            'КОПАТЫЧ': { pitch: 0.75, rate: 0.8, voiceName: 'Google русский' },
            'СОВУНЬЯ': { pitch: 1.4, rate: 0.95, voiceName: 'Google русский' },
            'КВАДРАТНЫЙ': { pitch: 0.5, rate: 0.7, voiceName: 'Google русский' },
            'РАССКАЗЧИК': { pitch: 0.95, rate: 0.95, voiceName: 'Google русский' }
        };

        function detectSpeaker(text) {
            if (text.startsWith('КРОШ:')) return 'КРОШ';
            if (text.startsWith('ЛОСЯШ:')) return 'ЛОСЯШ';
            if (text.startsWith('ПИН:')) return 'ПИН';
            if (text.startsWith('КАРЫЧ:')) return 'КАРЫЧ';
            if (text.startsWith('ЁЖИК:')) return 'ЁЖИК';
            if (text.startsWith('КОПАТЫЧ:')) return 'КОПАТЫЧ';
            if (text.startsWith('СОВУНЬЯ:')) return 'СОВУНЬЯ';
            if (text.startsWith('КВАДРАТНЫЙ:')) return 'КВАДРАТНЫЙ';
            return 'РАССКАЗЧИК';
        }

        function getRussianVoice() {
            const voices = speechSynth.getVoices();
            let ruVoice = voices.find(v => v.lang.startsWith('ru') && v.name.includes('Google'));
            if (!ruVoice) ruVoice = voices.find(v => v.lang.startsWith('ru'));
            return ruVoice || voices[0];
        }

        function speakText(text) {
            if (speechSynth.speaking) speechSynth.cancel();
            const speaker = detectSpeaker(text);
            const profile = voiceProfiles[speaker];
            let cleanText = text;
            if (text.includes(':')) cleanText = text.split(':')[1].trim();
            cleanText = cleanText.replace(/"/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'ru-RU';
            utterance.pitch = profile.pitch;
            utterance.rate = profile.rate;
            const voice = getRussianVoice();
            if (voice) utterance.voice = voice;
            subtitles.textContent = cleanText;
            subtitles.classList.add('show');
            soundIndicator.classList.add('active');
            isSpeaking = true;
            utterance.onend = () => {
                subtitles.classList.remove('show');
                soundIndicator.classList.remove('active');
                isSpeaking = false;
                currentUtterance = null;
            };
            utterance.onerror = () => {
                subtitles.classList.remove('show');
                soundIndicator.classList.remove('active');
                isSpeaking = false;
                currentUtterance = null;
            };
            currentUtterance = utterance;
            speechSynth.speak(utterance);
        }

        function stopSpeech() {
            if (speechSynth.speaking) speechSynth.cancel();
            subtitles.classList.remove('show');
            soundIndicator.classList.remove('active');
            isSpeaking = false;
        }

        // ==================== РИСОВАНИЕ ПЕРСОНАЖЕЙ ====================
        function drawKrosh(x, y, scale = 1, expression = 'normal') {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.beginPath();
            ctx.arc(0, 0, 35, 0, Math.PI * 2);
            ctx.fillStyle = '#4FC3F7';
            ctx.fill();
            ctx.strokeStyle = '#0288D1';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#4FC3F7';
            ctx.strokeStyle = '#0288D1';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.ellipse(-15, -40, 8, 22, -0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(15, -40, 8, 22, 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(-12, -5, 10, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.arc(12, -5, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#333';
            ctx.beginPath(); ctx.arc(-9, -3, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(15, -3, 5, 0, Math.PI * 2); ctx.fill();
            if (expression === 'angry') {
                ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(-20, -18); ctx.lineTo(-4, -12); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(20, -18); ctx.lineTo(4, -12); ctx.stroke();
                ctx.fillStyle = '#C62828';
                ctx.beginPath(); ctx.arc(0, 8, 8, Math.PI, 0); ctx.fill();
            } else if (expression === 'excited') {
                ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(-20, -18); ctx.lineTo(-6, -10); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(20, -18); ctx.lineTo(6, -10); ctx.stroke();
                ctx.fillStyle = '#E57373';
                ctx.beginPath(); ctx.arc(0, 8, 10, 0, Math.PI); ctx.fill();
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.rect(-4, 4, 3, 5); ctx.fill();
                ctx.beginPath(); ctx.rect(1, 4, 3, 5); ctx.fill();
            } else {
                ctx.fillStyle = '#E57373';
                ctx.beginPath(); ctx.arc(0, 5, 6, 0, Math.PI); ctx.fill();
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.rect(-4, 4, 3, 5); ctx.fill();
                ctx.beginPath(); ctx.rect(1, 4, 3, 5); ctx.fill();
            }
            ctx.fillStyle = '#FF8A80';
            ctx.beginPath(); ctx.arc(0, -8, 5, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawYojik(x, y, scale = 1, crying = false) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.beginPath(); ctx.arc(0, 0, 33, 0, Math.PI * 2);
            ctx.fillStyle = '#E57373'; ctx.fill();
            ctx.strokeStyle = '#B71C1C'; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = '#5D4037';
            for (let i = -3; i <= 3; i++) {
                ctx.beginPath(); ctx.moveTo(i * 8, -33); ctx.lineTo(i * 8 - 5, -48); ctx.lineTo(i * 8 + 5, -48); ctx.fill();
            }

        // ==================== ФОН ====================
        function drawBackground(timeOfDay, intensity = 0) {
            let skyGradient;
            if (timeOfDay === 'day') {
                skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
                skyGradient.addColorStop(0, '#64B5F6');
                skyGradient.addColorStop(1, '#BBDEFB');
            } else if (timeOfDay === 'evening') {
                skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
                skyGradient.addColorStop(0, '#FF6F00');
                skyGradient.addColorStop(0.5, '#FF8F00');
                skyGradient.addColorStop(1, '#FFB74D');
            } else if (timeOfDay === 'sunset') {
                skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
                skyGradient.addColorStop(0, '#E91E63');
                skyGradient.addColorStop(0.5, '#FF6F00');
                skyGradient.addColorStop(1, '#FFD54F');
            }
            // Добавляем красный оттенок битвы
            if (intensity > 5) {
                ctx.fillStyle = `rgba(255, 0, 0, ${(intensity - 5) * 0.1})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.6);
            
            ctx.fillStyle = intensity > 5 ? '#5D8A3C' : '#7EC850';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.55);
            ctx.quadraticCurveTo(canvas.width * 0.3, canvas.height * 0.4, canvas.width * 0.6, canvas.height * 0.55);
            ctx.quadraticCurveTo(canvas.width * 0.8, canvas.height * 0.5, canvas.width, canvas.height * 0.55);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
            
            ctx.fillStyle = intensity > 5 ? '#3E6B2E' : '#5DAE3B';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.7);
            ctx.quadraticCurveTo(canvas.width * 0.5, canvas.height * 0.65, canvas.width, canvas.height * 0.7);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
            
            if (intensity < 5) {
                drawCloud(canvas.width * 0.2, canvas.height * 0.15);
                drawCloud(canvas.width * 0.55, canvas.height * 0.1);
            } else {
                // Дым битвы
                ctx.fillStyle = 'rgba(100, 100, 100, 0.5)';
                ctx.beginPath();
                ctx.arc(canvas.width * 0.3, canvas.height * 0.2, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(canvas.width * 0.6, canvas.height * 0.15, 35, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawCloud(x, y) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.arc(x + 20, y - 5, 18, 0, Math.PI * 2);
            ctx.arc(x + 15, y + 5, 15, 0, Math.PI * 2);
            ctx.arc(x - 15, y, 16, 0, Math.PI * 2);
            ctx.fill();
        }

        // ==================== ЭФФЕКТЫ ====================
        function spawnExplosion(x, y, size = 20) {
            explosions.push({ x, y, life: 1, size, maxSize: size + 15 });
            screenShake = Math.max(screenShake, 8);
        }

        function spawnLaser(x, y, tx, ty) {
            lasers.push({ x, y, tx, ty, life: 1 });
        }

        function updateEffects() {
            for (let i = explosions.length - 1; i >= 0; i--) {
                explosions[i].life -= 0.03;
                if (explosions[i].life <= 0) explosions.splice(i, 1);
            }
            for (let i = lasers.length - 1; i >= 0; i--) {
                lasers[i].life -= 0.05;
                if (lasers[i].life <= 0) lasers.splice(i, 1);
            }
            if (screenShake > 0) screenShake *= 0.85;
        }

        function drawEffects() {
            for (const exp of explosions) {
                const r = exp.maxSize * (1 - exp.life);
                const gradient = ctx.createRadialGradient(exp.x, exp.y, 0, exp.x, exp.y, r);
                gradient.addColorStop(0, 'rgba(255, 255, 0, ' + exp.life + ')');
                gradient.addColorStop(0.5, 'rgba(255, 100, 0, ' + (exp.life * 0.7) + ')');
                gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(exp.x, exp.y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            for (const laser of lasers) {
                ctx.strokeStyle = `rgba(255, 0, 0, ${laser.life})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(laser.x, laser.y);
                ctx.lineTo(laser.tx, laser.ty);
                ctx.stroke();
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(laser.tx, laser.ty, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ==================== ОТРИСОВКА СЦЕНЫ ====================
        function drawScene(sceneIndex) {
            const scene = scenes[sceneIndex];
            const W = canvas.width;
            const H = canvas.height;
            
            battleIntensity += (scene.intensity - battleIntensity) * 0.3;
            
            ctx.save();
            if (screenShake > 0.5) {
                const sx = (Math.random() - 0.5) * screenShake;
                const sy = (Math.random() - 0.5) * screenShake;
                ctx.translate(sx, sy);
            }
            
            ctx.clearRect(-20, -20, W + 40, H + 40);
            drawBackground(scene.time, battleIntensity);
            
            if (scene.id === 'intro') {
                drawSquareEnemy(W * 0.7, H * 0.5, 0.8);
            } else if (scene.id === 'square_arrive') {
                drawSquareEnemy(W * 0.3, H * 0.5, 1.0);
                drawSquareEnemy(W * 0.55, H * 0.52, 0.9);
                drawSquareEnemy(W * 0.75, H * 0.48, 0.85);
            } else if (scene.id === 'krosh_robbed') {
                drawKrosh(W * 0.3, H * 0.55, 1.4, 'angry');
                drawSquareEnemy(W * 0.65, H * 0.5, 0.9);
                // Мешок с морковкой
                ctx.fillStyle = '#8D6E63';
                ctx.fillRect(W * 0.72, H * 0.4, 20, 15);
                ctx.fillStyle = '#FF6F00';
                ctx.beginPath(); ctx.moveTo(W * 0.72, H * 0.38); ctx.lineTo(W * 0.78, H * 0.32); ctx.lineTo(W * 0.82, H * 0.38); ctx.fill();
            } else if (scene.id === 'yojik_cries') {
                drawYojik(W * 0.35, H * 0.55, 1.4, true);
                drawSquareEnemy(W * 0.65, H * 0.5, 0.9);
                // Разбросанные коллекции
                ctx.fillStyle = '#FFD700'; ctx.fillRect(W * 0.55, H * 0.6, 8, 6);
                ctx.fillStyle = '#FF5722'; ctx.fillRect(W * 0.6, H * 0.58, 6, 8);
                ctx.fillStyle = '#4CAF50'; ctx.fillRect(W * 0.5, H * 0.57, 7, 7);
            } else if (scene.id === 'krosh_to_hedgehog') {
                drawKrosh(W * 0.25, H * 0.55, 1.3, 'angry');
                drawYojik(W * 0.55, H * 0.57, 1.2, true);
            } else if (scene.id === 'call_arms') {
                drawKrosh(W * 0.35, H * 0.55, 1.5, 'excited');
                drawYojik(W * 0.6, H * 0.58, 1.2);
                spawnExplosion(W * 0.7, H * 0.4, 10);
            } else if (scene.id === 'battle_begins') {
                drawKopatych(W * 0.15, H * 0.52, 1.2, true);
                drawPin(W * 0.4, H * 0.55, 1.2, true);
                drawSovunya(W * 0.65, H * 0.55, 1.2, true);
                drawKarich(W * 0.85, H * 0.5, 1.1);
                drawSquareEnemy(W * 0.5, H * 0.5, 0.8);
                drawSquareEnemy(W * 0.75, H * 0.48, 0.75, true);
                if (Math.random() < 0.3) spawnExplosion(W * 0.55, H * 0.45, 15);
                if (Math.random() < 0.2) spawnLaser(W * 0.42, H * 0.5, W * 0.5, H * 0.45);
            } else if (scene.id === 'pin_laser') {
                drawPin(W * 0.35, H * 0.55, 1.4, true);
                drawSquareEnemy(W * 0.7, H * 0.5, 0.8, true);
                if (Math.random() < 0.5) {
                    spawnLaser(W * 0.4, H * 0.5, W * 0.68, H * 0.45);
                    spawnExplosion(W * 0.68, H * 0.45, 12);
                }
            } else if (scene.id === 'kopatych_fight') {
                drawKopatych(W * 0.3, H * 0.52, 1.4, true);
                drawSquareEnemy(W * 0.65, H * 0.5, 0.9, true);
                if (Math.random() < 0.3) spawnExplosion(W * 0.6, H * 0.45, 18);
            } else if (scene.id === 'sovunya_fight') {
                drawSovunya(W * 0.35, H * 0.55, 1.4, true);
                drawSquareEnemy(W * 0.7, H * 0.5, 0.85, true);

            } else if (scene.id === 'karich_fight') {
                drawKarich(W * 0.35, H * 0.52, 1.4);
                drawSquareEnemy(W * 0.7, H * 0.5, 0.8, true);
            } else if (scene.id === 'losyash_fight') {
                drawLosyash(W * 0.3, H * 0.55, 1.3);
                drawSquareEnemy(W * 0.7, H * 0.5, 0.85, true);
                if (Math.random() < 0.3) spawnExplosion(W * 0.7, H * 0.45, 14);
            } else if (scene.id === 'square_retreat') {
                drawSquareEnemy(W * 0.4, H * 0.5, 0.9, true);
                drawSquareEnemy(W * 0.65, H * 0.48, 0.8, true);
                drawSquareEnemy(W * 0.8, H * 0.52, 0.7, true);
                spawnExplosion(W * 0.5, H * 0.4, 25);
                spawnExplosion(W * 0.7, H * 0.35, 20);
            } else if (scene.id === 'victory') {
                drawKrosh(W * 0.25, H * 0.55, 1.5, 'excited');
                drawYojik(W * 0.5, H * 0.57, 1.3);
                drawKopatych(W * 0.15, H * 0.52, 1.0);
                drawPin(W * 0.4, H * 0.53, 1.0);
                drawSovunya(W * 0.65, H * 0.55, 1.0);
                drawKarich(W * 0.8, H * 0.5, 1.0);
                spawnExplosion(W * 0.35, H * 0.35, 8);
                spawnExplosion(W * 0.55, H * 0.3, 6);
                // Фейерверки
                ctx.fillStyle = '#FFD700'; ctx.font = '20px Arial';
                ctx.fillText('🎉', W * 0.3, H * 0.25);
                ctx.fillText('🎉', W * 0.5, H * 0.2);
                ctx.fillText('🎉', W * 0.7, H * 0.28);
            } else if (scene.id === 'yojik_happy') {
                drawYojik(W * 0.45, H * 0.57, 1.4);
                drawKrosh(W * 0.2, H * 0.55, 1.2, 'excited');
                // Фантики
                ctx.fillStyle = '#FFD700'; ctx.fillRect(W * 0.5, H * 0.5, 10, 8);
                ctx.fillStyle = '#FF5722'; ctx.fillRect(W * 0.55, H * 0.48, 8, 10);
                ctx.fillStyle = '#4FC3F7'; ctx.fillRect(W * 0.48, H * 0.47, 9, 7);
            } else if (scene.id === 'final') {
                drawKrosh(W * 0.2, H * 0.55, 1.2, 'excited');
                drawYojik(W * 0.4, H * 0.57, 1.2);
                drawKopatych(W * 0.6, H * 0.52, 1.1);
                drawPin(W * 0.75, H * 0.53, 1.0);
                drawSovunya(W * 0.85, H * 0.55, 1.0);
                ctx.fillStyle = '#FFD700'; ctx.font = '16px Arial';
                ctx.fillText('❤️', W * 0.3, H * 0.35);
                ctx.fillText('❤️', W * 0.5, H * 0.3);
                ctx.fillText('❤️', W * 0.7, H * 0.33);
            }
            
            updateEffects();
            drawEffects();
            ctx.restore();
        }

        // ==================== АНИМАЦИЯ ====================
        function animate() {
            time += 0.02;
            drawScene(currentScene);
            animationFrame = requestAnimationFrame(animate);
        }

        // ==================== НАВИГАЦИЯ ====================
        function nextScene() {
            if (isSpeaking) stopSpeech();
            if (currentScene < scenes.length - 1) {
                currentScene++;
                const scene = scenes[currentScene];
                dialogueBox.textContent = scene.text;
                dialogueBox.style.animation = 'none';
                dialogueBox.offsetHeight;
                dialogueBox.style.animation = 'fadeInUp 0.5s forwards';
                explosions = [];
                lasers = [];
                if (scene.voiceText) {
                    setTimeout(() => speakText(scene.voiceText), 300);
                }
                // Звуки битвы
                if (scene.intensity > 5) {
                    soundIndicator.textContent = '💥 ПИУ-ПАУ! 💥';
                } else {
                    soundIndicator.textContent = '🔊 Говорит...';
                }
            } else if (currentScene === scenes.length - 1) {
                dialogueBox.textContent = '🎬 КОНЕЦ СЕРИИ. ПОБЕДА ЗА СМЕШАРИКАМИ! ПИУ-ПАУ! 🏆';
                subtitles.textContent = 'ПИУ-ПАУ! ПОБЕДА!';
                subtitles.classList.add('show');
                speakText('Конец серии. Победа за Смешариками! Пиу-пау!');
            }
        }

        function restartAll() {
            stopSpeech();
            currentScene = 0;
            battleIntensity = 0;
            screenShake = 0;
            explosions = [];
            lasers = [];
            dialogueBox.textContent = scenes[0].text;
            dialogueBox.style.animation = 'none';
            dialogueBox.offsetHeight;
            dialogueBox.style.animation = 'fadeInUp 0.5s forwards';
            subtitles.classList.remove('show');
            soundIndicator.classList.remove('active');
            soundIndicator.textContent = '💥 БОЙ! 💥';
            setTimeout(() => speakText(scenes[0].voiceText), 300);
        }

        // ==================== ОБРАБОТЧИКИ ====================
        container.addEventListener('click', (e) => {
            if (e.target === restartBtn) return;
            if (loadingScreen.style.display !== 'none') return;
            nextScene();
        });

        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            restartAll();
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') {
                e.preventDefault();
                nextScene();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                if (currentScene > 0) {
                    stopSpeech();
                    currentScene--;
                    dialogueBox.textContent = scenes[currentScene].text;
                    subtitles.classList.remove('show');
                }
            } else if (e.code === 'KeyR') {
                e.preventDefault();
                restartAll();
            }
        });

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', () => {
            resizeCanvas();
            drawScene(currentScene);
        });

        function init() {
            resizeCanvas();
            if (speechSynth.getVoices().length === 0) {
                speechSynth.addEventListener('voiceschanged', () => {
                    loadingScreen.style.display = 'none';
                    dialogueBox.textContent = scenes[0].text;
                    drawScene(0);
                    animate();
                });
            } else {
                loadingScreen.style.display = 'none';
                dialogueBox.textContent = scenes[0].text;
                drawScene(0);
                animate();
            }
            console.log('⚔️ Смешарики: Война с Квадратноголовыми - Серия 4!');
            console.log('💥 ПИУ-ПАУ! БУМ! БАХ!');
        }

        init();
    </script>
</body>
</html>
