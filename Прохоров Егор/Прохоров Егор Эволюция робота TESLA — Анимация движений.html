<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Эволюция робота TESLA • Анимация движений</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0c14;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
      padding: 20px;
    }
    .cartoon-container {
      max-width: 1000px;
      width: 100%;
      background: rgba(12, 15, 24, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 3.5rem;
      padding: 2rem 2rem 2.2rem;
      box-shadow: 0 30px 55px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(70, 100, 230, 0.15);
    }
    h1 {
      text-align: center;
      color: #eef5ff;
      font-weight: 500;
      letter-spacing: 2px;
      font-size: 2.6rem;
      margin-bottom: 0.3rem;
      text-shadow: 0 0 12px #3f6eff80;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    h1 span {
      background: linear-gradient(135deg, #c0d0ff, #7f9bff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }
    .subtitle {
      text-align: center;
      color: #8892b0;
      margin-bottom: 0.8rem;
      font-size: 1.15rem;
      letter-spacing: 0.4px;
    }
    .auto-indicator {
      text-align: center;
      font-size: 0.9rem;
      color: #6d7ea0;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .auto-indicator .dot {
      width: 10px;
      height: 10px;
      background: #4f9eff;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
      100% { opacity: 0.5; transform: scale(0.9); }
    }
    canvas {
      display: block;
      margin: 0 auto;
      width: 100%;
      height: auto;
      background: #0b0e17;
      border-radius: 2.8rem;
      box-shadow: inset 0 0 45px rgba(0, 0, 0, 0.8), 0 18px 35px rgba(0, 15, 40, 0.9);
      border: 1px solid rgba(74, 110, 255, 0.15);
    }
    .timeline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.8rem;
      padding: 0 10px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .stage-btn {
      background: #1e2640;
      border: none;
      color: #b9c8ff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.1rem;
      border-radius: 3rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      background: rgba(30, 38, 64, 0.8);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
      transition: all 0.25s ease;
      border: 1px solid rgba(100, 140, 255, 0.25);
      flex: 1;
      min-width: 80px;
      text-align: center;
    }
    .stage-btn:hover {
      background: #2f3b66;
      color: #ffffff;
      border-color: #6c8aff;
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(0, 80, 255, 0.25);
    }
    .stage-btn.active {
      background: linear-gradient(135deg, #2f4bff, #1e36b0);
      color: white;
      border-color: #aac0ff;
      box-shadow: 0 0 24px #2f4bffaa;
      font-weight: 700;
      transform: scale(1.02);
    }
    .info-panel {
      margin-top: 1.5rem;
      background: rgba(10, 14, 25, 0.7);
      border-radius: 2rem;
      padding: 1.2rem 1.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      border: 1px solid rgba(70, 100, 230, 0.3);
    }
    .robot-name {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(to right, #c6d9ff, #6588ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    .robot-desc {
      color: #cdd6f0;
      font-size: 1rem;
      max-width: 400px;
    }
    .year-badge {
      background: #0f1424;
      color: #a0b9ff;
      padding: 0.3rem 1.2rem;
      border-radius: 5rem;
      font-weight: 600;
      font-size: 1.2rem;
      border: 1px solid #4d6bff;
    }
    @media (max-width: 650px) {
      .timeline {
        flex-direction: row;
        flex-wrap: wrap;
      }
      .stage-btn {
        font-size: 0.8rem;
        padding: 0.5rem 0.7rem;
      }
    }
  </style>
</head>
<body>
<div class="cartoon-container">
  <h1>
    <span>⚡TESLA</span> ROBOT
  </h1>
  <div class="subtitle">Эволюция Optimus • живые движения в камере</div>
  <div class="auto-indicator">
    <span class="dot"></span> Автосмена каждые 2 сек
  </div>

  <canvas id="robotCanvas" width="700" height="400" aria-label="Робот Tesla в стеклянной камере"></canvas>

  <div class="timeline" id="timeline">
    <button class="stage-btn active" data-stage="0">🤖 2021</button>
    <button class="stage-btn" data-stage="1">🦾 2022</button>
    <button class="stage-btn" data-stage="2">🧠 2023</button>
    <button class="stage-btn" data-stage="3">⚡ 2024</button>
    <button class="stage-btn" data-stage="4">🌟 2025</button>
  </div>

  <div class="info-panel" id="infoPanel">
    <span class="robot-name" id="robotName">Tesla Bot (Concept)</span>
    <span class="robot-desc" id="robotDesc">Строгая стойка, лёгкое покачивание.</span>
    <span class="year-badge" id="yearBadge">2021</span>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('robotCanvas');
    const ctx = canvas.getContext('2d');

    const stages = [
      { year: 2021, name: 'Tesla Bot (Concept)', desc: 'Строгая стойка, лёгкое покачивание.' },
      { year: 2022, name: 'Optimus Gen 1', desc: 'Приветственный жест – машет рукой.' },
      { year: 2023, name: 'Optimus Gen 2', desc: 'Первый шаг: динамичная походка.' },
      { year: 2024, name: 'Optimus Production', desc: 'Рабочая поза – закручивает болт.' },
      { year: 2025, name: 'Optimus Next-Gen', desc: 'Футуристичный жест – руки плавно летят.' }
    ];

    let currentStage = 0;
    let animationFrameId = null;
    let animTime = 0;            // время анимации в секундах
    let lastTimestamp = 0;
    let autoInterval = null;

    const buttons = document.querySelectorAll('.stage-btn');
    const robotNameEl = document.getElementById('robotName');
    const robotDescEl = document.getElementById('robotDesc');
    const yearBadgeEl = document.getElementById('yearBadge');

    // --- Фон и стеклянная камера ---
    function drawLaboratoryBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#1a1f33');
      grad.addColorStop(1, '#0b0f1a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.strokeStyle = '#2a3550';
      ctx.lineWidth = 0.6;
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath();
        ctx.moveTo(i, canvas.height * 0.7);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }
      for (let j = canvas.height * 0.7; j < canvas.height; j += 25) {
        ctx.beginPath();
        ctx.moveTo(0, j);
        ctx.lineTo(canvas.width, j);
        ctx.stroke();
      }
      
      ctx.fillStyle = '#1e2538';
      ctx.shadowColor = '#000000';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.ellipse(canvas.width/2, canvas.height-55, 160, 28, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';
      
      const chamberX = canvas.width/2 - 130;
      const chamberY = 65;
      const chamberW = 260;
      const chamberH = 280;
      
      ctx.fillStyle = 'rgba(20, 30, 50, 0.35)';
      ctx.strokeStyle = 'rgba(80, 130, 220, 0.5)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(chamberX, chamberY, chamberW, chamberH, 30);
      ctx.fill();
      ctx.stroke();
      
      ctx.save();
      ctx.clip(new Path2D(`roundRect(${chamberX}, ${chamberY}, ${chamberW}, ${chamberH}, 30)`));
      
      const glassGrad = ctx.createLinearGradient(chamberX, chamberY, chamberX+40, chamberY+chamberH);
      glassGrad.addColorStop(0, 'rgba(170, 200, 255, 0.25)');
      glassGrad.addColorStop(0.5, 'rgba(120, 160, 240, 0.08)');
      glassGrad.addColorStop(1, 'rgba(60, 90, 180, 0.2)');
      ctx.fillStyle = glassGrad;
      ctx.fillRect(chamberX, chamberY, chamberW, chamberH);
      
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.fillRect(chamberX+10, chamberY+20, 15, chamberH-40);
      ctx.fillRect(chamberX+chamberW-25, chamberY+20, 15, chamberH-40);
      
      ctx.fillStyle = 'rgba(200, 220, 255, 0.12)';
      ctx.fillRect(chamberX+20, chamberY+15, chamberW-40, 6);
      ctx.fillRect(chamberX+20, chamberY+chamberH-21, chamberW-40, 6);
      
      ctx.restore();
      
      ctx.strokeStyle = '#4a5b7a';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(chamberX-2, chamberY-2, chamberW+4, chamberH+4, 32);
      ctx.stroke();
      
      ctx.fillStyle = '#2f4170';
      ctx.shadowColor = '#6c8aff';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.ellipse(canvas.width/2, chamberY-4, 50, 10, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';
    }

    function drawRoundedRect(x, y, w, h, radius, fill, stroke = null, lineWidth = 1.5) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
      }
    }

    function drawFace(x, y, stage, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      if (stage <= 1) {
        ctx.fillStyle = '#b0e0ff';
        ctx.shadowColor = '#3f9eff';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(-18 * scale, -2 * scale, 8 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(18 * scale, -2 * scale, 8 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = '#0a1122';
        ctx.beginPath();
        ctx.arc(-16 * scale, -3 * scale, 3.5 * scale, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(20 * scale, -3 * scale, 3.5 * scale, 0, Math.PI*2);
        ctx.fill();
      } else if (stage === 2) {
        ctx.fillStyle = '#1f2a4a';
        drawRoundedRect(-28 * scale, -12 * scale, 56 * scale, 22 * scale, 8 * scale, '#0f1a2f', '#4f7eff', 1.8);
        ctx.fillStyle = '#a3d0ff';
        ctx.font = `${14*scale}px "Segoe UI", sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('◉  ◉', 0, 5*scale);
      } else if (stage === 3) {
        ctx.fillStyle = '#121b30';
        drawRoundedRect(-34 * scale, -14 * scale, 68 * scale, 26 * scale, 10 * scale, '#0f1422', '#5f8bff', 2);
        ctx.fillStyle = '#e0f0ff';
        ctx.font = `bold ${15*scale}px "Segoe UI", sans-serif`;
        ctx.fillText('TESLA', 0, 4*scale);
        ctx.fillStyle = '#4cff8c';
        ctx.beginPath();
        ctx.arc(-25*scale, -8*scale, 2.5*scale, 0, 2*Math.PI);
        ctx.fill();
        ctx.fillStyle = '#ffbb4c';
        ctx.beginPath();
        ctx.arc(25*scale, -8*scale, 2.5*scale, 0, 2*Math.PI);
        ctx.fill();
      } else if (stage === 4) {
        ctx.fillStyle = '#0a0f1e';
        drawRoundedRect(-36 * scale, -16 * scale, 72 * scale, 28 * scale, 12 * scale, '#030617', '#8aadff', 2.2);
        const gradient = ctx.createLinearGradient(-30*scale, -10*scale, 30*scale, 10*scale);
        gradient.addColorStop(0, '#b5e4ff');
        gradient.addColorStop(1, '#5b8cff');
        ctx.fillStyle = gradient;
        ctx.font = `bold ${16*scale}px "Inter", sans-serif`;
        ctx.fillText('⚡OPTIMUS', 0, 3*scale);
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 9;
        ctx.shadowColor = '#3f9eff';
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.arc(i*12*scale, 12*scale, 1.8*scale, 0, 2*Math.PI);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }
      ctx.restore();
    }

    // --- Отрисовка робота с анимацией движений (параметр time в секундах) ---
    function drawRobot(stageIndex, time) {
      drawLaboratoryBackground();
      
      const cx = canvas.width / 2;
      const cy = 210;
      const stage = Math.min(stageIndex, stages.length - 1);
      const t = time; // время в секундах

      let bodyColor, bodyHighlight, limbColor, jointColor;
      if (stage === 0) {
        bodyColor = '#7f8c9a'; bodyHighlight = '#a0b0c0'; limbColor = '#6b7b8b'; jointColor = '#4a5568';
      } else if (stage === 1) {
        bodyColor = '#5a6b7c'; bodyHighlight = '#8296aa'; limbColor = '#4d5e6e'; jointColor = '#2d3b4a';
      } else if (stage === 2) {
        bodyColor = '#4a5b6b'; bodyHighlight = '#6f8aa0'; limbColor = '#3e4f5f'; jointColor = '#1e2b36';
      } else if (stage === 3) {
        bodyColor = '#2f3b4a'; bodyHighlight = '#5a7a9a'; limbColor = '#26323f'; jointColor = '#121b24';
      } else {
        bodyColor = '#1c2532'; bodyHighlight = '#4a6c92'; limbColor = '#15202b'; jointColor = '#0b1119';
      }

      // Легкое покачивание головы (общее для всех)
      const headSway = Math.sin(t * 2.5) * 1.5;
      const headY = cy - 65 + Math.sin(t * 1.8) * 0.8; // небольшое вертикальное дыхание

      // Голова
      drawRoundedRect(cx - 28, headY - 24, 56, 48, 16, bodyColor, bodyHighlight, 2);
      ctx.fillStyle = jointColor;
      drawRoundedRect(cx - 8, headY + 22, 16, 18, 5, jointColor, '#5a6e80', 1);
      
      ctx.save();
      ctx.translate(cx, headY - 1);
      ctx.rotate(headSway * 0.02); // легкий поворот головы
      drawFace(0, 0, stage, 0.9);
      ctx.restore();

      // Торс (с небольшим наклоном для stage 4)
      let torsoAngle = 0;
      if (stage === 4) torsoAngle = Math.sin(t * 1.5) * 0.04;
      const torsoY = headY + 48;
      ctx.save();
      ctx.translate(cx, torsoY + 35);
      ctx.rotate(torsoAngle);
      ctx.translate(-cx, -torsoY - 35);
      
      drawRoundedRect(cx - 32, torsoY, 64, 70, 18, bodyColor, bodyHighlight, 2.2);

      // Детали на груди
      if (stage >= 2) {
        ctx.fillStyle = '#101a28';
        drawRoundedRect(cx - 14, torsoY + 18, 28, 16, 7, '#0b121c', '#5d7eb0', 1.2);
        ctx.fillStyle = '#c0e0ff';
        ctx.font = 'bold 9px "Segoe UI"';
        ctx.textAlign = 'center';
        if (stage === 2) ctx.fillText('⚡', cx, torsoY + 30);
        else if (stage === 3) ctx.fillText('T', cx, torsoY + 30);
        else ctx.fillText('TSLA', cx, torsoY + 30);
      } else {
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath(); ctx.arc(cx - 7, torsoY + 24, 3.5, 0, 2*Math.PI); ctx.fill();
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath(); ctx.arc(cx + 10, torsoY + 24, 3.5, 0, 2*Math.PI); ctx.fill();
      }
      ctx.restore();

      const shoulderY = torsoY + 10;

      // ---------- АНИМИРОВАННЫЕ РУКИ ----------
      ctx.save();
      if (stage === 0) {
        // Легкое покачивание рук
        const armSwing = Math.sin(t * 2) * 2.5;
        // Левая рука
        drawRoundedRect(cx - 48 + armSwing*0.3, shoulderY - 4, 18, 26, 9, limbColor, bodyHighlight, 1.8);
        drawRoundedRect(cx - 56 + armSwing*0.4, shoulderY + 20, 14, 38, 8, limbColor, jointColor, 1.5);
        ctx.fillStyle = '#6d7b8c';
        drawRoundedRect(cx - 62 + armSwing*0.5, shoulderY + 56, 12, 12, 5, '#5f6b7a', '#8899aa', 1);
        // Правая рука
        drawRoundedRect(cx + 30 - armSwing*0.3, shoulderY - 4, 18, 26, 9, limbColor, bodyHighlight, 1.8);
        drawRoundedRect(cx + 42 - armSwing*0.4, shoulderY + 20, 14, 38, 8, limbColor, jointColor, 1.5);
        ctx.fillStyle = '#6d7b8c';
        drawRoundedRect(cx + 50 - armSwing*0.5, shoulderY + 56, 12, 12, 5, '#5f6b7a', '#8899aa', 1);
      } else if (stage === 1) {
        // Правая рука машет (анимация подъема)
        const waveAngle = Math.sin(t * 6) * 0.9; // диапазон движения
        // Левая рука (слегка двигается)
        const leftSwing = Math.sin(t * 3) * 1.5;
        drawRoundedRect(cx - 48 + leftSwing*0.2, shoulderY - 4, 18, 26, 9, limbColor, bodyHighlight, 1.8);
        drawRoundedRect(cx - 56 + leftSwing*0.3, shoulderY + 20, 14, 38, 8, limbColor, jointColor, 1.5);
        ctx.fillStyle = '#6d7b8c';
        drawRoundedRect(cx - 62 + leftSwing*0.4, shoulderY + 56, 12, 12, 5, '#5f6b7a', '#8899aa', 1);
        
        // Правая рука (машет)
        ctx.save();
        ctx.translate(cx + 30, shoulderY - 4);
        ctx.rotate(-0.7 + waveAngle); // меняющийся угол
        drawRoundedRect(0, 0, 18, 26, 9, limbColor, bodyHighlight, 1.8);
        ctx.translate(8, 24);
        ctx.rotate(0.5);
        drawRoundedRect(-7, 0, 14, 32, 8, limbColor, jointColor, 1.5);
        ctx.fillStyle = '#6d7b8c';
        drawRoundedRect(-9, 30, 12, 12, 5, '#5f6b7a', '#8899aa', 1);
        ctx.restore();
      } else if (stage === 2) {
        // Шагающая анимация: руки и ноги в противофазе
        const walkCycle = Math.sin(t * 5);
        const leftArmAngle = 0.4 + walkCycle * 0.5;
        const rightArmAngle = -0.3 - walkCycle * 0.5;
        
        // Левая рука
        ctx.save();
        ctx.translate(cx - 39, shoulderY + 18);
        ctx.rotate(leftArmAngle);
        drawRoundedRect(-7, 0, 14, 34, 8, limbColor, jointColor, 1.5);
        ctx.fillStyle = '#6d7b8c';
        drawRoundedRect(-9, 32, 12, 12, 5, '#5f6b7a', '#8899aa', 1);
        ctx.restore();
        drawRoundedRect(cx - 48, shoulderY - 4, 18, 22, 9, limbColor, bodyHighlight, 1.8);
        
        // Правая рука
        ctx.save();
        ctx.translate(cx + 39, shoulderY + 18);
        ctx.rotate(rightArmAngle);
        drawRoundedRect(-7, 0, 14, 34, 8, limbColor, jointColor, 1.5);
        ctx.fillStyle = '#6d7b8c';
        drawRoundedRect(-9, 32, 12, 12, 5, '#5f6b7a', '#8899aa', 1);
        ctx.restore();
        drawRoundedRect(cx + 30, shoulderY - 4, 18, 22, 9, limbColor, bodyHighlight, 1.8);
      } else if (stage === 3) {
        // Рабочая поза: правая рука вращает инструмент
        const drillAngle = t * 8; // непрерывное вращение
        // Левая рука (статична, но слегка двигается)
        drawRoundedRect(cx - 48, shoulderY - 4, 18, 26, 9, limbColor, bodyHighlight, 1.8);
        drawRoundedRect(cx - 56, shoulderY + 20, 14, 38, 8, limbColor, jointColor, 1.5);
        ctx.fillStyle = '#6d7b8c';
        drawRoundedRect(cx - 62, shoulderY + 56, 12, 12, 5, '#5f6b7a', '#8899aa', 1);
        
        // Правая рука с вращением инструмента
        ctx.save();
        ctx.translate(cx + 30, shoulderY);
        ctx.rotate(-0.9);
        drawRoundedRect(0, 0, 18, 26, 9, limbColor, bodyHighlight, 1.8);
        ctx.translate(9, 24);
        ctx.rotate(0.2 + Math.sin(drillAngle) * 0.15); // вибрация
        drawRoundedRect(-7, 0, 14, 30, 8, limbColor, jointColor, 1.5);
        // кисть с инструментом
        ctx.fillStyle = '#4b5a6b';
        drawRoundedRect(-8, 28, 16, 16, 6, '#3e4c5c', '#7b8fa0', 1.4);
        // вращающийся инструмент
        ctx.save();
        ctx.translate(-1, 18);
        ctx.rotate(drillAngle);
        ctx.fillStyle = '#c0c0c0';
        ctx.fillRect(-3, -14, 6, 28);
        ctx.fillStyle = '#ffaa00';
        ctx.beginPath();
        ctx.arc(0, -16, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
        ctx.restore();
      } else if (stage === 4) {
        // Руки в стороны, плавно поднимаются и опускаются
        const wingAngle = Math.sin(t * 2.2) * 0.6 + 1.2; // базовый угол + колебание
        // Левая рука
        ctx.save();
        ctx.translate(cx - 30, shoulderY - 4);
        ctx.rotate(-wingAngle);
        drawRoundedRect(0, 0, 18, 26, 9, limbColor, bodyHighlight, 1.8);
        ctx.translate(9, 24);
        ctx.rotate(0.2);
        drawRoundedRect(-7, 0, 14, 36, 8, limbColor, jointColor, 1.5);
        ctx.fillStyle = '#aaccff';
        ctx.shadowBlur = 6; ctx.shadowColor = '#3b82f6';
        drawRoundedRect(-9, 34, 14, 14, 6, '#4b5a6b', '#7b8fa0', 1.4);
        ctx.shadowBlur = 0;
        ctx.restore();
        // Правая рука
        ctx.save();
        ctx.translate(cx + 30, shoulderY - 4);
        ctx.rotate(wingAngle);
        drawRoundedRect(0, 0, 18, 26, 9, limbColor, bodyHighlight, 1.8);
        ctx.translate(9, 24);
        ctx.rotate(-0.2);
        drawRoundedRect(-7, 0, 14, 36, 8, limbColor, jointColor, 1.5);
        ctx.fillStyle = '#aaccff';
        ctx.shadowBlur = 6; ctx.shadowColor = '#3b82f6';
        drawRoundedRect(-9, 34, 14, 14, 6, '#4b5a6b', '#7b8fa0', 1.4);
        ctx.shadowBlur = 0;
        ctx.restore();
      }

      // ---------- АНИМИРОВАННЫЕ НОГИ ----------
      const legY = torsoY + 66;
      ctx.save();
      if (stage === 0 || stage === 1) {
        // Ноги вместе, легкое покачивание
        const legShift = Math.sin(t * 2.2) * 1.5;
        drawRoundedRect(cx - 20 + legShift, legY, 15, 46, 9, limbColor, jointColor, 1.7);
        drawRoundedRect(cx + 5 - legShift, legY, 15, 46, 9, limbColor, jointColor, 1.7);
        drawRoundedRect(cx - 26 + legShift, legY + 42, 18, 12, 7, '#2c3846', '#6d7e8f', 1.3);
        drawRoundedRect(cx + 8 - legShift, legY + 42, 18, 12, 7, '#2c3846', '#6d7e8f', 1.3);
      } else if (stage === 2) {
        // Шагающая анимация ног
        const walkLeg = Math.sin(t * 5);
        const leftLegShift = walkLeg * 10;
        const rightLegShift = -walkLeg * 10;
        // Левая нога
        drawRoundedRect(cx - 28 + leftLegShift, legY - 6, 15, 42, 9, limbColor, jointColor, 1.7);
        drawRoundedRect(cx - 34 + leftLegShift, legY + 32, 18, 12, 7, '#2c3846', '#6d7e8f', 1.3);
        // Правая нога
        drawRoundedRect(cx + 10 + rightLegShift, legY + 8, 15, 38, 9, limbColor, jointColor, 1.7);
        drawRoundedRect(cx + 4 + rightLegShift, legY + 42, 18, 12, 7, '#2c3846', '#6d7e8f', 1.3);
      } else if (stage === 3) {
        // Уверенная стойка, небольшой перенос веса
        const weightShift = Math.sin(t * 1.8) * 1.2;
        drawRoundedRect(cx - 24 + weightShift, legY - 2, 15, 44, 9, limbColor, jointColor, 1.7);
        drawRoundedRect(cx + 9 - weightShift, legY - 2, 15, 44, 9, limbColor, jointColor, 1.7);
        drawRoundedRect(cx - 30 + weightShift, legY + 38, 20, 12, 7, '#2c3846', '#6d7e8f', 1.3);
        drawRoundedRect(cx + 10 - weightShift, legY + 38, 20, 12, 7, '#2c3846', '#6d7e8f', 1.3);
      } else if (stage === 4) {
        // Ноги на ширине плеч, небольшой присед
        const squat = Math.sin(t * 2) * 1.5;
        drawRoundedRect(cx - 28, legY - 4 + squat*0.5, 15, 44 - squat, 9, limbColor, jointColor, 1.7);
        drawRoundedRect(cx + 13, legY - 2 + squat*0.5, 15, 44 - squat, 9, limbColor, jointColor, 1.7);
        drawRoundedRect(cx - 34, legY + 38 + squat*0.5, 20, 14, 7, '#2c3846', '#6d7e8f', 1.3);
        drawRoundedRect(cx + 14, legY + 40 + squat*0.5, 20, 14, 7, '#2c3846', '#6d7e8f', 1.3);
      }
      ctx.restore();

      // Свечение вокруг (для последних стадий)
      if (stage >= 3) {
        const glowPulse = Math.sin(t * 3) * 3 + 8;
        ctx.shadowColor = '#3b82f6';
        ctx.shadowBlur = 10 + glowPulse;
        ctx.strokeStyle = '#5b8cff66';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy-15, 62, 0, Math.PI*2);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
      }

      // Год на табличке
      ctx.font = 'bold 16px "Inter", "Segoe UI"';
      ctx.fillStyle = '#e2e8ff';
      ctx.shadowColor = '#0f1a3f';
      ctx.shadowBlur = 4;
      ctx.fillText(stages[stage].year, cx - 18, cy + 125);
      ctx.shadowBlur = 0;
    }

    function animate(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = Math.min(0.05, (timestamp - lastTimestamp) / 1000); // ограничение для избежания скачков
      animTime += delta;
      lastTimestamp = timestamp;

      drawRobot(currentStage, animTime);
      animationFrameId = requestAnimationFrame(animate);
    }

    function updateUIForStage(index) {
      buttons.forEach((btn, idx) => {
        btn.classList.toggle('active', idx === index);
      });
      const stageData = stages[index];
      robotNameEl.textContent = stageData.name;
      robotDescEl.textContent = stageData.desc;
      yearBadgeEl.textContent = stageData.year;
    }

    function restartAutoAdvance() {
      if (autoInterval) clearInterval(autoInterval);
      autoInterval = setInterval(() => {
        currentStage = (currentStage + 1) % stages.length;
        updateUIForStage(currentStage);
      }, 2000);
    }

    function setStage(index) {
      if (index === currentStage) {
        restartAutoAdvance();
        return;
      }
      currentStage = Math.min(Math.max(index, 0), stages.length - 1);
      updateUIForStage(currentStage);
      restartAutoAdvance();
    }

    buttons.forEach((btn) => {
      btn.addEventListener('click', (e) => {
        const stageIndex = parseInt(e.currentTarget.getAttribute('data-stage'), 10);
        setStage(stageIndex);
      });
    });

    // Полифил roundRect
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
        this.beginPath();
        this.moveTo(x + r.tl, y);
        this.lineTo(x + w - r.tr, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
        this.lineTo(x + w, y + h - r.br);
        this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
        this.lineTo(x + r.bl, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
        this.lineTo(x, y + r.tl);
        this.quadraticCurveTo(x, y, x + r.tl, y);
        this.closePath();
        return this;
      };
    }

    // Старт анимации и автосмены
    updateUIForStage(0);
    animationFrameId = requestAnimationFrame(animate);
    restartAutoAdvance();

    window.addEventListener('beforeunload', () => {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      if (autoInterval) clearInterval(autoInterval);
    });
  })();
</script>
</body>
</html>
