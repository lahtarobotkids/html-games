<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Эволюция робота TESLA • Серия 5: Новый союзник</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #020408;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
      padding: 20px;
    }
    .cartoon-container {
      max-width: 1000px;
      width: 100%;
      background: rgba(6, 8, 16, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 3.5rem;
      padding: 2rem 2rem 2.2rem;
      box-shadow: 0 30px 55px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(70, 100, 230, 0.15);
    }
    h1 {
      text-align: center;
      color: #eef5ff;
      font-weight: 400;
      letter-spacing: 2px;
      font-size: 2.6rem;
      margin-bottom: 0.3rem;
      text-shadow: 0 0 12px #3f6eff80;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    h1 span {
      background: linear-gradient(135deg, #c0d0ff, #7f9bff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }
    .subtitle {
      text-align: center;
      color: #8892b0;
      margin-bottom: 0.8rem;
      font-size: 1.15rem;
      letter-spacing: 0.4px;
    }
    .auto-indicator {
      text-align: center;
      font-size: 0.9rem;
      color: #6d7ea0;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .auto-indicator .dot {
      width: 10px;
      height: 10px;
      background: #4f9eff;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
      100% { opacity: 0.5; transform: scale(0.9); }
    }
    canvas {
      display: block;
      margin: 0 auto;
      width: 100%;
      height: auto;
      background: #0a0d14;
      border-radius: 2.8rem;
      box-shadow: inset 0 0 45px rgba(0, 0, 0, 0.9), 0 18px 35px rgba(0, 15, 40, 0.9);
      border: 1px solid rgba(74, 110, 255, 0.15);
    }
    .timeline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.8rem;
      padding: 0 10px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .stage-btn {
      background: #1e2640;
      border: none;
      color: #b9c8ff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.1rem;
      border-radius: 3rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      background: rgba(30, 38, 64, 0.8);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
      transition: all 0.25s ease;
      border: 1px solid rgba(100, 140, 255, 0.25);
      flex: 1;
      min-width: 80px;
      text-align: center;
    }
    .stage-btn:hover {
      background: #2f3b66;
      color: #ffffff;
      border-color: #6c8aff;
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(0, 80, 255, 0.25);
    }
    .stage-btn.active {
      background: linear-gradient(135deg, #2f4bff, #1e36b0);
      color: white;
      border-color: #aac0ff;
      box-shadow: 0 0 24px #2f4bffaa;
      font-weight: 700;
      transform: scale(1.02);
    }
    .info-panel {
      margin-top: 1.5rem;
      background: rgba(10, 14, 25, 0.7);
      border-radius: 2rem;
      padding: 1.2rem 1.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      border: 1px solid rgba(70, 100, 230, 0.3);
    }
    .robot-name {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(to right, #c6d9ff, #6588ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    .robot-desc {
      color: #cdd6f0;
      font-size: 1rem;
      max-width: 400px;
    }
    .year-badge {
      background: #0f1424;
      color: #a0b9ff;
      padding: 0.3rem 1.2rem;
      border-radius: 5rem;
      font-weight: 600;
      font-size: 1.2rem;
      border: 1px solid #4d6bff;
    }
    @media (max-width: 650px) {
      .timeline {
        flex-direction: row;
        flex-wrap: wrap;
      }
      .stage-btn {
        font-size: 0.8rem;
        padding: 0.5rem 0.7rem;
      }
    }
  </style>
</head>
<body>
<div class="cartoon-container">
  <h1>
    <span style="color:#4f9eff;">OPTIMUS</span> & <span style="color:#ff5555;">ATLAS</span> & <span style="color:#a855f7;">NOVA</span>
  </h1>
  <div class="subtitle">Серия 5: Новый союзник</div>
  <div class="auto-indicator">
    <span class="dot"></span> Автосмена каждые 2 сек
  </div>

  <canvas id="robotCanvas" width="700" height="400" aria-label="Optimus, Atlas и Nova"></canvas>

  <div class="timeline" id="timeline">
    <button class="stage-btn active" data-stage="0">🛸 Появление</button>
    <button class="stage-btn" data-stage="1">⚡ Способности</button>
    <button class="stage-btn" data-stage="2">🤜 Конфликт</button>
    <button class="stage-btn" data-stage="3">🤝 Союз</button>
    <button class="stage-btn" data-stage="4">🌌 Миссия</button>
  </div>

  <div class="info-panel" id="infoPanel">
    <span class="robot-name" id="robotName">Появление</span>
    <span class="robot-desc" id="robotDesc">Неизвестный робот приземляется в городе.</span>
    <span class="year-badge" id="yearBadge">2032</span>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('robotCanvas');
    const ctx = canvas.getContext('2d');

    const stages = [
      { year: 2032, name: 'Появление', desc: 'Неизвестный робот приземляется в городе.' },
      { year: 2032, name: 'Способности', desc: 'Nova демонстрирует левитацию и силовое поле.' },
      { year: 2032, name: 'Конфликт', desc: 'Optimus и Atlas насторожены, Nova атакует.' },
      { year: 2032, name: 'Союз', desc: 'Осознание общей угрозы. Команда из трёх.' },
      { year: 2032, name: 'Миссия', desc: 'Совместная защита Земли от метеорита.' }
    ];

    let currentStage = 0;
    let animationFrameId = null;
    let animTime = 0;
    let lastTimestamp = 0;
    let autoInterval = null;

    const buttons = document.querySelectorAll('.stage-btn');
    const robotNameEl = document.getElementById('robotName');
    const robotDescEl = document.getElementById('robotDesc');
    const yearBadgeEl = document.getElementById('yearBadge');

    let particles = [];
    const MAX_PARTICLES = 120;

    function spawnParticle(x, y, color, life = 0.5, vx, vy) {
      if (particles.length > MAX_PARTICLES) particles.shift();
      particles.push({
        x, y,
        vx: vx || (Math.random() - 0.5) * 3,
        vy: vy || (Math.random() - 0.5) * 3 - 2,
        life, maxLife: life, color
      });
    }

    function updateParticles(dt) {
      for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt;
      }
      particles = particles.filter(p => p.life > 0);
    }

    function drawParticles(ctx) {
      for (let p of particles) {
        const alpha = Math.min(1, p.life / p.maxLife);
        ctx.fillStyle = p.color.replace('1)', `${alpha})`).replace('rgb', 'rgba');
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5 * alpha, 0, Math.PI*2);
        ctx.fill();
      }
    }

    function drawBackground(stage, time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if (stage === 0) { // Город с посадочной площадкой
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#1a1c2a');
        grad.addColorStop(1, '#0c0f18');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < 10; i++) {
          const hx = 40 + i * 68;
          const hh = 100 + (i % 3) * 40;
          ctx.fillStyle = i % 2 === 0 ? '#1e2836' : '#232e40';
          ctx.fillRect(hx, canvas.height - hh - 40, 30, hh);
          ctx.fillStyle = '#3a4a5a';
          for (let wy = canvas.height - hh - 30; wy < canvas.height - 50; wy += 18) {
            ctx.fillRect(hx + 4, wy, 8, 10);
            ctx.fillRect(hx + 18, wy, 8, 10);
          }
        }
        ctx.fillStyle = '#1a1e26';
        ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
        // Посадочный круг
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.arc(canvas.width/2, canvas.height - 50, 40, 0, Math.PI*2);
        ctx.stroke();
        ctx.setLineDash([]);
      } else if (stage === 1) { // Лаборатория
        ctx.fillStyle = '#0a0d14';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#2a3a50';
        ctx.lineWidth = 0.6;
        for (let i = 0; i < canvas.width; i += 50) {
          ctx.beginPath(); ctx.moveTo(i, canvas.height*0.7); ctx.lineTo(i, canvas.height); ctx.stroke();
        }
        for (let j = canvas.height*0.7; j < canvas.height; j += 30) {
          ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
        }
      } else if (stage === 2) { // Арена конфликта
        ctx.fillStyle = '#0c0e14';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < canvas.width; i += 30) {
          ctx.fillStyle = i%60===0 ? '#1e2530' : '#151a24';
          ctx.fillRect(i, canvas.height-60, 30, 60);
        }
      } else if (stage === 3) { // Космическая станция
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < 70; i++) {
          const sx = (i*37 + time*5) % canvas.width;
          const sy = (i*23) % canvas.height;
          ctx.fillStyle = `rgba(255,255,255,${0.4+Math.sin(time+i)*0.3})`;
          ctx.beginPath(); ctx.arc(sx, sy, 1.3, 0, Math.PI*2); ctx.fill();
        }
        ctx.fillStyle = '#2a3a5a';
        ctx.beginPath(); ctx.ellipse(canvas.width/2, canvas.height+30, 350, 50, 0, 0, Math.PI*2); ctx.fill();
      } else { // Космос с метеоритом
        ctx.fillStyle = '#020410';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < 80; i++) {
          const sx = (i*41 + time*8) % canvas.width;
          const sy = (i*19) % canvas.height;
          ctx.fillStyle = `rgba(255,255,255,${0.5+Math.sin(time+i)*0.3})`;
          ctx.beginPath(); ctx.arc(sx, sy, 1.4, 0, Math.PI*2); ctx.fill();
        }
        // Метеорит
        ctx.fillStyle = '#aa6644';
        ctx.beginPath();
        ctx.arc(500, 60 + Math.sin(time*2)*10, 30, 0, Math.PI*2);
        ctx.fill();
      }
    }

    function drawRoundedRect(x, y, w, h, radius, fill, stroke = null, lineWidth = 1.5) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
    }

    function drawOptimus(cx, cy, time, angry = false, scale = 1.0) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      const headY = -60 + Math.sin(time * 2.5) * 1.0;
      drawRoundedRect(-22, headY - 18, 44, 38, 12, '#2a3038', '#4e5663', 2);
      ctx.fillStyle = '#1a1f29';
      drawRoundedRect(-6, headY + 18, 12, 14, 5, '#1a1f29', '#2f3845', 1);
      ctx.save();
      ctx.translate(0, headY);
      ctx.rotate(Math.sin(time * 2) * 0.1);
      ctx.fillStyle = '#1a1f2b';
      ctx.beginPath(); ctx.arc(-14, -2, 8, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#4a5b6e'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(14, -2, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2f3b4a';
      ctx.beginPath(); ctx.arc(-14, -2, 5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(14, -2, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = angry ? '#ff6666' : '#aaccff';
      ctx.beginPath(); ctx.arc(-12, -3, 2.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(16, -3, 2.2, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      const torsoY = headY + 38;
      drawRoundedRect(-25, torsoY, 50, 56, 15, '#2a3038', '#4e5663', 2.2);
      ctx.fillStyle = '#0e121c';
      drawRoundedRect(-15, torsoY + 14, 30, 15, 7, '#0b0f17', '#3d4e6b', 1);
      ctx.fillStyle = '#c0d0ff';
      ctx.font = 'bold 8px "Segoe UI"';
      ctx.textAlign = 'center';
      ctx.fillText('TESLA', 0, torsoY + 24);
      const shoulderY = torsoY + 8;
      const armSwing = Math.sin(time * 2.8) * 2.0;
      drawRoundedRect(-38 + armSwing*0.3, shoulderY - 3, 13, 20, 7, '#2a3038', '#4e5663', 1.6);
      drawRoundedRect(-42 + armSwing*0.4, shoulderY + 15, 10, 26, 6, '#2a3038', '#1a1f29', 1.4);
      ctx.fillStyle = '#4b5560';
      drawRoundedRect(-46 + armSwing*0.5, shoulderY + 39, 12, 9, 4, '#3a424d', '#6b7580', 1);
      drawRoundedRect(25 - armSwing*0.3, shoulderY - 3, 13, 20, 7, '#2a3038', '#4e5663', 1.6);
      drawRoundedRect(32 - armSwing*0.4, shoulderY + 15, 10, 26, 6, '#2a3038', '#1a1f29', 1.4);
      ctx.fillStyle = '#4b5560';
      drawRoundedRect(34 - armSwing*0.5, shoulderY + 39, 12, 9, 4, '#3a424d', '#6b7580', 1);
      const legY = torsoY + 52;
      const legShift = Math.sin(time * 2.5) * 1.5;
      drawRoundedRect(-15 + legShift, legY, 11, 36, 7, '#2a3038', '#1a1f29', 1.5);
      drawRoundedRect(4 - legShift, legY, 11, 36, 7, '#2a3038', '#1a1f29', 1.5);
      drawRoundedRect(-20 + legShift, legY + 33, 14, 9, 5, '#212835', '#5a6470', 1.2);
      drawRoundedRect(6 - legShift, legY + 33, 14, 9, 5, '#212835', '#5a6470', 1.2);
      ctx.restore();
    }

    function drawAtlas(cx, cy, time, angry = false, scale = 1.0) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      const headY = -58 + Math.sin(time * 2.2) * 0.8;
      drawRoundedRect(-24, headY - 18, 48, 40, 12, '#3a2020', '#6a4040', 2);
      ctx.fillStyle = '#1a0f0f';
      drawRoundedRect(-6, headY + 20, 12, 14, 5, '#1a0f0f', '#3a2020', 1);
      ctx.save();
      ctx.translate(0, headY);
      ctx.rotate(Math.sin(time * 1.8) * 0.08);
      ctx.fillStyle = '#2a1515';
      ctx.beginPath(); ctx.arc(0, -1, 12, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#6a4040'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = angry ? '#ff4444' : '#cc3333';
      ctx.beginPath(); ctx.arc(0, -1, 6, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      const torsoY = headY + 40;
      drawRoundedRect(-28, torsoY, 56, 60, 16, '#3a2020', '#6a4040', 2.4);
      ctx.fillStyle = '#1a0f0f';
      drawRoundedRect(-16, torsoY + 16, 32, 16, 8, '#1a0f0f', '#4a2a2a', 1.2);
      ctx.fillStyle = '#ff8888';
      ctx.font = 'bold 8px "Segoe UI"';
      ctx.textAlign = 'center';
      ctx.fillText('ATLAS', 0, torsoY + 26);
      const shoulderY = torsoY + 10;
      const armSwing = Math.sin(time * 2.7) * 1.8;
      drawRoundedRect(-40 + armSwing*0.3, shoulderY - 4, 15, 22, 8, '#3a2020', '#6a4040', 1.7);
      drawRoundedRect(-44 + armSwing*0.4, shoulderY + 16, 11, 28, 6, '#3a2020', '#1a0f0f', 1.4);
      ctx.fillStyle = '#5a3030';
      drawRoundedRect(-48 + armSwing*0.5, shoulderY + 42, 13, 10, 5, '#4a2020', '#7a4040', 1);
      drawRoundedRect(25 - armSwing*0.3, shoulderY - 4, 15, 22, 8, '#3a2020', '#6a4040', 1.7);
      drawRoundedRect(33 - armSwing*0.4, shoulderY + 16, 11, 28, 6, '#3a2020', '#1a0f0f', 1.4);
      ctx.fillStyle = '#5a3030';
      drawRoundedRect(35 - armSwing*0.5, shoulderY + 42, 13, 10, 5, '#4a2020', '#7a4040', 1);
      const legY = torsoY + 56;
      const legShift = Math.sin(time * 2.3) * 1.6;
      drawRoundedRect(-17 + legShift, legY, 13, 40, 7, '#3a2020', '#1a0f0f', 1.6);
      drawRoundedRect(4 - legShift, legY, 13, 40, 7, '#3a2020', '#1a0f0f', 1.6);
      drawRoundedRect(-22 + legShift, legY + 37, 16, 11, 6, '#2a1515', '#5a3030', 1.3);
      drawRoundedRect(6 - legShift, legY + 37, 16, 11, 6, '#2a1515', '#5a3030', 1.3);
      ctx.restore();
    }

    function drawNova(cx, cy, time, angry = false, scale = 1.0) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      
      // Левитация
      const floatY = Math.sin(time * 3) * 4;
      ctx.translate(0, floatY);
      
      // Силовое поле
      ctx.strokeStyle = angry ? 'rgba(200, 100, 255, 0.6)' : 'rgba(150, 100, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -5, 40, 0, Math.PI*2);
      ctx.stroke();
      
      const headY = -62;
      drawRoundedRect(-20, headY - 16, 40, 34, 10, '#2a1a3a', '#6a3a8a', 2);
      ctx.fillStyle = '#1a0f2a';
      drawRoundedRect(-5, headY + 16, 10, 12, 4, '#1a0f2a', '#3a1a5a', 1);
      
      ctx.save();
      ctx.translate(0, headY);
      // Визор
      ctx.fillStyle = '#1a0f2a';
      ctx.beginPath(); ctx.arc(-10, -2, 7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#6a3a8a'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(10, -2, 7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = angry ? '#ff66ff' : '#c084fc';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#a855f7';
      ctx.beginPath(); ctx.arc(-8, -3, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(12, -3, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
      
      const torsoY = headY + 36;
      drawRoundedRect(-22, torsoY, 44, 48, 12, '#2a1a3a', '#6a3a8a', 2.2);
      ctx.fillStyle = '#1a0f2a';
      drawRoundedRect(-14, torsoY + 12, 28, 14, 6, '#1a0f2a', '#3a1a5a', 1);
      ctx.fillStyle = '#c084fc';
      ctx.font = 'bold 8px "Segoe UI"';
      ctx.textAlign = 'center';
      ctx.fillText('NOVA', 0, torsoY + 22);
      
      const shoulderY = torsoY + 6;
      // Руки с энергетическими кистями
      const armSwing = Math.sin(time * 3.2) * 2.5;
      
      drawRoundedRect(-34 + armSwing*0.3, shoulderY - 2, 12, 18, 6, '#2a1a3a', '#6a3a8a', 1.5);
      drawRoundedRect(-38 + armSwing*0.4, shoulderY + 14, 9, 22, 5, '#2a1a3a', '#1a0f2a', 1.3);
      ctx.fillStyle = '#a855f7';
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#c084fc';
      drawRoundedRect(-42 + armSwing*0.5, shoulderY + 34, 12, 8, 4, '#7c3aed', '#a855f7', 1);
      ctx.shadowBlur = 0;
      
      drawRoundedRect(22 - armSwing*0.3, shoulderY - 2, 12, 18, 6, '#2a1a3a', '#6a3a8a', 1.5);
      drawRoundedRect(29 - armSwing*0.4, shoulderY + 14, 9, 22, 5, '#2a1a3a', '#1a0f2a', 1.3);
      ctx.fillStyle = '#a855f7';
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#c084fc';
      drawRoundedRect(30 - armSwing*0.5, shoulderY + 34, 12, 8, 4, '#7c3aed', '#a855f7', 1);
      ctx.shadowBlur = 0;
      
      const legY = torsoY + 44;
      const legShift = Math.sin(time * 2.8) * 1.4;
      drawRoundedRect(-12 + legShift, legY, 10, 30, 6, '#2a1a3a', '#1a0f2a', 1.4);
      drawRoundedRect(2 - legShift, legY, 10, 30, 6, '#2a1a3a', '#1a0f2a', 1.4);
      drawRoundedRect(-17 + legShift, legY + 27, 13, 8, 4, '#1a0f2a', '#3a1a5a', 1.1);
      drawRoundedRect(4 - legShift, legY + 27, 13, 8, 4, '#1a0f2a', '#3a1a5a', 1.1);
      
      ctx.restore();
    }

    function drawScene(stage, time) {
      drawBackground(stage, time);
      updateParticles(0.016);
      const t = time;
      
      if (stage === 0) { // Появление
        drawNova(350, 200, t, false, 1.1);
        drawOptimus(150, 250, t, false, 0.8);
        drawAtlas(250, 250, t, false, 0.8);
        spawnParticle(350, 150, 'rgb(168,85,247)', 0.6);
      } else if (stage === 1) { // Способности
        drawNova(400, 190, t, false, 1.2);
        drawOptimus(180, 250, t, false, 0.85);
        drawAtlas(280, 250, t, false, 0.85);
        // Энергетические частицы вокруг Nova
        for (let i = 0; i < 3; i++) {
          const angle = t * 3 + i * Math.PI * 2 / 3;
          const px = 400 + Math.cos(angle) * 45;
          const py = 190 + Math.sin(angle) * 45;
          spawnParticle(px, py, 'rgb(168,85,247)', 0.4, 0, 0);
        }
      } else if (stage === 2) { // Конфликт
        drawNova(380, 200, t, true, 1.1);
        drawOptimus(150, 240, t, true, 0.9);
        drawAtlas(250, 240, t, true, 0.9);
        // Атакующие импульсы
        if (Math.sin(t * 10) > 0.6) {
          spawnParticle(350, 190, 'rgb(200,100,255)', 0.3, -1.5, -1);
          spawnParticle(200, 220, 'rgb(100,150,255)', 0.3, 1.5, -1);
        }
      } else if (stage === 3) { // Союз
        drawNova(120, 200, t, false, 1.0);
        drawOptimus(520, 210, t, false, 0.9);
        drawAtlas(400, 210, t, false, 0.9);
        // Соединяющие лучи
        ctx.strokeStyle = 'rgba(168,85,247,0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(140, 185);
        ctx.lineTo(380, 195);
        ctx.lineTo(500, 195);
        ctx.stroke();
        spawnParticle(260, 200, 'rgb(150,100,255)', 0.5);
      } else if (stage === 4) { // Миссия
        drawOptimus(140, 230, t, false, 0.85);
        drawNova(300, 200, t, false, 1.0);
        drawAtlas(460, 230, t, false, 0.85);
        // Метеорит
        ctx.fillStyle = '#aa6644';
        ctx.beginPath();
        ctx.arc(550, 60 + Math.sin(t*2)*10, 25, 0, Math.PI*2);
        ctx.fill();
        // Лучи защиты
        ctx.strokeStyle = 'rgba(168,85,247,0.6)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(300, 160);
        ctx.lineTo(540, 70);
        ctx.stroke();
        spawnParticle(420, 110, 'rgb(168,85,247)', 0.4);
      }

      drawParticles(ctx);
      ctx.font = 'bold 16px "Inter"';
      ctx.fillStyle = '#d0d8ff';
      ctx.fillText(stages[stage].year, canvas.width/2 - 20, 370);
    }

    function animate(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
      animTime += delta;
      lastTimestamp = timestamp;
      drawScene(currentStage, animTime);
      animationFrameId = requestAnimationFrame(animate);
    }

    function updateUIForStage(index) {
      buttons.forEach((btn, idx) => btn.classList.toggle('active', idx === index));
      const d = stages[index];
      robotNameEl.textContent = d.name;
      robotDescEl.textContent = d.desc;
      yearBadgeEl.textContent = d.year;
    }

    function restartAutoAdvance() {
      if (autoInterval) clearInterval(autoInterval);
      autoInterval = setInterval(() => {
        currentStage = (currentStage + 1) % stages.length;
        particles = [];
        updateUIForStage(currentStage);
      }, 2000);
    }

    function setStage(index) {
      if (index === currentStage) { restartAutoAdvance(); return; }
      currentStage = Math.min(Math.max(index, 0), stages.length - 1);
      particles = [];
      updateUIForStage(currentStage);
      restartAutoAdvance();
    }

    buttons.forEach(btn => btn.addEventListener('click', e => setStage(parseInt(e.currentTarget.dataset.stage))));

    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
        this.beginPath();
        this.moveTo(x + r.tl, y);
        this.lineTo(x + w - r.tr, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
        this.lineTo(x + w, y + h - r.br);
        this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
        this.lineTo(x + r.bl, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
        this.lineTo(x, y + r.tl);
        this.quadraticCurveTo(x, y, x + r.tl, y);
        this.closePath();
        return this;
      };
    }

    updateUIForStage(0);
    animationFrameId = requestAnimationFrame(animate);
    restartAutoAdvance();

    window.addEventListener('beforeunload', () => {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      if (autoInterval) clearInterval(autoInterval);
    });
  })();
</script>
</body>
</html>
