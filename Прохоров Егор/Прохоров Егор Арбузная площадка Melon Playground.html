<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Арбузная площадка — Melon Playground</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #14141f 0%, #232336 100%); color: #e8e8f0;
    padding: 10px; user-select: none; -webkit-user-select: none; overflow: hidden;
  }
  .topbar { display: flex; flex-direction: column; align-items: center; gap: 7px; margin-bottom: 8px; width: 100%; max-width: 920px; }
  h1 { font-size: 1.4rem; letter-spacing: 1px; }
  .subtitle { color: #9a9ab8; font-size: 0.82rem; text-align: center; }
  .subtitle b { color: #ffd9a0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .row .label { color: #9a9ab8; font-size: 0.78rem; align-self: center; margin-right: 2px; }
  button, select {
    background: #34344f; color: #e8e8f0; border: 1px solid #55558a; border-radius: 8px;
    padding: 6px 10px; font-size: 0.85rem; cursor: pointer; transition: background 0.15s, transform 0.08s;
  }
  button:hover, select:hover { background: #42425f; }
  button:active { transform: scale(0.94); }
  button.active { background: #f4a261; color: #1e1e2e; border-color: #ffb877; box-shadow: 0 0 12px rgba(244,162,97,0.4); }
  button.danger { color: #ff7b72; }
  .scoreline { font-size: 0.9rem; color: #9a9ab8; }
  .scoreline b { color: #ff7b72; font-size: 1.15rem; }
  #game {
    width: min(98vw, 960px); height: auto;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #aee3ff; border: 3px solid #44446e; border-radius: 12px;
    cursor: crosshair; touch-action: none; box-shadow: 0 12px 50px rgba(0,0,0,0.5);
  }
  .hint { margin-top: 8px; color: #9a9ab8; font-size: 0.82rem; min-height: 1.3em; text-align: center; }
  @media (max-width: 480px) { h1 { font-size: 1.1rem; } button, select { padding: 5px 8px; font-size: 0.75rem; } }
</style>
</head>
<body>
  <div class="topbar">
    <h1>🍉 Арбузная площадка</h1>
    <div class="subtitle">Ты — человечек-арбуз. <b>WASD/стрелки</b> — ходить, <b>Пробел/W</b> — прыжок, <b>колесо мыши</b> — зум, <b>E</b> — бросить</div>
    <div class="row">
      <span class="label">Локация:</span>
      <select id="location"></select>
    </div>
    <div class="row" id="tools">
      <button data-tool="grab" class="active">✋ Взять</button>
      <button data-tool="slice">🔪 Резать</button>
      <button data-tool="gun">🔫 Пушка</button>
      <button data-tool="hammer">🔨 Молот</button>
      <button data-tool="bomb">💣 Бомба</button>
      <button data-action="reset" class="danger">🗑️ Сброс</button>
      <button data-action="sound">🔊 Звук</button>
    </div>
    <div class="row" id="items"></div>
    <div class="row" id="props"></div>
    <div class="scoreline">Урон: <b id="score">0</b></div>
  </div>

  <canvas id="game"></canvas>
  <div class="hint" id="hint">✋ Кликни по предмету — возьмёшь в руки. Кликни снова — бросишь.</div>

<script>
(() => {
  const W = 400, H = 240, GROUND = 226, WORLD_W = 2400;
  const canvas = document.getElementById('game');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  let bodies = [], particles = [], explosionQueue = [];
  let activeTool = 'grab', location = 'garden', score = 0, shake = 0, soundOn = true, uid = 0, frame = 0;
  let mouseScreen = { x: W/2, y: H/2 }, mouseWorld = { x: WORLD_W/2, y: GROUND };
  const cam = { x: WORLD_W/2, y: GROUND-84, zoom: 1 };
  const stains = document.createElement('canvas'); stains.width = WORLD_W; stains.height = H;
  const sctx = stains.getContext('2d');
  const scoreEl = document.getElementById('score'), hintEl = document.getElementById('hint');

  const player = { x: WORLD_W/2, y: GROUND-28, vx:0, vy:0, facing:1, onGround:true, held:null, id:0, damage:0, faceT:0 };

  // ---------- Координаты / камера ----------
  function screenToWorld(s){ return { x:(s.x-W/2)/cam.zoom + cam.x, y:(s.y-H/2)/cam.zoom + cam.y }; }
  function worldToScreen(w){ return { x:(w.x-cam.x)*cam.zoom + W/2, y:(w.y-cam.y)*cam.zoom + H/2 }; }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function zoomTo(z){ cam.zoom = clamp(z, 0.5, 2.2); }

  // ---------- Локации ----------
  const LOCATIONS = {
    garden:  { name:'Сад', emoji:'🏡', sky:['#8fd3ff','#dff4ff'], groundTop:'#62c16a', groundBody:'#9a6a3f', gravity:0.32, ambient:'sun' },
    desert:  { name:'Пустыня', emoji:'🏜️', sky:['#ffd9a0','#ffe9c9'], groundTop:'#e8c96a', groundBody:'#c9a24f', gravity:0.32, ambient:'sun' },
    snow:    { name:'Снег', emoji:'❄️', sky:['#cfe8ff','#f2faff'], groundTop:'#eef4ff', groundBody:'#c3d4e8', gravity:0.32, ambient:'snow' },
    moon:    { name:'Луна', emoji:'🌙', sky:['#0b0d1a','#1b1f38'], groundTop:'#8a8a9a', groundBody:'#5a5a6a', gravity:0.12, ambient:'stars' },
    volcano: { name:'Вулкан', emoji:'🌋', sky:['#3a1518','#5a1f22'], groundTop:'#4a4a52', groundBody:'#2e2e36', gravity:0.32, ambient:'embers' }
  };

  // ---------- Предметы ----------
  const ITEMS = {
    watermelon: { name:'Арбуз', emoji:'🍉', radius:26, mass:1, bounce:0.35, shape:'circle',
      outer:'#3fa84f', inner:'#ff6b6b', stripe:'#2c8a3a', seeds:true, face:true, juice:'#ff5d5d', splat:'rgba(150,35,35,0.5)' },
    pineapple: { name:'Ананас', emoji:'🍍', radius:22, mass:1.1, bounce:0.3, shape:'circle',
      outer:'#e0a817', inner:'#ffd970', pattern:true, leaf:true, juice:'#ffd23f', splat:'rgba(200,160,30,0.5)' },
    tomato: { name:'Помидор', emoji:'🍅', radius:20, mass:0.9, bounce:0.2, shape:'circle',
      outer:'#e5484d', inner:'#ff7a7a', leaf:true, face:true, juice:'#ff4d4d', splat:'rgba(180,40,40,0.5)' },
    lemon: { name:'Лимон', emoji:'🍋', radius:18, mass:0.9, bounce:0.3, shape:'oval',
      outer:'#f4d03f', inner:'#fff3a0', face:true, juice:'#f4d03f', splat:'rgba(200,180,40,0.5)' },
    egg: { name:'Яйцо', emoji:'🥚', radius:16, mass:0.7, bounce:0.25, shape:'oval',
      outer:'#f7f0e0', inner:'#ffd23f', egg:true, juice:'#ffd23f', splat:'rgba(220,190,90,0.6)' },
    crate: { name:'Ящик', emoji:'🧱', radius:22, mass:1.6, bounce:0.2, shape:'square',
      outer:'#b5813f', inner:'#8a5a2b', wood:true, juice:'#8a5a2b', splat:'rgba(120,75,35,0.5)' },
    ball: { name:'Мяч', emoji:'🏀', radius:19, mass:0.8, bounce:0.85, shape:'circle', sliceable:false,
      outer:'#e8843a', ball:true },
    balloon: { name:'Шарик', emoji:'🎈', radius:16, mass:0.4, bounce:0.5, shape:'circle', sliceable:false,
      outer:'#ff6b8a', balloon:true },
    tnt: { name:'Динамит', emoji:'🧨', radius:14, mass:1, bounce:0.4, shape:'circle', sliceable:false,
      outer:'#c22', tnt:true },
    anvil: { name:'Гиря', emoji:'🏋️', radius:18, mass:4, bounce:0.05, shape:'anvil', sliceable:false,
      outer:'#5a5a66', heavy:true },
    melonman: { name:'Человек-арбуз', emoji:'🧍', radius:28, mass:1.4, bounce:0.15, shape:'circle', sliceable:false, person:true }
  };
  const PROPS = { trampoline: { name:'Батут', emoji:'🦘' }, fan: { name:'Вентилятор', emoji:'🌀' } };
  const SHIRTS = ['#4a90d9','#e5484d','#f4a261','#8e7cc3','#6aa84f','#e6a817','#2fb6a8'];

  // ---------- Звук ----------
  const AC = window.AudioContext || window.webkitAudioContext; let audio = null;
  function ensureAudio(){ if(!audio){ try{ audio=new AC(); }catch(e){ return; } } if(audio.state==='suspended') audio.resume(); }
  function beep(f,d,t='square',v=0.12,s=0){ if(!soundOn||!audio) return; try{ const o=audio.createOscillator(),g=audio.createGain(); o.type=t; o.frequency.setValueAtTime(f,audio.currentTime); if(s) o.frequency.exponentialRampToValueAtTime(Math.max(30,s),audio.currentTime+d); g.gain.setValueAtTime(v,audio.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+d); o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+d); }catch(e){} }
  function noiseBurst(d=0.18,v=0.25){ if(!soundOn||!audio) return; try{ const l=Math.floor(audio.sampleRate*d), buf=audio.createBuffer(1,l,audio.sampleRate), ch=buf.getChannelData(0); for(let i=0;i<l;i++) ch[i]=(Math.random()*2-1)*(1-i/l); const s=audio.createBufferSource(); s.buffer=buf; const g=audio.createGain(); g.gain.value=v; s.connect(g); g.connect(audio.destination); s.start(); }catch(e){} }
  function sfx(n){
    if(n==='slice'){ noiseBurst(0.08,0.18); beep(900,0.08,'sawtooth',0.05,300); }
    else if(n==='shoot'){ beep(500,0.06,'square',0.08,150); }
    else if(n==='hit'){ beep(160,0.08,'triangle',0.15,90); }
    else if(n==='thud'){ beep(120,0.12,'triangle',0.2,60); }
    else if(n==='boom'){ noiseBurst(0.35,0.4); beep(90,0.3,'sine',0.25,40); }
    else if(n==='spawn'){ beep(300,0.15,'sine',0.1,500); }
    else if(n==='boing'){ beep(250,0.15,'sine',0.15,700); }
    else if(n==='pop'){ noiseBurst(0.05,0.25); beep(600,0.05,'square',0.08,180); }
    else if(n==='jump'){ beep(200,0.08,'sine',0.08,500); }
  }

  // ---------- Геометрия ----------
  function polyCentroid(v){ let A=0,cx=0,cy=0; for(let i=0;i<v.length;i++){ const p=v[i],q=v[(i+1)%v.length],cr=p.x*q.y-q.x*p.y; A+=cr; cx+=(p.x+q.x)*cr; cy+=(p.y+q.y)*cr; } A*=0.5; if(Math.abs(A)<1e-6){ let sx=0,sy=0; v.forEach(p=>{sx+=p.x;sy+=p.y;}); return {x:sx/v.length,y:sy/v.length}; } return {x:cx/(6*A),y:cy/(6*A)}; }
  function polyRadius(v,c){ let m=0; v.forEach(p=>{const dx=p.x-c.x,dy=p.y-c.y; m=Math.max(m,dx*dx+dy*dy);}); return Math.sqrt(m); }
  function polyArea(v){ let A=0; for(let i=0;i<v.length;i++){ const p=v[i],q=v[(i+1)%v.length]; A+=p.x*q.y-q.x*p.y; } return Math.abs(A)*0.5; }
  function shrinkPoly(v,t){ const c=polyCentroid(v); return v.map(p=>{ const dx=p.x-c.x,dy=p.y-c.y,l=Math.hypot(dx,dy)||1; return {x:p.x-dx/l*t,y:p.y-dy/l*t}; }); }
  function pointInPoly(p,poly){ let in_=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const pi=poly[i],pj=poly[j]; if(((pi.y>p.y)!==(pj.y>p.y))&&(p.x<(pj.x-pi.x)*(p.y-pi.y)/(pj.y-pi.y)+pi.x)) in_=!in_; } return in_; }
  function clipPoly(poly,a,b,keep){ const out=[],N=poly.length,dx=b.x-a.x,dy=b.y-a.y,side=p=>dx*(p.y-a.y)-dy*(p.x-a.x); for(let i=0;i<N;i++){ const cur=poly[i],nxt=poly[(i+1)%N],sc=side(cur),sn=side(nxt),ci=keep?sc>=0:sc<=0,ni=keep?sn>=0:sn<=0; if(ci) out.push(cur); if(ci!==ni){ const t=sc/(sc-sn); out.push({x:cur.x+t*(nxt.x-cur.x),y:cur.y+t*(nxt.y-cur.y)}); } } return out; }
  function segDist(p,a,b){ const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy; if(l2===0) return Math.hypot(p.x-a.x,p.y-a.y); let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l2; t=Math.max(0,Math.min(1,t)); return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy)); }
  function fillPoly(v,color){ if(!v||v.length<3) return; ctx.beginPath(); ctx.moveTo(v[0].x,v[0].y); for(let i=1;i<v.length;i++) ctx.lineTo(v[i].x,v[i].y); ctx.closePath(); ctx.fillStyle=color; ctx.fill(); }
  function clipTo(b){ ctx.beginPath(); ctx.moveTo(b.verts[0].x,b.verts[0].y); for(let i=1;i<b.verts.length;i++) ctx.lineTo(b.verts[i].x,b.verts[i].y); ctx.closePath(); ctx.clip(); }

  function circleVerts(r){ const N=24,v=[]; for(let i=0;i<N;i++){ const a=i/N*Math.PI*2; v.push({x:Math.cos(a)*r,y:Math.sin(a)*r}); } return v; }
  function ovalVerts(rx,ry){ const N=24,v=[]; for(let i=0;i<N;i++){ const a=i/N*Math.PI*2; v.push({x:Math.cos(a)*rx,y:Math.sin(a)*ry}); } return v; }
  function squareVerts(r){ return [{x:-r,y:-r},{x:r,y:-r},{x:r,y:r},{x:-r,y:r}]; }
  function anvilVerts(r){ return [{x:-r,y:-r*0.7},{x:r,y:-r*0.7},{x:r*0.6,y:r*0.8},{x:-r*0.6,y:r*0.8}]; }
  function makeSeeds(r){ const s=[],a=[0.55,1.55,2.55,3.7,4.7,5.8]; for(let i=0;i<6;i++){ const t=a[i]; s.push({x:Math.cos(t)*r*0.5,y:Math.sin(t)*r*0.42}); } return s; }

  // ---------- Фабрики ----------
  function makeItem(kind,x,y){
    const d=ITEMS[kind], r=d.radius;
    let verts;
    if(d.shape==='circle') verts=circleVerts(r);
    else if(d.shape==='oval') verts=ovalVerts(r*1.15,r*0.8);
    else if(d.shape==='square') verts=squareVerts(r);
    else verts=anvilVerts(r);
    const flesh = d.inner ? shrinkPoly(verts, r*0.18) : [];
    return { type:'item', kind, verts, flesh, pos:{x,y}, vel:{x:(Math.random()-0.5),y:0}, angle:0, angVel:0,
      radius:r, seeds: d.seeds?makeSeeds(r):[], damage:0, faceT:0, mass:d.mass||1, bounce:d.bounce??0.35,
      sliceable:d.sliceable!==false, dead:false, held:false, facing:1, id:++uid };
  }
  function makeBomb(x,y){ return { type:'bomb', kind:null, verts:[], flesh:[], pos:{x,y:Math.min(y,GROUND-6)}, vel:{x:0,y:0}, angle:0, angVel:0, radius:6, seeds:[], damage:0, faceT:0, mass:1, bounce:0.3, sliceable:false, fuse:70, dead:false, held:false, id:++uid }; }
  function makeBullet(from,to){ const dx=to.x-from.x,dy=to.y-from.y,l=Math.hypot(dx,dy)||1,sp=13; return { type:'bullet', kind:null, verts:[], flesh:[], pos:{x:from.x,y:from.y}, vel:{x:dx/l*sp,y:dy/l*sp}, angle:0, angVel:0, radius:2, seeds:[], damage:0, faceT:0, mass:1, bounce:0, sliceable:false, life:120, dead:false, held:false, id:++uid }; }
  function makeProp(kind,x,y){ const hw = kind==='trampoline'?26:34; return { type:'prop', kind, pos:{x, y:GROUND-6}, halfW:hw, radius:hw, dead:false, held:false, id:++uid }; }

  function sliceBody(body,a,b){
    const cos=Math.cos(-body.angle), sin=Math.sin(-body.angle);
    const toLocal=p=>{ const dx=p.x-body.pos.x,dy=p.y-body.pos.y; return {x:dx*cos-dy*sin,y:dx*sin+dy*cos}; };
    const la=toLocal(a), lb=toLocal(b);
    const pA=clipPoly(body.verts,la,lb,true), pB=clipPoly(body.verts,la,lb,false);
    if(pA.length<3||pB.length<3) return [body];
    const res=[];
    for(const verts of [pA,pB]){
      const c=polyCentroid(verts), v2=verts.map(v=>({x:v.x-c.x,y:v.y-c.y}));
      const r=polyRadius(v2,{x:0,y:0}), wp={x:body.pos.x+c.x*cos-c.y*sin,y:body.pos.y+c.x*sin+c.y*cos};
      const flesh = polyArea(v2)>80 ? shrinkPoly(v2,3) : v2;
      res.push({ type:'piece', kind:body.kind, verts:v2, flesh, pos:wp, vel:{x:body.vel.x,y:body.vel.y},
        angle:body.angle, angVel:body.angVel, radius:r, seeds:body.seeds, damage:0, faceT:0,
        mass:body.mass, bounce:body.bounce, sliceable:true, dead:false, held:false, id:++uid });
    }
    const nx=-(lb.y-la.y), ny=(lb.x-la.x), nl=Math.hypot(nx,ny)||1;
    const wn={x:(nx/nl)*cos-(ny/nl)*sin, y:(nx/nl)*sin+(ny/nl)*cos};
    res[0].vel.x+=wn.x*1.6; res[0].vel.y+=wn.y*1.6; res[1].vel.x-=wn.x*1.6; res[1].vel.y-=wn.y*1.6;
    res[0].angVel+=(Math.random()-0.5)*0.3; res[1].angVel+=(Math.random()-0.5)*0.3;
    return res;
  }

  // ---------- Частицы ----------
  function addParticle(p){ p.grav=p.grav??0; p.splat=p.splat||null; p.removeAtGround=p.removeAtGround||false; particles.push(p); }
  function spawnJuice(x,y,n,color,splat){ color=color||'#ff5d5d'; splat=splat||'rgba(150,35,35,0.5)'; for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,sp=1+Math.random()*3.5; addParticle({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:20+Math.random()*25,maxLife:45,size:2+Math.random()*2,color,grav:0.22,splat}); } }
  function spawnSmoke(x,y,n){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,sp=0.5+Math.random()*1.5; addParticle({x:x+(Math.random()-0.5)*10,y:y+(Math.random()-0.5)*10,vx:Math.cos(a)*sp,vy:-Math.random()*1.2,life:15+Math.random()*20,maxLife:35,size:3+Math.random()*4,color:['#777','#999','#ff9d5c','#555'][Math.floor(Math.random()*4)],grav:0}); } }
  function spawnWood(x,y,n){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,sp=1+Math.random()*3; addParticle({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:20+Math.random()*20,maxLife:40,size:2+Math.random()*2,color:'#8a5a2b',grav:0.3,splat:'rgba(120,75,35,0.5)'}); } }
  function spawnPop(x,y,color){ for(let i=0;i<12;i++){ const a=Math.random()*Math.PI*2,sp=1+Math.random()*3; addParticle({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:10+Math.random()*15,maxLife:25,size:2+Math.random()*2,color,grav:0.05}); } }
  function spawnSnow(){ const vw=(W/2)/cam.zoom; addParticle({x:cam.x-vw+Math.random()*2*vw,y:-2,vx:(Math.random()-0.5)*0.3,vy:0.4+Math.random()*0.6,life:600,maxLife:600,size:1+Math.random()*2,color:'#fff',grav:0,removeAtGround:true}); }
  function spawnEmber(){ const vw=(W/2)/cam.zoom; addParticle({x:cam.x-vw+Math.random()*2*vw,y:GROUND+2,vx:(Math.random()-0.5)*0.5,vy:-(0.6+Math.random()*1.2),life:80,maxLife:80,size:1+Math.random()*2,color:['#ff7b3a','#ffb03a','#ffd23f'][Math.floor(Math.random()*3)],grav:-0.02}); }

  // ---------- Действия ----------
  function pickBody(p){
    for(let i=bodies.length-1;i>=0;i--){ const b=bodies[i]; if(b.dead||b.held) continue;
      if(b.type==='item'||b.type==='piece'||b.type==='bomb'||b.type==='prop'){
        const r = b.type==='prop'? b.halfW : b.radius;
        if(Math.hypot(p.x-b.pos.x,p.y-b.pos.y)<=r+6) return b;
      }
    }
    return null;
  }
  function doSlice(a,b){
    let sliced=false;
    for(let i=bodies.length-1;i>=0;i--){
      const body=bodies[i]; if(body.dead||body.held) continue;
      if(body.type!=='item'&&body.type!=='piece') continue;
      if(body.sliceable===false) continue;
      if(segDist(body.pos,a,b)>body.radius) continue;
      const parts=sliceBody(body,a,b); if(parts.length===1) continue;
      bodies.splice(i,1);
      for(const p of parts){ if(polyArea(p.verts)<60) spawnJuice(p.pos.x,p.pos.y,8, ITEMS[p.kind].juice); else bodies.push(p); }
      sliced=true;
    }
    if(sliced){ score+=5; updateScore(); sfx('slice'); spawnJuice((a.x+b.x)/2,(a.y+b.y)/2,6); }
  }
  function scheduleExplosion(pos,radius,power){ explosionQueue.push({pos:{x:pos.x,y:pos.y},radius,power}); }
  function explode(pos,radius,power){
    shake=16; sfx('boom'); spawnSmoke(pos.x,pos.y,18); spawnJuice(pos.x,pos.y,18);
    for(const b of bodies){ if(b.dead||b.held) continue;
      if(b.type!=='item'&&b.type!=='piece'&&b.type!=='bomb') continue;
      const dd=Math.hypot(b.pos.x-pos.x,b.pos.y-pos.y);
      if(dd<radius){ const f=(radius-dd)/radius, ang=Math.atan2(b.pos.y-pos.y,b.pos.x-pos.x), m=b.mass||1;
        b.vel.x+=Math.cos(ang)*power*f/m; b.vel.y+=Math.sin(ang)*power*f/m-4*f/m; b.angVel+=(Math.random()-0.5)*0.5*f/m;
        if(b.type==='bomb') b.fuse=Math.min(b.fuse,3); else { b.damage++; b.faceT=10; }
        score+=Math.round(3*f)+1;
      }
    }
    updateScore();
  }
  function popBalloon(b){ spawnPop(b.pos.x,b.pos.y,'#ff6b8a'); spawnPop(b.pos.x,b.pos.y,'#ffa6b8'); sfx('pop'); }
  function damageBody(t,vx,vy,factor){
    const m=t.mass||1; t.vel.x+=vx*factor/m; t.vel.y+=vy*factor/m; t.angVel+=(Math.random()-0.5)*0.3/m; t.damage++; t.faceT=12;
    const d=ITEMS[t.kind];
    if(t.type==='item'&&d){ if(d.tnt){ t.dead=true; scheduleExplosion({x:t.pos.x,y:t.pos.y},130,10); return 'boom'; } if(d.balloon){ popBalloon(t); t.dead=true; return 'pop'; } }
    return 'ok';
  }
  function shoot(target){ const from={x:player.x+player.facing*18,y:player.y-12}; bodies.push(makeBullet(from,target)); spawnSmoke(from.x,from.y,3); shake=Math.max(shake,2); sfx('shoot'); }
  function hammer(p){
    const b=pickBody(p);
    if(b){ const m=b.mass||1; b.vel.y+=7/m; b.vel.x+=(Math.random()-0.5)*2/m; b.angVel+=(Math.random()-0.5)*0.6/m;
      b.damage++; b.faceT=12; const d=ITEMS[b.kind];
      if(b.type==='item'&&d){ if(d.tnt){ b.dead=true; scheduleExplosion({x:b.pos.x,y:b.pos.y},130,10); sfx('boom'); }
        else if(d.balloon){ popBalloon(b); b.dead=true; }
        else if(d.wood){ spawnWood(b.pos.x,b.pos.y,6); sfx('thud'); }
        else if(d.juice){ spawnJuice(b.pos.x,b.pos.y,8,d.juice,d.splat); sfx('thud'); }
        else sfx('hit'); }
      score+=2; updateScore(); shake=Math.max(shake,6);
    } else sfx('hit');
  }
  function placeBomb(p){ bodies.push(makeBomb(p.x,p.y)); sfx('spawn'); }
  function spawnItem(kind,x,y){ const b=makeItem(kind,x,y); bodies.push(b); return b; }
  function spawnItemAt(kind){ const d=ITEMS[kind]; const x=clamp(player.x+(Math.random()-0.5)*300, 40, WORLD_W-40); spawnItem(kind, x, player.y-120); }
  function placePropAt(kind){ bodies.push(makeProp(kind, clamp(player.x+player.facing*60, 40, WORLD_W-40), GROUND)); }

  // ---------- Удержание ----------
  function releaseHeld(){
    const h=player.held; if(!h) return;
    h.held=false;
    if(h.type!=='prop'){
      const dx=mouseWorld.x-player.x, dy=mouseWorld.y-player.y, l=Math.hypot(dx,dy)||1;
      h.vel.x=dx/l*9+player.vx*0.5; h.vel.y=dy/l*9-2; h.angVel=(Math.random()-0.5)*0.5;
    }
    player.held=null; sfx('spawn');
  }

  function reset(){
    bodies=[]; particles=[]; explosionQueue=[]; sctx.clearRect(0,0,WORLD_W,H); score=0; updateScore();
    player.x=WORLD_W/2; player.y=GROUND-28; player.vx=0; player.vy=0; player.held=null;
    cam.x=player.x; cam.y=GROUND-84/cam.zoom;
    spawnItem('watermelon',200,GROUND-26); spawnItem('tomato',340,GROUND-20);
    spawnItem('melonman',520,GROUND-28); spawnItem('crate',640,GROUND-22);
    spawnItem('melonman',800,GROUND-28); spawnItem('ball',930,GROUND-19);
    spawnItem('lemon',1080,GROUND-18); spawnItem('melonman',1350,GROUND-28);
    spawnItem('pineapple',1600,GROUND-22); spawnItem('melonman',1900,GROUND-28);
    spawnItem('egg',2150,GROUND-16);
  }
  function updateScore(){ scoreEl.textContent=score; }

  // ---------- UI ----------
  const HINTS={ grab:'✋ Кликни по предмету — возьмёшь. Кликни снова — бросишь.', slice:'🔪 Проведи линией, чтобы разрезать', gun:'🔫 Кликни — выстрел из пушки в точку', hammer:'🔨 Кликни по предмету — удар!', bomb:'💣 Кликни — поставить бомбу' };
  const CURSORS={ grab:'grab', slice:'crosshair', gun:'crosshair', hammer:'crosshair', bomb:'crosshair' };
  function setTool(t){ activeTool=t; document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t)); canvas.style.cursor=CURSORS[t]; hintEl.textContent=HINTS[t]; }
  function flashHint(msg){ hintEl.textContent=msg; setTimeout(()=>{ hintEl.textContent=HINTS[activeTool]; },1400); }
  function setLocation(l){ location=l; sctx.clearRect(0,0,WORLD_W,H); }

  document.querySelectorAll('[data-tool]').forEach(btn=>btn.addEventListener('click',()=>setTool(btn.dataset.tool)));
  document.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>{ ensureAudio(); const a=btn.dataset.action;
    if(a==='reset') reset(); else if(a==='sound'){ soundOn=!soundOn; btn.textContent=soundOn?'🔊 Звук':'🔇 Звук'; } }));

  const itemsEl=document.getElementById('items'), propsEl=document.getElementById('props'), locEl=document.getElementById('location');
  for(const k in ITEMS){ const b=document.createElement('button'); b.textContent=ITEMS[k].emoji+' '+ITEMS[k].name; b.title=ITEMS[k].name; b.addEventListener('click',()=>{ ensureAudio(); spawnItemAt(k); sfx('spawn'); flashHint(ITEMS[k].emoji+' добавлен'); }); itemsEl.appendChild(b); }
  for(const k in PROPS){ const b=document.createElement('button'); b.textContent=PROPS[k].emoji+' '+PROPS[k].name; b.addEventListener('click',()=>{ ensureAudio(); placePropAt(k); sfx('spawn'); flashHint(PROPS[k].emoji+' установлен'); }); propsEl.appendChild(b); }
  for(const k in LOCATIONS){ const o=document.createElement('option'); o.value=k; o.textContent=LOCATIONS[k].emoji+' '+LOCATIONS[k].name; locEl.appendChild(o); }
  locEl.addEventListener('change',()=>setLocation(locEl.value));

  // ---------- Ввод ----------
  const keys={};
  window.addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); keys[k]=true;
    if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(e.key)) e.preventDefault();
    if(k==='e'||k==='у') releaseHeld();
    if(k==='='||k==='+') zoomTo(cam.zoom*1.15);
    if(k==='-') zoomTo(cam.zoom/1.15);
    if(k==='0') zoomTo(1);
  });
  window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); zoomTo(cam.zoom*(e.deltaY>0?0.9:1.1)); },{passive:false});

  function worldPos(e){ const r=canvas.getBoundingClientRect(); return screenToWorld({x:e.clientX-r.left,y:e.clientY-r.top}); }
  let dragging=false, dragBody=null, dragOff={x:0,y:0}, sliceStart=null, sliceCur=null;
  canvas.addEventListener('pointerdown',e=>{ ensureAudio(); const p=worldPos(e); mouseWorld=p;
    if(activeTool==='grab'){
      if(player.held) releaseHeld();
      else { const b=pickBody(p); if(b&&Math.hypot(b.pos.x-player.x,b.pos.y-player.y)<90){ b.held=true; player.held=b; sfx('spawn'); } }
    }
    else if(activeTool==='slice'){ sliceStart=p; sliceCur=p; try{canvas.setPointerCapture(e.pointerId);}catch(_){} }
    else if(activeTool==='gun') shoot(p);
    else if(activeTool==='hammer') hammer(p);
    else if(activeTool==='bomb') placeBomb(p);
  });
  canvas.addEventListener('pointermove',e=>{ const p=worldPos(e); mouseScreen={x:e.clientX,y:e.clientY}; mouseWorld=p;
    if(sliceStart) sliceCur=p;
  });
  canvas.addEventListener('pointerup',()=>{ if(sliceStart){ if(Math.hypot(sliceCur.x-sliceStart.x,sliceCur.y-sliceStart.y)>6) doSlice(sliceStart,sliceCur); sliceStart=null; sliceCur=null; } });

  // ---------- Обновление ----------
  function update(){
    const L=LOCATIONS[location], grav=L.gravity;
    if(location==='snow' && particles.length<500 && Math.random()<0.5) spawnSnow();
    if(location==='volcano' && particles.length<500 && Math.random()<0.4) spawnEmber();

    // Игрок
    const left=keys['a']||keys['arrowleft'], right=keys['d']||keys['arrowright'];
    const jump=keys['w']||keys[' ']||keys['arrowup'];
    const SPEED=3.2, JUMP=9;
    if(left) player.vx=-SPEED; else if(right) player.vx=SPEED; else player.vx*=0.8;
    if(Math.abs(player.vx)<0.05) player.vx=0;
    if(left||right) player.facing = left?-1:1;
    if(mouseWorld.x<player.x) player.facing=-1; else player.facing=1;
    if(jump&&player.onGround){ player.vy=-JUMP; player.onGround=false; sfx('jump'); }
    player.vy+=grav; player.x+=player.vx; player.y+=player.vy;
    if(player.y+28>GROUND){ player.y=GROUND-28; player.vy=0; player.onGround=true; }
    player.x=clamp(player.x,28,WORLD_W-28);

    // Толкание предметов игроком
    for(const b of bodies){ if(b.type!=='item'&&b.type!=='piece') continue; if(b.held) continue;
      const dx=b.pos.x-player.x, dy=b.pos.y-player.y, d=Math.hypot(dx,dy)||1, minD=28+b.radius;
      if(d<minD){ const push=(minD-d)/minD; b.vel.x+=dx/d*push*1.5; b.pos.x+=dx/d*(minD-d)*0.4; } }

    // Удержание
    if(player.held){ const h=player.held; h.pos.x=player.x+player.facing*22; h.pos.y=player.y-8; h.vel.x=0; h.vel.y=0; if(h.angVel)h.angVel=0; }

    for(let i=bodies.length-1;i>=0;i--){
      const b=bodies[i]; if(b.dead) continue; if(b.held) continue;
      if(b.type==='prop') continue;

      if(b.type==='bomb'){
        b.fuse--; b.vel.y+=grav; b.pos.x+=b.vel.x; b.pos.y+=b.vel.y;
        if(b.pos.y+b.radius>GROUND){ b.pos.y=GROUND-b.radius; b.vel.y*=-0.3; b.vel.x*=0.85; }
        if(b.fuse<=0){ b.dead=true; scheduleExplosion(b.pos,110,8); }
        continue;
      }
      if(b.type==='bullet'){
        b.life--; b.pos.x+=b.vel.x; b.pos.y+=b.vel.y; let hit=false;
        for(let j=bodies.length-1;j>=0;j--){ const t=bodies[j]; if(t===b||t.dead||t.held) continue;
          if(t.type!=='item'&&t.type!=='piece') continue;
          if(Math.hypot(b.pos.x-t.pos.x,b.pos.y-t.pos.y)<b.radius+t.radius){ hit=true; damageBody(t,b.vel.x,b.vel.y,0.12);
            const d=ITEMS[t.kind]; spawnJuice(b.pos.x,b.pos.y,8, d&&d.juice?d.juice:'#ff5d5d'); score+=3; updateScore(); shake=Math.max(shake,4); sfx('hit'); break; } }
        if(hit||b.life<=0||b.pos.x<0||b.pos.x>WORLD_W||b.pos.y<0||b.pos.y>H) b.dead=true;
        continue;
      }

      const d=ITEMS[b.kind]||{mass:1,bounce:0.35};
      if(b.type==='item'&&d.balloon){ b.vel.y-=0.45; if(b.vel.y<-0.6) b.vel.y=-0.6; }
      b.vel.y+=grav; b.pos.x+=b.vel.x; b.pos.y+=b.vel.y; b.angle+=b.angVel; if(b.faceT>0) b.faceT--;

      if(b.pos.y+b.radius>GROUND){
        const ivy=-b.vel.y;
        b.pos.y=GROUND-b.radius;
        if(b.vel.y>0.6){ if(d.juice) spawnJuice(b.pos.x,GROUND,Math.min(6,Math.round(ivy)),d.juice,d.splat); else if(d.wood) spawnWood(b.pos.x,GROUND,3); }
        b.vel.y*=-b.bounce; b.vel.x*=0.9; b.angVel*=0.9; if(Math.abs(b.vel.y)<0.5) b.vel.y=0;
        if(b.type==='item'){
          if(d.egg&&ivy>3){ b.damage++; sfx('hit'); }
          if(d.balloon&&ivy>2){ popBalloon(b); b.dead=true; continue; }
          if(d.tnt&&ivy>6){ b.dead=true; scheduleExplosion(b.pos,130,10); continue; }
          if(d.heavy&&ivy>2.5){ shake=Math.max(shake,ivy*2); sfx('thud'); spawnSmoke(b.pos.x,GROUND,6);
            for(const o of bodies){ if(o.dead||o.held||o===b) continue; if(o.type!=='item'&&o.type!=='piece') continue;
              if(Math.hypot(o.pos.x-b.pos.x,o.pos.y-b.pos.y)<40){ o.vel.y-=ivy*0.5; o.vel.x+=(o.pos.x-b.pos.x)*0.05; if(o.type==='item') o.damage++; } } }
        }
      }
      if(b.pos.x-b.radius<0){ b.pos.x=b.radius; b.vel.x*=-0.4; }
      if(b.pos.x+b.radius>WORLD_W){ b.pos.x=WORLD_W-b.radius; b.vel.x*=-0.4; }
      if(b.pos.y<-60&&b.type==='item'&&d.balloon){ popBalloon(b); b.dead=true; continue; }
      if(Math.abs(b.vel.x)<0.02&&b.pos.y+b.radius>=GROUND-0.5&&Math.abs(b.angVel)<0.005){ b.vel.x=0; b.angVel=0; }
      if(b.type==='item'&&d.tnt&&b.damage>=1){ b.dead=true; scheduleExplosion(b.pos,130,10); }
    }

    for(const b of bodies){ if(b.type==='item'&&b.kind==='melonman') b.facing = (player.x < b.pos.x) ? -1 : 1; }
    while(explosionQueue.length){ const e=explosionQueue.shift(); explode(e.pos,e.radius,e.power); }
    for(let i=bodies.length-1;i>=0;i--){ if(bodies[i].dead) bodies.splice(i,1); }

    for(const pr of bodies){ if(pr.type!=='prop') continue;
      if(pr.kind==='trampoline'){ const topY=pr.pos.y-12;
        for(const b of bodies){ if(b.type!=='item'&&b.type!=='piece') continue;
          if(b.vel.y>0&&Math.abs(b.pos.x-pr.pos.x)<pr.halfW&&b.pos.y+b.radius>topY-2&&b.pos.y+b.radius<topY+16){
            b.vel.y=-9; b.pos.y=topY-b.radius; sfx('boing'); } }
      } else if(pr.kind==='fan'){
        for(const b of bodies){ if(b.type!=='item'&&b.type!=='piece') continue;
          if(Math.abs(b.pos.x-pr.pos.x)<pr.halfW*1.5 && b.pos.y<pr.pos.y-6){
            b.vel.x += (pr.pos.x-b.pos.x)*0.03; b.vel.x*=0.98;
            const h = pr.pos.y - b.pos.y;
            const lift = 0.55 * Math.max(0, 1 - h/160);
            if(Math.abs(b.pos.x-pr.pos.x)<pr.halfW){ b.vel.y-=lift; if(b.vel.y<-1.8) b.vel.y=-1.8; }
            if(Math.random()<0.15) addParticle({x:b.pos.x+(Math.random()-0.5)*10,y:b.pos.y,vx:0,vy:-0.5,life:10,maxLife:10,size:1,color:'rgba(200,230,255,0.7)',grav:0}); } }
      }
    }

    for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life--; p.vy+=p.grav; p.x+=p.vx; p.y+=p.vy;
      if(p.splat&&p.y>=GROUND){ sctx.fillStyle=p.splat; for(let k=0;k<4;k++){ sctx.fillRect(p.x+(Math.random()-0.5)*8,GROUND-1+(Math.random()-0.5)*2,2+Math.random()*3,1+Math.random()*2); } particles.splice(i,1); continue; }
      if(p.removeAtGround&&p.y>=GROUND){ particles.splice(i,1); continue; }
      if(p.life<=0||p.y<-40||p.y>H+40){ particles.splice(i,1); continue; } }

    if(bodies.length>220){ for(let i=bodies.length-1;i>=0&&bodies.length>220;i--){ const b=bodies[i]; if(b.type==='piece'&&polyArea(b.verts)<300){ spawnJuice(b.pos.x,b.pos.y,6,ITEMS[b.kind].juice); bodies.splice(i,1); } } }
    if(particles.length>600) particles.splice(0,particles.length-600);

    // Камера
    cam.x += (player.x - cam.x) * 0.12;
    cam.x = clamp(cam.x, (W/2)/cam.zoom, WORLD_W-(W/2)/cam.zoom);
    cam.y = GROUND - 84/cam.zoom;

    if(shake>0) shake*=0.88; if(shake<0.2) shake=0;
    frame++;
  }

  // ---------- Отрисовка ----------
  function drawStars(){ for(let i=0;i<40;i++){ const x=(i*97)%W, y=(i*53)%(GROUND-20), tw=0.5+0.5*Math.sin(frame*0.05+i); ctx.fillStyle='rgba(255,255,255,'+(0.3+0.6*tw).toFixed(2)+')'; ctx.fillRect(x,y, i%5===0?2:1, i%5===0?2:1); } }
  function drawSun(){ ctx.fillStyle='#ffe66d'; ctx.fillRect(W-46,14,22,22); ctx.fillStyle='#fff3b0'; ctx.fillRect(W-42,18,14,14); }
  function drawSky(){ const L=LOCATIONS[location]; const g=ctx.createLinearGradient(0,0,0,GROUND); g.addColorStop(0,L.sky[0]); g.addColorStop(1,L.sky[1]); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); if(L.ambient==='stars') drawStars(); if(L.ambient==='sun') drawSun(); }
  function drawCactusAt(x){ ctx.fillStyle='#3fa84f'; ctx.fillRect(x,GROUND-26,8,26); ctx.fillRect(x-6,GROUND-20,6,12); ctx.fillRect(x+8,GROUND-16,6,10); }
  function drawVolcanoAt(x){ ctx.fillStyle='#2a1a20'; ctx.beginPath(); ctx.moveTo(x-50,GROUND); ctx.lineTo(x,GROUND-70); ctx.lineTo(x+50,GROUND); ctx.closePath(); ctx.fill(); ctx.fillStyle='#ff5d3a'; ctx.fillRect(x-3,GROUND-74,6,6); ctx.fillStyle='#ffb03a'; ctx.fillRect(x-2,GROUND-72,4,4); }
  function drawCraterAt(x){ ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(x,GROUND+2,14,4,0,0,Math.PI*2); ctx.fill(); }
  function drawGround(){ const L=LOCATIONS[location]; ctx.fillStyle=L.groundTop; ctx.fillRect(0,GROUND,WORLD_W,6); ctx.fillStyle=L.groundBody; ctx.fillRect(0,GROUND+6,WORLD_W,H-GROUND-6); ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(0,GROUND+6,WORLD_W,3);
    if(location==='desert'){ for(const x of [350,1500,2150]) drawCactusAt(x); }
    if(location==='volcano') drawVolcanoAt(1700);
    if(location==='moon'){ for(const x of [300,900,1800,2200]) drawCraterAt(x); } }

  function drawFruit(b,d){
    fillPoly(b.verts,d.outer);
    ctx.save(); clipTo(b);
    if(d.stripe){ ctx.fillStyle=d.stripe; const r=b.radius; ctx.fillRect(-0.78*r,-r,0.34*r,2*r); ctx.fillRect(-0.17*r,-r,0.34*r,2*r); ctx.fillRect(0.44*r,-r,0.34*r,2*r); }
    if(d.pattern){ ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1; for(let x=-b.radius;x<=b.radius;x+=7){ ctx.beginPath(); ctx.moveTo(x,-b.radius); ctx.lineTo(x+b.radius,b.radius); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x,b.radius); ctx.lineTo(x+b.radius,-b.radius); ctx.stroke(); } }
    ctx.restore();
    if(d.inner) fillPoly(b.flesh,d.inner);
    if(d.seeds){ ctx.fillStyle='#2b1f1f'; for(const s of b.seeds) ctx.fillRect(s.x-1,s.y-2,2,3); }
    if(d.leaf){ ctx.fillStyle='#3fa84f'; const r=b.radius; ctx.fillRect(-3,-r-3,6,5); ctx.fillRect(-6,-r-1,4,3); ctx.fillRect(2,-r-1,4,3); }
    if(b.damage>=1){ ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1; const n=Math.min(3,b.damage); for(let i=0;i<n;i++){ const a=(i/n)*Math.PI*2+0.3,x=Math.cos(a)*b.radius*0.9,y=Math.sin(a)*b.radius*0.9; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x*0.55,y*0.55); ctx.lineTo(x*0.3+3,y*0.3); ctx.stroke(); } }
    if(d.face) drawFace(b);
  }
  function drawPieceBody(b){ const d=ITEMS[b.kind]||ITEMS.watermelon; fillPoly(b.verts,d.outer); if(d.inner) fillPoly(b.flesh,d.inner); if(d.seeds){ ctx.fillStyle='#2b1f1f'; for(const s of b.seeds){ if(pointInPoly(s,b.flesh)) ctx.fillRect(s.x-1,s.y-2,2,3); } } }
  function drawFace(b){ const d=b.damage,hurt=b.faceT>0,ex=8,ey=-4; ctx.fillStyle='#20161a';
    if(hurt){ ctx.fillRect(-ex-3,ey-1,6,2); ctx.fillRect(ex-3,ey-1,6,2); ctx.fillRect(-4,4,8,2); return; }
    if(d===0){ ctx.fillRect(-ex-2,ey-2,4,4); ctx.fillRect(ex-2,ey-2,4,4); ctx.fillRect(-4,3,8,3); ctx.fillRect(-6,3,2,3); ctx.fillRect(4,3,2,3); }
    else if(d<3){ ctx.fillRect(-ex-1,ey-1,3,3); ctx.fillRect(ex-2,ey-1,3,3); ctx.fillRect(-2,4,4,2); }
    else { ctx.fillRect(-ex-3,ey-2,5,5); ctx.fillRect(ex-2,ey-2,5,5); ctx.fillRect(-5,3,10,6); ctx.fillStyle='#ff9d9d'; ctx.fillRect(-3,5,6,3); ctx.fillStyle='#20161a'; } }
  function drawHeadFace(b,hy){ const d=b.damage,hurt=b.faceT>0; ctx.fillStyle='#20161a'; const o=3;
    if(hurt){ ctx.fillRect(o-3,hy-3,3,2); ctx.fillRect(o+2,hy-3,3,2); ctx.fillRect(o-3,hy+2,6,2); return; }
    if(d===0){ ctx.fillRect(o-2,hy-2,3,3); ctx.fillRect(o+2,hy-2,3,3); ctx.fillRect(o-2,hy+3,5,2); }
    else if(d<3){ ctx.fillRect(o-2,hy-1,3,3); ctx.fillRect(o+2,hy-1,3,3); ctx.fillRect(o-1,hy+3,4,2); }
    else { ctx.fillRect(o-3,hy-2,4,4); ctx.fillRect(o+2,hy-2,4,4); ctx.fillRect(o-4,hy+3,8,4); } }
  function drawMelonMan(b){
    const hy=-17;
    // голова-арбуз
    ctx.fillStyle='#3fa84f'; ctx.beginPath(); ctx.arc(0,hy,11,0,Math.PI*2); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(0,hy,11,0,Math.PI*2); ctx.clip();
    ctx.fillStyle='#2c8a3a'; ctx.fillRect(-8,hy-11,3,22); ctx.fillRect(-1.5,hy-11,3,22); ctx.fillRect(5,hy-11,3,22);
    ctx.restore();
    drawHeadFace(b,hy);
    // голое тело (без одежды)
    ctx.fillStyle='#52b862';
    ctx.fillRect(-8,-6,16,17);       // туловище
    ctx.fillRect(-12,-5,4,15); ctx.fillRect(8,-5,4,15); // руки
    ctx.fillRect(-6,11,5,17); ctx.fillRect(1,11,5,17);  // ноги
  }
  function drawPlayer(){ drawMelonMan(player); ctx.fillStyle='#f4d03f'; ctx.fillRect(-7,-34,14,5); ctx.fillRect(-4,-40,8,6); }
  function drawBall(b){ fillPoly(b.verts,'#e8843a'); ctx.strokeStyle='#6b3410'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(0,0,b.radius*0.99,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-b.radius,0); ctx.lineTo(b.radius,0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,-b.radius); ctx.lineTo(0,b.radius); ctx.stroke(); }
  function drawBalloon(b){ fillPoly(b.verts,'#ff6b8a'); ctx.fillStyle='#ffa6b8'; ctx.fillRect(-2,-b.radius-1,4,4); ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,b.radius); ctx.quadraticCurveTo(3,b.radius+8,0,b.radius+14); ctx.stroke(); ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillRect(-b.radius*0.5,-b.radius*0.4,4,3); }
  function drawTnt(b){ ctx.fillStyle='#c22'; ctx.fillRect(-7,-8,14,16); ctx.fillStyle='#a00'; ctx.fillRect(-7,-8,14,4); ctx.fillStyle='#fff'; ctx.fillRect(-7,-2,14,3); ctx.fillStyle='#c22'; ctx.fillRect(-1,-16,2,8); ctx.fillStyle=Math.floor(frame/6)%2===0?'#fff':'#ffd23f'; ctx.fillRect(-1,-18,2,3); }
  function drawCrate(b){ fillPoly(b.verts,'#b5813f'); ctx.strokeStyle='#8a5a2b'; ctx.lineWidth=2; ctx.strokeRect(-b.radius*0.9,-b.radius*0.9,b.radius*1.8,b.radius*1.8); ctx.beginPath(); ctx.moveTo(-b.radius*0.9,-b.radius*0.9); ctx.lineTo(b.radius*0.9,b.radius*0.9); ctx.stroke(); ctx.beginPath(); ctx.moveTo(b.radius*0.9,-b.radius*0.9); ctx.lineTo(-b.radius*0.9,b.radius*0.9); ctx.stroke(); ctx.fillStyle='#5a3a1f'; ctx.fillRect(-b.radius*0.9-1,-b.radius*0.9-1,3,3); ctx.fillRect(b.radius*0.9-2,-b.radius*0.9-1,3,3); ctx.fillRect(-b.radius*0.9-1,b.radius*0.9-2,3,3); ctx.fillRect(b.radius*0.9-2,b.radius*0.9-2,3,3); }
  function drawAnvil(b){ fillPoly(b.verts,'#5a5a66'); ctx.fillStyle='#3a3a44'; ctx.fillRect(-b.radius*0.6,-b.radius*0.3,b.radius*1.2,b.radius*0.6); ctx.fillStyle='#8a8a99'; ctx.fillRect(-b.radius,-b.radius*0.7,b.radius*2,4); }
  function drawBomb(b){ ctx.fillStyle='#333'; ctx.fillRect(-4,-6,8,12); ctx.fillStyle='#111'; ctx.fillRect(-3,-12,6,6); ctx.fillStyle=Math.floor(b.fuse/6)%2===0?'#fff':'#ffd23f'; ctx.fillRect(-1,-16,2,4); }
  function drawItemBody(b){ const d=ITEMS[b.kind]; if(b.kind==='melonman') drawMelonMan(b); else if(b.kind==='ball') drawBall(b); else if(b.kind==='balloon') drawBalloon(b); else if(b.kind==='tnt') drawTnt(b); else if(b.kind==='crate') drawCrate(b); else if(b.kind==='anvil') drawAnvil(b); else drawFruit(b,d); }
  function drawProp(b){ ctx.save(); ctx.translate(b.pos.x,b.pos.y);
    if(b.kind==='trampoline'){ ctx.fillStyle='#5a5a66'; ctx.fillRect(-b.halfW,-4,b.halfW*2,8); ctx.fillStyle='#e5484d'; ctx.fillRect(-b.halfW,-12,b.halfW*2,8); ctx.fillStyle='#fff'; ctx.fillRect(-b.halfW,-12,b.halfW*2,2); }
    else { ctx.fillStyle='#4a4a5c'; ctx.fillRect(-16,-10,32,20); ctx.fillStyle='#2e2e3e'; ctx.fillRect(-16,-10,32,4); ctx.save(); ctx.translate(0,-8); ctx.rotate(frame*0.3); ctx.fillStyle='#c9ccd6'; for(let i=0;i<3;i++){ ctx.rotate(Math.PI*2/3); ctx.fillRect(-2,-10,4,10); } ctx.restore(); ctx.fillStyle='rgba(180,220,255,0.5)'; ctx.fillRect(-3,-30,6,12); }
    ctx.restore(); }

  function draw(){
    const shx = shake? (Math.random()-0.5)*shake : 0;
    const shy = shake? (Math.random()-0.5)*shake : 0;
    ctx.setTransform(1,0,0,1,0,0);
    drawSky();
    ctx.save();
    ctx.translate(W/2,H/2); ctx.scale(cam.zoom,cam.zoom); ctx.translate(-(cam.x+shx),-(cam.y+shy));
    drawGround();
    ctx.drawImage(stains,0,0);
    for(const b of bodies){
      if(b.type==='bullet'){ ctx.fillStyle='#ffd23f'; ctx.fillRect(b.pos.x-2,b.pos.y-2,4,4); continue; }
      if(b.type==='prop'){ drawProp(b); continue; }
      ctx.save(); ctx.translate(b.pos.x,b.pos.y); ctx.rotate(b.angle);
      if(b.type==='item' && b.kind==='melonman') ctx.scale(b.facing||1, 1);
      if(b.type==='item') drawItemBody(b); else if(b.type==='piece') drawPieceBody(b); else if(b.type==='bomb') drawBomb(b);
      ctx.restore();
    }
    for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life/p.maxLife); ctx.fillStyle=p.color; ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); ctx.globalAlpha=1; }
    // игрок
    ctx.save(); ctx.translate(player.x,player.y); ctx.scale(player.facing,1); drawPlayer(); ctx.restore();
    // прицел / линия разреза
    if(activeTool==='gun'||activeTool==='hammer'){ ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.beginPath(); ctx.moveTo(mouseWorld.x-5,mouseWorld.y); ctx.lineTo(mouseWorld.x+5,mouseWorld.y); ctx.moveTo(mouseWorld.x,mouseWorld.y-5); ctx.lineTo(mouseWorld.x,mouseWorld.y+5); ctx.stroke(); }
    if(sliceStart&&sliceCur){ ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=1; ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(sliceStart.x,sliceStart.y); ctx.lineTo(sliceCur.x,sliceCur.y); ctx.stroke(); ctx.setLineDash([]); }
    ctx.restore();
  }

  function loop(){ update(); draw(); requestAnimationFrame(loop); }

  // ---------- Отладка ----------
  window.__mp = {
    player:()=>({x:Math.round(player.x),y:Math.round(player.y),facing:player.facing,held:player.held?player.held.kind:null}),
    cam:()=>({x:Math.round(cam.x),y:Math.round(cam.y),zoom:+cam.zoom.toFixed(2)}),
    state:()=>bodies.map(b=>b.type+(b.kind?':'+b.kind:'')+':'+Math.round(b.pos.x)+','+Math.round(b.pos.y)),
    spawnItem:k=>spawnItemAt(k), spawnAt:(k,x,y)=>spawnItem(k,x,y), placeProp:k=>placePropAt(k),
    grab:(x,y)=>{ const b=pickBody({x,y}); if(b){ b.held=true; player.held=b; } return b?b.kind:null; },
    release:()=>releaseHeld(), setPlayer:(x,y)=>{player.x=x;player.y=y;}, move:(dx)=>player.x+=dx,
    slice:(x1,y1,x2,y2)=>doSlice({x:x1,y:y1},{x:x2,y:y2}), shoot:(x,y)=>shoot({x,y}),
    hammer:(x,y)=>hammer({x,y}), placeBomb:(x,y)=>placeBomb({x,y}),
    setLocation:l=>setLocation(l), zoomTo, reset, getScore:()=>score, getCount:()=>bodies.length,
    getGravity:()=>LOCATIONS[location].gravity, getLocation:()=>location
  };

  reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
