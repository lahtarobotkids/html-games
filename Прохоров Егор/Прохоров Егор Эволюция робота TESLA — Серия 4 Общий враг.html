<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Эволюция робота TESLA • Серия 4: Общий враг</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #020408;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
      padding: 20px;
    }
    .cartoon-container {
      max-width: 1000px;
      width: 100%;
      background: rgba(6, 8, 16, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 3.5rem;
      padding: 2rem 2rem 2.2rem;
      box-shadow: 0 30px 55px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(70, 100, 230, 0.15);
    }
    h1 {
      text-align: center;
      color: #eef5ff;
      font-weight: 400;
      letter-spacing: 2px;
      font-size: 2.6rem;
      margin-bottom: 0.3rem;
      text-shadow: 0 0 12px #3f6eff80;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    h1 span {
      background: linear-gradient(135deg, #c0d0ff, #7f9bff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }
    .subtitle {
      text-align: center;
      color: #8892b0;
      margin-bottom: 0.8rem;
      font-size: 1.15rem;
      letter-spacing: 0.4px;
    }
    .auto-indicator {
      text-align: center;
      font-size: 0.9rem;
      color: #6d7ea0;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .auto-indicator .dot {
      width: 10px;
      height: 10px;
      background: #4f9eff;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
      100% { opacity: 0.5; transform: scale(0.9); }
    }
    canvas {
      display: block;
      margin: 0 auto;
      width: 100%;
      height: auto;
      background: #0a0d14;
      border-radius: 2.8rem;
      box-shadow: inset 0 0 45px rgba(0, 0, 0, 0.9), 0 18px 35px rgba(0, 15, 40, 0.9);
      border: 1px solid rgba(74, 110, 255, 0.15);
    }
    .timeline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.8rem;
      padding: 0 10px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .stage-btn {
      background: #1e2640;
      border: none;
      color: #b9c8ff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.1rem;
      border-radius: 3rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      background: rgba(30, 38, 64, 0.8);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
      transition: all 0.25s ease;
      border: 1px solid rgba(100, 140, 255, 0.25);
      flex: 1;
      min-width: 80px;
      text-align: center;
    }
    .stage-btn:hover {
      background: #2f3b66;
      color: #ffffff;
      border-color: #6c8aff;
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(0, 80, 255, 0.25);
    }
    .stage-btn.active {
      background: linear-gradient(135deg, #2f4bff, #1e36b0);
      color: white;
      border-color: #aac0ff;
      box-shadow: 0 0 24px #2f4bffaa;
      font-weight: 700;
      transform: scale(1.02);
    }
    .info-panel {
      margin-top: 1.5rem;
      background: rgba(10, 14, 25, 0.7);
      border-radius: 2rem;
      padding: 1.2rem 1.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      border: 1px solid rgba(70, 100, 230, 0.3);
    }
    .robot-name {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(to right, #c6d9ff, #6588ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    .robot-desc {
      color: #cdd6f0;
      font-size: 1rem;
      max-width: 400px;
    }
    .year-badge {
      background: #0f1424;
      color: #a0b9ff;
      padding: 0.3rem 1.2rem;
      border-radius: 5rem;
      font-weight: 600;
      font-size: 1.2rem;
      border: 1px solid #4d6bff;
    }
    @media (max-width: 650px) {
      .timeline {
        flex-direction: row;
        flex-wrap: wrap;
      }
      .stage-btn {
        font-size: 0.8rem;
        padding: 0.5rem 0.7rem;
      }
    }
  </style>
</head>
<body>
<div class="cartoon-container">
  <h1>
    <span>⚡OPTIMUS</span> & <span style="color:#ff5555;">ATLAS</span>
  </h1>
  <div class="subtitle">Серия 4: Общий враг</div>
  <div class="auto-indicator">
    <span class="dot"></span> Автосмена каждые 2 сек
  </div>

  <canvas id="robotCanvas" width="700" height="400" aria-label="Optimus и Atlas против врага"></canvas>

  <div class="timeline" id="timeline">
    <button class="stage-btn active" data-stage="0">🚨 Тревога</button>
    <button class="stage-btn" data-stage="1">💥 Атака</button>
    <button class="stage-btn" data-stage="2">⚠️ Кризис</button>
    <button class="stage-btn" data-stage="3">🤝 Единство</button>
    <button class="stage-btn" data-stage="4">🏆 Победа</button>
  </div>

  <div class="info-panel" id="infoPanel">
    <span class="robot-name" id="robotName">Тревога</span>
    <span class="robot-desc" id="robotDesc">Огромный разрушитель появляется в городе.</span>
    <span class="year-badge" id="yearBadge">2031</span>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('robotCanvas');
    const ctx = canvas.getContext('2d');

    const stages = [
      { year: 2031, name: 'Тревога', desc: 'Огромный разрушитель появляется в городе.' },
      { year: 2031, name: 'Атака', desc: 'Optimus и Atlas бросаются в бой.' },
      { year: 2031, name: 'Кризис', desc: 'Atlas ранен, Optimus держится один.' },
      { year: 2031, name: 'Единство', desc: 'Atlas поднимается! Совместная контратака.' },
      { year: 2031, name: 'Победа', desc: 'Враг повержен. Город спасён.' }
    ];

    let currentStage = 0;
    let animationFrameId = null;
    let animTime = 0;
    let lastTimestamp = 0;
    let autoInterval = null;

    const buttons = document.querySelectorAll('.stage-btn');
    const robotNameEl = document.getElementById('robotName');
    const robotDescEl = document.getElementById('robotDesc');
    const yearBadgeEl = document.getElementById('yearBadge');

    let particles = [];
    const MAX_PARTICLES = 100;

    function spawnParticle(x, y, color, life = 0.5, vx, vy) {
      if (particles.length > MAX_PARTICLES) particles.shift();
      particles.push({
        x, y,
        vx: vx || (Math.random() - 0.5) * 3,
        vy: vy || (Math.random() - 0.5) * 3 - 2,
        life, maxLife: life, color
      });
    }

    function updateParticles(dt) {
      for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt;
      }
      particles = particles.filter(p => p.life > 0);
    }

    function drawParticles(ctx) {
      for (let p of particles) {
        const alpha = Math.min(1, p.life / p.maxLife);
        ctx.fillStyle = p.color.replace('1)', `${alpha})`).replace('rgb', 'rgba');
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.8 * alpha, 0, Math.PI*2);
        ctx.fill();
      }
    }

    function drawBackground(stage, time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Городской фон
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      if (stage === 4) {
        grad.addColorStop(0, '#2a3a4a');
        grad.addColorStop(1, '#0a0f18');
      } else {
        grad.addColorStop(0, '#1a202c');
        grad.addColorStop(1, '#0b0f16');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Здания
      for (let i = 0; i < 10; i++) {
        const hx = 40 + i * 68;
        const hh = 100 + (i % 3) * 40;
        ctx.fillStyle = i % 2 === 0 ? '#1e2836' : '#232e40';
        ctx.fillRect(hx, canvas.height - hh - 40, 30, hh);
        // Окна
        ctx.fillStyle = '#3a4a5a';
        for (let wy = canvas.height - hh - 30; wy < canvas.height - 50; wy += 18) {
          ctx.fillRect(hx + 4, wy, 8, 10);
          ctx.fillRect(hx + 18, wy, 8, 10);
        }
      }
      
      // Дорога
      ctx.fillStyle = '#1a1e26';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      ctx.strokeStyle = '#3a4550';
      ctx.lineWidth = 2;
      ctx.setLineDash([20, 20]);
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 20);
      ctx.lineTo(canvas.width, canvas.height - 20);
      ctx.stroke();
      ctx.setLineDash([]);
      
      // Огонь/разрушения в сценах битвы
      if (stage >= 1 && stage <= 3) {
        for (let i = 0; i < 5; i++) {
          const fx = 120 + i * 120 + Math.sin(time * 5 + i) * 10;
          const fy = canvas.height - 80 - Math.random() * 20;
          ctx.fillStyle = `rgba(255, ${100 + Math.sin(time*10+i)*50}, 0, 0.7)`;
          ctx.beginPath();
          ctx.arc(fx, fy, 8 + Math.sin(time*15+i)*3, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }

    function drawRoundedRect(x, y, w, h, radius, fill, stroke = null, lineWidth = 1.5) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
    }

    function drawRobot(cx, cy, time, type = 'optimus', angry = false, scale = 1.0) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      
      const headY = -60 + Math.sin(time * 2.5) * 1.0;
      const isOptimus = type === 'optimus';
      const metalDark = isOptimus ? '#2a3038' : '#3a2020';
      const metalMid = isOptimus ? '#4e5663' : '#6a4040';
      const jointColor = '#1a1f29';
      
      drawRoundedRect(-22, headY - 18, 44, 38, 12, metalDark, metalMid, 2);
      ctx.fillStyle = jointColor;
      drawRoundedRect(-6, headY + 18, 12, 14, 5, jointColor, '#2f3845', 1);
      
      ctx.save();
      ctx.translate(0, headY);
      ctx.rotate(Math.sin(time * 2) * 0.1);
      if (isOptimus) {
        ctx.fillStyle = '#1a1f2b';
        ctx.beginPath(); ctx.arc(-14, -2, 8, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#4a5b6e'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.beginPath(); ctx.arc(14, -2, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#2f3b4a';
        ctx.beginPath(); ctx.arc(-14, -2, 5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(14, -2, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = angry ? '#ff6666' : '#aaccff';
        ctx.beginPath(); ctx.arc(-12, -3, 2.2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(16, -3, 2.2, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle = '#2a1515';
        ctx.beginPath(); ctx.arc(0, -1, 11, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#6a4040'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = angry ? '#ff4444' : '#cc3333';
        ctx.beginPath(); ctx.arc(0, -1, 5.5, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
      
      const torsoY = headY + 38;
      drawRoundedRect(-25, torsoY, 50, 56, 15, metalDark, metalMid, 2.2);
      ctx.fillStyle = '#0e121c';
      drawRoundedRect(-15, torsoY + 14, 30, 15, 7, '#0b0f17', isOptimus ? '#3d4e6b' : '#4a2a2a', 1);
      ctx.fillStyle = '#c0d0ff';
      ctx.font = 'bold 8px "Segoe UI"';
      ctx.textAlign = 'center';
      ctx.fillText(isOptimus ? 'TESLA' : 'ATLAS', 0, torsoY + 24);
      
      const shoulderY = torsoY + 8;
      const armSwing = Math.sin(time * 2.8) * 2.0;
      
      drawRoundedRect(-38 + armSwing*0.3, shoulderY - 3, 13, 20, 7, metalDark, metalMid, 1.6);
      drawRoundedRect(-42 + armSwing*0.4, shoulderY + 15, 10, 26, 6, metalDark, jointColor, 1.4);
      ctx.fillStyle = isOptimus ? '#4b5560' : '#5a3030';
      drawRoundedRect(-46 + armSwing*0.5, shoulderY + 39, 12, 9, 4, isOptimus ? '#3a424d' : '#4a2020', isOptimus ? '#6b7580' : '#7a4040', 1);
      
      drawRoundedRect(25 - armSwing*0.3, shoulderY - 3, 13, 20, 7, metalDark, metalMid, 1.6);
      drawRoundedRect(32 - armSwing*0.4, shoulderY + 15, 10, 26, 6, metalDark, jointColor, 1.4);
      ctx.fillStyle = isOptimus ? '#4b5560' : '#5a3030';
      drawRoundedRect(34 - armSwing*0.5, shoulderY + 39, 12, 9, 4, isOptimus ? '#3a424d' : '#4a2020', isOptimus ? '#6b7580' : '#7a4040', 1);
      
      const legY = torsoY + 52;
      const legShift = Math.sin(time * 2.5) * 1.5;
      drawRoundedRect(-15 + legShift, legY, 11, 36, 7, metalDark, jointColor, 1.5);
      drawRoundedRect(4 - legShift, legY, 11, 36, 7, metalDark, jointColor, 1.5);
      drawRoundedRect(-20 + legShift, legY + 33, 14, 9, 5, '#212835', '#5a6470', 1.2);
      drawRoundedRect(6 - legShift, legY + 33, 14, 9, 5, '#212835', '#5a6470', 1.2);
      
      ctx.restore();
    }

    function drawEnemy(cx, cy, time, health = 1.0) {
      ctx.save();
      ctx.translate(cx, cy);
      
      const shake = health < 0.3 ? Math.sin(time * 30) * 3 : 0;
      ctx.translate(shake, 0);
      
      // Огромное тело
      drawRoundedRect(-55, -80, 110, 130, 25, '#1a1018', '#4a2030', 3);
      
      // Голова
      drawRoundedRect(-30, -105, 60, 35, 15, '#1a1018', '#4a2030', 2.5);
      ctx.fillStyle = '#330000';
      ctx.beginPath(); ctx.arc(-12, -88, 7, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(12, -88, 7, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff2222';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ff0000';
      ctx.beginPath(); ctx.arc(-10, -88, 3.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(14, -88, 3.5, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      
      // Руки-пушки
      ctx.fillStyle = '#2a1520';
      drawRoundedRect(-75, -50, 25, 60, 10, '#2a1520', '#4a2030', 2);
      drawRoundedRect(50, -50, 25, 60, 10, '#2a1520', '#4a2030', 2);
      ctx.fillStyle = '#ff4400';
      ctx.beginPath(); ctx.arc(-63, 15, 8, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(63, 15, 8, 0, Math.PI*2); ctx.fill();
      
      // Ноги
      drawRoundedRect(-30, 50, 25, 50, 10, '#1a1018', '#4a2030', 2);
      drawRoundedRect(5, 50, 25, 50, 10, '#1a1018', '#4a2030', 2);
      
      // Индикатор здоровья
      ctx.fillStyle = '#330000';
      ctx.fillRect(-40, -130, 80, 10);
      ctx.fillStyle = health > 0.5 ? '#ff4400' : '#ff0000';
      ctx.fillRect(-40, -130, 80 * health, 10);
      
      ctx.restore();
    }

    function drawScene(stage, time) {
      drawBackground(stage, time);
      updateParticles(0.016);
      const t = time;
      
      if (stage === 0) { // Тревога
        drawRobot(150, 240, t, 'optimus', false, 0.9);
        drawRobot(250, 240, t, 'atlas', false, 0.9);
        drawEnemy(500, 220, t, 1.0);
        // Предупредительные частицы
        if (Math.sin(t*3) > 0.5) spawnParticle(480, 150, 'rgb(255,100,0)', 0.6);
      } else if (stage === 1) { // Атака
        const attackCycle = (t % 2) / 2;
        const enemyHealth = 1.0 - attackCycle * 0.3;
        drawRobot(120, 250, t, 'optimus', true, 0.85);
        drawRobot(220, 250, t, 'atlas', true, 0.85);
        drawEnemy(500, 220, t, enemyHealth);
        // Атакующие частицы
        if (Math.sin(t*10) > 0.5) {
          spawnParticle(420, 200, 'rgb(255,200,50)', 0.3, 2, -1);
          spawnParticle(420, 200, 'rgb(100,150,255)', 0.3, 2.5, -1.5);
        }
      } else if (stage === 2) { // Кризис
        drawRobot(140, 260, t, 'optimus', true, 0.9);
        // Atlas лежит
        drawRoundedRect(250, 280, 30, 15, 5, '#3a2020', '#6a4040', 1.5);
        ctx.fillStyle = '#5a3030';
        drawRoundedRect(260, 275, 10, 8, 4, '#4a2020', '#7a4040', 1);
        drawEnemy(480, 220, t, 0.5);
        for (let i = 0; i < 4; i++) spawnParticle(270, 290, 'rgb(255,80,80)', 0.4);
      } else if (stage === 3) { // Единство
        drawRobot(100, 240, t, 'optimus', true, 0.95);
        drawRobot(200, 230, t, 'atlas', true, 0.95);
        drawEnemy(480, 220, t, 0.2);
        // Мощная атака
        for (let i = 0; i < 6; i++) {
          spawnParticle(380, 180, 'rgb(100,200,255)', 0.4, 3, -2);
          spawnParticle(380, 180, 'rgb(255,150,50)', 0.4, 2.5, -1.5);
        }
      } else if (stage === 4) { // Победа
        drawRobot(180, 230, t, 'optimus', false, 0.9);
        drawRobot(520, 230, t, 'atlas', false, 0.9);
        // Поверженный враг
        ctx.save();
        ctx.translate(350, 270);
        ctx.rotate(0.2);
        drawRoundedRect(-50, -10, 100, 20, 10, '#1a1018', '#4a2030', 2);
        ctx.fillStyle = '#ff0000';
        ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        // Салют
        for (let i = 0; i < 15; i++) {
          spawnParticle(350 + Math.sin(i)*20, 150 + Math.cos(i)*20, `rgb(${150+i*10},${200-i*5},255)`, 0.8);
        }
      }

      drawParticles(ctx);
      ctx.font = 'bold 16px "Inter"';
      ctx.fillStyle = '#d0d8ff';
      ctx.fillText(stages[stage].year, canvas.width/2 - 20, 370);
    }

    function animate(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
      animTime += delta;
      lastTimestamp = timestamp;
      drawScene(currentStage, animTime);
      animationFrameId = requestAnimationFrame(animate);
    }

    function updateUIForStage(index) {
      buttons.forEach((btn, idx) => btn.classList.toggle('active', idx === index));
      const d = stages[index];
      robotNameEl.textContent = d.name;
      robotDescEl.textContent = d.desc;
      yearBadgeEl.textContent = d.year;
    }

    function restartAutoAdvance() {
      if (autoInterval) clearInterval(autoInterval);
      autoInterval = setInterval(() => {
        currentStage = (currentStage + 1) % stages.length;
        particles = [];
        updateUIForStage(currentStage);
      }, 2000);
    }

    function setStage(index) {
      if (index === currentStage) { restartAutoAdvance(); return; }
      currentStage = Math.min(Math.max(index, 0), stages.length - 1);
      particles = [];
      updateUIForStage(currentStage);
      restartAutoAdvance();
    }

    buttons.forEach(btn => btn.addEventListener('click', e => setStage(parseInt(e.currentTarget.dataset.stage))));

    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
        this.beginPath();
        this.moveTo(x + r.tl, y);
        this.lineTo(x + w - r.tr, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
        this.lineTo(x + w, y + h - r.br);
        this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
        this.lineTo(x + r.bl, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
        this.lineTo(x, y + r.tl);
        this.quadraticCurveTo(x, y, x + r.tl, y);
        this.closePath();
        return this;
      };
    }

    updateUIForStage(0);
    animationFrameId = requestAnimationFrame(animate);
    restartAutoAdvance();

    window.addEventListener('beforeunload', () => {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      if (autoInterval) clearInterval(autoInterval);
    });
  })();
</script>
</body>
</html>
