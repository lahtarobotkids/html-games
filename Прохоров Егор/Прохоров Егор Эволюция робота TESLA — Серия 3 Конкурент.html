<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Эволюция робота TESLA • Серия 3: Конкурент</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #020408;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
      padding: 20px;
    }
    .cartoon-container {
      max-width: 1000px;
      width: 100%;
      background: rgba(6, 8, 16, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 3.5rem;
      padding: 2rem 2rem 2.2rem;
      box-shadow: 0 30px 55px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(70, 100, 230, 0.15);
    }
    h1 {
      text-align: center;
      color: #eef5ff;
      font-weight: 400;
      letter-spacing: 2px;
      font-size: 2.6rem;
      margin-bottom: 0.3rem;
      text-shadow: 0 0 12px #3f6eff80;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    h1 span {
      background: linear-gradient(135deg, #c0d0ff, #7f9bff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }
    .subtitle {
      text-align: center;
      color: #8892b0;
      margin-bottom: 0.8rem;
      font-size: 1.15rem;
      letter-spacing: 0.4px;
    }
    .auto-indicator {
      text-align: center;
      font-size: 0.9rem;
      color: #6d7ea0;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .auto-indicator .dot {
      width: 10px;
      height: 10px;
      background: #4f9eff;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
      100% { opacity: 0.5; transform: scale(0.9); }
    }
    canvas {
      display: block;
      margin: 0 auto;
      width: 100%;
      height: auto;
      background: #0a0d14;
      border-radius: 2.8rem;
      box-shadow: inset 0 0 45px rgba(0, 0, 0, 0.9), 0 18px 35px rgba(0, 15, 40, 0.9);
      border: 1px solid rgba(74, 110, 255, 0.15);
    }
    .timeline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.8rem;
      padding: 0 10px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .stage-btn {
      background: #1e2640;
      border: none;
      color: #b9c8ff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.1rem;
      border-radius: 3rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      background: rgba(30, 38, 64, 0.8);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
      transition: all 0.25s ease;
      border: 1px solid rgba(100, 140, 255, 0.25);
      flex: 1;
      min-width: 80px;
      text-align: center;
    }
    .stage-btn:hover {
      background: #2f3b66;
      color: #ffffff;
      border-color: #6c8aff;
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(0, 80, 255, 0.25);
    }
    .stage-btn.active {
      background: linear-gradient(135deg, #2f4bff, #1e36b0);
      color: white;
      border-color: #aac0ff;
      box-shadow: 0 0 24px #2f4bffaa;
      font-weight: 700;
      transform: scale(1.02);
    }
    .info-panel {
      margin-top: 1.5rem;
      background: rgba(10, 14, 25, 0.7);
      border-radius: 2rem;
      padding: 1.2rem 1.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      border: 1px solid rgba(70, 100, 230, 0.3);
    }
    .robot-name {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(to right, #c6d9ff, #6588ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    .robot-desc {
      color: #cdd6f0;
      font-size: 1rem;
      max-width: 400px;
    }
    .year-badge {
      background: #0f1424;
      color: #a0b9ff;
      padding: 0.3rem 1.2rem;
      border-radius: 5rem;
      font-weight: 600;
      font-size: 1.2rem;
      border: 1px solid #4d6bff;
    }
    @media (max-width: 650px) {
      .timeline {
        flex-direction: row;
        flex-wrap: wrap;
      }
      .stage-btn {
        font-size: 0.8rem;
        padding: 0.5rem 0.7rem;
      }
    }
  </style>
</head>
<body>
<div class="cartoon-container">
  <h1>
    <span>⚡TESLA</span> vs <span style="color:#ff5555;">ATLAS</span>
  </h1>
  <div class="subtitle">Серия 3: Появление конкурента</div>
  <div class="auto-indicator">
    <span class="dot"></span> Автосмена каждые 2 сек
  </div>

  <canvas id="robotCanvas" width="700" height="400" aria-label="Optimus против Atlas"></canvas>

  <div class="timeline" id="timeline">
    <button class="stage-btn active" data-stage="0">👀 Встреча</button>
    <button class="stage-btn" data-stage="1">⚡ Битва</button>
    <button class="stage-btn" data-stage="2">🏙️ Гонка</button>
    <button class="stage-btn" data-stage="3">🤝 Команда</button>
    <button class="stage-btn" data-stage="4">🌟 Единство</button>
  </div>

  <div class="info-panel" id="infoPanel">
    <span class="robot-name" id="robotName">Первая встреча</span>
    <span class="robot-desc" id="robotDesc">Optimus замечает нового робота в лаборатории.</span>
    <span class="year-badge" id="yearBadge">2026</span>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('robotCanvas');
    const ctx = canvas.getContext('2d');

    const stages = [
      { year: 2026, name: 'Первая встреча', desc: 'Optimus замечает Atlas в цеху.' },
      { year: 2027, name: 'Противостояние', desc: 'Схватка за лидерство: искры летят.' },
      { year: 2028, name: 'Городская гонка', desc: 'Кто быстрее доставит груз?' },
      { year: 2029, name: 'Объединение', desc: 'Совместная сборка космолёта.' },
      { year: 2030, name: 'Новая эра', desc: 'Роботы трудятся вместе на благо людей.' }
    ];

    let currentStage = 0;
    let animationFrameId = null;
    let animTime = 0;
    let lastTimestamp = 0;
    let autoInterval = null;

    const buttons = document.querySelectorAll('.stage-btn');
    const robotNameEl = document.getElementById('robotName');
    const robotDescEl = document.getElementById('robotDesc');
    const yearBadgeEl = document.getElementById('yearBadge');

    let particles = [];
    const MAX_PARTICLES = 70;

    function spawnParticle(x, y, color, life = 0.5, vx, vy) {
      if (particles.length > MAX_PARTICLES) particles.shift();
      particles.push({
        x, y,
        vx: vx || (Math.random() - 0.5) * 2,
        vy: vy || (Math.random() - 0.5) * 2 - 1.5,
        life, maxLife: life, color
      });
    }

    function updateParticles(dt) {
      for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt;
      }
      particles = particles.filter(p => p.life > 0);
    }

    function drawParticles(ctx) {
      for (let p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.fillStyle = p.color.replace('1)', `${alpha})`).replace('rgb', 'rgba');
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.2 * alpha, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // Фон сцены
    function drawBackground(stage, time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if (stage === 0) { // Лаборатория / цех
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#1a1c24');
        grad.addColorStop(1, '#0f1118');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Пол с сеткой
        ctx.strokeStyle = '#2a3040';
        ctx.lineWidth = 0.6;
        for (let i = 0; i < canvas.width; i += 50) {
          ctx.beginPath(); ctx.moveTo(i, canvas.height*0.7); ctx.lineTo(i, canvas.height); ctx.stroke();
        }
        for (let j = canvas.height*0.7; j < canvas.height; j += 30) {
          ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
        }
        // Стеклянная камера на заднем плане
        ctx.fillStyle = 'rgba(20,30,45,0.4)';
        ctx.strokeStyle = 'rgba(80,130,220,0.5)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(canvas.width/2-120, 60, 240, 260, 30);
        ctx.fill();
        ctx.stroke();
      } else if (stage === 1) { // Арена / битва
        ctx.fillStyle = '#0c0e14';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Пол арены
        for (let i = 0; i < canvas.width; i += 30) {
          ctx.fillStyle = i%60===0 ? '#1e2530' : '#151a24';
          ctx.fillRect(i, canvas.height-60, 30, 60);
        }
        // Зрители (схематично)
        for (let i = 0; i < 12; i++) {
          ctx.fillStyle = '#304050';
          ctx.beginPath();
          ctx.arc(50+i*55, canvas.height-90, 15, 0, Math.PI);
          ctx.fill();
        }
      } else if (stage === 2) { // Город
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#1e2a3a');
        grad.addColorStop(1, '#0b1118');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < 9; i++) {
          const hx = 55 + i*75;
          ctx.fillStyle = '#1f2a38';
          ctx.fillRect(hx, canvas.height-140, 30, 140);
          ctx.fillStyle = '#2f3e50';
          for (let j = 0; j < 5; j++) {
            ctx.fillRect(hx+4, canvas.height-130+j*22, 8, 10);
            ctx.fillRect(hx+18, canvas.height-130+j*22, 8, 10);
          }
        }
      } else if (stage === 3) { // Космическая верфь
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < 70; i++) {
          const sx = (i*37 + time*5) % canvas.width;
          const sy = (i*23) % canvas.height;
          ctx.fillStyle = `rgba(255,255,255,${0.4+Math.sin(time+i)*0.3})`;
          ctx.beginPath(); ctx.arc(sx, sy, 1.3, 0, Math.PI*2); ctx.fill();
        }
        ctx.fillStyle = '#2a3a5a';
        ctx.beginPath(); ctx.ellipse(canvas.width/2, canvas.height+30, 350, 50, 0, 0, Math.PI*2); ctx.fill();
      } else { // Будущее
        ctx.fillStyle = '#0a0f1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#1a3050';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < canvas.width; i += 35) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }
        for (let j = 0; j < canvas.height; j += 35) {
          ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
        }
      }
    }

    function drawRoundedRect(x, y, w, h, radius, fill, stroke = null, lineWidth = 1.5) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
    }

    // Рисование Optimus (Tesla)
    function drawOptimus(cx, cy, time, angry = false) {
      const headY = cy - 72 + Math.sin(time * 2.5) * 1.3;
      drawRoundedRect(cx - 26, headY - 22, 52, 44, 14, '#2a3038', '#4e5663', 2.2);
      ctx.fillStyle = '#1a1f29';
      drawRoundedRect(cx - 7, headY + 20, 14, 16, 5, '#1a1f29', '#2f3845', 1.2);
      
      ctx.save();
      ctx.translate(cx, headY);
      ctx.rotate(Math.sin(time * 2) * 0.1);
      const eyeGlow = angry ? 0.9 : 0.7;
      ctx.fillStyle = '#1a1f2b';
      ctx.beginPath(); ctx.arc(-17, -3, 9, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#4a5b6e'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(17, -3, 9, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2f3b4a';
      ctx.beginPath(); ctx.arc(-17, -3, 6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(17, -3, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = `rgba(170,204,255,${eyeGlow})`;
      ctx.beginPath(); ctx.arc(-15, -4, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(19, -4, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      const torsoY = headY + 44;
      drawRoundedRect(cx - 30, torsoY, 60, 68, 18, '#2a3038', '#4e5663', 2.4);
      ctx.fillStyle = '#0e121c';
      drawRoundedRect(cx - 18, torsoY + 16, 36, 18, 8, '#0b0f17', '#3d4e6b', 1.2);
      ctx.fillStyle = '#c0d0ff';
      ctx.font = 'bold 9px "Segoe UI"';
      ctx.textAlign = 'center';
      ctx.fillText('TESLA', cx, torsoY + 28);

      const shoulderY = torsoY + 10;
      const armSwing = Math.sin(time * 3) * 2.5;
      drawRoundedRect(cx - 45 + armSwing*0.3, shoulderY - 4, 16, 24, 8, '#2a3038', '#5a6270', 1.8);
      drawRoundedRect(cx - 51 + armSwing*0.5, shoulderY + 18, 12, 32, 7, '#2a3038', '#1a1f29', 1.5);
      ctx.fillStyle = '#4b5560';
      drawRoundedRect(cx - 57 + armSwing*0.6, shoulderY + 48, 14, 10, 5, '#3a424d', '#6b7580', 1);
      drawRoundedRect(cx + 29 - armSwing*0.3, shoulderY - 4, 16, 24, 8, '#2a3038', '#5a6270', 1.8);
      drawRoundedRect(cx + 39 - armSwing*0.5, shoulderY + 18, 12, 32, 7, '#2a3038', '#1a1f29', 1.5);
      ctx.fillStyle = '#4b5560';
      drawRoundedRect(cx + 43 - armSwing*0.6, shoulderY + 48, 14, 10, 5, '#3a424d', '#6b7580', 1);

      const legY = torsoY + 64;
      const legShift = Math.sin(time * 2.5) * 1.8;
      drawRoundedRect(cx - 18 + legShift, legY, 13, 44, 8, '#2a3038', '#1a1f29', 1.7);
      drawRoundedRect(cx + 5 - legShift, legY, 13, 44, 8, '#2a3038', '#1a1f29', 1.7);
      drawRoundedRect(cx - 24 + legShift, legY + 40, 16, 10, 6, '#212835', '#5a6470', 1.3);
      drawRoundedRect(cx + 8 - legShift, legY + 40, 16, 10, 6, '#212835', '#5a6470', 1.3);
    }

    // Рисование Atlas (конкурент)
    function drawAtlas(cx, cy, time, angry = false) {
      const headY = cy - 68 + Math.sin(time * 2.2) * 1.0;
      // Голова с одним большим глазом
      drawRoundedRect(cx - 24, headY - 20, 48, 40, 12, '#3a2020', '#6a4040', 2);
      ctx.fillStyle = '#1a0f0f';
      drawRoundedRect(cx - 6, headY + 18, 12, 14, 4, '#1a0f0f', '#3a2020', 1);
      ctx.save();
      ctx.translate(cx, headY);
      ctx.rotate(Math.sin(time * 1.8) * 0.08);
      ctx.fillStyle = '#2a1515';
      ctx.beginPath(); ctx.arc(0, -2, 12, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#6a4040'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = angry ? '#ff4444' : '#cc3333';
      ctx.beginPath(); ctx.arc(0, -2, 6, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      const torsoY = headY + 40;
      drawRoundedRect(cx - 34, torsoY, 68, 74, 20, '#3a2020', '#6a4040', 2.6);
      ctx.fillStyle = '#1a0f0f';
      drawRoundedRect(cx - 20, torsoY + 18, 40, 20, 10, '#1a0f0f', '#4a2a2a', 1.5);
      ctx.fillStyle = '#ff8888';
      ctx.font = 'bold 9px "Segoe UI"';
      ctx.textAlign = 'center';
      ctx.fillText('ATLAS', cx, torsoY + 30);

      const shoulderY = torsoY + 12;
      const armSwing = Math.sin(time * 2.7) * 2.2;
      drawRoundedRect(cx - 48 + armSwing*0.3, shoulderY - 5, 18, 26, 9, '#3a2020', '#6a4040', 1.8);
      drawRoundedRect(cx - 54 + armSwing*0.5, shoulderY + 19, 14, 34, 7, '#3a2020', '#1a0f0f', 1.5);
      ctx.fillStyle = '#5a3030';
      drawRoundedRect(cx - 60 + armSwing*0.6, shoulderY + 51, 16, 12, 5, '#4a2020', '#7a4040', 1);
      drawRoundedRect(cx + 30 - armSwing*0.3, shoulderY - 5, 18, 26, 9, '#3a2020', '#6a4040', 1.8);
      drawRoundedRect(cx + 40 - armSwing*0.5, shoulderY + 19, 14, 34, 7, '#3a2020', '#1a0f0f', 1.5);
      ctx.fillStyle = '#5a3030';
      drawRoundedRect(cx + 44 - armSwing*0.6, shoulderY + 51, 16, 12, 5, '#4a2020', '#7a4040', 1);

      const legY = torsoY + 70;
      const legShift = Math.sin(time * 2.3) * 2.0;
      drawRoundedRect(cx - 20 + legShift, legY, 15, 46, 9, '#3a2020', '#1a0f0f', 1.8);
      drawRoundedRect(cx + 5 - legShift, legY, 15, 46, 9, '#3a2020', '#1a0f0f', 1.8);
      drawRoundedRect(cx - 26 + legShift, legY + 42, 20, 14, 7, '#2a1515', '#5a3030', 1.4);
      drawRoundedRect(cx + 6 - legShift, legY + 42, 20, 14, 7, '#2a1515', '#5a3030', 1.4);
    }

    function drawScene(stage, time) {
      drawBackground(stage, time);
      updateParticles(0.016);
      const t = time;

      if (stage === 0) { // Встреча
        drawOptimus(200, 215, t, false);
        drawAtlas(500, 215, t, false);
        // Частицы удивления
        if (Math.sin(t*4) > 0.8) spawnParticle(350, 180, 'rgb(100,150,255)', 0.5);
      } else if (stage === 1) { // Битва
        drawOptimus(180, 225, t, true);
        drawAtlas(520, 225, t, true);
        // Удары и искры
        if (Math.sin(t*8) > 0.7) {
          spawnParticle(250, 160, 'rgb(255,200,50)', 0.3, 1.5, -1);
          spawnParticle(450, 160, 'rgb(255,80,80)', 0.3, -1.5, -1);
        }
      } else if (stage === 2) { // Гонка
        const pos1 = 150 + Math.sin(t*6) * 25;
        const pos2 = 550 - Math.sin(t*6) * 25;
        drawOptimus(pos1, 220, t, false);
        drawAtlas(pos2, 220, t, false);
        spawnParticle(pos1+20, 200, 'rgb(100,150,255)', 0.4);
        spawnParticle(pos2-20, 200, 'rgb(255,100,100)', 0.4);
      } else if (stage === 3) { // Команда (собирают спутник)
        drawOptimus(220, 210, t, false);
        drawAtlas(480, 210, t, false);
        // Деталь между ними
        ctx.fillStyle = '#5a7a9a';
        drawRoundedRect(310, 175, 80, 30, 10, '#4a6a8a', '#8aacc0', 2);
        // Оба тянутся к детали
      } else if (stage === 4) { // Единство
        drawOptimus(260, 220, t, false);
        drawAtlas(440, 220, t, false);
        // Рукопожатие
        ctx.fillStyle = '#4b5560';
        drawRoundedRect(320, 190, 10, 15, 5, '#3a424d', '#6b7580', 1);
        ctx.fillStyle = '#5a3030';
        drawRoundedRect(370, 190, 10, 15, 5, '#4a2020', '#7a4040', 1);
        // Мирные частицы
        spawnParticle(350, 170, 'rgb(150,200,255)', 0.8);
        spawnParticle(350, 170, 'rgb(255,150,150)', 0.8);
      }

      drawParticles(ctx);
      ctx.font = 'bold 16px "Inter"';
      ctx.fillStyle = '#d0d8ff';
      ctx.fillText(stages[stage].year, canvas.width/2 - 20, 370);
    }

    function animate(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
      animTime += delta;
      lastTimestamp = timestamp;
      drawScene(currentStage, animTime);
      animationFrameId = requestAnimationFrame(animate);
    }

    function updateUIForStage(index) {
      buttons.forEach((btn, idx) => btn.classList.toggle('active', idx === index));
      const d = stages[index];
      robotNameEl.textContent = d.name;
      robotDescEl.textContent = d.desc;
      yearBadgeEl.textContent = d.year;
    }

    function restartAutoAdvance() {
      if (autoInterval) clearInterval(autoInterval);
      autoInterval = setInterval(() => {
        currentStage = (currentStage + 1) % stages.length;
        particles = [];
        updateUIForStage(currentStage);
      }, 2000);
    }

    function setStage(index) {
      if (index === currentStage) { restartAutoAdvance(); return; }
      currentStage = Math.min(Math.max(index, 0), stages.length - 1);
      particles = [];
      updateUIForStage(currentStage);
      restartAutoAdvance();
    }

    buttons.forEach(btn => btn.addEventListener('click', e => setStage(parseInt(e.currentTarget.dataset.stage))));

    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
        this.beginPath();
        this.moveTo(x + r.tl, y);
        this.lineTo(x + w - r.tr, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
        this.lineTo(x + w, y + h - r.br);
        this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
        this.lineTo(x + r.bl, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
        this.lineTo(x, y + r.tl);
        this.quadraticCurveTo(x, y, x + r.tl, y);
        this.closePath();
        return this;
      };
    }

    updateUIForStage(0);
    animationFrameId = requestAnimationFrame(animate);
    restartAutoAdvance();

    window.addEventListener('beforeunload', () => {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      if (autoInterval) clearInterval(autoInterval);
    });
  })();
</script>
</body>
</html>
