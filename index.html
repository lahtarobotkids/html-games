<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML игры</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
      background: #111318;
      color: #f5f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 10%, rgba(57, 117, 255, 0.24), transparent 34%),
        radial-gradient(circle at 80% 90%, rgba(0, 190, 150, 0.18), transparent 32%),
        #111318;
    }

    main {
      width: min(760px, 100%);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(32px, 7vw, 58px);
      line-height: 1;
    }

    p {
      margin: 0 0 28px;
      color: #b8c0d4;
      font-size: 18px;
      line-height: 1.5;
    }

    .games {
      display: grid;
      gap: 12px;
    }

    a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 64px;
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      color: inherit;
      text-decoration: none;
      font-size: 20px;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    a:hover,
    a:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.12);
      outline: none;
    }

    span {
      color: #9debd6;
      font-size: 22px;
      padding-left: 14px;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      p {
        font-size: 16px;
      }

      a {
        font-size: 17px;
        min-height: 58px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>HTML игры</h1>
    <p>Выберите игру. Страница работает с компьютера и смартфона.</p>
    <nav class="games" aria-label="Список игр">
      <a href="Маша%20Mobile%20Legends/Маша%20Mobile%20Legends.html">Маша Mobile Legends <span aria-hidden="true">›</span></a>
      <a href="Смартфон%20Маша%20Mobile%20Legends/Смартфон%20Маша%20Mobile%20Legends.html">Смартфон Маша Mobile Legends <span aria-hidden="true">›</span></a>
      <a href="Тимофей/Тимофей%20BUBG.html">Тимофей BUBG <span aria-hidden="true">›</span></a>
      <a href="Тимофей/Тимофей%20паркур.html">Тимофей паркур <span aria-hidden="true">›</span></a>
      <a href="Смартфон%20Тимофей/Смартфон%20Тимофей%20BUBG.html">Смартфон Тимофей BUBG <span aria-hidden="true">›</span></a>
      <a href="Смартфон%20Тимофей/Смартфон%20Тимофей%20паркур.html">Смартфон Тимофей паркур <span aria-hidden="true">›</span></a>
    </nav>
  </main>
</body>
</html>
