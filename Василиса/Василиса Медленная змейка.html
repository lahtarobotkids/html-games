<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Медленная змейка</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #eee;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #111;
            border: 2px solid #555;
            display: block;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        label {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4caf50;
            border: none;
            color: white;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
        .score {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🐍 Медленная змейка</h1>
    <div class="score">Счёт: <span id="scoreDisplay">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls">
        <label>
            Скорость (мс/шаг):
            <input type="range" id="speedSlider" min="50" max="500" value="200" step="10">
            <span id="speedValue">200</span> мс
        </label>
        <button id="restartButton">Новая игра</button>
    </div>

    <script>
        (function () {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const scoreDisplay = document.getElementById('scoreDisplay');
            const speedSlider = document.getElementById('speedSlider');
            const speedValue = document.getElementById('speedValue');
            const restartButton = document.getElementById('restartButton');

            // Размер одной ячейки и количество ячеек по горизонтали/вертикали
            const CELL_SIZE = 20;
            const COLS = canvas.width / CELL_SIZE;   // 20
            const ROWS = canvas.height / CELL_SIZE;  // 20

            // Начальное состояние змейки
            let snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            // Направление: dx, dy
            let direction = { dx: 1, dy: 0 };
            let nextDirection = { dx: 1, dy: 0 };
            let food = { x: 15, y: 10 };
            let gameOver = false;
            let score = 0;
            let gameInterval = null;

            // Скорость в миллисекундах (чем больше число, тем медленнее)
            let speed = parseInt(speedSlider.value, 10); // по умолчанию 200

            // Отображение скорости на экране
            speedValue.textContent = speed;

            // ---------- Вспомогательные функции ----------
            function randomFoodPosition() {
                // Генерируем случайную позицию, не совпадающую со змейкой
                const snakeSet = new Set(snake.map(seg => `${seg.x},${seg.y}`));
                const freeCells = [];
                for (let row = 0; row < ROWS; row++) {
                    for (let col = 0; col < COLS; col++) {
                        if (!snakeSet.has(`${col},${row}`)) {
                            freeCells.push({ x: col, y: row });
                        }
                    }
                }
                if (freeCells.length === 0) {
                    // Победа — всё поле занято
                    return null;
                }
                return freeCells[Math.floor(Math.random() * freeCells.length)];
            }

            function draw() {
                // Очистка
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Рисуем еду
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(food.x * CELL_SIZE, food.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

                // Рисуем змейку
                snake.forEach((segment, index) => {
                    ctx.fillStyle = index === 0 ? '#66ff66' : '#2ecc71'; // голова ярче
                    ctx.fillRect(segment.x * CELL_SIZE, segment.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    ctx.strokeStyle = '#111';
                    ctx.strokeRect(segment.x * CELL_SIZE, segment.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                });

                // Если игра окончена, показываем сообщение
                if (gameOver) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = 'white';
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('Игра окончена!', canvas.width / 2, canvas.height / 2);
                    ctx.textAlign = 'start';
                }
            }

            function moveSnake() {
                if (gameOver) return;

                // Применяем запланированное направление
                direction = { ...nextDirection };

                // Новая голова
                const head = snake[0];
                const newHead = {
                    x: head.x + direction.dx,
                    y: head.y + direction.dy
                };

                // Проверка столкновения со стенами
                if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
                    gameOver = true;
                    stopGame();
                    draw();
                    return;
                }

                // Проверка столкновения с самой собой (кроме хвоста, который сейчас сдвинется)
                // Хвост убирается в этом же кадре, если не съели еду, поэтому можно проверить
                // все сегменты, кроме последнего (который исчезнет, если не будет еды).
                // Но надёжнее: проверяем, есть ли newHead в snake без последнего элемента,
                // если мы не едим. Для упрощения будем проверять все сегменты текущей змейки,
                // исключая последний, т.к. он может переместиться.
                const willEat = (newHead.x === food.x && newHead.y === food.y);
                const bodyToCheck = willEat ? snake : snake.slice(0, -1); // если едим, хвост не убирается
                if (bodyToCheck.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
                    gameOver = true;
                    stopGame();
                    draw();
                    return;
                }

                // Добавляем новую голову
                snake.unshift(newHead);

                if (willEat) {
                    // Еда съедена
                    score++;
                    scoreDisplay.textContent = score;
                    const newFood = randomFoodPosition();
                    if (newFood) {
                        food = newFood;
                    } else {
                        // Победа: всё поле занято (можно считать концом игры или начать заново)
                        gameOver = true;
                        stopGame();
                        draw();
                        alert('Поздравляем! Вы заполнили всё поле!');
                        return;
                    }
                } else {
                    // Убираем хвост
                    snake.pop();
                }

                draw();
            }

            function startGame() {
                if (gameInterval) clearInterval(gameInterval);
                gameInterval = setInterval(moveSnake, speed);
            }

            function stopGame() {
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
            }

            function restartGame() {
                stopGame();
                snake = [
                    { x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 }
                ];
                direction = { dx: 1, dy: 0 };
                nextDirection = { dx: 1, dy: 0 };
                gameOver = false;
                score = 0;
                scoreDisplay.textContent = score;
                // Размещаем еду так, чтобы не перекрывала начальную змейку
                food = { x: 15, y: 10 };
                // Если начальная змейка уже там, подберём другое место
                if (snake.some(seg => seg.x === food.x && seg.y === food.y)) {
                    const newFood = randomFoodPosition();
                    if (newFood) food = newFood;
                }
                draw();
                startGame();
            }

            // ---------- Обработчики клавиш ----------
            document.addEventListener('keydown', (e) => {
                if (gameOver) return;

                const key = e.key;
                // Стрелки и WASD
                if (key === 'ArrowUp' || key === 'w' || key === 'W') {
                    if (direction.dy === 0) { // нельзя развернуться на 180
                        nextDirection = { dx: 0, dy: -1 };
                    }
                } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
                    if (direction.dy === 0) {
                        nextDirection = { dx: 0, dy: 1 };
                    }
                } else if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
                    if (direction.dx === 0) {
                        nextDirection = { dx: -1, dy: 0 };
                    }
                } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
                    if (direction.dx === 0) {
                        nextDirection = { dx: 1, dy: 0 };
                    }
                }
            });

            // ---------- Изменение скорости ----------
            speedSlider.addEventListener('input', () => {
                speed = parseInt(speedSlider.value, 10);
                speedValue.textContent = speed;
                if (!gameOver) {
                    // Перезапускаем интервал с новой скоростью
                    stopGame();
                    startGame();
                }
            });

            // ---------- Кнопка рестарта ----------
            restartButton.addEventListener('click', restartGame);

            // ---------- Запуск игры ----------
            draw();
            startGame();
        })();
    </script>
</body>
</html>
