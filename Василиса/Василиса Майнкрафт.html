<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Classic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      overflow: hidden;
      background: #000;
    }
    iframe { display: block; }
  </style>
</head>
<body>
  <iframe src="https://classic.minecraft.net/" allowfullscreen></iframe>
  <script>
    // Автофокус на iframe для захвата ввода
    window.onload = () => {
      const iframe = document.querySelector('iframe');
      iframe.focus();
      // Дополнительный клик для обхода политики автозапуска
      iframe.addEventListener('load', () => {
        setTimeout(() => iframe.focus(), 100);
      });
    };
    // Разрешаем полноэкранный режим по двойному клику
    document.addEventListener('dblclick', () => {
      document.querySelector('iframe').requestFullscreen?.();
    });
  </script>
</body>
</html>
