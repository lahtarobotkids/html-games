<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Мини Roblox</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 12px 18px;
      border-radius: 10px;
      pointer-events: none;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="info">
    🎮 <b>Мини Roblox</b><br>
    WASD – ходить<br>
    Пробел – прыгать<br>
    Левая кнопка мыши – поставить блок<br>
    Клавиша F – удалить блок (на центр экрана)<br>
    Правая кнопка + движение мыши – вращать камеру
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------- СЦЕНА ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 20, 50);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(8, 6, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // ---------- ОСВЕЩЕНИЕ ----------
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(15, 25, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 80;
    sun.shadow.camera.left = -20;
    sun.shadow.camera.right = 20;
    sun.shadow.camera.top = 20;
    sun.shadow.camera.bottom = -20;
    scene.add(sun);
    
    scene.add(new THREE.AmbientLight(0x6688cc, 0.5));

    // ---------- ЗЕМЛЯ И БЛОКИ ----------
    const floorGeometry = new THREE.BoxGeometry(30, 0.3, 30);
    const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x7c9c5e, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.position.y = -0.15;
    floor.receiveShadow = true;
    floor.castShadow = true;
    floor.name = 'ground';
    scene.add(floor);

    // Массив всех твёрдых объектов (для рейкастинга)
    const solidObjects = [floor];

    // Несколько стартовых блоков для примера
    function addBlock(x, y, z, color = 0xc9a96e) {
      const geo = new THREE.BoxGeometry(1, 1, 1);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.4 });
      const block = new THREE.Mesh(geo, mat);
      block.position.set(x, y, z);
      block.castShadow = true;
      block.receiveShadow = true;
      scene.add(block);
      solidObjects.push(block);
      return block;
    }
    addBlock(2, 0.5, 2, 0xd9b382);
    addBlock(-2, 0.5, -2, 0xb08d6a);
    addBlock(0, 0.5, -3, 0xd4a76a);
    addBlock(3, 1.5, -1, 0xbf9b6e);
    addBlock(-3, 1.5, 1, 0xc5a076);

    // ---------- ПЕРСОНАЖ ----------
    const player = new THREE.Group();
    player.position.set(0, 1.6, 0);

    // Голова
    const head = new THREE.Mesh(
      new THREE.BoxGeometry(0.6, 0.6, 0.6),
      new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.3 })
    );
    head.position.y = 1.5;
    head.castShadow = true;
    player.add(head);

    // Тело
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 1.0, 0.4),
      new THREE.MeshStandardMaterial({ color: 0x3498db, roughness: 0.4 })
    );
    body.position.y = 0.9;
    body.castShadow = true;
    player.add(body);

    // Руки
    const armLeft = new THREE.Mesh(
      new THREE.BoxGeometry(0.2, 0.8, 0.2),
      new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.3 })
    );
    armLeft.position.set(-0.5, 1.0, 0);
    armLeft.castShadow = true;
    player.add(armLeft);
    
    const armRight = armLeft.clone();
    armRight.position.set(0.5, 1.0, 0);
    player.add(armRight);

    // Ноги
    const legLeft = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 0.8, 0.3),
      new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.5 })
    );
    legLeft.position.set(-0.2, 0.4, 0);
    legLeft.castShadow = true;
    player.add(legLeft);
    
    const legRight = legLeft.clone();
    legRight.position.set(0.2, 0.4, 0);
    player.add(legRight);

    scene.add(player);

    // ---------- ФИЗИКА ИГРОКА ----------
    const velocity = new THREE.Vector3();
    const playerSpeed = 5.5;
    const jumpPower = 7;
    const gravity = -14;
    let onGround = false;

    // ---------- КАМЕРА ----------
    const cameraState = {
      theta: 0,           // горизонтальный угол
      phi: 1.0,           // вертикальный угол (0 = горизонт, PI/2 = верх)
      distance: 7,
      minPhi: 0.2,
      maxPhi: Math.PI / 2 - 0.1
    };

    // ---------- УПРАВЛЕНИЕ ----------
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (['Space','KeyW','KeyA','KeyS','KeyD','KeyF'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', e => {
      keys[e.code] = false;
      e.preventDefault();
    });

    // Вращение камеры правой кнопкой мыши
    let rightMouseDown = false;
    let prevMouse = { x: 0, y: 0 };

    window.addEventListener('mousedown', e => {
      if (e.button === 2) {
        rightMouseDown = true;
        prevMouse.x = e.clientX;
        prevMouse.y = e.clientY;
      }
    });
    window.addEventListener('mouseup', e => {
      if (e.button === 2) rightMouseDown = false;
    });
    window.addEventListener('mousemove', e => {
      if (!rightMouseDown) return;
      const dx = e.clientX - prevMouse.x;
      const dy = e.clientY - prevMouse.y;
      cameraState.theta -= dx * 0.008;
      cameraState.phi -= dy * 0.008;
      cameraState.phi = Math.max(cameraState.minPhi, Math.min(cameraState.maxPhi, cameraState.phi));
      prevMouse.x = e.clientX;
      prevMouse.y = e.clientY;
    });
    window.addEventListener('contextmenu', e => e.preventDefault());

    // ---------- СТРОИТЕЛЬСТВО И УДАЛЕНИЕ ----------
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // Поставить блок (левая кнопка мыши)
    window.addEventListener('click', e => {
      if (e.button !== 0) return;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(solidObjects);
      if (intersects.length === 0) return;
      
      const hit = intersects[0];
      const normal = hit.face.normal.clone();
      normal.transformDirection(hit.object.matrixWorld);
      
      // Позиция нового блока (центр грани)
      const pos = hit.point.clone().add(normal.multiplyScalar(0.5));
      // Округляем до сетки 1x1
      pos.x = Math.round(pos.x);
      pos.y = Math.round(pos.y);
      pos.z = Math.round(pos.z);
      
      // Не даём поставить блок, если там уже что-то есть
      if (solidObjects.some(obj => obj.position.distanceTo(pos) < 0.1)) return;
      // Не даём поставить блок прямо в игроке
      if (player.position.distanceTo(pos) < 1.0) return;
      
      addBlock(pos.x, pos.y, pos.z, Math.random() * 0xffffff);
    });

    // Удалить блок (клавиша F) – в центр экрана
    window.addEventListener('keydown', e => {
      if (e.code !== 'KeyF') return;
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObjects(solidObjects);
      if (intersects.length === 0) return;
      const obj = intersects[0].object;
      if (obj === floor || obj === player) return; // пол и персонаж неудаляемы
      scene.remove(obj);
      const idx = solidObjects.indexOf(obj);
      if (idx > -1) solidObjects.splice(idx, 1);
    });

    // ---------- ИГРОВОЙ ЦИКЛ ----------
    let lastTime = performance.now();

    function animate(time) {
      requestAnimationFrame(animate);
      const delta = Math.min(0.1, (time - lastTime) / 1000);
      lastTime = time;

      // Направление камеры
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      camDir.y = 0;
      camDir.normalize();
      
      const camRight = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0, 1, 0)).normalize();
      
      // Направление движения игрока
      const moveDir = new THREE.Vector3(0, 0, 0);
      if (keys['KeyW']) moveDir.add(camDir);
      if (keys['KeyS']) moveDir.sub(camDir);
      if (keys['KeyA']) moveDir.sub(camRight);
      if (keys['KeyD']) moveDir.add(camRight);
      if (moveDir.length() > 0) moveDir.normalize();

      // Скорость по горизонтали
      velocity.x = moveDir.x * playerSpeed;
      velocity.z = moveDir.z * playerSpeed;
      
      // Гравитация
      velocity.y += gravity * delta;
      
      // Перемещение
      player.position.x += velocity.x * delta;
      player.position.y += velocity.y * delta;
      player.position.z += velocity.z * delta;

      // Проверка земли (рейкаст вниз из нижней части персонажа)
      onGround = false;
      const rayOrigin = player.position.clone().add(new THREE.Vector3(0, 0.2, 0));
      raycaster.set(rayOrigin, new THREE.Vector3(0, -1, 0));
      const hits = raycaster.intersectObjects(solidObjects);
      if (hits.length > 0 && hits[0].distance < 0.5) {
        player.position.y = hits[0].point.y;
        velocity.y = 0;
        onGround = true;
      }

      // Прыжок
      if (keys['Space'] && onGround) {
        velocity.y = jumpPower;
        onGround = false;
      }

      // Плавный поворот персонажа в сторону движения
      if (moveDir.length() > 0.001) {
        const targetAngle = Math.atan2(moveDir.x, moveDir.z);
        let diff = targetAngle - player.rotation.y;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        player.rotation.y += diff * Math.min(1, 12 * delta);
      }

      // Позиция камеры (сферические координаты вокруг игрока)
      const cosPhi = Math.cos(cameraState.phi);
      const sinPhi = Math.sin(cameraState.phi);
      const camOffset = new THREE.Vector3(
        cosPhi * Math.sin(cameraState.theta),
        sinPhi,
        cosPhi * Math.cos(cameraState.theta)
      ).multiplyScalar(cameraState.distance);
      
      const targetCamPos = player.position.clone().add(camOffset);
      camera.position.lerp(targetCamPos, 0.15);
      camera.lookAt(
        player.position.x,
        player.position.y + 1.2,
        player.position.z
      );

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    // Адаптация окна
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
