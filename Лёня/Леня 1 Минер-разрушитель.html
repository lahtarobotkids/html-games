<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блоки: Разрушитель - Арена</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        #gameCanvas {
            border: 3px solid #e94560;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Размеры
        canvas.width = 900;
        canvas.height = 600;
        
        // Игрок 1
        const player1 = {
            x: 200,
            y: 300,
            width: 40,
            height: 40,
            speed: 6,
            health: 100,
            maxHealth: 100,
            color: '#00d2ff',
            bombs: [],
            bombCooldown: 0,
            maxBombs: 5
        };
        
        // Игрок 2 (бот)
        const player2 = {
            x: 700,
            y: 300,
            width: 40,
            height: 40,
            speed: 3,
            health: 100,
            maxHealth: 100,
            color: '#ff6b35',
            bombs: [],
            bombCooldown: 0,
            maxBombs: 5,
            aiTimer: 0,
            aiDirection: { x: 0, y: 0 }
        };
        
        // Разрушаемые блоки
        let blocks = [];
        const BLOCK_SIZE = 40;
        
        // Частицы
        let particles = [];
        
        // Взрывы
        let explosions = [];
        
        // Счет
        let score = 0;
        let gameTime = 0;
        let gameOver = false;
        let winner = '';
        
        // Управление
        const keys = {};
        
        // Генерация блоков
        function generateBlocks() {
            blocks = [];
            const cols = Math.floor(canvas.width / BLOCK_SIZE);
            const rows = Math.floor(canvas.height / BLOCK_SIZE);
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    // Пропускаем центр и места спавна игроков
                    const blockX = col * BLOCK_SIZE;
                    const blockY = row * BLOCK_SIZE;
                    
                    // Зоны безопасности для игроков
                    const safeZone1 = Math.abs(blockX - 200) < 80 && Math.abs(blockY - 300) < 80;
                    const safeZone2 = Math.abs(blockX - 700) < 80 && Math.abs(blockY - 300) < 80;
                    
                    // Случайное размещение блоков
                    if (!safeZone1 && !safeZone2 && Math.random() < 0.4) {
                        // Разные типы блоков
                        const blockType = Math.random();
                        let health, color;
                        
                        if (blockType < 0.6) {
                            health = 1;
                            color = '#8b7355'; // Дерево
                        } else if (blockType < 0.85) {
                            health = 2;
                            color = '#808080'; // Камень
                        } else {
                            health = 3;
                            color = '#4a4a4a'; // Железо
                        }
                        
                        blocks.push({
                            x: blockX,
                            y: blockY,
                            width: BLOCK_SIZE,
                            height: BLOCK_SIZE,
                            health: health,
                            maxHealth: health,
                            color: color
                        });
                    }
                }
            }
        }
        
        class Bomb {
            constructor(x, y, owner) {
                this.x = x;
                this.y = y;
                this.timer = 120; // 2 секунды при 60fps
                this.radius = 80;
                this.owner = owner;
                this.exploded = false;
            }
            
            update() {
                this.timer--;
                if (this.timer <= 0 && !this.exploded) {
                    this.explode();
                    return true;
                }
                return false;
            }
            
            explode() {
                this.exploded = true;
                explosions.push(new Explosion(this.x, this.y, this.radius));
                
                // Урон игрокам
                const dist1 = getDistance(this.x, this.y, player1.x + player1.width/2, player1.y + player1.height/2);
                const dist2 = getDistance(this.x, this.y, player2.x + player2.width/2, player2.y + player2.height/2);
                
                if (dist1 < this.radius) {
                    const damage = Math.floor((1 - dist1 / this.radius) * 40);
                    if (this.owner !== player1) player1.health -= damage;
                }
                
                if (dist2 < this.radius) {
                    const damage = Math.floor((1 - dist2 / this.radius) * 40);
                    if (this.owner !== player2) player2.health -= damage;
                }
                
                // Разрушение блоков
                for (let i = blocks.length - 1; i >= 0; i--) {
                    const block = blocks[i];
                    const blockCenterX = block.x + block.width/2;
                    const blockCenterY = block.y + block.height/2;
                    const dist = getDistance(this.x, this.y, blockCenterX, blockCenterY);
                    
                    if (dist < this.radius) {
                        block.health--;
                        createParticles(blockCenterX, blockCenterY, block.color, 5);
                        
                        if (block.health <= 0) {
                            createParticles(blockCenterX, blockCenterY, '#ffd700', 15);
                            blocks.splice(i, 1);
                            score += 10;
                        }
                    }
                }
                
                createParticles(this.x, this.y, '#ff4444', 20);
            }
            
            draw() {
                // Мигание перед взрывом
                const alpha = 0.5 + Math.sin(this.timer * 0.3) * 0.5;
                
                ctx.fillStyle = `rgba(255, 100, 100, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 15, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
                ctx.fill();
                
                // Индикатор времени
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 18, -Math.PI/2, -Math.PI/2 + (this.timer / 120) * Math.PI * 2);
                ctx.stroke();
            }
        }
        
        class Explosion {
            constructor(x, y, maxRadius) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = maxRadius;
                this.life = 1.0;
            }
            
            update() {
                this.radius += (this.maxRadius - this.radius) * 0.2;
                this.life -= 0.03;
                return this.life > 0;
            }
            
            draw() {
                const alpha = this.life;
                ctx.fillStyle = `rgba(255, 150, 50, ${alpha * 0.3})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = `rgba(255, 200, 100, ${alpha * 0.5})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = `rgba(255, 255, 200, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 4 + 2;
                this.speedX = (Math.random() - 0.5) * 8;
                this.speedY = (Math.random() - 0.5) * 8;
                this.life = 1.0;
                this.gravity = 0.2;
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += this.gravity;
                this.life -= 0.02;
                this.radius *= 0.98;
                return this.life > 0;
            }
            
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }
        
        function getDistance(x1, y1, x2, y2) {
            return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
        }
        
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        
        function placeBomb(player) {
            if (player.bombs.length < player.maxBombs && player.bombCooldown <= 0) {
                const bombX = player.x + player.width / 2;
                const bombY = player.y + player.height / 2;
                player.bombs.push(new Bomb(bombX, bombY, player));
                player.bombCooldown = 30; // Полсекунды кулдаун
            }
        }
        
        function botAI() {
            if (gameOver) return;
            
            // Случайное движение
            player2.aiTimer--;
            if (player2.aiTimer <= 0) {
                player2.aiDirection = {
                    x: (Math.random() - 0.5) * 2,
                    y: (Math.random() - 0.5) * 2
                };
                player2.aiTimer = 60 + Math.random() * 60;
            }
            
            // Избегание бомб
            for (let bomb of player1.bombs) {
                const dist = getDistance(player2.x, player2.y, bomb.x, bomb.y);
                if (dist < 100) {
                    player2.aiDirection.x = (player2.x - bomb.x) / dist;
                    player2.aiDirection.y = (player2.y - bomb.y) / dist;
                }
            }
            
            // Атака игрока
            const distToPlayer = getDistance(player2.x, player2.y, player1.x, player1.y);
            if (distToPlayer < 200 && Math.random() < 0.02) {
                placeBomb(player2);
            }
            
            // Случайные бомбы
            if (Math.random() < 0.01) {
                placeBomb(player2);
            }
            
            // Движение
            const newX = player2.x + player2.aiDirection.x * player2.speed;
            const newY = player2.y + player2.aiDirection.y * player2.speed;
            
            const newRect = {
                x: newX,
                y: newY,
                width: player2.width,
                height: player2.height
            };
            
            let canMoveX = true;
            let canMoveY = true;
            
            // Проверка столкновений с блоками
            for (let block of blocks) {
                if (checkCollision({...newRect, y: player2.y}, block)) canMoveX = false;
                if (checkCollision({...newRect, x: player2.x}, block)) canMoveY = false;
            }
            
            if (canMoveX) player2.x = newX;
            if (canMoveY) player2.y = newY;
            
            // Границы
            player2.x = Math.max(0, Math.min(canvas.width - player2.width, player2.x));
            player2.y = Math.max(0, Math.min(canvas.height - player2.height, player2.y));
        }
        
        function handleInput() {
            if (gameOver) return;
            
            // Игрок 1 управление
            const newX1 = player1.x + ((keys['d'] || keys['D'] ? 1 : 0) - (keys['a'] || keys['A'] ? 1 : 0)) * player1.speed;
            const newY1 = player1.y + ((keys['s'] || keys['S'] ? 1 : 0) - (keys['w'] || keys['W'] ? 1 : 0)) * player1.speed;
            
            const newRect1 = {
                x: newX1,
                y: newY1,
                width: player1.width,
                height: player1.height
            };
            
            let canMoveX1 = true;
            let canMoveY1 = true;
            
            for (let block of blocks) {
                if (checkCollision({...newRect1, y: player1.y}, block)) canMoveX1 = false;
                if (checkCollision({...newRect1, x: player1.x}, block)) canMoveY1 = false;
            }
            
            if (canMoveX1) player1.x = newX1;
            if (canMoveY1) player1.y = newY1;
            
            player1.x = Math.max(0, Math.min(canvas.width - player1.width, player1.x));
            player1.y = Math.max(0, Math.min(canvas.height - player1.height, player1.y));
            
            // Бомбы
            if (keys[' '] || keys['Space']) {
                placeBomb(player1);
            }
        }
        
        function drawHUD() {
            // Здоровье игрока 1
            ctx.fillStyle = '#333';
            ctx.fillRect(10, 10, 204, 24);
            ctx.fillStyle = player1.color;
            ctx.fillRect(12, 12, (player1.health / player1.maxHealth) * 200, 20);
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.fillText(`Игрок ${Math.ceil(player1.health)}%`, 20, 28);
            
            // Здоровье игрока 2
            ctx.fillStyle = '#333';
            ctx.fillRect(canvas.width - 214, 10, 204, 24);
            ctx.fillStyle = player2.color;
            ctx.fillRect(canvas.width - 212, 12, (player2.health / player2.maxHealth) * 200, 20);
            ctx.fillStyle = '#fff';
            ctx.fillText(`Бот ${Math.ceil(player2.health)}%`, canvas.width - 120, 28);
            
            // Счет и время
            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`Счет: ${score} | Время: ${Math.floor(gameTime / 60)}с`, canvas.width / 2, 30);
            ctx.textAlign = 'left';
            
            // Бомбы
            ctx.fillStyle = '#ff0';
            ctx.font = '16px Arial';
            ctx.fillText(`Бомбы: ${player1.bombs.length}/${player1.maxBombs}`, 20, 50);
            
            // Подсказки
            ctx.fillStyle = '#aaa';
            ctx.font = '14px Arial';
            ctx.fillText('WASD - движение | ПРОБЕЛ - бомба | R - рестарт', 20, canvas.height - 10);
        }
        
        function drawGame() {
            // Фон
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Сетка
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += BLOCK_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += BLOCK_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Блоки
            blocks.forEach(block => {
                ctx.fillStyle = block.color;
                ctx.fillRect(block.x, block.y, block.width, block.height);
                ctx.strokeStyle = '#000';
                ctx.strokeRect(block.x, block.y, block.width, block.height);
                
                // Трещины при повреждении
                if (block.health < block.maxHealth) {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < (block.maxHealth - block.health); i++) {
                        ctx.beginPath();
                        ctx.moveTo(block.x + Math.random() * block.width, block.y);
                        ctx.lineTo(block.x + Math.random() * block.width, block.y + block.height);
                        ctx.stroke();
                    }
                }
            });
            
            // Бомбы
            player1.bombs.forEach(bomb => bomb.draw());
            player2.bombs.forEach(bomb => bomb.draw());
            
            // Взрывы
            explosions.forEach(explosion => explosion.draw());
            
            // Частицы
            particles.forEach(particle => particle.draw());
            
            // Игрок 1
            ctx.fillStyle = player1.color;
            ctx.fillRect(player1.x, player1.y, player1.width, player1.height);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(player1.x, player1.y, player1.width, player1.height);
            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('P1', player1.x + player1.width/2, player1.y + player1.height/2 + 7);
            ctx.textAlign = 'left';
            
            // Игрок 2
            ctx.fillStyle = player2.color;
            ctx.fillRect(player2.x, player2.y, player2.width, player2.height);
            ctx.strokeRect(player2.x, player2.y, player2.width, player2.height);
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.fillText('BOT', player2.x + player2.width/2, player2.y + player2.height/2 + 7);
            ctx.textAlign = 'left';
        }
        
        function update() {
            if (gameOver) return;
            
            gameTime++;
            
            // Кулдауны
            if (player1.bombCooldown > 0) player1.bombCooldown--;
            if (player2.bombCooldown > 0) player2.bombCooldown--;
            
            // Обновление бомб
            player1.bombs = player1.bombs.filter(bomb => !bomb.update());
            player2.bombs = player2.bombs.filter(bomb => !bomb.update());
            
            // Обновление взрывов
            explosions = explosions.filter(explosion => explosion.update());
            
            // Обновление частиц
            particles = particles.filter(particle => particle.update());
            
            // ИИ бота
            botAI();
            
            // Проверка победы
            if (player1.health <= 0) {
                gameOver = true;
                winner = 'Бот';
                createParticles(player1.x, player1.y, player1.color, 30);
            }
            if (player2.health <= 0) {
                gameOver = true;
                winner = 'Игрок';
                createParticles(player2.x, player2.y, player2.color, 30);
            }
        }
        
        function gameLoop() {
            handleInput();
            update();
            drawGame();
            drawHUD();
            
            // Экран победы
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = winner === 'Игрок' ? '#00d2ff' : '#ff6b35';
                ctx.font = '60px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`${winner} победил!`, canvas.width/2, canvas.height/2 - 30);
                
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.fillText(`Счет: ${score} | Время: ${Math.floor(gameTime / 60)}с`, canvas.width/2, canvas.height/2 + 20);
                ctx.fillText('Нажмите R для новой игры', canvas.width/2, canvas.height/2 + 50);
                ctx.textAlign = 'left';
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Обработчики
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'r' || e.key === 'R') restartGame();
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        function restartGame() {
            player1.x = 200;
            player1.y = 300;
            player1.health = 100;
            player1.bombs = [];
            player1.bombCooldown = 0;
            
            player2.x = 700;
            player2.y = 300;
            player2.health = 100;
            player2.bombs = [];
            player2.bombCooldown = 0;
            
            particles = [];
            explosions = [];
            score = 0;
            gameTime = 0;
            gameOver = false;
            winner = '';
            
            generateBlocks();
        }
        
        // Старт
        generateBlocks();
        gameLoop();
    </script>
</body>
</html>
