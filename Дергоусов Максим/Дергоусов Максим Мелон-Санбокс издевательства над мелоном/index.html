<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍉 Мелон-Санбокс — издевательства над мелоном</title>
<style>
  :root { --green:#2e9e3d; --red:#e63b3b; --pink:#ff4fa3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#10131f;
    font-family:'Segoe UI', system-ui, sans-serif; color:#fff;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #game { position:fixed; inset:0; display:block; }

  #topbar { position:fixed; top:0; left:0; right:0; z-index:6; pointer-events:none;
    padding:12px 16px; display:flex; align-items:center; gap:14px; }
  #stats { font-size:15px; font-weight:700; color:rgba(255,255,255,.9); text-shadow:0 1px 3px #000; white-space:nowrap; }

  #toolbar { position:fixed; left:0; right:0; bottom:0; z-index:6; padding:10px;
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap; background:linear-gradient(transparent, rgba(0,0,0,.55)); }
  .tool { pointer-events:auto; border:2px solid rgba(255,255,255,.2); border-radius:14px;
    background:rgba(20,24,40,.85); color:#fff; padding:8px 12px; font-size:14px; font-weight:600;
    cursor:pointer; transition:all .12s; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .tool .ic { font-size:24px; }
  .tool .k { font-size:10px; color:rgba(255,255,255,.5); }
  .tool.sel { border-color:var(--pink); background:rgba(255,79,163,.22); box-shadow:0 0 16px rgba(255,79,163,.5); }

  #toast { position:fixed; top:18%; left:50%; transform:translateX(-50%) scale(.8); z-index:8;
    font-size:34px; font-weight:800; color:#fff; text-shadow:0 0 20px rgba(255,0,60,.8), 0 2px 6px #000;
    opacity:0; pointer-events:none; transition:all .25s; white-space:nowrap; }
  #toast.show { opacity:1; transform:translateX(-50%) scale(1); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="topbar">
  <div id="stats">Мелонов: 1 · Урона: 0 · Убито: 0</div>
</div>

<div id="toast">💥 Мелон уничтожен!</div>
<div id="toolbar"></div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const $stats = document.getElementById('stats');
  const $toast = document.getElementById('toast');
  const $toolbar = document.getElementById('toolbar');

  const TAU = Math.PI * 2;
  let W = 0, H = 0, floorY = 0;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    floorY = H - 90;
    for (const m of melons) if (!m.dead && m.y + m.r > floorY) m.y = floorY - m.r;
  }
  window.addEventListener('resize', resize);

  // ==================== АУДИО ====================
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function nowAudio() { return audioCtx ? audioCtx.currentTime : 0; }
  function tone(freq, type, vol, dur, when, slideTo) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, when);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), when + dur);
    g.gain.setValueAtTime(vol, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(when); o.stop(when + dur + 0.03);
  }
  function noise(vol, dur, when, lp) {
    if (!audioCtx) return;
    const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    let node = src;
    if (lp) { const f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; src.connect(f); node = f; }
    const g = audioCtx.createGain(); g.gain.value = vol;
    node.connect(g); g.connect(audioCtx.destination);
    src.start(when);
  }
  const snd = {
    punch() { const n = nowAudio(); tone(120, 'sine', .35, .12, n, 50); noise(.3, .07, n, 900); },
    slap()  { const n = nowAudio(); tone(200, 'triangle', .3, .1, n, 80); noise(.25, .05, n, 1400); },
    slice() { const n = nowAudio(); noise(.35, .18, n, 6000); tone(900, 'sawtooth', .08, .12, n, 200); },
    shoot() { const n = nowAudio(); tone(700, 'square', .18, .06, n, 200); },
    boom()  { const n = nowAudio(); noise(.6, .5, n, 500); tone(60, 'sine', .5, .5, n, 30); },
    hammer(){ const n = nowAudio(); tone(180, 'square', .35, .12, n, 60); noise(.3, .08, n, 700); },
    splat() { const n = nowAudio(); noise(.3, .12, n, 500); tone(150, 'triangle', .2, .1, n, 60); },
    throw_(){ const n = nowAudio(); noise(.2, .2, n, 2500); },
    pop()   { const n = nowAudio(); tone(300, 'sine', .25, .12, n, 600); },
    moan(dmg) {
      const n = nowAudio();
      const f = 320 + Math.random() * 180;
      tone(f, 'triangle', .12 + Math.min(.1, dmg * .002), .3, n, f * .5);
    }
  };

  // ==================== СОСТОЯНИЕ ====================
  const MAX_MELONS = Infinity; // безлимит мелонов/арбузов
  const melons = []; // массив мелонов

  function makeMelon(x, y) {
    return {
      x, y, vx: 0, vy: 0, rot: 0, vrot: 0, r: 70,
      sx: 1, sy: 1, hp: 100, maxHp: 100,
      dead: false, hurtUntil: 0, grabbed: false, grabOffX: 0, grabOffY: 0
    };
  }
  function spawnMelon(x, y) {
    if (melons.length >= MAX_MELONS) { toast('🍉 Слишком много мелонов!'); return null; }
    const m = makeMelon(x, Math.min(y, floorY - 70), 0);
    melons.push(m);
    snd.pop();
    juiceExplosion(m.x, m.y, 4, 120);
    return m;
  }

  let halves = [], projectiles = [], bombs = [], weights = [], particles = [], decals = [];
  let slash = { active: false, pts: [], life: 0 };
  let hammer = null; // {x, t}
  let grabbedMelon = null;
  let shake = 0, flash = 0;
  let damageDealt = 0, kills = 0;
  let blinkUntil = 0, nextBlink = 0;

  const GRAVITY = 1600;
  const TOOLS = [
    { id: 'punch',  name: 'Кулак', icon: '👊', key: '1', cur: 'grabbing' },
    { id: 'drag',   name: 'Тянуть', icon: '🖐️', key: '2', cur: 'grab' },
    { id: 'slice',  name: 'Резать', icon: '🔪', key: '3', cur: 'crosshair' },
    { id: 'shoot',  name: 'Пушка', icon: '🔫', key: '4', cur: 'crosshair' },
    { id: 'bomb',   name: 'Бомба', icon: '💣', key: '5', cur: 'crosshair' },
    { id: 'hammer', name: 'Молот', icon: '🔨', key: '6', cur: 'crosshair' },
    { id: 'weight', name: 'Гиря', icon: '🏋️', key: '7', cur: 'crosshair' },
    { id: 'spawn',  name: 'Спавн', icon: '🍉', key: '8', cur: 'copy' },
  ];
  let tool = 'punch';

  function setTool(id) {
    tool = id;
    const t = TOOLS.find(x => x.id === id);
    canvas.style.cursor = t ? t.cur : 'default';
    document.querySelectorAll('.tool').forEach(b => b.classList.toggle('sel', b.dataset.id === id));
  }
  TOOLS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tool'; b.dataset.id = t.id;
    b.innerHTML = `<span class="ic">${t.icon}</span><span>${t.name}</span><span class="k">[${t.key}]</span>`;
    b.addEventListener('pointerdown', e => { e.stopPropagation(); ensureAudio(); setTool(t.id); });
    $toolbar.appendChild(b);
  });

  function toast(msg) { $toast.textContent = msg; $toast.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => $toast.classList.remove('show'), 1600); }

  function nearestMelon(mx, my, radius) {
    let best = null, bd = Infinity;
    for (const m of melons) {
      if (m.dead) continue;
      const d = Math.hypot(m.x - mx, m.y - my);
      if (d < bd) { bd = d; best = m; }
    }
    return (!best || (radius && bd > radius)) ? null : best;
  }

  function juiceExplosion(x, y, n, power) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU;
      const sp = (80 + Math.random() * power);
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, r: 3 + Math.random() * 6, life: 1 });
    }
  }
  function addDecal(x, y, r) {
    decals.push({ x, y, r, a: .85 });
    if (decals.length > 260) decals.shift();
  }

  function squash(m, k) { m.sy = Math.max(.4, 1 - k); m.sx = Math.min(1.7, 1 + k * .8); }

  function damage(m, dmg, dirX, dirY, pow) {
    if (m.dead) return;
    m.hp -= dmg;
    damageDealt += dmg;
    m.hurtUntil = now + 320;
    if (dirX !== undefined) { m.vx += dirX * (pow || 300); m.vy += (dirY !== undefined ? dirY : -1) * (pow || 300); }
    juiceExplosion(m.x, m.y, 12 + dmg, 300);
    snd.moan(dmg);
    shake = Math.min(18, shake + 4);
    if (m.hp <= 0) dieMelon(m, 'explode');
  }

  function dieMelon(m, mode) {
    m.dead = true; m.hp = 0;
    kills++;
    shake = 20; flash = .5;
    snd.boom();
    juiceExplosion(m.x, m.y, 60, 500);
    addDecal(m.x, Math.min(m.y, floorY), 60);
    if (mode === 'slice') { spawnHalves(m); toast('🔪 Мелон разрезан!'); }
    else toast('💥 Мелон уничтожен!');
  }

  function spawnHalves(m) {
    const h = m.r;
    halves.push({ x: m.x - h * .4, y: m.y, vx: -260, vy: -320, rot: -0.5, vrot: 3, r: h, type: 'top' });
    halves.push({ x: m.x + h * .4, y: m.y, vx: 260, vy: -320, rot: 0.5, vrot: -3, r: h, type: 'bottom' });
  }

  // ==================== ИНСТРУМЕНТЫ ====================
  function punch(mx, my) {
    const m = nearestMelon(mx, my, 999999);
    if (!m) return;
    const dx = m.x - mx, dy = m.y - my;
    const dist = Math.hypot(dx, dy) || 1;
    if (dist > m.r * 2.6) return;
    const nx = dx / dist, ny = dy / dist;
    m.vx += nx * 850; m.vy += ny * 850 - 200;
    damage(m, 12, nx, ny, 200);
    snd.punch();
    squash(m, .5);
    flash = .12;
  }

  function slice(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    for (const m of melons) {
      if (m.dead) continue;
      let t = len2 ? ((m.x - x1) * dx + (m.y - y1) * dy) / len2 : 0;
      t = Math.max(0, Math.min(1, t));
      const cx = x1 + dx * t, cy = y1 + dy * t;
      if (Math.hypot(m.x - cx, m.y - cy) < m.r) dieMelon(m, 'slice');
    }
  }

  function shoot(mx, my) {
    const sx = 40, sy = H - 160;
    const dx = mx - sx, dy = my - sy;
    const d = Math.hypot(dx, dy) || 1;
    projectiles.push({ x: sx, y: sy, vx: dx / d * 1400, vy: dy / d * 1400, r: 6 });
    snd.shoot();
  }

  function placeBomb(mx, my) {
    bombs.push({ x: mx, y: my, t: now + 1.0 });
    snd.throw_();
  }

  function swingHammer(mx) {
    hammer = { x: mx, t: now };
    snd.hammer();
  }

  function dropWeight(mx) {
    weights.push({ x: mx, y: -40, vy: 0, r: 34, hit: false });
  }

  // ==================== ОБНОВЛЕНИЕ ====================
  function update(dt) {
    // мелоны
    for (const m of melons) {
      if (m.dead) continue;
      if (m.grabbed) { m.vx = m.vy = 0; continue; }
      m.vy += GRAVITY * dt;
      m.vx *= .995; m.vy *= .998;
      m.x += m.vx * dt; m.y += m.vy * dt;
      m.rot += m.vrot * dt; m.vrot *= .99;

      if (m.y + m.r > floorY) {
        m.y = floorY - m.r;
        if (m.vy > 300) { squash(m, Math.min(.55, m.vy / 2600)); snd.splat();
          juiceExplosion(m.x, floorY, 6, 160); addDecal(m.x, floorY, 14); }
        if (Math.abs(m.vy) > 60) m.vy = -m.vy * .52; else m.vy = 0;
        m.vx *= .9;
      }
      if (m.x - m.r < 0) { m.x = m.r; m.vx = Math.abs(m.vx) * .6; squash(m, .4); snd.slap(); }
      if (m.x + m.r > W) { m.x = W - m.r; m.vx = -Math.abs(m.vx) * .6; squash(m, .4); snd.slap(); }

      const sp = 1 - Math.exp(-10 * dt);
      m.sx += (1 - m.sx) * sp;
      m.sy += (1 - m.sy) * sp;
    }

    // столкновения мелонов между собой
    for (let i = 0; i < melons.length; i++) {
      const a = melons[i]; if (a.dead) continue;
      for (let j = i + 1; j < melons.length; j++) {
        const b = melons[j]; if (b.dead) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy);
        const min = a.r + b.r;
        if (d < min && d > 0.001) {
          const nx = dx / d, ny = dy / d, overlap = min - d;
          a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
          b.x += nx * overlap / 2; b.y += ny * overlap / 2;
          const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (rel < 0) { a.vx += nx * rel * .5; a.vy += ny * rel * .5; b.vx -= nx * rel * .5; b.vy -= ny * rel * .5; }
        }
      }
    }
    // удаляем мёртвых
    for (let i = melons.length - 1; i >= 0; i--) if (melons[i].dead) melons.splice(i, 1);

    // половины
    for (const h of halves) {
      h.vy += GRAVITY * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.rot += h.vrot * dt;
      if (h.y + h.r > floorY) { h.y = floorY - h.r; h.vy = -h.vy * .5; h.vx *= .9; addDecal(h.x, floorY, 10); }
      if (h.x < 0 || h.x > W) h.vx *= -.6;
    }
    halves = halves.filter(h => h.y < H + 200);

    // пули
    for (const p of projectiles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      for (const m of melons) {
        if (m.dead) continue;
        if (Math.hypot(p.x - m.x, p.y - m.y) < m.r + p.r) {
          damage(m, 18, p.vx / 1400, p.vy / 1400, 400); p.dead = true; break;
        }
      }
    }
    projectiles = projectiles.filter(p => !p.dead && p.x > -20 && p.x < W + 20 && p.y > -20 && p.y < H + 20);

    // бомбы
    for (const b of bombs) {
      if (now >= b.t) {
        b.dead = true; snd.boom(); shake = 22; flash = .4;
        juiceExplosion(b.x, b.y, 40, 400); addDecal(b.x, Math.min(b.y, floorY), 45);
        for (const m of melons) {
          if (m.dead) continue;
          const d = Math.hypot(m.x - b.x, m.y - b.y);
          if (d < 220) {
            const nx = (m.x - b.x) / (d || 1), ny = (m.y - b.y) / (d || 1);
            damage(m, 45, nx, ny - .4, 520);
          }
        }
      }
    }
    bombs = bombs.filter(b => !b.dead);

    // гири
    for (const w of weights) {
      w.vy += GRAVITY * dt; w.y += w.vy * dt;
      if (!w.hit && w.y + w.r > floorY) {
        w.y = floorY - w.r; w.hit = true; snd.hammer(); shake = 12;
        addDecal(w.x, floorY, 24);
        for (const m of melons) {
          if (m.dead) continue;
          if (Math.abs(w.x - m.x) < m.r + w.r && Math.abs(w.y - m.y) < m.r + w.r) {
            damage(m, 35, 0, -1, 400); squash(m, .6);
          }
        }
      }
    }
    weights = weights.filter(w => !w.hit || w.y < H + 200);

    // молот
    if (hammer && now - hammer.t > .45) {
      const hx = hammer.x;
      for (const m of melons) {
        if (m.dead) continue;
        if (Math.abs(hx - m.x) < m.r * 1.4) { damage(m, 30, 0, -1, 460); squash(m, .65); }
      }
      shake = 10; flash = .15;
      hammer = null;
    }

    // частицы
    for (const p of particles) {
      p.vy += GRAVITY * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.2;
      if (p.y > floorY - 2) { addDecal(p.x, floorY, p.r * .8); p.life = 0; }
    }
    particles = particles.filter(p => p.life > 0 && p.y < H + 40);

    if (slash.life > 0) slash.life -= dt * 4;
    shake = Math.max(0, shake - dt * 60);
    flash = Math.max(0, flash - dt * 2.4);
  }

  // ==================== ОТРИСОВКА ====================
  function drawFace(m, e, blink) {
    const w = m.r * .34, h = m.r * .4;
    ctx.strokeStyle = '#1a1a1a'; ctx.fillStyle = '#1a1a1a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    const ey = -m.r * .12;
    if (blink) { ctx.beginPath(); ctx.moveTo(-w - 6, ey); ctx.lineTo(-w + 6, ey); ctx.moveTo(w - 6, ey); ctx.lineTo(w + 6, ey); ctx.stroke(); return; }
    switch (e) {
      case 'happy':
        ctx.beginPath(); ctx.arc(-w, ey, 5, 0, TAU); ctx.arc(w, ey, 5, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(0, m.r * .22, m.r * .22, .15 * Math.PI, .85 * Math.PI); ctx.stroke();
        break;
      case 'worry':
        ctx.beginPath(); ctx.arc(-w, ey, 7, 0, TAU); ctx.arc(w, ey, 7, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(0, m.r * .28, 7, 0, TAU); ctx.stroke();
        break;
      case 'hurt':
        ctx.beginPath(); ctx.arc(-w, ey, 7, Math.PI, TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(w, ey, 7, Math.PI, TAU); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, m.r * .3, 10, 0, TAU); ctx.fill();
        break;
      case 'daze':
      case 'dead':
        ctx.beginPath();
        [-w, w].forEach(x => { ctx.moveTo(x - 7, ey - 7); ctx.lineTo(x + 7, ey + 7); ctx.moveTo(x + 7, ey - 7); ctx.lineTo(x - 7, ey + 7); });
        ctx.stroke();
        ctx.beginPath(); ctx.arc(0, m.r * .3, 8, .1 * Math.PI, .9 * Math.PI); ctx.stroke();
        break;
      case 'angry':
        ctx.beginPath(); ctx.moveTo(-w - 8, ey - 9); ctx.lineTo(-w + 6, ey); ctx.moveTo(w + 8, ey - 9); ctx.lineTo(w - 6, ey); ctx.stroke();
        ctx.beginPath(); ctx.arc(-w, ey + 2, 5, 0, TAU); ctx.arc(w, ey + 2, 5, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(0, m.r * .34, m.r * .2, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
        break;
    }
  }

  function drawMelon(m) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot);
    ctx.scale(m.sx, m.sy);
    const r = m.r;

    ctx.fillStyle = '#2e9e3d';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();
    ctx.strokeStyle = 'rgba(20,80,30,.55)'; ctx.lineWidth = 8;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(i * r * .42, -r); ctx.lineTo(i * r * .42, r); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.ellipse(-r * .35, -r * .4, r * .22, r * .12, -.6, 0, TAU); ctx.fill();

    if (m.hp < m.maxHp * .55) {
      ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-r * .2, -r * .9); ctx.lineTo(-r * .05, -r * .5); ctx.lineTo(-r * .25, -r * .2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r * .3, -r * .85); ctx.lineTo(r * .15, -r * .4); ctx.lineTo(r * .35, -r * .15); ctx.stroke();
    }

    const blink = now > blinkUntil;
    let e;
    if (now < m.hurtUntil) e = 'hurt';
    else if (m.grabbed) e = 'daze';
    else {
      const ratio = m.hp / m.maxHp;
      e = ratio > .66 ? 'happy' : ratio > .33 ? 'worry' : ratio > .12 ? 'hurt' : 'daze';
    }
    drawFace(m, e, blink);

    ctx.restore();
  }

  function drawSemi(h) {
    ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.rot);
    ctx.beginPath();
    if (h.type === 'top') ctx.arc(0, 0, h.r, Math.PI, 0, false);
    else ctx.arc(0, 0, h.r, 0, Math.PI, false);
    ctx.closePath();
    ctx.fillStyle = '#e63b3b'; ctx.fill();
    ctx.lineWidth = h.r * .28; ctx.strokeStyle = '#2e9e3d'; ctx.stroke();
    ctx.fillStyle = '#1a1a1a';
    for (let i = -1; i <= 1; i++) {
      const sy = (h.type === 'top' ? -h.r * .25 : h.r * .25);
      ctx.beginPath(); ctx.ellipse(i * h.r * .3, sy, 3, 5, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function draw() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1c2340'); g.addColorStop(1, '#0e1120');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

    ctx.fillStyle = '#232838';
    ctx.fillRect(0, floorY, W, H - floorY);
    ctx.fillStyle = 'rgba(255,255,255,.07)';
    ctx.fillRect(0, floorY, W, 3);

    for (const d of decals) {
      ctx.fillStyle = `rgba(220,60,60,${d.a})`;
      ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * .32, 0, 0, TAU); ctx.fill();
    }

    for (const h of halves) drawSemi(h);

    for (const m of melons) {
      if (m.dead) continue;
      drawMelon(m);
      // HP-бар над мелоном
      const w = m.r * 1.3, hb = 7;
      const bx = m.x - w / 2, by = m.y - m.r - 18;
      const pct = m.hp / m.maxHp;
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(bx - 1, by - 1, w + 2, hb + 2);
      ctx.fillStyle = pct > .5 ? '#5eff7d' : pct > .25 ? '#ffd24a' : '#ff5a6e';
      ctx.fillRect(bx, by, w * pct, hb);
    }

    for (const w of weights) {
      ctx.fillStyle = '#4a4f66';
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#6a7088';
      ctx.beginPath(); ctx.arc(w.x - w.r * .3, w.y - w.r * .3, w.r * .4, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#2a2e40'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(w.x, w.y - w.r - 12, w.r * .5, Math.PI, 0); ctx.stroke();
    }

    for (const b of bombs) {
      ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(b.x, b.y, 16, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(b.x, b.y - 22, 7, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ff8833'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y - 22); ctx.quadraticCurveTo(b.x + (Math.random() * 16 - 8), b.y - 30, b.x, b.y - 34); ctx.stroke();
      const t = b.t - now;
      if (t < .3 && Math.floor(t * 20) % 2 === 0) { ctx.fillStyle = '#ff5533'; ctx.beginPath(); ctx.arc(b.x, b.y, 20, 0, TAU); ctx.fill(); }
    }

    for (const p of projectiles) {
      ctx.fillStyle = '#ffd24a';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,180,40,.5)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(p.x - p.vx * .02, p.y - p.vy * .02); ctx.lineTo(p.x, p.y); ctx.stroke();
    }

    if (hammer) {
      const k = Math.min(1, (now - hammer.t) / .45);
      const hy = -80 + (floorY + 80) * k;
      const a = k * Math.PI * .9;
      ctx.save(); ctx.translate(hammer.x, hy);
      ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-10, -70, 20, 70);
      ctx.save(); ctx.translate(0, -70); ctx.rotate(a);
      ctx.fillStyle = '#555b70'; ctx.fillRect(-40, -22, 80, 44);
      ctx.restore(); ctx.restore();
    }

    for (const p of particles) {
      ctx.fillStyle = `rgba(230,59,59,${Math.max(0, p.life)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }

    if (slash.life > 0 && slash.pts.length > 1) {
      ctx.strokeStyle = `rgba(255,255,255,${slash.life})`; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(slash.pts[0].x, slash.pts[0].y);
      for (const q of slash.pts) ctx.lineTo(q.x, q.y);
      ctx.stroke();
    }

    ctx.restore();

    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }

    $stats.textContent = `Мелонов: ${melons.length} · Урона: ${damageDealt} · Убито: ${kills}`;
  }

  // ==================== ЦИКЛ ====================
  let now = performance.now();
  let last = now;
  function loop(t) {
    now = t;
    const dt = Math.min(.05, (t - last) / 1000 || .016);
    last = t;
    if (now > nextBlink) { blinkUntil = now + 120; nextBlink = now + 2000 + Math.random() * 2000; }
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ==================== ВВОД ====================
  let pointerDown = false, lastPx = 0, lastPy = 0, lastPt = 0, mouseVX = 0, mouseVY = 0;

  function toLocal(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  canvas.addEventListener('pointerdown', e => {
    ensureAudio();
    const p = toLocal(e); pointerDown = true; lastPx = p.x; lastPy = p.y; lastPt = now; mouseVX = mouseVY = 0;
    if (tool === 'punch') { punch(p.x, p.y); }
    else if (tool === 'drag') {
      const m = nearestMelon(p.x, p.y, 999999);
      if (m && Math.hypot(p.x - m.x, p.y - m.y) < m.r * 1.6) {
        grabbedMelon = m; m.grabbed = true; m.grabOffX = m.x - p.x; m.grabOffY = m.y - p.y;
      }
    }
    else if (tool === 'slice') { slash.active = true; slash.pts = [p]; slash.life = .6; }
    else if (tool === 'shoot') { shoot(p.x, p.y); }
    else if (tool === 'bomb') { placeBomb(p.x, p.y); }
    else if (tool === 'hammer') { swingHammer(p.x); }
    else if (tool === 'weight') { dropWeight(p.x); }
    else if (tool === 'spawn') { spawnMelon(p.x, p.y); }
  });

  canvas.addEventListener('pointermove', e => {
    const p = toLocal(e);
    const dtm = Math.max(.016, (now - lastPt) / 1000);
    mouseVX = (p.x - lastPx) / dtm; mouseVY = (p.y - lastPy) / dtm;
    if (tool === 'drag' && grabbedMelon) {
      grabbedMelon.x = p.x + grabbedMelon.grabOffX; grabbedMelon.y = p.y + grabbedMelon.grabOffY;
      grabbedMelon.vx = grabbedMelon.vy = 0;
    } else if (tool === 'slice' && slash.active) { slash.pts.push(p); }
    lastPx = p.x; lastPy = p.y; lastPt = now;
  });

  canvas.addEventListener('pointerup', e => {
    pointerDown = false;
    if (tool === 'drag' && grabbedMelon) {
      grabbedMelon.vx = mouseVX * .85; grabbedMelon.vy = mouseVY * .85;
      grabbedMelon.grabbed = false; grabbedMelon = null;
      snd.throw_();
    } else if (tool === 'slice' && slash.active) {
      slash.active = false;
      if (slash.pts.length > 1) slice(slash.pts[0].x, slash.pts[0].y, slash.pts[slash.pts.length - 1].x, slash.pts[slash.pts.length - 1].y);
      slash.life = .4;
    }
  });

  window.addEventListener('keydown', e => {
    const t = TOOLS.find(x => x.key === e.key);
    if (t) { ensureAudio(); setTool(t.id); }
  });

  // старт
  resize();
  spawnMelon(W / 2, floorY - 74);
  setTool('punch');
})();
</script>
</body>
</html>
