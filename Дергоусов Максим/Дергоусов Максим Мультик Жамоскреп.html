<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мультик: Жамоскреп 🎬</title>
  <style>
    body {
      margin: 0;
      background: #1e1e2f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      border: 4px solid #ffaa00;
      border-radius: 24px;
      box-shadow: 0 0 30px rgba(255,140,0,0.5);
    }
  </style>
</head>
<body>
  <canvas id="screen" width="600" height="400"></canvas>
  <script>
    (function() {
      const canvas = document.getElementById('screen');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;

      // ----- СОСТОЯНИЯ СЦЕН -----
      const SCENES = {
        TITLE: 0,
        WALK: 1,
        TRIP: 2,
        EXPLODE: 3,
        END: 4
      };
      let scene = SCENES.TITLE;
      let timer = 0;          // счётчик кадров внутри сцены
      let frame = 0;          // общий счётчик для анимации

      // ----- ПАРАМЕТРЫ ЖАМОСКРЕПА -----
      let jx = W/2, jy = H/2 + 40;
      let walkDir = 1;        // 1 вправо, -1 влево
      let legPhase = 0;
      let explosionParticles = [];

      // ----- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ -----
      function resetScene(newScene) {
        scene = newScene;
        timer = 0;
        explosionParticles = [];
        jx = W/2;
        jy = H/2 + 40;
        walkDir = 1;
      }

      function drawZhamoskrep(x, y, scale = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        // Тень
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(0, 15, 35, 8, 0, 0, Math.PI*2);
        ctx.fill();

        // Тело (прямоугольная скрепка с закруглениями)
        ctx.fillStyle = '#ff6b35';
        ctx.fillRect(-35, -28, 70, 40);
        ctx.fillStyle = '#ff8c52';
        ctx.fillRect(-31, -26, 62, 36);
        // Закругления по бокам
        ctx.fillStyle = '#ff6b35';
        ctx.beginPath();
        ctx.arc(-35, -8, 18, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(35, -8, 18, 0, Math.PI*2);
        ctx.fill();

        // Глаза
        const eyeY = -18;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-14, eyeY, 9, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(14, eyeY, 9, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-14, eyeY, 4.5, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(14, eyeY, 4.5, 0, Math.PI*2);
        ctx.fill();

        // Улыбка (меняется в зависимости от состояния)
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -10, 12, 0.1*Math.PI, 0.9*Math.PI);
        ctx.stroke();

        // Ножки (двигаются)
        const legLen = 16;
        const lx = -20, rx = 20;
        const legBaseY = 12;
        const leftAngle = Math.sin(legPhase) * 0.6;
        const rightAngle = Math.sin(legPhase + Math.PI) * 0.6;
        ctx.strokeStyle = '#ff6b35';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(lx, legBaseY);
        ctx.lineTo(lx + Math.sin(leftAngle)*legLen, legBaseY + Math.abs(Math.cos(leftAngle))*legLen);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(rx, legBaseY);
        ctx.lineTo(rx + Math.sin(rightAngle)*legLen, legBaseY + Math.abs(Math.cos(rightAngle))*legLen);
        ctx.stroke();

        ctx.restore();
      }

      // Частица взрыва
      class Particle {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          const angle = Math.random() * Math.PI*2;
          const speed = 2 + Math.random() * 6;
          this.vx = Math.cos(angle)*speed;
          this.vy = Math.sin(angle)*speed - 2;
          this.life = 1;
          this.decay = 0.015 + Math.random()*0.03;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vy += 0.1;
          this.life -= this.decay;
        }
        draw(ctx) {
          ctx.globalAlpha = this.life;
          ctx.fillStyle = `hsl(${Math.random()*30+20}, 100%, 60%)`;
          ctx.fillRect(this.x-2, this.y-2, 4, 4);
          ctx.globalAlpha = 1;
        }
      }

      function updateScene() {
        timer++;
        frame++;
        legPhase += 0.3;

        switch(scene) {
          case SCENES.TITLE:
            if (timer > 150) resetScene(SCENES.WALK);
            break;
          case SCENES.WALK:
            jx += 1.2 * walkDir;
            if (jx > W - 80) walkDir = -1;
            if (jx < 80) walkDir = 1;
            if (timer > 200) resetScene(SCENES.TRIP);
            break;
          case SCENES.TRIP:
            // Жамоскреп спотыкается
            if (timer < 30) {
              jy -= 2; // подпрыгивает
            } else if (timer < 60) {
              jy += 4; // падает
            }
            if (timer === 70) {
              // Взрыв
              resetScene(SCENES.EXPLODE);
            }
            break;
          case SCENES.EXPLODE:
            // Создаём частицы в начале
            if (timer === 1) {
              for (let i=0; i<80; i++) {
                explosionParticles.push(new Particle(jx, jy));
              }
            }
            explosionParticles.forEach(p => p.update());
            explosionParticles = explosionParticles.filter(p => p.life > 0.01);
            if (timer > 100 && explosionParticles.length === 0) {
              resetScene(SCENES.END);
            }
            break;
          case SCENES.END:
            // просто показываем надпись
            if (timer > 200) {
              resetScene(SCENES.TITLE); // зацикливаем
            }
            break;
        }
      }

      function drawScene() {
        ctx.clearRect(0, 0, W, H);
        // Фон
        ctx.fillStyle = '#282840';
        ctx.fillRect(0, 0, W, H);
        // Декор: облака
        ctx.fillStyle = '#5a5a7a';
        ctx.font = '30px Arial';
        ctx.fillText('☁️', 50, 50);
        ctx.fillText('☁️', 400, 80);
        ctx.fillText('☁️', 200, 110);

        // Земля
        ctx.fillStyle = '#3a3a5a';
        ctx.fillRect(0, H-50, W, 50);
        ctx.fillStyle = '#4a4a6a';
        for (let i=0; i<20; i++) {
          ctx.fillRect(i*35 + (frame%35), H-48, 20, 10);
        }

        // Субтитры
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'center';
        let sub = '';
        switch(scene) {
          case SCENES.TITLE: sub = 'Жамоскреп: Утро'; break;
          case SCENES.WALK: sub = 'Идёт по своим делам...'; break;
          case SCENES.TRIP: sub = 'Ой! Споткнулся!'; break;
          case SCENES.EXPLODE: sub = '💥 БУМ! 💥'; break;
          case SCENES.END: sub = 'Конец (а может и нет)'; break;
        }
        ctx.fillText(sub, W/2, 40);

        // Рисуем жамоскрепа (если не взрыв)
        if (scene !== SCENES.EXPLODE) {
          drawZhamoskrep(jx, jy, 1.0);
        }

        // Рисуем частицы взрыва
        explosionParticles.forEach(p => p.draw(ctx));

        // Дополнительные эффекты для сцены взрыва
        if (scene === SCENES.EXPLODE && timer < 30) {
          ctx.fillStyle = 'rgba(255,200,100,0.7)';
          ctx.beginPath();
          ctx.arc(jx, jy, timer*5, 0, Math.PI*2);
          ctx.fill();
        }

        // Конечная надпись
        if (scene === SCENES.END) {
          ctx.fillStyle = '#ffcc00';
          ctx.font = 'bold 32px Arial';
          ctx.fillText('Вот так и живёт Жамоскреп', W/2, H/2 + 40);
        }
      }

      function loop() {
        updateScene();
        drawScene();
        requestAnimationFrame(loop);
      }

      // Запуск
      resetScene(SCENES.TITLE);
      loop();
    })();
  </script>
</body>
</html>
