<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🗿 Построй скульптуру</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html,body { width:100%; height:100%; overflow:hidden; position:fixed; background:#0a0820;
      font-family:'Segoe UI',system-ui,sans-serif; user-select:none; -webkit-user-select:none; }
    canvas { display:block; touch-action:none; }

    #ui { position:absolute; top:0; left:0; right:0; pointer-events:none; padding:10px 14px; z-index:10; }
    #title { text-align:center; font-size:18px; font-weight:800; margin-bottom:2px; letter-spacing:2px;
      color:#c8a0ff; text-shadow:0 0 20px rgba(100,50,255,0.3); }
    #hud { display:flex; justify-content:space-between; font-size:12px; color:#776699; pointer-events:none; }
    #hud span { color:#b088dd; font-weight:700; }

    /* Palette */
    #palette {
      position:absolute; left:10px; top:50%; transform:translateY(-50%);
      display:flex; flex-direction:column; gap:5px; z-index:12; pointer-events:auto;
    }
    .color-btn {
      width:32px; height:32px; border-radius:8px; border:2px solid rgba(255,255,255,0.08);
      cursor:pointer; transition:transform 0.12s, border-color 0.12s;
      pointer-events:auto;
    }
    .color-btn:hover { transform:scale(1.15); }
    .color-btn.active { border-color:#fff; transform:scale(1.2); box-shadow:0 0 15px rgba(255,255,255,0.25); }
    .color-btn:active { transform:scale(0.9); }

    /* Tool buttons */
    #tools {
      position:absolute; right:10px; top:50%; transform:translateY(-50%);
      display:flex; flex-direction:column; gap:6px; z-index:12; pointer-events:auto;
    }
    .tool-btn {
      width:36px; height:36px; border-radius:10px;
      background:rgba(30,15,70,0.7); border:1.5px solid rgba(150,100,255,0.15);
      color:#b088dd; font-size:16px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background 0.15s, border-color 0.15s;
      pointer-events:auto; backdrop-filter:blur(4px);
    }
    .tool-btn:hover { background:rgba(50,25,100,0.7); border-color:rgba(150,100,255,0.35); }
    .tool-btn.active { background:rgba(80,40,160,0.5); border-color:#b088dd; }
    .tool-btn:active { transform:scale(0.92); }

    /* Bottom bar */
    #bottom-bar {
      position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
      display:flex; gap:8px; z-index:12; pointer-events:auto;
    }
    .action-btn {
      padding:8px 18px; border-radius:10px;
      background:rgba(30,15,70,0.7); border:1.5px solid rgba(150,100,255,0.15);
      color:#c8a0ff; font-size:13px; font-weight:600; cursor:pointer;
      transition:background 0.15s, border-color 0.15s;
      pointer-events:auto; backdrop-filter:blur(4px);
      white-space:nowrap;
    }
    .action-btn:hover { background:rgba(50,25,100,0.7); border-color:rgba(150,100,255,0.35); }
    .action-btn:active { transform:scale(0.95); }
    .action-btn.primary { background:linear-gradient(135deg,#8833ff,#5533cc); border-color:transparent; }

    /* Block count */
    #block-count {
      position:absolute; bottom:60px; left:50%; transform:translateX(-50%);
      color:#554466; font-size:11px; pointer-events:none; z-index:11;
    }

    /* Crosshair */
    #cursor-ghost {
      position:absolute; pointer-events:none; z-index:9;
      width:16px; height:16px; border-radius:3px;
      border:2px solid rgba(255,255,255,0.5);
      transform:translate(-50%,-50%);
      display:none;
    }

    #info {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      color:rgba(200,160,255,0.06); font-size:42px; font-weight:800; letter-spacing:6px;
      pointer-events:none; z-index:1; text-align:center;
      text-transform:uppercase;
    }

    @media (max-width:500px) {
      #palette { left:6px; gap:4px; }
      .color-btn { width:26px; height:26px; border-radius:6px; }
      #tools { right:6px; gap:4px; }
      .tool-btn { width:30px; height:30px; font-size:13px; border-radius:8px; }
      .action-btn { padding:6px 12px; font-size:11px; }
      #title { font-size:14px; }
    }
  </style>
</head>
<body>

<div id="ui">
  <div id="title">🗿 Построй скульптуру</div>
  <div id="hud">
    <div>🧱 <span id="blocks">0</span></div>
    <div><span id="mode-label">❓ Свободный режим</span></div>
  </div>
</div>

<div id="cursor-ghost"></div>
<div id="info">КЛИКНИ<br>ЧТОБЫ СТАВИТЬ</div>

<div id="palette"></div>

<div id="tools">
  <div class="tool-btn" id="tool-place" title="Ставить">➕</div>
  <div class="tool-btn" id="tool-remove" title="Убрать">➖</div>
</div>

<div id="bottom-bar">
  <button class="action-btn" id="clearBtn">🗑 Очистить</button>
  <button class="action-btn" id="randomBtn">🎲 Случайно</button>
</div>

<div id="block-count">Кликни по платформе чтобы начать</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== DOM =====
const blocksSpan = document.getElementById('blocks');
const modeLabel = document.getElementById('mode-label');
const blockCountEl = document.getElementById('block-count');
const cursorGhost = document.getElementById('cursor-ghost');
const infoEl = document.getElementById('info');
const paletteEl = document.getElementById('palette');
const clearBtn = document.getElementById('clearBtn');
const randomBtn = document.getElementById('randomBtn');
const toolPlace = document.getElementById('tool-place');
const toolRemove = document.getElementById('tool-remove');

// ===== CONST =====
const GRID = 8;
const BLOCK_SIZE = 0.9;
const COLORS = [
  { name:'Красный', hex:'#ff3366' }, { name:'Оранжевый', hex:'#ff8800' },
  { name:'Жёлтый', hex:'#ffdd00' }, { name:'Зелёный', hex:'#33dd55' },
  { name:'Голубой', hex:'#33bbff' }, { name:'Синий', hex:'#3366ff' },
  { name:'Фиолетовый', hex:'#9944ff' }, { name:'Розовый', hex:'#ff66aa' },
  { name:'Белый', hex:'#ddeeff' }, { name:'Серый', hex:'#888899' },
];

// ===== THREE =====
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0820);
scene.fog = new THREE.FogExp2(0x0a0820, 0.008);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 30);
camera.position.set(8, 7, 8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(3.5, 1.5, 3.5);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minPolarAngle = 0.1;
controls.maxPolarAngle = Math.PI / 2.3;
controls.minDistance = 4;
controls.maxDistance = 18;
controls.update();

// ===== LIGHTS =====
scene.add(new THREE.AmbientLight(0x7766aa, 0.7));
scene.add(new THREE.HemisphereLight(0x9977cc, 0x443366, 0.5));
const sun = new THREE.DirectionalLight(0xffeedd, 2.5);
sun.position.set(8, 15, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 25;
sun.shadow.camera.left = -12;
sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;
sun.shadow.camera.bottom = -12;
sun.shadow.bias = -0.001;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x6644aa, 0.4);
fill.position.set(-6, 8, -8);
scene.add(fill);

// ===== GROUND / PLATFORM =====
const platformMat = new THREE.MeshStandardMaterial({
  color: 0x1a0e40,
  roughness: 0.8,
  metalness: 0.1,
});
const platform = new THREE.Mesh(new THREE.BoxGeometry(GRID + 0.4, 0.15, GRID + 0.4), platformMat);
platform.position.set(3.5, -0.075, 3.5);
platform.receiveShadow = true;
platform.castShadow = true;
scene.add(platform);

// Grid lines on platform
const gridMat = new THREE.LineBasicMaterial({ color: 0x3a2070, transparent: true, opacity: 0.3 });
for (let i = 0; i <= GRID; i++) {
  const g1 = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(i, 0.01, 0), new THREE.Vector3(i, 0.01, GRID)
    ]), gridMat
  );
  scene.add(g1);
  const g2 = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0.01, i), new THREE.Vector3(GRID, 0.01, i)
    ]), gridMat
  );
  scene.add(g2);
}

// Subtle base glow
const glowMat = new THREE.MeshBasicMaterial({
  color: 0x6633cc,
  transparent: true,
  opacity: 0.04,
  side: THREE.DoubleSide,
});
const glow = new THREE.Mesh(new THREE.PlaneGeometry(GRID + 2, GRID + 2), glowMat);
glow.rotation.x = -Math.PI / 2;
glow.position.set(3.5, -0.05, 3.5);
scene.add(glow);

// ===== BLOCKS =====
const blocks = []; // {mesh, x, y, z, color}
const blockGroup = new THREE.Group();
scene.add(blockGroup);

let selectedColor = 0; // index into COLORS
let mode = 'place'; // 'place' or 'remove'
let isMousedown = false;
let mouseX = 0, mouseY = 0;
let lastPlaced = ''; // key to avoid double-place

function getBlockKey(x, y, z) {
  return `${Math.round(x*10)||0},${Math.round(y*10)||0},${Math.round(z*10)||0}`;
}

function placeBlock(gx, gy, gz, colorIdx) {
  const key = getBlockKey(gx, gy, gz);
  if (blocks.find(b => getBlockKey(b.x, b.y, b.z) === key)) return false;

  const c = new THREE.Color(COLORS[colorIdx].hex);
  const mat = new THREE.MeshStandardMaterial({
    color: c,
    roughness: 0.35,
    metalness: 0.15,
  });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE), mat);
  mesh.position.set(gx + 0.5, gy + 0.5, gz + 0.5);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  blockGroup.add(mesh);

  // Subtle edge highlight
  const edgeMat = new THREE.LineBasicMaterial({
    color: c.clone().multiplyScalar(1.4),
    transparent: true,
    opacity: 0.15,
  });
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), edgeMat);
  edges.position.copy(mesh.position);
  blockGroup.add(edges);

  blocks.push({ mesh, edges, x: gx, y: gy, z: gz, color: colorIdx, key });
  updateCount();
  infoEl.style.display = 'none';
  return true;
}

function removeBlock(gx, gy, gz) {
  const key = getBlockKey(gx, gy, gz);
  const idx = blocks.findIndex(b => b.key === key);
  if (idx === -1) return false;
  const b = blocks[idx];
  blockGroup.remove(b.mesh);
  blockGroup.remove(b.edges);
  if (b.mesh.geometry) b.mesh.geometry.dispose();
  if (b.mesh.material) b.mesh.material.dispose();
  blocks.splice(idx, 1);
  updateCount();
  return true;
}

function updateCount() {
  blocksSpan.textContent = blocks.length;
  blockCountEl.textContent = blocks.length === 0
    ? 'Кликни по платформе чтобы начать'
    : `🧱 ${blocks.length} блоков • ${Math.round(controls.getAzimuthalAngle() * 180 / Math.PI)}°`;
}

function clearAll() {
  while (blocks.length) {
    const b = blocks.pop();
    blockGroup.remove(b.mesh);
    blockGroup.remove(b.edges);
    if (b.mesh.geometry) b.mesh.geometry.dispose();
    if (b.mesh.material) b.mesh.material.dispose();
  }
  updateCount();
  infoEl.style.display = 'block';
}

function randomSculpture() {
  clearAll();
  // Generate an interesting random shape
  const center = Math.floor(GRID / 2);
  const height = 3 + Math.floor(Math.random() * 3);
  for (let y = 0; y < height; y++) {
    const radius = Math.max(1, Math.floor((height - y) * 0.6 + 0.5));
    for (let dx = -radius; dx <= radius; dx++) {
      for (let dz = -radius; dz <= radius; dz++) {
        if (dx * dx + dz * dz > radius * radius + 0.5) continue;
        // Add randomness for organic look
        if (y > 1 && Math.random() < 0.25) continue;
        if (Math.random() < 0.85) {
          const ci = Math.floor(Math.random() * COLORS.length);
          placeBlock(center + dx, y, center + dz, ci);
        }
      }
    }
  }
  // Add some top decorations
  if (Math.random() < 0.5) {
    placeBlock(center, height, center, Math.floor(Math.random() * COLORS.length));
  }
  updateCount();
}

// ===== PALETTE =====
COLORS.forEach((c, i) => {
  const btn = document.createElement('div');
  btn.className = 'color-btn' + (i === selectedColor ? ' active' : '');
  btn.style.background = c.hex;
  btn.style.boxShadow = `0 0 12px ${c.hex}44`;
  btn.title = c.name;
  btn.dataset.idx = i;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedColor = i;
  });
  paletteEl.appendChild(btn);
});

// ===== TOOLS =====
toolPlace.classList.add('active');
toolPlace.addEventListener('click', () => {
  mode = 'place';
  toolPlace.classList.add('active');
  toolRemove.classList.remove('active');
  modeLabel.textContent = '➕ Ставить';
});
toolRemove.addEventListener('click', () => {
  mode = 'remove';
  toolRemove.classList.add('active');
  toolPlace.classList.remove('active');
  modeLabel.textContent = '➖ Убрать';
});

clearBtn.addEventListener('click', clearAll);
randomBtn.addEventListener('click', randomSculpture);

// ===== RAYCASTER =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const planeY = (y) => new THREE.Plane(new THREE.Vector3(0, 1, 0), -y);

function getGridPos(clientX, clientY) {
  mouse.x = (clientX / innerWidth) * 2 - 1;
  mouse.y = -(clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // First try to intersect with existing blocks
  const meshes = blocks.map(b => b.mesh);
  const intersects = raycaster.intersectObjects(meshes);
  if (intersects.length > 0) {
    const hit = intersects[0];
    const normal = hit.face.normal.clone();
    // Transform normal from local to world
    normal.transformDirection(hit.object.matrixWorld);
    const gp = hit.point.clone().add(normal.multiplyScalar(0.5));
    const gx = Math.floor(gp.x);
    const gy = Math.floor(gp.y);
    const gz = Math.floor(gp.z);
    if (gx >= 0 && gx < GRID && gy >= 0 && gy < 8 && gz >= 0 && gz < GRID) {
      return { gx, gy, gz, hit: true, point: hit.point };
    }
  }

  // Then try platform
  const pIntersects = raycaster.intersectObject(platform);
  if (pIntersects.length > 0) {
    const p = pIntersects[0].point;
    const gx = Math.floor(p.x);
    const gz = Math.floor(p.z);
    if (gx >= 0 && gx < GRID && gz >= 0 && gz < GRID) {
      // Find highest block at this column, or 0
      let topY = 0;
      for (const b of blocks) {
        if (b.x === gx && b.z === gz && b.y >= topY) topY = b.y + 1;
      }
      return { gx, gy: topY, gz, hit: false, point: pIntersects[0].point };
    }
  }
  return null;
}

function getGridPosRemove(clientX, clientY) {
  mouse.x = (clientX / innerWidth) * 2 - 1;
  mouse.y = -(clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const meshes = blocks.map(b => b.mesh);
  const intersects = raycaster.intersectObjects(meshes);
  if (intersects.length > 0) {
    const hit = intersects[0];
    const gp = hit.point;
    const gx = Math.floor(gp.x);
    const gy = Math.floor(gp.y);
    const gz = Math.floor(gp.z);
    if (gx >= 0 && gx < GRID && gy >= 0 && gy < 8 && gz >= 0 && gz < GRID) {
      return { gx, gy, gz };
    }
  }
  return null;
}

function handleClick(clientX, clientY) {
  if (mode === 'place') {
    const pos = getGridPos(clientX, clientY);
    if (pos) {
      const key = getBlockKey(pos.gx, pos.gy, pos.gz);
      if (lastPlaced !== key || blocks.length === 0) {
        if (placeBlock(pos.gx, pos.gy, pos.gz, selectedColor)) {
          lastPlaced = key;
        }
      }
    }
  } else {
    const pos = getGridPosRemove(clientX, clientY);
    if (pos) removeBlock(pos.gx, pos.gy, pos.gz);
  }
}

// ===== INPUT =====
// Mouse
renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button === 0) {
    isMousedown = true;
    handleClick(e.clientX, e.clientY);
  }
});
renderer.domElement.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  updateCursorGhost(e.clientX, e.clientY);
});
renderer.domElement.addEventListener('mouseup', () => { isMousedown = false; });

// Touch
let touchMoved = false;
let touchStartPos = null;

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    touchMoved = false;
    touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1) {
    const dx = e.touches[0].clientX - touchStartPos.x;
    const dy = e.touches[0].clientY - touchStartPos.y;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) touchMoved = true;
    updateCursorGhost(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchend', (e) => {
  if (!touchMoved && touchStartPos) {
    handleClick(touchStartPos.x, touchStartPos.y);
  }
  touchStartPos = null;
  cursorGhost.style.display = 'none';
}, { passive: true });

// Cursor ghost
function updateCursorGhost(cx, cy) {
  const pos = mode === 'place' ? getGridPos(cx, cy) : getGridPosRemove(cx, cy);
  if (pos) {
    const gx = pos.gx, gy = pos.gy, gz = pos.gz;
    // Project grid position to screen
    const v = new THREE.Vector3(gx + 0.5, gy + 0.5, gz + 0.5);
    v.project(camera);
    const sx = (v.x * 0.5 + 0.5) * innerWidth;
    const sy = (-v.y * 0.5 + 0.5) * innerHeight;
    if (v.z < 1) {
      cursorGhost.style.display = 'block';
      cursorGhost.style.left = sx + 'px';
      cursorGhost.style.top = sy + 'px';
      cursorGhost.style.borderColor = mode === 'place' ? COLORS[selectedColor].hex : '#ff4466';
      cursorGhost.style.boxShadow = `0 0 10px ${mode === 'place' ? COLORS[selectedColor].hex + '66' : '#ff446666'}`;
      return;
    }
  }
  cursorGhost.style.display = 'none';
}

// ===== RESIZE =====
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ===== ANIMATION =====
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  updateCount();

  // Gentle floating animation for blocks (very subtle)
  blockGroup.children.forEach((child, i) => {
    if (child.isMesh && child.geometry.type === 'BoxGeometry') {
      const idx = Math.floor(i / 2);
      child.position.y += Math.sin(Date.now() * 0.001 + idx) * 0.00005;
    }
  });

  renderer.render(scene, camera);
}

// ===== START =====
// Place a starter block
placeBlock(3, 0, 3, 6); // center purple
placeBlock(3, 1, 3, 6);
placeBlock(4, 0, 3, 0); // red
placeBlock(3, 0, 4, 3); // green

updateCount();
animate();

console.log('🗿 Построй скульптуру запущена!');
</script>
</body>
</html>
