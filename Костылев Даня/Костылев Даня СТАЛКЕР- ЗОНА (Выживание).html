<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>☢️ СТАЛКЕР: ЗОНА (Выживание)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      touch-action: none;
      user-select: none;
    }
    canvas {
      display: block;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      background: rgba(20,20,5,0.85);
      padding: 10px 25px;
      border-radius: 30px;
      border: 2px solid #6b6b2a;
      color: #d4d400;
      font-weight: bold;
      font-size: 1rem;
      text-shadow: 0 0 8px #ffaa00;
      box-shadow: 0 0 20px rgba(255,150,0,0.4);
      z-index: 10;
      pointer-events: none;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90vw;
    }
    .health-bar {
      width: 100px;
      height: 12px;
      background: #331111;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #aa4444;
      display: inline-block;
      vertical-align: middle;
    }
    .health-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff3333, #ff8800);
      transition: width 0.2s;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 5;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.9);
    }
    #crosshair::before {
      width: 2px;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
    }
    #crosshair::after {
      height: 2px;
      width: 100%;
      top: 50%;
      transform: translateY(-50%);
    }
    #message {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffff00;
      font-size: 2.2rem;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 0 20px #ff8800, 0 0 40px #ff4400;
      pointer-events: none;
      z-index: 20;
      display: none;
    }
    #restartBtn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #3a3a0a;
      border: 2px solid #aaaa2a;
      color: #ffff88;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 12px 30px;
      border-radius: 30px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 5px #ffaa00;
      box-shadow: 0 0 20px rgba(200,200,0,0.4);
      z-index: 15;
      display: none;
    }
    #restartBtn:hover {
      background: #5a5a0a;
      box-shadow: 0 0 30px rgba(255,255,0,0.7);
    }
    #mobileControls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 6px;
      z-index: 10;
      flex-wrap: wrap;
      justify-content: center;
    }
    .mbtn {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: rgba(40,40,10,0.7);
      border: 2px solid #888833;
      color: #dddd44;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    @media (max-width: 768px) {
      #mobileControls {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="hud">
    <span>❤️ <div class="health-bar"><div class="health-fill" id="healthFill" style="width:100%"></div></div></span>
    <span>🔫 <span id="ammoDisplay">30</span>/<span id="maxAmmoDisplay">30</span></span>
    <span>💎 Артефакты: <span id="artifactDisplay">0</span></span>
    <span>💀 Убито: <span id="killDisplay">0</span></span>
  </div>
  <div id="crosshair"></div>
  <div id="message"></div>
  <button id="restartBtn" onclick="restartGame()">🔄 В НОВЫЙ РЕЙД</button>
  <div id="mobileControls">
    <div class="mbtn" data-key="ArrowUp">⬆️</div>
    <div class="mbtn" data-key="ArrowLeft">⬅️</div>
    <div class="mbtn" data-key="ArrowDown">⬇️</div>
    <div class="mbtn" data-key="ArrowRight">➡️</div>
    <div class="mbtn" data-key="shoot" style="background:#442222;border-color:#aa4444;">💥</div>
    <div class="mbtn" data-key="reload">🔄</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    
    // ==================== НАСТРОЙКИ ====================
    const WORLD_SIZE = 80;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a08);
    scene.fog = new THREE.FogExp2(0x1a1a08, 0.00012);
    
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.5, 200);
    camera.position.set(0, 2.5, 20);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);
    
    // ==================== СОСТОЯНИЕ ИГРЫ ====================
    const player = {
      hp: 100,
      maxHp: 100,
      ammo: 30,
      maxAmmo: 30,
      reloading: false,
      reloadTimer: 0,
      reloadTime: 1.8,
      invincible: 0,
      shootCooldown: 0,
      artifacts: 0,
      kills: 0
    };
    
    let gameOver = false;
    const bullets = [];
    const enemies = [];
    const artifacts = [];
    const particles = [];
    
    const keys = {};
    let mouseDown = false;
    let yaw = 0;
    let pitch = 0;
    const mouseSensitivity = 0.002;
    let isPointerLocked = false;
    
    // ==================== HUD ЭЛЕМЕНТЫ ====================
    const healthFill = document.getElementById('healthFill');
    const ammoDisplay = document.getElementById('ammoDisplay');
    const maxAmmoDisplay = document.getElementById('maxAmmoDisplay');
    const artifactDisplay = document.getElementById('artifactDisplay');
    const killDisplay = document.getElementById('killDisplay');
    const messageEl = document.getElementById('message');
    const restartBtn = document.getElementById('restartBtn');
    
    function updateHUD() {
      healthFill.style.width = `${(player.hp / player.maxHp) * 100}%`;
      ammoDisplay.textContent = player.ammo;
      maxAmmoDisplay.textContent = player.maxAmmo;
      artifactDisplay.textContent = player.artifacts;
      killDisplay.textContent = player.kills;
    }
    
    function showMessage(text, color = '#ffff00') {
      messageEl.style.display = 'block';
      messageEl.textContent = text;
      messageEl.style.color = color;
      setTimeout(() => {
        if (messageEl.textContent === text) messageEl.style.display = 'none';
      }, 2000);
    }
    
    // ==================== ОСВЕЩЕНИЕ ====================
    scene.add(new THREE.AmbientLight(0x334422, 0.7));
    const sunLight = new THREE.DirectionalLight(0x889999, 1.5);
    sunLight.position.set(40, 50, 30);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 150;
    sunLight.shadow.camera.left = -60;
    sunLight.shadow.camera.right = 60;
    sunLight.shadow.camera.top = 60;
    sunLight.shadow.camera.bottom = -60;
    scene.add(sunLight);
    
    const glowLight = new THREE.PointLight(0x88ff00, 20, 50);
    glowLight.position.set(0, 5, 0);
    scene.add(glowLight);
    
    // ==================== ГЕНЕРАЦИЯ МИРА ====================
    function createGround() {
      const geom = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
      const mat = new THREE.MeshStandardMaterial({ color: 0x2a2a0a, roughness: 0.9, metalness: 0.1 });
      const ground = new THREE.Mesh(geom, mat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);
      
      const grid = new THREE.PolarGridHelper(WORLD_SIZE/2, 40, 30, 64, 0x333310, 0x333310);
      grid.position.y = 0.05;
      scene.add(grid);
    }
    
    function createBuilding(x, z, w, h, d) {
      const group = new THREE.Group();
      const bodyGeom = new THREE.BoxGeometry(w, h, d);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a4a3a, roughness: 0.7, metalness: 0.2 });
      const body = new THREE.Mesh(bodyGeom, bodyMat);
      body.position.y = h/2;
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);
      
      if (Math.random() > 0.5) {
        const rubbleGeom = new THREE.BoxGeometry(w*0.6, 0.4, d*0.6);
        const rubble = new THREE.Mesh(rubbleGeom, new THREE.MeshStandardMaterial({ color: 0x555544, roughness: 0.9 }));
        rubble.position.set((Math.random()-0.5)*2, 0.2, (Math.random()-0.5)*2);
        rubble.rotation.y = Math.random() * Math.PI;
        rubble.castShadow = true;
        group.add(rubble);
      }
      
      group.position.set(x, 0, z);
      scene.add(group);
    }
    
    function createTree(x, z) {
      const group = new THREE.Group();
      const trunkGeom = new THREE.CylinderGeometry(0.15, 0.3, 4 + Math.random()*3, 8);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.9 });
      const trunk = new THREE.Mesh(trunkGeom, trunkMat);
      trunk.position.y = 2;
      trunk.castShadow = true;
      group.add(trunk);
      
      for (let j = 0; j < 3; j++) {
        const branchGeom = new THREE.CylinderGeometry(0.05, 0.1, 2, 6);
        const branch = new THREE.Mesh(branchGeom, trunkMat);
        branch.position.y = 2.5 + j * 1;
        branch.rotation.z = (Math.random()-0.5)*1.5;
        branch.rotation.x = (Math.random()-0.5)*1.5;
        branch.castShadow = true;
        group.add(branch);
      }
      
      group.position.set(x, 0, z);
      scene.add(group);
    }
    
    function createArtifact(x, z) {
      const group = new THREE.Group();
      const coreGeom = new THREE.SphereGeometry(0.4, 8, 8);
      const coreMat = new THREE.MeshStandardMaterial({ 
        color: 0x00ff88, 
        emissive: 0x004422, 
        emissiveIntensity: 0.8,
        roughness: 0.2 
      });
      const core = new THREE.Mesh(coreGeom, coreMat);
      group.add(core);
      
      const ringGeom = new THREE.TorusGeometry(0.5, 0.1, 8, 16);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x88ff00 });
      const ring = new THREE.Mesh(ringGeom, ringMat);
      ring.rotation.x = Math.PI/2;
      group.add(ring);
      
      group.position.set(x, 0.6, z);
      group.userData = { type: 'artifact', collected: false };
      scene.add(group);
      return group;
    }
    
    // Строим мир
    createGround();
    
    for (let i = 0; i < 16; i++) {
      const angle = (i / 16) * Math.PI * 2;
      const radius = 22 + Math.random() * 18;
      createBuilding(
        Math.cos(angle) * radius,
        Math.sin(angle) * radius,
        3 + Math.random() * 5,
        4 + Math.random() * 14,
        3 + Math.random() * 5
      );
    }
    
    for (let i = 0; i < 40; i++) {
      createTree(
        (Math.random() - 0.5) * WORLD_SIZE * 0.9,
        (Math.random() - 0.5) * WORLD_SIZE * 0.9
      );
    }
    
    // Первоначальные артефакты (всегда 5 штук на карте, пересоздаются при сборе)
    function spawnArtifacts(count = 5) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 10 + Math.random() * 25;
        artifacts.push(createArtifact(
          Math.cos(angle) * dist,
          Math.sin(angle) * dist
        ));
      }
    }
    spawnArtifacts(5);
    
    // ==================== ОРУЖИЕ ====================
    const gunGroup = new THREE.Group();
    gunGroup.position.set(0.5, -0.4, -0.7);
    camera.add(gunGroup);
    
    const gunBodyGeom = new THREE.BoxGeometry(0.1, 0.18, 0.6);
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.8 });
    const gunBody = new THREE.Mesh(gunBodyGeom, gunMat);
    gunGroup.add(gunBody);
    
    const barrelGeom = new THREE.CylinderGeometry(0.04, 0.05, 0.5, 8);
    const barrel = new THREE.Mesh(barrelGeom, gunMat);
    barrel.rotation.x = Math.PI/2;
    barrel.position.set(0, 0.05, -0.5);
    gunGroup.add(barrel);
    
    // ==================== ВРАГИ ====================
    function createEnemy(x, z) {
      const group = new THREE.Group();
      const scale = 0.8 + Math.random() * 0.5;
      
      const bodyGeom = new THREE.SphereGeometry(0.8 * scale, 12, 10);
      bodyGeom.scale(1, 0.6, 1.2);
      const bodyMat = new THREE.MeshStandardMaterial({ 
        color: 0x3a4a1a,
        roughness: 0.5,
        emissive: 0x112200,
        emissiveIntensity: 0.3
      });
      const body = new THREE.Mesh(bodyGeom, bodyMat);
      body.castShadow = true;
      group.add(body);
      
      const eyeGeom = new THREE.SphereGeometry(0.2 * scale, 6, 6);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const leftEye = new THREE.Mesh(eyeGeom, eyeMat);
      leftEye.position.set(-0.35*scale, 0.25*scale, 0.7*scale);
      group.add(leftEye);
      const rightEye = new THREE.Mesh(eyeGeom, eyeMat);
      rightEye.position.set(0.35*scale, 0.25*scale, 0.7*scale);
      group.add(rightEye);
      
      for (let s = -1; s <= 1; s += 2) {
        const whiskerGeom = new THREE.CylinderGeometry(0.03*scale, 0.06*scale, 1.8*scale, 6);
        const whiskerMat = new THREE.MeshStandardMaterial({ color: 0xaaffaa, emissive: 0x224422, emissiveIntensity: 0.5 });
        const whisker = new THREE.Mesh(whiskerGeom, whiskerMat);
        whisker.position.set(s*0.25*scale, 0.05*scale, 0.85*scale);
        whisker.rotation.z = s * 0.6;
        whisker.rotation.x = -0.4;
        group.add(whisker);
      }
      
      group.position.set(x, 0.7 * scale, z);
      group.userData = {
        hp: 25 + Math.floor(Math.random() * 25),
        maxHp: 50,
        speed: 0.03 + Math.random() * 0.04,
        damage: 8 + Math.floor(Math.random() * 8),
        attackCooldown: 0,
        type: 'enemy'
      };
      
      scene.add(group);
      return group;
    }
    
    function spawnEnemy() {
      if (enemies.length >= 10) return;
      const angle = Math.random() * Math.PI * 2;
      const dist = 25 + Math.random() * 20;
      const x = camera.position.x + Math.cos(angle) * dist;
      const z = camera.position.z + Math.sin(angle) * dist;
      enemies.push(createEnemy(x, z));
    }
    
    // ==================== ДЕЙСТВИЯ ====================
    function shoot() {
      if (player.ammo <= 0 || player.reloading || player.shootCooldown > 0) return;
      
      const direction = new THREE.Vector3(0, 0, -1);
      direction.applyQuaternion(camera.quaternion);
      const origin = camera.position.clone().add(direction.clone().multiplyScalar(1.8));
      
      const bullet = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 4, 4),
        new THREE.MeshBasicMaterial({ color: 0xffdd00 })
      );
      bullet.position.copy(origin);
      bullet.userData = {
        velocity: direction.clone().multiplyScalar(1.3),
        life: 100,
        damage: 22
      };
      scene.add(bullet);
      bullets.push(bullet);
      
      player.ammo--;
      player.shootCooldown = 0.16;
      
      // Вспышка
      const flashPos = origin.clone().add(direction.clone().multiplyScalar(0.4));
      for (let i = 0; i < 4; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.08, 2, 2),
          new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.7 })
        );
        p.position.copy(flashPos);
        p.userData = {
          velocity: new THREE.Vector3((Math.random()-0.5)*0.2, Math.random()*0.2, (Math.random()-0.5)*0.2),
          life: 15
        };
        scene.add(p);
        particles.push(p);
      }
      updateHUD();
    }
    
    function reload() {
      if (player.reloading || player.ammo === player.maxAmmo) return;
      player.reloading = true;
      player.reloadTimer = player.reloadTime;
      showMessage('ПЕРЕЗАРЯДКА', '#ffaa00');
    }
    
    function damagePlayer(amount) {
      if (player.invincible > 0) return;
      player.hp -= amount;
      player.invincible = 0.8;
      
      for (let i = 0; i < 10; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.1, 2, 2),
          new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.8 })
        );
        p.position.copy(camera.position);
        p.userData = {
          velocity: new THREE.Vector3((Math.random()-0.5)*0.3, Math.random()*0.3, (Math.random()-0.5)*0.3),
          life: 20
        };
        scene.add(p);
        particles.push(p);
      }
      
      if (player.hp <= 0) {
        player.hp = 0;
        gameOver = true;
        showMessage('☠️ СТАЛКЕР ПОГИБ В ЗОНЕ ☠️', '#ff0000');
        restartBtn.style.display = 'block';
      }
      updateHUD();
    }
    
    function collectArtifact(artifact) {
      if (artifact.userData.collected) return;
      artifact.userData.collected = true;
      scene.remove(artifact);
      player.artifacts++;
      
      // Лечение
      player.hp = Math.min(player.maxHp, player.hp + 25);
      showMessage('💎 АРТЕФАКТ +25 HP', '#00ff88');
      
      // Создать новый артефакт где-то на карте
      const angle = Math.random() * Math.PI * 2;
      const dist = 10 + Math.random() * 25;
      artifacts.push(createArtifact(
        Math.cos(angle) * dist,
        Math.sin(angle) * dist
      ));
      
      updateHUD();
    }
    
    window.restartGame = function() {
      player.hp = player.maxHp;
      player.ammo = player.maxAmmo;
      player.reloading = false;
      player.reloadTimer = 0;
      player.invincible = 0;
      player.shootCooldown = 0;
      player.artifacts = 0;
      player.kills = 0;
      
      gameOver = false;
      
      bullets.forEach(b => scene.remove(b));
      bullets.length = 0;
      enemies.forEach(e => scene.remove(e));
      enemies.length = 0;
      particles.forEach(p => scene.remove(p));
      particles.length = 0;
      
      artifacts.forEach(a => scene.remove(a));
      artifacts.length = 0;
      spawnArtifacts(5);
      
      camera.position.set(0, 2.5, 20);
      yaw = 0;
      pitch = 0;
      
      messageEl.style.display = 'none';
      restartBtn.style.display = 'none';
      
      updateHUD();
    };
    
    // ==================== ИГРОВОЙ ЦИКЛ ====================
    const clock = new THREE.Clock();
    
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      
      if (!gameOver) {
        // Перезарядка
        if (player.reloading) {
          player.reloadTimer -= dt;
          if (player.reloadTimer <= 0) {
            player.ammo = player.maxAmmo;
            player.reloading = false;
            updateHUD();
          }
        }
        if (player.shootCooldown > 0) player.shootCooldown -= dt;
        if (player.invincible > 0) player.invincible -= dt;
        
        // Движение
        const speed = 7 * dt;
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        forward.y = 0; forward.normalize();
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        right.y = 0; right.normalize();
        
        if (keys['KeyW'] || keys['ArrowUp']) camera.position.add(forward.clone().multiplyScalar(speed));
        if (keys['KeyS'] || keys['ArrowDown']) camera.position.add(forward.clone().multiplyScalar(-speed));
        if (keys['KeyA'] || keys['ArrowLeft']) camera.position.add(right.clone().multiplyScalar(-speed));
        if (keys['KeyD'] || keys['ArrowRight']) camera.position.add(right.clone().multiplyScalar(speed));
        
        camera.position.x = Math.max(-WORLD_SIZE/2+2, Math.min(WORLD_SIZE/2-2, camera.position.x));
        camera.position.z = Math.max(-WORLD_SIZE/2+2, Math.min(WORLD_SIZE/2-2, camera.position.z));
        camera.position.y = 2.5;
        
        // Артефакты
        artifacts.forEach(a => {
          if (a.userData.collected) return;
          if (camera.position.distanceTo(a.position) < 2.5) {
            collectArtifact(a);
          }
        });
        
        // Пули
        for (let i = bullets.length-1; i >= 0; i--) {
          const b = bullets[i];
          b.position.add(b.userData.velocity);
          b.userData.life--;
          if (b.userData.life <= 0 || b.position.y < 0) {
            scene.remove(b);
            bullets.splice(i,1);
            continue;
          }
          
          let hit = false;
          for (let j = enemies.length-1; j >= 0; j--) {
            const e = enemies[j];
            if (b.position.distanceTo(e.position) < 1.2) {
              e.userData.hp -= b.userData.damage;
              if (e.userData.hp <= 0) {
                scene.remove(e);
                enemies.splice(j,1);
                player.kills++;
                for (let k=0;k<12;k++) {
                  const p = new THREE.Mesh(new THREE.SphereGeometry(0.1,2,2), new THREE.MeshBasicMaterial({color:0x88ff00,transparent:true,opacity:0.6}));
                  p.position.copy(e.position);
                  p.userData={velocity:new THREE.Vector3((Math.random()-0.5)*0.25,Math.random()*0.25,(Math.random()-0.5)*0.25),life:20};
                  scene.add(p); particles.push(p);
                }
              }
              hit = true;
              break;
            }
          }
          
          if (hit) {
            scene.remove(b);
            bullets.splice(i,1);
          }
        }
        
        // Враги
        enemies.forEach(e => {
          const dx = camera.position.x - e.position.x;
          const dz = camera.position.z - e.position.z;
          const dist = Math.sqrt(dx*dx+dz*dz);
          if (dist > 1.5) {
            e.position.x += (dx/dist) * e.userData.speed;
            e.position.z += (dz/dist) * e.userData.speed;
          }
          e.position.y = 0.7 + Math.sin(Date.now()*0.006 + e.position.x)*0.15;
          e.lookAt(camera.position.x, e.position.y, camera.position.z);
          
          if (dist < 2.2 && e.userData.attackCooldown <= 0) {
            damagePlayer(e.userData.damage);
            e.userData.attackCooldown = 1.4;
          }
          if (e.userData.attackCooldown > 0) e.userData.attackCooldown -= dt;
        });
        
        // Спавн врагов
        if (enemies.length < 8 && Math.random() < 0.03) {
          spawnEnemy();
        }
        
        // Частицы
        for (let i=particles.length-1;i>=0;i--) {
          const p = particles[i];
          p.position.add(p.userData.velocity);
          p.userData.velocity.y += 0.005;
          p.userData.life--;
          p.material.opacity = p.userData.life / 20;
          if (p.userData.life <= 0) {
            scene.remove(p);
            particles.splice(i,1);
          }
        }
        
        updateHUD();
      }
      
      glowLight.intensity = 18 + Math.sin(Date.now()*0.003)*6;
      renderer.render(scene, camera);
    }
    
    // ==================== УПРАВЛЕНИЕ ====================
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'KeyR') reload();
      e.preventDefault();
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; e.preventDefault(); });
    
    renderer.domElement.addEventListener('click', () => {
      if (!isPointerLocked) renderer.domElement.requestPointerLock();
    });
    document.addEventListener('pointerlockchange', () => {
      isPointerLocked = document.pointerLockElement === renderer.domElement;
    });
    document.addEventListener('mousemove', e => {
      if (!isPointerLocked) return;
      yaw -= e.movementX * mouseSensitivity;
      pitch -= e.movementY * mouseSensitivity;
      pitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, pitch));
      camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
    });
    renderer.domElement.addEventListener('mousedown', e => {
      if (e.button === 0 && isPointerLocked) { mouseDown = true; shoot(); }
    });
    renderer.domElement.addEventListener('mouseup', e => {
      if (e.button === 0) mouseDown = false;
    });
    setInterval(() => {
      if (mouseDown && isPointerLocked && !gameOver) shoot();
    }, 140);
    
    // Мобильное управление
    document.querySelectorAll('.mbtn').forEach(btn => {
      btn.addEventListener('touchstart', e => {
        e.preventDefault();
        const key = btn.dataset.key;
        if (key === 'shoot') { mouseDown = true; shoot(); }
        else if (key === 'reload') reload();
        else keys[key] = true;
      });
      btn.addEventListener('touchend', e => {
        e.preventDefault();
        const key = btn.dataset.key;
        if (key === 'shoot') mouseDown = false;
        else if (key !== 'reload') keys[key] = false;
      });
    });
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // ==================== СТАРТ ====================
    for (let i = 0; i < 5; i++) spawnEnemy();
    updateHUD();
    animate();
    console.log('☢️ СТАЛКЕР: ЗОНА — выживи, собирай артефакты, убивай мутантов!');
  </script>
</body>
</html>
