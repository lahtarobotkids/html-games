<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>☢️ Чернобыль 3D: Войнушка с Гигахрущовкой</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      touch-action: none;
      user-select: none;
    }

    canvas {
      display: block;
    }

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      pointer-events: none;
      padding: 15px;
    }

    .hud-panel {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(20, 20, 5, 0.85);
      padding: 12px 25px;
      border-radius: 30px;
      border: 2px solid #6b6b2a;
      color: #d4d400;
      font-weight: bold;
      font-size: 1rem;
      text-shadow: 0 0 8px #ffaa00;
      box-shadow: 0 0 20px rgba(255, 150, 0, 0.4);
      max-width: 700px;
      margin: 0 auto;
    }

    .health-bar {
      width: 100px;
      height: 12px;
      background: #331111;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #aa4444;
      display: inline-block;
      vertical-align: middle;
    }

    .health-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff3333, #ff8800);
      transition: width 0.2s;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 30px;
      height: 30px;
      pointer-events: none;
    }

    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
    }

    #crosshair::before {
      width: 2px;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
    }

    #crosshair::after {
      height: 2px;
      width: 100%;
      top: 50%;
      transform: translateY(-50%);
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffff00;
      font-size: 2.5rem;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 0 20px #ff8800, 0 0 40px #ff4400;
      pointer-events: none;
      display: none;
    }

    #restartBtn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #3a3a0a;
      border: 2px solid #aaaa2a;
      color: #ffff88;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 10px 30px;
      border-radius: 30px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 5px #ffaa00;
      box-shadow: 0 0 20px rgba(200, 200, 0, 0.4);
      z-index: 10;
      display: none;
    }

    #restartBtn:hover {
      background: #5a5a0a;
      box-shadow: 0 0 30px rgba(255, 255, 0, 0.7);
    }

    #mobileControls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 8px;
      z-index: 5;
    }

    .mbtn {
      width: 55px;
      height: 55px;
      border-radius: 15px;
      background: rgba(40, 40, 10, 0.7);
      border: 2px solid #888833;
      color: #dddd44;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    @media (max-width: 768px) {
      #mobileControls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }
      .hud-panel {
        font-size: 0.8rem;
        padding: 8px 15px;
        gap: 10px;
      }
    }

    #instructions {
      position: absolute;
      top: 120px;
      left: 50%;
      transform: translateX(-50%);
      color: #aaaa88;
      font-size: 0.85rem;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 0 5px #000;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="hud-panel">
      <span>❤️ <div class="health-bar"><div class="health-fill" id="healthFill" style="width:100%"></div></div></span>
      <span>🔫 <span id="ammoDisplay">30</span>/<span id="maxAmmoDisplay">30</span></span>
      <span>💀 <span id="killDisplay">0</span></span>
      <span>🐛 Босс: <span id="bossHpDisplay">--</span>%</span>
    </div>
  </div>
  <div id="crosshair"></div>
  <div id="message"></div>
  <button id="restartBtn" onclick="restartGame()">🔄 РЕСТАРТ</button>
  <div id="instructions">WASD/стрелки — движение | Мышь — взгляд | Клик — стрельба | R — перезарядка</div>
  <div id="mobileControls">
    <div class="mbtn" data-key="ArrowUp">⬆️</div>
    <div class="mbtn" data-key="ArrowLeft">⬅️</div>
    <div class="mbtn" data-key="ArrowDown">⬇️</div>
    <div class="mbtn" data-key="ArrowRight">➡️</div>
    <div class="mbtn" data-key="shoot" style="background:#442222;border-color:#aa4444;">💥</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    
    // ============ ОСНОВНЫЕ ПЕРЕМЕННЫЕ ============
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a05);
    scene.fog = new THREE.FogExp2(0x1a1a05, 0.00008);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.5, 500);
    camera.position.set(0, 3, 15);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);
    
    // ============ ИГРОВОЕ СОСТОЯНИЕ ============
    const player = {
      hp: 100,
      maxHp: 100,
      ammo: 30,
      maxAmmo: 30,
      reloading: false,
      reloadTimer: 0,
      reloadTime: 1.5,
      invincible: 0,
      shootCooldown: 0
    };
    
    let kills = 0;
    let bossActive = false;
    let bossSpawned = false;
    let bossHp = 300;
    let bossMaxHp = 300;
    let gameOver = false;
    let gameWin = false;
    
    const bullets = [];
    const enemies = [];
    let boss = null;
    const particles = [];
    
    const keys = {};
    let mouseDown = false;
    
    // Управление камерой
    let yaw = 0;
    let pitch = 0;
    const mouseSensitivity = 0.002;
    let isPointerLocked = false;
    
    // ============ HUD ЭЛЕМЕНТЫ ============
    const healthFill = document.getElementById('healthFill');
    const ammoDisplay = document.getElementById('ammoDisplay');
    const maxAmmoDisplay = document.getElementById('maxAmmoDisplay');
    const killDisplay = document.getElementById('killDisplay');
    const bossHpDisplay = document.getElementById('bossHpDisplay');
    const messageEl = document.getElementById('message');
    const restartBtn = document.getElementById('restartBtn');
    
    function updateHUD() {
      healthFill.style.width = `${(player.hp / player.maxHp) * 100}%`;
      ammoDisplay.textContent = player.ammo;
      maxAmmoDisplay.textContent = player.maxAmmo;
      killDisplay.textContent = kills;
      if (bossActive && boss) {
        bossHpDisplay.textContent = `${Math.max(0, Math.floor((boss.userData.hp / bossMaxHp) * 100))}`;
      } else {
        bossHpDisplay.textContent = '--';
      }
    }
    
    function showMessage(text, color = '#ffff00') {
      messageEl.style.display = 'block';
      messageEl.textContent = text;
      messageEl.style.color = color;
      setTimeout(() => {
        if (messageEl.textContent === text) {
          messageEl.style.display = 'none';
        }
      }, 2500);
    }
    
    // ============ ОСВЕЩЕНИЕ ============
    const ambientLight = new THREE.AmbientLight(0x334422, 0.6);
    scene.add(ambientLight);
    
    const moonLight = new THREE.DirectionalLight(0x8899aa, 1.2);
    moonLight.position.set(30, 40, 20);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.width = 1024;
    moonLight.shadow.mapSize.height = 1024;
    moonLight.shadow.camera.near = 0.5;
    moonLight.shadow.camera.far = 150;
    moonLight.shadow.camera.left = -60;
    moonLight.shadow.camera.right = 60;
    moonLight.shadow.camera.top = 60;
    moonLight.shadow.camera.bottom = -60;
    scene.add(moonLight);
    
    // Радиоактивное свечение
    const glowLight = new THREE.PointLight(0x88ff00, 30, 50);
    glowLight.position.set(0, 5, 0);
    scene.add(glowLight);
    
    // ============ ЗЕМЛЯ ============
    const groundGeometry = new THREE.PlaneGeometry(200, 200);
    const groundMaterial = new THREE.MeshStandardMaterial({ 
      color: 0x2a2a0a, 
      roughness: 0.9,
      metalness: 0.1
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    
    // Сетка дорог
    const gridHelper = new THREE.PolarGridHelper(100, 40, 30, 64, 0x333310, 0x333310);
    gridHelper.position.y = 0.05;
    scene.add(gridHelper);
    
    // ============ РАДИОАКТИВНЫЕ ПЯТНА ============
    for (let i = 0; i < 15; i++) {
      const spotGeom = new THREE.CircleGeometry(3 + Math.random() * 8, 32);
      const spotMat = new THREE.MeshBasicMaterial({ 
        color: 0xffff00, 
        transparent: true, 
        opacity: 0.08 + Math.random() * 0.06,
        side: THREE.DoubleSide
      });
      const spot = new THREE.Mesh(spotGeom, spotMat);
      spot.rotation.x = -Math.PI / 2;
      spot.position.set(
        (Math.random() - 0.5) * 120,
        0.08,
        (Math.random() - 0.5) * 120
      );
      scene.add(spot);
    }
    
    // ============ РАЗРУШЕННЫЕ ЗДАНИЯ ============
    function createBuilding(x, z, w, h, d, color) {
      const geom = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.2 });
      const building = new THREE.Mesh(geom, mat);
      building.position.set(x, h/2, z);
      building.castShadow = true;
      building.receiveShadow = true;
      scene.add(building);
      
      // Разрушенные элементы
      if (Math.random() > 0.4) {
        const rubbleGeom = new THREE.BoxGeometry(w * 0.6, 0.5, d * 0.6);
        const rubble = new THREE.Mesh(rubbleGeom, new THREE.MeshStandardMaterial({ color: 0x444433, roughness: 0.9 }));
        rubble.position.set(x + (Math.random()-0.5)*3, 0.25, z + (Math.random()-0.5)*3);
        rubble.rotation.y = Math.random() * Math.PI;
        rubble.castShadow = true;
        scene.add(rubble);
      }
      
      return building;
    }
    
    // Создаём квартал хрущёвок
    const buildings = [];
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const radius = 25 + Math.random() * 20;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const w = 4 + Math.random() * 6;
      const h = 5 + Math.random() * 15;
      const d = 4 + Math.random() * 6;
      const color = new THREE.Color().setHSL(0.1, 0.05, 0.2 + Math.random() * 0.15);
      buildings.push(createBuilding(x, z, w, h, d, color));
    }
    
    // ============ ДЕРЕВЬЯ (мёртвые) ============
    function createDeadTree(x, z) {
      const group = new THREE.Group();
      
      const trunkGeom = new THREE.CylinderGeometry(0.2, 0.4, 4 + Math.random() * 4, 8);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.9 });
      const trunk = new THREE.Mesh(trunkGeom, trunkMat);
      trunk.position.y = 2;
      trunk.castShadow = true;
      group.add(trunk);
      
      // Ветки
      for (let j = 0; j < 3; j++) {
        const branchGeom = new THREE.CylinderGeometry(0.05, 0.15, 2 + Math.random() * 2, 6);
        const branch = new THREE.Mesh(branchGeom, trunkMat);
        branch.position.y = 3 + j * 1.2;
        branch.rotation.z = (Math.random() - 0.5) * 1.5;
        branch.rotation.x = (Math.random() - 0.5) * 1.5;
        branch.castShadow = true;
        group.add(branch);
      }
      
      group.position.set(x, 0, z);
      scene.add(group);
      return group;
    }
    
    for (let i = 0; i < 25; i++) {
      createDeadTree(
        (Math.random() - 0.5) * 80,
        (Math.random() - 0.5) * 80
      );
    }
    
    // ============ ИГРОК (невидимое тело) ============
    const playerGroup = new THREE.Group();
    playerGroup.position.set(0, 2, 10);
    scene.add(playerGroup);
    
    // Оружие (видно от первого лица)
    const gunGroup = new THREE.Group();
    gunGroup.position.set(0.4, -0.3, -0.6);
    camera.add(gunGroup);
    
    const gunBodyGeom = new THREE.BoxGeometry(0.08, 0.15, 0.5);
    const gunBodyMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.8 });
    const gunBody = new THREE.Mesh(gunBodyGeom, gunBodyMat);
    gunGroup.add(gunBody);
    
    const gunBarrelGeom = new THREE.CylinderGeometry(0.03, 0.04, 0.4, 8);
    const gunBarrel = new THREE.Mesh(gunBarrelGeom, gunBodyMat);
    gunBarrel.rotation.x = Math.PI / 2;
    gunBarrel.position.set(0, 0, -0.4);
    gunGroup.add(gunBarrel);
    
    // Дуло
    const muzzleGeom = new THREE.CylinderGeometry(0.05, 0.06, 0.15, 8);
    const muzzleMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.3, metalness: 0.9 });
    const muzzle = new THREE.Mesh(muzzleGeom, muzzleMat);
    muzzle.rotation.x = Math.PI / 2;
    muzzle.position.set(0, 0, -0.6);
    gunGroup.add(muzzle);
    
    // ============ ФУНКЦИИ СОЗДАНИЯ ОБЪЕКТОВ ============
    function createEnemy(x, z) {
      const group = new THREE.Group();
      
      // Тело (панцирь хрущёвки)
      const bodyGeom = new THREE.SphereGeometry(1, 16, 12);
      bodyGeom.scale(1, 0.6, 1.2);
      const bodyMat = new THREE.MeshStandardMaterial({ 
        color: new THREE.Color().setHSL(0.12, 0.6, 0.2 + Math.random() * 0.15),
        roughness: 0.5,
        metalness: 0.3,
        emissive: new THREE.Color(0x113300),
        emissiveIntensity: 0.3
      });
      const body = new THREE.Mesh(bodyGeom, bodyMat);
      body.castShadow = true;
      group.add(body);
      
      // Глаза
      const eyeGeom = new THREE.SphereGeometry(0.25, 8, 8);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const leftEye = new THREE.Mesh(eyeGeom, eyeMat);
      leftEye.position.set(-0.4, 0.3, 0.8);
      group.add(leftEye);
      const rightEye = new THREE.Mesh(eyeGeom, eyeMat);
      rightEye.position.set(0.4, 0.3, 0.8);
      group.add(rightEye);
      
      // Усы
      const whiskerGeom = new THREE.CylinderGeometry(0.03, 0.06, 2, 6);
      const whiskerMat = new THREE.MeshStandardMaterial({ color: 0xaaffaa, emissive: 0x224422, emissiveIntensity: 0.5 });
      for (let s = -1; s <= 1; s += 2) {
        const whisker = new THREE.Mesh(whiskerGeom, whiskerMat);
        whisker.position.set(s * 0.3, 0.1, 1);
        whisker.rotation.z = s * 0.6;
        whisker.rotation.x = -0.4;
        group.add(whisker);
      }
      
      group.position.set(x, 0.8, z);
      group.userData = {
        hp: 30 + Math.floor(Math.random() * 25),
        maxHp: 55,
        speed: 0.04 + Math.random() * 0.04,
        damage: 10,
        attackCooldown: 0,
        type: 'enemy'
      };
      
      scene.add(group);
      return group;
    }
    
    function createBoss() {
      const group = new THREE.Group();
      
      // Огромное тело
      const bodyGeom = new THREE.SphereGeometry(4, 24, 18);
      bodyGeom.scale(1, 0.7, 1.1);
      const bodyMat = new THREE.MeshStandardMaterial({ 
        color: 0x4a3a0a,
        roughness: 0.4,
        metalness: 0.4,
        emissive: 0x221100,
        emissiveIntensity: 0.5
      });
      const body = new THREE.Mesh(bodyGeom, bodyMat);
      body.castShadow = true;
      group.add(body);
      
      // Панцирные пластины
      for (let i = 0; i < 8; i++) {
        const plateGeom = new THREE.CylinderGeometry(0.5, 0.7, 0.3, 8);
        const plate = new THREE.Mesh(plateGeom, bodyMat);
        const a = (i / 8) * Math.PI * 2;
        plate.position.set(Math.cos(a) * 3.5, 0.5, Math.sin(a) * 3.5);
        plate.rotation.z = Math.PI / 2;
        plate.rotation.y = a;
        group.add(plate);
      }
      
      // Глаза
      const eyeGeom = new THREE.SphereGeometry(0.8, 16, 16);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const leftEye = new THREE.Mesh(eyeGeom, eyeMat);
      leftEye.position.set(-1.5, 1, 3.2);
      group.add(leftEye);
      const rightEye = new THREE.Mesh(eyeGeom, eyeMat);
      rightEye.position.set(1.5, 1, 3.2);
      group.add(rightEye);
      
      // Гигантские усы
      for (let s = -1; s <= 1; s += 2) {
        const whiskerGeom = new THREE.CylinderGeometry(0.15, 0.3, 10, 8);
        const whiskerMat = new THREE.MeshStandardMaterial({ 
          color: 0xaaff00, 
          emissive: 0x336600,
          emissiveIntensity: 0.7 
        });
        const whisker = new THREE.Mesh(whiskerGeom, whiskerMat);
        whisker.position.set(s * 1.5, 0.5, 3);
        whisker.rotation.z = s * 0.5;
        whisker.rotation.x = -0.3;
        group.add(whisker);
      }
      
      group.position.set(0, 0, -30);
      group.userData = {
        hp: bossMaxHp,
        maxHp: bossMaxHp,
        speed: 0.05,
        damage: 25,
        attackCooldown: 0,
        specialCooldown: 0,
        entered: false,
        targetY: 3,
        type: 'boss'
      };
      
      scene.add(group);
      return group;
    }
    
    function createBullet(origin, direction) {
      const geom = new THREE.SphereGeometry(0.15, 6, 6);
      const mat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
      const bullet = new THREE.Mesh(geom, mat);
      bullet.position.copy(origin);
      bullet.userData = {
        velocity: direction.clone().multiplyScalar(1.2),
        life: 120,
        damage: 15
      };
      scene.add(bullet);
      return bullet;
    }
    
    function createParticle(position, color, count = 8) {
      for (let i = 0; i < count; i++) {
        const geom = new THREE.SphereGeometry(0.1 + Math.random() * 0.2, 4, 4);
        const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8 });
        const particle = new THREE.Mesh(geom, mat);
        particle.position.copy(position);
        particle.userData = {
          velocity: new THREE.Vector3(
            (Math.random() - 0.5) * 0.3,
            Math.random() * 0.3,
            (Math.random() - 0.5) * 0.3
          ),
          life: 30 + Math.random() * 30
        };
        scene.add(particle);
        particles.push(particle);
      }
    }
    
    // ============ ИГРОВАЯ ЛОГИКА ============
    function spawnEnemy() {
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 20;
      const x = camera.position.x + Math.cos(angle) * dist;
      const z = camera.position.z + Math.sin(angle) * dist;
      enemies.push(createEnemy(x, z));
    }
    
    function shoot() {
      if (player.ammo <= 0 || player.reloading || player.shootCooldown > 0) return;
      
      const direction = new THREE.Vector3(0, 0, -1);
      direction.applyQuaternion(camera.quaternion);
      
      const origin = camera.position.clone().add(direction.clone().multiplyScalar(1.5));
      bullets.push(createBullet(origin, direction));
      
      player.ammo--;
      player.shootCooldown = 0.15;
      
      // Вспышка
      createParticle(origin.clone().add(direction.clone().multiplyScalar(0.5)), 0xffaa00, 3);
      
      updateHUD();
    }
    
    function reload() {
      if (player.reloading || player.ammo === player.maxAmmo) return;
      player.reloading = true;
      player.reloadTimer = player.reloadTime;
      showMessage('ПЕРЕЗАРЯДКА...', '#ffaa00');
    }
    
    function damagePlayer(amount) {
      if (player.invincible > 0) return;
      player.hp -= amount;
      player.invincible = 0.8;
      createParticle(camera.position, 0xff0000, 12);
      
      if (player.hp <= 0) {
        player.hp = 0;
        gameOver = true;
        showMessage('☠️ СМЕРТЬ ОТ РАДИАЦИИ ☠️', '#ff4444');
        restartBtn.style.display = 'block';
      }
      updateHUD();
    }
    
    function spawnBoss() {
      if (bossSpawned) return;
      boss = createBoss();
      bossActive = true;
      bossSpawned = true;
      
      // Удаляем всех мелких врагов
      enemies.forEach(e => scene.remove(e));
      enemies.length = 0;
      
      showMessage('⚠️ ГИГАХРУЩОВКА ПРОБУЖДАЕТСЯ! ⚠️', '#ff8800');
    }
    
    window.restartGame = function() {
      player.hp = player.maxHp;
      player.ammo = player.maxAmmo;
      player.reloading = false;
      player.reloadTimer = 0;
      player.invincible = 0;
      player.shootCooldown = 0;
      
      kills = 0;
      bossActive = false;
      bossSpawned = false;
      gameOver = false;
      gameWin = false;
      
      // Очистка
      bullets.forEach(b => scene.remove(b));
      bullets.length = 0;
      enemies.forEach(e => scene.remove(e));
      enemies.length = 0;
      particles.forEach(p => scene.remove(p));
      particles.length = 0;
      if (boss) {
        scene.remove(boss);
        boss = null;
      }
      
      camera.position.set(0, 3, 15);
      yaw = 0;
      pitch = 0;
      
      messageEl.style.display = 'none';
      restartBtn.style.display = 'none';
      
      updateHUD();
    };
    
    // ============ АНИМАЦИЯ ============
    const clock = new THREE.Clock();
    
    function animate() {
      requestAnimationFrame(animate);
      
      const dt = Math.min(clock.getDelta(), 0.1);
      
      if (!gameOver && !gameWin) {
        // Перезарядка
        if (player.reloading) {
          player.reloadTimer -= dt;
          if (player.reloadTimer <= 0) {
            player.ammo = player.maxAmmo;
            player.reloading = false;
            updateHUD();
          }
        }
        
        // Кулдаун стрельбы
        if (player.shootCooldown > 0) player.shootCooldown -= dt;
        
        // Неуязвимость
        if (player.invincible > 0) player.invincible -= dt;
        
        // Движение игрока
        const moveSpeed = 8 * dt;
        const forward = new THREE.Vector3(0, 0, -1);
        forward.applyQuaternion(camera.quaternion);
        forward.y = 0;
        forward.normalize();
        
        const right = new THREE.Vector3(1, 0, 0);
        right.applyQuaternion(camera.quaternion);
        right.y = 0;
        right.normalize();
        
        if (keys['KeyW'] || keys['ArrowUp']) {
          camera.position.add(forward.clone().multiplyScalar(moveSpeed));
        }
        if (keys['KeyS'] || keys['ArrowDown']) {
          camera.position.add(forward.clone().multiplyScalar(-moveSpeed));
        }
        if (keys['KeyA'] || keys['ArrowLeft']) {
          camera.position.add(right.clone().multiplyScalar(-moveSpeed));
        }
        if (keys['KeyD'] || keys['ArrowRight']) {
          camera.position.add(right.clone().multiplyScalar(moveSpeed));
        }
        
        // Ограничение области
        camera.position.x = Math.max(-45, Math.min(45, camera.position.x));
        camera.position.z = Math.max(-45, Math.min(45, camera.position.z));
        camera.position.y = 2.5;
        
        // Обновление пуль
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.position.add(b.userData.velocity);
          b.userData.life--;
          
          if (b.userData.life <= 0 || b.position.y < 0 || b.position.y > 15) {
            scene.remove(b);
            bullets.splice(i, 1);
            continue;
          }
          
          // Попадание во врагов
          let hit = false;
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            const dist = b.position.distanceTo(e.position);
            if (dist < 1.5) {
              e.userData.hp -= b.userData.damage;
              createParticle(b.position.clone(), 0x88ff00, 5);
              
              if (e.userData.hp <= 0) {
                scene.remove(e);
                enemies.splice(j, 1);
                kills++;
                createParticle(e.position.clone(), 0xffff00, 15);
                
                if (kills >= 12 && !bossSpawned) {
                  spawnBoss();
                }
              }
              hit = true;
              break;
            }
          }
          
          // Попадание в босса
          if (!hit && bossActive && boss && boss.userData.entered) {
            const dist = b.position.distanceTo(boss.position);
            if (dist < 5) {
              boss.userData.hp -= b.userData.damage;
              createParticle(b.position.clone(), 0xffaa00, 8);
              
              if (boss.userData.hp <= 0) {
                scene.remove(boss);
                boss = null;
                bossActive = false;
                gameWin = true;
                createParticle(new THREE.Vector3(0, 3, 0), 0xffff00, 40);
                showMessage('🏆 ГИГАХРУЩОВКА ПОВЕРЖЕНА! ЧЕРНОБЫЛЬ СПАСЁН! 🏆', '#ffff00');
                restartBtn.style.display = 'block';
              }
              hit = true;
            }
          }
          
          if (hit) {
            scene.remove(b);
            bullets.splice(i, 1);
          }
        }
        
        // Обновление врагов
        for (const e of enemies) {
          const dx = camera.position.x - e.position.x;
          const dz = camera.position.z - e.position.z;
          const dist = Math.sqrt(dx*dx + dz*dz);
          
          if (dist > 1.2) {
            e.position.x += (dx / dist) * e.userData.speed;
            e.position.z += (dz / dist) * e.userData.speed;
          }
          
          e.position.y = 0.8 + Math.sin(Date.now() * 0.005 + e.position.x) * 0.2;
          e.lookAt(camera.position.x, e.position.y, camera.position.z);
          
          // Атака
          if (dist < 2 && e.userData.attackCooldown <= 0) {
            damagePlayer(e.userData.damage);
            e.userData.attackCooldown = 1.5;
          }
          if (e.userData.attackCooldown > 0) e.userData.attackCooldown -= dt;
        }
        
        // Спавн врагов
        if (!bossActive && enemies.length < 6 && Math.random() < 0.02) {
          spawnEnemy();
        }
        
        // Обновление босса
        if (bossActive && boss) {
          if (!boss.userData.entered) {
            boss.position.z += 0.06;
            if (boss.position.z >= 0) {
              boss.userData.entered = true;
            }
          } else {
            const dx = camera.position.x - boss.position.x;
            const dz = camera.position.z - boss.position.z;
            const dist = Math.sqrt(dx*dx + dz*dz);
            
            if (dist > 4) {
              boss.position.x += (dx / dist) * boss.userData.speed;
              boss.position.z += (dz / dist) * boss.userData.speed;
            }
            
            boss.position.y = 3 + Math.sin(Date.now() * 0.003) * 0.5;
            boss.lookAt(camera.position.x, boss.position.y, camera.position.z);
            
            // Атака
            if (dist < 6 && boss.userData.attackCooldown <= 0) {
              damagePlayer(boss.userData.damage);
              boss.userData.attackCooldown = 1.8;
            }
            if (boss.userData.attackCooldown > 0) boss.userData.attackCooldown -= dt;
            
            // Спецатака
            if (boss.userData.specialCooldown <= 0) {
              boss.userData.specialCooldown = 4;
              for (let i = 0; i < 8; i++) {
                const pos = camera.position.clone().add(
                  new THREE.Vector3((Math.random()-0.5)*8, 0, (Math.random()-0.5)*8)
                );
                createParticle(pos, 0xffff00, 5);
              }
              if (dist < 7) damagePlayer(8);
            }
            if (boss.userData.specialCooldown > 0) boss.userData.specialCooldown -= dt;
          }
        }
        
        // Обновление частиц
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.position.add(p.userData.velocity);
          p.userData.velocity.y += 0.005;
          p.userData.life--;
          p.material.opacity = p.userData.life / 30;
          
          if (p.userData.life <= 0) {
            scene.remove(p);
            particles.splice(i, 1);
          }
        }
        
        // Автоперезарядка
        if (player.ammo <= 0 && !player.reloading) {
          reload();
        }
        
        updateHUD();
      }
      
      // Обновление свечения
      glowLight.intensity = 25 + Math.sin(Date.now() * 0.002) * 8;
      
      renderer.render(scene, camera);
    }
    
    // ============ УПРАВЛЕНИЕ ============
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      
      if (e.code === 'KeyR' && !player.reloading && player.ammo < player.maxAmmo) {
        reload();
      }
      
      if (e.code === 'KeyF' && (gameOver || gameWin)) {
        window.restartGame();
      }
      
      e.preventDefault();
    });
    
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      e.preventDefault();
    });
    
    renderer.domElement.addEventListener('click', () => {
      if (!isPointerLocked) {
        renderer.domElement.requestPointerLock();
      }
    });
    
    document.addEventListener('pointerlockchange', () => {
      isPointerLocked = document.pointerLockElement === renderer.domElement;
    });
    
    document.addEventListener('mousemove', (e) => {
      if (!isPointerLocked) return;
      
      yaw -= e.movementX * mouseSensitivity;
      pitch -= e.movementY * mouseSensitivity;
      pitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, pitch));
      
      camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
    });
    
    renderer.domElement.addEventListener('mousedown', (e) => {
      if (e.button === 0 && isPointerLocked) {
        mouseDown = true;
        shoot();
      }
    });
    
    renderer.domElement.addEventListener('mouseup', (e) => {
      if (e.button === 0) {
        mouseDown = false;
      }
    });
    
    // Автострельба при удержании
    setInterval(() => {
      if (mouseDown && isPointerLocked && !gameOver && !gameWin) {
        shoot();
      }
    }, 150);
    
    // Мобильное управление
    document.querySelectorAll('.mbtn').forEach(btn => {
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const key = btn.dataset.key;
        if (key === 'shoot') {
          mouseDown = true;
          shoot();
        } else {
          keys[key] = true;
        }
      });
      btn.addEventListener('touchend', (e) => {
        e.preventDefault();
        const key = btn.dataset.key;
        if (key === 'shoot') {
          mouseDown = false;
        } else {
          keys[key] = false;
        }
      });
    });
    
    // Адаптивность
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // ============ ЗАПУСК ============
    // Начальные враги
    for (let i = 0; i < 4; i++) {
      spawnEnemy();
    }
    
    updateHUD();
    animate();
    
    console.log('☢️ Чернобыль 3D: Войнушка с Гигахрущовкой запущена!');
    console.log('Управление: WASD/стрелки - движение, Мышь - взгляд, Клик - стрельба, R - перезарядка');
    console.log('Убейте 12 хрущёвок-мутантов чтобы пробудить босса!');
  </script>
</body>
</html>
