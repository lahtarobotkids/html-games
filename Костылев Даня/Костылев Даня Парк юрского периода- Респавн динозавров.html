<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Парк юрского периода: Респавн динозавров</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
    #hud {
      position: absolute; top: 20px; left: 20px; color: white;
      background: rgba(0,0,0,0.7); padding: 15px 20px; border-radius: 12px;
      pointer-events: none; user-select: none; backdrop-filter: blur(5px);
    }
    .bar { width: 200px; height: 14px; background: #333; border-radius: 7px; margin: 5px 0; overflow: hidden; }
    .fill { height: 100%; width: 100%; background: #0f0; transition: width 0.3s; }
    #message {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(0,0,0,0.9); color: white; padding: 25px 35px; border-radius: 16px;
      font-size: 26px; text-align: center; display: none;
      backdrop-filter: blur(6px); z-index: 10;
      pointer-events: auto;
    }
    #message button {
      display: block; margin: 20px auto 0; padding: 12px 30px;
      font-size: 20px; background: #e74c3c; color: white; border: none;
      border-radius: 10px; cursor: pointer; font-weight: bold;
    }
    #message button:hover { background: #c0392b; }
    #start-hint {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(0,0,0,0.7); color: white; padding: 15px 30px; border-radius: 10px;
      font-size: 20px; pointer-events: none; backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>❤️ Здоровье: <span id="hp">100</span> | 🍖 Голод: <span id="hunger">100</span></div>
    <div class="bar"><div id="hp-fill" class="fill" style="width:100%"></div></div>
    <div>🥚 Яйца: <span id="eggs-carry">0</span> (инвентарь) | В гнезде: <span id="eggs-nest">0</span>/5</div>
    <div style="margin-top:5px;">⚔️ Удар насмерть | F/А – атака</div>
  </div>
  <div id="message"></div>
  <div id="start-hint">Кликните для управления | WASD/ЦФЫВ – ходьба | E/Е – действие | F/А – убить</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    // ==================== НАСТРОЙКИ ====================
    const WORLD = 100;
    const SPEED = 8;
    const PLAYER_H = 1.8;
    const MOUSE_SENS = 0.002;
    const INTERACT_DIST = 3.5;
    const HUNGER_RATE = 2.0;
    const STARVE_DMG = 4;
    const DINO_SPEED = 4.0;
    const RAPTOR_SPEED = 6.0;
    const RAPTOR_DAMAGE = 15;
    const EGGS_TO_WIN = 5;
    const PLAYER_ATTACK_RANGE = 3.0;
    const RESPAWN_TIME = 20; // секунд до возрождения

    // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x87CEEB, 0.0003);
    const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
    camera.position.set(0, PLAYER_H, 0);
    camera.rotation.order = 'YXZ';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    // ==================== ПРОЦЕДУРНЫЕ ТЕКСТУРЫ ====================
    function tex(w, h, cb) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      cb(c.getContext('2d'), w, h);
      const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
      return t;
    }
    const grassTex = tex(256,256,(ctx,w,h)=>{
      ctx.fillStyle='#3d6b24'; ctx.fillRect(0,0,w,h);
      for(let i=0;i<2000;i++){ ctx.fillStyle=`rgb(${50+Math.random()*40},${90+Math.random()*60},${15+Math.random()*30})`; ctx.fillRect(Math.random()*w,Math.random()*h,2,2); }
    }); grassTex.repeat.set(30,30);
    const rockTex = tex(256,256,(ctx,w,h)=>{
      ctx.fillStyle='#5a5a5a'; ctx.fillRect(0,0,w,h);
      for(let i=0;i<1500;i++){ ctx.fillStyle=`rgb(${70+Math.random()*40},${70+Math.random()*40},${70+Math.random()*40})`; ctx.fillRect(Math.random()*w,Math.random()*h,3,3); }
    }); rockTex.repeat.set(10,10);

    // ==================== ОСВЕЩЕНИЕ И НЕБО ====================
    scene.add(new THREE.AmbientLight(0x404060));
    const sun = new THREE.DirectionalLight(0xffeedd, 1.6);
    sun.position.set(50, 70, 40);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048,2048);
    sun.shadow.camera.near=0.5; sun.shadow.camera.far=200;
    sun.shadow.camera.left=-50; sun.shadow.camera.right=50;
    sun.shadow.camera.top=50; sun.shadow.camera.bottom=-50;
    scene.add(sun);

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(140,32,32),
      new THREE.ShaderMaterial({
        uniforms:{sunPos:{value:new THREE.Vector3(50,70,40)}},
        vertexShader:`varying vec3 wPos; void main(){ vec4 wp=modelMatrix*vec4(position,1.0); wPos=wp.xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader:`varying vec3 wPos; uniform vec3 sunPos; void main(){ vec3 d=normalize(wPos); float s=dot(normalize(sunPos),d); vec3 col=mix(vec3(0.9,0.8,0.6),vec3(0.4,0.7,1.0),abs(d.y)); col+=vec3(1.0,0.9,0.6)*smoothstep(0.98,0.999,s)*0.5; gl_FragColor=vec4(col,1.0); }`,
        side:THREE.BackSide
      })
    );
    scene.add(sky);

    // ==================== ЛАНДШАФТ ====================
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(WORLD,WORLD,64,64), new THREE.MeshStandardMaterial({map:grassTex,roughness:0.8}));
    ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
    const water = new THREE.Mesh(new THREE.PlaneGeometry(160,160), new THREE.MeshStandardMaterial({color:0x1a5276,roughness:0.2,metalness:0.1,transparent:true,opacity:0.85}));
    water.rotation.x=-Math.PI/2; water.position.y=-0.2; water.receiveShadow=true; scene.add(water);
    for(let i=0;i<18;i++){
      const a=(i/18)*Math.PI*2, d=WORLD/2+15+Math.random()*8;
      const h=4+Math.random()*12;
      const m=new THREE.Mesh(new THREE.ConeGeometry(5+Math.random()*2,h,8), new THREE.MeshStandardMaterial({color:0x8b8b7a,roughness:0.9,map:rockTex}));
      m.position.set(Math.cos(a)*d,h/2,Math.sin(a)*d); m.castShadow=m.receiveShadow=true; scene.add(m);
    }

    // ==================== ДИНОЗАВРЫ ====================
    function createTriceratops(x, z) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.8,1.2,2.5), new THREE.MeshStandardMaterial({color:0x8B6914}));
      body.position.y=0.9; body.castShadow=body.receiveShadow=true; group.add(body);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.7,0.8), new THREE.MeshStandardMaterial({color:0xA0845C}));
      head.position.set(0,1.3,1.6); head.castShadow=head.receiveShadow=true; group.add(head);
      const hornL = new THREE.Mesh(new THREE.ConeGeometry(0.15,0.5,6), new THREE.MeshStandardMaterial({color:0xEEEEEE}));
      hornL.position.set(-0.3,1.8,1.9); hornL.rotation.x=0.2; group.add(hornL);
      const hornR = hornL.clone(); hornR.position.set(0.3,1.8,1.9); group.add(hornR);
      const legGeo = new THREE.CylinderGeometry(0.25,0.25,0.8);
      const legMat = new THREE.MeshStandardMaterial({color:0x6B4E31});
      [[-0.6,0.4,0.8],[0.6,0.4,0.8],[-0.6,0.4,-0.8],[0.6,0.4,-0.8]].forEach(pos=>{
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(pos[0],0.4,pos[2]); leg.castShadow=leg.receiveShadow=true; group.add(leg);
      });
      const tail = new THREE.Mesh(new THREE.ConeGeometry(0.3,0.7,6), new THREE.MeshStandardMaterial({color:0x8B6914}));
      tail.position.set(0,0.9,-1.6); tail.rotation.x=-0.5; group.add(tail);
      group.position.set(x,0,z);
      group.userData = { type: 'triceratops', speed: DINO_SPEED, dir: Math.random()*Math.PI*2, timer: 0 };
      return group;
    }

    function createRaptor(x, z) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.9,1.5), new THREE.MeshStandardMaterial({color:0x4A7023}));
      body.position.y=0.7; body.castShadow=body.receiveShadow=true; group.add(body);
      const head = new THREE.Mesh(new THREE.ConeGeometry(0.35,0.7,8), new THREE.MeshStandardMaterial({color:0x5C8A2F}));
      head.position.set(0,1.15,1.1); head.rotation.x=0.2; head.castShadow=head.receiveShadow=true; group.add(head);
      const legGeo = new THREE.CylinderGeometry(0.18,0.18,0.7);
      const legMat = new THREE.MeshStandardMaterial({color:0x3B5322});
      [[-0.3,0.35,0.5],[0.3,0.35,0.5],[-0.3,0.35,-0.5],[0.3,0.35,-0.5]].forEach(pos=>{
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(pos[0],0.35,pos[2]); leg.castShadow=leg.receiveShadow=true; group.add(leg);
      });
      const tail = new THREE.Mesh(new THREE.ConeGeometry(0.2,0.6,6), new THREE.MeshStandardMaterial({color:0x4A7023}));
      tail.position.set(0,0.9,-1.1); tail.rotation.x=-0.6; group.add(tail);
      group.position.set(x,0,z);
      group.userData = { type: 'raptor', speed: DINO_SPEED, dir: Math.random()*Math.PI*2, timer: 0 };
      return group;
    }

    // Глобальные списки
    let dinos = [];
    let eggMeshes = [];
    let resources = [];
    let respawnQueue = []; // { type: 'triceratops'|'raptor', timer: float }

    const nest = new THREE.Group();
    nest.position.set(0,0.3,0);
    const nestBase = new THREE.Mesh(new THREE.CylinderGeometry(1.8,2.0,0.2,16), new THREE.MeshStandardMaterial({color:0x8B5A2B}));
    nestBase.position.y=0.1; nestBase.receiveShadow=true; nest.add(nestBase);
    scene.add(nest);

    function getRandomSpawnPosition() {
      const angle = Math.random() * Math.PI * 2;
      const dist = 15 + Math.random() * 35;
      return { x: Math.cos(angle) * dist, z: Math.sin(angle) * dist };
    }

    function spawnDino(type) {
      const { x, z } = getRandomSpawnPosition();
      if (type === 'triceratops') {
        const trike = createTriceratops(x, z);
        scene.add(trike);
        dinos.push(trike);
      } else if (type === 'raptor') {
        const raptor = createRaptor(x, z);
        scene.add(raptor);
        dinos.push(raptor);
      }
    }

    function spawnGameObjects() {
      // Очистка
      dinos.forEach(d => scene.remove(d));
      eggMeshes.forEach(e => scene.remove(e));
      resources.forEach(r => scene.remove(r));
      dinos = []; eggMeshes = []; resources = []; respawnQueue = [];

      // Стартовые динозавры
      for (let i=0;i<4;i++) {
        const { x, z } = getRandomSpawnPosition();
        const trike = createTriceratops(x, z);
        scene.add(trike); dinos.push(trike);
      }
      for (let i=0;i<4;i++) {
        const { x, z } = getRandomSpawnPosition();
        const raptor = createRaptor(x, z);
        scene.add(raptor); dinos.push(raptor);
      }

      // Яйца
      for (let i=0;i<8;i++) {
        const { x, z } = getRandomSpawnPosition();
        const egg = new THREE.Mesh(new THREE.SphereGeometry(0.4,8,8), new THREE.MeshStandardMaterial({color:0xFFFDD0}));
        egg.position.set(x, 0.4, z);
        egg.castShadow=egg.receiveShadow=true;
        egg.userData = { collected: false };
        scene.add(egg);
        eggMeshes.push(egg);
      }

      // Ягоды
      for (let i=0;i<10;i++) {
        const { x, z } = getRandomSpawnPosition();
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.3,6,6), new THREE.MeshStandardMaterial({color:0xFF4500}));
        mesh.position.set(x, 0.3, z);
        mesh.userData = { type: 'berry', collected: false };
        scene.add(mesh);
        resources.push(mesh);
      }
    }

    // ==================== СОСТОЯНИЕ ИГРОКА ====================
    let player = {
      health: 100, maxHealth: 100,
      hunger: 100, maxHunger: 100,
      eggs: 0, nestEggs: 0,
      gameOver: false, won: false,
      yaw: 0, pitch: 0,
      input: { fwd: false, bwd: false, left: false, right: false },
      attackCooldown: 0
    };

    let gameActive = true;
    let locked = false;

    function resetPlayer() {
      player = {
        health: 100, maxHealth: 100,
        hunger: 100, maxHunger: 100,
        eggs: 0, nestEggs: 0,
        gameOver: false, won: false,
        yaw: 0, pitch: 0,
        input: { fwd: false, bwd: false, left: false, right: false },
        attackCooldown: 0
      };
      camera.position.set(0, PLAYER_H, 0);
      camera.rotation.set(0, 0, 0);
      gameActive = true;
      document.getElementById('message').style.display = 'none';
      document.getElementById('start-hint').style.display = 'block';
    }

    // ==================== УПРАВЛЕНИЕ ====================
    const keys = {};
    function onKey(e, down) {
      const code = e.code, key = e.key?.toLowerCase();
      if ((player.gameOver || player.won) && down) {
        if (code === 'KeyR' || key === 'к' || code === 'Space') {
          restartGame();
          return;
        }
      }
      if (!gameActive) return;
      if (code==='KeyW'||key==='ц') player.input.fwd = down;
      if (code==='KeyS'||key==='ы') player.input.bwd = down;
      if (code==='KeyA'||key==='ф') player.input.left = down;
      if (code==='KeyD'||key==='в') player.input.right = down;
      if ((code==='KeyE'||key==='е') && down) interact();
      if ((code==='KeyF'||key==='а') && down) attack();
      keys[code] = down; if (key) keys[key] = down;
    }
    window.addEventListener('keydown', e => { if (!e.repeat) onKey(e, true); });
    window.addEventListener('keyup', e => onKey(e, false));

    renderer.domElement.addEventListener('click', () => {
      if (player.gameOver || player.won) {
        restartGame();
        return;
      }
      if (!player.gameOver && !player.won) renderer.domElement.requestPointerLock();
    });
    document.addEventListener('pointerlockchange', () => {
      locked = document.pointerLockElement === renderer.domElement;
      document.getElementById('start-hint').style.display = locked ? 'none' : 'block';
    });
    document.addEventListener('mousemove', e => {
      if (!locked || player.won || player.gameOver || !gameActive) return;
      player.yaw -= e.movementX * MOUSE_SENS;
      player.pitch -= e.movementY * MOUSE_SENS;
      player.pitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, player.pitch));
    });
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function restartGame() {
      spawnGameObjects();
      resetPlayer();
    }

    // ==================== АТАКА (С ОДНОГО УДАРА) ====================
    function attack() {
      if (!gameActive || player.attackCooldown > 0) return;
      player.attackCooldown = 0.4;
      const p = camera.position;
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      let closest = null;
      let closestDist = PLAYER_ATTACK_RANGE;
      dinos.forEach(dino => {
        const toDino = new THREE.Vector3().subVectors(dino.position, p);
        const dist = toDino.length();
        if (dist < closestDist) {
          const dot = dir.dot(toDino.normalize());
          if (dot > 0.7) {
            closestDist = dist;
            closest = dino;
          }
        }
      });
      if (closest) {
        scene.remove(closest);
        dinos.splice(dinos.indexOf(closest), 1);
        player.hunger = Math.min(player.maxHunger, player.hunger + 20);
        showMsg('Динозавр убит! +20 еды', 1200);
        // Добавляем в очередь на респавн
        respawnQueue.push({
          type: closest.userData.type,
          timer: RESPAWN_TIME
        });
      } else {
        showMsg('Некого атаковать', 800);
      }
    }

    // ==================== ВЗАИМОДЕЙСТВИЕ ====================
    function interact() {
      if (!gameActive) return;
      const p = camera.position;
      if (player.eggs > 0 && p.distanceTo(nest.position) < INTERACT_DIST) {
        player.eggs--;
        player.nestEggs++;
        showMsg(`Яйцо в гнезде! (${player.nestEggs}/${EGGS_TO_WIN})`);
        if (player.nestEggs >= EGGS_TO_WIN) {
          player.won = true;
          gameActive = false;
          document.exitPointerLock();
          showFinalMessage('Все яйца собраны! Вы победили!');
        }
        return;
      }
      for (let egg of eggMeshes) {
        if (egg.userData.collected) continue;
        if (p.distanceTo(egg.position) < INTERACT_DIST) {
          egg.userData.collected = true;
          scene.remove(egg);
          player.eggs++;
          showMsg('Яйцо подобрано!');
          break;
        }
      }
      for (let res of resources) {
        if (res.userData.collected) continue;
        if (p.distanceTo(res.position) < INTERACT_DIST) {
          res.userData.collected = true;
          scene.remove(res);
          player.hunger = Math.min(player.maxHunger, player.hunger + 30);
          showMsg('+30 голод');
          break;
        }
      }
    }

    function showMsg(t, d=2000) {
      const m = document.getElementById('message');
      m.textContent = t; m.style.display = 'block';
      m.style.pointerEvents = 'none';
      if (d>0) setTimeout(()=>{ m.style.display = 'none'; }, d);
    }

    function showFinalMessage(text) {
      const m = document.getElementById('message');
      m.innerHTML = `${text}<br><button id="restart-btn">Начать заново</button>`;
      m.style.display = 'block';
      m.style.pointerEvents = 'auto';
      document.getElementById('restart-btn').addEventListener('click', restartGame);
    }

    function gameOver() {
      player.gameOver = true;
      gameActive = false;
      document.exitPointerLock();
      showFinalMessage('Вы погибли.');
    }

    function updateUI() {
      document.getElementById('hp').textContent = Math.ceil(player.health);
      document.getElementById('hunger').textContent = Math.ceil(player.hunger);
      document.getElementById('hp-fill').style.width = (player.health/player.maxHealth)*100 + '%';
      document.getElementById('eggs-carry').textContent = player.eggs;
      document.getElementById('eggs-nest').textContent = player.nestEggs;
    }

    // ==================== ГЛАВНЫЙ ЦИКЛ ====================
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      try {
        const dt = Math.min(clock.getDelta(), 0.2);
        if (gameActive && !player.gameOver && !player.won) {
          // Обработка респавна
          for (let i = respawnQueue.length - 1; i >= 0; i--) {
            respawnQueue[i].timer -= dt;
            if (respawnQueue[i].timer <= 0) {
              spawnDino(respawnQueue[i].type);
              respawnQueue.splice(i, 1);
            }
          }

          if (player.attackCooldown > 0) player.attackCooldown -= dt;

          player.hunger = Math.max(0, player.hunger - HUNGER_RATE * dt);
          if (player.hunger <= 0) player.health -= STARVE_DMG * dt;
          if (player.health <= 0) { gameOver(); return; }

          const spd = SPEED * dt;
          const fwd = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), player.yaw);
          const rgt = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), player.yaw);
          const mov = new THREE.Vector3();
          if (player.input.fwd) mov.add(fwd);
          if (player.input.bwd) mov.sub(fwd);
          if (player.input.right) mov.add(rgt);
          if (player.input.left) mov.sub(rgt);
          if (mov.length() > 0) { mov.normalize().multiplyScalar(spd); camera.position.add(mov); }
          camera.position.x = Math.max(-WORLD/2+1, Math.min(WORLD/2-1, camera.position.x));
          camera.position.z = Math.max(-WORLD/2+1, Math.min(WORLD/2-1, camera.position.z));
          camera.position.y = PLAYER_H;
          camera.rotation.y = player.yaw;
          camera.rotation.x = player.pitch;

          const playerPos = camera.position;
          dinos.forEach(dino => {
            const dinoSpeed = dino.userData.speed || DINO_SPEED;
            if (dino.userData.type === 'triceratops') {
              dino.userData.timer -= dt;
              if (dino.userData.timer <= 0) {
                dino.userData.dir = Math.random() * Math.PI * 2;
                dino.userData.timer = 2 + Math.random() * 3;
              }
              const move = dinoSpeed * dt;
              dino.position.x += Math.cos(dino.userData.dir) * move;
              dino.position.z += Math.sin(dino.userData.dir) * move;
              dino.rotation.y = dino.userData.dir;
              dino.position.x = Math.max(-WORLD/2+2, Math.min(WORLD/2-2, dino.position.x));
              dino.position.z = Math.max(-WORLD/2+2, Math.min(WORLD/2-2, dino.position.z));
            } else if (dino.userData.type === 'raptor') {
              const dist = dino.position.distanceTo(playerPos);
              if (dist < 18) {
                const dir = new THREE.Vector3().subVectors(playerPos, dino.position).normalize();
                dino.position.add(dir.multiplyScalar(RAPTOR_SPEED * dt));
                dino.rotation.y = Math.atan2(dir.x, dir.z);
                if (dist < 1.8) {
                  player.health -= RAPTOR_DAMAGE * dt;
                  if (player.health <= 0) gameOver();
                }
              } else {
                dino.userData.timer -= dt;
                if (dino.userData.timer <= 0) {
                  dino.userData.dir = Math.random() * Math.PI * 2;
                  dino.userData.timer = 2 + Math.random() * 3;
                }
                const move = dinoSpeed * dt;
                dino.position.x += Math.cos(dino.userData.dir) * move;
                dino.position.z += Math.sin(dino.userData.dir) * move;
                dino.rotation.y = dino.userData.dir;
              }
              dino.position.x = Math.max(-WORLD/2+2, Math.min(WORLD/2-2, dino.position.x));
              dino.position.z = Math.max(-WORLD/2+2, Math.min(WORLD/2-2, dino.position.z));
            }
          });
        }

        water.position.y = -0.2 + Math.sin(Date.now()*0.002)*0.1;
        updateUI();
        renderer.render(scene, camera);
      } catch (e) {
        console.error('Ошибка в игре:', e);
      }
    }

    spawnGameObjects();
    updateUI();
    animate();
  </script>
</body>
</html>
