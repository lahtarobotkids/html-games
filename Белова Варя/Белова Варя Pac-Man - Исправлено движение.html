<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man (Исправлено движение)</title>
    <style>
        :root { --bg: #0a0a0a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 462px;
            padding: 0 4px;
            color: #fff;
        }
        .score-section { display: flex; flex-direction: column; align-items: flex-start; }
        .score-label { font-size: 11px; color: #ffcc00; letter-spacing: 2px; text-transform: uppercase; }
        .score-value { font-size: 22px; color: #fff; font-weight: bold; letter-spacing: 1px; }
        .lives-section { display: flex; align-items: center; gap: 6px; }
        .life-icon {
            width: 18px; height: 18px; background: #ffcc00; border-radius: 50%;
            box-shadow: 0 0 6px rgba(255,204,0,0.6);
        }
        .high-score { font-size: 14px; color: #aaa; letter-spacing: 1px; }
        canvas {
            border: 3px solid #2121DE;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(33,33,222,0.5), 0 0 60px rgba(33,33,222,0.25), inset 0 0 20px rgba(0,0,0,0.3);
            max-width: 95vw; max-height: 85vh;
            cursor: pointer;
            background: #000;
        }
        .controls-info { color: #666; font-size: 12px; letter-spacing: 1px; text-align: center; margin-top: 4px; }
        .controls-info span { color: #ffcc00; }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="header">
        <div class="score-section">
            <span class="score-label">Счёт</span>
            <span class="score-value" id="scoreDisplay">0</span>
        </div>
        <div class="lives-section" id="livesContainer">
            <div class="life-icon"></div><div class="life-icon"></div><div class="life-icon"></div>
        </div>
        <div class="high-score">
            <span style="color:#888;">Лучший: </span><span id="highScoreDisplay">0</span>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="controls-info">
        <span>↑↓←→</span> или <span>WASD</span> — управление &nbsp;|&nbsp; Свайпы на телефоне
    </div>
</div>

<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const livesContainer = document.getElementById('livesContainer');

    const COLS = 21, ROWS = 21, CELL_SIZE = 22;
    const PLAY_AREA_WIDTH = COLS * CELL_SIZE, PLAY_AREA_HEIGHT = ROWS * CELL_SIZE;
    canvas.width = PLAY_AREA_WIDTH; canvas.height = PLAY_AREA_HEIGHT;

    const WALL = 0, DOT = 1, POWER_PELLET = 2, EMPTY = 3, GHOST_DOOR = 4;
    const DIR = { UP:0, DOWN:1, LEFT:2, RIGHT:3, NONE:4 };
    const DIR_VECTORS = {
        [DIR.UP]:{dx:0,dy:-1}, [DIR.DOWN]:{dx:0,dy:1},
        [DIR.LEFT]:{dx:-1,dy:0}, [DIR.RIGHT]:{dx:1,dy:0}, [DIR.NONE]:{dx:0,dy:0}
    };

    const mazeStrings = [
        '#####################',
        '#.........#.........#',
        '#.##.###..#..###.##.#',
        '#O##.###..#..###.##O#',
        '#.##.###..#..###.##.#',
        '#....................#',
        '#.##.#.#####.#.##..#',
        '#.##.#.#####.#.##..#',
        '#....#...#...#.....#',
        '####.#.#.....#.#.####',
        '    #.#..   ..#.#    ',
        '####.#.#..   ..#.#.####',
        '#........#..........#',
        '#.##.###..###.##.#..#',
        '#O.#.....#.....#.#.O#',
        '##.#.#.#######.#.#.##',
        '#....#....#....#....#',
        '#.######.#.######.#.#',
        '#.................#.#',
        '#..................#',
        '#####################'
    ];

    let grid = [], totalDots = 0, totalPowerPellets = 0;
    let ghostDoorPos = {col:10, row:10};

    function parseMaze() {
        grid = []; totalDots = 0; totalPowerPellets = 0;
        for (let row=0; row<ROWS; row++) {
            grid[row] = [];
            const line = mazeStrings[row];
            for (let col=0; col<COLS; col++) {
                const ch = col < line.length ? line[col] : '#';
                switch(ch) {
                    case '#': grid[row][col]=WALL; break;
                    case '.': grid[row][col]=DOT; totalDots++; break;
                    case 'O': grid[row][col]=POWER_PELLET; totalPowerPellets++; break;
                    case 'D': grid[row][col]=GHOST_DOOR; ghostDoorPos={col,row}; break;
                    default: grid[row][col]=EMPTY;
                }
            }
        }
    }

    function getCell(col,row) {
        if (row<0||row>=ROWS) return WALL;
        if (row===10 && (col<0||col>=COLS)) return EMPTY;
        if (col<0||col>=COLS) return WALL;
        return grid[row][col];
    }
    function isWall(col,row) { return getCell(col,row)===WALL; }
    function isWallOrDoor(col,row) { const c=getCell(col,row); return c===WALL || c===GHOST_DOOR; }
    function isWallForGhost(col,row) { return getCell(col,row)===WALL; }

    class PacMan {
        constructor() { this.reset(); }
        reset() {
            // Новая стартовая позиция: открытое пространство (10,18)
            this.col = 10; this.row = 18;
            this.x = this.col*CELL_SIZE + CELL_SIZE/2;
            this.y = this.row*CELL_SIZE + CELL_SIZE/2;
            this.dir = DIR.NONE; this.nextDir = DIR.NONE;
            this.speed = CELL_SIZE*8;
            this.mouthAngle = 0; this.mouthOpen = true; this.mouthTimer = 0; this.mouthSpeed = 12;
            this.moving = false;
        }
        getCenterX(){return this.x;} getCenterY(){return this.y;}
        getCol(){return Math.round((this.x-CELL_SIZE/2)/CELL_SIZE);}
        getRow(){return Math.round((this.y-CELL_SIZE/2)/CELL_SIZE);}
        snapToCellCenter(){
            this.col=this.getCol(); this.row=this.getRow();
            if(this.row===10){ if(this.col<0)this.col=COLS-1; if(this.col>=COLS)this.col=0; }
            this.col=Math.max(0,Math.min(COLS-1,this.col));
            this.row=Math.max(0,Math.min(ROWS-1,this.row));
            this.x = this.col*CELL_SIZE+CELL_SIZE/2;
            this.y = this.row*CELL_SIZE+CELL_SIZE/2;
        }
        update(dt) {
            this.mouthTimer+=dt;
            if(this.mouthTimer >= 1/this.mouthSpeed){ this.mouthTimer=0; this.mouthOpen=!this.mouthOpen; this.mouthAngle=this.mouthOpen?0.25*Math.PI:0.02*Math.PI; }
            if(this.dir===DIR.NONE && this.nextDir===DIR.NONE) return;

            const ccx = this.col*CELL_SIZE+CELL_SIZE/2, ccy = this.row*CELL_SIZE+CELL_SIZE/2;
            const distToCenter = Math.hypot(this.x-ccx, this.y-ccy);
            const snapThresh = this.speed*dt*1.2 + 1;

            if(distToCenter < snapThresh) {
                this.snapToCellCenter();
                if(this.nextDir!==DIR.NONE && this.nextDir!==this.dir) {
                    const v = DIR_VECTORS[this.nextDir];
                    if(!isWallOrDoor(this.col+v.dx, this.row+v.dy)) {
                        this.dir = this.nextDir; this.nextDir = DIR.NONE; this.moving = true;
                    }
                }
                if(this.dir!==DIR.NONE) {
                    const v = DIR_VECTORS[this.dir];
                    if(isWallOrDoor(this.col+v.dx, this.row+v.dy)) { this.dir=DIR.NONE; this.moving=false; }
                    else this.moving = true;
                }
            }

            if(this.dir!==DIR.NONE && this.moving) {
                const v = DIR_VECTORS[this.dir];
                const prevCol = this.col, prevRow = this.row;
                let newX = this.x + v.dx*this.speed*dt;
                let newY = this.y + v.dy*this.speed*dt;
                const ncol = this.col+v.dx, nrow = this.row+v.dy;
                const ncX = ncol*CELL_SIZE+CELL_SIZE/2, ncY = nrow*CELL_SIZE+CELL_SIZE/2;
                let blocked = false;
                if(v.dx>0 && newX>=ncX && isWallOrDoor(ncol,this.row)) { newX=ncX-1; blocked=true; }
                else if(v.dx<0 && newX<=ncX && isWallOrDoor(ncol,this.row)) { newX=ncX+1; blocked=true; }
                else if(v.dy>0 && newY>=ncY && isWallOrDoor(this.col,nrow)) { newY=ncY-1; blocked=true; }
                else if(v.dy<0 && newY<=ncY && isWallOrDoor(this.col,nrow)) { newY=ncY+1; blocked=true; }

                if(blocked) {
                    this.x = prevCol*CELL_SIZE+CELL_SIZE/2;
                    this.y = prevRow*CELL_SIZE+CELL_SIZE/2;
                    this.col = prevCol; this.row = prevRow;
                    this.dir = DIR.NONE; this.moving = false;
                } else {
                    this.x = newX; this.y = newY;
                    const curCol = Math.round((this.x-CELL_SIZE/2)/CELL_SIZE);
                    const curRow = Math.round((this.y-CELL_SIZE/2)/CELL_SIZE);
                    if(curCol!==this.col || curRow!==this.row) { this.col=curCol; this.row=curRow; }
                }
            }
            // Туннель
            if(this.row===10) {
                if(this.x < -CELL_SIZE/2) { this.x = PLAY_AREA_WIDTH+CELL_SIZE/2; this.col = COLS-1; }
                else if(this.x > PLAY_AREA_WIDTH+CELL_SIZE/2) { this.x = -CELL_SIZE/2; this.col = 0; }
            }
            this.x = Math.max(CELL_SIZE/2, Math.min(PLAY_AREA_WIDTH-CELL_SIZE/2, this.x));
            this.y = Math.max(CELL_SIZE/2, Math.min(PLAY_AREA_HEIGHT-CELL_SIZE/2, this.y));
            this.col = Math.round((this.x-CELL_SIZE/2)/CELL_SIZE);
            this.row = Math.round((this.y-CELL_SIZE/2)/CELL_SIZE);
            this.col = Math.max(0, Math.min(COLS-1, this.col));
            this.row = Math.max(0, Math.min(ROWS-1, this.row));
        }
        setDirection(dir) {
            this.nextDir = dir;
            if(this.dir===DIR.NONE) {
                const v = DIR_VECTORS[dir];
                if(!isWallOrDoor(this.col+v.dx, this.row+v.dy)) {
                    this.dir=dir; this.nextDir=DIR.NONE; this.moving=true;
                }
            }
        }
    }

    // ... (класс Ghost и Game без изменений, но для полноты вставлю их) ...
    class Ghost {
        constructor(col,row,color,name,sCol,sRow) {
            this.startCol=col; this.startRow=row; this.color=color; this.name=name;
            this.scatterTargetCol=sCol; this.scatterTargetRow=sRow; this.reset();
        }
        reset() {
            this.col=this.startCol; this.row=this.startRow;
            this.x=this.col*CELL_SIZE+CELL_SIZE/2; this.y=this.row*CELL_SIZE+CELL_SIZE/2;
            this.dir=DIR.UP; this.speed=CELL_SIZE*6.5; this.frightenedSpeed=CELL_SIZE*3.5;
            this.currentSpeed=this.speed; this.mode='SCATTER'; this.inHouse=true;
            this.exitTimer=0; this.frightenedTimer=0; this.moving=false;
        }
        getCenterX(){return this.x;} getCenterY(){return this.y;}
        getCol(){return Math.round((this.x-CELL_SIZE/2)/CELL_SIZE);}
        getRow(){return Math.round((this.y-CELL_SIZE/2)/CELL_SIZE);}
        snapToCellCenter() {
            this.col=this.getCol(); this.row=this.getRow();
            if(this.row===10){if(this.col<0)this.col=COLS-1; if(this.col>=COLS)this.col=0;}
            this.col=Math.max(0,Math.min(COLS-1,this.col));
            this.row=Math.max(0,Math.min(ROWS-1,this.row));
            this.x=this.col*CELL_SIZE+CELL_SIZE/2; this.y=this.row*CELL_SIZE+CELL_SIZE/2;
        }
        setMode(mode) {
            if(mode==='FRIGHTENED' && this.mode!=='EATEN' && this.mode!=='IN_HOUSE') {
                if(this.mode!=='FRIGHTENED') this.reverseDirection();
                this.mode='FRIGHTENED'; this.frightenedTimer=0; this.currentSpeed=this.frightenedSpeed;
            } else if(mode==='CHASE'||mode==='SCATTER') {
                if(this.mode==='FRIGHTENED') { this.mode=mode; this.currentSpeed=this.speed; }
                else if(this.mode!=='EATEN' && this.mode!=='IN_HOUSE') { this.mode=mode; this.currentSpeed=this.speed; }
            } else if(mode==='EATEN') { this.mode='EATEN'; this.currentSpeed=CELL_SIZE*10; }
        }
        reverseDirection() {
            const rev={[DIR.UP]:DIR.DOWN,[DIR.DOWN]:DIR.UP,[DIR.LEFT]:DIR.RIGHT,[DIR.RIGHT]:DIR.LEFT,[DIR.NONE]:DIR.NONE};
            this.dir=rev[this.dir]||DIR.NONE;
        }
        getTarget(pacMan, ghosts) {
            if(this.mode==='FRIGHTENED') return {col:Math.floor(Math.random()*COLS), row:Math.floor(Math.random()*ROWS)};
            if(this.mode==='EATEN') return {col:ghostDoorPos.col, row:ghostDoorPos.row+1};
            if(this.mode==='SCATTER') return {col:this.scatterTargetCol, row:this.scatterTargetRow};
            if(this.name==='blinky') return {col:pacMan.getCol(), row:pacMan.getRow()};
            if(this.name==='pinky') {
                const v=DIR_VECTORS[pacMan.dir]||{dx:0,dy:0};
                return {col:pacMan.getCol()+v.dx*4, row:pacMan.getRow()+v.dy*4};
            }
            if(this.name==='inky') {
                const blinky=ghosts[0]; const v=DIR_VECTORS[pacMan.dir]||{dx:0,dy:0};
                const aCol=pacMan.getCol()+v.dx*2, aRow=pacMan.getRow()+v.dy*2;
                return {col:aCol+(aCol-blinky.getCol()), row:aRow+(aRow-blinky.getRow())};
            }
            if(this.name==='clyde') {
                const d=Math.hypot(pacMan.getCol()-this.col, pacMan.getRow()-this.row);
                return d>8?{col:pacMan.getCol(),row:pacMan.getRow()}:{col:this.scatterTargetCol,row:this.scatterTargetRow};
            }
            return {col:pacMan.getCol(),row:pacMan.getRow()};
        }
        chooseDirection(tCol,tRow) {
            const avail=[];
            for(const d of [DIR.UP,DIR.DOWN,DIR.LEFT,DIR.RIGHT]) {
                const v=DIR_VECTORS[d]; const nc=this.col+v.dx, nr=this.row+v.dy;
                const rev={[DIR.UP]:DIR.DOWN,[DIR.DOWN]:DIR.UP,[DIR.LEFT]:DIR.RIGHT,[DIR.RIGHT]:DIR.LEFT,[DIR.NONE]:DIR.NONE};
                if(d===rev[this.dir] && avail.length>0 && this.mode!=='FRIGHTENED') continue;
                if(this.mode==='EATEN'||this.mode==='IN_HOUSE') {
                    if(!isWallForGhost(nc,nr)||getCell(nc,nr)===GHOST_DOOR) avail.push({dir:d,col:nc,row:nr});
                } else {
                    if(!isWallForGhost(nc,nr) && getCell(nc,nr)!==GHOST_DOOR) avail.push({dir:d,col:nc,row:nr});
                }
            }
            if(avail.length===0) {
                const rev={[DIR.UP]:DIR.DOWN,[DIR.DOWN]:DIR.UP,[DIR.LEFT]:DIR.RIGHT,[DIR.RIGHT]:DIR.LEFT,[DIR.NONE]:DIR.NONE};
                const rv=rev[this.dir]; const v=DIR_VECTORS[rv]; const nc=this.col+v.dx, nr=this.row+v.dy;
                if(this.mode==='EATEN'||this.mode==='IN_HOUSE') {
                    if(!isWallForGhost(nc,nr)||getCell(nc,nr)===GHOST_DOOR) return rv;
                } else {
                    if(!isWallForGhost(nc,nr) && getCell(nc,nr)!==GHOST_DOOR) return rv;
                }
                return DIR.NONE;
            }
            if(this.mode==='FRIGHTENED') return avail[Math.floor(Math.random()*avail.length)].dir;
            let bestDir=avail[0].dir, bestDist=Infinity;
            for(const o of avail) {
                const dist=Math.hypot(o.col-tCol, o.row-tRow);
                if(dist<bestDist){ bestDist=dist; bestDir=o.dir; }
            }
            return bestDir;
        }
        update(dt, pacMan, ghosts, gameTime) {
            if(this.mode==='IN_HOUSE') {
                this.exitTimer+=dt;
                if(this.exitTimer>this.exitDelay) {
                    this.col=ghostDoorPos.col; this.row=ghostDoorPos.row;
                    this.x=this.col*CELL_SIZE+CELL_SIZE/2; this.y=this.row*CELL_SIZE+CELL_SIZE/2;
                    this.dir=DIR.UP; this.mode='SCATTER'; this.inHouse=false; this.currentSpeed=this.speed;
                }
                return;
            }
            if(this.mode==='FRIGHTENED') this.frightenedTimer+=dt;
            if(this.mode==='EATEN') {
                const d=Math.hypot(this.x-(ghostDoorPos.col*CELL_SIZE+CELL_SIZE/2), this.y-(ghostDoorPos.row*CELL_SIZE+CELL_SIZE/2+CELL_SIZE));
                if(d<CELL_SIZE*1.5) {
                    this.col=this.startCol; this.row=this.startRow;
                    this.x=this.col*CELL_SIZE+CELL_SIZE/2; this.y=this.row*CELL_SIZE+CELL_SIZE/2;
                    this.mode='IN_HOUSE'; this.inHouse=true; this.exitTimer=0;
                    this.exitDelay=1.5+Math.random()*2; this.currentSpeed=this.speed; this.dir=DIR.UP;
                    return;
                }
            }
            const ccx=this.col*CELL_SIZE+CELL_SIZE/2, ccy=this.row*CELL_SIZE+CELL_SIZE/2;
            const distC=Math.hypot(this.x-ccx, this.y-ccy);
            const snapThresh=this.currentSpeed*dt*1.2+1;
            if(distC<snapThresh) {
                this.snapToCellCenter();
                const target=this.getTarget(pacMan, ghosts);
                const nd=this.chooseDirection(target.col, target.row);
                if(nd!==DIR.NONE){ this.dir=nd; this.moving=true; } else this.moving=false;
            }
            if(this.dir!==DIR.NONE && this.moving) {
                const v=DIR_VECTORS[this.dir];
                this.x+=v.dx*this.currentSpeed*dt; this.y+=v.dy*this.currentSpeed*dt;
                const curCol=Math.round((this.x-CELL_SIZE/2)/CELL_SIZE);
                const curRow=Math.round((this.y-CELL_SIZE/2)/CELL_SIZE);
                if(curRow===10) {
                    if(this.x<-CELL_SIZE/2){ this.x=PLAY_AREA_WIDTH+CELL_SIZE/2; this.col=COLS-1; }
                    else if(this.x>PLAY_AREA_WIDTH+CELL_SIZE/2){ this.x=-CELL_SIZE/2; this.col=0; }
                }
                if(curCol!==this.col||curRow!==this.row){ this.col=curCol; this.row=curRow; }
            }
            this.x=Math.max(-CELL_SIZE, Math.min(PLAY_AREA_WIDTH+CELL_SIZE, this.x));
            this.y=Math.max(CELL_SIZE/2, Math.min(PLAY_AREA_HEIGHT-CELL_SIZE/2, this.y));
            this.col=Math.round((this.x-CELL_SIZE/2)/CELL_SIZE);
            this.row=Math.round((this.y-CELL_SIZE/2)/CELL_SIZE);
            if(this.row===10){ if(this.col<0)this.col=COLS-1; if(this.col>=COLS)this.col=0; }
            this.col=Math.max(0,Math.min(COLS-1,this.col));
            this.row=Math.max(0,Math.min(ROWS-1,this.row));
        }
    }

    class Game {
        constructor() {
            this.pacMan = new PacMan();
            this.ghosts = [
                new Ghost(9,10,'#FF0000','blinky',COLS-2,1),
                new Ghost(10,9,'#FFB8FF','pinky',1,1),
                new Ghost(10,11,'#00FFFF','inky',COLS-2,ROWS-2),
                new Ghost(11,10,'#FFB852','clyde',1,ROWS-2)
            ];
            this.score=0; this.lives=3; this.dotsRemaining=0; this.powerPelletsRemaining=0;
            this.gameState='READY'; this.readyTimer=0; this.dyingTimer=0;
            this.frightenedTimer=0; this.frightenedDuration=7; this.ghostEatCombo=0;
            this.chaseScatterMode='SCATTER'; this.modeTimer=0;
            this.chaseDuration=20; this.scatterDuration=7;
            this.gameTime=0; this.lastTime=0; this.animationId=null;
            this.highScore = parseInt(localStorage.getItem('pacmanHighScore')||'0');
        }
        init() {
            parseMaze();
            this.dotsRemaining=totalDots; this.powerPelletsRemaining=totalPowerPellets;
            this.pacMan.reset();
            this.ghosts.forEach((g,i)=>{ g.reset(); g.exitDelay=1+i*1.8; g.exitTimer=0; g.mode='IN_HOUSE'; g.inHouse=true; });
            this.score=0; this.lives=3;
            this.gameState='READY'; this.readyTimer=0; this.dyingTimer=0;
            this.frightenedTimer=0; this.ghostEatCombo=0;
            this.chaseScatterMode='SCATTER'; this.modeTimer=0; this.gameTime=0;
            this.updateDisplay();
        }
        startPlaying() { this.gameState='PLAYING'; this.lastTime=performance.now(); }
        resetPositions() {
            this.pacMan.reset();
            this.ghosts.forEach((g,i)=>{ g.reset(); g.exitDelay=1+i*1.8; g.exitTimer=0; g.mode='IN_HOUSE'; g.inHouse=true; });
            this.frightenedTimer=0; this.ghostEatCombo=0;
            this.chaseScatterMode='SCATTER'; this.modeTimer=0;
            for(const g of this.ghosts) if(g.mode==='FRIGHTENED') g.setMode('SCATTER');
        }
        pacManDie() {
            this.lives--;
            this.updateDisplay();
            if(this.lives<=0) {
                this.gameState='GAME_OVER';
                if(this.score>this.highScore) { this.highScore=this.score; localStorage.setItem('pacmanHighScore',this.highScore); }
                highScoreDisplay.textContent=this.highScore;
            } else { this.gameState='DYING'; this.dyingTimer=0; }
        }
        activatePowerPellet() {
            this.frightenedTimer=this.frightenedDuration; this.ghostEatCombo=0;
            for(const g of this.ghosts) g.setMode('FRIGHTENED');
        }
        eatGhost(ghost) {
            this.ghostEatCombo++; this.score+=200*Math.pow(2,this.ghostEatCombo-1);
            ghost.setMode('EATEN'); ghost.currentSpeed=CELL_SIZE*10;
        }
        checkCollisions() {
            const px=this.pacMan.getCenterX(), py=this.pacMan.getCenterY(), colDist=CELL_SIZE*0.7;
            for(const g of this.ghosts) {
                if(g.mode==='IN_HOUSE') continue;
                const d=Math.hypot(px-g.getCenterX(), py-g.getCenterY());
                if(d<colDist) {
                    if(g.mode==='FRIGHTENED') this.eatGhost(g);
                    else if(g.mode!=='EATEN') this.pacManDie();
                    return;
                }
            }
        }
        checkDotEating() {
            const col=this.pacMan.getCol(), row=this.pacMan.getRow();
            const cell=getCell(col,row);
            if(cell===DOT) {
                grid[row][col]=EMPTY; this.dotsRemaining--; this.score+=10;
                if(this.dotsRemaining===0 && this.powerPelletsRemaining===0) this.win();
            } else if(cell===POWER_PELLET) {
                grid[row][col]=EMPTY; this.powerPelletsRemaining--; this.score+=50;
                this.activatePowerPellet();
                if(this.dotsRemaining===0 && this.powerPelletsRemaining===0) this.win();
            }
        }
        win() {
            this.gameState='WIN';
            if(this.score>this.highScore) { this.highScore=this.score; localStorage.setItem('pacmanHighScore',this.highScore); }
            highScoreDisplay.textContent=this.highScore;
        }
        updateDisplay() {
            scoreDisplay.textContent=this.score;
            highScoreDisplay.textContent=this.highScore;
            livesContainer.innerHTML = Array.from({length:this.lives}, ()=>'<div class="life-icon"></div>').join('');
        }
        update(dt) {
            if(this.gameState==='READY') { this.readyTimer+=dt; if(this.readyTimer>=2.0) this.startPlaying(); return; }
            if(this.gameState==='DYING') { this.dyingTimer+=dt; if(this.dyingTimer>=1.5) { this.resetPositions(); this.gameState='READY'; this.readyTimer=0; } return; }
            if(this.gameState==='GAME_OVER'||this.gameState==='WIN') return;

            this.gameTime+=dt;
            if(this.frightenedTimer>0) {
                this.frightenedTimer-=dt;
                if(this.frightenedTimer<=0) {
                    this.frightenedTimer=0; this.ghostEatCombo=0;
                    for(const g of this.ghosts) if(g.mode==='FRIGHTENED') g.setMode(this.chaseScatterMode);
                }
            }
            this.modeTimer+=dt;
            if(this.frightenedTimer<=0) {
                if(this.chaseScatterMode==='SCATTER' && this.modeTimer>=this.scatterDuration) {
                    this.chaseScatterMode='CHASE'; this.modeTimer=0;
                    for(const g of this.ghosts) if(g.mode!=='FRIGHTENED'&&g.mode!=='EATEN'&&g.mode!=='IN_HOUSE') { g.setMode('CHASE'); g.reverseDirection(); }
                } else if(this.chaseScatterMode==='CHASE' && this.modeTimer>=this.chaseDuration) {
                    this.chaseScatterMode='SCATTER'; this.modeTimer=0;
                    for(const g of this.ghosts) if(g.mode!=='FRIGHTENED'&&g.mode!=='EATEN'&&g.mode!=='IN_HOUSE') { g.setMode('SCATTER'); g.reverseDirection(); }
                }
            } else this.modeTimer=0;

            this.pacMan.update(dt);
            for(const g of this.ghosts) g.update(dt, this.pacMan, this.ghosts, this.gameTime);
            this.checkDotEating();
            this.checkCollisions();
            this.updateDisplay();
        }
        render(ctx) {
            ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
            this.renderMaze(ctx); this.renderDots(ctx);
            for(const g of this.ghosts) this.renderGhost(ctx,g);
            this.renderPacMan(ctx);
            if(this.gameState==='READY') this.renderReady(ctx);
            else if(this.gameState==='GAME_OVER') this.renderGameOver(ctx);
            else if(this.gameState==='WIN') this.renderWin(ctx);
        }
        renderMaze(ctx) {
            for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
                const cell=grid[r][c], x=c*CELL_SIZE, y=r*CELL_SIZE;
                if(cell===WALL) {
                    ctx.fillStyle='#1a1a8a'; ctx.fillRect(x,y,CELL_SIZE,CELL_SIZE);
                    ctx.fillStyle='#0d0d5e'; ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2);
                    ctx.fillStyle='#2a2abb'; ctx.fillRect(x+2,y+2,CELL_SIZE-4,CELL_SIZE-6);
                    ctx.strokeStyle='#3333cc'; ctx.lineWidth=0.5; ctx.strokeRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2);
                } else if(cell===GHOST_DOOR) {
                    ctx.fillStyle='#ff88aa'; ctx.fillRect(x,y+CELL_SIZE/2-3,CELL_SIZE,6);
                    ctx.strokeStyle='#ffaacc'; ctx.lineWidth=1; ctx.strokeRect(x,y+CELL_SIZE/2-3,CELL_SIZE,6);
                }
            }
        }
        renderDots(ctx) {
            for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
                const cell=grid[r][c], cx=c*CELL_SIZE+CELL_SIZE/2, cy=r*CELL_SIZE+CELL_SIZE/2;
                if(cell===DOT) { ctx.fillStyle='#ffccaa'; ctx.beginPath(); ctx.arc(cx,cy,CELL_SIZE*0.12,0,Math.PI*2); ctx.fill(); }
                else if(cell===POWER_PELLET) {
                    if(Math.sin(this.gameTime*8)>0||this.gameState==='READY') {
                        ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.arc(cx,cy,CELL_SIZE*0.28,0,Math.PI*2); ctx.fill();
                        const g=ctx.createRadialGradient(cx,cy,CELL_SIZE*0.15,cx,cy,CELL_SIZE*0.45);
                        g.addColorStop(0,'rgba(255,204,0,0.6)'); g.addColorStop(1,'rgba(255,204,0,0)');
                        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,CELL_SIZE*0.45,0,Math.PI*2); ctx.fill();
                    }
                }
            }
        }
        renderPacMan(ctx) {
            const px=this.pacMan.getCenterX(), py=this.pacMan.getCenterY(), r=CELL_SIZE*0.42;
            let ang=0;
            switch(this.pacMan.dir) {
                case DIR.RIGHT: ang=0; break; case DIR.DOWN: ang=Math.PI/2; break;
                case DIR.LEFT: ang=Math.PI; break; case DIR.UP: ang=-Math.PI/2; break;
            }
            const m=this.pacMan.mouthAngle;
            ctx.fillStyle='#ffff00'; ctx.beginPath();
            if(this.pacMan.moving||this.pacMan.dir!==DIR.NONE) {
                ctx.arc(px,py,r,ang+m,ang+Math.PI*2-m); ctx.lineTo(px,py);
            } else ctx.arc(px,py,r,0,Math.PI*2);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle='#cc9900'; ctx.lineWidth=1.5; ctx.stroke();
            const ex=px+Math.cos(ang-0.5)*r*0.4, ey=py+Math.sin(ang-0.5)*r*0.4-r*0.2;
            ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(ex,ey,r*0.2,0,Math.PI*2); ctx.fill();
        }
        renderGhost(ctx,ghost) {
            if(ghost.mode==='IN_HOUSE') return;
            const gx=ghost.getCenterX(), gy=ghost.getCenterY(), r=CELL_SIZE*0.4;
            let col=ghost.color;
            if(ghost.mode==='FRIGHTENED') col=(this.frightenedTimer<2&&Math.sin(this.gameTime*15)>0)?'#ffffff':'#2121DE';
            else if(ghost.mode==='EATEN') { this.renderGhostEyes(ctx,gx,gy,r,ghost.dir); return; }
            ctx.fillStyle=col; ctx.beginPath();
            ctx.arc(gx,gy-r*0.2,r,Math.PI,0);
            const by=gy+r*0.8, wc=4, ww=r*2/wc, wh=r*0.5; let cx=gx-r;
            ctx.lineTo(cx,by);
            for(let i=0;i<wc;i++) { ctx.quadraticCurveTo(cx+ww/2,by-wh,cx+ww,by); cx+=ww; }
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1; ctx.stroke();
            this.renderGhostEyes(ctx,gx,gy,r,ghost.dir);
        }
        renderGhostEyes(ctx,gx,gy,r,dir) {
            const eox=r*0.3, ey=gy-r*0.3, er=r*0.25;
            for(const s of[-1,1]) { ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(gx+s*eox,ey,er,0,Math.PI*2); ctx.fill(); }
            let px=0,py=0;
            switch(dir){ case DIR.RIGHT:px=er*0.4;break; case DIR.LEFT:px=-er*0.4;break; case DIR.UP:py=-er*0.4;break; case DIR.DOWN:py=er*0.4;break; }
            for(const s of[-1,1]) { ctx.fillStyle='#00c'; ctx.beginPath(); ctx.arc(gx+s*eox+px,ey+py,er*0.5,0,Math.PI*2); ctx.fill(); }
        }
        renderReady(ctx) { ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,PLAY_AREA_HEIGHT/2-25,PLAY_AREA_WIDTH,50); ctx.fillStyle='#ff0'; ctx.font='bold 28px "Courier New"'; ctx.textAlign='center'; ctx.fillText('READY!',PLAY_AREA_WIDTH/2,PLAY_AREA_HEIGHT/2+10); ctx.textAlign='start'; }
        renderGameOver(ctx) { ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,PLAY_AREA_HEIGHT/2-40,PLAY_AREA_WIDTH,80); ctx.fillStyle='#f00'; ctx.font='bold 30px "Courier New"'; ctx.textAlign='center'; ctx.fillText('GAME OVER',PLAY_AREA_WIDTH/2,PLAY_AREA_HEIGHT/2); ctx.fillStyle='#fff'; ctx.font='14px "Courier New"'; ctx.fillText('Нажмите любую клавишу',PLAY_AREA_WIDTH/2,PLAY_AREA_HEIGHT/2+30); ctx.textAlign='start'; }
        renderWin(ctx) { ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,PLAY_AREA_HEIGHT/2-40,PLAY_AREA_WIDTH,80); ctx.fillStyle='#0f0'; ctx.font='bold 30px "Courier New"'; ctx.textAlign='center'; ctx.fillText('YOU WIN!',PLAY_AREA_WIDTH/2,PLAY_AREA_HEIGHT/2); ctx.fillStyle='#fff'; ctx.font='14px "Courier New"'; ctx.fillText('Нажмите любую клавишу',PLAY_AREA_WIDTH/2,PLAY_AREA_HEIGHT/2+30); ctx.textAlign='start'; }
    }

    const game = new Game();
    game.init();
    highScoreDisplay.textContent = game.highScore;

    function handleKeyDown(e) {
        if(game.gameState==='GAME_OVER'||game.gameState==='WIN') { game.init(); game.highScore=parseInt(localStorage.getItem('pacmanHighScore')||'0'); highScoreDisplay.textContent=game.highScore; return; }
        let d=null;
        switch(e.key){ case 'ArrowUp':case 'w':case 'W':d=DIR.UP;break; case 'ArrowDown':case 's':case 'S':d=DIR.DOWN;break; case 'ArrowLeft':case 'a':case 'A':d=DIR.LEFT;break; case 'ArrowRight':case 'd':case 'D':d=DIR.RIGHT;break; }
        if(d!==null) { e.preventDefault(); game.pacMan.setDirection(d); if(game.gameState==='READY') game.startPlaying(); }
    }
    let tsX=0,tsY=0,tsT=0;
    canvas.addEventListener('touchstart', e => { if(e.touches.length===1){ tsX=e.touches[0].clientX; tsY=e.touches[0].clientY; tsT=Date.now(); } e.preventDefault(); }, {passive:false});
    canvas.addEventListener('touchend', e => {
        if(game.gameState==='GAME_OVER'||game.gameState==='WIN') { game.init(); game.highScore=parseInt(localStorage.getItem('pacmanHighScore')||'0'); highScoreDisplay.textContent=game.highScore; return; }
        const dx=(e.changedTouches[0]?.clientX||tsX)-tsX, dy=(e.changedTouches[0]?.clientY||tsY)-tsY, dt=Date.now()-tsT, dist=Math.hypot(dx,dy);
        if(dist>20&&dt<500) { const d=Math.abs(dx)>Math.abs(dy)?(dx>0?DIR.RIGHT:DIR.LEFT):(dy>0?DIR.DOWN:DIR.UP); game.pacMan.setDirection(d); if(game.gameState==='READY') game.startPlaying(); }
        else if(dist<10&&dt<300&&(game.gameState==='GAME_OVER'||game.gameState==='WIN')) { game.init(); game.highScore=parseInt(localStorage.getItem('pacmanHighScore')||'0'); highScoreDisplay.textContent=game.highScore; }
        e.preventDefault();
    }, {passive:false});
    canvas.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
    document.addEventListener('keydown', handleKeyDown);
    canvas.addEventListener('click', ()=>{ if(game.gameState==='GAME_OVER'||game.gameState==='WIN') { game.init(); game.highScore=parseInt(localStorage.getItem('pacmanHighScore')||'0'); highScoreDisplay.textContent=game.highScore; } });

    function gameLoop(ts) {
        if(!game.lastTime) game.lastTime=ts;
        let dt=(ts-game.lastTime)/1000;
        game.lastTime=ts; if(dt>0.2) dt=0.2; if(dt<=0) dt=0.016;
        game.update(dt); game.render(ctx);
        game.animationId=requestAnimationFrame(gameLoop);
    }
    game.lastTime=performance.now();
    game.animationId=requestAnimationFrame(gameLoop);

    console.log('🟡 Pac-Man готов! Вы в открытом коридоре, используйте стрелки.');
})();
</script>
