                const btn = document.getElementById(id);
                if (!btn) return;
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    initAudio();
                    keys[keyName] = true;
                    if (keyName === 'attack' && gameState === STATE.PLAYING && player.alive && player
                        .attackCooldown <= 0 && !player.isHiding) {
                        player.attackCooldown = 0.7;
                        player.attackDuration = 0.25;
                        let ax = 0,
                            ay = 0;
                        if (keys['up']) ay = -1;
                        if (keys['down']) ay = 1;
                        if (keys['left']) ax = -1;
                        if (keys['right']) ax = 1;
                        if (ax === 0 && ay === 0) { ax = 0;
                            ay = -1; }
                        player.attackAngle = Math.atan2(ay, ax);
                        playNoise(0.1, 0.1, 200);
                        playTone(200, 'square', 0.12, 0.06, 0);
                    }
                    if (keyName === 'sprint') keys['sprint'] = true;
                    if (keyName === 'hide') {
                        keys['KeyE'] = true;
                        // Триггерим мгновенно
                        setTimeout(() => {
                            const nhs = findNearestHideSpot();
                            if (player.isHiding) {
                                player.isHiding = false;
                                player.hidingSpot = null;
                                player.hideTransition = 0;
                            } else if (nhs && player.stamina > 10 && player.alive) {
                                player.isHiding = true;
                                player.hidingSpot = nhs;
                                player.hideTransition = 1;
                                player.x = nhs.x;
                                player.y = nhs.y;
                                nhs.discovered = true;
                                playNoise(0.06, 0.04, 400);
                            }
                        }, 30);
                    }
                    if (keyName === 'attack' && gameState === STATE.MENU) {
                        initAudio();
                        generateWorld();
                        gameState = STATE.PLAYING;
                        hintEl.style.opacity = '0.6';
                        showMessage('БЕГИ!', '#ff4444');
                    }
                    if (keyName === 'attack' && gameState === STATE.GAMEOVER) {
                        initAudio();
                        generateWorld();
                        gameState = STATE.PLAYING;
                        hintEl.style.opacity = '0.6';
                        messageEl.style.opacity = '0';
                    }
                });
                btn.addEventListener('pointerup', (e) => {
                    e.preventDefault();
                    keys[keyName] = false;
                    if (keyName === 'sprint') keys['sprint'] = false;
                    if (keyName === 'hide') keys['KeyE'] = false;
                });
                btn.addEventListener('pointerleave', (e) => {
                    keys[keyName] = false;
                    if (keyName === 'sprint') keys['sprint'] = false;
                    if (keyName === 'hide') keys['KeyE'] = false;
                });
                btn.addEventListener('touchstart', (e) => e.preventDefault());
            }

            setupMobileButton('btn-up', 'up');
            setupMobileButton('btn-down', 'down');
            setupMobileButton('btn-left', 'left');
            setupMobileButton('btn-right', 'right');
            setupMobileButton('btn-hide', 'hide');
            setupMobileButton('btn-attack', 'attack');
            setupMobileButton('btn-sprint', 'sprint');

            // Клик по канвасу для атаки (десктоп)
            canvas.addEventListener('click', (e) => {
                initAudio();
                if (gameState === STATE.MENU) {
                    generateWorld();
                    gameState = STATE.PLAYING;
                    hintEl.style.opacity = '0.6';
                    showMessage('БЕГИ!', '#ff4444');
                    playNoise(0.5, 0.3, 50);
                } else if (gameState === STATE.GAMEOVER) {
                    generateWorld();
                    gameState = STATE.PLAYING;
                    hintEl.style.opacity = '0.6';
                    messageEl.style.opacity = '0';
                    showMessage('СНОВА В ЛЕС...', '#ffaa00');
                } else if (gameState === STATE.PLAYING && player.alive && player.attackCooldown <= 0 && !player.isHiding) {
                    player.attackCooldown = 0.7;
                    player.attackDuration = 0.25;
                    const mouseX = e.clientX;
                    const mouseY = e.clientY;
                    const worldMX = mouseX + camera.x;
                    const worldMY = mouseY + camera.y;
                    const dx = worldMX - player.x;
                    const dy = worldMY - player.y;
                    const mag = Math.sqrt(dx * dx + dy * dy) || 1;
                    player.attackAngle = Math.atan2(dy, dx);
                    playNoise(0.1, 0.1, 200);
                    playTone(200, 'square', 0.12, 0.06, 0);
                }
            });

            // Контекстное меню отключено
            window.addEventListener('contextmenu', e => e.preventDefault());

            // ─────────────────────────────────────
            // СТАРТ
            // ─────────────────────────────────────
            function init() {
                generateWorld();
                gameState = STATE.MENU;
                hintEl.style.opacity = '1';
                hintEl.textContent = 'WASD — движение • SHIFT — бег • ПРОБЕЛ/Клик — удар • E — спрятаться';
                messageEl.style.opacity = '0';
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }

            // Проверка мобильного
            if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 768) {
                document.getElementById('mobile-controls').style.display = 'flex';
                hintEl.textContent = 'Кнопки внизу • Прячься в кустах • Бей монстров';
            }

            init();

            console.log('🕯️ ПРОКЛЯТЫЙ ЛЕС загружен...');
            console.log('   WASD — движение | SHIFT — бег | ПРОБЕЛ/Клик — удар | E — укрытие');
            console.log('   Найди батареи и аптечки. Выживи как можно дольше.');
            console.log('   Темнота скрывает монстров... но их глаза видны.');
            console.log('   Удачи. Ты не один в этом лесу.');
        })();
    </script>
</body>
