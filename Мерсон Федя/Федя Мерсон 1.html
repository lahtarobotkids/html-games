<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 650px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .subtitle {
            color: #666;
            font-size: 0.9em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        
        .stat {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 10px;
            border-radius: 15px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 0.8em;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .category-selector {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .category-btn {
            background: #f0f0f0;
            border: 2px solid #ddd;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }
        
        .category-btn:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        
        .category-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        
        .situation-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            border-left: 5px solid #667eea;
            position: relative;
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .situation-number {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .situation-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .situation-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            padding-right: 40px;
        }
        
        .situation-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .context-info {
            background: #e3f2fd;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.9em;
            color: #1565c0;
            margin-bottom: 15px;
            border-left: 3px solid #2196f3;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .option-btn {
            background: white;
            border: 2px solid #ddd;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 1em;
            color: #333;
            position: relative;
        }
        
        .option-btn:hover:not(:disabled) {
            background: #f0f0f0;
            border-color: #667eea;
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .option-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .option-btn.selected-best {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
            animation: correctPulse 0.5s ease-in-out;
        }
        
        .option-btn.selected-good {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        
        .option-btn.selected-medium {
            background: #fff3cd;
            border-color: #ffc107;
            color: #856404;
        }
        
        .option-btn.selected-bad {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
        
        .option-btn.best-answer {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
            font-weight: bold;
        }
        
        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: slideIn 0.3s ease-out;
        }
        
        .feedback.show {
            display: block;
        }
        
        .feedback.excellent {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        
        .feedback.good {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        
        .feedback.medium {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }
        
        .feedback.bad {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .next-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: transform 0.2s ease;
            display: none;
            font-weight: bold;
        }
        
        .next-btn.show {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }
        
        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .progress-container {
            margin-top: 15px;
        }

            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .progress-text {
            text-align: center;
            margin-top: 5px;
            font-size: 0.9em;
            color: #666;
        }
        
        .achievement {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #333;
            padding: 15px 30px;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: achievementPop 3s ease-out forwards;
            z-index: 1000;
        }
        
        @keyframes achievementPop {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
        
        /* Стили для финального экрана */
        .final-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s ease-out;
        }
        
        .final-screen.show {
            display: flex;
        }
        
        .final-card {

            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.5s ease-out;
            max-height: 90vh;
            overflow-y: auto;

            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }

            font-size: 2.5em;
            margin-bottom: 20px;

        .trophy-container {
            font-size: 5em;
            margin: 20px 0;
            animation: bounce 1s infinite;

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }

            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;

            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        }
        
        .score-label {
            font-weight: bold;
            color: #333;
        }

            font-weight: bold;

        }
        
        .rating-stars {
            font-size: 2em;
            margin: 10px 0;

        .rating-details {
            margin: 20px 0;
            text-align: left;

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .restart-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;

        }

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

</head>

        // Функция для перемешивания массива (алгоритм Фишера-Йетса)
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        // Инициализация игры
        function init() {
            setupCategoryButtons();
            nextSituation();
        }
        
        // Настройка кнопок категорий
        function setupCategoryButtons() {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    gameState.currentCategory = this.dataset.category;
                    nextSituation();
                });
            });
        }
        
        // Получить случайную ситуацию
        function getRandomSituation() {
            let available = allSituations;
            
            if (gameState.currentCategory !== 'all') {
                available = available.filter(s => s.category === gameState.currentCategory);
            }
            
            const unsolved = available.filter(s => !gameState.solvedSituations.has(s.id));
            
            if (unsolved.length === 0) {
                if (available.length === 0) {
                    return null;
                }
                return available[Math.floor(Math.random() * available.length)];
            }
            
            const filtered = unsolved.filter(s => s.id !== (gameState.currentSituation?.id || -1));
            if (filtered.length === 0) {
                return unsolved[Math.floor(Math.random() * unsolved.length)];
            }
            
            return filtered[Math.floor(Math.random() * filtered.length)];
        }
        
        // Показать следующую ситуацию
        function nextSituation() {
            gameState.currentSituation = getRandomSituation();
            
            if (!gameState.currentSituation) {
                showFinalScreen();
                return;
            }
            
            document.getElementById('situationNumber').textContent = `#${gameState.currentSituation.id}`;
            document.getElementById('situationIcon').textContent = gameState.currentSituation.icon;
            document.getElementById('situationTitle').textContent = gameState.currentSituation.title;
            document.getElementById('situationDescription').textContent = gameState.currentSituation.description;
            document.getElementById('contextInfo').textContent = gameState.currentSituation.context;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            // Перемешиваем варианты ответов
            const shuffledOptions = shuffleArray(gameState.currentSituation.options);
            
            shuffledOptions.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = option.text;
                button.onclick = () => makeDecision(option);
                optionsContainer.appendChild(button);
            });
            
            document.getElementById('feedback').classList.remove('show', 'excellent', 'good', 'medium', 'bad');
            document.getElementById('nextBtn').classList.remove('show');
            
            updateProgress();
        }
        
        // Принять решение
        function makeDecision(selectedOption) {
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach(btn => btn.disabled = true);
            
            const bestOption = gameState.currentSituation.options.reduce((best, current) => 
                current.score > best.score ? current : best
            );
            
            // Находим индекс выбранной опции в перемешанном списке
            const shuffledOptions = Array.from(buttons).map(btn => btn.textContent);
            const selectedIndex = shuffledOptions.indexOf(selectedOption.text);
            const bestIndex = shuffledOptions.indexOf(bestOption.text);
            
            // Подсвечиваем выбор
            if (selectedOption.score >= 9) {
                buttons[selectedIndex].classList.add('selected-best');
                gameState.excellentDecisions++;
            } else if (selectedOption.score >= 7) {
                buttons[selectedIndex].classList.add('selected-good');
                gameState.goodDecisions++;
            } else if (selectedOption.score >= 4) {
                buttons[selectedIndex].classList.add('selected-medium');
                gameState.mediumDecisions++;
            } else {
                buttons[selectedIndex].classList.add('selected-bad');
                gameState.badDecisions++;
            }
            
            if (bestIndex !== selectedIndex) {
                buttons[bestIndex].classList.add('best-answer');
            }
            
            gameState.score += selectedOption.score;
            gameState.solvedCount++;
            
            if (selectedOption.score >= 9) {
                gameState.streak++;
                if (gameState.streak > gameState.bestStreak) {
                    gameState.bestStreak = gameState.streak;
                }
            } else {
                gameState.streak = 0;
            }
            
            gameState.solvedSituations.add(gameState.currentSituation.id);
            
            if (gameState.solvedCount % gameState.situationsPerLevel === 0) {
                gameState.level++;
                showAchievement(`🎉 Новый уровень ${gameState.level}!`);
            }
            
            if (gameState.solvedCount === 10) {
                showAchievement('🏆 10 ситуаций решено!');
            } else if (gameState.solvedCount === 25) {
                showAchievement('🌟 25 ситуаций! Половина пути!');
            } else if (gameState.solvedCount === 50) {
                showAchievement('👑 Все 50 ситуаций решены!');
            }
            
            if (gameState.streak === 5) {
                showAchievement('🔥 Серия из 5 отличных решений!');
            } else if (gameState.streak === 10) {
                showAchievement('💎 Серия из 10! Невероятно!');
            }
            
            updateStats();
            updateProgress();
            
            const feedback = document.getElementById('feedback');
            let feedbackClass, emoji;
            
            if (selectedOption.score >= 9) {
                feedbackClass = 'excellent';
                emoji = '🌟';
            } else if (selectedOption.score >= 7) {
                feedbackClass = 'good';
                emoji = '✅';
            } else if (selectedOption.score >= 4) {
                feedbackClass = 'medium';
                emoji = '🤔';
            } else {
                feedbackClass = 'bad';
                emoji = '❌';
            }
            
            feedback.className = `feedback show ${feedbackClass}`;
            feedback.innerHTML = `
                <strong>${emoji} ${selectedOption.score >= 9 ? 'Превосходное решение!' : 
                              selectedOption.score >= 7 ? 'Хорошее решение!' : 
                              selectedOption.score >= 4 ? 'Среднее решение' : 
                              'Неудачное решение'}</strong>
                <br><br>
                ${selectedOption.feedback}
                <br><br>
                <small>⭐ Получено очков: ${selectedOption.score} из 10</small>
                ${selectedOption.score < 9 ? `<br><small>💡 Лучший ответ: "${bestOption.text}" (${bestOption.score} очков)</small>` : ''}
            `;
            
            document.getElementById('nextBtn').classList.add('show');
            document.getElementById('nextBtn').textContent = gameState.solvedCount >= 50 ? 'Смотреть результаты 🏆' : 'Следующая ситуация ➡️';
            
            feedback.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            if (gameState.solvedCount >= 50) {
                document.getElementById('nextBtn').onclick = showFinalScreen;
            } else {
                document.getElementById('nextBtn').onclick = nextSituation;
            }
        }
        
        // Показать финальный экран
        function showFinalScreen() {
            const maxScore = gameState.maxPossibleScore;
            const percent = Math.round((gameState.score / maxScore) * 100);
            
            document.getElementById('yourScore').textContent = gameState.score;
            document.getElementById('maxScore').textContent = maxScore;
            document.getElementById('scorePercent').textContent = percent + '%';
            
            const ratingPlace = document.getElementById('ratingPlace');
            const ratingStars = document.getElementById('ratingStars');
            const ratingText = document.getElementById('ratingText');
            const trophyIcon = document.getElementById('trophyIcon');
            const finalTitle = document.getElementById('finalTitle');
            
            ratingPlace.className = 'rating-place';
            
            if (percent >= 100) {
                ratingPlace.classList.add('gold');
                ratingStars.textContent = '⭐⭐⭐⭐⭐';
                ratingText.textContent = '🥇 1 МЕСТО - Максимальный балл!';
                trophyIcon.textContent = '👑';
                finalTitle.textContent = '🏆 Абсолютный победитель!';
            } else if (percent >= 50) {
                ratingPlace.classList.add('silver');
                ratingStars.textContent = '⭐⭐⭐⭐';
                ratingText.textContent = '🥈 2 МЕСТО - Отличный результат!';
                trophyIcon.textContent = '🏆';
                finalTitle.textContent = '🎉 Отличная игра!';
            } else if (percent >= 25) {
                ratingPlace.classList.add('bronze');
                ratingStars.textContent = '⭐⭐⭐';
                ratingText.textContent = '🥉 3 МЕСТО - Хороший результат';
                trophyIcon.textContent = '🎖️';
                finalTitle.textContent = '👍 Неплохо!';
            } else {
                ratingPlace.classList.add('fail');
                ratingStars.textContent = '⭐⭐';
                ratingText.textContent = '😔 Проигрыш - Нужно больше практики';
                trophyIcon.textContent = '📚';
                finalTitle.textContent = '💪 Не сдавайся!';
            }
            
            const ratingDetails = document.getElementById('ratingDetails');
            ratingDetails.innerHTML = `
                <div class="detail-item">
                    <span>🌟 Отличных решений:</span>
                    <span>${gameState.excellentDecisions}</span>
                </div>
                <div class="detail-item">
                    <span>✅ Хороших решений:</span>
                    <span>${gameState.goodDecisions}</span>
                </div>
                <div class="detail-item">
                    <span>🤔 Средних решений:</span>
                    <span>${gameState.mediumDecisions}</span>
                </div>
                <div class="detail-item">
                    <span>❌ Плохих решений:</span>
                    <span>${gameState.badDecisions}</span>
                </div>
                <div class="detail-item">
                    <span>🔥 Лучшая серия:</span>
                    <span>${gameState.bestStreak}</span>
                </div>
                <div class="detail-item">
                    <span>📊 Уровень достигнут:</span>
                    <span>${gameState.level}</span>
                </div>
            `;
            
            document.getElementById('finalScreen').classList.add('show');
        }
        
        // Обновить статистику
        function updateStats() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('solved').textContent = `${gameState.solvedCount}/50`;
            document.getElementById('streak').textContent = gameState.streak;
        }
        
        // Обновить прогресс
        function updateProgress() {
            const progress = (gameState.solvedCount / gameState.totalSituations) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = 
                `Прогресс: ${gameState.solvedCount}/${gameState.totalSituations} ситуаций`;
        }
        
        // Показать достижение
        function showAchievement(message) {
            const achievement = document.createElement('div');
            achievement.className = 'achievement';
            achievement.textContent = message;
            document.body.appendChild(achievement);
            
            setTimeout(() => {
                achievement.remove();
            }, 3000);
        }
        
        // Сброс игры
        function resetGame() {
            gameState = {
                score: 0,
                level: 1,
                solvedCount: 0,
                streak: 0,
                bestStreak: 0,
                currentCategory: 'all',
                situationsPerLevel: 5,
                totalSituations: 50,
                solvedSituations: new Set(),
                currentSituation: null,
                maxPossibleScore: 500,
                excellentDecisions: 0,
                goodDecisions: 0,
                mediumDecisions: 0,
                badDecisions: 0
            };
            
            document.getElementById('finalScreen').classList.remove('show');
            document.getElementById('nextBtn').onclick = nextSituation;
            updateStats();
            updateProgress();
            nextSituation();
        }
        
        // Запуск
        init();
    </script>
</body>
</html>
