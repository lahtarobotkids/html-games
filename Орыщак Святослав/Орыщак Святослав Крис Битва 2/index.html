<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Крис: Битва</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0b16;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: "Pixelify Sans", "Courier New", monospace;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #141428;
    box-shadow: 0 0 60px rgba(90, 60, 200, 0.35);
    max-width: 100vw;
    max-height: 100vh;
    width: auto; height: auto;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

// ============ Canvas setup ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 900, H = 620;
canvas.width = W; canvas.height = H;
ctx.imageSmoothingEnabled = false;

const FONT = '"Pixelify Sans", "Courier New", monospace';

// ============ Pixel sprites ============
function makeSprite(map, pal) {
  const h = map.length, w = map[0].length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const col = pal[map[y][x]];
      if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    }
  }
  return c;
}

// --- Kris (Deltarune-style): dark navy shaggy hair over one eye, red eye, green/yellow striped shirt ---
const KRIS = [
"....HHHHHHHH....",
"...HHHHHHHHHH...",
"..HHHHHHHHHHHH..",
"..HHHHHHHHHHHH..",
".HHHHHHHHHHHHHH.",
".HHHHHHHHHHHHHH.",
"HHHHHHHHSSSSSSHH",
"HHHHHHHHSSSSSSHH",
"HHHHHHHHSSRSSSHH",
"HHHHHHHHSSSSSSHH",
"HHHHHHHHSSSSSSHH",
".HHH..SSSSSS.HH.",
"...SSSSSSSSSS...",
"..GGYYGGYYGGYY..",
"..GGYYGGYYGGYY..",
"..GGYYGGYYGGYY..",
"..GGYYGGYYGGYY..",
"..GGYYGGYYGGYY..",
"..SS..SSSS..SS..",
"..PP..PPPP..PP..",
"..PP..PPPP..PP..",
"..PP..PPPP..PP..",

];
const KRIS_PAL = {

  G:'#3f9e4d', Y:'#e9c53f', P:'#3a3347', p:'#2b2636', B:'#1b1b1b'
};

// --- Enemy: purple horned imp ---
const ENEMY = [
"....HH....HH....",
"...HHH....HHH...",
"....DDDDDDDD....",
"...DDDDDDDDDD...",
"..DDDDDDDDDDDD..",
"..DDDDDDDDDDDD..",
"..DDWWDDDDWWDD..",
"..DDWEDDDDEWDD..",
"..DDWWDDDDWWDD..",
"..DDDDDDDDDDDD..",
"..DDDMMMMMMDDD..",
"..DDDMTMTMTDDD..",
"..DDDMMMMMMDDD..",
"...DDDDDDDDDD...",
"..DDDDDDDDDDDD..",
"..DDDDDDDDDDDD..",
".DDD.DDDDDD.DDD.",
".DDD.DDDDDD.DDD.",
".DDD..DDDD..DDD.",
".DDD..DDDD..DDD.",
".BBB..BBBB..BBB.",
".BBB..BBBB..BBB.",
];
const ENEMY_PAL = {
  H:'#e8e8f0', D:'#5b2a86', d:'#41205f', W:'#ffffff', E:'#ffd23f',
  M:'#3d1a1a', T:'#ffffff', B:'#2a2a2a'
};

// --- Soul heart ---
const HEART = [
"..RR...RR..",
".RRRR.RRRR.",
"RRRRRRRRRRR",
"RRRRRRRRRRR",
"RRRRRRRRRRR",
".RRRRRRRRR.",
"..RRRRRRR..",
"...RRRRR...",
"....RRR....",
".....R.....",
];
const HEART_PAL = { R:'#ff3b3b' };

// --- Diamond bullet ---
const DIAMOND = [
"...W...",
"..WWW..",
".WWWWW.",
"WWWWWWW",
".WWWWW.",
"..WWW..",
"...W...",
];
const DIAMOND_PAL = { W:'#7fd4ff' };

const krisSpr   = makeSprite(KRIS, KRIS_PAL);
const enemySpr  = makeSprite(ENEMY, ENEMY_PAL);
const heartSpr  = makeSprite(HEART, HEART_PAL);
const diamondSpr= makeSprite(DIAMOND, DIAMOND_PAL);

function drawSprite(spr, x, y, scale) {
  ctx.drawImage(spr, Math.round(x), Math.round(y), spr.width * scale, spr.height * scale);
}

// ============ Game state ============
const KRIS_MAX = 160, ENEMY_MAX = 300;
const KRIS_SCALE = 6, ENEMY_SCALE = 6, HEART_SCALE = 3, DIAMOND_SCALE = 3;

let phase = 'title';   // title | menu | enemy | end
let win = false;
let finalMsg = '';

let krisHp = KRIS_MAX, enemyHp = ENEMY_MAX;
let krisHpShown = KRIS_MAX, enemyHpShown = ENEMY_MAX;
let mercy = 0;         // 0..100
let defending = false;
let menuIndex = 0;
let banner = '', bannerUntil = 0;
let menuCooldown = 0;

let nextPhase = null;  // scheduled transition after banner

// enemy-phase objects
let arena = { x: 290, y: 140, w: 320, h: 320 };
const WALL = 12;
let heart = { x: 450, y: 300 };
let diamonds = [];
let enemyEnd = 0, spawnNext = 0;
const ENEMY_DUR = 5000;

let particles = [];
let hitFlash = 0, shake = 0, enemyFlash = 0;
let tGlobal = 0;

const BUTTONS = [
  { label: 'АТАКА',     key: 'attack' },
  { label: 'ДЕЙСТВИЕ',  key: 'act'    },
  { label: 'ПРЕДМЕТЫ',  key: 'item'   },
  { label: 'ПОЩАДА',    key: 'mercy'  },
  { label: 'ЗАЩИТА',    key: 'defend' },
];
const BTN_W = 110, BTN_H = 110, BTN_GAP = 12;
const BTN_TOP = 488;
const BTN_LEFT = Math.floor((W - (BUTTONS.length * BTN_W + (BUTTONS.length - 1) * BTN_GAP)) / 2);

function innerRect() {
  return { x: arena.x + WALL, y: arena.y + WALL, w: arena.w - WALL * 2, h: arena.h - WALL * 2 };
}

// ============ Audio (tiny beeps) ============
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
}
function tone(freq, dur, type, vol, slide) {
  try {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function sfx(name) {
  ensureAudio();
  if (!audioCtx) return;
  switch (name) {
    case 'select':  tone(400, 0.07, 'square', 0.08); break;
    case 'confirm': tone(520, 0.08, 'square', 0.11); tone(760, 0.09, 'square', 0.09); break;
    case 'attack':  tone(220, 0.16, 'sawtooth', 0.15, -130); break;
    case 'hit':     tone(150, 0.2,  'sawtooth', 0.18, -80); break;
    case 'heal':    tone(500, 0.12, 'sine', 0.12, 90); tone(760, 0.14, 'sine', 0.1, 120); break;
    case 'act':     tone(600, 0.1,  'triangle', 0.1, 60); break;
    case 'mercy':   tone(420, 0.14, 'sine', 0.12); tone(520, 0.16, 'sine', 0.12); break;
    case 'defend':  tone(320, 0.12, 'triangle', 0.12, -40); break;
    case 'win':     [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'square', 0.12), i * 120)); break;
    case 'lose':    [400, 300, 220, 150].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'sawtooth', 0.12), i * 150)); break;
  }
}

// ============ Helpers ============
function setBanner(txt, dur) {
  banner = txt;
  bannerUntil = performance.now() + (dur || 1200);
}
function addParticle(x, y, txt, color) {
  particles.push({ x, y, txt, color, life: 1.0 });
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ============ Flow ============
function startMenu() {
  phase = 'menu';
  defending = false;
  nextPhase = null;
  menuCooldown = performance.now() + 250;
}
function startEnemy() {
  phase = 'enemy';
  const r = innerRect();
  heart.x = r.x + r.w / 2;
  heart.y = r.y + r.h / 2;
  diamonds = [];
  enemyEnd = performance.now() + ENEMY_DUR;
  spawnNext = performance.now() + 500;
}
function endGame(didWin, msg) {
  win = didWin;
  finalMsg = msg || (didWin ? 'Крис победил!' : 'Крис проиграл...');
  phase = 'end';
  banner = '';
  nextPhase = null;
  if (didWin) sfx('win'); else sfx('lose');
}
function reset() {
  krisHp = KRIS_MAX; enemyHp = ENEMY_MAX;
  krisHpShown = KRIS_MAX; enemyHpShown = ENEMY_MAX;
  mercy = 0; defending = false; menuIndex = 0;
  banner = ''; nextPhase = null; win = false; finalMsg = '';
  particles = []; diamonds = [];
  hitFlash = 0; shake = 0; enemyFlash = 0;
  startMenu();
  setBanner('Ход Криса', 1300);
}

function doAction(i) {
  const a = BUTTONS[i].key;
  defending = false;
  nextPhase = null;
  let toEnemy = true;
  const now = performance.now();

  if (a === 'attack') {
    enemyHp -= 100;
    enemyFlash = 1; shake = 8;
    addParticle(700, 300, '-100', '#ff5555');
    setBanner('Крис атакует! Враг получает 100 урона');
    sfx('attack');
    if (enemyHp <= 0) { enemyHp = 0; endGame(true, 'Крис победил врага!'); return; }
  }
  else if (a === 'act') {
    mercy = Math.min(100, mercy + 25);
    addParticle(450, 300, 'ФЛИРТ +25%', '#ff9df5');
    setBanner('Крис флиртует! Шкала пощады +25%');
    sfx('act');
  }
  else if (a === 'item') {
    const healed = Math.min(KRIS_MAX - krisHp, 40);
    krisHp += healed;
    addParticle(168, 320, '+' + healed, '#7dfc7d');
    setBanner('Крис использует предмет! Восстановлено ' + healed + ' HP');
    sfx('heal');
  }
  else if (a === 'mercy') {
    if (mercy >= 100) {
      toEnemy = false;
      endGame(true, 'Крис пощадил врага!');
      return;
    } else {
      mercy = Math.min(100, mercy + 5);
      addParticle(450, 300, 'ПОЩАДА +5%', '#ffd23f');
      setBanner('Враг не пощажён. Шкала пощады +5%');
      sfx('mercy');
    }
  }
  else if (a === 'defend') {
    defending = true;
    setBanner('Крис защищается! Урон не пройдёт');
    sfx('defend');
  }

  if (toEnemy) {
    nextPhase = 'enemy';
    bannerUntil = now + 1200;
  }
}

function spawnDiamond() {
  const r = innerRect();
  const speed = 130 + Math.random() * 55;
  const aimed = Math.random() < 0.35;
  const edge = Math.floor(Math.random() * 4);
  let x, y, vx, vy;
  if (edge === 0)      { x = r.x + Math.random() * r.w; y = r.y + 8; }
  else if (edge === 1) { x = r.x + r.w - 8; y = r.y + Math.random() * r.h; }
  else if (edge === 2) { x = r.x + Math.random() * r.w; y = r.y + r.h - 8; }
  else                 { x = r.x + 8; y = r.y + Math.random() * r.h; }

  if (aimed) {
    const ang = Math.atan2(heart.y - y, heart.x - x);
    vx = Math.cos(ang) * speed; vy = Math.sin(ang) * speed;
  } else {
    const ang = Math.random() * Math.PI * 2;
    vx = Math.cos(ang) * speed; vy = Math.sin(ang) * speed;
  }
  diamonds.push({ x, y, vx, vy, r: 9, life: 3.2 });
}

// ============ Input ============
const keys = {};
document.addEventListener('keydown', (e) => {
  const k = e.key;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k)) e.preventDefault();

  if (k === 'ArrowLeft')  keys.left = true;
  if (k === 'ArrowRight') keys.right = true;
  if (k === 'ArrowUp')    keys.up = true;
  if (k === 'ArrowDown')  keys.down = true;

  if (e.repeat) return;

  if (phase === 'title') {
    if (k === 'Enter' || k === 'z' || k === 'Z' || k === ' ') { ensureAudio(); reset(); sfx('confirm'); }
    return;
  }
  if (phase === 'end') {
    if (k === 'Enter' || k === 'r' || k === 'R' || k === 'z' || k === 'Z' || k === ' ') { reset(); sfx('confirm'); }
    return;
  }
  if (phase === 'menu') {
    const now = performance.now();
    if (k === 'ArrowLeft')  { menuIndex = (menuIndex + 4) % 5; sfx('select'); }
    if (k === 'ArrowRight') { menuIndex = (menuIndex + 1) % 5; sfx('select'); }
    if ((k === 'Enter' || k === 'z' || k === 'Z' || k === ' ') && now >= menuCooldown) {
      doAction(menuIndex);
      sfx('confirm');
    }
  }
});
document.addEventListener('keyup', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft')  keys.left = false;
  if (k === 'ArrowRight') keys.right = false;
  if (k === 'ArrowUp')    keys.up = false;
  if (k === 'ArrowDown')  keys.down = false;
});

// Mouse support
function buttonRect(i) {
  return { x: BTN_LEFT + i * (BTN_W + BTN_GAP), y: BTN_TOP, w: BTN_W, h: BTN_H };
}
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  if (phase === 'menu') {
    for (let i = 0; i < BUTTONS.length; i++) {
      const b = buttonRect(i);
      if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) { menuIndex = i; }
    }
  }
});
canvas.addEventListener('click', (e) => {
  ensureAudio();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  if (phase === 'title') { reset(); sfx('confirm'); return; }
  if (phase === 'end')   { reset(); sfx('confirm'); return; }
  if (phase === 'menu') {
    for (let i = 0; i < BUTTONS.length; i++) {
      const b = buttonRect(i);
      if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
        menuIndex = i;
        if (performance.now() >= menuCooldown) { doAction(i); sfx('confirm'); }
      }
    }
  }
});

// ============ Update ============
function update(dt) {
  tGlobal += dt;
  if (hitFlash > 0) hitFlash -= dt * 4;
  if (shake > 0) shake -= dt * 20;
  if (enemyFlash > 0) enemyFlash -= dt * 4;

  // smooth HP bars
  krisHpShown += (krisHp - krisHpShown) * Math.min(1, dt * 8);
  enemyHpShown += (enemyHp - enemyHpShown) * Math.min(1, dt * 8);

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.y -= 34 * dt;
    p.life -= dt * 1.1;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (phase === 'menu') {
    if (nextPhase && performance.now() >= bannerUntil) {
      const go = nextPhase;
      nextPhase = null;
      if (go === 'enemy') startEnemy();
    }
  }
  else if (phase === 'enemy') {
    const now = performance.now();
    const r = innerRect();

    // heart movement
    const sp = 250;
    if (keys.left)  heart.x -= sp * dt;
    if (keys.right) heart.x += sp * dt;
    if (keys.up)    heart.y -= sp * dt;
    if (keys.down)  heart.y += sp * dt;
    const hw = (heartSpr.width * HEART_SCALE) / 2;
    const hh = (heartSpr.height * HEART_SCALE) / 2;
    heart.x = clamp(heart.x, r.x + hw - 4, r.x + r.w - hw + 4);
    heart.y = clamp(heart.y, r.y + hh - 4, r.y + r.h - hh + 4);

    // spawn
    if (now >= spawnNext && diamonds.length < 30) {
      spawnDiamond();
      spawnNext = now + 500 + Math.random() * 420;
    }

    // move diamonds (bounce inside field)
    for (let i = diamonds.length - 1; i >= 0; i--) {
      const d = diamonds[i];
      d.x += d.vx * dt; d.y += d.vy * dt;
      if (d.x - d.r < r.x)      { d.x = r.x + d.r;       d.vx = Math.abs(d.vx); }
      if (d.x + d.r > r.x + r.w){ d.x = r.x + r.w - d.r; d.vx = -Math.abs(d.vx); }
      if (d.y - d.r < r.y)      { d.y = r.y + d.r;       d.vy = Math.abs(d.vy); }
      if (d.y + d.r > r.y + r.h){ d.y = r.y + r.h - d.r; d.vy = -Math.abs(d.vy); }
      d.life -= dt;
      if (d.life <= 0) { diamonds.splice(i, 1); continue; }

      // collision with heart
      const dx = heart.x - d.x, dy = heart.y - d.y;
      const dist = Math.hypot(dx, dy);
      const hr = 13, dr = d.r - 1;
      if (dist < hr + dr) {
        diamonds.splice(i, 1);
        if (defending) {
          addParticle(heart.x, heart.y - 20, 'ЗАЩИТА!', '#66ccff');
          sfx('defend');
        } else {
          krisHp -= 10;
          hitFlash = 1; shake = 7;
          addParticle(heart.x, heart.y - 22, '-10', '#ff5555');
          sfx('hit');
          if (krisHp <= 0) { krisHp = 0; endGame(false); return; }
        }
      }
    }

    // end of enemy turn
    if (now >= enemyEnd) {
      startMenu();
      setBanner('Ход Криса', 1000);
    }
  }
}

// ============ Drawing ============
function text(s, x, y, size, color, align, weight) {
  ctx.font = (weight ? weight + ' ' : '') + size + 'px ' + FONT;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}

function drawBackground() {
  // base
  ctx.fillStyle = '#141428';
  ctx.fillRect(0, 0, W, H);
  // faint checker
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  for (let y = 0; y < H; y += 40)
    for (let x = 0; x < W; x += 40)
      if ((x / 40 + y / 40) % 2 === 0) ctx.fillRect(x, y, 40, 40);
  // floor band
  ctx.fillStyle = '#1d1d34';
  ctx.fillRect(0, 300, W, 320);
  ctx.fillStyle = '#26264a';
  ctx.fillRect(0, 470, W, 150);
}

function drawHpBar(label, hp, shown, max, x, y, w, color) {
  text(label, x, y - 10, 20, '#ffffff', 'left', '600');
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(x, y, w, 28);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.strokeRect(x - 1.5, y - 1.5, w + 3, 31);
  const fw = (w - 6) * clamp(shown / max, 0, 1);
  ctx.fillStyle = color;
  ctx.fillRect(x + 3, y + 3, fw, 22);
  // pixel segments
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  for (let sx = x + 3; sx < x + 3 + fw; sx += 14) ctx.fillRect(sx, y + 3, 2, 22);
  text(Math.round(shown) + ' / ' + max, x + w / 2, y + 14, 15, '#ffffff', 'center', '700');
}

function drawMercyMeter() {
  const x = 640, y = 240, w = 26, h = 170;
  text('ШКАЛА', x + w / 2, y - 26, 17, '#ffd23f', 'center', '600');
  text('ПОЩАДЫ', x + w / 2, y - 8, 17, '#ffd23f', 'center', '600');
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.strokeRect(x - 1.5, y - 1.5, w + 3, h + 3);
  const fillH = (h - 6) * (mercy / 100);
  const fColor = mercy >= 100 ? '#7dfc7d' : '#ffd23f';
  ctx.fillStyle = fColor;
  ctx.fillRect(x + 3, y + h - 3 - fillH, w - 6, fillH);
  text(Math.round(mercy) + '%', x + w / 2, y + h + 18, 16, '#ffffff', 'center', '700');
}

function drawButtons() {
  for (let i = 0; i < BUTTONS.length; i++) {
    const b = buttonRect(i);
    const sel = (i === menuIndex);
    const hover = sel;
    ctx.fillStyle = hover ? '#5a3fd6' : '#2a2a4a';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = sel ? '#ffe066' : '#8a8ab0';
    ctx.lineWidth = sel ? 5 : 3;
    ctx.strokeRect(b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3);
    if (sel) {
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(b.x + 4, b.y + 4, b.w - 8, b.h - 8);
      // selector arrows
      const t = tGlobal * 4;
      const ay = b.y + b.h / 2 + Math.sin(t) * 3;
      text('▶', b.x + 10, ay, 16, '#ffe066', 'left');
      text('◀', b.x + b.w - 10, ay, 16, '#ffe066', 'right');
    }
    text(BUTTONS[i].label, b.x + b.w / 2, b.y + b.h / 2, 17, sel ? '#ffffff' : '#cfcfe8', 'center', '600');
  }
  text('← →  выбрать      ENTER  подтвердить', W / 2, BTN_TOP + BTN_H + 18, 15, '#9a9ac0', 'center', '400');
}

function drawArena() {
  // fade-in effect
  const prog = clamp((performance.now() - (enemyEnd - ENEMY_DUR)) / 200, 0, 1);
  const a = { x: arena.x, y: arena.y, w: arena.w, h: arena.h };
  ctx.save();
  ctx.globalAlpha = 0.5 + 0.5 * prog;
  ctx.fillStyle = '#10102a';
  ctx.fillRect(a.x, a.y, a.w, a.h);
  ctx.fillStyle = '#181838';
  ctx.fillRect(a.x + 6, a.y + 6, a.w - 12, a.h - 12);
  // 4 walls
  ctx.strokeStyle = '#e8e8f0';
  ctx.lineWidth = 6;
  ctx.strokeRect(a.x + 3, a.y + 3, a.w - 6, a.h - 6);
  ctx.strokeStyle = '#6b6b96';
  ctx.lineWidth = 3;
  ctx.strokeRect(a.x + 9, a.y + 9, a.w - 18, a.h - 18);
  ctx.restore();

  const r = innerRect();
  // diamonds
  for (const d of diamonds) {
    const ds = diamondSpr.width * DIAMOND_SCALE;
    drawSprite(diamondSpr, d.x - ds / 2, d.y - ds / 2, DIAMOND_SCALE);
  }
  // heart
  const hw = heartSpr.width * HEART_SCALE;
  const hh = heartSpr.height * HEART_SCALE;
  if (defending) {
    ctx.strokeStyle = '#66ccff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(heart.x, heart.y, 24, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(102,204,255,0.4)';
    ctx.beginPath();
    ctx.arc(heart.x, heart.y, 30, 0, Math.PI * 2);
    ctx.stroke();
  }
  // pulse
  const pulse = 1 + Math.sin(tGlobal * 6) * 0.06;
  const sc = HEART_SCALE * pulse;
  ctx.drawImage(heartSpr, Math.round(heart.x - hw / 2), Math.round(heart.y - hh / 2), hw * (sc / HEART_SCALE), hh * (sc / HEART_SCALE));

  // timer
  const left = Math.max(0, (enemyEnd - performance.now()) / 1000);
  text('ВРАГ АТАКУЕТ', W / 2, a.y - 22, 22, '#ff6b6b', 'center', '700');
  text(left.toFixed(1) + 'с', W / 2, a.y + a.h + 24, 20, '#ffffff', 'center', '700');
}

function drawEnd() {
  ctx.fillStyle = 'rgba(5,5,16,0.82)';
  ctx.fillRect(0, 0, W, H);
  const col = win ? '#ffe066' : '#ff5555';
  const big = win ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ';
  text(big, W / 2, 250, 64, col, 'center', '700');
  text(finalMsg, W / 2, 330, 24, '#ffffff', 'center', '600');
  if (win) text('Крис пощадил врага и выиграл бой', W / 2, 360, 17, '#cfcfe8', 'center', '400');
  text('Нажми ENTER или R чтобы сыграть снова', W / 2, 440, 19, '#9a9ac0', 'center', '400');
}

function drawTitle() {
  ctx.fillStyle = '#141428';
  ctx.fillRect(0, 0, W, H);
  drawSprite(krisSpr, 250, 220, KRIS_SCALE + 1);
  drawSprite(enemySpr, 554, 220, ENEMY_SCALE + 1);
  text('КРИС', 300, 160, 40, '#ffffff', 'center', '700');
  text('БИТВА', 300, 205, 40, '#ffe066', 'center', '700');
  text('VS', 450, 330, 36, '#ff6b6b', 'center', '700');
  text('Герой слева • Враг справа', W / 2, 470, 20, '#cfcfe8', 'center', '600');
  const blink = Math.sin(tGlobal * 4) > -0.3;
  if (blink) text('Нажми ENTER чтобы начать', W / 2, 520, 22, '#ffffff', 'center', '600');
}

// ============ Main loop ============
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render(now);
  requestAnimationFrame(loop);
}

function render(now) {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawBackground();

  // sprites with idle bob
  const bob = Math.sin(tGlobal * 3) * 4;
  const kx = 120, ky = 250;
  const ex = 684, ey = 250;
  const sprH = krisSpr.height * KRIS_SCALE; // 144
  // shadows
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(kx + 48, ky + sprH + 4, 42, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(ex + 48, ey + sprH + 4, 42, 11, 0, 0, Math.PI * 2); ctx.fill();

  // Kris
  if (hitFlash > 0 && hitFlash > 0.4) ctx.globalAlpha = 0.5;
  drawSprite(krisSpr, kx, ky + bob, KRIS_SCALE);
  ctx.globalAlpha = 1;

  // enemy
  if (enemyFlash > 0.4) {
    // flash white: draw sprite tinted via composite
    ctx.globalAlpha = 0.85;
    drawSprite(enemySpr, ex, ey + bob, ENEMY_SCALE);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';
    drawSprite(enemySpr, ex, ey + bob, ENEMY_SCALE);
    ctx.globalCompositeOperation = 'source-over';
  } else {
    drawSprite(enemySpr, ex, ey + bob, ENEMY_SCALE);
  }

  // HP bars
  drawHpBar('КРИС', krisHp, krisHpShown, KRIS_MAX, 30, 40, 300, '#4ade80');
  drawHpBar('ВРАГ', enemyHp, enemyHpShown, ENEMY_MAX, 570, 40, 300, '#ef4444');

  // mercy meter (left of enemy)
  drawMercyMeter();

  // turn indicator
  if (phase === 'menu') text('ХОД КРИСА', W / 2, 96, 22, '#ffe066', 'center', '700');
  else if (phase === 'enemy') text('ХОД ВРАГА', W / 2, 96, 22, '#ff6b6b', 'center', '700');

  if (phase === 'enemy') drawArena();

  // banner
  if (banner && performance.now() < bannerUntil && phase !== 'end') {
    ctx.font = '600 20px ' + FONT;
    const bw = Math.max(320, ctx.measureText(banner).width + 60);
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.fillRect(W / 2 - bw / 2, 118, bw, 46);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.strokeRect(W / 2 - bw / 2 - 1.5, 116.5, bw + 3, 49);
    text(banner, W / 2, 141, 20, '#ffffff', 'center', '600');
  }

  if (phase === 'menu') drawButtons();
  else if (phase === 'title') drawTitle();
  else if (phase === 'end') drawEnd();

  // particles
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    text(p.txt, p.x, p.y, 22, p.color, 'center', '700');
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

requestAnimationFrame(loop);
</script>
</body>
