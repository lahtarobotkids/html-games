<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ночная оборона: Пиксельная победа</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0a12;
            font-family: 'Courier New', monospace;
            user-select: none;
            cursor: crosshair;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #8f8;
            font-size: 22px;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
            font-family: 'Courier New', monospace;
        }
        #ui span {
            color: #ff4444;
            font-weight: bold;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 20, 0.95);
            color: #fff;
            padding: 40px;
            border-radius: 4px;
            border: 4px solid #ff0000;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 0 60px rgba(255,0,0,0.3);
            font-family: 'Courier New', monospace;
            image-rendering: pixelated;
        }
        #game-over h1 { margin: 0 0 10px 0; font-size: 42px; color: #ff0000; }
        #game-over button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 18px;
            cursor: pointer;
            background: #222;
            color: #fff;
            border: 2px solid #555;
            border-radius: 0;
            font-family: 'Courier New', monospace;
        }
        #game-over button:hover { background: #444; border-color: #fff; }
        
        #win-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 30;
            pointer-events: none;
        }
        #win-screen svg {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }
        #win-screen button {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 50px;
            font-size: 22px;
            cursor: pointer;
            background: #2a2a3a;
            color: #fff;
            border: 4px solid #4CAF50;
            border-radius: 0;
            font-family: 'Courier New', monospace;
            pointer-events: all;
            z-index: 40;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.4);
            transition: 0.2s;
        }
        #win-screen button:hover {
            background: #4CAF50;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 60px rgba(76, 175, 80, 0.8);
        }
        .pixel-text {
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        /* Скример элементы */
        #screamer-flash-white {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: none;
            z-index: 99;
            pointer-events: none;
        }
        #screamer-flash-red {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.8);
            display: none;
            z-index: 98;
            pointer-events: none;
        }
        #screamer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            z-index: 100;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            animation: shake 0.1s infinite;
        }
        #screamer-overlay svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
            filter: contrast(2) brightness(0.6) saturate(3);
        }
        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-10px, 10px); }
            50% { transform: translate(10px, -10px); }
            75% { transform: translate(-5px, -5px); }
            100% { transform: translate(5px, 5px); }
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        #screamer-face-container {
            animation: pulse 0.15s infinite;
            width: 100%;
            height: 100%;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 2px); }
            40% { transform: translate(5px, -2px); }
            60% { transform: translate(-2px, 5px); }
            80% { transform: translate(2px, -5px); }
            100% { transform: translate(0); }
        }
        #glitch-layer {
            animation: glitch 0.08s infinite;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            mix-blend-mode: screen;
        }
    </style>
</head>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        
        // Элементы
        const screamerOverlay = document.getElementById('screamer-overlay');
        const screamerFlashWhite = document.getElementById('screamer-flash-white');
        const screamerFlashRed = document.getElementById('screamer-flash-red');
        const winScreen = document.getElementById('win-screen');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let gameTime = 60;
        let isGameOver = false;
        let enemies = [];
        let lastSpawnTime = 0;
        let spawnDelay = 2000;
        let frameCount = 0;
        let screamerActive = false;

        const doorPositions = [
            { x: 0.3, z: 0.8, isClosed: false, closeTimer: 0, label: 'DOOR 1' },
            { x: 0.7, z: 0.8, isClosed: false, closeTimer: 0, label: 'DOOR 2' }
        ];

        function playScreamerSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscBass = audioCtx.createOscillator();
                const gainBass = audioCtx.createGain();
                oscBass.type = 'sawtooth';
                oscBass.frequency.setValueAtTime(60, audioCtx.currentTime);
                oscBass.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.8);
                gainBass.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gainBass.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                oscBass.connect(gainBass);
                gainBass.connect(audioCtx.destination);
                oscBass.start(audioCtx.currentTime);
                oscBass.stop(audioCtx.currentTime + 0.8);
                
                const oscHigh = audioCtx.createOscillator();
                const gainHigh = audioCtx.createGain();
                oscHigh.type = 'sawtooth';
                oscHigh.frequency.setValueAtTime(2000, audioCtx.currentTime);
                oscHigh.frequency.exponentialRampToValueAtTime(5000, audioCtx.currentTime + 0.3);
                gainHigh.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainHigh.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                oscHigh.connect(gainHigh);
                gainHigh.connect(audioCtx.destination);
                oscHigh.start(audioCtx.currentTime);
                oscHigh.stop(audioCtx.currentTime + 0.6);
                
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'square';
                osc2.frequency.setValueAtTime(1500, audioCtx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(3500, audioCtx.currentTime + 0.4);
                gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(audioCtx.currentTime);
                osc2.stop(audioCtx.currentTime + 0.5);
                
                const bufferSize = audioCtx.sampleRate * 0.6;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const env = Math.exp(-i / bufferSize * 4);
                    data[i] = (Math.random() * 2 - 1) * env * 0.8;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.7, audioCtx.currentTime);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.7);
                noise.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start(audioCtx.currentTime);
                
                const oscScreech = audioCtx.createOscillator();
                const gainScreech = audioCtx.createGain();
                oscScreech.type = 'sawtooth';
                oscScreech.frequency.setValueAtTime(4000, audioCtx.currentTime + 0.2);
                oscScreech.frequency.exponentialRampToValueAtTime(8000, audioCtx.currentTime + 0.4);
                gainScreech.gain.setValueAtTime(0, audioCtx.currentTime);
                gainScreech.gain.setValueAtTime(0.8, audioCtx.currentTime + 0.2);
                gainScreech.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscScreech.connect(gainScreech);
                gainScreech.connect(audioCtx.destination);
                oscScreech.start(audioCtx.currentTime + 0.2);
                oscScreech.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }

        function triggerScreamer() {
            if (screamerActive) return;
            screamerActive = true;
            screamerFlashWhite.style.display = 'block';
            setTimeout(() => {
                screamerFlashWhite.style.display = 'none';
                screamerFlashRed.style.display = 'block';
                setTimeout(() => {
                    screamerFlashRed.style.display = 'none';
                    screamerOverlay.style.display = 'flex';
                }, 150);
            }, 100);
            playScreamerSound();
            setTimeout(() => {
                screamerOverlay.style.display = 'none';
                document.getElementById('game-over').style.display = 'block';
            }, 2000);
        }

        class PixelZombie {
            constructor(targetDoor) {
                this.targetDoor = targetDoor;
                this.x = targetDoor.x + (Math.random() - 0.5) * 0.06;
                if (this.x < 0.05) this.x = 0.05;
                if (this.x > 0.95) this.x = 0.95;
                this.z = 1.8;
                this.speed = 0.01 + Math.random() * 0.006;
                this.isDead = false;
                this.isAttacking = false;
                this.animFrame = 0;
                this.animTimer = 0;
                this.hasTriggeredScreamer = false;
                this.skinColor = Math.random() > 0.5 ? '#6b8e5a' : '#7a9e6a';
                this.eyeColor = '#ff0000';
                this.clothesColor = '#4a5a3a';
            }

            update() {
                if (isGameOver || this.isDead) return;
                this.animTimer += this.speed * 2;
                if (this.animTimer > 0.5) {
                    this.animTimer = 0;
                    this.animFrame = (this.animFrame + 1) % 4;
                }
                this.z -= this.speed;
                for (let door of doorPositions) {
                    if (this.z < 0.7 && Math.abs(this.x - door.x) < 0.15) {
                        if (door.isClosed) {
                            this.isDead = true;
                            return;
                        } else {
                            this.isAttacking = true;
                            if (!this.hasTriggeredScreamer && this.z < 0.4) {
                                this.hasTriggeredScreamer = true;
                                triggerScreamer();
                            }
                        }
                    }
                }
                if (this.z < 0.35 && !this.hasTriggeredScreamer) {
                    this.hasTriggeredScreamer = true;
                    triggerScreamer();
                }
            }

            draw() {
                if (this.isDead) return;
                const screenX = this.x * canvas.width;
                const scale = 1 / (this.z + 0.25);
                const size = Math.floor(60 * scale);
                const pixelSize = Math.max(2, Math.floor(size / 20));
                const baseY = canvas.height / 2 + 100 - (this.z * 50);

                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(screenX - size/2 + pixelSize * 3, baseY + size * 0.6, size - pixelSize * 6, pixelSize * 3);

                const legOffset = this.animFrame % 2 === 0 ? 0 : pixelSize * 2;
                ctx.fillStyle = '#2a3a2a';
                ctx.fillRect(screenX - size/3, baseY + size * 0.5 + legOffset, pixelSize * 4, pixelSize * 6);
                ctx.fillRect(screenX + size/3 - pixelSize * 4, baseY + size * 0.5 - legOffset, pixelSize * 4, pixelSize * 6);

                ctx.fillStyle = this.clothesColor;
                ctx.fillRect(screenX - size/2 + pixelSize * 2, baseY + size * 0.1, size - pixelSize * 4, size * 0.5);
                ctx.fillStyle = '#3a4a3a';
                ctx.fillRect(screenX - pixelSize * 2, baseY + size * 0.2, pixelSize * 2, pixelSize * 2);
                ctx.fillRect(screenX + pixelSize * 1, baseY + size * 0.2, pixelSize * 2, pixelSize * 2);
                
                const armY = baseY + size * 0.15;
                ctx.fillStyle = this.skinColor;
                ctx.fillRect(screenX - size/2 - pixelSize, armY + (this.animFrame % 2 === 0 ? 0 : pixelSize), pixelSize * 5, pixelSize * 7);
                ctx.fillRect(screenX + size/2 - pixelSize * 4, armY - (this.animFrame % 2 === 0 ? 0 : pixelSize), pixelSize * 5, pixelSize * 7);
                ctx.fillStyle = '#5a7a4a';
                for (let i = 0; i < 3; i++) {
                    ctx.fillRect(screenX - size/2 - pixelSize + i * pixelSize * 2, armY + pixelSize * 6, pixelSize, pixelSize * 2);
                    ctx.fillRect(screenX + size/2 - pixelSize * 3 + i * pixelSize * 2, armY + pixelSize * 6, pixelSize, pixelSize * 2);
                }

                ctx.fillStyle = this.skinColor;
                ctx.fillRect(screenX - size/3, baseY - size * 0.1, size * 0.66, size * 0.4);
                ctx.fillStyle = '#2a2a1a';
                ctx.fillRect(screenX - size/3, baseY - size * 0.15, size * 0.66, pixelSize * 3);
                for (let i = 0; i < 6; i++) {
                    ctx.fillRect(screenX - size/3 + i * pixelSize * 4, baseY - size * 0.15 - (i % 2 === 0 ? pixelSize * 2 : 0), pixelSize * 2, pixelSize * 3);
                }

                ctx.fillStyle = this.eyeColor;
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 10;
                ctx.fillRect(screenX - size/5, baseY + pixelSize * 2, pixelSize * 3, pixelSize * 3);
                ctx.fillRect(screenX + size/5 - pixelSize * 3, baseY + pixelSize * 2, pixelSize * 3, pixelSize * 3);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#000';
                ctx.fillRect(screenX - size/5 + pixelSize, baseY + pixelSize * 3, pixelSize, pixelSize);
                ctx.fillRect(screenX + size/5 - pixelSize * 2, baseY + pixelSize * 3, pixelSize, pixelSize);

                ctx.fillStyle = '#3a1a1a';
                ctx.fillRect(screenX - size/6, baseY + size * 0.25, size * 0.33, pixelSize * 2);
                ctx.fillStyle = '#c8c8a0';
                for (let i = 0; i < 4; i++) {
                    ctx.fillRect(screenX - size/6 + i * pixelSize * 3, baseY + size * 0.25, pixelSize, pixelSize * 1.5);
                }

                ctx.fillStyle = '#8a2a2a';
                ctx.fillRect(screenX - size/3 + pixelSize * 8, baseY + size * 0.05, pixelSize * 4, pixelSize * 2);
                ctx.fillRect(screenX + size/3 - pixelSize * 10, baseY + size * 0.1, pixelSize * 3, pixelSize * 2);

                if (!this.isDead) {
                    ctx.fillStyle = '#ffaa00';
                    ctx.font = `${Math.floor(16 * scale / 2)}px 'Courier New'`;
                    ctx.textAlign = 'center';
                    ctx.fillText('▶ ' + this.targetDoor.label, screenX, baseY - size * 0.2);
                }
            }
        }

        function spawnEnemy() {
            if (isGameOver) return;
            if (enemies.length > 0) return;
            const doorIndex = Math.floor(Math.random() * doorPositions.length);
            const targetDoor = doorPositions[doorIndex];
            enemies.push(new PixelZombie(targetDoor));
        }

        function tryCloseDoor(xPos) {
            if (isGameOver) return;
            for (let door of doorPositions) {
                if (Math.abs(xPos - door.x) < 0.15) {
                    if (!door.isClosed) {
                        door.isClosed = true;
                        door.closeTimer = 2.0;
                        for (let enemy of enemies) {
                            if (enemy.targetDoor === door && !enemy.isDead) {
                                enemy.isDead = true;
                                setTimeout(() => {
                                    if (!isGameOver) spawnEnemy();
                                }, spawnDelay);
                            }
                        }
                    }
                    break;
                }
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const worldX = mouseX / canvas.width;
            tryCloseDoor(worldX);
        });

        let timerInterval;
        function startTimer() {
            timerInterval = setInterval(() => {
                if (isGameOver) return;
                gameTime--;
                document.getElementById('timer').innerText = gameTime;
                if (gameTime <= 0) {
                    clearInterval(timerInterval);
                    isGameOver = true;
                    // Показываем экран победы вместо обычного
                    winScreen.style.display = 'block';
                }
            }, 1000);
        }

        function drawPixelBackground() {
            ctx.fillStyle = '#0a0a18';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 30; i++) {
                const starX = (i * 137 + 50) % canvas.width;
                const starY = (i * 251 + 30) % (canvas.height / 2 - 50);
                ctx.fillRect(starX, starY, 2, 2);
            }
            const floorY = canvas.height / 2;
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, floorY, canvas.width, canvas.height);
            ctx.strokeStyle = '#2a2a3e';
            ctx.lineWidth = 2;
            for (let i = 0; i < 12; i++) {
                const y = floorY + i * 30 + 15;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, floorY - 50);
            ctx.strokeStyle = '#2a2a3e';
            ctx.lineWidth = 1;
            for (let y = 0; y < floorY - 50; y += 20) {
                for (let x = 0; x < canvas.width; x += 40) {
                    const offset = (Math.floor(y / 20) % 2) * 20;
                    ctx.strokeRect(x + offset, y, 40, 20);
                }
            }
        }

        function gameLoop(time) {
            frameCount++;
            drawPixelBackground();

            for (let door of doorPositions) {
                if (door.isClosed) {
                    door.closeTimer -= 1/60;
                    if (door.closeTimer <= 0) {
                        door.isClosed = false;
                        door.closeTimer = 0;
                    }
                }
                const doorX = door.x * canvas.width;
                const doorWidth = 140;
                const doorHeight = 240;
                const doorY = canvas.height / 2 - doorHeight / 2 + 50;

                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(doorX - doorWidth/2 + 5, doorY + 5, doorWidth, doorHeight);
                ctx.fillStyle = door.isClosed ? '#8B6B4B' : '#5C3A1A';
                ctx.fillRect(doorX - doorWidth/2, doorY, doorWidth, doorHeight);
                ctx.strokeStyle = door.isClosed ? '#6B4B2B' : '#4A2A0A';
                ctx.lineWidth = 2;
                for (let y = 0; y < doorHeight; y += 30) {
                    ctx.beginPath();
                    ctx.moveTo(doorX - doorWidth/2, doorY + y);
                    ctx.lineTo(doorX + doorWidth/2, doorY + y);
                    ctx.stroke();
                }
                ctx.fillStyle = '#D4A84B';
                ctx.fillRect(doorX + (door.isClosed ? 40 : 0), doorY + doorHeight/2, 8, 12);
                if (door.isClosed) {
                    ctx.fillStyle = '#ffaa00';
                    ctx.fillRect(doorX + 45, doorY + doorHeight/2 + 15, 6, 6);
                }
                ctx.fillStyle = '#fff';
                ctx.font = '20px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText(door.isClosed ? '[ЗАКРЫТО]' : '[ОТКРЫТО]', doorX, doorY - 20);
                if (!door.isClosed) {
                    ctx.fillStyle = '#ff3333';
                    ctx.fillText('⚠', doorX, doorY - 45);
                }
            }

            document.getElementById('enemy-count').innerText = enemies.length;

            if (!isGameOver && gameTime > 0 && enemies.length === 0) {
                if (Date.now() - lastSpawnTime > spawnDelay) {
                    spawnEnemy();
                    lastSpawnTime = Date.now();
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                enemy.update();
                enemy.draw();
                if (enemy.isDead || enemy.z < 0.3) {
                    enemies.splice(i, 1);
                }
            }

            ctx.fillStyle = '#88ff88';
            ctx.font = '24px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('◄ DOOR 1', canvas.width * 0.2, 40);
            ctx.fillText('DOOR 2 ►', canvas.width * 0.8, 40);

            if (enemies.length === 0 && !isGameOver && gameTime > 0) {
                ctx.fillStyle = '#4CAF50';
                ctx.font = '20px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText('✓ ВРАГ УНИЧТОЖЕН. ОЖИДАЙТЕ...', canvas.width/2, canvas.height/2 + 200);
            }

            requestAnimationFrame(gameLoop);
        }

        startTimer();
        setTimeout(() => spawnEnemy(), 1000);
        requestAnimationFrame(gameLoop);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
