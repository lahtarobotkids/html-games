<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Погоня: Кот против вора</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: Arial, sans-serif; padding: 15px; }
    #container { background: #0f1626; padding: 20px; border-radius: 16px; border: 4px solid #e94560; max-width: 850px; width: 100%; }
    #header { display: flex; justify-content: space-between; color: #dfe6e9; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .stat { background: #0f3460; padding: 4px 12px; border-radius: 6px; border: 2px solid #e94560; font-size: 14px; }
    .stat span { color: #fdcb6e; }
    canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; border: 2px solid #0f3460; background: #2d3436; touch-action: none; }
    #controls { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; flex-wrap: wrap; gap: 8px; }
    button { background: #e94560; color: white; border: none; padding: 8px 18px; font-size: 14px; cursor: pointer; border-radius: 6px; border-bottom: 3px solid #a93226; font-weight: bold; }
    button:hover { background: #ff6b81; }
    #help { color: #b2bec3; font-size: 11px; text-align: center; margin-top: 8px; }
    #status { color: #fdcb6e; font-size: 14px; font-weight: bold; }
</style>
</head>
<body>
<div id="container">
    <div id="header">
        <div style="color:#fdcb6e;font-weight:bold;">🐱 ПОГОНЯ</div>
        <div class="stat">⏱ <span id="time">00:00</span></div>
        <div class="stat">🏆 <span id="score">0</span></div>
        <div class="stat">⚡ <span id="level">1</span></div>
    </div>
    <canvas id="game" width="800" height="450"></canvas>
    <div id="controls">
        <div id="status">🐱 ЛОВИ ВОРА!</div>
        <button id="restart">🔄 НОВАЯ</button>
        <button id="pauseBtn">⏸ ПАУЗА</button>
    </div>
    <div id="help">⬆⬇⬅➡ / WASD — движение | ПРОБЕЛ — рывок | P — пауза</div>
</div>

<script>
// ==============================================================
//  МАКСИМАЛЬНО ПРОСТАЯ, НО ДЕТАЛИЗИРОВАННАЯ ИГРА — 100% РАБОТАЕТ
// ==============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 800, H = 450, LANES = 5, LANE_H = H / LANES;

// DOM
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const levelEl = document.getElementById('level');
const statusEl = document.getElementById('status');

// --- Игрок (кот) ---
const cat = {
    x: 100, y: 200, w: 28, h: 28,
    speed: 2.5, boostSpeed: 5,
    isBoost: false, dir: 1,
    frame: 0, timer: 0
};

// --- Вор ---
let thief = {
    x: 680, y: 200, w: 24, h: 28,
    speed: 1.5, targetY: 200
};

let obstacles = [];
let score = 0;
let gameOver = false;
let win = false;
let paused = false;
let keys = {};
let frame = 0;
let time = 0;
let level = 1;

// --- Сброс ---
function reset() {
    cat.x = 100; cat.y = 200;
    thief.x = 680; thief.y = 200;
    obstacles = [];
    score = 0;
    gameOver = false;
    win = false;
    paused = false;
    frame = 0;
    time = 0;
    level = 1;
    scoreEl.textContent = '0';
    levelEl.textContent = '1';
    statusEl.textContent = '🐱 ЛОВИ ВОРА!';
    document.getElementById('pauseBtn').textContent = '⏸ ПАУЗА';
}

// --- Спавн препятствий ---
function spawnObstacle() {
    const lane = Math.floor(Math.random() * LANES);
    const y = lane * LANE_H + 8;
    const types = ['cone', 'barrier', 'box'];
    const type = types[Math.floor(Math.random() * 3)];
    let w, h, color;
    if (type === 'cone') { w = 16; h = 20; color = '#f39c12'; }
    else if (type === 'barrier') { w = 30; h = 14; color = '#e74c3c'; }
    else { w = 20; h = 20; color = '#d35400'; }
    obstacles.push({
        x: W + 20 + Math.random() * 60,
        y: y + (LANE_H - h) / 2,
        w, h, color, type,
        speed: 1.5 + Math.random() * 1.5 + level * 0.1
    });
}

// --- Частицы (упрощённо) ---
let particles = [];
function addParticles(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4 - 0.5,
            life: 20 + Math.random() * 20,
            maxLife: 40,
            size: 2 + Math.random() * 5,
            color
        });
    }
}

// --- Обновление ---
function update() {
    if (gameOver || win || paused) return;

    frame++;
    time += 1/60;

    // Уровни
    let newLevel = 1 + Math.floor(time / 15);
    if (newLevel !== level) {
        level = newLevel;
        levelEl.textContent = level;
        thief.speed = 1.5 + level * 0.15;
    }

    // Движение кота
    let dx = 0, dy = 0;
    if (keys['ArrowUp'] || keys['w']) dy = -1;
    if (keys['ArrowDown'] || keys['s']) dy = 1;
    if (keys['ArrowLeft'] || keys['a']) { dx = -1; cat.dir = -1; }
    if (keys['ArrowRight'] || keys['d']) { dx = 1; cat.dir = 1; }
    if (keys[' '] || keys['Space']) cat.isBoost = true;
    else cat.isBoost = false;

    let speed = cat.isBoost ? cat.boostSpeed : cat.speed;
    if (dx && dy) speed *= 0.707;

    cat.x += dx * speed;
    cat.y += dy * speed;
    cat.x = Math.max(5, Math.min(W - cat.w - 5, cat.x));
    cat.y = Math.max(5, Math.min(H - cat.h - 5, cat.y));

    // Анимация
    if (dx || dy) {
        cat.timer++;
        if (cat.timer > 6) { cat.timer = 0; cat.frame = (cat.frame + 1) % 4; }
    } else { cat.frame = 0; cat.timer = 0; }

    // Вор
    thief.x -= thief.speed;
    if (frame % 30 === 0) {
        let lane = Math.floor(Math.random() * LANES);
        thief.targetY = lane * LANE_H + (LANE_H - thief.h) / 2;
    }
    let dY = thief.targetY - thief.y;
    if (Math.abs(dY) > 2) thief.y += Math.sign(dY) * 1.5;
    else thief.y = thief.targetY;

    // Победа
    if (thief.x < -40) {
        win = true;
        gameOver = true;
        score += 1000;
        scoreEl.textContent = score;
        statusEl.textContent = '🎉 ПОБЕДА! +1000';
        addParticles(W/2, H/2, '#f1c40f', 30);
        return;
    }

    if (thief.x < 0) {
        thief.x = W + 30;
        thief.y = 200;
        thief.targetY = 200;
    }

    // Препятствия
    if (frame % 35 === 0 && obstacles.length < 6 + level) spawnObstacle();
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let ob = obstacles[i];
        ob.x -= ob.speed;

        if (ob.x < -40) { obstacles.splice(i, 1); continue; }

        // Столкновение с котом
        if (cat.x < ob.x + ob.w && cat.x + cat.w > ob.x &&
            cat.y < ob.y + ob.h && cat.y + cat.h > ob.y) {
            gameOver = true;
            statusEl.textContent = '💥 ПРОИГРЫШ!';
            addParticles(cat.x + cat.w/2, cat.y + cat.h/2, '#e74c3c', 20);
            return;
        }

        // Вор уворачивается
        if (thief.x < ob.x + ob.w && thief.x + thief.w > ob.x &&
            thief.y < ob.y + ob.h && thief.y + thief.h > ob.y) {
            let newLane = Math.floor(Math.random() * LANES);
            thief.targetY = newLane * LANE_H + (LANE_H - thief.h) / 2;
            obstacles.splice(i, 1);
        }
    }

    // Очки за преследование
    let dist = Math.hypot(cat.x - thief.x, cat.y - thief.y);
    if (dist < 150 && dist > 30 && frame % 6 === 0) {
        score++;
        scoreEl.textContent = score;
    }

    // Частицы
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Время
    let mins = Math.floor(time / 60);
    let secs = Math.floor(time % 60);
    timeEl.textContent = String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
}

// --- Отрисовка ---
function draw() {
    ctx.clearRect(0, 0, W, H);

    // Дорога
    for (let i = 0; i < LANES; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#2d3436' : '#353b48';
        ctx.fillRect(0, i * LANE_H, W, LANE_H);
    }

    // Разметка
    ctx.fillStyle = '#f1c40f';
    for (let i = 0; i < 20; i++) {
        let x = (i * 50 + frame * 2) % W;
        for (let lane = 0; lane < LANES; lane++) {
            ctx.fillRect(x, lane * LANE_H + LANE_H/2 - 2, 20, 4);
        }
    }

    // Препятствия
    for (let ob of obstacles) {
        ctx.fillStyle = ob.color;
        ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(ob.x + 2, ob.y + 2, ob.w - 4, ob.h - 4);
        if (ob.type === 'cone') {
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(ob.x + 4, ob.y + 2, 2, ob.h - 4);
        }
    }

    // Вор
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(thief.x + 3, thief.y + 3, thief.w, thief.h);
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(thief.x, thief.y, thief.w, thief.h);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(thief.x + 2, thief.y - 4, thief.w - 4, 4);
    ctx.fillRect(thief.x + 4, thief.y - 8, thief.w - 8, 4);
    ctx.fillStyle = '#ecf0f1';
    ctx.fillRect(thief.x + 2, thief.y + 4, 6, 6);
    ctx.fillRect(thief.x + thief.w - 8, thief.y + 4, 6, 6);
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(thief.x + 4, thief.y + 7, 2, 2);
    ctx.fillRect(thief.x + thief.w - 4, thief.y + 7, 2, 2);
    ctx.fillStyle = '#f39c12';
    ctx.fillRect(thief.x + thief.w/2 - 5, thief.y - 6, 10, 6);

    // Кот
    const cx = cat.x, cy = cat.y;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(cx + 3, cy + 3, cat.w, cat.h);
    ctx.fillStyle = '#e67e22';
    ctx.fillRect(cx + 2, cy + 4, cat.w - 4, cat.h - 6);
    ctx.fillRect(cx + 4, cy + 2, cat.w - 8, 4);
    ctx.fillRect(cx + 4, cy + cat.h - 6, cat.w - 8, 4);
    ctx.fillStyle = '#d35400';
    ctx.fillRect(cx + 6, cy + 8, 2, 6);
    ctx.fillRect(cx + 12, cy + 6, 2, 8);
    ctx.fillRect(cx + 18, cy + 8, 2, 6);
    ctx.fillStyle = '#e67e22';
    ctx.fillRect(cx + cat.w - 10, cy + 2, 10, 10);
    ctx.fillRect(cx + cat.w - 8, cy, 6, 4);
    ctx.fillStyle = '#d35400';
    ctx.fillRect(cx + cat.w - 12, cy - 2, 4, 4);
    ctx.fillRect(cx + cat.w - 2, cy - 2, 4, 4);
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(cx + cat.w - 10, cy + 4, 5, 5);
    ctx.fillRect(cx + cat.w - 3, cy + 4, 5, 5);
    ctx.fillStyle = '#000';
    ctx.fillRect(cx + cat.w - 8, cy + 6, 2, 2);
    ctx.fillRect(cx + cat.w - 1, cy + 6, 2, 2);
    ctx.fillStyle = '#d35400';
    let tail = Math.sin(frame * 0.1) * 4;
    ctx.fillRect(cx - 6 + tail, cy + 10, 8, 3);
    ctx.fillRect(cx - 10 + tail, cy + 12, 6, 2);
    // Лапы
    let legOff = cat.frame % 2 === 0 ? 0 : 3;
    ctx.fillStyle = '#d35400';
    ctx.fillRect(cx + 4, cy + cat.h - 3, 4, 3 + legOff);
    ctx.fillRect(cx + cat.w - 8, cy + cat.h - 3, 4, 3 - legOff);

    // Частицы
    for (let p of particles) {
        let alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // HUD
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(10, 10, 120, 26);
    ctx.fillStyle = '#f1c40f';
    ctx.font = '16px Arial';
    ctx.fillText('ОЧКИ: ' + score, 16, 28);

    if (cat.isBoost) {
        ctx.fillStyle = 'rgba(52,152,219,0.4)';
        ctx.fillRect(10, 40, 40, 8);
        ctx.fillStyle = '#3498db';
        ctx.fillRect(10, 40, 40, 8);
    }

    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = win ? '#2ecc71' : '#e74c3c';
        ctx.font = '30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(win ? '🎉 ПОБЕДА!' : '💥 ПРОИГРЫШ', W/2, H/2);
    }

    if (paused && !gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#dfe6e9';
        ctx.font = '28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('⏸ ПАУЗА', W/2, H/2);
    }
}

// --- Цикл ---
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// --- Клавиши ---
document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ') e.preventDefault();
    if (e.key === 'p' || e.key === 'P') togglePause();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

function togglePause() {
    if (gameOver || win) return;
    paused = !paused;
    document.getElementById('pauseBtn').textContent = paused ? '▶ ПРОДОЛЖИТЬ' : '⏸ ПАУЗА';
}

document.getElementById('restart').addEventListener('click', reset);
document.getElementById('pauseBtn').addEventListener('click', togglePause);

// --- Сенсорное управление ---
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    const x = (touch.clientX - rect.left) * (W / rect.width);
    const y = (touch.clientY - rect.top) * (H / rect.height);
    keys['ArrowLeft'] = x < W*0.35;
    keys['ArrowRight'] = x > W*0.65;
    keys['ArrowUp'] = y < H*0.35;
    keys['ArrowDown'] = y > H*0.65;
    keys[' '] = x > W*0.4 && x < W*0.6 && y > H*0.3 && y < H*0.7;
});
canvas.addEventListener('touchend', e => {
    e.preventDefault();
    keys['ArrowLeft'] = keys['ArrowRight'] = keys['ArrowUp'] = keys['ArrowDown'] = keys[' '] = false;
});

// --- СТАРТ ---
reset();
loop();
</script>
</body>
</html>
