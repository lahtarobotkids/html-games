<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сонник: Погоня</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0e0e18;
    color: #eee;
    font-family: system-ui, "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  #wrap { width: 100%; max-width: 1200px; }
  #cv {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    background: #000;
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font-size: 17px;
    font-weight: 700;
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .08s, filter .15s;
  }
  button:active { transform: scale(0.96); }
  #btnNext {
    background: #ffcc00;
    color: #1a1a1a;
    box-shadow: 0 4px 0 #b8860b;
  }
  #btnNext:hover { filter: brightness(1.08); }
  #btnAuto {
    background: #3a3f5c;
    color: #fff;
    box-shadow: 0 4px 0 #23263a;
  }
  #btnAuto.on { background: #28a745; box-shadow: 0 4px 0 #1c7430; }
  #sceneLabel {
    font-size: 15px;
    color: #c8c8d8;
    min-width: 220px;
    text-align: center;
  }
  #hint {
    margin-top: 10px;
    font-size: 13px;
    color: #7a7a90;
    text-align: center;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1200" height="675"></canvas>
  <div id="controls">
    <button id="btnNext">ДАЛЕЕ →</button>
    <button id="btnAuto">▶ Авто</button>
    <span id="sceneLabel">Часть 1 — Сцена 1/5</span>
  </div>
  <div id="hint">Клик по экрану, кнопка «ДАЛЕЕ», пробел или Enter — следующая сцена. «▶ Авто» — самопросмотр.</div>
</div>

<script>
"use strict";
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const VW = 1200, VH = 675;
const GROUND = 560;          // линия земли
const btnNext = document.getElementById('btnNext');
const btnAuto = document.getElementById('btnAuto');
const sceneLabel = document.getElementById('sceneLabel');

// ---------- Аудио ----------
let actx = null, audioOn = false;
function initAudio() {
  if (audioOn) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); audioOn = true; }
  catch (e) { audioOn = false; }
}
function beep(freq, dur, type, vol) {
  if (!audioOn || !actx) return;
  type = type || 'square'; vol = vol || 0.08;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}
function sfxRing()  { beep(1500, 0.09, 'sine', 0.09); beep(2000, 0.09, 'sine', 0.07); }
function sfxWhoosh(){ beep(900, 0.15, 'sawtooth', 0.05); }
function sfxBonk()  { beep(70, 0.15, 'sawtooth', 0.14); beep(120, 0.1, 'square', 0.1); }
function sfxCatch() { beep(1200, 0.1, 'triangle', 0.1); setTimeout(()=>beep(1800,0.12,'triangle',0.1), 90); }
function sfxWin()   { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'triangle',0.1), i*130)); }

// ---------- Состояние сцен ----------
const snames = [
  'Титул',
  'Погоня начинается',
  'Эггман падает',
  'Догоняет!',
  'Победа'
];
const sdur = [200, 360, 400, 380, 320];  // кадры на сцену (~60fps)
let sidx = 0, stime = 0, fc = 0;         // индекс сцены, кадры в сцене, глобальный счётчик
let auto = false;
let particles = [];

function updateLabel() {
  const part = Math.min(sidx + 1, snames.length);
  const label = (part === 1) ? 'Часть 1' : 'Часть ' + part;
  sceneLabel.textContent = label + ' — Сцена ' + (sidx + 1) + '/' + snames.length + ': ' + snames[sidx];
  btnNext.textContent = (sidx >= snames.length - 1) ? '🔄 ЗАНОВО' : 'ДАЛЕЕ →';
}
function restart() {
  sidx = 0; stime = 0; particles.length = 0; updateLabel();
}
function nextS() {
  if (sidx < snames.length - 1) { sidx++; stime = 0; particles.length = 0; updateLabel(); }
  else { restart(); }
}
btnNext.addEventListener('click', () => { initAudio(); nextS(); });
btnAuto.addEventListener('click', () => {
  initAudio();
  auto = !auto;
  btnAuto.classList.toggle('on', auto);
  btnAuto.textContent = auto ? '⏸ Пауза' : '▶ Авто';
});
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') { e.preventDefault(); initAudio(); nextS(); }
});
cv.addEventListener('click', () => { initAudio(); nextS(); });
document.addEventListener('pointerdown', initAudio);
updateLabel();

// ---------- Частицы ----------
function addP(x, y, vx, vy, life, color, size, type) {
  particles.push({ x, y, vx, vy, life, age: 0, color, size, type: type || 'dot', rot: Math.random()*Math.PI*2, vr: (Math.random()-0.5)*0.3 });
}
function puff(x, y, color, count, spread) {
  for (let i = 0; i < count; i++) {
    const a = Math.random()*Math.PI*2, sp = Math.random()*spread + 0.5;
    addP(x, y, Math.cos(a)*sp, Math.sin(a)*sp - Math.random()*1.5, 24 + Math.random()*20, color, Math.random()*5 + 2);
  }
}
function confettiBurst(n) {
  const cols = ['#ffcc00','#ff4757','#2ed573','#1e90ff','#ff6b81','#a29bfe','#ff9ff3'];
  for (let i = 0; i < n; i++) {
    addP(Math.random()*VW, -20, (Math.random()-0.5)*2, Math.random()*2 + 1, 140, cols[i % cols.length], Math.random()*6 + 3, 'rect');
  }
}
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age++;
    p.vy += (p.type === 'dot') ? 0.12 : 0.08;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if (p.age > p.life) particles.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, 1 - p.age / p.life);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.type === 'rect') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size, -p.size*0.5, p.size*2, p.size); ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- Фон ----------
function drawBackdrop(scroll, palette) {
  // небо
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, palette.skyTop);
  g.addColorStop(1, palette.skyBot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, GROUND);
  // солнце
  ctx.fillStyle = palette.sun;
  ctx.beginPath(); ctx.arc(1080, 92, 42, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.arc(1080, 92, 56, 0, Math.PI*2); ctx.fill();
  // облака
  ctx.fillStyle = palette.cloud;
  for (let i = 0; i < 4; i++) {
    const w = 120 + (i % 3) * 40;
    const cx = ((i * 360 - scroll * 0.25) % (VW + 400) + (VW + 400)) % (VW + 400) - 200;
    const cy = 80 + (i * 47) % 140;
    cloud(cx, cy, w);
  }
  // холмы
  ctx.fillStyle = palette.hill;
  ctx.beginPath(); ctx.moveTo(0, GROUND - 10);
  for (let x = 0; x <= VW; x += 8) {
    const h = Math.sin((x + scroll * 0.6) * 0.006) * 40 + Math.sin((x + scroll * 0.6) * 0.013) * 18;
    ctx.lineTo(x, GROUND - 80 + h);
  }
  ctx.lineTo(VW, GROUND - 10); ctx.closePath(); ctx.fill();
  drawGround(scroll);
}
function cloud(x, y, w) {
  ctx.beginPath();
  ctx.arc(x, y, w * 0.16, 0, Math.PI * 2);
  ctx.arc(x + w * 0.18, y - w * 0.12, w * 0.2, 0, Math.PI * 2);
  ctx.arc(x + w * 0.38, y - w * 0.05, w * 0.16, 0, Math.PI * 2);
  ctx.fill();
}
function drawGround(scroll) {
  // трава
  ctx.fillStyle = '#63c53c'; ctx.fillRect(0, GROUND - 18, VW, 18);
  ctx.fillStyle = '#8ae05a'; ctx.fillRect(0, GROUND - 18, VW, 4);
  // земля
  ctx.fillStyle = '#c98d4b'; ctx.fillRect(0, GROUND, VW, VH - GROUND);
  const cs = 42;
  const off = -(scroll % (cs * 2));
  ctx.fillStyle = '#b57a3a';
  for (let x = off; x < VW; x += cs * 2) {
    ctx.fillRect(x, GROUND, cs, cs);
    ctx.fillRect(x + cs, GROUND + cs, cs, cs);
  }
  ctx.fillStyle = '#8a5a2a'; ctx.fillRect(0, GROUND + cs * 2, VW, VH - GROUND - cs * 2);
}
function speedLines(count, speed, alpha) {
  ctx.save();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = 0; i < count; i++) {
    const h = Math.sin(i * 12.9898) * 43758.5453;
    const y = 40 + (h - Math.floor(h)) * (GROUND - 90);
    const raw = (i * 197 - fc * speed) % (VW + 220);
    const px = ((raw + (VW + 220)) % (VW + 220)) - 110;
    const len = 28 + (i % 3) * 26;
    ctx.globalAlpha = alpha * (0.4 + (i % 4) * 0.2);
    ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px + len, y); ctx.stroke();
  }
  ctx.restore();
}

// ---------- Персонажи ----------
// Ёж (Соник / Шэдоу): x — центр, y — линия земли (ноги), s — масштаб, f — кадр, dir — направление
function hedgehog(x, y, s, f, dir, c, shadow) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s * dir, s);
  const bounce = Math.abs(Math.sin(f * 0.5)) * -3;
  ctx.translate(0, bounce);

  // ноги — «колесо» бега
  const lx = 0, ly = -5;
  ctx.fillStyle = c.shoe;
  ctx.beginPath(); ctx.ellipse(lx, ly, 15, 7, 0, 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < 4; i++) {
    const a = f * 0.7 + i * Math.PI / 2;
    ctx.fillStyle = (i % 2) ? '#fff' : c.shoe2;
    ctx.beginPath(); ctx.ellipse(lx + Math.cos(a) * 8, ly + Math.sin(a) * 3, 5, 3.5, a, 0, Math.PI * 2); ctx.fill();
  }
  // торс
  ctx.fillStyle = c.body;
  ctx.save(); ctx.translate(6, -22); ctx.rotate(0.45);
  ctx.beginPath(); ctx.ellipse(0, 0, 17, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // живот
  ctx.fillStyle = c.belly;
  ctx.beginPath(); ctx.ellipse(11, -20, 9, 8, 0.2, 0, Math.PI * 2); ctx.fill();
  // шерсть на груди (Шэдоу)
  if (shadow) {
    ctx.fillStyle = '#e11';
    ctx.beginPath(); ctx.moveTo(14, -24); ctx.lineTo(19, -13); ctx.lineTo(21, -22); ctx.closePath(); ctx.fill();
  }
  // рука
  const armSwing = Math.sin(f * 0.5) * 0.6;
  ctx.save(); ctx.translate(8, -28); ctx.rotate(armSwing);
  ctx.strokeStyle = c.belly; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(10, 10); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(10, 10, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // голова
  ctx.fillStyle = c.body;
  ctx.beginPath(); ctx.arc(2, -46, 18, 0, Math.PI * 2); ctx.fill();
  // иглы (3 назад)
  ctx.fillStyle = c.body;
  ctx.beginPath(); ctx.moveTo(-4, -58); ctx.lineTo(-26, -50); ctx.lineTo(-6, -45); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-8, -62); ctx.lineTo(-28, -63); ctx.lineTo(-7, -54); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-2, -63); ctx.lineTo(-18, -71); ctx.lineTo(-1, -57); ctx.closePath(); ctx.fill();
  // красные кончики игл (Шэдоу)
  if (shadow) {
    ctx.fillStyle = '#e11';
    ctx.beginPath(); ctx.moveTo(-24, -52); ctx.lineTo(-26, -50); ctx.lineTo(-19, -48); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-26, -62); ctx.lineTo(-28, -63); ctx.lineTo(-21, -59); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-16, -69); ctx.lineTo(-18, -71); ctx.lineTo(-10, -64); ctx.closePath(); ctx.fill();
  }
  // морда
  ctx.fillStyle = c.belly;
  ctx.beginPath(); ctx.ellipse(15, -42, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(21, -44, 1.6, 0, Math.PI * 2); ctx.fill();
  // глаз
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(10, -50, 6, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.eye;
  ctx.beginPath(); ctx.arc(12, -50, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(12.5, -50, 1.3, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}
const SONIC = { body: '#2450c8', belly: '#f6cf9a', eye: '#2fae4e', shoe: '#c2261f', shoe2: '#e0382f' };
const SHADOW = { body: '#191919', belly: '#f0e0c8', eye: '#e11', shoe: '#c2261f', shoe2: '#2a2a2a' };

// Доктор Эггман: x — центр, y — земля, s — масштаб, f — кадр, dir — направление
function eggman(x, y, s, f, dir) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s * dir, s);
  const bounce = Math.abs(Math.sin(f * 0.4)) * -2;
  ctx.translate(0, bounce);

  // ноги (вперевалку)
  const legSwing = Math.sin(f * 0.4) * 8;
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-6 + legSwing, -18, 7, 18);
  ctx.fillRect(3 - legSwing, -18, 7, 18);
  ctx.fillStyle = '#444';
  ctx.fillRect(-8 + legSwing, -4, 10, 4);
  ctx.fillRect(1 - legSwing, -4, 10, 4);
  // тело (яйцо): красный верх, чёрный низ
  ctx.fillStyle = '#d23a3a';
  ctx.beginPath(); ctx.ellipse(2, -40, 24, 26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.ellipse(2, -26, 24, 12, 0, 0, Math.PI); ctx.fill();
  // золотая застёжка
  ctx.fillStyle = '#ffd700'; ctx.fillRect(0, -42, 4, 9);
  // рука
  const armSwing = Math.sin(f * 0.4 + Math.PI) * 8;
  ctx.strokeStyle = '#d23a3a'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(2, -48); ctx.lineTo(2 + armSwing, -30); ctx.stroke();
  ctx.fillStyle = '#f4c7a3'; ctx.beginPath(); ctx.arc(2 + armSwing, -30, 4, 0, Math.PI * 2); ctx.fill();
  // голова
  ctx.fillStyle = '#f4c7a3';
  ctx.beginPath(); ctx.arc(6, -66, 12, 0, Math.PI * 2); ctx.fill();
  // очки
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(2, -66); ctx.lineTo(13, -68); ctx.stroke();
  ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(14, -68, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#79c8ff'; ctx.beginPath(); ctx.arc(14, -68, 2.6, 0, Math.PI * 2); ctx.fill();
  // нос
  ctx.fillStyle = '#e88'; ctx.beginPath(); ctx.arc(17, -64, 3, 0, Math.PI * 2); ctx.fill();
  // усы
  ctx.fillStyle = '#c96a2a';
  ctx.beginPath();
  ctx.moveTo(10, -61);
  ctx.quadraticCurveTo(24, -64, 30, -60);
  ctx.quadraticCurveTo(24, -57, 10, -59);
  ctx.closePath(); ctx.fill();

  ctx.restore();
}
// Эггман упал (на спине, ноги вверх)
function eggmanFallen(x, y, s, f) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  const wig = Math.sin(f * 0.3) * 2;
  ctx.fillStyle = '#d23a3a';
  ctx.beginPath(); ctx.ellipse(0, -14, 30, 20, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.ellipse(-2, -10, 28, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f4c7a3';
  ctx.beginPath(); ctx.arc(-28, -22, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c96a2a';
  ctx.beginPath(); ctx.moveTo(-31, -18); ctx.quadraticCurveTo(-44, -20, -48, -14); ctx.quadraticCurveTo(-42, -10, -31, -16); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(-42, -22, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#79c8ff'; ctx.beginPath(); ctx.arc(-42, -22, 2.3, 0, Math.PI * 2); ctx.fill();
  // ноги вверх
  ctx.fillStyle = '#1a1a1a';
  ctx.save(); ctx.translate(14, -28); ctx.rotate(-0.3 + wig * 0.02); ctx.fillRect(-3, -20, 6, 20); ctx.restore();
  ctx.save(); ctx.translate(22, -30); ctx.rotate(0.3 - wig * 0.02); ctx.fillRect(-3, -20, 6, 20); ctx.restore();
  ctx.fillStyle = '#444';
  ctx.fillRect(8, -22, 10, 4);
  ctx.fillRect(18, -22, 10, 4);
  ctx.restore();
}
// Изумруд Хаоса
function emerald(x, y, s, rot, glow) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  if (glow) {
    const gr = ctx.createRadialGradient(0, 0, 4, 0, 0, 30);
    gr.addColorStop(0, 'rgba(90,255,150,0.7)');
    gr.addColorStop(1, 'rgba(90,255,150,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#1fd655';
  ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(11, 0); ctx.lineTo(0, 16); ctx.lineTo(-11, 0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(0, 16); ctx.moveTo(-11, 0); ctx.lineTo(11, 0); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(11, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function ring(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 10, -Math.PI * 0.6, -Math.PI * 0.2); ctx.stroke();
  ctx.restore();
}
function star(x, y, r, color) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = color || '#ffd700';
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = (i % 2 === 0) ? r : r * 0.45;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
// пузырь с речью
function bubble(x, y, w, h, text) {
  ctx.save();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
  const r = 14;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + 22, y + h);
  ctx.lineTo(x + 8, y + h + 14);   // хвостик вниз
  ctx.lineTo(x + 14, y + h);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#111';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const lines = text.split('\n');
  const lh = 24;
  const ty = y + h / 2 - (lines.length - 1) * lh / 2;
  lines.forEach((ln, i) => ctx.fillText(ln, x + 18, ty + i * lh));
  ctx.restore();
}
function shadowText(text, x, y, size, color, align) {
  ctx.save();
  ctx.font = '900 ' + size + 'px system-ui, sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size * 0.16; ctx.strokeStyle = '#111';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
  ctx.restore();
}

// ---------- Сцены ----------
const PAL_DAY = { skyTop: '#3f8fe0', skyBot: '#aee0ff', sun: '#ffe14d', cloud: 'rgba(255,255,255,0.9)', hill: '#7fc46a' };
const PAL_EVE = { skyTop: '#5b3fa8', skyBot: '#f2a65a', sun: '#ffb347', cloud: 'rgba(255,240,220,0.85)', hill: '#6a9a5a' };

function sceneTitle() {
  // тёмный фон
  const g = ctx.createRadialGradient(VW/2, VH/2, 80, VW/2, VH/2, 700);
  g.addColorStop(0, '#24355f'); g.addColorStop(1, '#0a0a14');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  // падающие кольца
  for (let i = 0; i < 12; i++) {
    const yy = ((i * 137 + fc * (2 + (i % 3))) % (VH + 40)) - 20;
    const xx = (i * 211) % VW;
    ring(xx, yy, 1.1 + (i % 3) * 0.4);
  }
  // Соник на титуле
  hedgehog(600, GROUND, 2.6, fc, 1, SONIC, false);
  speedLines(8, 5, 0.5);

  // заголовок
  const a = Math.min(1, stime / 30);
  ctx.save(); ctx.globalAlpha = a;
  shadowText('СОНИК', VW/2, 150, 110, '#2f6bf0');
  shadowText('ПОГОНЯ', VW/2, 265, 90, '#ffcc00');
  ctx.restore();
  const a2 = Math.max(0, Math.min(1, (stime - 40) / 30));
  ctx.save(); ctx.globalAlpha = a2;
  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Сонник догоняет Шэдоу и Доктора Эггмана', VW/2, 360);
  ctx.restore();
  if (stime % 40 < 20) { ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 22px system-ui, sans-serif'; ctx.textAlign='center'; ctx.fillText('Жми «ДАЛЕЕ →» или пробел', VW/2, 470); }
}

function sceneChase() {
  const scroll = fc * 5;
  drawBackdrop(scroll, PAL_DAY);
  speedLines(9, 6, 0.5);

  // пыль из-под ног
  if (fc % 6 === 0) { puff(200, GROUND - 2, 'rgba(200,160,120,0.6)', 2, 1.5); puff(600, GROUND - 2, 'rgba(200,160,120,0.6)', 2, 1.5); puff(920, GROUND - 2, 'rgba(200,160,120,0.6)', 2, 1.5); }

  // Шэдоу держит изумруд
  emerald(640, GROUND - 78, 0.9, fc * 0.05, true);
  hedgehog(600, GROUND, 1.6, fc, 1, SHADOW, true);
  hedgehog(200, GROUND, 1.6, fc, 1, SONIC, false);
  eggman(920, GROUND, 1.8, fc, 1);

  if (stime > 30)  bubble(430, GROUND - 260, 340, 76, 'Беги, Доктор!\nСонник догоняет!');
  if (stime > 150) bubble(700, GROUND - 280, 360, 76, 'Это твоя идея была,\nШэдоу!');
  if (stime > 260) bubble(120, GROUND - 260, 320, 52, 'А ну стойте!\nОтдайте Изумруд!');
}

function sceneFall() {
  const scroll = fc * 3;
  drawBackdrop(scroll, PAL_EVE);
  speedLines(6, 4, 0.4);

  const fallStart = 70;
  const falling = stime > fallStart;
  if (falling && stime < fallStart + 6) { sfxBonk(); }

  // камень, об который спотыкается Эггман
  ctx.fillStyle = '#7a6a55';
  ctx.beginPath(); ctx.ellipse(920, GROUND - 10, 26, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#8d7a62';
  ctx.beginPath(); ctx.ellipse(912, GROUND - 16, 12, 8, 0, 0, Math.PI * 2); ctx.fill();

  // Эггман падает
  if (!falling) {
    eggman(920, GROUND, 1.8, fc, 1);
  } else {
    const t = stime - fallStart;
    if (t < 8) { // наклон вперёд
      ctx.save(); ctx.translate(920, GROUND); ctx.rotate(-0.5 * (t / 8)); eggman(0, 0, 1.8, fc, 1); ctx.restore();
      puff(920, GROUND - 2, 'rgba(200,160,120,0.7)', 6, 2.5);
    } else {
      eggmanFallen(920, GROUND - 6, 1.8, fc);
      if (t === 8) puff(920, GROUND - 4, 'rgba(200,160,120,0.8)', 12, 3);
    }
  }

  // Шэдоу убегает вперёд и оглядывается
  hedgehog(620, GROUND, 1.6, fc, 1, SHADOW, true);
  // Соник нагоняет
  const sx = falling ? 320 : 200;
  hedgehog(sx, GROUND, 1.6, fc, 1, SONIC, false);
  if (fc % 6 === 0) puff(sx, GROUND - 2, 'rgba(200,160,120,0.6)', 2, 1.5);

  if (stime > 20 && !falling) bubble(700, GROUND - 260, 320, 52, 'Сейчас я вас\nдогоню... упс!');
  if (stime > fallStart + 10) bubble(760, GROUND - 260, 340, 52, 'А-а-а! Мои ножки!');
  if (stime > 200) bubble(450, GROUND - 260, 300, 52, 'Доктор! Вставай!');
  if (stime > 300) bubble(180, GROUND - 260, 320, 52, 'Попался, Эггман!');
}

function sceneCatch() {
  const scroll = fc * 2;
  drawBackdrop(scroll, PAL_DAY);

  // Эггман всё ещё лежит
  eggmanFallen(980, GROUND - 6, 1.7, fc);
  // звёздочки над головой Эггмана
  for (let i = 0; i < 3; i++) {
    const a = fc * 0.1 + i * Math.PI * 2 / 3;
    star(980 + Math.cos(a) * 34, GROUND - 78 + Math.sin(a) * 14, 8, '#ffd700');
  }

  const catchStart = 60, catchEnd = 130;
  // Соник прыгает за изумрудом
  let sonicY = GROUND, emX = 640, emY = GROUND - 80, emHeld = 'shadow';
  if (stime >= catchStart && stime <= catchEnd) {
    const t = stime - catchStart, pr = t / (catchEnd - catchStart);
    sonicY = GROUND - Math.sin(pr * Math.PI) * 60;
    emX = 640 + (470 - 640) * pr;
    emY = GROUND - 80 - Math.sin(pr * Math.PI) * 90;
    emHeld = 'fly';
  } else if (stime > catchEnd) {
    sonicY = GROUND; emX = 470; emY = GROUND - 130; emHeld = 'sonic';
    if (stime === catchEnd + 1) { sfxCatch(); puff(470, GROUND - 120, 'rgba(120,255,170,0.9)', 16, 3); }
  }

  // Шэдоу
  hedgehog(640, GROUND, 1.6, fc, 1, SHADOW, true);
  // Соник
  hedgehog(470, sonicY, 1.6, fc, 1, SONIC, false);
  // изумруд
  if (emHeld === 'fly') emerald(emX, emY, 1, fc * 0.3, true);
  else if (emHeld === 'shadow') emerald(668, GROUND - 78, 0.9, fc * 0.05, true);
  else { emerald(emX, emY, 1.1, -0.3, true); if (fc % 8 < 4) star(emX - 18, emY - 10, 7); }

  if (stime > 12 && stime < catchStart) bubble(500, GROUND - 260, 320, 52, 'Этот изумруд — мой!');
  if (stime > catchEnd + 6 && stime < 260) bubble(300, GROUND - 300, 340, 52, 'Изумруд Хаоса — мой!');
  if (stime > 200) bubble(820, GROUND - 220, 300, 52, 'Я всё ещё\nлежу здесь...');
  if (stime > 280) bubble(540, GROUND - 300, 300, 52, 'Ну всё, я ухожу.');
}

function sceneFinale() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#ffd700'); g.addColorStop(0.55, '#ff8c00'); g.addColorStop(1, '#ff4500');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  // лучи
  ctx.save(); ctx.globalAlpha = 0.15; ctx.fillStyle = '#fff';
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6 + fc * 0.005;
    ctx.beginPath();
    ctx.moveTo(VW/2, 220);
    ctx.arc(VW/2, 220, 700, a, a + 0.08);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  if (fc % 5 === 0) confettiBurst(3);
  drawParticles();

  // победный Соник с изумрудом
  ctx.save(); ctx.translate(0, -Math.sin(fc * 0.08) * 6);
  hedgehog(600, GROUND, 2.1, fc, 1, SONIC, false);
  emerald(640, GROUND - 150, 1.3, -0.3, true);
  ctx.restore();
  if (fc % 8 < 4) { star(640, GROUND - 190, 9); star(640, GROUND - 120, 6); }

  // Шэдоу обиделся
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath(); ctx.ellipse(250, GROUND, 55, 12, 0, 0, Math.PI * 2); ctx.fill();
  hedgehog(250, GROUND, 1.5, fc, -1, SHADOW, true);
  bubble(120, GROUND - 250, 260, 48, 'Хмф.');

  // Эггман лежит
  eggmanFallen(920, GROUND - 6, 1.7, fc);
  for (let i = 0; i < 3; i++) {
    const a = fc * 0.1 + i * Math.PI * 2 / 3;
    star(920 + Math.cos(a) * 34, GROUND - 78 + Math.sin(a) * 14, 8);
  }

  shadowText('КОНЕЦ', VW/2, 120, 80, '#fff');
  shadowText('Сонник победил!', VW/2, 205, 42, '#fff');
}

// ---------- Главный цикл ----------
function drawScene() {
  switch (sidx) {
    case 0: sceneTitle(); break;
    case 1: sceneChase(); break;
    case 2: sceneFall(); break;
    case 3: sceneCatch(); break;
    case 4: sceneFinale(); break;
  }
  drawParticles();
}

function loop() {
  drawScene();
  updateParticles();
  stime++;
  fc++;
  if (auto && stime > sdur[sidx]) nextS();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
