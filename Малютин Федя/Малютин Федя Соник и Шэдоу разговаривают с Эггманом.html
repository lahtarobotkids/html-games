<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 Соник и Шэдоу разговаривают с Эггманом</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000022;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: none;
        }
        canvas {
            display: block;
            background: radial-gradient(ellipse at center, #1a1a4a 0%, #0a0a2a 100%);
            border-radius: 20px;
            box-shadow: 0 0 80px rgba(150, 150, 255, 0.6);
        }
        .info {
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: #aaa;
            font-size: 14px;
            text-shadow: 0 0 10px #666;
            pointer-events: none;
            letter-spacing: 1px;
        }
        .dialogue-box {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 15px 25px;
            color: #fff;
            font-size: 18px;
            text-align: center;
            pointer-events: none;
            max-width: 80%;
            z-index: 100;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            transition: opacity 0.3s;
        }
        .speaker-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
            display: block;
        }
        .sonic-name { color: #4fc3f7; }
        .shadow-name { color: #ff5252; }
        .eggman-name { color: #ffcc99; }
    </style>
</head>
<body>
    <canvas id="sonicCanvas"></canvas>
    <div class="info">💬 Разговор Соника и Шэдоу с доктором Эггманом</div>
    <div class="dialogue-box" id="dialogueBox">
        <span class="speaker-name sonic-name" id="speakerName">Соник:</span>
        <span id="dialogueText">Эггман, остановись!</span>
    </div>
    <script>
        const canvas = document.getElementById('sonicCanvas');
        const ctx = canvas.getContext('2d');
        const dialogueBox = document.getElementById('dialogueBox');
        const speakerName = document.getElementById('speakerName');
        const dialogueText = document.getElementById('dialogueText');

        // Подгоняем размер canvas под окно
        function resizeCanvas() {
            canvas.width = window.innerWidth * 0.95;
            canvas.height = window.innerHeight * 0.85;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Звезды (фон)
        const stars = [];
        for (let i = 0; i < 400; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.5 + 0.5,
                alpha: Math.random() * 0.9 + 0.1,
                speed: Math.random() * 0.3 + 0.05,
                twinkleSpeed: Math.random() * 0.03 + 0.005,
                phase: Math.random() * Math.PI * 2
            });
        }

        // Диалоги
        const dialogues = [
            { speaker: 'Соник', text: 'Эггман, остановись! Мы хотим поговорить!', color: 'sonic-name' },
            { speaker: 'Шэдоу', text: 'Хватит убегать. Нам нужно обсудить кое-что важное.', color: 'shadow-name' },
            { speaker: 'Эггман', text: 'Что вам нужно? Я просто хотел захватить мир...', color: 'eggman-name' },
            { speaker: 'Соник', text: 'Зачем тебе захватывать мир? Ты же умный ученый!', color: 'sonic-name' },
            { speaker: 'Эггман', text: 'Я... я просто хотел, чтобы меня уважали...', color: 'eggman-name' },
            { speaker: 'Шэдоу', text: 'Уважение нельзя захватить. Его нужно заслужить.', color: 'shadow-name' },
            { speaker: 'Соник', text: 'Давай работать вместе! Ты можешь использовать свои изобретения для добра!', color: 'sonic-name' },
            { speaker: 'Эггман', text: 'Вы правда так думаете? Я могу измениться?', color: 'eggman-name' },
            { speaker: 'Соник', text: 'Конечно! Мы поможем тебе!', color: 'sonic-name' },
            { speaker: 'Шэдоу', text: 'Вместе мы сможем сделать мир лучше.', color: 'shadow-name' },
            { speaker: 'Эггман', text: 'Спасибо, друзья! Я обещаю исправиться!', color: 'eggman-name' },
            { speaker: 'Все вместе', text: 'Ура! Мы теперь друзья! 🎉', color: 'sonic-name' }
        ];

        let currentDialogue = 0;
        let dialogueTimer = 0;
        const dialogueInterval = 250; // Каждые 4 секунды новый диалог

        // Класс корабля Эггмана
        class EggmanShip {
            constructor() {
                this.x = canvas.width * 0.5;
                this.y = canvas.height * 0.35;
                this.width = 180;
                this.height = 100;
                this.wobble = 0;
                this.caught = true;
                this.eggmanHappy = false;
                this.eggmanSad = true;
                this.eggmanTalking = false;
                this.blinkTimer = 0;
                this.isBlinking = false;
                this.enginePhase = 0;
                this.talkingPhase = 0;
            }

            draw() {
                this.wobble += 0.03;
                this.enginePhase += 0.1;
                
                // Проверяем моргание
                if (this.blinkTimer <= 0) {
                    if (Math.random() < 0.02) {
                        this.isBlinking = true;
                        this.blinkTimer = 10;
                    }
                } else {
                    this.blinkTimer--;
                    if (this.blinkTimer === 0) {
                        this.isBlinking = false;
                    }
                }

                // Определяем, кто говорит
                if (currentDialogue < dialogues.length) {
                    if (dialogues[currentDialogue].speaker === 'Эггман' || dialogues[currentDialogue].speaker === 'Все вместе') {
                        this.eggmanTalking = true;
                        this.talkingPhase += 0.2;
                    } else {
                        this.eggmanTalking = false;
                    }
                    
                    // Эггман становится счастливым к концу разговора
                    if (currentDialogue >= 10) {
                        this.eggmanHappy = true;
                        this.eggmanSad = false;
                    } else if (currentDialogue >= 5) {
                        this.eggmanHappy = false;
                        this.eggmanSad = false;
                    } else {
                        this.eggmanHappy = false;
                        this.eggmanSad = true;
                    }
                }

                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Легкое покачивание
                const bobY = Math.sin(this.wobble) * 3;
                ctx.translate(0, bobY);

                // Корпус корабля
                const shipGrad = ctx.createLinearGradient(0, -50, 0, 50);
                shipGrad.addColorStop(0, '#c0c0c0');
                shipGrad.addColorStop(0.3, '#e0e0e0');
                shipGrad.addColorStop(0.7, '#a0a0a0');
                shipGrad.addColorStop(1, '#808080');
                ctx.fillStyle = shipGrad;
                ctx.beginPath();
                ctx.moveTo(-80, 0);
                ctx.quadraticCurveTo(-100, -35, -70, -55);
                ctx.quadraticCurveTo(0, -75, 70, -55);
                ctx.quadraticCurveTo(100, -35, 80, 0);
                ctx.quadraticCurveTo(100, 35, 70, 55);
                ctx.quadraticCurveTo(0, 75, -70, 55);
                ctx.quadraticCurveTo(-100, 35, -80, 0);
                ctx.fill();
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Нос корабля
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.moveTo(70, -55);
                ctx.quadraticCurveTo(120, 0, 70, 55);
                ctx.fill();
                ctx.strokeStyle = '#cc0000';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Окно кабины
                ctx.beginPath();
                ctx.ellipse(15, -20, 28, 22, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#1a1a3a';
                ctx.fill();
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Блик на окне
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.ellipse(8, -28, 8, 5, -0.3, 0, Math.PI * 2);
                ctx.fill();

                // Эггман в кабине
                this.drawEggmanInCockpit();

                // Двигатели
                const engineFlame = 20 + Math.sin(this.enginePhase) * 10;
                
                // Верхний двигатель
                ctx.fillStyle = '#666';
                ctx.beginPath();
                ctx.roundRect(-90, -45, 15, 25, 4);
                ctx.fill();
                ctx.fillStyle = '#ff6600';
                ctx.beginPath();
                ctx.moveTo(-90, -45);
                ctx.lineTo(-90 - engineFlame, -32);
                ctx.lineTo(-90, -20);
                ctx.fill();
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.moveTo(-90, -40);
                ctx.lineTo(-90 - engineFlame * 0.5, -32);
                ctx.lineTo(-90, -25);
                ctx.fill();
                
                // Нижний двигатель
                ctx.fillStyle = '#666';
                ctx.beginPath();
                ctx.roundRect(-90, 20, 15, 25, 4);
                ctx.fill();
                ctx.fillStyle = '#ff6600';
                ctx.beginPath();
                ctx.moveTo(-90, 20);
                ctx.lineTo(-90 - engineFlame, 32);
                ctx.lineTo(-90, 45);
                ctx.fill();
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.moveTo(-90, 25);
                ctx.lineTo(-90 - engineFlame * 0.5, 32);
                ctx.lineTo(-90, 40);
                ctx.fill();

                // Антенна
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(40, -70);
                ctx.lineTo(50, -85);
                ctx.stroke();
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(50, -85, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            drawEggmanInCockpit() {
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(15, -20, 24, 18, 0, 0, Math.PI * 2);
                ctx.clip();
                
                // Фон кабины
                ctx.fillStyle = '#1a1a3a';
                ctx.fillRect(-15, -40, 55, 40);
                
                // Тело Эггмана
                ctx.fillStyle = '#cc0000';
                ctx.beginPath();
                ctx.ellipse(15, -8, 13, 15, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Голова
                ctx.fillStyle = '#ffcc99';
                ctx.beginPath();
                ctx.arc(15, -20, 11, 0, Math.PI * 2);
                ctx.fill();
                
                // Усы
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.moveTo(5, -18);
                ctx.quadraticCurveTo(-5, -16, -8, -10);
                ctx.lineTo(5, -13);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(25, -18);
                ctx.quadraticCurveTo(35, -16, 38, -10);
                ctx.lineTo(25, -13);
                ctx.fill();
                
                // Очки
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(10, -22, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(22, -22, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // Глаза
                if (this.isBlinking) {
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(8, -22);
                    ctx.lineTo(12, -22);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(20, -22);
                    ctx.lineTo(24, -22);
                    ctx.stroke();
                } else {
                    if (this.eggmanHappy) {
                        // Счастливые глаза (дуги)
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(10, -21, 3, Math.PI + 0.3, -0.3);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(22, -21, 3, Math.PI + 0.3, -0.3);
                        ctx.stroke();
                    } else if (this.eggmanSad) {
                        // Грустные глаза
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(10, -20, 3, 0.3, Math.PI - 0.3);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(22, -20, 3, 0.3, Math.PI - 0.3);
                        ctx.stroke();
                    } else {
                        // Обычные глаза
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(10, -22, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(22, -22, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(10, -22, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(22, -22, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                
                // Нос
                ctx.fillStyle = '#ff9999';
                ctx.beginPath();
                ctx.arc(16, -18, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Рот
                if (this.eggmanTalking) {
                    // Говорящий рот
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.ellipse(16, -13, 4, 3 + Math.sin(this.talkingPhase) * 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff6666';
                    ctx.beginPath();
                    ctx.ellipse(16, -12, 3, 2 + Math.sin(this.talkingPhase) * 1.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.eggmanHappy) {
                    // Счастливая улыбка
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(16, -14, 5, 0.2, Math.PI - 0.3);
                    ctx.stroke();
                } else if (this.eggmanSad) {
                    // Грустный рот
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(16, -12, 4, Math.PI + 0.3, -0.3);
                    ctx.stroke();
                } else {
                    // Нейтральный рот
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(12, -14);
                    ctx.lineTo(20, -14);
                    ctx.stroke();
                }
                
                ctx.restore();
            }
        }

        // Класс Соника
        class Sonic {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 50;
                this.wobble = 0;
                this.blinkTimer = 0;
                this.isBlinking = false;
                this.talking = false;
                this.talkingPhase = 0;
                this.happy = false;
            }

            draw() {
                this.wobble += 0.05;
                
                // Проверяем моргание
                if (this.blinkTimer <= 0) {
                    if (Math.random() < 0.02) {
                        this.isBlinking = true;
                        this.blinkTimer = 10;
                    }
                } else {
                    this.blinkTimer--;
                    if (this.blinkTimer === 0) {
                        this.isBlinking = false;
                    }
                }

                // Определяем, говорит ли Соник
                if (currentDialogue < dialogues.length) {
                    if (dialogues[currentDialogue].speaker === 'Соник' || dialogues[currentDialogue].speaker === 'Все вместе') {
                        this.talking = true;
                        this.talkingPhase += 0.2;
                    } else {
                        this.talking = false;
                    }
                    
                    // Соник счастлив к концу
                    this.happy = currentDialogue >= 10;
                }

                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Легкое покачивание
                const bobY = Math.sin(this.wobble) * 2;
                ctx.translate(0, bobY);

                // Ноги
                ctx.fillStyle = '#C0C0C0';
                ctx.beginPath();
                ctx.ellipse(-12, 33, 8, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(12, 33, 8, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Тело
                const bodyGrad = ctx.createLinearGradient(-20, 0, 20, 0);
                bodyGrad.addColorStop(0, '#1E90FF');
                bodyGrad.addColorStop(0.5, '#4169E1');
                bodyGrad.addColorStop(1, '#1E90FF');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.ellipse(0, 0, 22, 25, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000080';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Живот
                ctx.fillStyle = '#F5DEB3';
                ctx.beginPath();
                ctx.ellipse(0, 7, 15, 15, 0, 0, Math.PI * 2);
                ctx.fill();

                // Голова
                ctx.fillStyle = '#4169E1';
                ctx.beginPath();
                ctx.arc(0, -25, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000080';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Мордочка
                ctx.fillStyle = '#F5DEB3';
                ctx.beginPath();
                ctx.ellipse(7, -18, 13, 10, 0.1, 0, Math.PI * 2);
                ctx.fill();

                // Иголки
                ctx.fillStyle = '#00008B';
                ctx.strokeStyle = '#000066';
                ctx.lineWidth = 1;
                for (let i = -2; i <= 2; i++) {
                    ctx.beginPath();
                    const angle = -Math.PI / 2 + i * 0.35;
                    const startX = Math.cos(angle) * 18;
                    const startY = Math.sin(angle) * 18 - 25;
                    const endX = Math.cos(angle) * 42;
                    const endY = Math.sin(angle) * 42 - 25;
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(startX - 3, startY);
                    ctx.lineTo(endX, endY);
                    ctx.lineTo(startX + 3, startY);
                    ctx.fill();
                }
                ctx.beginPath();
                ctx.moveTo(-3, -38);
                ctx.lineTo(0, -58);
                ctx.lineTo(3, -38);
                ctx.fill();

                // Уши
                ctx.fillStyle = '#4169E1';
                ctx.beginPath();
                ctx.moveTo(-10, -36);
                ctx.lineTo(-17, -46);
                ctx.lineTo(-3, -40);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(10, -36);
                ctx.lineTo(17, -46);
                ctx.lineTo(3, -40);
                ctx.fill();
                ctx.fillStyle = '#F5DEB3';
                ctx.beginPath();
                ctx.moveTo(-9, -37);
                ctx.lineTo(-13, -42);
                ctx.lineTo(-5, -39);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(9, -37);
                ctx.lineTo(13, -42);
                ctx.lineTo(5, -39);
                ctx.fill();

                // Глаза
                if (this.isBlinking) {
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-1, -25);
                    ctx.lineTo(5, -25);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(9, -25);
                    ctx.lineTo(15, -25);
                    ctx.stroke();
                } else {
                    if (this.happy) {
                        // Счастливые глаза (дуги)
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(2, -25, 5, Math.PI + 0.3, -0.3);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(12, -25, 5, Math.PI + 0.3, -0.3);
                        ctx.stroke();
                    } else {
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.ellipse(2, -27, 5, 7, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.ellipse(12, -27, 5, 7, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#00FF00';
                        ctx.beginPath();
                        ctx.arc(3, -27, 3.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(13, -27, 3.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(4, -27, 1.8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(14, -27, 1.8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(3, -29, 0.8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(13, -29, 0.8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Нос
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.ellipse(17, -21, 2.5, 1.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Рот
                if (this.talking) {
                    // Говорящий рот
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.ellipse(15, -16, 4, 3 + Math.sin(this.talkingPhase) * 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff6666';
                    ctx.beginPath();
                    ctx.ellipse(15, -15, 3, 2 + Math.sin(this.talkingPhase) * 1.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.happy) {
                    // Широкая улыбка
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(15, -17, 7, 0.2, Math.PI - 0.3);
                    ctx.stroke();
                } else {
                    // Обычная улыбка
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(15, -17, 5, 0.2, Math.PI - 0.5);
                    ctx.stroke();
                }

                // Руки
                ctx.fillStyle = '#C0C0C0';
                ctx.beginPath();
                ctx.ellipse(-12, -5, 6, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(12, -5, 6, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                // Кроссовки
                ctx.fillStyle = '#FF0000';
                ctx.beginPath();
                ctx.ellipse(-12, 35, 7, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(12, 35, 7, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(-12, 33, 4, 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(12, 33, 4, 2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // Класс Шэдоу
        class Shadow {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 50;
                this.wobble = 0;
                this.blinkTimer = 0;
                this.isBlinking = false;
                this.talking = false;
                this.talkingPhase = 0;
                this.happy = false;
            }

            draw() {
                this.wobble += 0.05;
                
                // Проверяем моргание
                if (this.blinkTimer <= 0) {
                    if (Math.random() < 0.02) {
                        this.isBlinking = true;
                        this.blinkTimer = 10;
                    }
                } else {
                    this.blinkTimer--;
                    if (this.blinkTimer === 0) {
                        this.isBlinking = false;
                    }
                }

                // Определяем, говорит ли Шэдоу
                if (currentDialogue < dialogues.length) {
                    if (dialogues[currentDialogue].speaker === 'Шэдоу' || dialogues[currentDialogue].speaker === 'Все вместе') {
                        this.talking = true;
                        this.talkingPhase += 0.2;
                    } else {
                        this.talking = false;
                    }
                    
                    // Шэдоу счастлив к концу
                    this.happy = currentDialogue >= 10;
                }

                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Легкое покачивание
                const bobY = Math.sin(this.wobble + 1) * 2;
                ctx.translate(0, bobY);

                // Ноги
                ctx.fillStyle = '#808080';
                ctx.beginPath();
                ctx.ellipse(-12, 33, 8, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(12, 33, 8, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Тело
                const bodyGrad = ctx.createLinearGradient(-20, 0, 20, 0);
                bodyGrad.addColorStop(0, '#303030');
                bodyGrad.addColorStop(0.5, '#505050');
                bodyGrad.addColorStop(1, '#303030');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.ellipse(0, 0, 22, 25, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Грудь
                ctx.fillStyle = '#E8E8E8';
                ctx.beginPath();
                ctx.ellipse(0, 7, 15, 15, 0, 0, Math.PI * 2);
                ctx.fill();

                // Голова
                ctx.fillStyle = '#404040';
                ctx.beginPath();
                ctx.arc(0, -25, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Мордочка
                ctx.fillStyle = '#E8E8E8';
                ctx.beginPath();
                ctx.ellipse(7, -18, 13, 10, 0.1, 0, Math.PI * 2);
                ctx.fill();

                // Иголки
                ctx.fillStyle = '#1a1a1a';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                for (let i = -2; i <= 2; i++) {
                    ctx.beginPath();
                    const angle = -Math.PI / 2 + i * 0.35;
                    const startX = Math.cos(angle) * 18;
                    const startY = Math.sin(angle) * 18 - 25;
                    const endX = Math.cos(angle) * 42;
                    const endY = Math.sin(angle) * 42 - 25;
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(startX - 3, startY);
                    ctx.lineTo(endX, endY);
                    ctx.lineTo(startX + 3, startY);
                    ctx.fill();
                }
                ctx.beginPath();
                ctx.moveTo(-3, -38);
                ctx.lineTo(0, -58);
                ctx.lineTo(3, -38);
                ctx.fill();

                // Уши
                ctx.fillStyle = '#404040';
                ctx.beginPath();
                ctx.moveTo(-10, -36);
                ctx.lineTo(-17, -46);
                ctx.lineTo(-3, -40);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(10, -36);
                ctx.lineTo(17, -46);
                ctx.lineTo(3, -40);
                ctx.fill();
                ctx.fillStyle = '#E8E8E8';
                ctx.beginPath();
                ctx.moveTo(-9, -37);
                ctx.lineTo(-13, -42);
                ctx.lineTo(-5, -39);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(9, -37);
                ctx.lineTo(13, -42);
                ctx.lineTo(5, -39);
                ctx.fill();

                // Глаза
                if (this.isBlinking) {
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-1, -25);
                    ctx.lineTo(5, -25);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(9, -25);
                    ctx.lineTo(15, -25);
                    ctx.stroke();
                } else {
                    if (this.happy) {
                        // Счастливые глаза (дуги)
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(2, -25, 5, Math.PI + 0.3, -0.3);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(12, -25, 5, Math.PI + 0.3, -0.3);
                        ctx.stroke();
                    } else {
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.ellipse(2, -27, 5, 7, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.ellipse(12, -27, 5, 7, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#FF0000';
                        ctx.beginPath();
                        ctx.arc(3, -27, 3.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(13, -27, 3.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(4, -27, 1.8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(14, -27, 1.8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(3, -29, 0.8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(13, -29, 0.8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Нос
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.ellipse(17, -21, 2.5, 1.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Рот
                if (this.talking) {
                    // Говорящий рот
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.ellipse(15, -16, 4, 3 + Math.sin(this.talkingPhase) * 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff6666';
                    ctx.beginPath();
                    ctx.ellipse(15, -15, 3, 2 + Math.sin(this.talkingPhase) * 1.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.happy) {
                    // Улыбка
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(15, -17, 6, 0.2, Math.PI - 0.3);
                    ctx.stroke();
                } else {
                    // Серьезный рот
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(13, -17);
                    ctx.lineTo(18, -17);
                    ctx.stroke();
                }

                // Руки
                ctx.fillStyle = '#808080';
                ctx.beginPath();
                ctx.ellipse(-12, -5, 6, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(12, -5, 6, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                // Кроссовки
                ctx.fillStyle = '#FF0000';
                ctx.beginPath();
                ctx.ellipse(-12, 35, 7, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(12, 35, 7, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(-12, 33, 4, 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(12, 33, 4, 2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // Создаем объекты
        const ship = new EggmanShip();
        const sonic = new Sonic(canvas.width * 0.25, canvas.height * 0.65);
        const shadow = new Shadow(canvas.width * 0.15, canvas.height * 0.75);

        // Функция обновления диалога
        function updateDialogue() {
            dialogueTimer++;
            
            if (dialogueTimer >= dialogueInterval) {
                dialogueTimer = 0;
                
                if (currentDialogue < dialogues.length) {
                    const dialogue = dialogues[currentDialogue];
                    speakerName.textContent = dialogue.speaker + ':';
                    speakerName.className = 'speaker-name ' + dialogue.color;
                    dialogueText.textContent = dialogue.text;
                    currentDialogue++;
                } else {
                    // Диалог завершен, показываем финальное сообщение
                    dialogueBox.style.opacity = '1';
                    speakerName.textContent = 'Все вместе:';
                    speakerName.className = 'speaker-name sonic-name';
                    dialogueText.textContent = 'Мы теперь друзья! 🎉';
                }
            }
        }

        // Функция рисования фона
        function drawBackground() {
            // Звезды
            stars.forEach(star => {
                star.phase += star.twinkleSpeed;
                const alpha = star.alpha * (0.7 + 0.3 * Math.sin(star.phase));
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
                star.x -= star.speed * 0.1;
                if (star.x < -5) {
                    star.x = canvas.width + 5;
                    star.y = Math.random() * canvas.height;
                }
            });

            // Космические облака
            ctx.globalAlpha = 0.05;
            for (let i = 0; i < 3; i++) {
                const cloudX = canvas.width * (0.2 + i * 0.3);
                const cloudY = canvas.height * (0.3 + i * 0.2);
                const cloudGrad = ctx.createRadialGradient(cloudX, cloudY, 20, cloudX, cloudY, 200);
                cloudGrad.addColorStop(0, '#9370DB');
                cloudGrad.addColorStop(0.5, '#6A5ACD');
                cloudGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = cloudGrad;
                ctx.fillRect(cloudX - 200, cloudY - 200, 400, 400);
            }
            ctx.globalAlpha = 1;
        }

        // Частицы
        const particles = [];
        for (let i = 0; i < 20; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 0.5,
                alpha: Math.random() * 0.5 + 0.2,
                speedX: Math.random() * 0.5 - 0.25,
                speedY: Math.random() * 0.5 - 0.25,
                phase: Math.random() * Math.PI * 2
            });
        }

        function drawParticles() {
            particles.forEach(particle => {
                particle.phase += 0.02;
                particle.x += particle.speedX;
                particle.y += particle.speedY;
                
                if (particle.x < 0) particle.x = canvas.width;
                if (particle.x > canvas.width) particle.x = 0;
                if (particle.y < 0) particle.y = canvas.height;
                if (particle.y > canvas.height) particle.y = 0;
                
                const alpha = particle.alpha * (0.5 + 0.5 * Math.sin(particle.phase));
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 150, ${alpha})`;
                ctx.fill();
            });
        }

        // Главный цикл анимации
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем фон
            drawBackground();
            
            // Рисуем частицы
            drawParticles();
            
            // Обновляем диалог
            updateDialogue();
            
            // Рисуем корабль
            ship.draw();
            
            // Рисуем Соника
            sonic.draw();
            
            // Рисуем Шэдоу
            shadow.draw();

            requestAnimationFrame(animate);
        }

        // Запускаем анимацию
        animate();

        // Полифилл для roundRect
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                this.beginPath();
                this.moveTo(x + r.tl, y);
                this.lineTo(x + w - r.tr, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                this.lineTo(x + w, y + h - r.br);
                this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                this.lineTo(x + r.bl, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                this.lineTo(x, y + r.tl);
                this.quadraticCurveTo(x, y, x + r.tl, y);
                this.closePath();
                return this;
            };
        }
    </script>
