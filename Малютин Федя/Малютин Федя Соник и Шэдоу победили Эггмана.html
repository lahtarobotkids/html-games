<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤝 Соник и Шэдоу победили Эггмана</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000022;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: none;
        }
        canvas {
            display: block;
            background: radial-gradient(ellipse at center, #1a1a4a 0%, #0a0a2a 100%);
            border-radius: 20px;
            box-shadow: 0 0 80px rgba(150, 150, 255, 0.6);
        }
        .info {
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: #aaa;
            font-size: 14px;
            text-shadow: 0 0 10px #666;
            pointer-events: none;
            letter-spacing: 1px;
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd700;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 30px #ff6600, 0 0 60px #ff3300;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="sonicCanvas"></canvas>
    <div class="info">🤝 Соник и Шэдоу - друзья! Победа над Эггманом! 🏆</div>
    <div class="message" id="victoryMessage">🎉 ПОБЕДА! 🎉</div>
    <script>
        const canvas = document.getElementById('sonicCanvas');
        const ctx = canvas.getContext('2d');
        const victoryMessage = document.getElementById('victoryMessage');

        // Подгоняем размер canvas под окно
        function resizeCanvas() {
            canvas.width = window.innerWidth * 0.95;
            canvas.height = window.innerHeight * 0.85;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Звезды (фон)
        const stars = [];
        for (let i = 0; i < 400; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.5 + 0.5,
                alpha: Math.random() * 0.9 + 0.1,
                speed: Math.random() * 0.3 + 0.05,
                twinkleSpeed: Math.random() * 0.03 + 0.005,
                phase: Math.random() * Math.PI * 2
            });
        }

        // Класс доктора Эггмана
        class Eggman {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 70;
                this.wobble = 0;
                this.defeated = false;
                this.defeatTimer = 0;
                this.blinkTimer = 0;
                this.isBlinking = false;
                this.flyingPhase = 0;
            }

            draw() {
                this.wobble += 0.05;
                this.flyingPhase += 0.1;
                
                if (this.defeated) {
                    this.defeatTimer++;
                }

                // Проверяем моргание
                if (this.blinkTimer <= 0) {
                    if (Math.random() < 0.02) {
                        this.isBlinking = true;
                        this.blinkTimer = 10;
                    }
                } else {
                    this.blinkTimer--;
                    if (this.blinkTimer === 0) {
                        this.isBlinking = false;
                    }
                }

                ctx.save();
                ctx.translate(this.x, this.y);
                
                if (this.defeated) {
                    // Анимация поражения - Эггман падает
                    const fallY = Math.min(this.defeatTimer * 3, 200);
                    ctx.translate(0, fallY);
                    ctx.rotate(Math.sin(this.defeatTimer * 0.1) * 0.1);
                } else {
                    // Летающая анимация
                    const flyY = Math.sin(this.flyingPhase) * 20;
                    ctx.translate(0, flyY);
                }

                // Летающий аппарат Эггмана
                ctx.fillStyle = '#808080';
                ctx.beginPath();
                ctx.ellipse(0, 30, 35, 20, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#404040';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Огонь из аппарата
                if (!this.defeated) {
                    const flameLen = 20 + Math.random() * 20;
                    ctx.fillStyle = '#ff6600';
                    ctx.beginPath();
                    ctx.moveTo(-15, 45);
                    ctx.lineTo(0, 45 + flameLen);
                    ctx.lineTo(15, 45);
                    ctx.fill();
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath();
                    ctx.moveTo(-8, 45);
                    ctx.lineTo(0, 45 + flameLen * 0.6);
                    ctx.lineTo(8, 45);
                    ctx.fill();
                }

                // Тело Эггмана
                const bodyGrad = ctx.createLinearGradient(-25, 0, 25, 0);
                bodyGrad.addColorStop(0, '#cc0000');
                bodyGrad.addColorStop(0.5, '#ff0000');
                bodyGrad.addColorStop(1, '#cc0000');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.ellipse(0, 0, 30, 35, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#800000';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Живот
                ctx.fillStyle = '#ffcccc';
                ctx.beginPath();
                ctx.ellipse(0, 10, 20, 22, 0, 0, Math.PI * 2);
                ctx.fill();

                // Голова
                ctx.fillStyle = '#ffcc99';
                ctx.beginPath();
                ctx.arc(0, -30, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#cc9966';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Лысина
                ctx.fillStyle = '#ffcc99';
                ctx.beginPath();
                ctx.arc(0, -35, 18, Math.PI, 0);
                ctx.fill();

                // Усы
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.moveTo(-15, -25);
                ctx.quadraticCurveTo(-30, -20, -35, -10);
                ctx.lineTo(-15, -15);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(15, -25);
                ctx.quadraticCurveTo(30, -20, 35, -10);
                ctx.lineTo(15, -15);
                ctx.fill();

                // Очки
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(-8, -32, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(8, -32, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-1, -32);
                ctx.lineTo(1, -32);
                ctx.stroke();

                // Глаза (за очками)
                if (this.isBlinking) {
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-11, -32);
                    ctx.lineTo(-5, -32);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(5, -32);
                    ctx.lineTo(11, -32);
                    ctx.stroke();
                } else {
                    if (this.defeated) {
                        // Грустные глаза
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(-8, -30, 3, 0.3, Math.PI - 0.3);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(8, -30, 3, 0.3, Math.PI - 0.3);
                        ctx.stroke();
                    } else {
                        // Злые глаза
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(-8, -32, 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(8, -32, 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(-9, -33, 1, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(7, -33, 1, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Нос
                ctx.fillStyle = '#ff9999';
                ctx.beginPath();
                ctx.arc(0, -27, 4, 0, Math.PI * 2);
                ctx.fill();

                // Рот
                if (this.defeated) {
                    // Грустный рот
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(0, -18, 5, Math.PI + 0.3, -0.3);
                    ctx.stroke();
                } else {
                    // Злая ухмылка
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(0, -20, 6, 0.3, Math.PI - 0.3);
                    ctx.stroke();
                }

                // Руки
                ctx.fillStyle = '#ff0000';
                if (this.defeated) {
                    // Поднятые вверх (сдаётся)
                    ctx.save();
                    ctx.translate(-25, -10);
                    ctx.rotate(-0.5);
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.ellipse(-5, -15, 8, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    ctx.save();
                    ctx.translate(25, -10);
                    ctx.rotate(0.5);
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.ellipse(5, -15, 8, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    // Руки на пульте управления
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.ellipse(-20, -5, 8, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(20, -5, 8, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            update() {
                if (this.defeated) {
                    // Эггман побежден
                    this.y += 1;
                    if (this.y > canvas.height + 100) {
                        this.y = canvas.height * 0.3;
                        this.x = canvas.width * 0.5;
                        this.defeated = false;
                        this.defeatTimer = 0;
                    }
                } else {
                    // Эггман летает
                    this.x += Math.sin(this.wobble) * 2;
                    if (this.x < 100) this.x = 100;
                    if (this.x > canvas.width - 100) this.x = canvas.width - 100;
                }
            }
        }

        // Класс Соника
        class Sonic {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 60;
                this.wobble = 0;
                this.blinkTimer = 0;
                this.isBlinking = false;
                this.runningPhase = 0;
                this.celebrating = false;
                this.celebrationPhase = 0;
            }

            draw() {
                this.wobble += 0.05;
                
                if (this.celebrating) {
                    this.celebrationPhase += 0.1;
                }

                if (this.blinkTimer <= 0) {
                    if (Math.random() < 0.02) {
                        this.isBlinking = true;
                        this.blinkTimer = 10;
                    }
                } else {
                    this.blinkTimer--;
                    if (this.blinkTimer === 0) {
                        this.isBlinking = false;
                    }
                }

                ctx.save();
                ctx.translate(this.x, this.y);
                
                if (this.celebrating) {
                    // Прыгает от радости
                    const jumpY = Math.abs(Math.sin(this.celebrationPhase * 2)) * 30;
                    ctx.translate(0, -jumpY);
                }

                // Ноги
                ctx.fillStyle = '#C0C0C0';
                if (this.celebrating) {
                    const legSwing = Math.sin(this.celebrationPhase * 2) * 15;
                    ctx.save();
                    ctx.translate(-10, 30);
                    ctx.rotate(legSwing * 0.02);
                    ctx.fillStyle = '#C0C0C0';
                    ctx.beginPath();
                    ctx.ellipse(0, 10, 8, 12, legSwing * 0.05, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    ctx.save();
                    ctx.translate(10, 30);
                    ctx.rotate(-legSwing * 0.02);
                    ctx.fillStyle = '#C0C0C0';
                    ctx.beginPath();
                    ctx.ellipse(0, 10, 8, 12, -legSwing * 0.05, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    ctx.beginPath();
                    ctx.ellipse(-15, 35, 10, 7, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(15, 35, 10, 7, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Тело
                const bodyGrad = ctx.createLinearGradient(-20, 0, 20, 0);
                bodyGrad.addColorStop(0, '#1E90FF');
                bodyGrad.addColorStop(0.5, '#4169E1');
                bodyGrad.addColorStop(1, '#1E90FF');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.ellipse(0, 0, 25, 30, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000080';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Живот
                ctx.fillStyle = '#F5DEB3';
                ctx.beginPath();
                ctx.ellipse(0, 8, 17, 18, 0, 0, Math.PI * 2);
                ctx.fill();

                // Голова
                ctx.fillStyle = '#4169E1';
                ctx.beginPath();
                ctx.arc(0, -30, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000080';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Мордочка
                ctx.fillStyle = '#F5DEB3';
                ctx.beginPath();
                ctx.ellipse(8, -22, 15, 12, 0.1, 0, Math.PI * 2);
                ctx.fill();

                // Иголки (колючки)
                ctx.fillStyle = '#00008B';
                ctx.strokeStyle = '#000066';
                ctx.lineWidth = 1;
                for (let i = -2; i <= 2; i++) {
                    ctx.beginPath();
                    const angle = -Math.PI / 2 + i * 0.35;
                    const startX = Math.cos(angle) * 20;
                    const startY = Math.sin(angle) * 20 - 30;
                    const endX = Math.cos(angle) * 50;
                    const endY = Math.sin(angle) * 50 - 30;
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(startX - 4, startY);
                    ctx.lineTo(endX, endY);
                    ctx.lineTo(startX + 4, startY);
                    ctx.fill();
                }
                ctx.beginPath();
                ctx.moveTo(-4, -45);
                ctx.lineTo(0, -70);
                ctx.lineTo(4, -45);
                ctx.fill();

                // Уши
                ctx.fillStyle = '#4169E1';
                ctx.beginPath();
                ctx.moveTo(-12, -42);
                ctx.lineTo(-20, -55);
                ctx.lineTo(-4, -48);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(12, -42);
                ctx.lineTo(20, -55);
                ctx.lineTo(4, -48);
                ctx.fill();
                ctx.fillStyle = '#F5DEB3';
                ctx.beginPath();
                ctx.moveTo(-11, -43);
                ctx.lineTo(-16, -50);
                ctx.lineTo(-6, -47);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(11, -43);
                ctx.lineTo(16, -50);
                ctx.lineTo(6, -47);
                ctx.fill();

                // Глаза
                if (this.isBlinking) {
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-2, -28);
                    ctx.lineTo(6, -28);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(10, -28);
                    ctx.lineTo(18, -28);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.ellipse(2, -30, 6, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(14, -30, 6, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#00FF00';
                    ctx.beginPath();
                    ctx.arc(4, -30, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(16, -30, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(5, -30, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(17, -30, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(4, -32, 1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(16, -32, 1, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Нос
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.ellipse(20, -24, 3, 2, 0, 0, Math.PI * 2);
                ctx.fill();

                // Рот (улыбка)
                if (this.celebrating) {
                    // Широкая улыбка
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(18, -20, 8, 0.2, Math.PI - 0.3);
                    ctx.stroke();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(18, -18, 6, 0, Math.PI);
                    ctx.fill();
                } else {
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(18, -20, 6, 0.2, Math.PI - 0.5);
                    ctx.stroke();
                }

                // Руки
                ctx.fillStyle = '#C0C0C0';
                if (this.celebrating) {
                    // Руки вверх (победа)
                    ctx.save();
                    ctx.translate(-15, -5);
                    ctx.rotate(-0.3);
                    ctx.fillStyle = '#C0C0C0';
                    ctx.beginPath();
                    ctx.ellipse(-5, -15, 8, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    ctx.save();
                    ctx.translate(15, -5);
                    ctx.rotate(0.3);
                    ctx.fillStyle = '#C0C0C0';
                    ctx.beginPath();
                    ctx.ellipse(5, -15, 8, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    ctx.beginPath();
                    ctx.ellipse(-15, -5, 8, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(15, -5, 8, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Кроссовки
                ctx.fillStyle = '#FF0000';
                ctx.beginPath();
                ctx.ellipse(-15, 40, 8, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(15, 40, 8, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(-15, 38, 5, 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(15, 38, 5, 2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            update(eggman) {
                if (eggman.defeated) {
                    this.celebrating = true;
                } else {
                    this.celebrating = false;
                    // Соник и Шэдоу атакуют Эггмана
                    const dx = eggman.x - this.x;
                    const dy = eggman.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 100) {
                        this.x += (dx / dist) * 3;
                        this.y += (dy / dist) * 3;
                    }
                }
            }
        }

        // Класс Шэдоу
        class Shadow {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 60;
                this.wobble = 0;
                this.blinkTimer = 0;
                this.isBlinking = false;
                this.celebrating = false;
                this.celebrationPhase = 0;
            }

            draw() {
                this.wobble += 0.05;
                
                if (this.celebrating) {
                    this.celebrationPhase += 0.1;
                }

                if (this.blinkTimer <= 0) {
                    if (Math.random() < 0.02) {
                        this.isBlinking = true;
                        this.blinkTimer = 10;
                    }
                } else {
                    this.blinkTimer--;
                    if (this.blinkTimer === 0) {
                        this.isBlinking = false;
                    }
                }

                ctx.save();
                ctx.translate(this.x, this.y);
                
                if (this.celebrating) {
                    const jumpY = Math.abs(Math.sin(this.celebrationPhase * 2 + 1)) * 25;
                    ctx.translate(0, -jumpY);
                }

                // Ноги
                ctx.fillStyle = '#808080';
                if (this.celebrating) {
                    const legSwing = Math.sin(this.celebrationPhase * 2 + 1) * 15;
                    ctx.save();
                    ctx.translate(-10, 30);
                    ctx.rotate(legSwing * 0.02);
                    ctx.fillStyle = '#808080';
                    ctx.beginPath();
                    ctx.ellipse(0, 10, 8, 12, legSwing * 0.05, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    ctx.save();
                    ctx.translate(10, 30);
                    ctx.rotate(-legSwing * 0.02);
                    ctx.fillStyle = '#808080';
                    ctx.beginPath();
                    ctx.ellipse(0, 10, 8, 12, -legSwing * 0.05, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    ctx.beginPath();
                    ctx.ellipse(-15, 35, 10, 7, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(15, 35, 10, 7, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Тело
                const bodyGrad = ctx.createLinearGradient(-20, 0, 20, 0);
                bodyGrad.addColorStop(0, '#303030');
                bodyGrad.addColorStop(0.5, '#505050');
                bodyGrad.addColorStop(1, '#303030');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.ellipse(0, 0, 25, 30, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Грудь
                ctx.fillStyle = '#E8E8E8';
                ctx.beginPath();
                ctx.ellipse(0, 8, 17, 18, 0, 0, Math.PI * 2);
                ctx.fill();

                // Голова
                ctx.fillStyle = '#404040';
                ctx.beginPath();
                ctx.arc(0, -30, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Мордочка
                ctx.fillStyle = '#E8E8E8';
                ctx.beginPath();
                ctx.ellipse(8, -22, 15, 12, 0.1, 0, Math.PI * 2);
                ctx.fill();

                // Иголки
                ctx.fillStyle = '#1a1a1a';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                for (let i = -2; i <= 2; i++) {
                    ctx.beginPath();
                    const angle = -Math.PI / 2 + i * 0.35;
                    const startX = Math.cos(angle) * 20;
                    const startY = Math.sin(angle) * 20 - 30;
                    const endX = Math.cos(angle) * 50;
                    const endY = Math.sin(angle) * 50 - 30;
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(startX - 4, startY);
                    ctx.lineTo(endX, endY);
                    ctx.lineTo(startX + 4, startY);
                    ctx.fill();
                }
                ctx.beginPath();
                ctx.moveTo(-4, -45);
                ctx.lineTo(0, -70);
                ctx.lineTo(4, -45);
                ctx.fill();

                // Уши
                ctx.fillStyle = '#404040';
                ctx.beginPath();
                ctx.moveTo(-12, -42);
                ctx.lineTo(-20, -55);
                ctx.lineTo(-4, -48);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(12, -42);
                ctx.lineTo(20, -55);
                ctx.lineTo(4, -48);
                ctx.fill();
                ctx.fillStyle = '#E8E8E8';
                ctx.beginPath();
                ctx.moveTo(-11, -43);
                ctx.lineTo(-16, -50);
                ctx.lineTo(-6, -47);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(11, -43);
                ctx.lineTo(16, -50);
                ctx.lineTo(6, -47);
                ctx.fill();

                // Глаза
                if (this.isBlinking) {
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-2, -28);
                    ctx.lineTo(6, -28);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(10, -28);
                    ctx.lineTo(18, -28);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.ellipse(2, -30, 6, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(14, -30, 6, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FF0000';
                    ctx.beginPath();
                    ctx.arc(4, -30, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(16, -30, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(5, -30, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(17, -30, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(4, -32, 1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(16, -32, 1, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Нос
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.ellipse(20, -24, 3, 2, 0, 0, Math.PI * 2);
                ctx.fill();

                // Рот
                if (this.celebrating) {
                    // Улыбка
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(18, -20, 7, 0.2, Math.PI - 0.3);
                    ctx.stroke();
                } else {
                    // Серьезный рот
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(15, -20);
                    ctx.lineTo(21, -20);
                    ctx.stroke();
                }

                // Руки
                ctx.fillStyle = '#808080';
                if (this.celebrating) {
                    ctx.save();
                    ctx.translate(-15, -5);
                    ctx.rotate(-0.3);
                    ctx.fillStyle = '#808080';
                    ctx.beginPath();
                    ctx.ellipse(-5, -15, 8, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    ctx.save();
                    ctx.translate(15, -5);
                    ctx.rotate(0.3);
                    ctx.fillStyle = '#808080';
                    ctx.beginPath();
                    ctx.ellipse(5, -15, 8, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    ctx.beginPath();
                    ctx.ellipse(-15, -5, 8, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(15, -5, 8, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Кроссовки
                ctx.fillStyle = '#FF0000';
                ctx.beginPath();
                ctx.ellipse(-15, 40, 8, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(15, 40, 8, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(-15, 38, 5, 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(15, 38, 5, 2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            update(eggman) {
                if (eggman.defeated) {
                    this.celebrating = true;
                } else {
                    this.celebrating = false;
                    const dx = eggman.x - this.x;
                    const dy = eggman.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 100) {
                        this.x += (dx / dist) * 3;
                        this.y += (dy / dist) * 3;
                    }
                }
            }
        }

        // Создаем объекты
        const eggman = new Eggman(canvas.width * 0.5, canvas.height * 0.4);
        const sonic = new Sonic(canvas.width * 0.2, canvas.height * 0.6);
        const shadow = new Shadow(canvas.width * 0.8, canvas.height * 0.6);

        // Анимация атаки
        let attackPhase = 0;
        let victoryShown = false;

        // Функция рисования фона
        function drawBackground() {
            // Звезды
            stars.forEach(star => {
                star.phase += star.twinkleSpeed;
                const alpha = star.alpha * (0.7 + 0.3 * Math.sin(star.phase));
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
                star.x -= star.speed * 0.1;
                if (star.x < -5) {
                    star.x = canvas.width + 5;
                    star.y = Math.random() * canvas.height;
                }
            });

            // Космические облака
            ctx.globalAlpha = 0.05;
            for (let i = 0; i < 3; i++) {
                const cloudX = canvas.width * (0.2 + i * 0.3);
                const cloudY = canvas.height * (0.3 + i * 0.2);
                const cloudGrad = ctx.createRadialGradient(cloudX, cloudY, 20, cloudX, cloudY, 200);
                cloudGrad.addColorStop(0, '#9370DB');
                cloudGrad.addColorStop(0.5, '#6A5ACD');
                cloudGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = cloudGrad;
                ctx.fillRect(cloudX - 200, cloudY - 200, 400, 400);
            }
            ctx.globalAlpha = 1;
        }

        // Искры атаки
        const sparks = [];
        function createSparks(x, y) {
            for (let i = 0; i < 10; i++) {
                sparks.push({
                    x: x,
                    y: y,
                    vx: Math.random() * 6 - 3,
                    vy: Math.random() * 6 - 3,
                    radius: Math.random() * 3 + 1,
                    alpha: 1,
                    color: Math.random() > 0.5 ? '#ffd700' : '#ff6600'
                });
            }
        }

        function drawSparks() {
            for (let i = sparks.length - 1; i >= 0; i--) {
                const spark = sparks[i];
                spark.x += spark.vx;
                spark.y += spark.vy;
                spark.alpha -= 0.05;
                spark.radius *= 0.95;
                
                if (spark.alpha <= 0 || spark.radius <= 0.1) {
                    sparks.splice(i, 1);
                    continue;
                }
                
                ctx.fillStyle = spark.color;
                ctx.globalAlpha = spark.alpha;
                ctx.beginPath();
                ctx.arc(spark.x, spark.y, spark.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // Главный цикл анимации
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем фон
            drawBackground();
            
            // Обновляем Эггмана
            eggman.update();
            
            // Соник и Шэдоу атакуют
            attackPhase += 0.05;
            
            // Создаем искры при атаке
            if (!eggman.defeated && Math.random() < 0.3) {
                const attackX = eggman.x + (Math.random() - 0.5) * 60;
                const attackY = eggman.y + (Math.random() - 0.5) * 60;
                createSparks(attackX, attackY);
            }
            
            // Проверяем, победили ли Эггмана
            if (!eggman.defeated && attackPhase > 5) {
                eggman.defeated = true;
                if (!victoryShown) {
                    victoryShown = true;
                    victoryMessage.style.opacity = '1';
                    setTimeout(() => {
                        victoryMessage.style.opacity = '0';
                    }, 3000);
                }
            }
            
            // Рисуем искры
            drawSparks();
            
            // Обновляем и рисуем персонажей
            sonic.update(eggman);
            sonic.draw();
            
            shadow.update(eggman);
            shadow.draw();
            
            eggman.draw();

            requestAnimationFrame(animate);
        }

        // Запускаем анимацию
        animate();

        // Полифилл для roundRect
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                this.beginPath();
                this.moveTo(x + r.tl, y);
                this.lineTo(x + w - r.tr, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                this.lineTo(x + w, y + h - r.br);
                this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                this.lineTo(x + r.bl, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                this.lineTo(x, y + r.tl);
                this.quadraticCurveTo(x, y, x + r.tl, y);
                this.closePath();
                return this;
            };
        }
    </script>
