<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Гонки на JavaScript</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        
        #gameContainer {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        canvas {
            border: 3px solid #333;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
            background: #2c3e50;
        }
        
        #score {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        #gameOver {
            font-size: 20px;
            color: #e74c3c;
            font-weight: bold;
            margin-top: 10px;
            min-height: 30px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        .instructions {
            color: #666;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="score">Очки: 0</div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="gameOver"></div>
        <button onclick="restartGame()">Начать заново</button>
        <div class="instructions">
            Используйте стрелки ← → для управления | Пробел для паузы
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');

        // Игровые переменные
        let player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 120,
            width: 50,
            height: 80,
            speed: 5
        };

        let obstacles = [];
        let score = 0;
        let gameRunning = true;
        let gamePaused = false;
        let animationId;
        let obstacleSpeed = 3;
        let spawnTimer = 0;
        let spawnDelay = 60; // кадров между появлением препятствий

        // Дорожная разметка
        let roadMarkings = [];
        for (let i = 0; i < 15; i++) {
            roadMarkings.push({
                x: canvas.width / 2 - 2,
                y: i * 50,
                width: 4,
                height: 30
            });
        }

        // Управление
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') {
                e.preventDefault();
                if (gameRunning) {
                    gamePaused = !gamePaused;
                    if (!gamePaused) {
                        gameLoop();
                    }
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Создание препятствий (других машин)
        function createObstacle() {
            const obstacleWidth = 45 + Math.random() * 15;
            const obstacleHeight = 70 + Math.random() * 20;
            const lanes = [70, 200, 330]; // возможные позиции X
            
            return {
                x: lanes[Math.floor(Math.random() * lanes.length)],
                y: -obstacleHeight,
                width: obstacleWidth,
                height: obstacleHeight,
                color: `hsl(${Math.random() * 360}, 70%, 50%)`
            };
        }

        // Отрисовка игрока (машины)
        function drawPlayer() {
            // Кузов машины
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Крыша
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(player.x + 8, player.y + 10, player.width - 16, player.height - 30);
            
            // Окна
            ctx.fillStyle = '#3498db';
            ctx.fillRect(player.x + 10, player.y + 15, player.width - 20, 15);
            
            // Колеса
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(player.x - 5, player.y + 10, 10, 20);
            ctx.fillRect(player.x + player.width - 5, player.y + 10, 10, 20);
            ctx.fillRect(player.x - 5, player.y + player.height - 30, 10, 20);
            ctx.fillRect(player.x + player.width - 5, player.y + player.height - 30, 10, 20);
            
            // Фары
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(player.x + 8, player.y + player.height - 8, 10, 6);
            ctx.fillRect(player.x + player.width - 18, player.y + player.height - 8, 10, 6);
        }

        // Отрисовка препятствий
        function drawObstacle(obstacle) {
            // Кузов
            ctx.fillStyle = obstacle.color;
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
            
            // Крыша
            ctx.fillStyle = obstacle.color.replace('50%)', '35%)');
            ctx.fillRect(obstacle.x + 7, obstacle.y + 8, obstacle.width - 14, obstacle.height - 28);
            
            // Окна
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(obstacle.x + 9, obstacle.y + 13, obstacle.width - 18, 13);
            
            // Колеса
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(obstacle.x - 4, obstacle.y + 8, 8, 18);
            ctx.fillRect(obstacle.x + obstacle.width - 4, obstacle.y + 8, 8, 18);
            ctx.fillRect(obstacle.x - 4, obstacle.y + obstacle.height - 26, 8, 18);
            ctx.fillRect(obstacle.x + obstacle.width - 4, obstacle.y + obstacle.height - 26, 8, 18);
        }

        // Отрисовка дороги
        function drawRoad() {
            // Дорога
            ctx.fillStyle = '#555';
            ctx.fillRect(50, 0, canvas.width - 100, canvas.height);
            
            // Края дороги
            ctx.fillStyle = '#fff';
            ctx.fillRect(50, 0, 5, canvas.height);
            ctx.fillRect(canvas.width - 55, 0, 5, canvas.height);
            
            // Разметка
            ctx.fillStyle = '#fff';
            roadMarkings.forEach(marking => {
                ctx.fillRect(marking.x, marking.y, marking.width, marking.height);
            });
        }

        // Движение дорожной разметки
        function moveRoadMarkings() {
            roadMarkings.forEach(marking => {
                marking.y += obstacleSpeed;
                if (marking.y > canvas.height) {
                    marking.y = -marking.height;
                }
            });
        }

        // Проверка столкновений
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Обновление игры
        function update() {
            if (!gameRunning || gamePaused) return;

            // Движение игрока
            if (keys['ArrowLeft'] || keys['a']) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] || keys['d']) {
                player.x += player.speed;
            }

            // Ограничение движения игрока
            if (player.x < 55) player.x = 55;
            if (player.x > canvas.width - player.width - 55) player.x = canvas.width - player.width - 55;

            // Движение препятствий
            obstacles.forEach(obstacle => {
                obstacle.y += obstacleSpeed;
            });

            // Удаление препятствий, вышедших за экран
            obstacles = obstacles.filter(obstacle => {
                if (obstacle.y > canvas.height) {
                    score += 10;
                    return false;
                }
                return true;
            });

            // Проверка столкновений
            obstacles.forEach(obstacle => {
                if (checkCollision(player, obstacle)) {
                    gameRunning = false;
                    gameOverElement.textContent = `Игра окончена! Вы набрали ${score} очков`;
                }
            });

            // Создание новых препятствий
            spawnTimer++;
            if (spawnTimer >= spawnDelay) {
                obstacles.push(createObstacle());
                spawnTimer = 0;
                // Увеличиваем сложность
                if (spawnDelay > 30) spawnDelay -= 0.5;
                if (obstacleSpeed < 8) obstacleSpeed += 0.01;
            }

            // Движение дорожной разметки
            moveRoadMarkings();

            // Обновление счета
            scoreElement.textContent = `Очки: ${score}`;
        }

        // Отрисовка игры
        function draw() {
            // Очистка канваса
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Отрисовка дороги
            drawRoad();

            // Отрисовка препятствий
            obstacles.forEach(obstacle => {
                drawObstacle(obstacle);
            });

            // Отрисовка игрока
            drawPlayer();

            // Отображение паузы
            if (gamePaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('ПАУЗА', canvas.width / 2, canvas.height / 2);
                ctx.textAlign = 'start';
            }
        }

        // Игровой цикл
        function gameLoop() {
            if (!gameRunning) {
                draw();
                return;
            }

            if (!gamePaused) {
                update();
            }
            
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        // Перезапуск игры
        function restartGame() {
            // Сброс переменных
            player.x = canvas.width / 2 - 25;
            obstacles = [];
            score = 0;
            gameRunning = true;
            gamePaused = false;
            obstacleSpeed = 3;
            spawnTimer = 0;
            spawnDelay = 60;
            
            // Сброс дорожной разметки
            roadMarkings = [];
            for (let i = 0; i < 15; i++) {
                roadMarkings.push({
                    x: canvas.width / 2 - 2,
                    y: i * 50,
                    width: 4,
                    height: 30
                });
            }
            
            // Обновление интерфейса
            scoreElement.textContent = 'Очки: 0';
            gameOverElement.textContent = '';
            
            // Отмена предыдущей анимации
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            
            // Запуск новой игры
            gameLoop();
        }

        // Запуск игры при загрузке
        gameLoop();
    </script>
</body>
</html>
