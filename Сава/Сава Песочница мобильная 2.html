<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Песочница с оружием</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            touch-action: none;
            background: #000;
        }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            padding: 0 20px;
            z-index: 10;
        }
        .joystick-zone {
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }
        .joystick-thumb {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            position: absolute;
            top: 35px;
            left: 35px;
            transition: background 0.1s;
        }
        .buttons {
            display: flex;
            gap: 15px;
            pointer-events: auto;
            align-items: center;
        }
        .action-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(220, 50, 50, 0.7);
            border: 2px solid white;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            touch-action: manipulation;
            user-select: none;
        }
        .spawn-btn {
            background: rgba(50, 150, 220, 0.7);
        }
        .type-select {
            display: flex;
            gap: 5px;
            pointer-events: auto;
        }
        .type-btn {
            background: rgba(20,20,40,0.7);
            color: white;
            border: 1px solid white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(8px);
        }
        .type-btn.active {
            background: #e94560;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.8);
        }
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }
        #crosshair::after {
            width: 20px;
            height: 2px;
            left: 0;
            top: 9px;
        }
        .desktop-hint {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="joystick-zone" id="moveStick">
            <div class="joystick-thumb" id="moveThumb"></div>
        </div>
        <div class="type-select" id="typeSelect">
            <button class="type-btn active" data-type="cube">📦</button>
            <button class="type-btn" data-type="ball">⚪</button>
            <button class="type-btn" data-type="classic">🧑</button>
            <button class="type-btn" data-type="robot">🤖</button>
        </div>
        <div class="buttons">
            <div class="action-btn spawn-btn" id="spawnBtn">+</div>
            <div class="action-btn" id="fireBtn">🔫</div>
        </div>
    </div>
    <div id="crosshair"></div>
    <div class="desktop-hint" id="desktopHint">WASD — движение | Мышь — взгляд | ЛКМ — огонь | ПКМ — спавн | 1-4 — тип</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js';

        // ---------- Инициализация Three.js ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Освещение
        const ambientLight = new THREE.AmbientLight(0x404066);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 5);
        dirLight.castShadow = true;
        dirLight.receiveShadow = true;
        dirLight.shadow.mapSize.width = 512;
        dirLight.shadow.mapSize.height = 512;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        dirLight.shadow.camera.top = 15;
        dirLight.shadow.camera.bottom = -15;
        scene.add(dirLight);

        // ---------- Физический мир Cannon.js ----------
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);
        world.broadphase = new CANNON.SAPBroadphase(world);
        world.defaultContactMaterial.restitution = 0.3;
        world.defaultContactMaterial.friction = 0.5;

        // Материалы
        const groundMaterial = new CANNON.Material('ground');
        const objectMaterial = new CANNON.Material('object');
        const playerMaterial = new CANNON.Material('player');
        const bulletMaterial = new CANNON.Material('bullet');
        const contactMaterial = new CANNON.ContactMaterial(groundMaterial, objectMaterial, { friction: 0.6, restitution: 0.2 });
        world.addContactMaterial(contactMaterial);
        world.addContactMaterial(new CANNON.ContactMaterial(playerMaterial, groundMaterial, { friction: 0.0 }));
        world.addContactMaterial(new CANNON.ContactMaterial(bulletMaterial, objectMaterial, { friction: 0.0, restitution: 0.9 }));

        // ---------- Создание окружения ----------
        const meshes = [];
        const bodies = [];

        function addBodyMesh(body, mesh) {
            bodies.push(body);
            meshes.push(mesh);
            scene.add(mesh);
        }

        // Пол
        const groundBody = new CANNON.Body({ mass: 0, material: groundMaterial });
        groundBody.addShape(new CANNON.Plane());
        groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(groundBody);
        const groundMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 30),
            new THREE.MeshStandardMaterial({ color: 0x2d3a5c, roughness: 0.8 })
        );
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        // Стены
        function createWall(x, y, z, w, h, d) {
            const body = new CANNON.Body({ mass: 0, material: groundMaterial });
            body.addShape(new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)));
            body.position.set(x, y, z);
            world.addBody(body);
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: 0x4a5b82, transparent: true, opacity: 0.3 })
            );
            mesh.position.copy(body.position);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
        }
        createWall(0, 2, -15.5, 30, 4, 1);
        createWall(0, 2, 15.5, 30, 4, 1);
        createWall(-15.5, 2, 0, 1, 4, 30);
        createWall(15.5, 2, 0, 1, 4, 30);

        // ---------- Игрок ----------
        const playerBody = new CANNON.Body({
            mass: 80,
            material: playerMaterial,
            fixedRotation: true,
            linearDamping: 0.9
        });
        playerBody.addShape(new CANNON.Cylinder(0.4, 0.4, 1.8, 8));
        playerBody.position.set(0, 2, 0);
        world.addBody(playerBody);

        // Оружие (модель)
        const gunGroup = new THREE.Group();
        const gunBody = new THREE.Mesh(
            new THREE.BoxGeometry(0.08, 0.12, 0.3),
            new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 })
        );
        gunBody.position.z = -0.2;
        gunGroup.add(gunBody);
        const gunBarrel = new THREE.Mesh(
            new THREE.CylinderGeometry(0.04, 0.04, 0.2, 8),
            new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.9 })
        );
        gunBarrel.rotation.x = Math.PI/2;
        gunBarrel.position.set(0, 0.04, -0.35);
        gunGroup.add(gunBarrel);
        gunGroup.position.set(0.3, -0.3, -0.5);
        camera.add(gunGroup);
        scene.add(camera);

        // Управление
        const keyState = { w: false, a: false, s: false, d: false, space: false };
        let spawnType = 'cube';
        let isLocked = false;

        // Поворот камеры
        let yaw = 0, pitch = 0;
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        const PI_2 = Math.PI / 2;

        function updateCameraRotation() {
            euler.set(pitch, yaw, 0);
            camera.quaternion.setFromEuler(euler);
            playerBody.quaternion.setFromEuler(0, yaw, 0);
        }

        // Захват указателя
        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });
        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === renderer.domElement;
            document.getElementById('desktopHint').style.display = isLocked ? 'none' : 'block';
        });
        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-PI_2, Math.min(PI_2, pitch));
            updateCameraRotation();
        });

        // Клавиши
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keyState.w = true;
            if (e.code === 'KeyA') keyState.a = true;
            if (e.code === 'KeyS') keyState.s = true;
            if (e.code === 'KeyD') keyState.d = true;
            if (e.code === 'Space') keyState.space = true;
            if (e.code === 'Digit1') setSpawnType('cube');
            if (e.code === 'Digit2') setSpawnType('ball');
            if (e.code === 'Digit3') setSpawnType('classic');
            if (e.code === 'Digit4') setSpawnType('robot');
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keyState.w = false;
            if (e.code === 'KeyA') keyState.a = false;
            if (e.code === 'KeyS') keyState.s = false;
            if (e.code === 'KeyD') keyState.d = false;
            if (e.code === 'Space') keyState.space = false;
        });

        // Мобильные контролы
        const moveStick = document.getElementById('moveStick');
        const moveThumb = document.getElementById('moveThumb');
        let moveVector = new THREE.Vector2();
        let moveActive = false;
        let moveTouchId = null;

        moveStick.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (moveTouchId === null) {
                const touch = e.changedTouches[0];
                moveTouchId = touch.identifier;
                moveActive = true;
                updateMoveThumb(touch);
            }
        });
        moveStick.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === moveTouchId) {
                    updateMoveThumb(touch);
                }
            }
        });
        moveStick.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === moveTouchId) {
                    moveActive = false;
                    moveTouchId = null;
                    moveThumb.style.top = '35px';
                    moveThumb.style.left = '35px';
                    moveVector.set(0, 0);
                }
            }
        });

        function updateMoveThumb(touch) {
            const rect = moveStick.getBoundingClientRect();
            const centerX = rect.left + rect.width/2;
            const centerY = rect.top + rect.height/2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const maxDist = 45;
            if (dist > maxDist) {
                dx = dx / dist * maxDist;
                dy = dy / dist * maxDist;
            }
            moveThumb.style.left = (35 + dx) + 'px';
            moveThumb.style.top = (35 + dy) + 'px';
            moveVector.set(dx / maxDist, -dy / maxDist);
        }

        // Поворот камеры на мобильных (правая половина экрана)
        let lookTouchId = null;
        let lastLookX = 0, lastLookY = 0;
        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.target === moveStick || e.target === moveThumb) return;
            if (lookTouchId === null) {
                const touch = e.changedTouches[0];
                lookTouchId = touch.identifier;
                lastLookX = touch.clientX;
                lastLookY = touch.clientY;
            }
        });
        renderer.domElement.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === lookTouchId) {
                    const dx = touch.clientX - lastLookX;
                    const dy = touch.clientY - lastLookY;
                    yaw -= dx * 0.005;
                    pitch -= dy * 0.005;
                    pitch = Math.max(-PI_2, Math.min(PI_2, pitch));
                    updateCameraRotation();
                    lastLookX = touch.clientX;
                    lastLookY = touch.clientY;
                }
            }
        });
        renderer.domElement.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === lookTouchId) {
                    lookTouchId = null;
                }
            }
        });

        // Кнопки действия
        document.getElementById('fireBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            shoot();
        });
        document.getElementById('spawnBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            spawnObjectInFront();
        });
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setSpawnType(btn.dataset.type);
            });
        });

        function setSpawnType(type) {
            spawnType = type;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.type-btn[data-type="${type}"]`).classList.add('active');
        }

        // Стрельба
        const bullets = [];
        function shoot() {
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const pos = camera.position.clone().add(dir.clone().multiplyScalar(0.5));
            const bulletBody = new CANNON.Body({
                mass: 0.1,
                material: bulletMaterial,
                shape: new CANNON.Sphere(0.08)
            });
            bulletBody.position.copy(pos);
            bulletBody.velocity.copy(dir.clone().multiplyScalar(50));
            world.addBody(bulletBody);
            
            const bulletMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.08, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xffaa00 })
            );
            bulletMesh.position.copy(pos);
            scene.add(bulletMesh);
            
            bullets.push({ body: bulletBody, mesh: bulletMesh, life: 3.0 });
        }

        // Спавн объекта перед игроком
        function spawnObjectInFront() {
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const origin = camera.position.clone();
            const raycaster = new THREE.Raycaster(origin, dir, 0.1, 10);
            const intersects = raycaster.intersectObjects(scene.children, true);
            let point = origin.clone().add(dir.clone().multiplyScalar(3));
            if (intersects.length > 0) {
                point.copy(intersects[0].point);
            }
            spawnObjectAt(point, spawnType);
        }

        function spawnObjectAt(position, type) {
            if (type === 'cube') {
                const size = 0.6;
                const body = new CANNON.Body({ mass: 1, material: objectMaterial });
                body.addShape(new CANNON.Box(new CANNON.Vec3(size/2, size/2, size/2)));
                body.position.copy(position);
                world.addBody(body);
                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(size, size, size),
                    new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, roughness: 0.4 })
                );
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                addBodyMesh(body, mesh);
            } else if (type === 'ball') {
                const radius = 0.4;
                const body = new CANNON.Body({ mass: 1, material: objectMaterial });
                body.addShape(new CANNON.Sphere(radius));
                body.position.copy(position);
                world.addBody(body);
                const mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(radius, 16, 16),
                    new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, roughness: 0.3 })
                );
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                addBodyMesh(body, mesh);
            } else if (type === 'classic' || type === 'robot') {
                createRagdoll(position, type);
            }
        }

        function createRagdoll(position, type) {
            const group = new THREE.Group();
            const bodiesList = [];
            const meshesList = [];
            const constraints = [];
            const yOffset = 0.9;
            const base = position.clone();
            
            const head = new CANNON.Body({ mass: 1, material: objectMaterial });
            head.addShape(new CANNON.Sphere(0.2));
            head.position.set(base.x, base.y + 0.8 + yOffset, base.z);
            world.addBody(head);
            const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12), new THREE.MeshStandardMaterial({ color: 0xf4a261 }));
            headMesh.castShadow = true;
            addBodyMesh(head, headMesh);
            
            const torso = new CANNON.Body({ mass: 2, material: objectMaterial });
            torso.addShape(new CANNON.Box(new CANNON.Vec3(0.2, 0.35, 0.15)));
            torso.position.set(base.x, base.y + 0.4 + yOffset, base.z);
            world.addBody(torso);
            const torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.7, 0.3), new THREE.MeshStandardMaterial({ color: 0x264653 }));
            torsoMesh.castShadow = true;
            addBodyMesh(torso, torsoMesh);
            
            const leftArm = new CANNON.Body({ mass: 0.8, material: objectMaterial });
            leftArm.addShape(new CANNON.Box(new CANNON.Vec3(0.1, 0.3, 0.1)));
            leftArm.position.set(base.x - 0.3, base.y + 0.5 + yOffset, base.z);
            world.addBody(leftArm);
            const leftArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), new THREE.MeshStandardMaterial({ color: 0x2a9d8f }));
            leftArmMesh.castShadow = true;
            addBodyMesh(leftArm, leftArmMesh);
            
            const rightArm = new CANNON.Body({ mass: 0.8, material: objectMaterial });
            rightArm.addShape(new CANNON.Box(new CANNON.Vec3(0.1, 0.3, 0.1)));
            rightArm.position.set(base.x + 0.3, base.y + 0.5 + yOffset, base.z);
            world.addBody(rightArm);
            const rightArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), new THREE.MeshStandardMaterial({ color: 0x2a9d8f }));
            rightArmMesh.castShadow = true;
            addBodyMesh(rightArm, rightArmMesh);
            
            const leftLeg = new CANNON.Body({ mass: 1, material: objectMaterial });
            leftLeg.addShape(new CANNON.Box(new CANNON.Vec3(0.12, 0.35, 0.12)));
            leftLeg.position.set(base.x - 0.15, base.y - 0.1 + yOffset, base.z);
            world.addBody(leftLeg);
            const leftLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.7, 0.24), new THREE.MeshStandardMaterial({ color: 0x2a9d8f }));
            leftLegMesh.castShadow = true;
            addBodyMesh(leftLeg, leftLegMesh);
            
            const rightLeg = new CANNON.Body({ mass: 1, material: objectMaterial });
            rightLeg.addShape(new CANNON.Box(new CANNON.Vec3(0.12, 0.35, 0.12)));
            rightLeg.position.set(base.x + 0.15, base.y - 0.1 + yOffset, base.z);
            world.addBody(rightLeg);
            const rightLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.7, 0.24), new THREE.MeshStandardMaterial({ color: 0x2a9d8f }));
            rightLegMesh.castShadow = true;
            addBodyMesh(rightLeg, rightLegMesh);

            const opts = { stiffness: 0.8, length: 0.1 };
            const c1 = new CANNON.ConeTwistConstraint(head, torso, { pivotA: new CANNON.Vec3(0, -0.2, 0), pivotB: new CANNON.Vec3(0, 0.35, 0), maxForce: 100 });
            world.addConstraint(c1);
            const c2 = new CANNON.ConeTwistConstraint(torso, leftArm, { pivotA: new CANNON.Vec3(-0.2, 0.15, 0), pivotB: new CANNON.Vec3(0.1, 0.25, 0), maxForce: 100 });
            world.addConstraint(c2);
            const c3 = new CANNON.ConeTwistConstraint(torso, rightArm, { pivotA: new CANNON.Vec3(0.2, 0.15, 0), pivotB: new CANNON.Vec3(-0.1, 0.25, 0), maxForce: 100 });
            world.addConstraint(c3);
            const c4 = new CANNON.ConeTwistConstraint(torso, leftLeg, { pivotA: new CANNON.Vec3(-0.1, -0.35, 0), pivotB: new CANNON.Vec3(0, 0.3, 0), maxForce: 100 });
            world.addConstraint(c4);
            const c5 = new CANNON.ConeTwistConstraint(torso, rightLeg, { pivotA: new CANNON.Vec3(0.1, -0.35, 0), pivotB: new CANNON.Vec3(0, 0.3, 0), maxForce: 100 });
            world.addConstraint(c5);
        }

        // Обработка столкновений пуль
        world.addEventListener('beginContact', (evt) => {
            const bodyA = evt.bodyA;
            const bodyB = evt.bodyB;
            const bullet = bullets.find(b => b.body === bodyA || b.body === bodyB);
            if (!bullet) return;
            const other = (bodyA === bullet.body) ? bodyB : bodyA;
            if (other.mass > 0) {
                const impulse = new CANNON.Vec3();
                bullet.body.velocity.normalize();
                impulse.copy(bullet.body.velocity.clone().scale(10));
                other.applyImpulse(impulse, evt.contact.bi.id === other.id ? evt.contact.bi.r : evt.contact.bj.r);
            }
            bullet.body.world.removeBody(bullet.body);
            scene.remove(bullet.mesh);
            bullets.splice(bullets.indexOf(bullet), 1);
        });

        // Обновление
        function animate() {
            requestAnimationFrame(animate);

            // Движение игрока
            const speed = 5;
            const moveDir = new THREE.Vector3();
            if (keyState.w) moveDir.z -= 1;
            if (keyState.s) moveDir.z += 1;
            if (keyState.a) moveDir.x -= 1;
            if (keyState.d) moveDir.x += 1;
            if (moveActive) {
                moveDir.x = moveVector.x;
                moveDir.z = moveVector.y;
            }
            if (moveDir.length() > 0) {
                moveDir.normalize();
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                const vel = new THREE.Vector3();
                vel.add(forward.clone().multiplyScalar(moveDir.z * speed));
                vel.add(right.clone().multiplyScalar(moveDir.x * speed));
                playerBody.velocity.x = vel.x;
                playerBody.velocity.z = vel.z;
            } else {
                playerBody.velocity.x *= 0.9;
                playerBody.velocity.z *= 0.9;
            }

            // Прыжок
            if ((keyState.space) && Math.abs(playerBody.velocity.y) < 0.1) {
                playerBody.velocity.y = 5;
            }

            // Обновление позиции камеры
            camera.position.copy(playerBody.position).add(new THREE.Vector3(0, 0.8, 0));

            // Обновление физики
            world.step(1/60);

            // Синхронизация мешей
            for (let i = 0; i < bodies.length; i++) {
                meshes[i].position.copy(bodies[i].position);
                meshes[i].quaternion.copy(bodies[i].quaternion);
            }

            // Удаление старых пуль
            for (let i = bullets.length-1; i >= 0; i--) {
                bullets[i].life -= 1/60;
                if (bullets[i].life <= 0) {
                    world.removeBody(bullets[i].body);
                    scene.remove(bullets[i].mesh);
                    bullets.splice(i, 1);
                } else {
                    bullets[i].mesh.position.copy(bullets[i].body.position);
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Начальные объекты
        spawnObjectAt(new THREE.Vector3(2, 1, -2), 'cube');
        spawnObjectAt(new THREE.Vector3(-1, 1, -3), 'ball');
        createRagdoll(new THREE.Vector3(0, 0, -4), 'classic');
    </script>
</body>
</html>
