<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рикошет</title>

<style>
body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
}

canvas {
    background: #000;
    border: 2px solid #666;
}

#menu {
    position: absolute;
    text-align: center;
    color: white;
    display: none;
}

button {
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>
<body>

<canvas id="game" width="800" height="600"></canvas>

<div id="menu">
    <h1 id="resultText"></h1>
    <p id="finalScore"></p>
    <button onclick="restartGame()">Играть снова</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const resultText = document.getElementById("resultText");
const finalScore = document.getElementById("finalScore");

let score = 0;
let gameOver = false;

const paddle = {
    width: 120,
    height: 15,
    x: 340,
    y: 560,
    speed: 8
};

const ball = {
    x: 400,
    y: 300,
    radius: 10,
    dx: 4,
    dy: -4
};

const keys = {
    left: false,
    right: false
};

const brickRowCount = 5;
const brickColumnCount = 10;
const brickWidth = 70;
const brickHeight = 20;
const brickPadding = 8;
const brickOffsetTop = 50;
const brickOffsetLeft = 18;

let bricks = [];

function createBricks() {
    bricks = [];

    for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];

        for (let r = 0; r < brickRowCount; r++) {
            bricks[c][r] = {
                x: 0,
                y: 0,
                status: 1
            };
        }
    }
}

createBricks();

document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") keys.left = true;
    if (e.key === "ArrowRight") keys.right = true;
});

document.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft") keys.left = false;
    if (e.key === "ArrowRight") keys.right = false;
});

function collisionDetection() {
    let remaining = 0;

    for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {

            let b = bricks[c][r];

            if (b.status === 1) {

                remaining++;

                if (
                    ball.x > b.x &&
                    ball.x < b.x + brickWidth &&
                    ball.y > b.y &&
                    ball.y < b.y + brickHeight
                ) {
                    ball.dy *= -1;
                    b.status = 0;
                    score += 10;
                    remaining--;
                }
            }
        }
    }

    if (remaining === 0) {
        winGame();
    }
}

function winGame() {
    gameOver = true;
    resultText.textContent = "🏆 Победа!";
    finalScore.textContent = "Очки: " + score;
    menu.style.display = "block";
}

function loseGame() {
    gameOver = true;
    resultText.textContent = "💥 Игра окончена";
    finalScore.textContent = "Очки: " + score;
    menu.style.display = "block";
}

function update() {

    if (gameOver) return;

    if (keys.left) paddle.x -= paddle.speed;
    if (keys.right) paddle.x += paddle.speed;

    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.width > canvas.width) {
        paddle.x = canvas.width - paddle.width;
    }

    ball.x += ball.dx;
    ball.y += ball.dy;

    if (
        ball.x + ball.radius > canvas.width ||
        ball.x - ball.radius < 0
    ) {
        ball.dx *= -1;
    }

    if (ball.y - ball.radius < 0) {
        ball.dy *= -1;
    }

    if (
        ball.y + ball.radius >= paddle.y &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.width &&
        ball.dy > 0
    ) {
        let hit =
            (ball.x - (paddle.x + paddle.width / 2))
            / (paddle.width / 2);

        ball.dx = hit * 7;
        ball.dy = -Math.abs(ball.dy);
    }

    collisionDetection();

    if (ball.y > canvas.height) {
        loseGame();
    }
}

function drawBricks() {

    for (let c = 0; c < brickColumnCount; c++) {

        for (let r = 0; r < brickRowCount; r++) {

            if (bricks[c][r].status === 1) {

                let brickX =
                    c * (brickWidth + brickPadding)
                    + brickOffsetLeft;

                let brickY =
                    r * (brickHeight + brickPadding)
                    + brickOffsetTop;

                bricks[c][r].x = brickX;
                bricks[c][r].y = brickY;

                ctx.fillStyle =
                    `hsl(${r * 60}, 80%, 55%)`;

                ctx.fillRect(
                    brickX,
                    brickY,
                    brickWidth,
                    brickHeight
                );
            }
        }
    }
}

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBricks();

    ctx.beginPath();
    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );
    ctx.fillStyle = "#00ff88";
    ctx.fill();
    ctx.closePath();

    ctx.fillStyle = "#3399ff";
    ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
    );

    ctx.fillStyle = "white";
    ctx.font = "24px Arial";
    ctx.fillText(
        "Очки: " + score,
        20,
        35
    );
}

function restartGame() {

    score = 0;
    gameOver = false;

    paddle.x = 340;

    ball.x = 400;
    ball.y = 300;
    ball.dx = 4;
    ball.dy = -4;

    createBricks();

    menu.style.display = "none";
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
