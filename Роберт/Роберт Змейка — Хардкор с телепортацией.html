<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Змейка — Хардкор с телепортацией</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 500px;
            width: 100%;
            padding: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .score {
            color: #ff4444;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }
        .best-score {
            color: #ffaa00;
            font-size: 18px;
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.4);
        }
        .level-indicator {
            color: #ff69b4;
            font-size: 16px;
            text-shadow: 0 0 6px rgba(255, 105, 180, 0.4);
        }
        canvas {
            border: 3px solid #ff4444;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.4), inset 0 0 20px rgba(0,0,0,0.5);
            background-color: #0d0d1a;
            width: 100%;
            max-width: 400px;
            height: auto;
            aspect-ratio: 1;
            cursor: pointer;
        }
        .game-over {
            color: #fff;
            font-size: 18px;
            min-height: 28px;
            text-align: center;
            animation: pulse 1.5s infinite;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 8px;
            width: 100%;
            max-width: 350px;
            margin-top: 5px;
        }
        .btn {
            background: rgba(255, 68, 68, 0.15);
            border: 2px solid rgba(255, 68, 68, 0.5);
            color: #ff4444;
            font-size: 28px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 55px;
            transition: all 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            background: rgba(255, 68, 68, 0.5);
            transform: scale(0.9);
            border-color: #ff4444;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.6);
        }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-restart {
            grid-column: 1 / 4;
            grid-row: 3;
            background: rgba(255, 170, 0, 0.15);
            border-color: rgba(255, 170, 0, 0.5);
            color: #ffaa00;
            font-size: 18px;
            font-weight: bold;
        }
        .btn-restart:active {
            background: rgba(255, 170, 0, 0.5);
            border-color: #ffaa00;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.6);
        }
        @media (min-width: 768px) {
            .controls {
                display: none;
            }
        }
        .info-text {
            color: #888;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="header">
            <span class="score">🍎 <span id="scoreDisplay">0</span></span>
            <span class="level-indicator">⚡ Уровень <span id="levelDisplay">1</span></span>
            <span class="best-score">🏆 <span id="bestScoreDisplay">0</span></span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="game-over" id="gameOverMessage"></div>
        <div class="controls" id="mobileControls">
            <button class="btn btn-up" id="btnUp">▲</button>
            <button class="btn btn-left" id="btnLeft">◀</button>
            <button class="btn btn-right" id="btnRight">▶</button>
            <button class="btn btn-down" id="btnDown">▼</button>
            <button class="btn btn-restart" id="btnRestart">🔄 НОВАЯ ИГРА</button>
        </div>
        <div class="info-text">Стены телепортируют | Свайп/Кнопки/Стрелки | Избегай красных блоков!</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const bestScoreDisplay = document.getElementById('bestScoreDisplay');
        const gameOverMessage = document.getElementById('gameOverMessage');
        const mobileControls = document.getElementById('mobileControls');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake, food, bonusFood, obstacles, direction, nextDirection;
        let score, bestScore, level, gameRunning, gameLoopTimeout;
        let obstacleMoveInterval, particles;

        bestScore = parseInt(localStorage.getItem('snakeHardBestScore') || '0');
        bestScoreDisplay.textContent = bestScore;

        function createParticle(x, y, color) {
            return {
                x: x * gridSize + gridSize / 2,
                y: y * gridSize + gridSize / 2,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                life: 1,
                color: color
            };
        }

        function initGame() {
            const startX = Math.floor(tileCount / 2);
            const startY = Math.floor(tileCount / 2);
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            level = 1;
            gameRunning = true;
            obstacles = [];
            particles = [];
            bonusFood = null;
            
            scoreDisplay.textContent = score;
            levelDisplay.textContent = level;
            gameOverMessage.textContent = '';
            
            placeFood();
            updateObstacles();
            
            if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
            if (obstacleMoveInterval) clearInterval(obstacleMoveInterval);
            
            obstacleMoveInterval = setInterval(moveObstacles, 3000);
        }

        function updateObstacles() {
            obstacles = [];
            const count = Math.min(2 + level * 2, 15);
            const occupied = new Set(snake.map(seg => `${seg.x},${seg.y}`));
            if (food) occupied.add(`${food.x},${food.y}`);
            if (bonusFood) occupied.add(`${bonusFood.x},${bonusFood.y}`);

            for (let i = 0; i < count; i++) {
                let pos;
                let attempts = 0;
                do {
                    pos = {
                        x: Math.floor(Math.random() * tileCount),
                        y: Math.floor(Math.random() * tileCount)
                    };
                    attempts++;
                } while (occupied.has(`${pos.x},${pos.y}`) && attempts < 100);
                
                if (attempts < 100) {
                    obstacles.push(pos);
                    occupied.add(`${pos.x},${pos.y}`);
                }
            }
        }

        function moveObstacles() {
            if (!gameRunning || obstacles.length === 0) return;
            
            const occupied = new Set(snake.map(seg => `${seg.x},${seg.y}`));
            if (food) occupied.add(`${food.x},${food.y}`);
            
            obstacles = obstacles.map(obs => {
                const dirs = [{x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}];
                const validMoves = dirs.filter(d => {
                    const nx = obs.x + d.x;
                    const ny = obs.y + d.y;
                    return nx >= 0 && nx < tileCount && ny >= 0 && ny < tileCount 
                           && !occupied.has(`${nx},${ny}`);
                });
                
                if (validMoves.length > 0) {
                    const move = validMoves[Math.floor(Math.random() * validMoves.length)];
                    return { x: obs.x + move.x, y: obs.y + move.y };
                }
                return obs;
            });
        }

        function placeFood() {
            const occupied = new Set(snake.map(seg => `${seg.x},${seg.y}`));
            obstacles.forEach(obs => occupied.add(`${obs.x},${obs.y}`));
            if (bonusFood) occupied.add(`${bonusFood.x},${bonusFood.y}`);
            
            let freeCells = [];
            for (let x = 0; x < tileCount; x++) {
                for (let y = 0; y < tileCount; y++) {
                    if (!occupied.has(`${x},${y}`)) {
                        freeCells.push({ x, y });
                    }
                }
            }
            
            if (freeCells.length === 0) {
                endGame(true);
                return;
            }
            
            food = freeCells[Math.floor(Math.random() * freeCells.length)];
            
            // Бонусная еда (15% шанс)
            if (Math.random() < 0.15 && freeCells.length > 1) {
                freeCells = freeCells.filter(c => c.x !== food.x || c.y !== food.y);
                bonusFood = freeCells[Math.floor(Math.random() * freeCells.length)];
                setTimeout(() => { bonusFood = null; }, 5000);
            }
        }

        function updateBestScore() {
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('snakeHardBestScore', bestScore);
                bestScoreDisplay.textContent = bestScore;
            }
        }

        function gameLoop() {
            if (!gameRunning) return;

            if (
                !(nextDirection.x === -direction.x && nextDirection.y === -direction.y) &&
                !(nextDirection.x === 0 && nextDirection.y === 0)
            ) {
                direction = { x: nextDirection.x, y: nextDirection.y };
            }

            const head = snake[0];
            let newHead = { 
                x: head.x + direction.x, 
                y: head.y + direction.y 
            };

            // ТЕЛЕПОРТАЦИЯ ВМЕСТО СМЕРТИ
            let teleported = false;
            if (newHead.x < 0 || newHead.x >= tileCount || 
                newHead.y < 0 || newHead.y >= tileCount) {
                newHead.x = (newHead.x + tileCount) % tileCount;
                newHead.y = (newHead.y + tileCount) % tileCount;
                teleported = true;
            }

            // Столкновение с телом — ЕДИНСТВЕННАЯ ПРИЧИНА СМЕРТИ
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
                    endGame(false);
                    return;
                }
            }

            // Столкновение с препятствием — смерть
            for (let obs of obstacles) {
                if (obs.x === newHead.x && obs.y === newHead.y) {
                    particles.push(createParticle(obs.x, obs.y, '#ff4444'));
                    endGame(false);
                    return;
                }
            }

            snake.unshift(newHead);

            // Эффект телепортации
            if (teleported) {
                for (let i = 0; i < 8; i++) {
                    particles.push(createParticle(newHead.x, newHead.y, '#00ccff'));
                }
            }

            let ate = false;
            
            // Обычная еда
            if (newHead.x === food.x && newHead.y === food.y) {
                score++;
                ate = true;
                particles.push(createParticle(food.x, food.y, '#ff4444'));
                
                if (score % 5 === 0) {
                    level++;
                    levelDisplay.textContent = level;
                    updateObstacles();
                }
            }
            // Бонусная еда
            else if (bonusFood && newHead.x === bonusFood.x && newHead.y === bonusFood.y) {
                score += 3;
                ate = true;
                particles.push(createParticle(bonusFood.x, bonusFood.y, '#ffaa00'));
                bonusFood = null;
            }
            else {
                snake.pop();
            }

            if (ate) {
                scoreDisplay.textContent = score;
                placeFood();
                if (!gameRunning) return;
            }

            draw();
            
            const speed = Math.max(40, 130 - level * 8);
            gameLoopTimeout = setTimeout(gameLoop, speed);
        }

        function endGame(won = false) {
            gameRunning = false;
            if (obstacleMoveInterval) clearInterval(obstacleMoveInterval);
            
            if (won) {
                gameOverMessage.textContent = '🎉 ПОБЕДА! Ты захватил всё поле!';
            } else {
                gameOverMessage.textContent = '💀 Змейка погибла! Нажми НОВАЯ ИГРА';
            }
            
            updateBestScore();
            draw();
        }

        function draw() {
            ctx.fillStyle = '#0d0d1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Сетка
            ctx.strokeStyle = 'rgba(255, 68, 68, 0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Телепортационные края (подсветка)
            ctx.strokeStyle = 'rgba(0, 200, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            // Препятствия
            obstacles.forEach(obs => {
                const pulse = Math.sin(Date.now() * 0.005 + obs.x + obs.y) * 0.3 + 0.7;
                ctx.fillStyle = `rgba(255, 50, 50, ${pulse})`;
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 10;
                ctx.fillRect(obs.x * gridSize + 2, obs.y * gridSize + 2, gridSize - 4, gridSize - 4);
                ctx.shadowBlur = 0;
                
                // Шипы
                ctx.fillStyle = '#ff0000';
                const cx = obs.x * gridSize + gridSize / 2;
                const cy = obs.y * gridSize + gridSize / 2;
                for (let a = 0; a < 4; a++) {
                    const angle = (a * Math.PI / 2) + Date.now() * 0.002;
                    ctx.beginPath();
                    ctx.arc(
                        cx + Math.cos(angle) * 6,
                        cy + Math.sin(angle) * 6,
                        2, 0, Math.PI * 2
                    );
                    ctx.fill();
                }
            });

            // Еда
            if (food) {
                const pulse = Math.sin(Date.now() * 0.008) * 0.3 + 0.7;
                ctx.fillStyle = `rgba(255, 68, 68, ${pulse})`;
                ctx.shadowColor = '#ff4444';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(
                    food.x * gridSize + gridSize / 2,
                    food.y * gridSize + gridSize / 2,
                    gridSize / 2 - 2,
                    0, Math.PI * 2
                );
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Бонусная еда
            if (bonusFood) {
                const pulse = Math.sin(Date.now() * 0.012) * 0.4 + 0.6;
                ctx.fillStyle = `rgba(255, 170, 0, ${pulse})`;
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                const bx = bonusFood.x * gridSize + gridSize / 2;
                const by = bonusFood.y * gridSize + gridSize / 2;
                for (let i = 0; i < 5; i++) {
                    const angle = (i * Math.PI * 2) / 5 - Math.PI / 2;
                    const r = gridSize / 2 - 2;
                    const x = bx + Math.cos(angle) * r;
                    const y = by + Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Змейка
            snake.forEach((segment, index) => {
                const x = segment.x * gridSize;
                const y = segment.y * gridSize;
                
                if (index === 0) {
                    ctx.fillStyle = '#00ff88';
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 15;
                } else {
                    const alpha = 1 - (index / snake.length) * 0.5;
                    ctx.fillStyle = `rgba(10, 255, 150, ${Math.max(0.4, alpha)})`;
                    ctx.shadowColor = '#0aff99';
                    ctx.shadowBlur = 5;
                }
                
                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, gridSize - 2, gridSize - 2, 5);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Глаза
                if (index === 0) {
                    ctx.fillStyle = '#fff';
                    const cx = x + gridSize / 2;
                    const cy = y + gridSize / 2;
                    let eye1, eye2;
                    
                    if (direction.x === 1) { eye1 = {x: cx+4, y: cy-3}; eye2 = {x: cx+4, y: cy+3}; }
                    else if (direction.x === -1) { eye1 = {x: cx-4, y: cy-3}; eye2 = {x: cx-4, y: cy+3}; }
                    else if (direction.y === -1) { eye1 = {x: cx-3, y: cy-4}; eye2 = {x: cx+3, y: cy-4}; }
                    else { eye1 = {x: cx-3, y: cy+4}; eye2 = {x: cx+3, y: cy+4}; }

                    [eye1, eye2].forEach(eye => {
                        ctx.beginPath();
                        ctx.arc(eye.x, eye.y, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(eye.x, eye.y, 1.3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#fff';
                    });
                }
            });

            // Частицы
            particles = particles.filter(p => {
                p.life -= 0.03;
                p.x += p.vx;
                p.y += p.vy;
                if (p.life <= 0) return false;
                
                ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('rgb', 'rgba');
                if (p.color.startsWith('#')) {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                return true;
            });

            if (!gameRunning) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        // ============ УПРАВЛЕНИЕ ============
        
        document.getElementById('btnUp').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
        });
        document.getElementById('btnDown').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
        });
        document.getElementById('btnLeft').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
        });
        document.getElementById('btnRight').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
        });
        document.getElementById('btnRestart').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            restartGame();
        });

        let touchStartX = 0, touchStartY = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!touchStartX || !touchStartY) return;
            
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            const minSwipe = 20;

            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > minSwipe) {
                if (dx > 0 && direction.x !== -1) nextDirection = { x: 1, y: 0 };
                else if (dx < 0 && direction.x !== 1) nextDirection = { x: -1, y: 0 };
            } else if (Math.abs(dy) > minSwipe) {
                if (dy > 0 && direction.y !== -1) nextDirection = { x: 0, y: 1 };
                else if (dy < 0 && direction.y !== 1) nextDirection = { x: 0, y: -1 };
            }
            
            touchStartX = 0;
            touchStartY = 0;
        });

        canvas.addEventListener('click', () => {
            if (!gameRunning) restartGame();
        });

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            
            if (key === ' ') {
                e.preventDefault();
                restartGame();
                return;
            }
            
            switch (key) {
                case 'arrowup': case 'w':
                    e.preventDefault();
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'arrowdown': case 's':
                    e.preventDefault();
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'arrowleft': case 'a':
                    e.preventDefault();
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'arrowright': case 'd':
                    e.preventDefault();
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        });

        function restartGame() {
            if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
            if (obstacleMoveInterval) clearInterval(obstacleMoveInterval);
            initGame();
            gameLoopTimeout = setTimeout(gameLoop, 130);
        }

        function checkMobile() {
            mobileControls.style.display = window.innerWidth < 768 ? 'grid' : 'none';
        }
        window.addEventListener('resize', checkMobile);
        checkMobile();

        // Анимация частиц
        function animateParticles() {
            if (particles.length > 0 && gameRunning) {
                draw();
            }
            requestAnimationFrame(animateParticles);
        }

        initGame();
        gameLoopTimeout = setTimeout(gameLoop, 130);
        animateParticles();
    </script>
</body>
</html>
