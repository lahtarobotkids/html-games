<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ПСЖ – Арсенал · Финал | Мультфильм</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(150deg, #0b1e33 0%, #132b44 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Montserrat', system-ui, sans-serif;
      padding: 20px;
      margin: 0;
    }
    .cinema {
      background: #0a121f;
      border-radius: 3rem 3rem 2rem 2rem;
      box-shadow: 0 35px 55px rgba(0,0,0,0.8), 0 0 0 4px #d4af37, 0 0 0 8px #0a2847;
      padding: 20px 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 950px;
      width: fit-content;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #0e2a1f;
      border-radius: 40px;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.9), 0 22px 35px rgba(0, 0, 0, 0.8);
      border: 3px solid #c9a63b;
    }
    .marquee {
      width: 100%;
      margin-top: 18px;
      background: #e5c261;
      background-image: linear-gradient(90deg, #c49b2c, #f7e6b0, #c49b2c);
      color: #091b31;
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: 2px;
      padding: 14px 20px;
      border-radius: 60px;
      text-align: center;
      box-shadow: 0 8px 0 #7a561b, 0 12px 28px black;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .marquee span {
      background: #03152b;
      color: #fddd5c;
      padding: 5px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }
    button {
      background: #dba42b;
      border: none;
      color: #031630;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 14px 42px;
      margin-top: 18px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 7px 0 #7a5318, 0 10px 22px black;
      transition: all 0.08s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: radial-gradient(circle at 30% 30%, #f5de8a, #c4911e);
      border: 2px solid #ffe694;
    }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #5a3c0e, 0 8px 18px black;
    }
    .controls {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    @media (max-width: 700px) {
      .marquee { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
<div style="display: flex; flex-direction: column; align-items: center;">
  <div class="cinema">
    <canvas id="psgMovieCanvas" width="800" height="450" aria-label="Финал ПСЖ против Арсенала — лучшие моменты"></canvas>
    <div class="marquee">
      🏆⚡ ФИНАЛ · ПСЖ vs АРСЕНАЛ ⚡🏆
      <span>ГОЛЫ · СЕЙВ · ПОБЕДА</span>
      🔴🔵 ICI C'EST PARIS 🔵🔴
    </div>
    <div class="controls">
      <button id="replayBtn"><span>▶</span> СМОТРЕТЬ СНОВА</button>
    </div>
    <div style="color:#dbb042; margin-top: 8px; font-weight: bold; font-size: 0.95rem;">
      ⚽ Мбаппе · Неймар · Рамос · Доннарумма · легендарный финал ⚽
    </div>
  </div>
  <p style="color:#b68b3c; margin-top: 14px; font-style: italic; text-shadow: 0 2px 6px black;">ПСЖ забирает кубок — Арсенал повержен!</p>
</div>

<script>
  (function() {
    const canvas = document.getElementById('psgMovieCanvas');
    const ctx = canvas.getContext('2d');
    const W = 800, H = 450;

    // Анимация
    let sceneTime = 0;
    let animationFrameId = null;
    let isRunning = true;

    // Частицы (конфетти, фейерверк)
    let particles = [];

    // Цвета команд
    const PSG_BLUE = '#103a5c';
    const PSG_RED = '#d42a3b';
    const ARSENAL_RED = '#db1828';
    const ARSENAL_WHITE = '#f0f0f0';
    const GOLD = '#eebb3c';
    const WHITE = '#ffffff';

    // Рисование игрока
    function drawPlayer(x, y, scale = 1.0, shirtColor = PSG_BLUE, shortsColor = '#111122', number = '7', isArsenal = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      // Ноги
      ctx.fillStyle = shortsColor;
      ctx.fillRect(-5, 6, 4, 14);
      ctx.fillRect(1, 6, 4, 14);
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(-6, 18, 7, 5);
      ctx.fillRect(1, 18, 7, 5);
      // Тело
      ctx.fillStyle = shirtColor;
      ctx.fillRect(-8, -8, 16, 18);
      if (!isArsenal) {
        ctx.fillStyle = PSG_RED;
        ctx.fillRect(-1, -8, 3, 18);
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-6, -2, 12, 4);
      }
      // Руки
      ctx.fillStyle = '#e6c9a0';
      ctx.fillRect(-13, -5, 5, 10);
      ctx.fillRect(8, -5, 5, 10);
      // Голова
      ctx.fillStyle = '#f5dbb1';
      ctx.beginPath();
      ctx.arc(0, -12, 8, 0, 2*Math.PI);
      ctx.fill();
      ctx.fillStyle = '#2b1a0c';
      ctx.beginPath();
      ctx.arc(0, -16, 7, Math.PI, 2*Math.PI);
      ctx.fill();
      ctx.fillStyle = WHITE;
      ctx.font = 'bold 9px "Montserrat"';
      ctx.fillText(number, -4, 5);
      ctx.restore();
    }

    function drawGoalkeeper(x, y, scale = 1.0, isArsenal = false) {
      ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
      ctx.fillStyle = isArsenal ? '#1e3a1e' : '#0b2b4a';
      ctx.fillRect(-9, -5, 18, 22);
      ctx.fillStyle = isArsenal ? '#ffcc00' : '#f5b042';
      ctx.fillRect(-8, -7, 16, 6);
      ctx.fillStyle = '#f7e06c';
      ctx.fillRect(-13, -3, 6, 8);
      ctx.fillRect(7, -3, 6, 8);
      ctx.fillStyle = '#f5dbb1';
      ctx.beginPath(); ctx.arc(0, -12, 9, 0, 2*Math.PI); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, -15, 8, Math.PI, 0); ctx.fill();
      ctx.restore();
    }

    function drawBall(x, y, s = 1.0) {
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
      ctx.fillStyle = '#f0f0f0'; ctx.beginPath(); ctx.arc(0,0,7,0,2*Math.PI); ctx.fill();
      ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI); ctx.fill();
      ctx.fillStyle = '#b0b0b0'; ctx.beginPath(); ctx.arc(-2,-2,2.2,0,2*Math.PI); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    function spawnConfetti(x, y, count = 15) {
      for (let i=0; i<count; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random()-0.5)*6, vy: (Math.random()-1.2)*5 - 1.5,
          life: 1.0, decay: 0.012+Math.random()*0.025,
          color: Math.random()<0.6 ? GOLD : (Math.random()<0.5 ? PSG_RED : '#ffffff'),
          size: 2+Math.random()*5
        });
      }
    }

    function updateParticles() {
      for (let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.1;
        p.life -= p.decay;
        if (p.life <= 0 || p.y > H+25) particles.splice(i,1);
      }
    }

    function drawParticles() {
      for (let p of particles) {
        ctx.globalAlpha = p.life*0.9;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size*0.7);
      }
      ctx.globalAlpha = 1;
    }

    function drawStadium() {
      ctx.fillStyle = '#0e1f2b'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#1b4a2b'; ctx.fillRect(0,H-70,W,70);
      ctx.strokeStyle = '#eeeeee55'; ctx.lineWidth = 2.2; ctx.setLineDash([18,22]);
      ctx.beginPath(); ctx.moveTo(0,H-48); ctx.lineTo(W,H-48); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffffff20'; ctx.font = 'bold 16px "Montserrat"';
      ctx.fillText('ФИНАЛ ЛИГИ ЧЕМПИОНОВ', 250, 40);
    }

    function drawScene(progress) {
      drawStadium();
      let t = progress;

      // Фазы финала (0..1 ~ 16 секунд)
      // 0.0-0.25 : Арсенал атакует, сейв Доннаруммы
      // 0.25-0.45 : ПСЖ контратака, гол Мбаппе 1:0
      // 0.45-0.65 : Арсенал сравнивает (1:1) драма
      // 0.65-0.85 : ПСЖ решающий гол Неймара (2:1)
      // 0.85-1.0  : Финальный свисток, празднование, кубок

      if (t < 0.25) {
        // Арсенал в атаке
        drawPlayer(180, H-105, 0.95, ARSENAL_RED, '#ffffff', '14', true);
        drawPlayer(250, H-115, 0.9, ARSENAL_RED, '#ffffff', '7', true);
        drawBall(320, H-120, 0.8);
        drawGoalkeeper(140, 170, 0.95, false); // Доннарумма
        if (t > 0.18 && particles.length<10) spawnConfetti(150, 190, 6);
        ctx.fillStyle = '#f5e56c'; ctx.font = 'bold 18px "Montserrat"'; ctx.fillText('СЕЙВ ДОННАРУММЫ!', 320, 70);
      }
      else if (t < 0.45) {
        // Гол Мбаппе
        drawPlayer(110, H-100, 0.9, PSG_BLUE, '#0a0a1a', '7');
        drawPlayer(200, H-108, 0.9, PSG_BLUE, '#0a0a1a', '10');
        drawBall(400, 170, 0.85);
        drawGoalkeeper(570, 160, 0.9, true);
        if (t > 0.38 && particles.length<25) spawnConfetti(450, 180, 20);
        ctx.fillStyle = GOLD; ctx.font = 'bold 24px "Montserrat"'; ctx.fillText('⚽ МБАППЕ! 1:0', 420, 70);
      }
      else if (t < 0.65) {
        // Арсенал сравнивает
        drawPlayer(500, H-102, 0.9, ARSENAL_RED, '#ffffff', '9', true);
        drawBall(280, 175, 0.8);
        drawGoalkeeper(140, 170, 0.9, false);
        if (t > 0.58) spawnConfetti(300, 180, 10);
        ctx.fillStyle = '#e63946'; ctx.font = 'bold 24px "Montserrat"'; ctx.fillText('АРСЕНАЛ 1:1', 270, 65);
      }
      else if (t < 0.85) {
        // Победный гол Неймара
        drawPlayer(160, H-95, 0.95, PSG_RED, '#0a0a1a', '10');
        drawPlayer(250, H-105, 0.9, PSG_BLUE, '#0a0a1a', '11');
        drawBall(500, 155, 0.9);
        drawGoalkeeper(600, 155, 0.95, true);
        if (t > 0.78) spawnConfetti(520, 160, 28);
        ctx.fillStyle = GOLD; ctx.font = 'bold 26px "Montserrat"'; ctx.fillText('⚽ НЕЙМАР! 2:1', 400, 60);
      }
      else {
        // Празднование и кубок
        drawPlayer(280, H-90, 0.9, PSG_BLUE, '#0a0a1a', '7');
        drawPlayer(340, H-95, 0.9, PSG_RED, '#0a0a1a', '10');
        drawPlayer(400, H-88, 0.9, PSG_BLUE, '#0a0a1a', '5');
        drawPlayer(460, H-96, 0.9, '#1e3f5c', '#0a0a1a', '30');
        // Кубок
        ctx.fillStyle = GOLD; ctx.fillRect(380, H-170, 55, 60);
        ctx.fillStyle = '#b38b2c'; ctx.fillRect(370, H-185, 75, 22);
        ctx.fillStyle = '#fde482'; ctx.font = '28px "Segoe UI"'; ctx.fillText('🏆', 390, H-137);
        spawnConfetti(400, H-185, 35);
        ctx.fillStyle = WHITE; ctx.font = 'italic 28px "Montserrat"'; ctx.fillText('ПСЖ - ЧЕМПИОНЫ!', 210, 55);
      }

      updateParticles();
      drawParticles();

      // Счет на табло
      ctx.fillStyle = '#0a0f1a'; ctx.fillRect(620, 20, 150, 45);
      ctx.strokeStyle = GOLD; ctx.lineWidth = 2.5; ctx.strokeRect(620,20,150,45);
      ctx.fillStyle = WHITE; ctx.font = 'bold 22px "Courier New"';
      ctx.fillText('ПСЖ 2 : 1 АРС', 630, 52);
    }

    function animationLoop() {
      if (!isRunning) return;
      sceneTime += 0.016;
      let cycle = 17.5;
      let progress = (sceneTime % cycle) / cycle;
      ctx.clearRect(0,0,W,H);
      drawScene(progress);
      animationFrameId = requestAnimationFrame(animationLoop);
    }

    function restartMovie() {
      sceneTime = 0;
      particles = [];
    }

    document.getElementById('replayBtn').addEventListener('click', restartMovie);
    animationLoop();

    window.addEventListener('beforeunload', ()=>{
      if(animationFrameId) cancelAnimationFrame(animationFrameId);
      isRunning = false;
    });
  })();
</script>
</body>
</html>
