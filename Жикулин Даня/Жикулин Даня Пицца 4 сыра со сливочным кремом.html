<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пицца 4 сыра со сливочным кремом</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: radial-gradient(circle at 50% 30%, #fff9ef 0%, #f3e6cf 60%, #e8d5b4 100%);
    font-family: 'Segoe UI', Arial, sans-serif; padding: 24px;
  }
  h1 {
    font-size: clamp(22px, 4vw, 40px); color: #7a4a12; letter-spacing: 1px;
    text-align: center; font-weight: 800;
  }
  .sub { color: #a06a24; font-size: clamp(13px, 2vw, 17px); text-align: center; }
  .wrap {
    width: min(92vw, 84vh, 720px);
    filter: drop-shadow(0 24px 50px rgba(90, 50, 10, .35));
  }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
  <h1>🍕 Пицца «4 сыра» со сливочным кремом</h1>
  <div class="sub">Моцарелла · Горгонзола · Пармезан · Фонтина + сливочный крем</div>
  <div class="wrap">
<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Пицца четыре сыра со сливочным кремом">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#ecd8b4"/>
    </radialGradient>
    <radialGradient id="crust" cx="40%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#f9cf7d"/>
      <stop offset="55%" stop-color="#eaa845"/>
      <stop offset="100%" stop-color="#cf7e1f"/>
    </radialGradient>
    <radialGradient id="crustRim" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="#f3c066"/>
      <stop offset="100%" stop-color="#b96c14"/>
    </radialGradient>
    <radialGradient id="creamBase" cx="45%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="100%" stop-color="#f7ecd2"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- фон -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- тень -->
  <ellipse cx="400" cy="470" rx="330" ry="46" fill="rgba(90,50,10,.22)" filter="url(#soft)"/>

  <!-- бортик (тесто) -->
  <circle cx="400" cy="400" r="305" fill="url(#crustRim)"/>
  <circle cx="400" cy="400" r="300" fill="url(#crust)"/>

  <!-- кремовая основа -->
  <circle cx="400" cy="400" r="258" fill="url(#creamBase)"/>

  <!-- ===== 4 сектора сыра ===== -->
  <!-- Моцарелла: верх-право -->
  <path d="M400 400 L400 142 A258 258 0 0 1 658 400 Z" fill="#f6f0e2"/>
  <!-- Горгонзола: низ-право -->
  <path d="M400 400 L658 400 A258 258 0 0 1 400 658 Z" fill="#eef2ea"/>
  <!-- Пармезан: низ-лево -->
  <path d="M400 400 L400 658 A258 258 0 0 1 142 400 Z" fill="#f4d276"/>
  <!-- Фонтина: верх-лево -->
  <path d="M400 400 L142 400 A258 258 0 0 1 400 142 Z" fill="#f3cd6a"/>

  <!-- Моцарелла: белые расплавленные круги -->
  <g fill="#fbf7ec" stroke="#e6dcc6" stroke-width="2">
    <circle cx="470" cy="230" r="40"/><circle cx="560" cy="210" r="34"/>
    <circle cx="545" cy="310" r="42"/><circle cx="460" cy="330" r="36"/>
    <circle cx="620" cy="280" r="30"/><circle cx="505" cy="180" r="26"/>
  </g>
  <g fill="#fffdf6" stroke="#efe6d0" stroke-width="1.5">
    <circle cx="490" cy="260" r="16"/><circle cx="575" cy="330" r="18"/><circle cx="600" cy="230" r="14"/>
  </g>

  <!-- Горгонзола: с голубыми прожилками -->
  <g fill="#f2f6ef" stroke="#d8e0d4" stroke-width="2">
    <circle cx="470" cy="470" r="38"/><circle cx="560" cy="470" r="34"/>
    <circle cx="540" cy="570" r="40"/><circle cx="460" cy="580" r="34"/>
    <circle cx="620" cy="540" r="28"/><circle cx="500" cy="520" r="22"/>
  </g>
  <g stroke="#5b8a96" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M470 470 q10 -8 20 0 q-6 10 -20 0"/>
    <path d="M560 470 q-8 8 -18 2 q4 -8 18 -2"/>
    <path d="M540 570 q12 -6 22 2 q-8 8 -22 -2"/>
    <path d="M460 580 q-6 -8 -14 -2 q4 8 14 2"/>
    <path d="M620 540 q8 -6 14 2 q-6 8 -14 -2"/>
  </g>
  <g fill="#5b8a96" opacity="0.85">
    <circle cx="485" cy="455" r="3"/><circle cx="575" cy="585" r="3"/>
    <circle cx="610" cy="490" r="3"/><circle cx="455" cy="545" r="3"/>
  </g>

  <!-- Пармезан: тёртые стружки -->
  <g stroke="#d9a53a" stroke-width="1.5">
    <g fill="#f2c14e">
      <path d="M230 470 l18 -8 l6 12 l-20 6 Z"/><path d="M290 500 l16 -6 l4 10 l-18 4 Z"/>
      <path d="M250 560 l20 -7 l5 12 l-22 5 Z"/><path d="M320 560 l18 -8 l6 12 l-20 6 Z"/>
      <path d="M220 620 l16 -6 l4 10 l-18 4 Z"/><path d="M300 630 l20 -7 l5 12 l-22 5 Z"/>
    </g>
    <g fill="#eab54a">
      <path d="M180 520 l14 -6 l4 9 l-16 4 Z"/><path d="M270 620 l16 -6 l4 10 l-18 4 Z"/>
      <path d="M190 600 l18 -7 l5 11 l-20 5 Z"/><path d="M340 480 l14 -5 l4 9 l-16 4 Z"/>
      <path d="M260 470 l16 -6 l4 10 l-18 4 Z"/><path d="M220 540 l18 -7 l5 11 l-20 5 Z"/>
    </g>
    <g fill="#ffd97a">
      <path d="M310 540 l14 -5 l4 9 l-16 4 Z"/><path d="M190 470 l16 -6 l4 10 l-18 4 Z"/>
      <path d="M240 590 l16 -6 l4 10 l-18 4 Z"/><path d="M330 600 l14 -5 l4 9 l-16 4 Z"/>
    </g>
  </g>

  <!-- Фонтина: расплавленное золотистое -->
  <g fill="#f7dc85" stroke="#d9a53a" stroke-width="2">
    <circle cx="300" cy="240" r="40"/><circle cx="200" cy="300" r="34"/>
    <circle cx="240" cy="340" r="38"/><circle cx="320" cy="330" r="30"/>
    <circle cx="180" cy="200" r="26"/><circle cx="260" cy="190" r="22"/>
  </g>
  <g fill="#fbeeb0" stroke="#e6c060" stroke-width="1.5">
    <circle cx="290" cy="270" r="15"/><circle cx="210" cy="250" r="13"/><circle cx="340" cy="290" r="12"/>
  </g>

  <!-- сливочный крем (завитки) -->
  <g fill="none" stroke="#fffdf3" stroke-linecap="round" opacity="0.9">
    <path d="M340 340 q40 -30 20 -70 q-16 -30 -50 -20" stroke-width="14"/>
    <path d="M460 340 q-40 -30 -20 -70 q16 -30 50 -20" stroke-width="14"/>
    <path d="M340 460 q40 30 20 70 q-16 30 -50 20" stroke-width="14"/>
    <path d="M460 460 q-40 30 -20 70 q16 30 50 20" stroke-width="14"/>
    <circle cx="400" cy="400" r="26" stroke-width="13"/>
  </g>
  <g fill="none" stroke="#fdf6e4" stroke-linecap="round" opacity="0.55" stroke-width="6">
    <path d="M300 400 q50 -20 60 -60"/><path d="M500 400 q-50 -20 -60 -60"/>
    <path d="M300 400 q50 20 60 60"/><path d="M500 400 q-50 20 -60 60"/>
  </g>

  <!-- пузырьки подрумяненного сыра -->
  <g>
    <circle cx="420" cy="300" r="8" fill="#c98b2e"/><circle cx="418" cy="298" r="3" fill="#f7dda0"/>
    <circle cx="520" cy="430" r="7" fill="#c98b2e"/><circle cx="518" cy="428" r="2.5" fill="#f7dda0"/>
    <circle cx="330" cy="510" r="7" fill="#c98b2e"/><circle cx="328" cy="508" r="2.5" fill="#f7dda0"/>
    <circle cx="480" cy="250" r="6" fill="#c98b2e"/><circle cx="478" cy="248" r="2" fill="#f7dda0"/>
    <circle cx="250" cy="420" r="6" fill="#c98b2e"/><circle cx="248" cy="418" r="2" fill="#f7dda0"/>
  </g>

  <!-- базилик -->
  <g>
    <g transform="translate(430,180) rotate(-20)">
      <ellipse cx="0" cy="0" rx="22" ry="12" fill="#3f8f3a"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#2c6a28" stroke-width="1.6"/>
    </g>
    <g transform="translate(360,560) rotate(140)">
      <ellipse cx="0" cy="0" rx="20" ry="11" fill="#55a94c"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#2c6a28" stroke-width="1.5"/>
    </g>
    <g transform="translate(560,600) rotate(60)">
      <ellipse cx="0" cy="0" rx="20" ry="11" fill="#3f8f3a"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#2c6a28" stroke-width="1.5"/>
    </g>
    <g transform="translate(200,180) rotate(30)">
      <ellipse cx="0" cy="0" rx="18" ry="10" fill="#55a94c"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#2c6a28" stroke-width="1.4"/>
    </g>
    <g transform="translate(520,330) rotate(-50)">
      <ellipse cx="0" cy="0" rx="18" ry="10" fill="#4a9b41"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#2c6a28" stroke-width="1.4"/>
    </g>
  </g>

  <!-- корочка: защипки по краю -->
  <g fill="#c07a22" opacity="0.7">
    <circle cx="400" cy="118" r="4"/><circle cx="460" cy="120" r="4"/><circle cx="520" cy="130" r="4"/>
    <circle cx="580" cy="150" r="4"/><circle cx="632" cy="180" r="4"/><circle cx="672" cy="225" r="4"/>
    <circle cx="692" cy="280" r="4"/><circle cx="702" cy="340" r="4"/><circle cx="700" cy="400" r="4"/>
    <circle cx="690" cy="460" r="4"/><circle cx="672" cy="520" r="4"/><circle cx="640" cy="575" r="4"/>
    <circle cx="600" cy="620" r="4"/><circle cx="545" cy="660" r="4"/><circle cx="485" cy="682" r="4"/>
    <circle cx="420" cy="690" r="4"/><circle cx="360" cy="686" r="4"/><circle cx="300" cy="672" r="4"/>
    <circle cx="245" cy="642" r="4"/><circle cx="200" cy="600" r="4"/><circle cx="165" cy="545" r="4"/>
    <circle cx="135" cy="485" r="4"/><circle cx="118" cy="420" r="4"/><circle cx="112" cy="350" r="4"/>
    <circle cx="120" cy="285" r="4"/><circle cx="140" cy="222" r="4"/><circle cx="172" cy="168" r="4"/>
    <circle cx="220" cy="128" r="4"/><circle cx="285" cy="105" r="4"/><circle cx="345" cy="102" r="4"/>
  </g>
</svg>
  </div>
</body>
</html>
