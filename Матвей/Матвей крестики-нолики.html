<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-нолики против бота</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            margin: 0;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 35px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px black;
            letter-spacing: 2px;
        }

        .status {
            font-size: 1.4rem;
            margin: 15px 0 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 50px;
            display: inline-block;
            min-width: 200px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 10px auto 25px;
            max-width: 300px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            border: none;
            border-radius: 20px;
            font-size: 3.5rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .cell:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.03);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.5);
        }

        .cell:disabled {
            cursor: default;
            opacity: 0.9;
        }

        .cell.x-move {
            color: #ff4d4d;
            text-shadow: 0 0 15px #ff0000aa;
        }

        .cell.o-move {
            color: #4da6ff;
            text-shadow: 0 0 15px #0080ffaa;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 30px;
            padding: 12px 10px;
            backdrop-filter: blur(4px);
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-label {
            font-size: 0.8rem;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .score-value {
            font-size: 1.8rem;
            margin-top: 3px;
            line-height: 1;
        }

        button.restart-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            font-size: 1.1rem;
            padding: 10px 25px;
            border-radius: 40px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(4px);
            transition: 0.2s;
            letter-spacing: 0.5px;
        }

        button.restart-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.03);
        }

        @media (max-width: 450px) {
            .game-container {
                padding: 25px 15px;
            }
            .cell {
                font-size: 2.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>✖️⭕</h1>
        <div class="status" id="status">Твой ход (X)</div>
        <div class="board" id="board">
            <!-- Ячейки генерируются JS -->
        </div>
        <div class="scoreboard">
            <div class="score-item">
                <span class="score-label">Ты (X)</span>
                <span class="score-value" id="playerScore">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">Ничьи</span>
                <span class="score-value" id="drawScore">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">Бот (O)</span>
                <span class="score-value" id="botScore">0</span>
            </div>
        </div>
        <button class="restart-btn" id="restartButton">🔄 Новая игра</button>
    </div>

    <script>
        (function() {
            // ---------- DOM элементы ----------
            const boardEl = document.getElementById('board');
            const statusEl = document.getElementById('status');
            const playerScoreEl = document.getElementById('playerScore');
            const botScoreEl = document.getElementById('botScore');
            const drawScoreEl = document.getElementById('drawScore');
            const restartBtn = document.getElementById('restartButton');

            // ---------- Состояние игры ----------
            const HUMAN = 'X';
            const BOT = 'O';
            let board = Array(9).fill(null);
            let gameActive = true;
            let currentTurn = HUMAN; // человек всегда начинает
            let autoRestartTimeout = null;

            // Счёт
            let scores = {
                player: 0,
                bot: 0,
                draw: 0
            };

            // Выигрышные линии (индексы 0-8)
            const winLines = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // горизонтали
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // вертикали
                [0, 4, 8], [2, 4, 6]             // диагонали
            ];

            // ---------- Функции рендера ----------
            function renderBoard() {
                boardEl.innerHTML = '';
                for (let i = 0; i < 9; i++) {
                    const cell = document.createElement('button');
                    cell.className = 'cell';
                    cell.dataset.index = i;
                    cell.disabled = board[i] !== null || !gameActive || currentTurn !== HUMAN;
                    cell.textContent = board[i] || '';
                    if (board[i] === HUMAN) cell.classList.add('x-move');
                    if (board[i] === BOT) cell.classList.add('o-move');
                    cell.addEventListener('click', cellClickHandler);
                    boardEl.appendChild(cell);
                }
            }

            function updateStatusMessage(text) {
                statusEl.textContent = text;
            }

            function updateScoresDisplay() {
                playerScoreEl.textContent = scores.player;
                botScoreEl.textContent = scores.bot;
                drawScoreEl.textContent = scores.draw;
            }

            // ---------- Проверка окончания игры ----------
            function checkWinner(boardState) {
                for (const line of winLines) {
                    const [a, b, c] = line;
                    if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                        return boardState[a];
                    }
                }
                if (boardState.every(cell => cell !== null)) return 'draw';
                return null;
            }

            // ---------- Завершение игры ----------
            function endGame(result) {
                gameActive = false;
                // Обновляем счёт
                if (result === HUMAN) {
                    scores.player++;
                    updateStatusMessage('🎉 Ты победил! Новая игра...');
                } else if (result === BOT) {
                    scores.bot++;
                    updateStatusMessage('🤖 Бот выиграл! Новая игра...');
                } else if (result === 'draw') {
                    scores.draw++;
                    updateStatusMessage('🤝 Ничья! Новая игра...');
                }
                updateScoresDisplay();
                renderBoard(); // чтобы заблокировать клетки

                // Автоматический рестарт через 1.5 секунды (после любого исхода)
                if (autoRestartTimeout) clearTimeout(autoRestartTimeout);
                autoRestartTimeout = setTimeout(resetGame, 1500);
            }

            // ---------- Ход игрока ----------
            function cellClickHandler(e) {
                const index = parseInt(e.currentTarget.dataset.index, 10);
                if (!gameActive || currentTurn !== HUMAN || board[index] !== null) return;

                makeMove(index, HUMAN);

                // Если игра не закончилась, ход бота
                if (gameActive) {
                    currentTurn = BOT;
                    updateStatusMessage('Ход бота (O)...');
                    renderBoard();
                    // Небольшая задержка, чтобы бот "думал"
                    setTimeout(botMove, 300);
                }
            }

            function makeMove(index, player) {
                board[index] = player;
                const winner = checkWinner(board);
                if (winner) {
                    endGame(winner);
                } else if (winner === 'draw') {
                    endGame('draw');
                }
                // если игра продолжается, обновим только доску
                if (gameActive) renderBoard();
            }

            // ---------- Логика бота (средняя сложность) ----------
            function botMove() {
                if (!gameActive || currentTurn !== BOT) return;

                // 1. Может ли бот выиграть сейчас?
                const botWinMove = findWinningMove(BOT);
                if (botWinMove !== -1) {
                    makeMove(botWinMove, BOT);
                    finishBotTurn();
                    return;
                }

                // 2. Может ли человек выиграть следующим ходом? Блокируем
                const humanBlockMove = findWinningMove(HUMAN);
                if (humanBlockMove !== -1) {
                    makeMove(humanBlockMove, BOT);
                    finishBotTurn();
                    return;
                }

                // 3. Центр свободен?
                if (board[4] === null) {
                    makeMove(4, BOT);
                    finishBotTurn();
                    return;
                }

                // 4. Занимаем любой свободный угол (приоритет)
                const corners = [0, 2, 6, 8];
                const freeCorners = corners.filter(i => board[i] === null);
                if (freeCorners.length > 0) {
                    const randomCorner = freeCorners[Math.floor(Math.random() * freeCorners.length)];
                    makeMove(randomCorner, BOT);
                    finishBotTurn();
                    return;
                }

                // 5. Иначе любой свободный край (стороны)
                const sides = [1, 3, 5, 7];
                const freeSides = sides.filter(i => board[i] === null);
                if (freeSides.length > 0) {
                    const randomSide = freeSides[Math.floor(Math.random() * freeSides.length)];
                    makeMove(randomSide, BOT);
                    finishBotTurn();
                    return;
                }

                // (Теоретически сюда не дойдём, но на всякий случай)
                finishBotTurn();
            }

            function findWinningMove(player) {
                for (let i = 0; i < 9; i++) {
                    if (board[i] === null) {
                        board[i] = player;
                        const win = checkWinner(board);
                        board[i] = null; // откат
                        if (win === player) {
                            return i;
                        }
                    }
                }
                return -1;
            }

            function finishBotTurn() {
                if (!gameActive) return; // игра могла закончиться внутри makeMove
                // Если после хода бота игра не завершилась, передаём ход человеку
                if (gameActive) {
                    currentTurn = HUMAN;
                    updateStatusMessage('Твой ход (X)');
                    renderBoard();
                }
            }

            // ---------- Сброс игры ----------
            function resetGame() {
                // Отменяем запланированный авторестарт, если он есть
                if (autoRestartTimeout) {
                    clearTimeout(autoRestartTimeout);
                    autoRestartTimeout = null;
                }
                board = Array(9).fill(null);
                gameActive = true;
                currentTurn = HUMAN;
                updateStatusMessage('Твой ход (X)');
                renderBoard();
            }

            // Ручной рестарт (кнопка)
            restartBtn.addEventListener('click', () => {
                resetGame();
                // При ручном рестарте не сбрасываем счёт (можно добавить сброс счёта по двойному клику, но не обязательно)
            });

            // ---------- Инициализация ----------
            function initGame() {
                resetGame();
                updateScoresDisplay();
            }

            initGame();
        })();
    </script>
</body>
</html>
