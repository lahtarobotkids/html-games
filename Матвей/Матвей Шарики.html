<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Поймай шарики!</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --gold: #f7c948;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: none;
        }

        .game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 800px;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 10;
            pointer-events: none;
        }

        .hud-item {
            background: var(--surface);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 12px 28px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s;
        }

        .hud-label {
            color: #aaa;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }

        .hud-value {
            color: #fff;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
        }

        .hud-value.score {
            color: #4ef09d;
        }
        .hud-value.lives {
            color: #ff6b6b;
        }
        .hud-value.level {
            color: #ffb347;
        }
        .hud-value.combo {
            color: #c084fc;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: none;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 20;
        }

        .overlay.active {
            pointer-events: all;
        }

        .game-over-panel {
            background: var(--surface);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px 50px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
        }

        .overlay.active .game-over-panel {
            opacity: 1;
            transform: scale(1);
            display: block;
        }

        .game-over-panel h2 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .game-over-panel .final-score {
            color: #4ef09d;
            font-size: 4rem;
            font-weight: 900;
            line-height: 1;
            margin: 10px 0;
        }
        .game-over-panel .subtitle {
            color: #aaa;
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .btn {
            display: inline-block;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.25s;
            text-transform: uppercase;
            background: linear-gradient(135deg, #f7c948, #f09b2c);
            color: #1a1a2e;
            box-shadow: 0 8px 25px rgba(247, 201, 72, 0.4);
            pointer-events: all;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 35px rgba(247, 201, 72, 0.55);
        }
        .btn:active {
            transform: scale(0.95);
            transition: transform 0.1s;
        }

        .combo-pop {
            position: absolute;
            pointer-events: none;
            font-weight: 900;
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            animation: popUp 0.8s ease-out forwards;
            z-index: 25;
        }
        @keyframes popUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1.6);
            }
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            .hud {
                gap: 10px;
                top: 10px;
            }
            .hud-item {
                padding: 8px 16px;
                border-radius: 14px;
            }
            .hud-value {
                font-size: 1.4rem;
            }
            .hud-label {
                font-size: 0.6rem;
                letter-spacing: 1px;
            }
            .game-over-panel {
                padding: 25px 30px;
                border-radius: 20px;
            }
            .game-over-panel h2 {
                font-size: 1.6rem;
            }
            .game-over-panel .final-score {
                font-size: 2.8rem;
            }
            .btn {
                padding: 14px 30px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper" id="gameWrapper">
        <!-- HUD -->
        <div class="hud">
            <div class="hud-item">
                <div class="hud-label">Очки</div>
                <div class="hud-value score" id="scoreDisplay">0</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">Жизни</div>
                <div class="hud-value lives" id="livesDisplay">❤️❤️❤️</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">Уровень</div>
                <div class="hud-value level" id="levelDisplay">1</div>
            </div>
            <div class="hud-item" id="comboHud" style="opacity:0; transition: opacity 0.3s;">
                <div class="hud-label">Комбо</div>
                <div class="hud-value combo" id="comboDisplay">x1</div>
            </div>
        </div>

        <!-- Игровой холст -->
        <canvas id="gameCanvas"></canvas>

        <!-- Оверлей Game Over -->
        <div class="overlay" id="overlay">
            <div class="game-over-panel" id="gameOverPanel">
                <h2>🎯 Игра окончена!</h2>
                <div class="final-score" id="finalScore">0</div>
                <div class="subtitle">очков набрано</div>
                <button class="btn" id="restartBtn">🔄 Играть снова</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ─────────────────────────────────────
            // DOM-элементы
            // ─────────────────────────────────────
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('gameWrapper');
            const overlay = document.getElementById('overlay');
            const gameOverPanel = document.getElementById('gameOverPanel');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const livesDisplay = document.getElementById('livesDisplay');
            const levelDisplay = document.getElementById('levelDisplay');
            const comboDisplay = document.getElementById('comboDisplay');
            const comboHud = document.getElementById('comboHud');
            const finalScore = document.getElementById('finalScore');
            const restartBtn = document.getElementById('restartBtn');

            // ─────────────────────────────────────
            // Состояние игры
            // ─────────────────────────────────────
            let score = 0;
            let lives = 3;
            let level = 1;
            let comboCount = 0;
            let comboTimer = 0;
            const COMBO_TIMEOUT = 120; // кадров (~2 секунды при 60fps)
            let gameRunning = true;
            let gameOverTriggered = false;

            // ─────────────────────────────────────
            // Размеры канваса
            // ─────────────────────────────────────
            let W, H;

            function resizeCanvas() {
                const rect = wrapper.getBoundingClientRect();
                W = rect.width;
                H = rect.height;
                canvas.width = W * (window.devicePixelRatio || 1);
                canvas.height = H * (window.devicePixelRatio || 1);
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
                // Обновляем позицию платформы при ресайзе
                paddle.y = H - 70;
                paddle.width = Math.max(80, Math.min(160, W * 0.22));
            }

            // ─────────────────────────────────────
            // Платформа (ловец)
            // ─────────────────────────────────────
            const paddle = {
                x: 0,
                y: 0,
                width: 140,
                height: 18,
                targetX: 0,
                color: '#ffffff',
                glowColor: 'rgba(255,255,255,0.6)',
                trail: [],
                maxTrail: 8,
            };

            // ─────────────────────────────────────
            // Шарики
            // ─────────────────────────────────────
            const balls = [];
            const particles = [];
            const floatingTexts = [];

            // Цвета шариков (весёлая палитра)
            const ballColors = [
                { fill: '#ff6b6b', glow: '#ff4444', points: 10, name: 'красный' },
                { fill: '#4ecdc4', glow: '#2eccb0', points: 10, name: 'бирюзовый' },
                { fill: '#ffe66d', glow: '#ffcc00', points: 15, name: 'золотой' },
                { fill: '#a29bfe', glow: '#7c6ff7', points: 10, name: 'фиолетовый' },
                { fill: '#fd79a8', glow: '#e84393', points: 15, name: 'розовый' },
                { fill: '#00cec9', glow: '#00b5b0', points: 20, name: 'мятный' },
                { fill: '#fab1a0', glow: '#e17055', points: 25, name: 'коралловый' },
                { fill: '#81ecec', glow: '#5dc9c9', points: 20, name: 'небесный' },
                { fill: '#ff9ff3', glow: '#f368e0', points: 30, name: 'малиновый' },
                { fill: '#feca57', glow: '#ff9f43', points: 25, name: 'оранжевый' },
            ];

            // Специальные шарики (редкие)
            const specialBalls = [
                { fill: '#ffd700', glow: '#fff700', points: 50, name: '⭐ СУПЕР', radiusBonus: 6,
                pulseSpeed: 0.15 },
                { fill: '#ff0040', glow: '#ff2060', points: -20, name: '💀 МИНУС', radiusBonus: 2, pulseSpeed: 0.2,
                    evil: true },
            ];

            // ─────────────────────────────────────
            // Мышь / касание
            // ─────────────────────────────────────
            let mouseX = W / 2;
            let mouseActive = false;

            function updateMouseFromEvent(e) {
                const rect = canvas.getBoundingClientRect();
                mouseX = e.clientX - rect.left;
                mouseActive = true;
            }

            canvas.addEventListener('mousemove', (e) => {
                updateMouseFromEvent(e);
            });
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                updateMouseFromEvent(e.touches[0]);
            }, { passive: false });
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                updateMouseFromEvent(e.touches[0]);
            }, { passive: false });
            canvas.addEventListener('mouseenter', (e) => {
                mouseActive = true;
                mouseX = e.clientX - canvas.getBoundingClientRect().left;
            });
            canvas.addEventListener('mouseleave', () => {
                mouseActive = false;
            });

            // Начальная позиция
            paddle.x = W / 2;
            paddle.targetX = W / 2;

            // ─────────────────────────────────────
            // Спавн шарика
            // ─────────────────────────────────────
            function spawnBall(forceSpecial = false) {
                const isSpecial = forceSpecial || (Math.random() < 0.06 && level >= 2);
                let template;
                if (isSpecial) {
                    template = specialBalls[Math.floor(Math.random() * specialBalls.length)];
                } else {
                    template = ballColors[Math.floor(Math.random() * ballColors.length)];
                }

                const baseRadius = 12 + Math.random() * 14;
                const radius = template.radiusBonus ? baseRadius + template.radiusBonus : baseRadius;
                const baseSpeed = 1.5 + level * 0.6 + Math.random() * 2.5;
                const speed = template.evil ? baseSpeed * 1.6 : baseSpeed;

                const ball = {
                    x: radius + Math.random() * (W - radius * 2),
                    y: -radius - Math.random() * 120,
                    radius: radius,
                    speed: speed,
                    color: template.fill,
                    glow: template.glow,
                    points: template.points || 10,
                    name: template.name || '',
                    isSpecial: isSpecial,
                    evil: template.evil || false,
                    pulseSpeed: template.pulseSpeed || 0,
                    pulseOffset: Math.random() * Math.PI * 2,
                    wobbleAmp: Math.random() * 0.4,
                    wobbleFreq: 0.02 + Math.random() * 0.03,
                    wobbleOffset: Math.random() * Math.PI * 2,
                    sparkTimer: 0,
                };
                balls.push(ball);
            }

            // ─────────────────────────────────────
            // Частицы (взрыв при поимке)
            // ─────────────────────────────────────
            function spawnParticles(x, y, color, count = 18) {
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.4;
                    const speed = 3 + Math.random() * 9;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 2,
                        life: 1,
                        decay: 0.02 + Math.random() * 0.04,
                        radius: 2 + Math.random() * 5,
                        color: color,
                    });
                }
            }

            function spawnFloatingText(x, y, text, color = '#fff') {
                floatingTexts.push({
                    x: x,
                    y: y,
                    text: text,
                    life: 1,
                    decay: 0.018,
                    color: color,
                });
            }

            // ─────────────────────────────────────
            // Сброс игры
            // ─────────────────────────────────────
            function resetGame() {
                score = 0;
                lives = 3;
                level = 1;
                comboCount = 0;
                comboTimer = 0;
                gameRunning = true;
                gameOverTriggered = false;
                balls.length = 0;
                particles.length = 0;
                floatingTexts.length = 0;
                paddle.trail.length = 0;
                paddle.x = W / 2;
                paddle.targetX = W / 2;
                updateHUD();
                overlay.classList.remove('active');
                gameOverPanel.style.display = 'none';
                // Пара стартовых шариков
                for (let i = 0; i < 3; i++) {
                    spawnBall();
                }
            }

            function triggerGameOver() {
                if (gameOverTriggered) return;
                gameOverTriggered = true;
                gameRunning = false;
                finalScore.textContent = score;
                overlay.classList.add('active');
                gameOverPanel.style.display = 'block';
                // Взрыв всех оставшихся шариков
                for (const ball of balls) {
                    spawnParticles(ball.x, ball.y, ball.color, 30);
                }
                balls.length = 0;
            }

            function loseLife() {
                if (!gameRunning) return;
                lives--;
                comboCount = 0;
                comboTimer = 0;
                updateHUD();
                // Эффект тряски
                wrapper.style.transform = 'translateX(-8px)';
                setTimeout(() => { wrapper.style.transform = 'translateX(6px)'; }, 60);
                setTimeout(() => { wrapper.style.transform = 'translateX(-4px)'; }, 120);
                setTimeout(() => { wrapper.style.transform = 'translateX(0)'; }, 180);

                if (lives <= 0) {
                    triggerGameOver();
                }
            }

            function addScore(points, x, y, ballName) {
                if (!gameRunning) return;
                comboCount++;
                comboTimer = COMBO_TIMEOUT;
                const comboMultiplier = Math.min(comboCount, 10);
                const earnedPoints = points * comboMultiplier;
                score += earnedPoints;
                updateHUD();
                spawnParticles(x, y, '#ffffff', 14 + comboCount * 2);
                const txt = comboMultiplier > 1 ? `+${earnedPoints} x${comboMultiplier}` : `+${earnedPoints}`;
                spawnFloatingText(x, y - 15, txt, '#4ef09d');
                if (ballName) {
                    spawnFloatingText(x, y - 35, ballName, '#ffd700');
                }
                // Повышение уровня
                const newLevel = Math.floor(score / 150) + 1;
                if (newLevel > level) {
                    level = newLevel;
                    spawnFloatingText(W / 2, H / 2, `УРОВЕНЬ ${level}! 🚀`, '#ffb347');
                    // Бонусная жизнь каждый 3 уровня
                    if (level % 3 === 0 && lives < 5) {
                        lives++;
                        spawnFloatingText(W / 2, H / 2 + 40, '+1 жизнь 💖', '#ff6b6b');
                    }
                }
            }

            function updateHUD() {
                scoreDisplay.textContent = score;
                const hearts = ['🖤', '🖤', '🖤', '🖤', '🖤'];
                for (let i = 0; i < 5; i++) {
                    hearts[i] = i < lives ? '❤️' : '🖤';
                }
                livesDisplay.textContent = hearts.slice(0, Math.max(lives, 0)).join('');
                if (lives <= 0) livesDisplay.textContent = '💔';
                levelDisplay.textContent = level;
                if (comboCount > 1 && comboTimer > 0) {
                    comboHud.style.opacity = '1';
                    comboDisplay.textContent = `x${Math.min(comboCount, 10)}`;
                } else {
                    comboHud.style.opacity = '0';
                }
            }

            // ─────────────────────────────────────
            // Отрисовка
            // ─────────────────────────────────────
            function drawBackground() {
                // Градиентный фон
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#0f0c29');
                grad.addColorStop(0.5, '#1a1a3e');
                grad.addColorStop(1, '#24243e');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // Звёздочки на фоне
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                const starSeed = 42;
                for (let i = 0; i < 80; i++) {
                    const sx = ((i * 137 + starSeed) % W);
                    const sy = ((i * 251 + starSeed * 3 + Date.now() * 0.005) % H);
                    const sr = 0.5 + (i % 3) * 0.6;
                    ctx.beginPath();
                    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawPaddle() {
                // Шлейф
                paddle.trail.push({ x: paddle.x, y: paddle.y, width: paddle.width });
                if (paddle.trail.length > paddle.maxTrail) paddle.trail.shift();

                for (let i = 0; i < paddle.trail.length; i++) {
                    const t = paddle.trail[i];
                    const alpha = (i / paddle.trail.length) * 0.35;
                    const w = t.width * (0.7 + (i / paddle.trail.length) * 0.3);
                    ctx.fillStyle = `rgba(180,220,255,${alpha})`;
                    roundRect(t.x - w / 2, t.y - paddle.height / 2, w, paddle.height, paddle.height / 2);
                    ctx.fill();
                }

                // Основная платформа
                const padGrad = ctx.createLinearGradient(paddle.x - paddle.width / 2, paddle.y,
                    paddle.x + paddle.width / 2, paddle.y);
                padGrad.addColorStop(0, '#c8e6ff');
                padGrad.addColorStop(0.3, '#ffffff');
                padGrad.addColorStop(0.7, '#e0f0ff');
                padGrad.addColorStop(1, '#a0d0ff');
                ctx.fillStyle = padGrad;
                roundRect(paddle.x - paddle.width / 2, paddle.y - paddle.height / 2,
                    paddle.width, paddle.height, paddle.height / 2);
                ctx.fill();

                // Блик
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                roundRect(paddle.x - paddle.width / 2 + 8, paddle.y - paddle.height / 2 + 3,
                    paddle.width - 16, paddle.height * 0.35, 6);
                ctx.fill();

                // Свечение
                ctx.shadowColor = 'rgba(180,210,255,0.8)';
                ctx.shadowBlur = 18;
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 2;
                roundRect(paddle.x - paddle.width / 2, paddle.y - paddle.height / 2,
                    paddle.width, paddle.height, paddle.height / 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            function drawBall(ball) {
                const pulse = ball.pulseSpeed ?
                    1 + Math.sin(Date.now() * ball.pulseSpeed + ball.pulseOffset) * 0.2 :
                    1;
                const r = ball.radius * pulse;

                // Свечение
                const glowGrad = ctx.createRadialGradient(ball.x, ball.y, r * 0.4, ball.x, ball.y, r * 2.2);
                glowGrad.addColorStop(0, ball.glow);
                glowGrad.addColorStop(0.5, ball.glow + '88');
                glowGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, r * 2.2, 0, Math.PI * 2);
                ctx.fill();

                // Основной шар
                const ballGrad = ctx.createRadialGradient(ball.x - r * 0.3, ball.y - r * 0.35, r * 0.1, ball.x, ball.y,
                r);
                ballGrad.addColorStop(0, '#ffffff');
                ballGrad.addColorStop(0.35, ball.color);
                ballGrad.addColorStop(1, ball.glow);
                ctx.fillStyle = ballGrad;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2);
                ctx.fill();

                // Блик
                ctx.fillStyle = 'rgba(255,255,255,0.55)';
                ctx.beginPath();
                ctx.arc(ball.x - r * 0.25, ball.y - r * 0.3, r * 0.35, 0, Math.PI * 2);
                ctx.fill();

                // Искорки для специальных
                if (ball.isSpecial && !ball.evil) {
                    ctx.fillStyle = '#fff';
                    const sparkCount = 4;
                    for (let i = 0; i < sparkCount; i++) {
                        const angle = Date.now() * 0.004 + (Math.PI * 2 / sparkCount) * i;
                        const sx = ball.x + Math.cos(angle) * (r + 6);
                        const sy = ball.y + Math.sin(angle) * (r + 6);
                        ctx.beginPath();
                        ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                if (ball.evil) {
                    // Красные предупреждающие искры
                    ctx.fillStyle = '#ff0000';
                    const sparkCount = 6;
                    for (let i = 0; i < sparkCount; i++) {
                        const angle = Date.now() * 0.006 + (Math.PI * 2 / sparkCount) * i;
                        const sx = ball.x + Math.cos(angle) * (r + 5);
                        const sy = ball.y + Math.sin(angle) * (r + 5);
                        ctx.beginPath();
                        ctx.arc(sx, sy, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            function drawParticles() {
                for (const p of particles) {
                    const alpha = p.life;
                    ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('rgb',
                        'rgba');
                    if (p.color.startsWith('#')) {
                        const hex = p.color;
                        const r = parseInt(hex.slice(1, 3), 16);
                        const g = parseInt(hex.slice(3, 5), 16);
                        const b = parseInt(hex.slice(5, 7), 16);
                        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
                    }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
                    ctx.fill();
                }
                for (const ft of floatingTexts) {
                    ctx.fillStyle = ft.color.replace(')', `, ${ft.life})`).replace('rgb', 'rgba');
                    if (ft.color.startsWith('#')) {
                        const hex = ft.color;
                        const r = parseInt(hex.slice(1, 3), 16);
                        const g = parseInt(hex.slice(3, 5), 16);
                        const b = parseInt(hex.slice(5, 7), 16);
                        ctx.fillStyle = `rgba(${r},${g},${b},${ft.life})`;
                    }
                    ctx.font = 'bold 16px "Segoe UI", system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(ft.text, ft.x, ft.y);
                }
            }

            function roundRect(x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
            }

            function drawAll() {
                ctx.clearRect(0, 0, W, H);
                drawBackground();
                for (const ball of balls) {
                    drawBall(ball);
                }
                drawParticles();
                drawPaddle();

                // Индикатор комбо над платформой
                if (comboCount > 1 && comboTimer > 0 && gameRunning) {
                    const alpha = Math.min(1, comboTimer / 60);
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.font = 'bold 18px "Segoe UI", system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`🔥 x${Math.min(comboCount, 10)}`, paddle.x, paddle.y - 35);
                }
            }

            // ─────────────────────────────────────
            // Игровой цикл
            // ─────────────────────────────────────
            function update() {
                if (!gameRunning) {
                    // Доигрываем частицы
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.15;
                        p.life -= p.decay;
                        if (p.life <= 0) particles.splice(i, 1);
                    }
                    for (let i = floatingTexts.length - 1; i >= 0; i--) {
                        const ft = floatingTexts[i];
                        ft.y -= 1.5;
                        ft.life -= ft.decay;
                        if (ft.life <= 0) floatingTexts.splice(i, 1);
                    }
                    return;
                }

                // Платформа следует за мышью
                if (mouseActive) {
                    paddle.targetX = mouseX;
                }
                const paddleSpeed = 0.22;
                paddle.x += (paddle.targetX - paddle.x) * paddleSpeed;
                // Ограничение
                paddle.x = Math.max(paddle.width / 2, Math.min(W - paddle.width / 2, paddle.x));

                // Комбо-таймер
                if (comboTimer > 0) {
                    comboTimer--;
                    if (comboTimer <= 0) {
                        comboCount = 0;
                        updateHUD();
                    }
                }

                // Спавн шариков
                const spawnInterval = Math.max(18, 55 - level * 4);
                if (Math.random() < 1 / spawnInterval && balls.length < 20 + level * 2) {
                    spawnBall();
                }
                // Гарантированный спавн если шариков мало
                if (balls.length < 2 && gameRunning) {
                    spawnBall();
                }

                // Обновление шариков
                for (let i = balls.length - 1; i >= 0; i--) {
                    const ball = balls[i];
                    ball.y += ball.speed;
                    ball.x += Math.sin(Date.now() * ball.wobbleFreq + ball.wobbleOffset) * ball.wobbleAmp;
                    ball.sparkTimer++;

                    // Проверка: пойман ли платформой
                    const padLeft = paddle.x - paddle.width / 2;
                    const padRight = paddle.x + paddle.width / 2;
                    const padTop = paddle.y - paddle.height / 2 - ball.radius * 0.7;
                    const padBottom = paddle.y + paddle.height / 2 + ball.radius * 0.3;

                    if (
                        ball.y + ball.radius > padTop &&
                        ball.y - ball.radius < padBottom &&
                        ball.x + ball.radius > padLeft &&
                        ball.x - ball.radius < padRight
                    ) {
                        // Пойман!
                        if (ball.evil) {
                            // Злой шарик — отнимает очки
                            score = Math.max(0, score + ball.points);
                            comboCount = 0;
                            comboTimer = 0;
                            spawnParticles(ball.x, ball.y, '#ff0000', 25);
                            spawnFloatingText(ball.x, ball.y, `${ball.points} 😈`, '#ff4444');
                            wrapper.style.transform = 'translateY(5px)';
                            setTimeout(() => { wrapper.style.transform = 'translateY(0)'; }, 100);
                        } else {
                            addScore(ball.points, ball.x, ball.y, ball.name || '');
                        }
                        balls.splice(i, 1);
                        updateHUD();
                        continue;
                    }

                    // Проверка: упал ниже экрана
                    if (ball.y - ball.radius > H + 30) {
                        balls.splice(i, 1);
                        if (!ball.evil) {
                            loseLife();
                            spawnParticles(ball.x, H, '#ff4444', 12);
                            spawnFloatingText(ball.x, H - 20, 'Промах! 💨', '#ff6b6b');
                        }
                        updateHUD();
                    }
                }

                // Обновление частиц
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.12;
                    p.life -= p.decay;
                    if (p.life <= 0) particles.splice(i, 1);
                }
                for (let i = floatingTexts.length - 1; i >= 0; i--) {
                    const ft = floatingTexts[i];
                    ft.y -= 1.8;
                    ft.life -= ft.decay;
                    if (ft.life <= 0) floatingTexts.splice(i, 1);
                }
            }

            function gameLoop() {
                update();
                drawAll();
                requestAnimationFrame(gameLoop);
            }

            // ─────────────────────────────────────
            // Кнопка рестарта
            // ─────────────────────────────────────
            restartBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                resetGame();
            });
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    resetGame();
                }
            });

            // ─────────────────────────────────────
            // Клавиатура (стрелки как альтернатива)
            // ─────────────────────────────────────
            const keys = {};
            window.addEventListener('keydown', (e) => {
                keys[e.key] = true;
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                    mouseActive = true;
                }
                if (e.key === 'r' || e.key === 'R') {
                    if (!gameRunning) resetGame();
                }
            });
            window.addEventListener('keyup', (e) => {
                keys[e.key] = false;
            });

            // Дополнительный цикл для клавиатуры
            function keyboardUpdate() {
                if (keys['ArrowLeft']) {
                    paddle.targetX -= 8;
                    mouseActive = true;
                }
                if (keys['ArrowRight']) {
                    paddle.targetX += 8;
                    mouseActive = true;
                }
                paddle.targetX = Math.max(paddle.width / 2, Math.min(W - paddle.width / 2, paddle.targetX));
                requestAnimationFrame(() => {
                    keyboardUpdate();
                });
            }
            keyboardUpdate();

            // ─────────────────────────────────────
            // Запуск
            // ─────────────────────────────────────
            function init() {
                resizeCanvas();
                paddle.y = H - 70;
                paddle.width = Math.max(80, Math.min(160, W * 0.22));
                paddle.x = W / 2;
                paddle.targetX = W / 2;
                resetGame();
                updateHUD();
                gameLoop();
            }

            window.addEventListener('resize', () => {
                resizeCanvas();
                paddle.y = H - 70;
                paddle.width = Math.max(80, Math.min(160, W * 0.22));
            });

            init();

            console.log('🎨 Игра "Поймай шарики!" запущена!');
            console.log('🖱️  Управление: двигайте мышью / пальцем');
            console.log('⌨️  Или стрелками ← → на клавиатуре');
            console.log('🔄 R — перезапуск после game over');
            console.log('💡 Ловите шарики платформой, набирайте комбо!');
            console.log('⚠️  Остерегайтесь красных "злых" шаров — они отнимают очки!');
            console.log('⭐ Золотые шары дают больше очков!');
        })();
    </script>
</body>
</html>
