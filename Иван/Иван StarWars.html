<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, shrink-to-fit=yes">
    <title>Звёздные Войны: Сага Брейнрота 🚀 (исправлено)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            touch-action: none;
            user-select: none;
        }
        canvas {
            border: 2px solid #ffe81f;
            box-shadow: 0 0 30px #ff6600;
            background: #000;
            max-width: 100vw;
            max-height: 100vh;
        }
        #ui-touch-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            pointer-events: none;
            z-index: 10;
        }
        .touch-btn {
            pointer-events: auto;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 3px solid #ffe81f;
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 10px black;
            backdrop-filter: blur(5px);
            touch-action: none;
            user-select: none;
        }
        .touch-btn:active {
            background: rgba(255,255,0,0.5);
        }
        #joystick-area {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 2px solid #0af;
            pointer-events: auto;
            touch-action: none;
        }
        @media (min-width: 800px) {
            #ui-touch-controls, #joystick-area {
                display: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="joystick-area"></div>
    <div id="ui-touch-controls">
        <div class="touch-btn" id="btn-fire">🔥</div>
        <div class="touch-btn" id="btn-torpedo">💣</div>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const W = 800, H = 600;
            canvas.width = W;
            canvas.height = H;

            function resizeCanvas() {
                const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
                canvas.style.width = W * scale + 'px';
                canvas.style.height = H * scale + 'px';
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            let audioCtx = null;
            function initAudio() {
                if (!audioCtx) {
                    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
                }
            }
            function beep(freq, duration, type = 'square', vol = 0.08) {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.value = vol;
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch(e) {}
            }

            const STATE = { MENU: 'menu', MAP: 'map', BATTLE: 'battle', SHOP: 'shop', GAMEOVER: 'gameover', VICTORY: 'victory' };
            let gameState = STATE.MENU;

            const player = {
                x: W/2, y: H - 100,
                vx: 0, vy: 0,
                width: 40, height: 40,
                speed: 5,
                hull: 100, maxHull: 100,
                shield: 50, maxShield: 50,
                shieldRegen: 0.02,
                laserDamage: 15,
                fireRate: 12,
                fireCooldown: 0,
                torpedoes: 2,
                torpedoDamage: 80,
                credits: 0, xp: 0, level: 1, xpToNext: 100,
                weaponLevel: 1, speedLevel: 1, shieldLevel: 1, hullLevel: 1, torpedoLevel: 1
            };

            const keys = {};
            window.addEventListener('keydown', e => {
                keys[e.key] = true;
                if ([' ', 'Spacebar', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'W', 's', 'S', 'a', 'A', 'd', 'D', 'q', 'Q', 'm', 'M', 'Enter'].includes(e.key)) {
                    e.preventDefault();
                }
                if (e.key === ' ' || e.key === 'Spacebar') {
                    initAudio();
                    if (gameState === STATE.MENU) startGame();
                    else if (gameState === STATE.GAMEOVER || gameState === STATE.VICTORY) resetGame();
                }
                if (e.key === 'q' || e.key === 'Q') { if (gameState === STATE.BATTLE) fireTorpedo(); }
            });
            window.addEventListener('keyup', e => {
                keys[e.key] = false;
                if ([' ', 'Spacebar', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'W', 's', 'S', 'a', 'A', 'd', 'D', 'q', 'Q', 'm', 'M', 'Enter'].includes(e.key)) {
                    e.preventDefault();
                }
            });

            let joystick = { active: false, startX: 0, startY: 0, dx: 0, dy: 0 };
            const joystickArea = document.getElementById('joystick-area');
            const btnFire = document.getElementById('btn-fire');
            const btnTorpedo = document.getElementById('btn-torpedo');

            joystickArea.addEventListener('touchstart', e => {
                e.preventDefault();
                initAudio();
                const rect = joystickArea.getBoundingClientRect();
                const touch = e.touches[0];
                joystick.active = true;
                joystick.startX = touch.clientX - rect.left - rect.width/2;
                joystick.startY = touch.clientY - rect.top - rect.height/2;
                joystick.dx = 0; joystick.dy = 0;
            });
            joystickArea.addEventListener('touchmove', e => {
                e.preventDefault();
                if (!joystick.active) return;
                const rect = joystickArea.getBoundingClientRect();
                const touch = e.touches[0];
                joystick.dx = (touch.clientX - rect.left - rect.width/2) - joystick.startX;
                joystick.dy = (touch.clientY - rect.top - rect.height/2) - joystick.startY;
            });
            joystickArea.addEventListener('touchend', e => {
                e.preventDefault();
                joystick.active = false;
                joystick.dx = 0; joystick.dy = 0;
            });

            let touchFireActive = false;
            btnFire.addEventListener('touchstart', e => { e.preventDefault(); initAudio(); touchFireActive = true; if (gameState === STATE.MENU) startGame(); else if (gameState === STATE.GAMEOVER || gameState === STATE.VICTORY) resetGame(); });
            btnFire.addEventListener('touchend', e => { e.preventDefault(); touchFireActive = false; });
            btnFire.addEventListener('touchcancel', e => { e.preventDefault(); touchFireActive = false; });
            btnTorpedo.addEventListener('touchstart', e => { e.preventDefault(); initAudio(); if (gameState === STATE.BATTLE) fireTorpedo(); });

            canvas.addEventListener('click', e => {
                initAudio();
                const rect = canvas.getBoundingClientRect();
                const scaleX = W / rect.width;
                const scaleY = H / rect.height;
                const mx = (e.clientX - rect.left) * scaleX;
                const my = (e.clientY - rect.top) * scaleY;
                if (gameState === STATE.MAP) {
                    let y = 90;
                    for (let i = 0; i < locations.length; i++) {
                        if (mx > W/2-120 && mx < W/2+120 && my > y-15 && my < y+35) { startMission(locations[i]); break; }
                        y += 60;
                    }
                } else if (gameState === STATE.SHOP) {
                    let y = 120;
                    for (let i = 0; i < 6; i++) {
                        if (my > y-15 && my < y+15) { buyUpgrade(i); break; }
                        y += 50;
                    }
                }
            });

            let playerBullets = [], enemyBullets = [], enemies = [], particles = [];
            const locations = [
                { id: 0, name: 'Татуин', color: '#e6b85c', enemyTypes: ['tie_fighter'], boss: 'sandcrawler', missionText: 'Очистить орбиту', rewardCredits: 150, rewardXP: 80, requiredLevel: 1 },
                { id: 1, name: 'Хот', color: '#a0d8ef', enemyTypes: ['tie_bomber', 'atat_gun'], boss: 'atat_walker', missionText: 'Защита Эхо-Базы', rewardCredits: 250, rewardXP: 120, requiredLevel: 2 },
                { id: 2, name: 'Беспин', color: '#ffb347', enemyTypes: ['cloud_car', 'tie_interceptor'], boss: 'boba_fett', missionText: 'Побег из Облачного города', rewardCredits: 350, rewardXP: 160, requiredLevel: 3 },
                { id: 3, name: 'Эндор', color: '#2e8b57', enemyTypes: ['scout_trooper', 'tie_defender'], boss: 'imperial_shuttle', missionText: 'Уничтожить щит', rewardCredits: 450, rewardXP: 200, requiredLevel: 4 },
                { id: 4, name: 'Звезда Смерти II', color: '#555', enemyTypes: ['elite_tie'], boss: 'vader_tie', missionText: 'Атака на Звезду Смерти', rewardCredits: 600, rewardXP: 250, requiredLevel: 5 },
                { id: 5, name: 'Экзекутор', color: '#8b0000', enemyTypes: ['royal_guard', 'tie_phantom'], boss: 'executor', missionText: 'Последний бой', rewardCredits: 1000, rewardXP: 400, requiredLevel: 6 }
            ];
            let currentLocation = null, missionPhase = 'waves', waveNumber = 0, enemiesRemaining = 0, bossActive = false, bossEnemy = null;
            let messageText = '', messageTimer = 0, shopSelected = 0;

            // Переработанный спавн: без таймеров
            let spawnQueue = 0; // сколько врагов ещё нужно заспавнить в текущей волне
            let spawnCooldown = 0; // кадры до следующего спавна

            const stars = Array.from({length: 150}, () => ({ x: Math.random()*W, y: Math.random()*H, size: Math.random()*2+0.5, speed: Math.random()*0.5+0.2 }));

            function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
            function dist(a,b) { return Math.hypot(a.x-b.x, a.y-b.y); }
            function spawnParticles(x,y,color,count=5) {
                for(let i=0;i<count;i++) particles.push({x,y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:20+Math.random()*10,color,size:1+Math.random()*3});
            }
            function addMessage(t,d=80){messageText=t;messageTimer=d;}

            function spawnEnemy(type) {
                let hp=30,sp=1.5,dmg=10,sc=20,col='#f00',size=30,beh='chase',sd=60;
                switch(type){
                    case'tie_fighter':hp=25;sp=2;dmg=8;col='#888';size=25;break;
                    case'tie_bomber':hp=40;sp=1.2;dmg=15;col='#666';size=35;beh='bomber';break;
                    case'atat_gun':hp=50;sp=0.8;dmg=12;col='#aaa';size=40;beh='ground';break;
                    case'cloud_car':hp=30;sp=2.2;dmg=9;col='#ff8c00';size=28;break;
                    case'tie_interceptor':hp=35;sp=2.5;dmg=11;col='#c00';size=27;break;
                    case'scout_trooper':hp=45;sp=1.8;dmg=10;col='#6b8e23';size=32;break;
                    case'tie_defender':hp=55;sp=2;dmg=13;col='#4682b4';size=33;break;
                    case'elite_tie':hp=60;sp=2.3;dmg=14;col='#b22222';size=34;break;
                    case'royal_guard':hp=70;sp=2.1;dmg=15;col='#dc143c';size=36;break;
                    case'tie_phantom':hp=80;sp=2.4;dmg=16;col='#4b0082';size=35;break;
                }
                enemies.push({x:W+50,y:50+Math.random()*(H-100),hp,maxHp:hp,speed:sp,damage:dmg,color:col,size,behavior:beh,shootDelay:sd,shootTimer:Math.random()*sd,scoreValue:sc,type});
            }

            function spawnBoss(type) {
                let boss=null;
                switch(type){
                    case'sandcrawler':boss={x:W/2,y:100,hp:400,maxHp:400,speed:0.5,damage:20,color:'#8b4513',size:70,behavior:'boss_strafe',shootDelay:45,shootTimer:0};break;
                    case'atat_walker':boss={x:W/2,y:80,hp:550,maxHp:550,speed:0.7,damage:25,color:'#b0c4de',size:75,behavior:'boss_ground',shootDelay:40,shootTimer:0};break;
                    case'boba_fett':boss={x:W/2,y:100,hp:500,maxHp:500,speed:2,damage:22,color:'#2e8b57',size:55,behavior:'boss_chase',shootDelay:30,shootTimer:0};break;
                    case'imperial_shuttle':boss={x:W/2,y:100,hp:600,maxHp:600,speed:1.2,damage:28,color:'#708090',size:65,behavior:'boss_strafe',shootDelay:35,shootTimer:0};break;
                    case'vader_tie':boss={x:W/2,y:100,hp:750,maxHp:750,speed:2.5,damage:32,color:'#1a1a1a',size:60,behavior:'boss_chase',shootDelay:25,shootTimer:0};break;
                    case'executor':boss={x:W/2,y:120,hp:1200,maxHp:1200,speed:0.8,damage:40,color:'#4a0000',size:90,behavior:'boss_final',shootDelay:20,shootTimer:0};break;
                }
                if(boss){boss.active=true;enemies=[boss];bossEnemy=boss;bossActive=true;missionPhase='boss';spawnQueue=0;addMessage('⚠️ БОСС: '+type.toUpperCase()+' ⚠️',120);beep(300,0.3,'sawtooth',0.12);}
            }

            function startGame(){resetPlayer();gameState=STATE.MAP;beep(500,0.1);}
            function resetPlayer(){
                player.x=W/2;player.y=H-100;player.hull=player.maxHull;player.shield=player.maxShield;player.fireCooldown=0;player.torpedoes=2;
                playerBullets=[];enemyBullets=[];enemies=[];particles=[];player.credits=0;player.xp=0;player.level=1;player.xpToNext=100;
                player.weaponLevel=player.speedLevel=player.shieldLevel=player.hullLevel=player.torpedoLevel=1;
                player.maxHull=100;player.maxShield=50;player.speed=5;player.laserDamage=15;player.torpedoDamage=80;
                player.hull=player.maxHull;player.shield=player.maxShield;bossActive=false;bossEnemy=null;missionPhase='waves';
            }
            function resetGame(){resetPlayer();gameState=STATE.MAP;currentLocation=null;beep(400,0.2);}

            function startMission(loc){
                if(player.level<loc.requiredLevel){addMessage('Требуется уровень '+loc.requiredLevel+'!',60);beep(200,0.3);return;}
                currentLocation=loc;enemies=[];playerBullets=[];enemyBullets=[];particles=[];missionPhase='waves';waveNumber=0;bossActive=false;bossEnemy=null;
                spawnQueue=0;spawnCooldown=0;
                startNextWave();gameState=STATE.BATTLE;addMessage(loc.missionText,100);beep(600,0.15);
            }

            function startNextWave(){
                waveNumber++;
                let type = currentLocation.enemyTypes[0];
                if(currentLocation.enemyTypes.length>1) type = currentLocation.enemyTypes[Math.floor(Math.random()*currentLocation.enemyTypes.length)];
                let count = 3 + waveNumber * 2;
                spawnQueue = count;   // ставим в очередь
                spawnCooldown = 10;   // первый враг почти сразу
                enemiesRemaining = count;
                addMessage('Волна ' + waveNumber, 60);
            }

            function checkMissionComplete(){
                if (missionPhase === 'waves' && enemiesRemaining <= 0 && enemies.length === 0 && spawnQueue === 0) {
                    if (waveNumber >= 3) spawnBoss(currentLocation.boss);
                    else startNextWave();
                } else if (missionPhase === 'boss' && bossEnemy && bossEnemy.hp <= 0) {
                    player.credits += currentLocation.rewardCredits;
                    gainXP(currentLocation.rewardXP);
                    addMessage('Миссия выполнена! +'+currentLocation.rewardCredits+' кред.',150);
                    spawnParticles(W/2,H/2,'#ffe81f',30);
                    beep(800,0.2,'triangle',0.15);
                    setTimeout(()=>{ gameState=STATE.SHOP; },1500);
                }
            }

            function gainXP(amount){
                player.xp+=amount;
                while(player.xp>=player.xpToNext){
                    player.xp-=player.xpToNext;player.level++;player.xpToNext=Math.floor(player.xpToNext*1.5);
                    player.maxHull+=20;player.hull=Math.min(player.hull+30,player.maxHull);player.maxShield+=10;player.shield=Math.min(player.shield+15,player.maxShield);
                    addMessage('УРОВЕНЬ '+player.level+'!',100);spawnParticles(player.x,player.y,'#00ffcc',20);beep(1000,0.3,'sine',0.1);
                }
            }

            function fireLaser(){if(player.fireCooldown>0)return;player.fireCooldown=player.fireRate;playerBullets.push({x:player.x,y:player.y-player.height/2,vx:0,vy:-8,damage:player.laserDamage,color:'#0ff'});beep(900,0.05,'square',0.04);}
            function fireTorpedo(){if(player.torpedoes<=0)return;player.torpedoes--;playerBullets.push({x:player.x,y:player.y-player.height/2,vx:0,vy:-5,damage:player.torpedoDamage,color:'#ff0',isTorpedo:true});beep(400,0.15,'sawtooth',0.08);}

            function updateBattle(){
                // спавн из очереди
                if (spawnQueue > 0) {
                    if (spawnCooldown > 0) {
                        spawnCooldown--;
                    } else {
                        let type = currentLocation.enemyTypes[0];
                        if(currentLocation.enemyTypes.length>1) type = currentLocation.enemyTypes[Math.floor(Math.random()*currentLocation.enemyTypes.length)];
                        spawnEnemy(type);
                        spawnQueue--;
                        spawnCooldown = 15; // интервал между спавнами (кадры)
                    }
                }

                let moveX=0,moveY=0;
                if(keys['ArrowLeft']||keys['a']||keys['A'])moveX=-1;
                if(keys['ArrowRight']||keys['d']||keys['D'])moveX=1;
                if(keys['ArrowUp']||keys['w']||keys['W'])moveY=-1;
                if(keys['ArrowDown']||keys['s']||keys['S'])moveY=1;
                if(joystick.active){
                    let jx=joystick.dx, jy=joystick.dy;
                    if(Math.hypot(jx,jy)>20){ moveX=jx/Math.hypot(jx,jy); moveY=jy/Math.hypot(jx,jy); }
                }
                player.vx=moveX*player.speed; player.vy=moveY*player.speed;
                player.x+=player.vx; player.y+=player.vy;
                player.x=clamp(player.x,player.width/2,W-player.width/2);
                player.y=clamp(player.y,player.height/2,H-player.height/2);
                if(player.shield<player.maxShield)player.shield=Math.min(player.maxShield,player.shield+player.shieldRegen);
                if(player.fireCooldown>0)player.fireCooldown--;
                if((keys[' ']||keys['Spacebar']||touchFireActive)&&gameState===STATE.BATTLE)fireLaser();

                for(let i=playerBullets.length-1;i>=0;i--){
                    let b=playerBullets[i];b.x+=b.vx;b.y+=b.vy;
                    if(b.y<-20||b.x<-20||b.x>W+20){playerBullets.splice(i,1);continue;}
                    for(let j=enemies.length-1;j>=0;j--){
                        let e=enemies[j];
                        if(dist(b,e)<e.size/2+4){
                            e.hp-=b.damage;spawnParticles(b.x,b.y,b.color,3);playerBullets.splice(i,1);
                            if(e.hp<=0){player.credits+=e.scoreValue||20;gainXP(10);spawnParticles(e.x,e.y,e.color,15);enemies.splice(j,1);if(!bossActive)enemiesRemaining--;beep(700,0.08);}
                            break;
                        }
                    }
                }
                for(let i=enemyBullets.length-1;i>=0;i--){
                    let b=enemyBullets[i];b.x+=b.vx;b.y+=b.vy;
                    if(b.y>H+20||b.y<-20||b.x<-20||b.x>W+20){enemyBullets.splice(i,1);continue;}
                    if(dist(b,player)<player.width/2+3){
                        let dmg=b.damage;
                        if(player.shield>0){if(player.shield>=dmg){player.shield-=dmg;dmg=0;}else{dmg-=player.shield;player.shield=0;}}
                        player.hull-=dmg;spawnParticles(b.x,b.y,'#f00',5);enemyBullets.splice(i,1);beep(200,0.15,'sawtooth');
                        if(player.hull<=0){player.hull=0;gameState=STATE.GAMEOVER;addMessage('Ваш истребитель уничтожен...',200);}
                    }
                }
                for(let e of enemies){
                    if(e.behavior==='chase'||e.behavior==='boss_chase'){let ang=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(ang)*e.speed;e.y+=Math.sin(ang)*e.speed;}
                    else if(e.behavior==='bomber'){e.x-=e.speed*0.7;e.y+=Math.sin(Date.now()*0.01)*0.5;}
                    else if(e.behavior==='ground'){e.x-=e.speed*0.5;e.y=H-40+Math.sin(Date.now()*0.003)*15;}
                    else if(e.behavior==='boss_strafe'){e.x+=Math.sin(Date.now()*0.002)*e.speed;e.y+=Math.cos(Date.now()*0.003)*e.speed*0.5;}
                    else if(e.behavior==='boss_ground'){e.x+=Math.sin(Date.now()*0.0015)*e.speed;e.y=100+Math.sin(Date.now()*0.004)*20;}
                    else if(e.behavior==='boss_final'){e.x=W/2+Math.sin(Date.now()*0.001)*150;e.y=120+Math.cos(Date.now()*0.002)*30;}
                    e.x=clamp(e.x,e.size/2,W-e.size/2);e.y=clamp(e.y,e.size/2,H-e.size/2);
                    if(e.shootTimer>0)e.shootTimer--;
                    if(e.shootTimer<=0){e.shootTimer=e.shootDelay+Math.random()*20;let ang=Math.atan2(player.y-e.y,player.x-e.x);enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*4,vy:Math.sin(ang)*4,damage:e.damage,color:'#f44'});}
                }
                for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1);}
                checkMissionComplete();
                if(player.hull<=0)gameState=STATE.GAMEOVER;
            }

            function updateShop(){
                if(keys['ArrowDown']||keys['s']){shopSelected=(shopSelected+1)%6;keys['ArrowDown']=false;keys['s']=false;beep(300,0.05);}
                if(keys['ArrowUp']||keys['w']){shopSelected=(shopSelected+5)%6;keys['ArrowUp']=false;keys['w']=false;beep(300,0.05);}
                if(keys['Enter']||keys[' ']){buyUpgrade(shopSelected);keys['Enter']=false;keys[' ']=false;}
                if(keys['m']||keys['M']){goToMap();keys['m']=false;keys['M']=false;}
            }

            function buyUpgrade(index){
                let costs=[100,150,150,200,80,30];
                if(index===4){if(player.credits>=costs[4]){player.credits-=costs[4];player.torpedoes++;addMessage('Торпеда куплена!',60);beep(500,0.1);}}
                else if(index===5){if(player.credits>=costs[5]){player.credits-=costs[5];player.hull=player.maxHull;player.shield=player.maxShield;addMessage('Ремонт завершён!',60);beep(600,0.1);}}
                else{let cost=costs[index]*(player['weaponLevel']||1);if(player.credits>=cost){player.credits-=cost;
                    switch(index){case 0:player.weaponLevel++;player.laserDamage=15+(player.weaponLevel-1)*5;break;case 1:player.speedLevel++;player.speed=5+(player.speedLevel-1)*0.8;break;case 2:player.shieldLevel++;player.maxShield=50+(player.shieldLevel-1)*20;player.shield=player.maxShield;break;case 3:player.hullLevel++;player.maxHull=100+(player.hullLevel-1)*30;player.hull=player.maxHull;break;}
                    addMessage('Улучшено!',60);beep(700,0.1);}}
            }
            function goToMap(){gameState=STATE.MAP;currentLocation=null;beep(400,0.1);}

            function drawStars(){for(let s of stars){s.y+=s.speed;if(s.y>H){s.y=0;s.x=Math.random()*W;}ctx.fillStyle='white';ctx.fillRect(s.x,s.y,s.size,s.size);}}
            function drawPlayer(){
                ctx.save();ctx.translate(player.x,player.y);
                ctx.fillStyle='#ddd';ctx.beginPath();ctx.moveTo(0,-player.height/2);ctx.lineTo(-player.width/2,player.height/2);ctx.lineTo(-player.width/4,player.height/4);ctx.lineTo(0,player.height/3);ctx.lineTo(player.width/4,player.height/4);ctx.lineTo(player.width/2,player.height/2);ctx.closePath();ctx.fill();
                ctx.strokeStyle='#f00';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#0af';ctx.beginPath();ctx.arc(0,-5,6,0,Math.PI*2);ctx.fill();ctx.restore();
            }
            function drawEnemy(e){
                ctx.save();ctx.translate(e.x,e.y);
                if(e.type&&e.type.includes('tie')){ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(0,0,e.size/2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.fillRect(-e.size/6,-e.size/2,e.size/3,e.size);}
                else if(e.behavior&&e.behavior.includes('boss')){ctx.fillStyle=e.color;ctx.fillRect(-e.size/2,-e.size/2,e.size,e.size);ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='center';ctx.fillText('BOSS',0,5);}
                else{ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(0,0,e.size/2,0,Math.PI*2);ctx.fill();}
                if(e.maxHp>50){ctx.fillStyle='#f00';ctx.fillRect(-20,-e.size/2-8,40,4);ctx.fillStyle='#0f0';ctx.fillRect(-20,-e.size/2-8,40*(e.hp/e.maxHp),4);}
                ctx.restore();
            }
            function drawBullets(){for(let b of playerBullets){ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.isTorpedo?5:3,0,Math.PI*2);ctx.fill();}for(let b of enemyBullets){ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();}}
            function drawParticles(){for(let p of particles){ctx.globalAlpha=p.life/30;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);}ctx.globalAlpha=1;}
            function drawHUD(){
                ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(10,10,200,90);ctx.strokeStyle='#ffe81f';ctx.strokeRect(10,10,200,90);
                ctx.fillStyle='white';ctx.font='14px Arial';ctx.fillText('Корпус: '+Math.ceil(player.hull)+'/'+player.maxHull,20,30);
                ctx.fillText('Щит: '+Math.ceil(player.shield)+'/'+player.maxShield,20,50);ctx.fillText('Торпед: '+player.torpedoes,20,70);ctx.fillText('Кредиты: '+player.credits,20,90);
                ctx.fillStyle='#444';ctx.fillRect(20,105,180,10);ctx.fillStyle='#0ff';ctx.fillRect(20,105,180*(player.xp/player.xpToNext),10);ctx.fillStyle='white';ctx.font='10px Arial';ctx.fillText('LVL '+player.level,100,113);
                if(missionPhase==='boss'&&bossEnemy){ctx.fillStyle='rgba(255,0,0,0.7)';ctx.fillRect(W/2-100,20,200,20);ctx.fillStyle='yellow';ctx.fillText('БОСС',W/2-10,35);ctx.fillStyle='#f00';ctx.fillRect(W/2-100,40,200,8);ctx.fillStyle='#0f0';ctx.fillRect(W/2-100,40,200*(bossEnemy.hp/bossEnemy.maxHp),8);}
            }
            function drawMap(){
                drawStars();ctx.fillStyle='white';ctx.font='24px Arial';ctx.textAlign='center';ctx.fillText('КАРТА ГАЛАКТИКИ',W/2,40);let y=90;
                for(let loc of locations){let unlocked=player.level>=loc.requiredLevel;ctx.fillStyle=unlocked?loc.color:'#555';ctx.fillRect(W/2-120,y-15,240,50);ctx.strokeStyle='white';ctx.strokeRect(W/2-120,y-15,240,50);ctx.fillStyle='white';ctx.font='16px Arial';ctx.fillText(loc.name+(unlocked?'':' (ур.'+loc.requiredLevel+')'),W/2,y+5);ctx.font='12px Arial';ctx.fillText(loc.missionText+' | +'+loc.rewardCredits+' кред.',W/2,y+25);y+=60;}
                ctx.fillStyle='#aaa';ctx.font='14px Arial';ctx.fillText('Нажми на миссию (или клавиши 1-6)',W/2,H-20);
            }
            function drawShop(){
                drawStars();ctx.fillStyle='#ffe81f';ctx.font='26px Arial';ctx.textAlign='center';ctx.fillText('МАГАЗИН',W/2,40);ctx.fillStyle='white';ctx.font='16px Arial';ctx.fillText('Кредиты: '+player.credits,W/2,70);
                let items=['Улучшить лазер (ур.'+player.weaponLevel+') - 100','Улучшить двигатели (ур.'+player.speedLevel+') - 150','Улучшить щит (ур.'+player.shieldLevel+') - 150','Улучшить корпус (ур.'+player.hullLevel+') - 200','Купить торпеду (есть '+player.torpedoes+') - 80','Полный ремонт - 30'];
                for(let i=0;i<items.length;i++){let y=120+i*50;ctx.fillStyle=shopSelected===i?'#ff0':'#aaa';ctx.fillText(items[i],W/2,y);}
                ctx.fillStyle='#aaa';ctx.fillText('↑↓ выбрать, Enter купить, M на карту',W/2,H-20);
            }
            function drawMenu(){drawStars();ctx.fillStyle='#ffe81f';ctx.font='36px Arial';ctx.textAlign='center';ctx.fillText('ЗВЁЗДНЫЕ ВОЙНЫ',W/2,H/2-60);ctx.fillText('САГА БРЕЙНРОТА',W/2,H/2-20);ctx.fillStyle='white';ctx.font='20px Arial';ctx.fillText('Нажми ПРОБЕЛ или тапни',W/2,H/2+40);}
            function drawGameOver(){ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f00';ctx.font='40px Arial';ctx.textAlign='center';ctx.fillText('ИГРА ОКОНЧЕНА',W/2,H/2-30);ctx.fillStyle='white';ctx.fillText('Уровень: '+player.level,W/2,H/2+20);ctx.fillText('ПРОБЕЛ для рестарта',W/2,H/2+60);}
            function drawVictory(){ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffe81f';ctx.font='40px Arial';ctx.fillText('ПОБЕДА!',W/2,H/2-30);ctx.fillText('Император повержен!',W/2,H/2+20);ctx.fillStyle='white';ctx.fillText('ПРОБЕЛ для новой игры',W/2,H/2+70);}
            function drawMessage(){if(messageTimer>0){ctx.fillStyle='white';ctx.font='18px Arial';ctx.textAlign='center';ctx.fillText(messageText,W/2,H/2+80);messageTimer--;}}

            function update(){
                if(gameState===STATE.BATTLE)updateBattle();
                else if(gameState===STATE.SHOP)updateShop();
                if(gameState===STATE.MAP){
                    if(keys['1']){startMission(locations[0]);keys['1']=false;}if(keys['2']){startMission(locations[1]);keys['2']=false;}if(keys['3']){startMission(locations[2]);keys['3']=false;}
                    if(keys['4']){startMission(locations[3]);keys['4']=false;}if(keys['5']){startMission(locations[4]);keys['5']=false;}if(keys['6']){startMission(locations[5]);keys['6']=false;}
                }
            }

            function draw(){
                ctx.clearRect(0,0,W,H);drawStars();
                if(gameState===STATE.MENU)drawMenu();
                else if(gameState===STATE.MAP)drawMap();
                else if(gameState===STATE.BATTLE){for(let e of enemies)drawEnemy(e);drawPlayer();drawBullets();drawParticles();drawHUD();}
                else if(gameState===STATE.SHOP)drawShop();
                else if(gameState===STATE.GAMEOVER||gameState===STATE.VICTORY){for(let e of enemies)drawEnemy(e);drawPlayer();drawBullets();drawParticles();if(gameState===STATE.GAMEOVER)drawGameOver();else drawVictory();}
                drawMessage();
            }

            function gameLoop(){update();draw();requestAnimationFrame(gameLoop);}
            resetPlayer();gameState=STATE.MENU;gameLoop();
        })();
    </script>
</body>
</html>
