<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка</title>
    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .game-container {
            position: relative;
        }
        canvas {
            border: 2px solid #4ef09d;
            box-shadow: 0 0 20px rgba(78, 240, 157, 0.4);
            background: #111;
        }
        #score {
            position: absolute;
            top: -40px;
            left: 0;
            color: #4ef09d;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(78, 240, 157, 0.5);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div id="score">Счёт: 0</div>
        <canvas id="snakeCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');

        // Настройки
        const TILE_SIZE = 20;          // размер клетки
        const COLS = 25;               // ширина в клетках
        const ROWS = 25;               // высота в клетках
        canvas.width = COLS * TILE_SIZE;
        canvas.height = ROWS * TILE_SIZE;

        const INITIAL_LENGTH = 4;
        const INITIAL_SPEED = 150;      // миллисекунд между шагами (чем меньше, тем быстрее)

        // Игровые переменные
        let snake = [];
        let food = {};
        let direction = { x: 1, y: 0 }; // начальное направление (вправо)
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let gameOver = false;
        let gameLoopInterval = null;
        let speed = INITIAL_SPEED;

        // Сброс игры
        function resetGame() {
            // Змейка в центре
            const startX = Math.floor(COLS / 2);
            const startY = Math.floor(ROWS / 2);
            snake = [];
            for (let i = 0; i < INITIAL_LENGTH; i++) {
                snake.push({ x: startX - i, y: startY });
            }
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameOver = false;
            speed = INITIAL_SPEED;
            updateScore();
            placeFood();
            clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(step, speed);
        }

        // Разместить яблоко в случайной свободной клетке
        function placeFood() {
            const maxAttempts = 1000;
            for (let i = 0; i < maxAttempts; i++) {
                const fx = Math.floor(Math.random() * COLS);
                const fy = Math.floor(Math.random() * ROWS);
                // Проверяем, не занято ли змейкой
                if (!snake.some(segment => segment.x === fx && segment.y === fy)) {
                    food = { x: fx, y: fy };
                    return;
                }
            }
            // Если всё заполнено — теоретически победа, но упростим
            food = { x: 0, y: 0 };
        }

        // Один шаг игры
        function step() {
            if (gameOver) return;

            // Применяем направление (защита от разворота на 180°)
            if (
                (nextDirection.x !== -direction.x || nextDirection.y !== -direction.y) &&
                (nextDirection.x !== 0 || nextDirection.y !== 0)
            ) {
                direction = nextDirection;
            }

            // Новая голова
            const head = { ...snake[0] };
            head.x += direction.x;
            head.y += direction.y;

            // Проверка столкновения со стенами
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                endGame();
                return;
            }

            // Проверка столкновения с собой (кроме хвоста, который уберётся)
            if (snake.some((segment, index) => index < snake.length - 1 && segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // Проверка, съедена ли еда
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
                placeFood();
                // Увеличиваем скорость каждые 5 очков
                if (score % 50 === 0 && speed > 50) {
                    speed -= 10;
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = setInterval(step, speed);
                }
            } else {
                // Убираем хвост (не растём)
                snake.pop();
            }

            draw();
        }

        function endGame() {
            gameOver = true;
            clearInterval(gameLoopInterval);
            draw(); // покажем финальное состояние
        }

        function updateScore() {
            scoreDisplay.textContent = `Счёт: ${score}`;
        }

        // Отрисовка
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Сетка
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * TILE_SIZE, 0);
                ctx.lineTo(i * TILE_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let j = 0; j <= ROWS; j++) {
                ctx.beginPath();
                ctx.moveTo(0, j * TILE_SIZE);
                ctx.lineTo(canvas.width, j * TILE_SIZE);
                ctx.stroke();
            }

            // Еда
            ctx.fillStyle = '#ff4d4d';
            ctx.shadowColor = '#ff4d4d';
            ctx.shadowBlur = 10;
            ctx.fillRect(food.x * TILE_SIZE + 2, food.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
            ctx.shadowBlur = 0;

            // Змейка
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Голова — ярче
                    ctx.fillStyle = '#4ef09d';
                    ctx.shadowColor = '#4ef09d';
                    ctx.shadowBlur = 12;
                } else {
                    // Тело — оттенок
                    const intensity = 1 - (index / snake.length) * 0.4;
                    const r = Math.floor(30 * intensity);
                    const g = Math.floor(200 * intensity);
                    const b = Math.floor(120 * intensity);
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = `rgba(${r},${g},${b},0.7)`;
                }
                ctx.fillRect(segment.x * TILE_SIZE + 2, segment.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
            });
            ctx.shadowBlur = 0;

            // Сообщение при проигрыше
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff4d4d';
                ctx.font = 'bold 36px "Segoe UI", system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);
                ctx.fillStyle = '#fff';
                ctx.font = '18px "Segoe UI"';
                ctx.fillText('Нажмите ПРОБЕЛ, чтобы начать заново', canvas.width / 2, canvas.height / 2 + 25);
            }
        }

        // Управление
        window.addEventListener('keydown', (e) => {
            const key = e.key;
            e.preventDefault();
            if (gameOver && key === ' ') {
                resetGame();
                return;
            }
            // Стрелки и WASD
            switch (key) {
                case 'ArrowUp': case 'w': case 'W':
                    nextDirection = { x: 0, y: -1 }; break;
                case 'ArrowDown': case 's': case 'S':
                    nextDirection = { x: 0, y: 1 }; break;
                case 'ArrowLeft': case 'a': case 'A':
                    nextDirection = { x: -1, y: 0 }; break;
                case 'ArrowRight': case 'd': case 'D':
                    nextDirection = { x: 1, y: 0 }; break;
            }
        });

        // Запуск
        resetGame();
        draw();
    </script>
</body>
</html>
