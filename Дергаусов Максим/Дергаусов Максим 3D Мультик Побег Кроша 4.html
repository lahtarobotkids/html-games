<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Мультик: Побег Кроша 4</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #1a2a1a; }
    #caption {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.7);
      pointer-events: none;
      z-index: 10;
      background: rgba(0,0,0,0.5);
      padding: 12px 0;
      backdrop-filter: blur(4px);
      transition: opacity 0.5s;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #aaa;
      font-size: 14px;
      background: rgba(0,0,0,0.6);
      padding: 6px 14px;
      border-radius: 20px;
      z-index: 10;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    #replayBtn {
      position: absolute;
      bottom: 100px;
      right: 30px;
      padding: 12px 28px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 40px;
      font-size: 18px;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 0 20px rgba(231,76,60,0.5);
      font-weight: bold;
      transition: 0.2s;
      display: none;
    }
    #replayBtn:hover {
      transform: scale(1.05);
      background: #c0392b;
    }
  </style>
</head>
<body>
  <div id="caption">🏡 Друзья наслаждаются жизнью</div>
  <div id="info">🎬 Часть 4 • Защита дома</div>
  <button id="replayBtn">🔄 Смотреть снова</button>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // --- Сцена, камера, рендерер ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2d5a27);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(5, 4, 8);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- Освещение ---
    const ambientLight = new THREE.AmbientLight(0x404060);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    dirLight.position.set(8, 12, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.1;
    dirLight.shadow.camera.far = 30;
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x88aaff, 0.3);
    fillLight.position.set(-3, 2, 4);
    scene.add(fillLight);

    // --- Ландшафт ---
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.9 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    // Деревья
    function createTree(x, z) {
      const group = new THREE.Group();
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 0.9 });
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 1.5), trunkMat);
      trunk.position.y = 0.75;
      trunk.castShadow = true;
      group.add(trunk);
      const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.8 });
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.9, 1.2, 6), leafMat);
      leaf.position.y = 1.6;
      leaf.castShadow = true;
      group.add(leaf);
      group.position.set(x, 0, z);
      return group;
    }
    for (let i = 0; i < 18; i++) {
      const angle = (i / 18) * Math.PI * 2;
      const radius = 4 + Math.random() * 4;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius - 1;
      if (Math.abs(x) < 3 && z > -2 && z < 3) continue;
      const tree = createTree(x, z);
      scene.add(tree);
    }

    // --- Дом (из части 3) ---
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 0.9 });
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xCD853F, roughness: 0.8 });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x8B0000, roughness: 0.7 });
    const doorMat = new THREE.MeshStandardMaterial({ color: 0x5d3a1a });
    const windowMat = new THREE.MeshStandardMaterial({ color: 0x87CEEB, emissive: 0x224466, emissiveIntensity: 0.1 });

    function createWall(w, h, d, x, y, z, mat = wallMat) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      return m;
    }
    // Стены
    const w1 = createWall(1.4, 0.8, 0.05, -0.7, 0.5, 0);
    const w2 = createWall(1.4, 0.8, 0.05, 0.7, 0.5, 0);
    const w3 = createWall(0.05, 0.8, 1.4, 0, 0.5, -0.7);
    const w4 = createWall(0.05, 0.8, 1.4, 0, 0.5, 0.7);
    // Крыша
    const r1 = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.8), roofMat);
    r1.position.set(0, 1.2, 0);
    r1.rotation.x = 0.5;
    r1.castShadow = true;
    scene.add(r1);
    const r2 = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.8), roofMat);
    r2.position.set(0, 1.2, 0);
    r2.rotation.x = -0.5;
    r2.castShadow = true;
    scene.add(r2);
    // Дверь
    const door = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.05), doorMat);
    door.position.set(0, 0.3, 0.65);
    door.castShadow = true;
    scene.add(door);
    // Окна
    const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.05), windowMat);
    win1.position.set(-0.5, 0.6, 0.65);
    scene.add(win1);
    const win2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.05), windowMat);
    win2.position.set(0.5, 0.6, 0.65);
    scene.add(win2);

    // --- Персонажи ---
    function createCharacter(color, eyeColor = 0xffffff, pupilColor = 0x111111, earColor = null) {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), bodyMat);
      body.castShadow = true;
      body.receiveShadow = true;
      body.position.y = 0.8;
      group.add(body);

      const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
      const eyePupilMat = new THREE.MeshStandardMaterial({ color: pupilColor, roughness: 0.1 });
      function createEye(ex, ey, ez) {
        const g = new THREE.Group();
        const white = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), eyeWhiteMat);
        white.position.set(0, 0, 0);
        g.add(white);
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), eyePupilMat);
        pupil.position.set(0, 0.04, 0.22);
        g.add(pupil);
        const gloss = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.5 }));
        gloss.position.set(0.07, 0.1, 0.28);
        g.add(gloss);
        g.position.set(ex, ey, ez);
        return g;
      }
      group.add(createEye(0.3, 1.0, 0.65));
      group.add(createEye(-0.3, 1.0, 0.65));

      const mouthMat = new THREE.MeshStandardMaterial({ color: 0xcc3344, roughness: 0.4 });
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.04, 8, 16, Math.PI), mouthMat);
      mouth.position.set(0, 0.7, 0.85);
      mouth.rotation.x = 0.2;
      mouth.rotation.z = 0.1;
      group.add(mouth);

      const earMat = new THREE.MeshStandardMaterial({ color: earColor || color, roughness: 0.5 });
      function createEar(ex, ey, ez, rotZ) {
        const ear = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 8), earMat);
        ear.position.set(ex, ey, ez);
        ear.rotation.z = rotZ;
        ear.rotation.x = 0.2;
        ear.castShadow = true;
        return ear;
      }
      group.add(createEar(0.4, 1.4, 0.2, 0.2));
      group.add(createEar(-0.4, 1.4, 0.2, -0.2));

      const handMat = new THREE.MeshStandardMaterial({ color, roughness: 0.4 });
      function createHand(hx, hy, hz) {
        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), handMat);
        hand.position.set(hx, hy, hz);
        hand.castShadow = true;
        return hand;
      }
      group.add(createHand(0.9, 0.6, 0.2));
      group.add(createHand(-0.9, 0.6, 0.2));

      const legMat = new THREE.MeshStandardMaterial({ color, roughness: 0.5 });
      function createLeg(lx, ly, lz) {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.3, 8), legMat);
        leg.position.set(lx, ly, lz);
        leg.castShadow = true;
        return leg;
      }
      group.add(createLeg(0.35, 0.15, 0.15));
      group.add(createLeg(-0.35, 0.15, 0.15));

      return group;
    }

    const krosh = createCharacter(0xffb347, 0xffffff, 0x111111, 0xffa07a);
    krosh.position.set(-1.2, 0, 1.5);
    scene.add(krosh);

    const barash = createCharacter(0x9b59b6, 0xffffff, 0x111111, 0x8e44ad);
    barash.position.set(0, 0, 0.8);
    scene.add(barash);

    const hrusha = createCharacter(0xffb6c1, 0xffffff, 0x111111, 0xff8a9a);
    hrusha.position.set(1.2, 0, 1.8);
    scene.add(hrusha);

    krosh.rotation.y = 0.2;
    barash.rotation.y = 0;
    hrusha.rotation.y = -0.2;

    // --- Злой робот ---
    const robotGroup = new THREE.Group();
    const bodyMatR = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, metalness: 0.8, roughness: 0.3 });
    const bodyR = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.6), bodyMatR);
    bodyR.position.y = 0.6;
    bodyR.castShadow = true;
    robotGroup.add(bodyR);
    // Голова
    const headMat = new THREE.MeshStandardMaterial({ color: 0x95a5a6, metalness: 0.7 });
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.5), headMat);
    head.position.y = 1.4;
    head.castShadow = true;
    robotGroup.add(head);
    // Глаза (красные)
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0.5 });
    const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), eyeMat);
    eyeR.position.set(0.2, 1.5, 0.3);
    robotGroup.add(eyeR);
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), eyeMat);
    eyeL.position.set(-0.2, 1.5, 0.3);
    robotGroup.add(eyeL);
    // Антенна
    const antMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f });
    const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4), antMat);
    ant.position.set(0, 1.7, 0);
    robotGroup.add(ant);
    const antBall = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), antMat);
    antBall.position.set(0, 1.9, 0);
    robotGroup.add(antBall);
    // Ноги
    const legMatR = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
    const legR1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.2), legMatR);
    legR1.position.set(-0.25, 0.15, 0);
    robotGroup.add(legR1);
    const legR2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.2), legMatR);
    legR2.position.set(0.25, 0.15, 0);
    robotGroup.add(legR2);
    // Руки (палки)
    const armMat = new THREE.MeshStandardMaterial({ color: 0x95a5a6 });
    const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.6), armMat);
    armR.position.set(0.5, 0.9, 0);
    armR.rotation.z = 0.3;
    robotGroup.add(armR);
    const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.6), armMat);
    armL.position.set(-0.5, 0.9, 0);
    armL.rotation.z = -0.3;
    robotGroup.add(armL);

    robotGroup.position.set(4, 0, -3);
    robotGroup.rotation.y = -0.5;
    scene.add(robotGroup);

    // --- Снаряды для бросания (камни) ---
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 0.9 });
    const stones = [];
    for (let i = 0; i < 6; i++) {
      const stone = new THREE.Mesh(new THREE.SphereGeometry(0.15 + Math.random()*0.1, 6), stoneMat);
      stone.castShadow = true;
      stone.visible = false;
      scene.add(stone);
      stones.push(stone);
    }

    // --- Анимационные переменные ---
    let clock = new THREE.Clock();
    let elapsedTime = 0;
    let phase = 0;
    let phaseTime = 0;
    const caption = document.getElementById('caption');
    const replayBtn = document.getElementById('replayBtn');

    const subtitles = [
      "🏡 Друзья наслаждаются жизнью в новом доме",
      "⚠️ Что-то приближается! Это робот-охранник!",
      "⚔️ Крош и друзья готовятся к обороне!",
      "💥 Они бросают камни в робота!",
      "🤖 Робот повержен! Победа!",
      "🎉 Свобода навсегда! Все счастливы."
    ];

    let stoneIndex = 0;
    let stoneTimer = 0;

    // --- Анимация ---
    function animate() {
      const delta = clock.getDelta();
      elapsedTime += delta;
      phaseTime += delta;

      let nextPhase = phase;
      if (phase === 0 && phaseTime > 2.5) { nextPhase = 1; phaseTime = 0; }
      if (phase === 1 && phaseTime > 3.0) { nextPhase = 2; phaseTime = 0; }
      if (phase === 2 && phaseTime > 3.0) { nextPhase = 3; phaseTime = 0; }
      if (phase === 3 && phaseTime > 4.0) { nextPhase = 4; phaseTime = 0; }
      if (phase === 4 && phaseTime > 3.0) { nextPhase = 5; phaseTime = 0; }
      if (phase === 5 && phaseTime > 4.0) {
        replayBtn.style.display = 'block';
      }

      if (nextPhase !== phase) {
        phase = nextPhase;
        caption.textContent = subtitles[phase] || subtitles[0];
        if (phase === 1) {
          // Робот начинает двигаться
        }
        if (phase === 3) {
          // Бросаем камни
        }
        if (phase === 4) {
          // Робот падает
          robotGroup.rotation.x = 1.2;
          robotGroup.position.y = -0.2;
        }
        if (phase === 5) {
          scene.background = new THREE.Color(0x87CEEB);
          dirLight.color.setHex(0xffeedd);
        }
      }

      // --- Движение робота ---
      if (phase >= 1 && phase < 4) {
        const speed = 0.02;
        robotGroup.position.x -= speed;
        robotGroup.position.z += speed * 0.5;
        // Шатание
        robotGroup.rotation.z = Math.sin(elapsedTime * 3) * 0.02;
        // Если робот приближается к дому
        if (robotGroup.position.x < 1.5 && phase === 2) {
          // Переход к битве
        }
      }

      // --- Бросание камней ---
      if (phase === 3) {
        stoneTimer += delta;
        if (stoneTimer > 0.4 && stoneIndex < stones.length) {
          stoneTimer = 0;
          const stone = stones[stoneIndex];
          stone.visible = true;
          // Позиция от персонажей (бросают по очереди)
          const throwers = [krosh, barash, hrusha];
          const thrower = throwers[stoneIndex % 3];
          const offsetX = (Math.random() - 0.5) * 0.3;
          const offsetZ = (Math.random() - 0.5) * 0.3;
          stone.position.copy(thrower.position);
          stone.position.y += 0.8;
          // Цель - робот
          const target = robotGroup.position.clone();
          target.y += 0.5;
          // Сохраним направление
          stone.userData.velocity = target.clone().sub(stone.position).multiplyScalar(0.03);
          stone.userData.gravity = 0.001;
          stoneIndex++;
        }
        // Обновление камней
        stones.forEach(stone => {
          if (stone.visible) {
            stone.position.add(stone.userData.velocity);
            stone.userData.velocity.y -= stone.userData.gravity;
            // Проверка попадания
            if (stone.position.distanceTo(robotGroup.position) < 0.8) {
              stone.visible = false;
              // Эффект попадания - робот вздрагивает
              robotGroup.rotation.z += 0.1;
              robotGroup.position.x += 0.02;
            }
            if (stone.position.y < 0) stone.visible = false;
          }
        });
        // Если все камни брошены, переход к фазе 4
        if (stoneIndex >= stones.length) {
          // но даем время
        }
      }

      // --- Анимация персонажей ---
      if (phase === 0) {
        // отдыхают
        krosh.rotation.y = Math.sin(elapsedTime * 0.5) * 0.1;
        barash.rotation.y = Math.sin(elapsedTime * 0.5 + 1) * 0.1;
        hrusha.rotation.y = Math.sin(elapsedTime * 0.5 + 2) * 0.1;
      } else if (phase === 2) {
        // Готовятся - машут руками
        krosh.children.forEach(child => {
          if (child.position && child.position.x > 0.5 && child.position.y < 1) {
            child.rotation.z = Math.sin(elapsedTime * 5) * 0.3;
          }
        });
        barash.children.forEach(child => {
          if (child.position && child.position.x < -0.5 && child.position.y < 1) {
            child.rotation.z = Math.sin(elapsedTime * 5 + 1) * 0.3;
          }
        });
        hrusha.rotation.z = Math.sin(elapsedTime * 3) * 0.05;
      } else if (phase === 3) {
        // Бросают - наклоняются
        krosh.rotation.x = 0.3;
        barash.rotation.x = 0.3;
        hrusha.rotation.x = 0.3;
      } else if (phase === 4 || phase === 5) {
        // Радуются
        krosh.rotation.y = Math.sin(elapsedTime * 2) * 0.3;
        barash.rotation.y = Math.sin(elapsedTime * 2 + 1) * 0.3;
        hrusha.rotation.y = Math.sin(elapsedTime * 2 + 2) * 0.3;
        krosh.position.y = Math.sin(elapsedTime * 4) * 0.05;
        barash.position.y = Math.sin(elapsedTime * 4 + 1) * 0.05;
        hrusha.position.y = Math.sin(elapsedTime * 4 + 2) * 0.05;
        // Машут руками
        [krosh, barash, hrusha].forEach((char, idx) => {
          char.children.forEach(child => {
            if (child.position && child.position.x > 0.5 && child.position.y < 1) {
              child.rotation.z = Math.sin(elapsedTime * 3 + idx) * 0.5 + 0.5;
            }
            if (child.position && child.position.x < -0.5 && child.position.y < 1) {
              child.rotation.z = Math.sin(elapsedTime * 3 + idx + 1) * 0.5 - 0.5;
            }
          });
        });
      }

      // Камера
      if (phase <= 1) {
        camera.position.set(5, 3.5, 6);
        camera.lookAt(0, 0.5, 0);
      } else if (phase === 2) {
        camera.position.set(3, 2.5, 5);
        camera.lookAt(1, 0.5, -1);
      } else if (phase === 3) {
        camera.position.set(2, 2, 4);
        camera.lookAt(1, 0.5, -1);
      } else if (phase >= 4) {
        camera.position.set(2, 3, 6);
        camera.lookAt(0, 0.5, 0);
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    // --- Ресайз ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    replayBtn.addEventListener('click', () => {
      location.reload();
    });
    replayBtn.style.display = 'none';

    console.log('🎬 Часть 4: Защита дома запущена!');
  </script>
</body>
</html>
