<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Мультик: Побег Кроша</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
    #caption {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 10;
      background: rgba(0,0,0,0.3);
      padding: 12px 0;
      backdrop-filter: blur(3px);
      transition: opacity 0.5s;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #aaa;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 6px 14px;
      border-radius: 20px;
      z-index: 10;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    #replayBtn {
      position: absolute;
      bottom: 100px;
      right: 30px;
      padding: 12px 28px;
      background: #2ed573;
      color: white;
      border: none;
      border-radius: 40px;
      font-size: 18px;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 0 20px rgba(46,213,115,0.4);
      font-weight: bold;
      transition: 0.2s;
      display: none;
    }
    #replayBtn:hover {
      transform: scale(1.05);
      background: #26de81;
    }
  </style>
</head>
<body>
  <div id="caption">🏰 Тюрьма Смешариков</div>
  <div id="info">🎬 3D-мультфильм • автопроигрывание</div>
  <button id="replayBtn">🔄 Смотреть снова</button>

  <!-- Подключаем Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.126.0/examples/jsm/controls/OrbitControls.js';

    // --- Сцена, камера, рендерер ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e); // тёмный фон

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(4, 4, 8);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- Освещение ---
    const ambientLight = new THREE.AmbientLight(0x404060);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.1;
    dirLight.shadow.camera.far = 30;
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;
    scene.add(dirLight);

    const backLight = new THREE.DirectionalLight(0x4488ff, 0.3);
    backLight.position.set(-3, 2, -5);
    scene.add(backLight);

    const fillLight = new THREE.DirectionalLight(0xffaa88, 0.4);
    fillLight.position.set(-2, 1, 4);
    scene.add(fillLight);

    // --- Пол ---
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x3d3d5c, roughness: 0.8, metalness: 0.1 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.01;
    floor.receiveShadow = true;
    scene.add(floor);

    // Стены тюремной камеры
    function createWall(w, h, d, x, y, z, color = 0x4a4a6a) {
      const wallMat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
      wall.position.set(x, y, z);
      wall.castShadow = true;
      wall.receiveShadow = true;
      scene.add(wall);
      return wall;
    }

    // Камера: размеры 6x3x4 (ширина x высота x глубина)
    const cellW = 6, cellH = 3, cellD = 4;
    // задняя стена
    createWall(cellW, cellH, 0.2, 0, cellH/2, -cellD/2);
    // левая стена
    createWall(0.2, cellH, cellD, -cellW/2, cellH/2, 0);
    // правая стена
    createWall(0.2, cellH, cellD, cellW/2, cellH/2, 0);
    // передняя стена с решёткой (прозрачная, но мы сделаем решётку отдельно)
    // пол уже есть

    // Решётка (передняя стена) - вертикальные прутья
    const barMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.3 });
    function createBar(x, y, z) {
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, cellH, 6), barMat);
      bar.position.set(x, cellH/2, z);
      bar.castShadow = true;
      scene.add(bar);
    }
    // Горизонтальные перекладины
    function createCrossbar(y, z) {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(cellW - 0.4, 0.08, 0.08), barMat);
      bar.position.set(0, y, z);
      bar.castShadow = true;
      scene.add(bar);
    }

    // Расставим прутья
    for (let x = -cellW/2 + 0.3; x <= cellW/2 - 0.3; x += 0.6) {
      createBar(x, 0, cellD/2 + 0.1);
    }
    // перекладины
    createCrossbar(0.6, cellD/2 + 0.1);
    createCrossbar(1.8, cellD/2 + 0.1);
    createCrossbar(2.5, cellD/2 + 0.1);

    // Дверь (проём) - потом уберём решётку

    // --- Персонажи ---
    function createCharacter(color, eyeColor = 0xffffff, pupilColor = 0x111111, earColor = null) {
      const group = new THREE.Group();

      // Тело
      const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.3, emissive: 0x000000 });
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), bodyMat);
      body.castShadow = true;
      body.receiveShadow = true;
      body.position.y = 0.8;
      group.add(body);

      // Глаза
      const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
      const eyePupilMat = new THREE.MeshStandardMaterial({ color: pupilColor, roughness: 0.1 });

      function createEye(ex, ey, ez) {
        const g = new THREE.Group();
        const white = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), eyeWhiteMat);
        white.position.set(0, 0, 0);
        g.add(white);
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), eyePupilMat);
        pupil.position.set(0, 0.04, 0.22);
        g.add(pupil);
        const gloss = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.5 }));
        gloss.position.set(0.07, 0.1, 0.28);
        g.add(gloss);
        g.position.set(ex, ey, ez);
        return g;
      }
      group.add(createEye(0.3, 1.0, 0.65));
      group.add(createEye(-0.3, 1.0, 0.65));

      // Рот (дуга)
      const mouthMat = new THREE.MeshStandardMaterial({ color: 0xcc3344, roughness: 0.4 });
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.04, 8, 16, Math.PI), mouthMat);
      mouth.position.set(0, 0.7, 0.85);
      mouth.rotation.x = 0.2;
      mouth.rotation.z = 0.1;
      group.add(mouth);

      // Уши
      const earMat = new THREE.MeshStandardMaterial({ color: earColor || color, roughness: 0.5 });
      function createEar(ex, ey, ez, rotZ) {
        const ear = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 8), earMat);
        ear.position.set(ex, ey, ez);
        ear.rotation.z = rotZ;
        ear.rotation.x = 0.2;
        ear.castShadow = true;
        return ear;
      }
      group.add(createEar(0.4, 1.4, 0.2, 0.2));
      group.add(createEar(-0.4, 1.4, 0.2, -0.2));

      // Ручки (сферы)
      const handMat = new THREE.MeshStandardMaterial({ color, roughness: 0.4 });
      function createHand(hx, hy, hz) {
        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), handMat);
        hand.position.set(hx, hy, hz);
        hand.castShadow = true;
        return hand;
      }
      group.add(createHand(0.9, 0.6, 0.2));
      group.add(createHand(-0.9, 0.6, 0.2));

      // Ножки
      const legMat = new THREE.MeshStandardMaterial({ color, roughness: 0.5 });
      function createLeg(lx, ly, lz) {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.3, 8), legMat);
        leg.position.set(lx, ly, lz);
        leg.castShadow = true;
        return leg;
      }
      group.add(createLeg(0.35, 0.15, 0.15));
      group.add(createLeg(-0.35, 0.15, 0.15));

      return group;
    }

    // Создаём трёх персонажей
    const krosh = createCharacter(0xffb347, 0xffffff, 0x111111, 0xffa07a);
    krosh.position.set(-1.2, 0, 0.5);
    scene.add(krosh);

    const barash = createCharacter(0x9b59b6, 0xffffff, 0x111111, 0x8e44ad);
    barash.position.set(0, 0, -0.5);
    scene.add(barash);

    const hrusha = createCharacter(0xffb6c1, 0xffffff, 0x111111, 0xff8a9a);
    hrusha.position.set(1.2, 0, 0.8);
    scene.add(hrusha);

    // Повернём всех лицом к решётке (вперёд = +Z)
    krosh.rotation.y = 0;
    barash.rotation.y = 0;
    hrusha.rotation.y = 0;

    // --- Дополнительные предметы: кровать, стол ---
    const bedMat = new THREE.MeshStandardMaterial({ color: 0x5d3a1a, roughness: 0.9 });
    const bed = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.2, 0.8), bedMat);
    bed.position.set(-1.8, 0.1, -1.2);
    bed.castShadow = true;
    bed.receiveShadow = true;
    scene.add(bed);

    const pillowMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.8 });
    const pillow = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.3), pillowMat);
    pillow.position.set(-2.0, 0.35, -1.0);
    pillow.castShadow = true;
    scene.add(pillow);

    // --- Анимационные переменные ---
    let clock = new THREE.Clock();
    let elapsedTime = 0;
    let phase = 0; // 0-5
    let phaseTime = 0;
    const caption = document.getElementById('caption');
    const replayBtn = document.getElementById('replayBtn');

    // Сцены субтитров
    const subtitles = [
      "🏰 Тюрьма Смешариков",
      "🔧 Крош готовит побег...",
      "⚡ Он пилит решётку!",
      "💥 Решётка сломана!",
      "🏃 Крош бежит на свободу!",
      "🌅 Свобода! Крош спасён!"
    ];

    // --- Функция для анимации рук (мах) ---
    function animateCharacter(charGroup, time, phase) {
      // Покачивание
      const bob = Math.sin(time * 2) * 0.02;
      charGroup.position.y = bob;
      // Поворот тела
      if (phase >= 3 && phase < 5) {
        // Крош бежит, другие машут
        if (charGroup === krosh) {
          // Бег: наклон вперёд
          charGroup.rotation.x = Math.sin(time * 8) * 0.05;
        } else {
          // Машут руками (вращение рук)
          charGroup.children.forEach(child => {
            if (child.position && child.position.x > 0.5 && child.position.y < 1) {
              // правая рука
              child.rotation.z = Math.sin(time * 3) * 0.5 + 0.5;
            }
            if (child.position && child.position.x < -0.5 && child.position.y < 1) {
              // левая рука
              child.rotation.z = Math.sin(time * 3 + 1) * 0.5 - 0.5;
            }
          });
        }
      }
    }

    // --- Анимация ---
    function animate() {
      const delta = clock.getDelta();
      elapsedTime += delta;
      phaseTime += delta;

      // Управление фазами (примерные тайминги)
      let nextPhase = phase;
      if (phase === 0 && phaseTime > 2.0) { nextPhase = 1; phaseTime = 0; }
      if (phase === 1 && phaseTime > 3.0) { nextPhase = 2; phaseTime = 0; }
      if (phase === 2 && phaseTime > 4.0) { nextPhase = 3; phaseTime = 0; }
      if (phase === 3 && phaseTime > 3.0) { nextPhase = 4; phaseTime = 0; }
      if (phase === 4 && phaseTime > 4.0) { nextPhase = 5; phaseTime = 0; }
      if (phase === 5 && phaseTime > 5.0) {
        // показываем кнопку повтора
        replayBtn.style.display = 'block';
        // зацикливаем на последней фазе
      }

      if (nextPhase !== phase) {
        phase = nextPhase;
        caption.textContent = subtitles[phase] || subtitles[0];
        // Спецэффекты при переходе
        if (phase === 3) {
          // Решётка падает (удаляем прутья)
          // Удаляем все прутья и перекладины (простым способом: находим по material)
          scene.children.forEach(child => {
            if (child.material && child.material === barMat) {
              scene.remove(child);
            }
          });
          // добавим эффект искр
        }
        if (phase === 5) {
          // Смена освещения на солнечное
          scene.background = new THREE.Color(0x87CEEB);
          dirLight.color.setHex(0xffeedd);
          // Поднимаем камеру
        }
      }

      // Анимация персонажей
      animateCharacter(krosh, elapsedTime, phase);
      animateCharacter(barash, elapsedTime, phase);
      animateCharacter(hrusha, elapsedTime, phase);

      // Движение Кроша в фазе 3-4-5
      if (phase >= 3 && phase <= 5) {
        const speed = 0.8;
        let targetZ = 2.5;
        if (phase === 3) targetZ = 1.5;
        else if (phase === 4) targetZ = 3.5;
        else if (phase === 5) targetZ = 5.0;
        // Перемещаем Кроша вперёд
        krosh.position.z += (targetZ - krosh.position.z) * 0.02;
        // В фазе 4 и 5 он бежит, немного вбок
        if (phase >= 4) {
          krosh.position.x += Math.sin(elapsedTime * 2) * 0.008;
        }
        // Поворачиваем Кроша в сторону движения
        krosh.rotation.y = Math.atan2(0, 1) * 0.3;
      }

      // Движение камеры
      if (phase === 0) {
        camera.position.set(4, 3, 6);
        camera.lookAt(0, 1, 0);
      } else if (phase === 1) {
        camera.position.set(3, 2.5, 5);
        camera.lookAt(0, 1, 0.5);
      } else if (phase === 2) {
        camera.position.set(2.5, 2, 4.5);
        camera.lookAt(0, 1, 0.8);
      } else if (phase === 3) {
        camera.position.set(2, 1.8, 4);
        camera.lookAt(0, 0.8, 1.5);
      } else if (phase === 4) {
        camera.position.set(1, 2.5, 5);
        camera.lookAt(krosh.position.x, 1, krosh.position.z + 1);
      } else if (phase === 5) {
        camera.position.set(0, 3, 7);
        camera.lookAt(krosh.position.x, 1, krosh.position.z - 1);
      }

      // Дополнительно: вращение Бараша и Хрюши при прощании
      if (phase >= 3) {
        barash.rotation.y += 0.01;
        hrusha.rotation.y += 0.01;
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    // --- Ресайз ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Кнопка повтора ---
    replayBtn.addEventListener('click', () => {
      location.reload();
    });

    // Скрываем кнопку повтора сначала
    replayBtn.style.display = 'none';

    console.log('🎬 Мультик "Побег Кроша" запущен!');
  </script>
</body>
</html>
