<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мультик: Гоша и бутылка</title>
    <style>
        :root {
            --bg: #1a1a2e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #16213e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', 'Arial', sans-serif;
            padding: 15px;
            user-select: none;
        }
        .wrapper {
            position: relative;
            width: 100%;
            max-width: 850px;
            aspect-ratio: 800 / 500;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.7), 0 0 0 5px #e0c097, 0 0 0 10px #5c3a21;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 14px;
            cursor: pointer;
        }
        .controls {
            margin-top: 14px;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #e0c097;
            color: #3b2b1a;
            border: 3px solid #5c3a21;
            padding: 10px 22px;
            border-radius: 28px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        button:hover {
            background: #f5d7b0;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
        button:active {
            transform: scale(0.94);
        }
        .scene-text {
            color: #e0c097;
            font-size: 0.9rem;
            letter-spacing: 0.4px;
            display: flex;
            align-items: center;
            min-width: 140px;
            justify-content: center;
        }
        @media (max-width: 600px) {
            button {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <canvas id="mainCanvas"></canvas>
    </div>
    <div class="controls">
        <button id="restartButton">🔄 Заново</button>
        <div class="scene-text" id="sceneLabel">Сцена: <span style="color:#ffd966;">1/4</span></div>
        <button id="nextButton">⏭ Дальше</button>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            const W = 800, H = 500;
            canvas.width = W;
            canvas.height = H;

            // Сцены (0,1,2,3) и время
            const SCENES = [
                { name: 'Поход за хлебом', start: 0 },
                { name: 'В магазине', start: 4.5 },
                { name: 'Дома с женой', start: 11 },
                { name: 'Бутылка и помойка', start: 18 }
            ];
            const TOTAL_TIME = 25;
            let currentTime = 0;
            let isPlaying = true;
            let lastFrameTime = null;
            let animationId = null;

            // Персонаж: простая голова с телом
            function drawCharacter(x, y, scale = 1, expression = 'neutral', hasBread = false) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);
                // Тело
                ctx.fillStyle = '#4a6c8f';
                ctx.fillRect(-18, 5, 36, 40);
                ctx.strokeStyle = '#2a3f5a';
                ctx.lineWidth = 2;
                ctx.strokeRect(-18, 5, 36, 40);
                // Руки
                ctx.fillStyle = '#f5d5b8';
                ctx.strokeStyle = '#c49a6c';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-18, 15);
                ctx.lineTo(-36, 28);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(18, 15);
                ctx.lineTo(36, 28);
                ctx.stroke();
                // Ноги
                ctx.fillStyle = '#3a3a3a';
                ctx.fillRect(-13, 42, 10, 20);
                ctx.fillRect(3, 42, 10, 20);
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(-14, 58, 12, 8);
                ctx.fillRect(2, 58, 12, 8);

                // Голова (большая)
                ctx.fillStyle = '#f5d5b8';
                ctx.beginPath();
                ctx.arc(0, -15, 27, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#c49a6c';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // Волосы (простые)
                ctx.fillStyle = '#3d2b1a';
                ctx.beginPath();
                ctx.arc(0, -24, 22, Math.PI, Math.PI * 2);
                ctx.fill();
                ctx.fillRect(-22, -24, 44, 8);

                // Выражения лица
                if (expression === 'neutral') {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(-9, -18, 5.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(9, -18, 5.5, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#1a3a2a';
                    ctx.beginPath(); ctx.arc(-8, -17, 2.8, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(10, -17, 2.8, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(-10, -20, 1.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(8, -20, 1.5, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#c49a6c';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath(); ctx.arc(0, -8, 6, 0.2, Math.PI - 0.2); ctx.stroke();
                } else if (expression === 'happy') {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(-9, -18, 5.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(9, -18, 5.5, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#1a3a2a';
                    ctx.beginPath(); ctx.arc(-8, -17, 2.8, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(10, -17, 2.8, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(-10, -20, 1.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(8, -20, 1.5, 0, Math.PI*2); ctx.fill();
                    // Улыбка шире
                    ctx.strokeStyle = '#c49a6c';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.arc(0, -7, 8, 0.3, Math.PI - 0.3); ctx.stroke();
                    // Румянец
                    ctx.fillStyle = 'rgba(255,150,150,0.4)';
                    ctx.beginPath(); ctx.arc(-16, -8, 5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(16, -8, 5, 0, Math.PI*2); ctx.fill();
                } else if (expression === 'surprised') {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(-9, -18, 7, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(9, -18, 7, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#1a3a2a';
                    ctx.beginPath(); ctx.arc(-8, -17, 3.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(10, -17, 3.5, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(-8, -17, 1.8, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(10, -17, 1.8, 0, Math.PI*2); ctx.fill();
                    // Рот открыт
                    ctx.fillStyle = '#d44';
                    ctx.beginPath(); ctx.ellipse(0, 0, 6, 10, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#800';
                    ctx.beginPath(); ctx.arc(0, 3, 4, 0, Math.PI); ctx.fill();
                } else if (expression === 'hurt') {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(-9, -18, 5.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(9, -18, 5.5, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#1a3a2a';
                    ctx.beginPath(); ctx.arc(-8, -17, 2.8, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(10, -17, 2.8, 0, Math.PI*2); ctx.fill();
                    // Закрытые глаза (дуги)
                    ctx.strokeStyle = '#1a3a2a';
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(-8, -16, 4, 0, Math.PI); ctx.stroke();
                    ctx.beginPath(); ctx.arc(10, -16, 4, 0, Math.PI); ctx.stroke();
                    // Звёздочки боли
                    ctx.fillStyle = '#ffaa00';
                    for (let i=0; i<3; i++) {
                        let sx = -20 + i*12;
                        ctx.beginPath(); ctx.arc(sx, -28, 2.5, 0, Math.PI*2); ctx.fill();
                    }
                    // Синяк
                    ctx.fillStyle = 'rgba(100,50,200,0.5)';
                    ctx.beginPath(); ctx.arc(0, -5, 9, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#c49a6c';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.arc(0, -2, 7, 0.6, Math.PI-0.6); ctx.stroke();
                }

                // Хлеб в руке (если есть)
                if (hasBread) {
                    ctx.fillStyle = '#e6b85c';
                    ctx.beginPath();
                    ctx.ellipse(38, 22, 14, 8, 0.2, 0, Math.PI*2);
                    ctx.fill();
                    ctx.strokeStyle = '#b8843c';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    // Надрезы
                    ctx.strokeStyle = '#8a5c2a';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.moveTo(34, 19); ctx.lineTo(36, 28); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(40, 18); ctx.lineTo(42, 27); ctx.stroke();
                }
                ctx.restore();
            }

            function drawWife(x, y, scale=1, withBottle = false) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);
                // Тело (платье)
                ctx.fillStyle = '#c44b6c';
                ctx.beginPath();
                ctx.moveTo(-16, -5);
                ctx.lineTo(-20, 45);
                ctx.lineTo(20, 45);
                ctx.lineTo(16, -5);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#8a2e4a';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                // Голова
                ctx.fillStyle = '#f5d5b8';
                ctx.beginPath(); ctx.arc(0, -18, 22, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#c49a6c';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                // Волосы (пучок)
                ctx.fillStyle = '#6b2e1a';
                ctx.beginPath(); ctx.arc(0, -24, 18, Math.PI, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(0, -32, 12, 0, Math.PI*2); ctx.fill();
                // Глаза злые
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(-8, -20, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(8, -20, 5, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#1a1a1a';
                ctx.beginPath(); ctx.arc(-7, -19, 2.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(9, -19, 2.5, 0, Math.PI*2); ctx.fill();
                // Брови сердитые
                ctx.strokeStyle = '#1a1a1a';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(-13, -26); ctx.lineTo(-3, -23); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(13, -26); ctx.lineTo(3, -23); ctx.stroke();
                // Рот (кривой)
                ctx.strokeStyle = '#8a2e4a';
                ctx.lineWidth = 1.8;
                ctx.beginPath(); ctx.moveTo(-7, -8); ctx.lineTo(7, -6); ctx.stroke();

                // Рука с бутылкой
                if (withBottle) {
                    ctx.fillStyle = '#f5d5b8';
                    ctx.strokeStyle = '#c49a6c';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(16, 8);
                    ctx.lineTo(32, 2);
                    ctx.stroke();
                    // Бутылка
                    ctx.fillStyle = '#4a7a3a';
                    ctx.beginPath();
                    ctx.rect(30, -12, 10, 28);
                    ctx.fill();
                    ctx.strokeStyle = '#2a4a1a';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = '#2a4a1a';
                    ctx.fillRect(32, -18, 6, 8);
                    ctx.strokeStyle = '#2a4a1a';
                    ctx.strokeRect(32, -18, 6, 8);
                }
                ctx.restore();
            }

            function drawShop(x, y, s) {
                ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
                ctx.fillStyle = '#e8d5b5';
                ctx.fillRect(-45, -40, 90, 70);
                ctx.strokeStyle = '#8b6b4b';
                ctx.lineWidth = 3;
                ctx.strokeRect(-45, -40, 90, 70);
                ctx.fillStyle = '#ffd966';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('ХЛЕБ', 0, -55);
                ctx.fillStyle = '#d4a373';
                ctx.fillRect(-10, -20, 20, 20);
                ctx.restore();
            }

            function drawDumpster(x, y, s) {
                ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
                ctx.fillStyle = '#4a5a4a';
                ctx.beginPath();
                ctx.rect(-30, -35, 60, 60);
                ctx.fill();
                ctx.strokeStyle = '#2a3a2a';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = '#5a6a5a';
                ctx.fillRect(-28, -33, 56, 8);
                ctx.fillStyle = '#3a3a3a';
                ctx.fillRect(-32, -42, 64, 8);
                ctx.restore();
            }

            function drawBackground(scrollX = 0) {
                // Небо
                const grad = ctx.createLinearGradient(0,0,0,H*0.7);
                grad.addColorStop(0, '#7fb3d3');
                grad.addColorStop(1, '#dceefb');
                ctx.fillStyle = grad;
                ctx.fillRect(0,0,W,H);
                // Трава
                ctx.fillStyle = '#6b8e4e';
                ctx.fillRect(0, H*0.64, W, H*0.36);
                ctx.fillStyle = '#5a7a3a';
                ctx.fillRect(0, H*0.64, W, 4);
                // Деревья простые
                for (let i=0; i<5; i++) {
                    let tx = (i*180 + scrollX) % 900 - 100;
                    ctx.fillStyle = '#5a4a2a';
                    ctx.fillRect(tx-4, H*0.48, 8, H*0.16);
                    ctx.fillStyle = '#3a6b2a';
                    ctx.beginPath(); ctx.arc(tx, H*0.42, 24, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#4a8a3a';
                    ctx.beginPath(); ctx.arc(tx-8, H*0.44, 16, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(tx+8, H*0.44, 16, 0, Math.PI*2); ctx.fill();
                }
            }

            // Отрисовка сцен
            function renderScene(index, progress) {
                ctx.clearRect(0,0,W,H);
                const p = progress; // 0..1
                switch(index) {
                    case 0: // Идёт за хлебом
                        drawBackground(-currentTime*40);
                        drawShop(600, H*0.54, 1.0);
                        const walkX = 150 + p*320;
                        drawCharacter(walkX, H*0.56, 0.9, 'neutral', false);
                        ctx.fillStyle = '#333';
                        ctx.font = 'bold 16px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('Гоша идёт в магазин за хлебом', W/2, H*0.85);
                        break;

                    case 1: // В магазине (покупает или уже купил)
                        drawBackground(0);
                        drawShop(300, H*0.52, 1.1);
                        drawCharacter(440, H*0.56, 0.9, 'happy', true);
                        ctx.fillText('Купил свежий хлеб!', W/2, H*0.82);
                        // Деньги улетают (анимация)
                        ctx.fillStyle = '#ffd966';
                        for (let i=0; i<3; i++) {
                            let mx = 400 + i*12;
                            let my = H*0.48 + Math.sin(currentTime*4 + i)*5;
                            ctx.beginPath(); ctx.arc(mx, my, 6, 0, Math.PI*2); ctx.fill();
                        }
                        break;

                    case 2: // Пришёл домой, жена с бутылкой
                        drawBackground(0);
                        // Дом
                        ctx.fillStyle = '#c49a6c';
                        ctx.fillRect(500, H*0.35, 80, 70);
                        ctx.fillStyle = '#8b5a2b';
                        ctx.beginPath(); ctx.moveTo(490, H*0.35); ctx.lineTo(540, H*0.22); ctx.lineTo(590, H*0.35); ctx.closePath(); ctx.fill();
                        // Персонаж с хлебом
                        drawCharacter(280, H*0.56, 0.9, 'surprised', true);
                        // Жена с бутылкой (поднята)
                        drawWife(470, H*0.56, 0.9, true);
                        ctx.fillText('А где хлеб? Почему так долго?', W/2, H*0.85);
                        break;

                    case 3: // Удар бутылкой и полёт в помойку
                        drawBackground(0);
                        drawDumpster(600, H*0.54, 1.2);
                        // Анимация: персонаж летит
                        const flyT = Math.min(1, p*2.2);
                        const flyX = 400 - flyT*280;
                        const flyY = H*0.56 - flyT*0.35*H + flyT*flyT*0.3*H;
                        drawCharacter(flyX, flyY, 0.85, 'hurt', false);
                        if(flyT>0.8) {
                            ctx.fillStyle = '#ff6644';
                            ctx.font = 'bold 28px Arial';
                            ctx.fillText('БАХ!', 600, H*0.28);
                        }
                        // Жена остаётся
                        drawWife(420, H*0.56, 0.85, false);
                        ctx.fillText('Получай! И в помойку!', W/2, H*0.88);
                        break;
                }
            }

            function getSceneIndexAndProgress() {
                let idx = 0;
                for (let i=SCENES.length-1; i>=0; i--) {
                    if (currentTime >= SCENES[i].start) {
                        idx = i;
                        break;
                    }
                }
                let start = SCENES[idx].start;
                let end = (idx < SCENES.length-1) ? SCENES[idx+1].start : TOTAL_TIME;
                let progress = (end - start) > 0 ? (currentTime - start) / (end - start) : 1;
                return { idx, progress: Math.min(1, Math.max(0, progress)) };
            }

            function animationLoop(timestamp) {
                if (!lastFrameTime) lastFrameTime = timestamp;
                let dt = (timestamp - lastFrameTime) / 1000;
                if (dt > 0.1) dt = 0.1;
                if (isPlaying && currentTime < TOTAL_TIME) {
                    currentTime += dt;
                    if (currentTime >= TOTAL_TIME) currentTime = TOTAL_TIME;
                }
                lastFrameTime = timestamp;

                const { idx, progress } = getSceneIndexAndProgress();
                renderScene(idx, progress);
                document.getElementById('sceneLabel').innerHTML = `Сцена: <span style="color:#ffd966;">${idx+1}/${SCENES.length}</span> — ${SCENES[idx].name}`;

                animationId = requestAnimationFrame(animationLoop);
            }

            function restart() {
                currentTime = 0;
                isPlaying = true;
                lastFrameTime = null;
            }
            function nextScene() {
                if (currentTime >= TOTAL_TIME-0.3) {
                    restart();
                    return;
                }
                const { idx } = getSceneIndexAndProgress();
                if (idx < SCENES.length-1) {
                    currentTime = SCENES[idx+1].start + 0.05;
                } else {
                    currentTime = TOTAL_TIME-0.1;
                }
                isPlaying = true;
                lastFrameTime = null;
            }

            document.getElementById('restartButton').addEventListener('click', restart);
            document.getElementById('nextButton').addEventListener('click', nextScene);
            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const relX = (e.clientX - rect.left) / rect.width;
                if (relX > 0.5) nextScene();
                else restart();
            });
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (currentTime >= TOTAL_TIME) restart();
                    else isPlaying = !isPlaying;
                    if (isPlaying) lastFrameTime = null;
                } else if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    nextScene();
                } else if (e.code === 'KeyR') {
                    e.preventDefault();
                    restart();
                }
            });

            animationId = requestAnimationFrame(animationLoop);
            console.log('Мультик "Гоша и бутылка" запущен. Пробел = пауза, стрелка вправо = дальше, R = сначала.');
        })();
    </script>
</body>
</html>
