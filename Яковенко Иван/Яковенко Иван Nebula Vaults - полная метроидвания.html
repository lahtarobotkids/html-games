<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Nebula Vaults — полная метроидвания</title>
    <style>
        body { margin:0; overflow:hidden; font-family:Arial,sans-serif; }
        canvas { display:block; }
        #ui-layer {
            position:absolute; top:10px; left:10px;
            color:white; text-shadow:2px 2px 4px black;
            font-size:18px; pointer-events:none;
            user-select:none;
        }
        #interact-hint {
            position:absolute; bottom:80px; left:50%; transform:translateX(-50%);
            background:rgba(0,0,0,0.7); color:white; padding:8px 20px;
            border-radius:8px; display:none; pointer-events:none;
        }
        #dialogue-box {
            position:absolute; bottom:120px; left:50%; transform:translateX(-50%);
            background:rgba(0,0,0,0.8); color:white; padding:15px 25px;
            border-radius:12px; max-width:600px; display:none;
            text-align:center; font-size:16px; line-height:1.4;
        }
        #menu-overlay {
            position:absolute; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.85); display:flex; justify-content:center;
            align-items:center; flex-direction:column; color:white;
            pointer-events:auto;
        }
        .menu-btn {
            padding:15px 30px; margin:10px; font-size:20px;
            background:#2ecc71; border:none; border-radius:10px;
            cursor:pointer; transition:0.2s;
        }
        .menu-btn:hover { background:#27ae60; }
    </style>
</head>
<body>
    <div id="ui-layer">
        💰 <span id="coins">0</span> | 🔮 <span id="shards">0</span><br>
        ❤️ <span id="hp">100</span>/<span id="maxhp">100</span> | ⚔️ <span id="dmg">10</span><br>
        📦 Кубы: <span id="cubes">0</span>/12 | 🗺️ <span id="planet-name">Станция</span>
    </div>
    <div id="interact-hint">Нажми E для взаимодействия</div>
    <div id="dialogue-box"></div>
    <div id="menu-overlay">
        <h1>NEBULA VAULTS</h1>
        <button class="menu-btn" id="new-game">Новая игра</button>
        <button class="menu-btn" id="continue-game" style="display:none">Продолжить</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ========== ГЛОБАЛЬНОЕ СОСТОЯНИЕ ==========
        const GameState = {
            coins: 0,
            shards: 0,
            health: 100,
            maxHealth: 100,
            damage: 10,
            abilities: { doubleJump: false, phaseShift: false, thermalCharge: false },
            passives: [],
            equippedPassives: [],
            passiveSlots: 2,
            collectedCubes: [],
            currentPlanet: 'Station',
            playerPos: { x:0, y:0, z:0 },
            bossDefeated: false
        };

        function saveGame() {
            localStorage.setItem('nebula_save', JSON.stringify(GameState));
        }
        function loadGame() {
            const data = localStorage.getItem('nebula_save');
            if (data) {
                const s = JSON.parse(data);
                Object.assign(GameState, s);
                GameState.abilities = s.abilities || {};
                return true;
            }
            return false;
        }

        // ========== THREE.JS БАЗА ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a20);
        scene.fog = new THREE.Fog(0x0a0a20, 10, 120);

        const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(innerWidth, innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const ambient = new THREE.AmbientLight(0x404066);
        const sun = new THREE.DirectionalLight(0xffeedd, 1);
        sun.position.set(10, 20, 5);
        sun.castShadow = true;
        sun.shadow.mapSize.set(1024,1024);
        scene.add(ambient, sun);

        // ========== ПЕРСОНАЖ С АНИМАЦИЯМИ ==========
        const player = new THREE.Object3D();
        player.position.set(0, 0.5, 0);
        scene.add(player);

        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.6 });
        const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.8 });
        const shirtMat = new THREE.MeshStandardMaterial({ color: 0x3498db, roughness: 0.7 });
        const bootMat = new THREE.MeshStandardMaterial({ color: 0x5d3a1a, roughness: 0.9 });

        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.7, 8), shirtMat);
        torso.position.y = 1.05; torso.castShadow = true; torso.receiveShadow = true;
        player.add(torso);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), skinMat);
        head.position.y = 1.55; head.castShadow = true; head.receiveShadow = true;
        player.add(head);

        const eyeWhiteL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        eyeWhiteL.position.set(-0.1, 1.6, -0.2); player.add(eyeWhiteL);
        const eyePupilL = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 6), new THREE.MeshStandardMaterial({ color: 0x000000 }));
        eyePupilL.position.set(-0.1, 1.6, -0.24); player.add(eyePupilL);
        const eyeWhiteR = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        eyeWhiteR.position.set(0.1, 1.6, -0.2); player.add(eyeWhiteR);
        const eyePupilR = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 6), new THREE.MeshStandardMaterial({ color: 0x000000 }));
        eyePupilR.position.set(0.1, 1.6, -0.24); player.add(eyePupilR);

        const leftUpperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.5, 6), skinMat);
        leftUpperArm.position.set(-0.45, 1.3, 0); leftUpperArm.castShadow = true; player.add(leftUpperArm);
        const leftLowerArm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.45, 6), skinMat);
        leftLowerArm.position.set(-0.45, 1.0, 0); leftLowerArm.castShadow = true; player.add(leftLowerArm);

        const rightUpperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.5, 6), skinMat);
        rightUpperArm.position.set(0.45, 1.3, 0); rightUpperArm.castShadow = true; player.add(rightUpperArm);
        const rightLowerArm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.45, 6), skinMat);
        rightLowerArm.position.set(0.45, 1.0, 0); rightLowerArm.castShadow = true; player.add(rightLowerArm);

        const leftUpperLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.5, 6), pantsMat);
        leftUpperLeg.position.set(-0.2, 0.7, 0); leftUpperLeg.castShadow = true; player.add(leftUpperLeg);
        const leftLowerLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.45, 6), pantsMat);
        leftLowerLeg.position.set(-0.2, 0.4, 0); leftLowerLeg.castShadow = true; player.add(leftLowerLeg);

        const rightUpperLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.5, 6), pantsMat);
        rightUpperLeg.position.set(0.2, 0.7, 0); rightUpperLeg.castShadow = true; player.add(rightUpperLeg);
        const rightLowerLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.45, 6), pantsMat);
        rightLowerLeg.position.set(0.2, 0.4, 0); rightLowerLeg.castShadow = true; player.add(rightLowerLeg);

        const leftBoot = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.25), bootMat);
        leftBoot.position.set(-0.2, 0.15, 0.05); leftBoot.castShadow = true; player.add(leftBoot);
        const rightBoot = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.25), bootMat);
        rightBoot.position.set(0.2, 0.15, 0.05); rightBoot.castShadow = true; player.add(rightBoot);

        const animParts = {
            head,
            torso,
            leftUpperArm, leftLowerArm,
            rightUpperArm, rightLowerArm,
            leftUpperLeg, leftLowerLeg, leftBoot,
            rightUpperLeg, rightLowerLeg, rightBoot
        };

        let animTime = 0;
        let isAttacking = false;
        let attackTimer = 0;

        function resetPose() {
            animParts.leftUpperArm.rotation.x = 0; animParts.leftLowerArm.rotation.x = 0;
            animParts.rightUpperArm.rotation.x = 0; animParts.rightLowerArm.rotation.x = 0;
            animParts.leftUpperLeg.rotation.x = 0; animParts.leftLowerLeg.rotation.x = 0;
            animParts.rightUpperLeg.rotation.x = 0; animParts.rightLowerLeg.rotation.x = 0;
            animParts.head.rotation.x = 0; animParts.head.rotation.z = 0;
            animParts.torso.rotation.x = 0; animParts.torso.rotation.z = 0;
        }

        function animateIdle(t) {
            resetPose();
            const sway = Math.sin(t * 3) * 0.05;
            animParts.torso.rotation.z = sway;
            animParts.head.rotation.z = -sway;
        }

        function animateWalk(t) {
            resetPose();
            const legSwing = Math.sin(t * 8) * 0.6;
            const armSwing = Math.sin(t * 8) * 0.5;
            animParts.leftUpperLeg.rotation.x = legSwing;
            animParts.leftLowerLeg.rotation.x = Math.abs(legSwing) * 0.5;
            animParts.rightUpperLeg.rotation.x = -legSwing;
            animParts.rightLowerLeg.rotation.x = Math.abs(legSwing) * 0.5;
            animParts.leftUpperArm.rotation.x = -armSwing;
            animParts.rightUpperArm.rotation.x = armSwing;
            animParts.torso.rotation.x = 0.1;
        }

        function animateJump() {
            resetPose();
            animParts.leftUpperLeg.rotation.x = 0.5;
            animParts.leftLowerLeg.rotation.x = 0.8;
            animParts.rightUpperLeg.rotation.x = 0.5;
            animParts.rightLowerLeg.rotation.x = 0.8;
            animParts.torso.rotation.x = -0.2;
            animParts.head.rotation.x = -0.1;
        }

        function animateDash() {
            resetPose();
            animParts.torso.rotation.x = 0.5;
            animParts.head.rotation.x = 0.2;
            animParts.leftUpperArm.rotation.x = 1.0;
            animParts.rightUpperArm.rotation.x = 1.0;
            animParts.leftUpperLeg.rotation.x = -0.3;
            animParts.rightUpperLeg.rotation.x = -0.3;
        }

        function animateAttack() {
            resetPose();
            const progress = attackTimer / 0.3;
            if (progress < 0.5) {
                const angle = progress * 2 * (-Math.PI / 2);
                animParts.rightUpperArm.rotation.x = angle;
                animParts.rightLowerArm.rotation.x = -0.5;
            } else {
                const angle = (1 - (progress - 0.5) * 2) * (-Math.PI / 2);
                animParts.rightUpperArm.rotation.x = angle;
                animParts.rightLowerArm.rotation.x = -0.5;
            }
        }

        function updateAnimation(delta, moving, jumping, dashing, attacking) {
            animTime += delta;
            if (attacking) {
                attackTimer += delta;
                if (attackTimer > 0.3) { isAttacking = false; attackTimer = 0; }
                animateAttack();
                return;
            }
            if (dashing) { animateDash(); return; }
            if (jumping) { animateJump(); return; }
            if (moving) { animateWalk(animTime); return; }
            animateIdle(animTime);
        }

        const camOffset = new THREE.Vector3(0, 3.5, -6);

        // ========== ПЛАНЕТЫ И ОБЪЕКТЫ ==========
        const planets = {
            Station: { groundColor: 0x2c3e50, skyColor: 0x0a0a20 },
            Aridus:  { groundColor: 0xc4915e, skyColor: 0x3d1e0a },
            Voidstar:{ groundColor: 0x34495e, skyColor: 0x0d0d2b },
            Cryo9:   { groundColor: 0xaed6f1, skyColor: 0x1b4f72 }
        };
        let currentPlanetData = planets.Station;

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness:0.8 })
        );
        ground.rotation.x = -Math.PI/2;
        ground.receiveShadow = true;
        scene.add(ground);

        function switchPlanet(name) {
            GameState.currentPlanet = name;
            currentPlanetData = planets[name];
            ground.material.color.set(currentPlanetData.groundColor);
            scene.background = new THREE.Color(currentPlanetData.skyColor);
            updatePlanetObjects();
            document.getElementById('planet-name').textContent = name;
        }

        const allCollectibles = [
            { id:'cube1', planet:'Aridus', pos:[8, 1.5, -8] },
            { id:'cube2', planet:'Aridus', pos:[-6, 2, 12] },
            { id:'cube3', planet:'Voidstar', pos:[10, 1.5, 10] },
            { id:'cube4', planet:'Voidstar', pos:[-12, 1.5, -5] },
            { id:'cube5', planet:'Cryo9', pos:[5, 2, -15] },
            { id:'cube6', planet:'Cryo9', pos:[-8, 1.5, 15] },
        ];
        const collectibleMeshes = [];

        function createCollectibles() {
            allCollectibles.forEach(c => {
                if (GameState.collectedCubes.includes(c.id)) return;
                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(0.6,0.6,0.6),
                    new THREE.MeshStandardMaterial({ color:0x2980b9, emissive:0x112233 })
                );
                mesh.position.set(c.pos[0], c.pos[1], c.pos[2]);
                mesh.userData = { id:c.id, planet:c.planet };
                mesh.castShadow = true;
                scene.add(mesh);
                collectibleMeshes.push(mesh);
            });
        }

        function createNPC(x, z, label, color=0xe67e22) {
            const obj = new THREE.Object3D();
            obj.position.set(x, 0, z);
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,2,8),
                new THREE.MeshStandardMaterial({ color }));
            body.position.y = 1; body.castShadow = true;
            obj.add(body);
            const div = document.createElement('div'); div.textContent = label;
            div.style.color='white'; div.style.fontWeight='bold';
            const lbl = new CSS2DObject(div); lbl.position.y = 2.5;
            obj.add(lbl);
            scene.add(obj);
            return obj;
        }

        const forge = createNPC(3, 0, "Коваль");
        const trader = createNPC(-3, 0, "Зикс");
        const orbikul = createNPC(0, -4, "Орбикул (кубы)", 0x9b59b6);

        const portalPositions = {
            Aridus: new THREE.Vector3(15, 0.5, 15),
            Voidstar: new THREE.Vector3(-15, 0.5, 15),
            Cryo9: new THREE.Vector3(15, 0.5, -15)
        };
        const portalMeshes = {};

        function createPortals() {
            Object.entries(portalPositions).forEach(([planet, pos]) => {
                const mesh = new THREE.Mesh(
                    new THREE.TorusGeometry(1, 0.2, 16, 32),
                    new THREE.MeshStandardMaterial({ color:0x9b59b6, emissive:0x4a235a })
                );
                mesh.position.copy(pos);
                mesh.position.y = 1;
                mesh.rotation.x = Math.PI/2;
                mesh.userData = { planet };
                scene.add(mesh);
                portalMeshes[planet] = mesh;
            });
        }

        function updatePlanetObjects() {
            collectibleMeshes.forEach(m => {
                m.visible = (m.userData.planet === GameState.currentPlanet || GameState.currentPlanet === 'Station');
            });
            Object.values(portalMeshes).forEach(p => p.visible = GameState.currentPlanet === 'Station');
        }

        // ========== БОСС ==========
        let boss = null, bossHP = 100, bossPhase = 1;

        function startBossFight() {
            if (boss) return;
            showDialogue("Архивариус-Страж пробудился! Сражайся!");
            boss = new THREE.Mesh(
                new THREE.BoxGeometry(2,3,2),
                new THREE.MeshStandardMaterial({ color:0xc0392b })
            );
            boss.position.set(0, 1.5, -8);
            boss.castShadow = true;
            scene.add(boss);
            bossHP = 100; bossPhase = 1;
        }

        function updateBoss(delta) {
            if (!boss) return;
            if (bossPhase === 1) {
                boss.rotation.y += 0.5 * delta;
                if (player.position.distanceTo(boss.position) < 2.5) {
                    GameState.health -= 10 * delta;
                    updateHUD();
                }
                if (bossHP <= 50) { bossPhase = 2; boss.material.color.set(0xe67e22); }
            } else if (bossPhase === 2) {
                boss.rotation.y += 0.8 * delta;
                if (player.position.distanceTo(boss.position) < 3) {
                    GameState.health -= 15 * delta;
                    updateHUD();
                }
                if (bossHP <= 0) defeatBoss();
            }
            if (GameState.health <= 0) {
                alert("Смерть. Загрузите последнее сохранение.");
                location.reload();
            }
        }

        function defeatBoss() {
            scene.remove(boss);
            boss = null;
            GameState.bossDefeated = true;
            GameState.shards += 20;
            showDialogue("Босс побеждён! Получена Карта Гармонического Резонанса.");
            GameState.passiveSlots = 3;
            saveGame();
        }

        // ========== УПРАВЛЕНИЕ ==========
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        let jumpVel = 0, canDoubleJump = false, dashCooldown = 0;

        function updatePlayer(delta) {
            const speed = keys['ShiftLeft'] ? 10 : 5;
            const dir = new THREE.Vector3();
            let moving = false;
            if (keys['KeyW']) { dir.z -= 1; moving = true; }
            if (keys['KeyS']) { dir.z += 1; moving = true; }
            if (keys['KeyA']) { dir.x -= 1; moving = true; }
            if (keys['KeyD']) { dir.x += 1; moving = true; }
            dir.normalize();

            let dashing = false;
            if (keys['KeyE'] && dashCooldown <= 0) {
                dashCooldown = 1.5;
                const dashPower = 15;
                player.position.x += dir.x * dashPower * delta;
                player.position.z += dir.z * dashPower * delta;
                dashing = true;
                if (GameState.equippedPassives.includes('smokeDash')) {
                    player.children.forEach(child => { if (child.material) child.material.transparent = true; child.material.opacity = 0.3; });
                    setTimeout(() => {
                        player.children.forEach(child => { if (child.material) { child.material.opacity = 1; child.material.transparent = false; } });
                    }, 1500);
                }
            } else if (!dashing) {
                player.position.x += dir.x * speed * delta;
                player.position.z += dir.z * speed * delta;
            }
            dashCooldown -= delta;

            let jumping = player.position.y > 0.1;
            if (keys['Space']) {
                if (player.position.y <= 0.01) {
                    jumpVel = 8; canDoubleJump = GameState.abilities.doubleJump;
                    keys['Space'] = false; jumping = true;
                } else if (canDoubleJump && GameState.abilities.doubleJump) {
                    jumpVel = 7; canDoubleJump = false;
                    keys['Space'] = false; jumping = true;
                }
            }
            jumpVel -= 15 * delta;
            player.position.y += jumpVel * delta;
            if (player.position.y < 0) { player.position.y = 0; jumpVel = 0; jumping = false; }

            let attacking = false;
            if (keys['KeyQ'] && !isAttacking) {
                attacking = true;
                keys['KeyQ'] = false;
                if (boss && player.position.distanceTo(boss.position) < 3) {
                    const dmg = GameState.damage * (GameState.equippedPassives.includes('berserk') && GameState.health<30 ? 1.5 : 1);
                    bossHP -= dmg;
                    showDialogue(`Урон: ${dmg.toFixed(1)}`);
                    if (bossHP <= 0) defeatBoss();
                }
            }

            updateAnimation(delta, moving, jumping, dashing, attacking);

            const target = player.position.clone().add(camOffset);
            camera.position.lerp(target, 0.1);
            camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
        }

        function checkInteraction() {
            const p = player.position;
            const dist = (obj) => p.distanceTo(obj.position);
            if (keys['KeyF']) { keys['KeyF'] = false; collectCube(); }
            if (dist(forge) < 2 && keys['KeyE']) {
                keys['KeyE'] = false;
                if (GameState.shards >= 5 && GameState.coins >= 10) {
                    GameState.shards -= 5; GameState.coins -= 10;
                    GameState.damage += 2;
                    showDialogue("Коваль: Оружие усилено! Урон +2");
                    updateHUD(); saveGame();
                } else showDialogue("Не хватает ресурсов (5 шардов, 10 монет)");
            }
            if (dist(trader) < 2 && keys['KeyE']) {
                keys['KeyE'] = false;
                if (GameState.coins >= 50 && !GameState.passives.includes('smokeDash')) {
                    GameState.coins -= 50;
                    GameState.passives.push('smokeDash');
                    GameState.equippedPassives.push('smokeDash');
                    showDialogue("Зикс: Дымовая шашка куплена! Рывок делает вас невидимым.");
                    updateHUD(); saveGame();
                } else showDialogue("Недостаточно монет или уже куплено.");
            }
            if (dist(orbikul) < 2 && keys['KeyE']) {
                keys['KeyE'] = false;
                if (GameState.collectedCubes.length >= 12 && !GameState.bossDefeated) {
                    startBossFight();
                } else {
                    showDialogue(`Орбикул: Найдено ${GameState.collectedCubes.length}/12 кубов. Собери все, чтобы получить карту.`);
                }
            }
            if (GameState.currentPlanet === 'Station') {
                for (let [planet, mesh] of Object.entries(portalMeshes)) {
                    if (dist(mesh) < 2 && keys['KeyE']) {
                        keys['KeyE'] = false;
                        switchPlanet(planet);
                    }
                }
            }
        }

        function collectCube() {
            const p = player.position;
            for (let i=0; i<collectibleMeshes.length; i++) {
                const m = collectibleMeshes[i];
                if (p.distanceTo(m.position) < 1.5 && m.visible) {
                    GameState.collectedCubes.push(m.userData.id);
                    scene.remove(m);
                    collectibleMeshes.splice(i,1);
                    GameState.shards += 3; GameState.coins += 30;
                    updateHUD(); saveGame();
                    playBeep(1 - GameState.collectedCubes.length/12);
                    if (GameState.collectedCubes.length === 12) {
                        showDialogue("Орбикул: Все кубы собраны! Возвращайся ко мне за наградой.");
                    }
                    break;
                }
            }
        }

        function updateHUD() {
            document.getElementById('coins').textContent = GameState.coins;
            document.getElementById('shards').textContent = GameState.shards;
            document.getElementById('hp').textContent = Math.ceil(GameState.health);
            document.getElementById('maxhp').textContent = GameState.maxHealth;
            document.getElementById('dmg').textContent = GameState.damage;
            document.getElementById('cubes').textContent = GameState.collectedCubes.length;
            document.getElementById('planet-name').textContent = GameState.currentPlanet;
        }

        function showDialogue(text, duration=3000) {
            const box = document.getElementById('dialogue-box');
            box.style.display = 'block';
            box.textContent = text;
            clearTimeout(window._dialogueTimer);
            window._dialogueTimer = setTimeout(() => box.style.display = 'none', duration);
        }

        function playBeep(closeness) {
            if (!window.audioCtx) return;
            const osc = window.audioCtx.createOscillator();
            const gain = window.audioCtx.createGain();
            osc.frequency.value = 400 + closeness * 400;
            gain.gain.setValueAtTime(0.1, window.audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, window.audioCtx.currentTime+0.15);
            osc.connect(gain).connect(window.audioCtx.destination);
            osc.start(); osc.stop(window.audioCtx.currentTime+0.15);
        }

        function initAudio() { if (!window.audioCtx) window.audioCtx = new AudioContext(); }
        document.addEventListener('click', initAudio, {once:true});

        // ========== МЕНЮ И ЗАПУСК ==========
        const menu = document.getElementById('menu-overlay');
        document.getElementById('new-game').onclick = () => {
            menu.style.display = 'none';
            GameState.abilities.doubleJump = true;
            switchPlanet('Station');
            createCollectibles();
            createPortals();
            updateHUD();
        };
        document.getElementById('continue-game').onclick = () => {
            if (loadGame()) {
                menu.style.display = 'none';
                switchPlanet(GameState.currentPlanet);
                player.position.set(GameState.playerPos.x, GameState.playerPos.y, GameState.playerPos.z);
                createCollectibles();
                createPortals();
                updateHUD();
            }
        };
        if (localStorage.getItem('nebula_save')) {
            document.getElementById('continue-game').style.display = 'block';
        }

        setInterval(() => {
            GameState.playerPos = { x:player.position.x, y:player.position.y, z:player.position.z };
            saveGame();
        }, 5000);

        let clock = new THREE.Clock();
        function animate() {
            const delta = Math.min(clock.getDelta(), 0.1);
            updatePlayer(delta);
            checkInteraction();
            updateBoss(delta);
            collectibleMeshes.forEach(m => m.rotation.y += delta*0.5);
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
            labelRenderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>
