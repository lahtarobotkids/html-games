<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Танчики (медленные)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
        }
        .game-container {
            text-align: center;
        }
        canvas {
            background-color: #000;
            border: 2px solid #555;
            display: block;
            margin: 0 auto;
        }
        .score-panel {
            color: #fff;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .message {
            color: #ff0;
            font-size: 20px;
            margin-top: 8px;
            height: 24px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="score-panel">
            Уничтожено: <span id="scoreDisplay">0</span> / <span id="totalEnemies">5</span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="message" id="messageDisplay"></div>
    </div>
</body>

<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const totalSpan = document.getElementById('totalEnemies');
    const messageDiv = document.getElementById('messageDisplay');

    const gridSize = 20;
    const cols = canvas.width / gridSize;   // 20
    const rows = canvas.height / gridSize;  // 20

    let board = [];
    let player = null;
    let enemies = [];
    let bullets = [];

    let score = 0;
    const totalEnemies = 5;
    let gameRunning = true;
    let gameOver = false;
    let victory = false;

    let gameLoop = null;

    let playerDir = { x: 0, y: -1 };
    let keys = {
        ArrowUp: false,
        ArrowDown: false,
        ArrowLeft: false,
        ArrowRight: false
    };

    // ========== Генерация уровня ==========
    function generateLevel() {
        board = Array(rows).fill().map(() => Array(cols).fill(0));
        const steelPositions = [
            [5,5],[5,6],[6,5],[6,6],
            [14,5],[14,6],[15,5],[15,6],
            [5,14],[5,15],[6,14],[6,15],
            [14,14],[14,15],[15,14],[15,15],
            [9,9],[10,9],[11,9],[9,10],[11,10],[9,11],[10,11],[11,11]
        ];
        for (let [x,y] of steelPositions) {
            if (x < cols && y < rows) board[y][x] = 2;
        }
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                if (board[y][x] !== 0) continue;
                if ( (x >= 8 && x <= 11 && y >= 17) || (y <= 3) ) continue;
                if (Math.random() < 0.15) {
                    board[y][x] = 1;
                }
            }
        }
    }

    // ========== Танки ==========
    function createPlayer() {
        return {
            x: 9, y: 18,
            dirX: 0, dirY: -1,
            type: 'player'
        };
    }

    function createEnemy(startX, startY) {
        const dirs = [{x:0,y:-1}, {x:1,y:0}, {x:0,y:1}, {x:-1,y:0}];
        const dir = dirs[Math.floor(Math.random() * dirs.length)];
        return {
            x: startX, y: startY,
            dirX: dir.x, dirY: dir.y,
            type: 'enemy',
            changeTimer: 0
        };
    }

    function placeEnemies() {
        enemies = [];
        const freeCells = [];
        for (let y = 0; y <= 3; y++) {
            for (let x = 0; x < cols; x++) {
                if (board[y][x] === 0) freeCells.push({x, y});
            }
        }
        freeCells.sort(() => Math.random() - 0.5);
        for (let i = 0; i < totalEnemies && i < freeCells.length; i++) {
            const {x, y} = freeCells[i];
            enemies.push(createEnemy(x, y));
        }
    }

    // ========== Стрельба ==========
    function shoot(tank) {
        const bulletX = tank.x + tank.dirX;
        const bulletY = tank.y + tank.dirY;
        if (bulletX < 0 || bulletX >= cols || bulletY < 0 || bulletY >= rows) return;
        if (board[bulletY][bulletX] !== 0) {
            handleBulletHit(bulletX, bulletY, tank.type);
            return;
        }
        if (tank.type === 'player') {
            const existing = bullets.find(b => b.owner === 'player');
            if (existing) return;
        }
        bullets.push({
            x: bulletX, y: bulletY,
            dirX: tank.dirX, dirY: tank.dirY,
            owner: tank.type
        });
    }

    function handleBulletHit(x, y, owner) {
        if (x < 0 || x >= cols || y < 0 || y >= rows) return false;
        if (board[y][x] === 1) {
            board[y][x] = 0;
            return true;
        }
        if (board[y][x] === 2) {
            return true;
        }
        if (player && player.x === x && player.y === y) {
            if (owner === 'enemy') {
                endGame(false);
            }
            return true;
        }
        for (let i = enemies.length - 1; i >= 0; i--) {
            const enemy = enemies[i];
            if (enemy.x === x && enemy.y === y) {
                if (owner === 'player') {
                    enemies.splice(i, 1);
                    score++;
                    scoreSpan.textContent = score;
                    if (enemies.length === 0) {
                        endGame(true);
                    }
                }
                return true;
            }
        }
        return false;
    }

    function moveBullets() {
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            let remove = false;
            for (let step = 0; step < 2; step++) {
                const newX = b.x + b.dirX;
                const newY = b.y + b.dirY;
                if (newX < 0 || newX >= cols || newY < 0 || newY >= rows) {
                    remove = true;
                    break;
                }
                const hit = handleBulletHit(newX, newY, b.owner);
                if (hit) {
                    remove = true;
                    break;
                }
                b.x = newX;
                b.y = newY;
            }
            if (remove) {
                bullets.splice(i, 1);
            }
        }
    }

    // ========== Движение танков ==========
    function tryMove(tank, newX, newY) {
        if (newX < 0 || newX >= cols || newY < 0 || newY >= rows) return false;
        if (board[newY][newX] !== 0) return false;
        if (player && player !== tank && player.x === newX && player.y === newY) return false;
        for (let enemy of enemies) {
            if (enemy !== tank && enemy.x === newX && enemy.y === newY) return false;
        }
        return true;
    }

    function movePlayer() {
        if (!player || !gameRunning) return;
        if (keys.ArrowUp)    { playerDir = { x: 0, y: -1 }; }
        if (keys.ArrowDown)  { playerDir = { x: 0, y: 1 }; }
        if (keys.ArrowLeft)  { playerDir = { x: -1, y: 0 }; }
        if (keys.ArrowRight) { playerDir = { x: 1, y: 0 }; }

        if (!keys.ArrowUp && !keys.ArrowDown && !keys.ArrowLeft && !keys.ArrowRight) {
            return;
        }

        const newX = player.x + playerDir.x;
        const newY = player.y + playerDir.y;
        if (tryMove(player, newX, newY)) {
            player.x = newX;
            player.y = newY;
            player.dirX = playerDir.x;
            player.dirY = playerDir.y;
        } else {
            player.dirX = playerDir.x;
            player.dirY = playerDir.y;
        }
    }

    function moveEnemies() {
        for (let enemy of enemies) {
            enemy.changeTimer--;
            let moved = false;
            const newX = enemy.x + enemy.dirX;
            const newY = enemy.y + enemy.dirY;
            if (tryMove(enemy, newX, newY) && enemy.changeTimer > 0) {
                enemy.x = newX;
                enemy.y = newY;
                moved = true;
            } else {
                const dirs = [{x:0,y:-1}, {x:1,y:0}, {x:0,y:1}, {x:-1,y:0}];
                const filtered = dirs.filter(d => !(d.x === -enemy.dirX && d.y === -enemy.dirY));
                const newDir = filtered[Math.floor(Math.random() * filtered.length)];
                enemy.dirX = newDir.x;
                enemy.dirY = newDir.y;
                enemy.changeTimer = 5 + Math.floor(Math.random() * 10);
                const retryX = enemy.x + enemy.dirX;
                const retryY = enemy.y + enemy.dirY;
                if (tryMove(enemy, retryX, retryY)) {
                    enemy.x = retryX;
                    enemy.y = retryY;
                    moved = true;
                }
            }
            if (!moved) {
                enemy.changeTimer = Math.min(enemy.changeTimer, 1);
            }
            if (Math.random() < 0.03) {
                shoot(enemy);
            }
        }
    }

    // ========== Завершение игры ==========
    function endGame(win) {
        if (!gameRunning) return;
        gameRunning = false;
        gameOver = true;
        victory = win;
        clearInterval(gameLoop);
        gameLoop = null;
        if (win) {
            messageDiv.textContent = 'ПОБЕДА! Все враги уничтожены. ПРОБЕЛ — новая игра.';
        } else {
            messageDiv.textContent = 'ПОРАЖЕНИЕ! Ваш танк подбит. ПРОБЕЛ — новая игра.';
        }
    }

    // ========== Отрисовка ==========
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                if (board[y][x] === 1) {
                    ctx.fillStyle = '#b5651d';
                    ctx.fillRect(x * gridSize, y * gridSize, gridSize-1, gridSize-1);
                } else if (board[y][x] === 2) {
                    ctx.fillStyle = '#888';
                    ctx.fillRect(x * gridSize, y * gridSize, gridSize-1, gridSize-1);
                }
            }
        }
        ctx.fillStyle = '#ff0';
        for (let b of bullets) {
            ctx.fillRect(b.x * gridSize + 6, b.y * gridSize + 6, 8, 8);
        }
        for (let enemy of enemies) {
            drawTank(enemy, '#f00');
        }
        if (player) {
            drawTank(player, '#0f0');
        }
    }

    function drawTank(tank, color) {
        const x = tank.x * gridSize;
        const y = tank.y * gridSize;
        ctx.fillStyle = color;
        ctx.fillRect(x + 2, y + 2, gridSize - 4, gridSize - 4);
        ctx.fillStyle = '#000';
        const cx = x + gridSize/2;
        const cy = y + gridSize/2;
        const tipX = cx + tank.dirX * 8;
        const tipY = cy + tank.dirY * 8;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(tipX, tipY);
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#000';
        ctx.stroke();
        ctx.lineWidth = 1;
    }

    // ========== Игровой цикл ==========
    function update() {
        if (!gameRunning) return;
        movePlayer();
        moveEnemies();
        moveBullets();
        draw();
    }

    // ========== Обработчики клавиш ==========
    function keyDownHandler(e) {
        const key = e.key;
        if (key.startsWith('Arrow')) {
            e.preventDefault();
            keys[key] = true;
        }
        if (key === ' ' || e.code === 'Space') {
            e.preventDefault();
            if (gameOver) {
                restartGame();
            } else if (gameRunning && player) {
                shoot(player);
            }
        }
    }

    function keyUpHandler(e) {
        const key = e.key;
        if (key.startsWith('Arrow')) {
            e.preventDefault();
            keys[key] = false;
        }
    }

    // ========== Рестарт ==========
    function restartGame() {
        bullets = [];
        score = 0;
        scoreSpan.textContent = '0';
        totalSpan.textContent = totalEnemies;
        messageDiv.textContent = '';
        generateLevel();
        player = createPlayer();
        placeEnemies();
        gameRunning = true;
        gameOver = false;
        victory = false;
        if (gameLoop) clearInterval(gameLoop);
        // ЗАМЕДЛЕНО В 5 РАЗ: было 80 мс, стало 400 мс
        gameLoop = setInterval(update, 400);
        playerDir = { x: 0, y: -1 };
        keys = {
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false
        };
        draw();
    }

    // ========== Запуск ==========
    document.addEventListener('keydown', keyDownHandler);
    document.addEventListener('keyup', keyUpHandler);

    generateLevel();
    player = createPlayer();
    placeEnemies();
    totalSpan.textContent = totalEnemies;
    // ЗАМЕДЛЕНО В 5 РАЗ: было 80 мс, стало 400 мс
    gameLoop = setInterval(update, 400);
    draw();
})();
</script>
</html>
