<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Breath — 4 мира</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #050d14;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #1a3a4a;
            border-radius: 12px;
            box-shadow: 0 0 60px rgba(0, 100, 150, 0.25);
            background: #0b1a22;
            cursor: none;
            display: block;
            image-rendering: pixelated;
        }

        #mainMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 12, 20, 0.92);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            flex-direction: column;
        }
        #mainMenu.hidden {
            display: none;
        }
        #mainMenu .title {
            font-size: 48px;
            font-weight: bold;
            color: #6effd0;
            text-shadow: 0 0 60px #2dc9a066;
            letter-spacing: 4px;
            margin-bottom: 2px;
        }
        #mainMenu .subtitle {
            font-size: 14px;
            color: #4a8a9a;
            letter-spacing: 6px;
            margin-bottom: 10px;
        }
        #mainMenu .stats {
            color: #f5c542;
            font-size: 14px;
            margin-bottom: 12px;
            text-align: center;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 24px;
            border-radius: 12px;
            border: 1px solid #2a5a6a;
        }
        #mainMenu .stats span {
            color: #fff;
        }
        #mainMenu .menu-btn {
            display: block;
            width: 220px;
            padding: 10px 0;
            margin: 4px auto;
            background: transparent;
            border: 2px solid #2a5a6a;
            border-radius: 50px;
            color: #8fcbdd;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
            text-align: center;
        }
        #mainMenu .menu-btn:hover {
            background: #1a3a4a;
            border-color: #5aaac0;
            color: #ffffff;
            transform: scale(1.02);
        }
        #mainMenu .menu-btn.primary {
            border-color: #3a8aaa;
            background: rgba(42, 90, 106, 0.2);
        }
        #mainMenu .menu-btn.primary:hover {
            background: #2a6a7a;
            border-color: #6effd0;
        }
        #mainMenu .menu-btn.acid-btn {
            border-color: #4a7a2a;
            color: #8aba6a;
        }
        #mainMenu .menu-btn.acid-btn:hover {
            background: #1a2a1a;
            border-color: #8aba6a;
            color: #aadd88;
        }
        #mainMenu .menu-btn.fire-btn {
            border-color: #8a3a1a;
            color: #cc6a4a;
        }
        #mainMenu .menu-btn.fire-btn:hover {
            background: #1a0a0a;
            border-color: #cc6a4a;
            color: #ff8866;
        }
        #mainMenu .menu-btn.ice-btn {
            border-color: #3a6a8a;
            color: #6aaacc;
        }
        #mainMenu .menu-btn.ice-btn:hover {
            background: #0a1a2a;
            border-color: #6aaacc;
            color: #88ccff;
        }
        #mainMenu .menu-btn.shop-btn {
            border-color: #c8962a;
            color: #f5c542;
        }
        #mainMenu .menu-btn.shop-btn:hover {
            background: #2a2a1a;
            border-color: #f5c542;
        }
        #mainMenu .version {
            position: absolute;
            bottom: 20px;
            color: #1a4a5a;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .world-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: 6px 0;
        }
        .world-grid .menu-btn {
            width: 105px;
            padding: 8px 0;
            font-size: 11px;
            margin: 0;
        }

        #shopOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 60;
            display: none;
            justify-content: center;
            align-items: center;
        }
        #shopOverlay.open {
            display: flex;
        }
        #shop {
            background: linear-gradient(145deg, #0d2630, #091a22);
            border: 2px solid #c8962a;
            border-radius: 24px;
            padding: 16px 20px;
            max-width: 520px;
            width: 92%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 80px rgba(200, 150, 40, 0.15);
            color: #c8e6f0;
            font-family: 'Courier New', monospace;
        }
        #shop h2 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 2px;
            color: #f5c542;
            letter-spacing: 2px;
        }
        #shop .coins {
            text-align: center;
            font-size: 16px;
            margin-bottom: 10px;
            color: #f5c542;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid #3a6a3a;
        }
        #shop .coins span {
            font-size: 22px;
            font-weight: bold;
        }
        .shop-tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 8px;
            border-bottom: 1px solid #1a4a5a;
            padding-bottom: 6px;
        }
        .shop-tabs button {
            background: transparent;
            border: 1px solid #1a4a5a;
            color: #7aabb5;
            padding: 3px 10px;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .shop-tabs button:hover {
            border-color: #3a8aaa;
            color: #c8e6f0;
        }
        .shop-tabs button.active-tab {
            border-color: #c8962a;
            color: #f5c542;
            background: rgba(200, 150, 40, 0.1);
        }
        .shop-section {
            display: none;
        }
        .shop-section.active-section {
            display: block;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid #1a4a5a;
            border-radius: 10px;
            padding: 6px 10px;
            margin-bottom: 4px;
            transition: 0.2s;
        }
        .shop-item:hover {
            border-color: #c8962a;
            background: rgba(255, 255, 255, 0.07);
        }
        .shop-item .info {
            display: flex;
            flex-direction: column;
            gap: 1px;
            flex: 1;
        }
        .shop-item .info .name {
            font-weight: bold;
            font-size: 12px;
            color: #d0ecf5;
        }
        .shop-item .info .desc {
            font-size: 9px;
            color: #7aabb5;
        }
        .shop-item .info .owned {
            font-size: 9px;
            color: #6effd0;
        }
        .shop-item .buy-btn {
            background: #1a5a6a;
            border: none;
            color: white;
            padding: 3px 12px;
            border-radius: 30px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #3a8aaa;
            white-space: nowrap;
            margin-left: 6px;
            min-width: 45px;
        }
        .shop-item .buy-btn:hover:not(:disabled) {
            background: #c8962a;
            border-color: #f5c542;
            transform: scale(1.05);
        }
        .shop-item .buy-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .shop-item .buy-btn.owned-btn {
            background: #2a4a3a;
            border-color: #4a8a6a;
            opacity: 0.6;
            cursor: default;
        }
        .shop-item .buy-btn.active-btn {
            background: #f5c542;
            border-color: #f5c542;
            color: #0a1a22;
        }
        #shop .close-shop {
            display: block;
            margin: 10px auto 0;
            background: transparent;
            border: 1px solid #3a6a7a;
            color: #7aabb5;
            padding: 5px 20px;
            border-radius: 40px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        #shop .close-shop:hover {
            background: #1a3a4a;
            color: #c8e6f0;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 8px;
            background: rgba(0, 20, 30, 0.8);
            padding: 3px 10px;
            border-radius: 30px;
            backdrop-filter: blur(6px);
            border: 1px solid #2a5a6a;
            pointer-events: none;
            font-weight: bold;
            color: #8fcbdd;
            font-size: 10px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            font-family: 'Courier New', monospace;
        }
        #ui span {
            color: #fff;
        }
        .o2-bar {
            display: inline-block;
            width: 60px;
            height: 9px;
            background: #1a2a2a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #3a6a7a;
            vertical-align: middle;
            margin-left: 2px;
        }
        .o2-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #2dc9a0, #6effd0);
            border-radius: 10px;
            transition: width 0.1s linear;
        }
        .shield-bar {
            display: inline-block;
            width: 60px;
            height: 9px;
            background: #1a2a2a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #3a6a7a;
            vertical-align: middle;
            margin-left: 2px;
        }
        .shield-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff8844, #ffcc44);
            border-radius: 10px;
            transition: width 0.1s linear;
        }
        .depth-indicator {
            color: #6effd0;
            font-size: 10px;
        }
        .world-indicator {
            color: #f5c542;
            font-size: 10px;
        }
        #ui .pause-hint {
            font-size: 9px;
            opacity: 0.4;
        }
        #ui .menu-hint {
            font-size: 9px;
            opacity: 0.4;
            cursor: pointer;
            pointer-events: auto;
            color: #6effd0;
        }
        #ui .menu-hint:hover {
            opacity: 0.8;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4a5a;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 0 40px #ff0022;
            background: rgba(0, 0, 0, 0.88);
            padding: 16px 28px;
            border-radius: 20px;
            border: 2px solid #ff4a5a;
            text-align: center;
            display: none;
            z-index: 25;
            min-width: 260px;
        }
        #gameOver small {
            font-size: 14px;
            color: #8fcbdd;
            display: block;
            margin-top: 3px;
            font-weight: normal;
        }
        #gameOver .depth-info {
            font-size: 16px;
            color: #f5c542;
            margin: 4px 0 8px;
        }
        .gameover-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .gameover-buttons button {
            padding: 6px 16px;
            font-size: 12px;
            border: none;
            color: white;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: 0.2s;
            border: 1px solid #5aaac0;
        }
        #gameOverBtn {
            background: #2a5a6a;
        }
        #gameOverBtn:hover {
            background: #3a8aaa;
            transform: scale(1.05);
        }
        #gameOverMenuBtn {
            background: #3a3a4a;
            border-color: #6a6a8a;
        }
        #gameOverMenuBtn:hover {
            background: #5a5a7a;
            transform: scale(1.05);
        }

        #pauseOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 15;
            flex-direction: column;
        }
        #pauseOverlay.open {
            display: flex;
        }
        #pauseOverlay .pause-text {
            font-size: 42px;
            color: #6effd0;
            text-shadow: 0 0 60px #2dc9a066;
            letter-spacing: 6px;
        }
        #pauseOverlay .pause-hint {
            color: #4a8a9a;
            font-size: 14px;
            margin-top: 10px;
            letter-spacing: 2px;
        }
        #pauseOverlay .pause-menu-btn {
            margin-top: 20px;
            padding: 8px 28px;
            font-size: 14px;
            background: #2a3a4a;
            border: 1px solid #4a6a7a;
            color: #8fcbdd;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: 0.2s;
        }
        #pauseOverlay .pause-menu-btn:hover {
            background: #3a5a6a;
            color: #ffffff;
            transform: scale(1.05);
        }

        .hint-bottom {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: #3a7a8a;
            font-size: 10px;
            opacity: 0.4;
            letter-spacing: 2px;
            z-index: 5;
            pointer-events: none;
            font-family: 'Courier New', monospace;
        }

        .controls-info {
            color: #3a7a8a;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
            line-height: 1.6;
            opacity: 0.6;
            font-family: 'Courier New', monospace;
        }
        .controls-info kbd {
            background: #0a1a22;
            padding: 2px 10px;
            border-radius: 6px;
            border: 1px solid #1a3a4a;
            color: #7aabb5;
        }
    </style>
</head>
<body>

    <div id="mainMenu">
        <div class="title">⬇️ DEEP BREATH</div>
        <div class="subtitle">〜 4 МИРА 〜</div>
        <div class="stats">
            🪙 Монет: <span id="menuCoins">0</span> &nbsp;|&nbsp; 🏆 Рекорд: <span id="menuRecord">0</span> м
        </div>
        <div class="world-grid">
            <button class="menu-btn primary" id="worldOcean" style="border-color:#3a8aaa;color:#6effd0;">🌊 ОКЕАН</button>
            <button class="menu-btn acid-btn" id="worldAcid">🟢 КИСЛОТА</button>
            <button class="menu-btn fire-btn" id="worldFire">🔥 ОГОНЬ</button>

        <button class="menu-btn" id="controlsBtn">⌨️ УПРАВЛЕНИЕ</button>
        <div class="controls-info" id="controlsInfo" style="display:none;">
            <kbd>W A S D</kbd> / <kbd>↑ ← ↓ →</kbd> — движение<br>
            <kbd>ESC</kbd> — пауза
        </div>
        <div class="version">v16.0 • 10 скинов</div>
    </div>

    <div id="shopOverlay">
        <div id="shop">
            <h2>🏪 МАГАЗИН</h2>

    <div id="ui">

        <div class="pause-hint">[ESC]</div>
        <div class="menu-hint" id="uiMenuBtn">[МЕНЮ]</div>

        <button class="pause-menu-btn" id="pauseMenuBtn">🏠 В МЕНЮ</button>
    </div>

    <div id="gameOver">

            <button id="gameOverMenuBtn">🏠 В МЕНЮ</button>
        </div>
    </div>

                },

                    cost: 250,
                    category: 'skins',
                    owned: false,
                    skinId: 'pearl',
                },

                acidShield: {

                    name: '🧪 Резиновый корпус',
                    desc: 'Защита от кислоты',
                    cost: 100,
                    category: 'shields',

                    shieldType: 'acid',
                },
                fireShield: {
                    id: 'fireShield',

                    desc: 'Защита от огня',
                    cost: 100,

                    shieldType: 'fire',
                },
                iceShield: {

                    owned: false,
                    shieldType: 'ice',
                },
