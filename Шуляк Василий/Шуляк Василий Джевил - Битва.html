<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Джевил • Битва</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0b0806;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Courier New', monospace;
        }
        .menu-container {
            background: #14100e;
            padding: 2rem 2.5rem;
            border-radius: 3rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 0 2px #2a3a2a inset;
            text-align: center;
            border: 1px solid #3a5a3a;
            max-width: 750px;
            width: 95%;
            max-height: 95vh;
            overflow-y: auto;
        }
        h1 {
            color: #d9b382;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-size: 2.2rem;
            text-shadow: 0 0 12px #5a2e1a;
        }
        .subtitle {
            color: #7a8a6a;
            border-top: 1px solid #2a3a2a;
            border-bottom: 1px solid #2a3a2a;
            padding: 0.5rem 0;
            margin: 0.8rem 0 1.5rem;
            font-size: 0.9rem;
            letter-spacing: 3px;
        }
        .menu-buttons {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .menu-btn {
            background: #1a2a1a;
            border: none;
            padding: 0.7rem 1.8rem;
            border-radius: 4rem;
            font-size: 1rem;
            font-weight: 600;
            color: #b4d0b4;
            box-shadow: 0 5px 0 #0a1a0a, 0 8px 20px rgba(0,0,0,0.7);
            cursor: pointer;
            border: 1px solid #3a6a3a;
            transition: 0.08s linear;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .menu-btn:hover {
            background: #2a3a2a;
            color: #d0f0d0;
            border-color: #5a8a5a;
            transform: scale(1.02);
        }
        .menu-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0a1a0a;
        }
        .menu-btn:disabled {
            opacity: 0.4;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0a1a0a;
            cursor: not-allowed;
            pointer-events: none;
        }
        .menu-btn-small {
            background: #1a2a1a;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 3rem;
            font-size: 0.8rem;
            color: #b4d0b4;
            border: 1px solid #3a6a3a;
            box-shadow: 0 3px 0 #0a1a0a;
            cursor: pointer;
            transition: 0.06s linear;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .menu-btn-small:hover {
            background: #2a3a2a;
            color: #d0f0d0;
        }
        .menu-btn-small:active {
            transform: translateY(3px);
            box-shadow: 0 0px 0 #0a1a0a;
        }
        .footer-note {
            margin-top: 1rem;
            color: #4a5a3a;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        .game-wrapper {
            display: none;
            flex-direction: column;
            align-items: center;
            background: #0f0c0a;
            padding: 1.5rem 1.5rem 1.8rem;
            border-radius: 3.5rem;
            box-shadow: 0 0 0 4px #1a3a1a, 0 20px 40px #000000cc;
            border: 1px solid #3a6a3a;
            width: fit-content;
        }
        .game-wrapper.active {
            display: flex;
        }

        canvas {
            display: block;
            background: #0f0c0a;
            border-radius: 2.2rem;
            box-shadow: 0 0 0 3px #1a3a1a, 0 10px 30px #000000;
            width: 560px;
            height: 560px;
            cursor: default;
            image-rendering: crisp-edges;
        }

        .battle-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 0.8rem;
            padding: 0.4rem 1.2rem;
            background: #16110e;
            border-radius: 4rem;
            border: 1px solid #3a5a3a;
            color: #b4c9a4;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .hp-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }
        .hp-fill {
            width: 120px;
            height: 12px;
            background: #1a2a1a;
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid #3a6a3a;
        }
        .hp-fill-inner {
            height: 100%;
            width: 100%;
            background: #d94f4f;
            background: linear-gradient(90deg, #d94f4f, #b32e2e);
            transition: width 0.15s ease;
            border-radius: 30px;
        }
        .action-buttons {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .action-btn {
            background: #1a2a1a;
            border: none;
            padding: 0.25rem 1rem;
            border-radius: 3rem;
            font-weight: bold;
            font-size: 0.8rem;
            color: #b4d0b4;
            border: 1px solid #3a6a3a;
            box-shadow: 0 3px 0 #0a1a0a;
            transition: 0.06s linear;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0px 0 #0a1a0a;
        }
        .action-btn:disabled {
            opacity: 0.35;
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0a1a0a;
            pointer-events: none;
        }
        .status-text {
            color: #b4c9a4;
            font-size: 0.75rem;
            background: #1a201a;
            padding: 0.15rem 1rem;
            border-radius: 30px;
            border: 1px solid #3a5a3a;
            min-width: 110px;
            text-align: center;
        }
        .hidden { display: none; }
        .footer-note-small {
            margin-top: 4px;
            color: #4a5a3a;
            font-size: 0.6rem;
            letter-spacing: 1px;
        }
        .sleep-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
        }
        .sleep-fill {
            width: 70px;
            height: 8px;
            background: #1a1a2a;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #4a3a6a;
        }
        .sleep-fill-inner {
            height: 100%;
            width: 100%;
            background: #8a6acc;
            background: linear-gradient(90deg, #8a6acc, #6a4aaa);
            transition: width 0.3s ease;
            border-radius: 20px;
        }
        .hud-right {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .inventory-container, .shop-container {
            background: #14100e;
            padding: 1.5rem 2rem;
            border-radius: 2rem;
            border: 1px solid #3a5a3a;
            max-width: 550px;
            width: 95%;
            text-align: center;
            color: #b4c9a4;
        }
        .inventory-container h2, .shop-container h2 {
            color: #d9b382;
            margin-bottom: 1rem;
        }
        .inventory-item, .shop-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.4rem 0.8rem;
            margin: 0.4rem 0;
            background: #1a201a;
            border-radius: 1rem;
            border: 1px solid #3a5a3a;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .inventory-item .item-name, .shop-item .item-name {
            font-weight: bold;
            color: #d4b08c;
        }
        .inventory-item .item-desc, .shop-item .item-desc {
            font-size: 0.75rem;
            color: #8a9a7a;
        }
        .equip-btn {
            background: #2a3a2a;
            border: none;
            padding: 0.2rem 0.6rem;
            border-radius: 2rem;
            color: #b4d0b4;
            cursor: pointer;
            border: 1px solid #4a6a4a;
            font-size: 0.7rem;
        }
        .equip-btn:hover {
            background: #3a5a3a;
        }
        .equip-btn.equipped {
            background: #4a6a4a;
            color: #d0f0d0;
            border-color: #6a8a6a;
        }
        .menu-back-btn {
            margin-top: 1rem;
            padding: 0.4rem 1.5rem;
            background: #1a2a1a;
            border: 1px solid #3a6a3a;
            border-radius: 2rem;
            color: #b4d0b4;
            cursor: pointer;
        }
        .menu-back-btn:hover {
            background: #2a3a2a;
        }
        .coins-display {
            color: #f5d7b0;
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
        }
        .food-btn {
            background: #2a3a2a;
            border: none;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            color: #b4d0b4;
            cursor: pointer;
            border: 1px solid #4a6a4a;
            font-size: 0.7rem;
        }
        .food-btn:hover {
            background: #3a5a3a;
        }
        .food-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .food-counter {
            font-size: 0.7rem;
            color: #8a9a7a;
        }
        .sans-indicator {
            color: #88ccff;
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>
    <!-- МЕНЮ -->
    <div id="mainMenu" class="menu-container">
        <h1>⚔️ ДЖЕВИЛ</h1>
        <div class="subtitle">БИТВА В ТЕМНОТЕ</div>
        <div class="menu-buttons">
            <button class="menu-btn" id="startBattleBtn">▶ ДЖЕВИЛ</button>
            <button class="menu-btn" id="sansBattleBtn" disabled>💀 САНС</button>
            <button class="menu-btn" id="shopBtn">🛒 МАГАЗИН</button>
            <button class="menu-btn" id="inventoryBtn">🎒 ИНВЕНТАРЬ</button>
        </div>
        <div class="footer-note">💰 Монеты: <span id="coinsDisplay">0</span> • стрелки / пробел — движение</div>
    </div>

    <!-- МАГАЗИН -->
    <div id="shopMenu" class="shop-container" style="display:none;">
        <h2>🛒 МАГАЗИН</h2>
        <div class="coins-display">💰 <span id="shopCoins">0</span></div>
        <div id="shopList"></div>
        <button class="menu-back-btn" id="shopBackBtn">◀ НАЗАД</button>
    </div>

    <!-- ИНВЕНТАРЬ -->
    <div id="inventoryMenu" class="inventory-container" style="display:none;">
        <h2>🎒 ИНВЕНТАРЬ</h2>
        <div style="display:flex; gap:0.8rem; justify-content:center; margin-bottom:0.8rem; font-size:0.75rem; color:#8a9a7a; flex-wrap:wrap;">
            <span>Слот 1: <span id="slot1Label">пусто</span></span>
            <span>Слот 2: <span id="slot2Label">пусто</span></span>
        </div>
        <div id="inventoryList"></div>
        <button class="menu-back-btn" id="inventoryBackBtn">◀ НАЗАД</button>
    </div>

    <!-- ИГРА -->
    <div id="gameWrapper" class="game-wrapper">
        <canvas id="gameCanvas" width="560" height="560"></canvas>
        <div class="battle-hud">
            <div class="hp-bar">
                <span>❤️</span>
                <div class="hp-fill">
                    <div id="hpFill" class="hp-fill-inner" style="width:100%"></div>
                </div>
                <span id="hpText">120</span>
            </div>
            <div class="status-text" id="statusDisplay">⚡ ВСТУПЛЕНИЕ</div>
            <div class="hud-right">
                <div class="sleep-bar" id="sleepBar">
                    <span>💤</span>
                    <div class="sleep-fill">
                        <div id="sleepFill" class="sleep-fill-inner" style="width:100%"></div>
                    </div>
                    <span id="sleepText">150</span>
                </div>
                <div class="action-buttons">
                    <button class="action-btn" id="foodBtn" disabled>🍔 ЕДА</button>
                    <button class="action-btn" id="attackBtn" disabled>⚔️</button>
                    <button class="action-btn" id="spareBtn" disabled>🕊️</button>
                    <button class="action-btn menu-btn-small" id="menuBtn">🏠</button>
                </div>
            </div>
        </div>
        <div class="footer-note-small">⏳ 12с атака · 15с выбор</div>
    </div>

    <script>
        (function() {
            // ----- ИГРОВЫЕ ДАННЫЕ -----
            let gameData = {
                coins: 0,
                wins: 0,
                sansUnlocked: false,
                inventory: {
                    items: [],
                    equipped: [null, null],
                    food: {}
                }
            };

            const FOOD_ITEMS = {
                'spaghetti': { name: '🍝 Спагетти', heal: 25, price: 10, desc: 'Восстанавливает 25 HP' },
                'cake': { name: '🎂 Торт', heal: 50, price: 25, desc: 'Восстанавливает 50 HP' },
                'pie': { name: '🥧 Пирог', heal: 80, price: 40, desc: 'Восстанавливает 80 HP' },
                'hotdog': { name: '🌭 Хот-дог', heal: 15, price: 5, desc: 'Восстанавливает 15 HP' }
            };

            function saveGameData() {
                try { localStorage.setItem('jevilGameData', JSON.stringify(gameData)); } catch(e) {}
            }

            function loadGameData() {
                try {
                    const data = localStorage.getItem('jevilGameData');
                    if (data) {
                        const parsed = JSON.parse(data);
                        gameData.coins = parsed.coins || 0;
                        gameData.wins = parsed.wins || 0;
                        gameData.sansUnlocked = parsed.sansUnlocked || false;
                        gameData.inventory = parsed.inventory || { items: [], equipped: [null, null], food: {} };
                        if (!gameData.inventory.food) gameData.inventory.food = {};
                        if (!gameData.inventory.equipped || !Array.isArray(gameData.inventory.equipped)) {
                            gameData.inventory.equipped = [null, null];
                        }
                        while (gameData.inventory.equipped.length < 2) gameData.inventory.equipped.push(null);
                    }
                } catch(e) {}
                updateCoinsDisplay();
                updateSansButton();
            }

            function addCoins(amount) {
                gameData.coins += amount;
                saveGameData();
                updateCoinsDisplay();
            }

            function updateCoinsDisplay() {
                document.getElementById('coinsDisplay').textContent = gameData.coins;
                document.getElementById('shopCoins').textContent = gameData.coins;
            }

            function updateSansButton() {
                const btn = document.getElementById('sansBattleBtn');
                if (gameData.sansUnlocked) {
                    btn.disabled = false;
                    btn.textContent = '💀 САНС';
                } else {
                    btn.disabled = true;
                    btn.textContent = '💀 САНС (🔒)';
                }
            }

            function buyFood(foodId) {
                const food = FOOD_ITEMS[foodId];
                if (!food) return;
                if (gameData.coins < food.price) {
                    alert('Недостаточно монет!');
                    return;
                }
                gameData.coins -= food.price;
                if (!gameData.inventory.food[foodId]) {
                    gameData.inventory.food[foodId] = 0;
                }
                gameData.inventory.food[foodId]++;
                saveGameData();
                updateCoinsDisplay();
                updateShopUI();
            }

            function useFood(foodId) {
                if (!gameData.inventory.food[foodId] || gameData.inventory.food[foodId] <= 0) return;
                if (gameOver || gameWin) return;
                const food = FOOD_ITEMS[foodId];
                if (!food) return;
                const healAmount = Math.floor(food.heal * (1 + (player.healBonus || 0)));
                player.hp = Math.min(player.maxHp, player.hp + healAmount);
                gameData.inventory.food[foodId]--;
                updateHpDisplay();
                saveGameData();
                updateFoodUI();
                statusDisplay.innerText = `🍔 +${healAmount} HP!`;
            }

            function updateFoodUI() {
                const btn = document.getElementById('foodBtn');
                if (!btn) return;
                const totalFood = Object.values(gameData.inventory.food).reduce((a, b) => a + b, 0);
                if (totalFood > 0 && !gameOver && !gameWin && (attackPhase || decisionPhase)) {
                    btn.disabled = false;
                    btn.textContent = `🍔 ЕДА (${totalFood})`;
                } else {
                    btn.disabled = true;
                    btn.textContent = `🍔 ЕДА`;
                }
            }

            // ----- ЭЛЕМЕНТЫ -----
            const menu = document.getElementById('mainMenu');
            const shopMenu = document.getElementById('shopMenu');
            const inventoryMenu = document.getElementById('inventoryMenu');
            const shopBackBtn = document.getElementById('shopBackBtn');
            const shopBtn = document.getElementById('shopBtn');
            const inventoryBackBtn = document.getElementById('inventoryBackBtn');
            const inventoryBtn = document.getElementById('inventoryBtn');
            const gameWrapper = document.getElementById('gameWrapper');
            const startBtn = document.getElementById('startBattleBtn');
            const sansBtn = document.getElementById('sansBattleBtn');
            const menuBtn = document.getElementById('menuBtn');
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const hpFill = document.getElementById('hpFill');
            const hpText = document.getElementById('hpText');
            const sleepFill = document.getElementById('sleepFill');
            const sleepText = document.getElementById('sleepText');
            const statusDisplay = document.getElementById('statusDisplay');
            const attackBtn = document.getElementById('attackBtn');
            const spareBtn = document.getElementById('spareBtn');
            const foodBtn = document.getElementById('foodBtn');

            // ----- ПАРАМЕТРЫ -----
            const W = 560, H = 560;
            const GROUND_Y = 480;
            const PLAYER_RADIUS = 14;
            const CENTER_X = W / 2;
            const CENTER_Y = GROUND_Y / 2 + 10;

            let player = {
                x: 280,
                y: GROUND_Y - PLAYER_RADIUS - 4,
                radius: PLAYER_RADIUS,
                hp: 120,
                maxHp: 120,
                speed: 190,
                damageBonus: 0,
                defenseBonus: 0,
                healBonus: 0
            };

            let bossHp = 120;
            const BOSS_MAX_HP = 120;
            let bossSleep = 150;
            const BOSS_MAX_SLEEP = 150;
            let bossPhase = 0;

            let attacks = [];
            let ducks = [];
            let bones = [];
            let gasterBlasters = [];
            let attackPhase = false;
            let attackTimer = 0;
            const ATTACK_DURATION = 12;

            let decisionPhase = false;
            let decisionTimer = 0;
            const DECISION_DURATION = 15;

            let gameOver = false;
            let gameWin = false;
            let gameResult = null;
            let playerActionTaken = false;
            let isSansBattle = false;

            let secretAttackActive = false;
            let secretAttackTimer = 0;
            const SECRET_ATTACK_DURATION = 6;
            let scytheRain = [];

            let duckAttackActive = false;
            let duckTimer = 0;
            const DUCK_ATTACK_DURATION = 12;

            let keys = {
                ArrowLeft: false,
                ArrowRight: false,
                ArrowUp: false,
                ArrowDown: false,
                Space: false
            };

            let spawnCounter = 0;
            let frameId = null;
            let lastTimestamp = 0;

            let attackPattern = 0;
            let scytheWaveActive = false;
            let scytheWaveCooldown = 0;
            const SCYTHE_WAVE_INTERVAL = 1.8;
            const SCYTHES_PER_WAVE = 4;

            // ----- АТАКИ САНСА -----
            function spawnSansAttack() {
                // Кости - летят с разных сторон
                const side = Math.floor(Math.random() * 4);
                let x, y, vx, vy;
                const speed = 180 + Math.random() * 120;
                const size = 20 + Math.random() * 20;

                switch(side) {
                    case 0: x = -20; y = 40 + Math.random() * (GROUND_Y - 80); vx = speed; vy = (Math.random() - 0.5) * 60; break;
                    case 1: x = W + 20; y = 40 + Math.random() * (GROUND_Y - 80); vx = -speed; vy = (Math.random() - 0.5) * 60; break;
                    case 2: x = 40 + Math.random() * (W - 80); y = -20; vx = (Math.random() - 0.5) * 60; vy = speed; break;
                    case 3: x = 40 + Math.random() * (W - 80); y = GROUND_Y + 20; vx = (Math.random() - 0.5) * 60; vy = -speed; break;
                }

                bones.push({
                    x, y, vx, vy,
                    w: 40, h: 12,
                    damage: 15 + Math.floor(Math.random() * 10),
                    life: 3.0,
                    radius: 16,
                    rotation: Math.atan2(vy, vx),
                    rotSpeed: (Math.random() - 0.5) * 2,
                    type: 'bone'
                });
            }

            function spawnGasterBlaster() {
                // Гастер-бластеры - появляются сбоку и стреляют лазером
                const side = Math.floor(Math.random() * 2);
                let x, y, vx, vy;
                const targetX = player.x + (Math.random() - 0.5) * 100;
                const targetY = player.y + (Math.random() - 0.5) * 80;

                switch(side) {
                    case 0: x = -30; y = 100 + Math.random() * (GROUND_Y - 200); break;
                    case 1: x = W + 30; y = 100 + Math.random() * (GROUND_Y - 200); break;
                }

                const dx = targetX - x;
                const dy = targetY - y;
                const len = Math.sqrt(dx*dx + dy*dy);
                const speed = 250 + Math.random() * 100;
                vx = (dx / len) * speed;
                vy = (dy / len) * speed;

                gasterBlasters.push({
                    x, y, vx, vy,
                    w: 50, h: 30,
                    damage: 20 + Math.floor(Math.random() * 10),
                    life: 2.5,
                    radius: 22,
                    rotation: Math.atan2(vy, vx),
                    rotSpeed: (Math.random() - 0.5) * 1.5,
                    type: 'blaster',
                    targetX: targetX,
                    targetY: targetY,
                    phase: 'approach'
                });
            }

            function updateSansAttacks(deltaSec) {
                // Обновляем кости
                for (let i = bones.length - 1; i >= 0; i--) {
                    const b = bones[i];
                    b.x += b.vx * deltaSec;
                    b.y += b.vy * deltaSec;
                    b.rotation += b.rotSpeed * deltaSec;
                    b.life -= deltaSec * 0.2;

                    if (!gameOver && !gameWin && player.hp > 0) {
                        const dx = player.x - b.x;
                        const dy = player.y - b.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < player.radius + b.radius) {
                            damagePlayer(b.damage);
                            bones.splice(i, 1);
                            if (player.hp <= 0) {
                                gameOver = true;
                                attackBtn.disabled = true;
                                spareBtn.disabled = true;
                                foodBtn.disabled = true;
                                statusDisplay.innerText = '💀 ВЫ ПАЛИ...';
                            }
                            continue;
                        }
                    }

                    if (b.x < -80 || b.x > W+80 || b.y < -80 || b.y > GROUND_Y+80 || b.life <= 0) {
                        bones.splice(i, 1);
                    }
                }

                // Обновляем гастер-бластеры
                for (let i = gasterBlasters.length - 1; i >= 0; i--) {
                    const g = gasterBlasters[i];
                    g.x += g.vx * deltaSec;
                    g.y += g.vy * deltaSec;
                    g.rotation += g.rotSpeed * deltaSec;

                    if (g.phase === 'approach') {
                        const dx = g.x - g.targetX;
                        const dy = g.y - g.targetY;
                        if (Math.sqrt(dx*dx + dy*dy) < 30) {
                            g.phase = 'fire';
                            g.life = 0.8;
                            // Создаём лазерный луч
                            g.laser = {
                                x: g.x,
                                y: g.y,
                                angle: g.rotation,
                                life: 0.5
                            };
                        }
                    }

                    if (g.phase === 'fire') {
                        g.life -= deltaSec;
                        // Лазер бьёт в направлении игрока
                        if (g.laser) {
                            g.laser.life -= deltaSec;
                            // Проверка попадания лазера
                            if (!gameOver && !gameWin && player.hp > 0) {
                                const dx = player.x - g.x;
                                const dy = player.y - g.y;
                                const dist = Math.sqrt(dx*dx + dy*dy);
                                // Лазер бьёт по прямой
                                const angle = Math.atan2(dy, dx);
                                const angleDiff = angle - g.rotation;
                                const normalizedDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
                                if (Math.abs(normalizedDiff) < 0.3 && dist < 200) {
                                    damagePlayer(15);
                                    g.laser.life = 0;
                                    if (player.hp <= 0) {
                                        gameOver = true;
                                        attackBtn.disabled = true;
                                        spareBtn.disabled = true;
                                        foodBtn.disabled = true;
                                        statusDisplay.innerText = '💀 ВЫ ПАЛИ...';
                                    }
                                }
                            }
                        }
                        if (g.life <= 0 || (g.laser && g.laser.life <= 0)) {
                            gasterBlasters.splice(i, 1);
                            continue;
                        }
                    }

                    if (g.x < -80 || g.x > W+80 || g.y < -80 || g.y > GROUND_Y+80) {
                        gasterBlasters.splice(i, 1);
                    }
                }
            }

            // ----- АТАКИ ДЖЕВИЛА (оригинальные) -----
            function spawnScytheWave() {
                if (scytheWaveActive) return;
                scytheWaveActive = true;
                
                const sides = [0, 1, 2, 3];
                for (let i = sides.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [sides[i], sides[j]] = [sides[j], sides[i]];
                }
                
                for (let i = 0; i < SCYTHES_PER_WAVE; i++) {
                    const side = sides[i];
                    let x, y;
                    
                    switch(side) {
                        case 0: x = -30; y = 20 + Math.random() * (GROUND_Y - 40); break;
                        case 1: x = W + 30; y = 20 + Math.random() * (GROUND_Y - 40); break;
                        case 2: x = 20 + Math.random() * (W - 40); y = -30; break;
                        case 3: x = 20 + Math.random() * (W - 40); y = GROUND_Y + 30; break;
                    }

                    const targetX = CENTER_X + (Math.random() - 0.5) * 60;
                    const targetY = CENTER_Y + (Math.random() - 0.5) * 60;
                    const dx = targetX - x;
                    const dy = targetY - y;
                    const len = Math.sqrt(dx*dx + dy*dy);
                    const speed = 260 + Math.random() * 80;
                    const vx = (dx / len) * speed;
                    const vy = (dy / len) * speed;

                    const atk = {
                        x, y, vx, vy, w: 56, h: 10, shape: 'scythe',
                        damage: 18 + Math.floor(Math.random() * 8),
                        life: 3.5, radius: 20,
                        rotation: Math.atan2(vy, vx),
                        rotSpeed: (Math.random() - 0.5) * 2,
                        startX: x, startY: y,
                        targetX: targetX, targetY: targetY,
                        phase: 'toCenter', speed: speed, side: side
                    };
                    attacks.push(atk);
                }
            }

            function spawnCardAttack() {
                const side = Math.floor(Math.random() * 4);
                let x, y, vx, vy;
                const baseSpeed = 140 + Math.random() * 100;
                const size = 18 + Math.floor(Math.random() * 16);

                switch(side) {
                    case 0: x = -20; y = 40 + Math.random() * (GROUND_Y - 80); vx = baseSpeed * (0.9 + Math.random() * 0.4); vy = (Math.random() - 0.5) * 80; break;
                    case 1: x = W + 20; y = 40 + Math.random() * (GROUND_Y - 80); vx = -baseSpeed * (0.9 + Math.random() * 0.4); vy = (Math.random() - 0.5) * 80; break;
                    case 2: x = 40 + Math.random() * (W - 80); y = -20; vy = baseSpeed * (0.8 + Math.random() * 0.5); vx = (Math.random() - 0.5) * 80; break;
                    case 3: x = 40 + Math.random() * (W - 80); y = GROUND_Y + 20; vy = -baseSpeed * (0.8 + Math.random() * 0.5); vx = (Math.random() - 0.5) * 80; break;
                }

                const type = Math.floor(Math.random() * 3);
                let shape = 'circle';
                if (type === 1) shape = 'diamond';
                else if (type === 2) shape = 'cross';

                const atk = {
                    x, y, vx, vy, w: size, h: size, shape: shape,
                    damage: 10 + Math.floor(Math.random() * 8),
                    life: 1.0, radius: size * 0.5
                };
                attacks.push(atk);
            }

            function startDuckAttack() {
                duckAttackActive = true;
                duckTimer = DUCK_ATTACK_DURATION;
                ducks = [];
                statusDisplay.innerText = '🦆 АТАКА УТОК!';
                
                const rowsTop = 4;
                const rowsBottom = 4;
                const cols = 5;
                const spacingX = 85;
                const spacingY = 60;
                const startYTop = 30;
                const startYBottom = GROUND_Y - 50;
                
                for (let row = 0; row < rowsTop; row++) {
                    for (let col = 0; col < cols; col++) {
                        const yOffset = (row % 2 === 0) ? 0 : spacingY * 0.4;
                        const baseY = startYTop + row * spacingY + yOffset;
                        const x = -30 - col * 25;
                        const speed = 60 + Math.random() * 25 + row * 10;
                        const wobbleSpeed = 0.8 + Math.random() * 0.5;
                        const wobbleAmount = 10 + Math.random() * 10;
                        const phase = Math.random() * Math.PI * 2;
                        const rowOffset = (row % 3) * 5 - 5;
                        
                        ducks.push({
                            x: x, y: baseY + rowOffset, speed: speed,
                            wobbleSpeed: wobbleSpeed, wobbleAmount: wobbleAmount,
                            phase: phase, radius: 16,
                            damage: 12 + Math.floor(Math.random() * 6),
                            active: true, baseY: baseY + rowOffset,
                            fromTop: true
                        });
                    }
                }
                
                for (let row = 0; row < rowsBottom; row++) {
                    for (let col = 0; col < cols; col++) {
                        const yOffset = (row % 2 === 0) ? 0 : spacingY * 0.4;
                        const baseY = startYBottom - row * spacingY - yOffset;
                        const x = -30 - col * 25;
                        const speed = 60 + Math.random() * 25 + row * 10;
                        const wobbleSpeed = 0.8 + Math.random() * 0.5;
                        const wobbleAmount = 10 + Math.random() * 10;
                        const phase = Math.random() * Math.PI * 2;
                        const rowOffset = (row % 3) * 5 - 5;
                        
                        ducks.push({
                            x: x, y: baseY + rowOffset, speed: speed,
                            wobbleSpeed: wobbleSpeed, wobbleAmount: wobbleAmount,
                            phase: phase, radius: 16,
                            damage: 12 + Math.floor(Math.random() * 6),
                            active: true, baseY: baseY + rowOffset,
                            fromTop: false
                        });
                    }
                }
            }

            function updateDuckAttack(deltaSec) {
                if (!duckAttackActive) return;
                
                duckTimer -= deltaSec;
                
                for (const d of ducks) {
                    if (!d.active) continue;
                    d.x += d.speed * deltaSec;
                    d.phase += d.wobbleSpeed * deltaSec;
                    d.y = d.baseY + Math.sin(d.phase) * d.wobbleAmount;
                    
                    if (!gameOver && !gameWin && player.hp > 0) {
                        const dx = player.x - d.x;
                        const dy = player.y - d.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < player.radius + d.radius) {
                            damagePlayer(d.damage);
                            d.active = false;
                            if (player.hp <= 0) {
                                gameOver = true;
                                attackBtn.disabled = true;
                                spareBtn.disabled = true;
                                foodBtn.disabled = true;
                                statusDisplay.innerText = '💀 ВЫ ПАЛИ...';
                            }
                        }
                    }
                    
                    if (d.x > W + 50) {
                        d.active = false;
                    }
                }
                
                if (duckTimer <= 0) {
                    const activeCount = ducks.filter(d => d.active).length;
                    if (activeCount === 0) {
                        duckAttackActive = false;
                        if (!gameOver && !gameWin && !secretAttackActive) {
                            enterDecisionPhase();
                        }
                    }
                }
            }

            // ----- СЕКРЕТНАЯ АТАКА -----
            function startSecretAttack() {
                secretAttackActive = true;
                secretAttackTimer = SECRET_ATTACK_DURATION;
                scytheRain = [];
                statusDisplay.innerText = '💀 СЕКРЕТНАЯ АТАКА!';
                
                for (let i = 0; i < 25; i++) {
                    const x = 20 + Math.random() * (W - 40);
                    const speed = 250 + Math.random() * 200;
                    const delay = Math.random() * 3.5;
                    scytheRain.push({
                        x: x, y: -30 - Math.random() * 80,
                        speed: speed, delay: delay,
                        active: false, started: false,
                        w: 56, h: 10,
                        damage: 16, radius: 20,
                        rotation: Math.PI / 2
                    });
                }
            }

            function updateSecretAttack(deltaSec) {
                if (!secretAttackActive) return;
                
                secretAttackTimer -= deltaSec;
                
                for (const s of scytheRain) {
                    if (!s.started) {
                        s.delay -= deltaSec;
                        if (s.delay <= 0) {
                            s.started = true;
                            s.active = true;
                        }
                    }
                }
                
                for (const s of scytheRain) {
                    if (s.active) {
                        s.y += s.speed * deltaSec;
                        if (!gameOver && !gameWin && player.hp > 0) {
                            const dx = player.x - s.x;
                            const dy = player.y - s.y;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < player.radius + s.radius) {
                                damagePlayer(s.damage);
                                s.active = false;
                                if (player.hp <= 0) {
                                    gameOver = true;
                                    attackBtn.disabled = true;
                                    spareBtn.disabled = true;
                                    foodBtn.disabled = true;
                                    statusDisplay.innerText = '💀 ВЫ ПАЛИ...';
                                }
                            }
                        }
                        if (s.y > GROUND_Y + 50) {
                            s.active = false;
                        }
                    }
                }
                
                if (secretAttackTimer <= 0) {
                    const activeCount = scytheRain.filter(s => s.active).length;
                    if (activeCount === 0) {
                        secretAttackActive = false;
                        if (!gameOver && !gameWin) {
                            if (bossSleep <= 0) {
                                handleWin('spare');
                            } else {
                                enterDecisionPhase();
                            }
                        }
                    }
                }
            }

            // ----- ГЕНЕРАЦИЯ АТАК -----
            function generateAttacks(deltaSec) {
                if (!attackPhase || gameOver || gameWin || secretAttackActive || duckAttackActive) return;
                
                if (isSansBattle) {
                    // Атаки Санса
                    spawnCounter += deltaSec;
                    const interval = 0.3 + Math.random() * 0.2;
                    while (spawnCounter >= interval) {
                        spawnCounter -= interval;
                        if (Math.random() < 0.6) {
                            spawnSansAttack();
                        } else {
                            spawnGasterBlaster();
                        }
                        if (Math.random() < 0.3) spawnSansAttack();
                    }
                    return;
                }

                // Атаки Джевила
                if (bossSleep < 30 && bossPhase < 2 && !secretAttackActive) {
                    bossPhase = 2;
                    startSecretAttack();
                    return;
                }
                
                if (bossHp < 40 && bossPhase === 0 && !secretAttackActive) {
                    bossPhase = 1;
                    startSecretAttack();
                    return;
                }
                
                if (attackPattern === 0) {
                    spawnCounter += deltaSec;
                    const interval = 0.5 + Math.random() * 0.3;
                    while (spawnCounter >= interval) {
                        spawnCounter -= interval;
                        spawnCardAttack();
                        if (Math.random() < 0.2) spawnCardAttack();
                    }
                } else if (attackPattern === 1) {
                    if (!scytheWaveActive) {
                        scytheWaveCooldown -= deltaSec;
                        if (scytheWaveCooldown <= 0) {
                            spawnScytheWave();
                            scytheWaveCooldown = SCYTHE_WAVE_INTERVAL;
                        }
                    } else {
                        const activeScythes = attacks.filter(a => a.shape === 'scythe');
                        if (activeScythes.length === 0) {
                            scytheWaveActive = false;
                            scytheWaveCooldown = 0.2;
                        }
                    }
                }
            }

            // ----- ФАЗА ВЫБОРА -----
            function enterDecisionPhase() {
                if (secretAttackActive || duckAttackActive) return;
                decisionPhase = true;
                decisionTimer = DECISION_DURATION;
                attackBtn.disabled = false;
                spareBtn.disabled = false;
                playerActionTaken = false;
                statusDisplay.innerText = '⚡ ВЫБЕРИТЕ: АТАКА / ПОЩАДА';
                attacks = attacks.filter(a => a.shape !== 'scythe' || (a.x > -20 && a.x < W+20 && a.y > -20 && a.y < GROUND_Y+30));
                scytheWaveActive = false;
                scytheWaveCooldown = 0;
                updateFoodUI();
            }

            function handleWin(type) {
                gameWin = true;
                gameResult = type;
                if (type === 'attack') {
                    statusDisplay.innerText = '⚔️ ВЫ АТАКОВАЛИ! БОСС ПОВЕРЖЕН!';
                    if (!isSansBattle) {
                        addItem('Коса Джевила', 'Увеличивает урон на 20%', 'damageBonus');
                        gameData.wins++;
                        if (gameData.wins >= 1) {
                            gameData.sansUnlocked = true;
                            updateSansButton();
                        }
                        addCoins(50);
                    } else {
                        addItem('Гастер-бластер', 'Увеличивает урон на 30%', 'damageBonus');
                        addCoins(100);
                    }
                } else {
                    statusDisplay.innerText = '💤 БОСС ЗАСНУЛ! ВЫ ПОБЕДИЛИ!';
                    if (!isSansBattle) {
                        addItem('Хвост Джевила', 'Увеличивает HP в 2 раза', 'doubleHp');
                        gameData.wins++;
                        if (gameData.wins >= 1) {
                            gameData.sansUnlocked = true;
                            updateSansButton();
                        }
                        addCoins(50);
                    } else {
                        addItem('Кость Санса', 'Увеличивает защиту на 25%', 'defenseBonus');
                        addCoins(100);
                    }
                }
                attacks = [];
                ducks = [];
                bones = [];
                gasterBlasters = [];
                scytheRain = [];
                secretAttackActive = false;
                duckAttackActive = false;
                attackBtn.disabled = true;
                spareBtn.disabled = true;
                foodBtn.disabled = true;
                saveGameData();
            }

            function playerAttackAction() {
                if (!decisionPhase || playerActionTaken || gameOver || gameWin || secretAttackActive || duckAttackActive) return;
                playerActionTaken = true;
                attackBtn.disabled = true;
                spareBtn.disabled = true;
                foodBtn.disabled = true;
                
                const damage = 25 + Math.floor(25 * player.damageBonus);
                bossHp -= damage;
                
                if (bossHp <= 0) {
                    bossHp = 0;
                    handleWin('attack');
                } else {
                    statusDisplay.innerText = `💢 БОСС РАНЕН! (${bossHp} HP)`;
                    decisionPhase = false;
                    if (!isSansBattle) {
                        attackPattern = (attackPattern + 1) % 3;
                    }
                    scytheWaveActive = false;
                    scytheWaveCooldown = 0;
                    setTimeout(() => {
                        if (!gameOver && !gameWin && !secretAttackActive && !duckAttackActive) {
                            startAttackPhase();
                        }
                    }, 500);
                }
            }

            function playerSpareAction() {
                if (!decisionPhase || playerActionTaken || gameOver || gameWin || secretAttackActive || duckAttackActive) return;
                playerActionTaken = true;
                attackBtn.disabled = true;
                spareBtn.disabled = true;
                foodBtn.disabled = true;
                
                bossSleep = Math.max(0, bossSleep - 20);
                updateSleepDisplay();
                
                if (bossSleep <= 0) {
                    handleWin('spare');
                } else {
                    statusDisplay.innerText = `💤 СОН: ${Math.floor(bossSleep)}%`;
                    decisionPhase = false;
                    if (!isSansBattle) {
                        attackPattern = (attackPattern + 1) % 3;
                    }
                    scytheWaveActive = false;
                    scytheWaveCooldown = 0;
                    setTimeout(() => {
                        if (!gameOver && !gameWin && !secretAttackActive && !duckAttackActive) {
                            startAttackPhase();
                        }
                    }, 500);
                }
            }

            function startAttackPhase() {
                if (secretAttackActive || duckAttackActive) return;
                attackPhase = true;
                attackTimer = ATTACK_DURATION;
                decisionPhase = false;
                attackBtn.disabled = true;
                spareBtn.disabled = true;
                spawnCounter = 0;
                scytheWaveActive = false;
                scytheWaveCooldown = 0;
                
                if (isSansBattle) {
                    statusDisplay.innerText = `💀 САНС АТАКУЕТ!`;
                } else {
                    const patterns = ['МАСТИ КАРТ', 'КОСЫ', 'УТКИ'];
                    statusDisplay.innerText = `💢 ДЖЕВИЛ АТАКУЕТ: ${patterns[attackPattern]}`;
                }
                updateFoodUI();
                
                if (!isSansBattle) {
                    if (attackPattern === 1) {
                        setTimeout(() => {
                            if (attackPhase && !gameOver && !gameWin && !secretAttackActive && !duckAttackActive) {
                                spawnScytheWave();
                            }
                        }, 300);
                    } else if (attackPattern === 2) {
                        setTimeout(() => {
                            if (attackPhase && !gameOver && !gameWin && !secretAttackActive && !duckAttackActive) {
                                startDuckAttack();
                            }
                        }, 300);
                    }
                } else {
                    // Санс сразу начинает атаковать
                    spawnCounter = 0.3;
                }
            }

            // ----- ОБНОВЛЕНИЕ -----
            function update(deltaSec) {
                if (gameOver || gameWin) {
                    updateAttacks(deltaSec);
                    return;
                }

                let dx = 0, dy = 0;
                if (keys.ArrowLeft) dx -= 1;
                if (keys.ArrowRight) dx += 1;
                if (keys.ArrowUp) dy -= 1;
                if (keys.ArrowDown) dy += 1;
                if (keys.Space) dy -= 1;

                if (dx !== 0 || dy !== 0) {
                    const len = Math.sqrt(dx*dx + dy*dy);
                    dx = dx/len * player.speed * deltaSec;
                    dy = dy/len * player.speed * deltaSec;
                    player.x = Math.min(W - player.radius, Math.max(player.radius, player.x + dx));
                    player.y = Math.min(GROUND_Y - player.radius - 2, Math.max(20, player.y + dy));
                }

                if (secretAttackActive) {
                    updateSecretAttack(deltaSec);
                    if (gameOver || gameWin) return;
                    if (!secretAttackActive && !gameOver && !gameWin) {
                        if (bossSleep <= 0) {
                            handleWin('spare');
                        } else {
                            enterDecisionPhase();
                        }
                    }
                    return;
                }

                if (duckAttackActive) {
                    updateDuckAttack(deltaSec);
                    if (gameOver || gameWin) return;
                    if (!duckAttackActive && !gameOver && !gameWin && !secretAttackActive) {
                        enterDecisionPhase();
                    }
                    return;
                }

                if (isSansBattle) {
                    // Санс — постоянные атаки
                    if (attackPhase) {
                        attackTimer -= deltaSec;
                        if (attackTimer <= 0) {
                            attackPhase = false;
                            attackTimer = 0;
                            enterDecisionPhase();
                            spawnCounter = 0;
                        } else {
                            generateAttacks(deltaSec);
                            updateSansAttacks(deltaSec);
                        }
                    } else if (decisionPhase) {
                        decisionTimer -= deltaSec;
                        if (decisionTimer <= 0) {
                            decisionPhase = false;
                            attackBtn.disabled = true;
                            spareBtn.disabled = true;
                            startAttackPhase();
                        }
                    }
                    // Обновляем атаки Санса даже в фазе выбора
                    updateSansAttacks(deltaSec);
                    return;
                }

                // Джевил
                if (attackPhase) {
                    attackTimer -= deltaSec;
                    if (attackTimer <= 0) {
                        attackPhase = false;
                        attackTimer = 0;
                        if (!secretAttackActive && !duckAttackActive) {
                            enterDecisionPhase();
                        }
                        spawnCounter = 0;
                    } else {
                        generateAttacks(deltaSec);
                    }
                } else if (decisionPhase) {
                    decisionTimer -= deltaSec;
                    if (decisionTimer <= 0 && !secretAttackActive && !duckAttackActive) {
                        decisionPhase = false;
                        attackBtn.disabled = true;
                        spareBtn.disabled = true;
                        attackPattern = (attackPattern + 1) % 3;
                        scytheWaveActive = false;
                        scytheWaveCooldown = 0;
                        startAttackPhase();
                    }
                }

                updateAttacks(deltaSec);
                
                if (!isSansBattle && attackPattern === 1 && !secretAttackActive && !duckAttackActive) {
                    const scythes = attacks.filter(a => a.shape === 'scythe');
                    for (const s of scythes) {
                        if (s.phase === 'toCenter') {
                            const dx = s.x - s.targetX;
                            const dy = s.y - s.targetY;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 15) {
                                s.phase = 'back';
                                s.vx = -s.vx;
                                s.vy = -s.vy;
                                s.rotation = Math.atan2(s.vy, s.vx);
                            }
                        } else if (s.phase === 'back') {
                            const dx = s.x - s.startX;
                            const dy = s.y - s.startY;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 25) {
                                s.life = 0;
                            }
                        }
                    }
                }
            }

            function updateAttacks(deltaSec) {
                for (let i = attacks.length - 1; i >= 0; i--) {
                    const a = attacks[i];
                    a.x += a.vx * deltaSec;
                    a.y += a.vy * deltaSec;
                    if (a.shape === 'scythe') {
                        a.rotation += a.rotSpeed * deltaSec;
                    }
                    a.life -= deltaSec * 0.1;

                    if (!gameOver && !gameWin && player.hp > 0) {
                        const dx = player.x - a.x;
                        const dy = player.y - a.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        const threshold = player.radius + a.radius;
                        if (dist < threshold) {
                            damagePlayer(a.damage);
                            attacks.splice(i, 1);
                            if (player.hp <= 0) {
                                gameOver = true;
                                attackBtn.disabled = true;
                                spareBtn.disabled = true;
                                foodBtn.disabled = true;
                                statusDisplay.innerText = '💀 ВЫ ПАЛИ...';
                            }
                            continue;
                        }
                    }

                    if (a.x < -120 || a.x > W+120 || a.y < -120 || a.y > GROUND_Y+120 || a.life <= 0) {
                        attacks.splice(i, 1);
                    }
                }
            }

            // ----- ОТРИСОВКА -----
            function drawScythe(a) {
                const cx = a.x, cy = a.y;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(a.rotation || 0);
                
                ctx.shadowColor = '#aa88ff';
                ctx.shadowBlur = 15;
                
                ctx.fillStyle = '#8B7D6B';
                ctx.fillRect(-a.w/2, -a.h/2, a.w, a.h);
                
                for (let i = -a.h * 0.3; i < a.h * 0.3; i += a.h * 0.15) {
                    ctx.fillStyle = '#ccaa44';
                    ctx.fillRect(-a.w/2 + 2, i - a.h * 0.05, a.w * 0.1, a.h * 0.1);
                    ctx.fillStyle = '#aa66dd';
                    ctx.fillRect(-a.w/2 + 4, i + a.h * 0.05, a.w * 0.07, a.h * 0.1);
                }
                
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffdd44';
                ctx.strokeStyle = 'rgba(255, 220, 136, 0.15)';
                ctx.lineWidth = 1;
                ctx.strokeRect(-a.w/2, -a.h/2, a.w, a.h);
                
                ctx.restore();
            }

            function drawDuck(d) {
                const x = d.x, y = d.y;
                ctx.save();
                ctx.translate(x, y);
                
                ctx.shadowColor = '#ffaa44';
                ctx.shadowBlur = 12;
                
                ctx.fillStyle = '#e8c84a';
                ctx.beginPath();
                ctx.ellipse(0, 0, 18, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#e8c84a';
                ctx.beginPath();
                ctx.arc(14, -4, 10, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#f0a030';
                ctx.beginPath();
                ctx.moveTo(22, -6);
                ctx.lineTo(30, -4);
                ctx.lineTo(22, -2);
                ctx.closePath();
                ctx.fill();
                
                ctx.fillStyle = '#1a1a2a';
                ctx.beginPath();
                ctx.arc(18, -6, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(17, -7, 1, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#d4b84a';
                ctx.beginPath();
                ctx.ellipse(-4, -4, 10, 6, -0.3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.restore();
            }

            function drawBone(b) {
                const cx = b.x, cy = b.y;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(b.rotation || 0);
                
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 10;
                
                // Кость
                ctx.fillStyle = '#f0f0e8';
                ctx.beginPath();
                ctx.roundRect(-b.w/2, -b.h/2, b.w, b.h, 4);
                ctx.fill();
                
                // Тени на кости
                ctx.fillStyle = '#d0d0c8';
                ctx.beginPath();
                ctx.roundRect(-b.w/2 + 4, -b.h/2 + 2, b.w * 0.3, b.h - 4, 2);
                ctx.fill();
                
                ctx.fillStyle = '#e8e8e0';
                ctx.beginPath();
                ctx.roundRect(-b.w/2 + b.w * 0.5, -b.h/2 + 2, b.w * 0.3, b.h - 4, 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.restore();
            }

            function drawGasterBlaster(g) {
                const cx = g.x, cy = g.y;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(g.rotation || 0);
                
                ctx.shadowColor = '#44ddff';
                ctx.shadowBlur = 20;
                
                // Тело бластера
                ctx.fillStyle = '#224466';
                ctx.beginPath();
                ctx.roundRect(-g.w/2, -g.h/2, g.w, g.h, 8);
                ctx.fill();
                
                // Глаза
                ctx.fillStyle = '#88ddff';
                ctx.beginPath();
                ctx.arc(-g.w/4, 0, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(g.w/4, 0, 8, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#224466';
                ctx.beginPath();
                ctx.arc(-g.w/4 + 2, 2, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(g.w/4 + 2, 2, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // Пасть
                ctx.fillStyle = '#112233';
                ctx.beginPath();
                ctx.roundRect(-g.w/3, g.h/4, g.w * 0.6, g.h/3, 3);
                ctx.fill();
                
                // Свечение
                if (g.phase === 'fire') {
                    ctx.shadowColor = '#ff4444';
                    ctx.shadowBlur = 40;
                    ctx.fillStyle = 'rgba(255, 200, 50, 0.2)';
                    ctx.beginPath();
                    ctx.arc(0, 0, g.w * 0.8, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.shadowBlur = 0;
                ctx.restore();
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);

                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, isSansBattle ? '#0a0a1a' : '#0f0c0a');
                grad.addColorStop(0.7, isSansBattle ? '#0a0a2a' : '#1a1310');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                ctx.fillStyle = '#1f1712';
                ctx.fillRect(0, GROUND_Y, W, 80);
                ctx.fillStyle = '#2f221a';
                ctx.fillRect(0, GROUND_Y-2, W, 4);
                ctx.strokeStyle = isSansBattle ? '#446688' : '#3a5a3a';
                ctx.lineWidth = 1.5;
                for (let i=0; i<W; i+=35) {
                    ctx.beginPath();
                    ctx.moveTo(i, GROUND_Y-6);
                    ctx.lineTo(i+14, GROUND_Y-6);
                    ctx.stroke();
                }
                ctx.fillStyle = '#0a0705';
                ctx.fillRect(0, GROUND_Y+20, W, 60);

                ctx.fillStyle = isSansBattle ? '#334466' : '#2a3a2a';
                ctx.beginPath();
                ctx.arc(CENTER_X, CENTER_Y, 8, 0, Math.PI*2);
                ctx.fill();

                // Игрок
                ctx.shadowColor = '#cc5555';
                ctx.shadowBlur = 22;
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
                ctx.fillStyle = '#e34a4a';
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#7a1a1a';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // Атаки Джевила
                for (const a of attacks) {
                    if (a.shape === 'scythe') {
                        drawScythe(a);
                    } else {
                        ctx.shadowBlur = 25;
                        ctx.shadowColor = '#cc8844';
                        ctx.fillStyle = '#b0744a';
                        if (a.shape === 'circle') {
                            ctx.beginPath();
                            ctx.arc(a.x, a.y, a.radius, 0, Math.PI*2);
                            ctx.fill();
                            ctx.fillStyle = '#d9a066';
                            ctx.beginPath();
                            ctx.arc(a.x-4, a.y-4, a.radius*0.4, 0, Math.PI*2);
                            ctx.fill();
                        } else if (a.shape === 'diamond') {
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y - a.radius);
                            ctx.lineTo(a.x + a.radius, a.y);
                            ctx.lineTo(a.x, a.y + a.radius);
                            ctx.lineTo(a.x - a.radius, a.y);
                            ctx.closePath();
                            ctx.fill();
                            ctx.fillStyle = '#c08860';
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y - a.radius*0.4);
                            ctx.lineTo(a.x + a.radius*0.4, a.y);
                            ctx.lineTo(a.x, a.y + a.radius*0.4);
                            ctx.lineTo(a.x - a.radius*0.4, a.y);
                            ctx.closePath();
                            ctx.fill();
                        } else {
                            const s = a.radius * 0.7;
                            ctx.fillRect(a.x - s*0.3, a.y - s, s*0.6, s*2);
                            ctx.fillRect(a.x - s, a.y - s*0.3, s*2, s*0.6);
                            ctx.fillStyle = '#c0906a';
                            ctx.fillRect(a.x - s*0.15, a.y - s*0.7, s*0.3, s*1.4);
                            ctx.fillRect(a.x - s*0.7, a.y - s*0.15, s*1.4, s*0.3);
                        }
                    }
                }

                // Утки
                for (const d of ducks) {
                    if (d.active) {
                        drawDuck(d);
                    }
                }

                // Кости Санса
                for (const b of bones) {
                    drawBone(b);
                }

                // Гастер-бластеры Санса
                for (const g of gasterBlasters) {
                    drawGasterBlaster(g);
                    // Лазер
                    if (g.laser && g.laser.life > 0) {
                        ctx.save();
                        ctx.translate(g.x, g.y);
                        ctx.rotate(g.rotation || 0);
                        ctx.shadowColor = '#ff4444';
                        ctx.shadowBlur = 30;
                        ctx.fillStyle = 'rgba(255, 100, 50, 0.6)';
                        ctx.beginPath();
                        ctx.roundRect(0, -4, 250, 8, 4);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255, 200, 100, 0.4)';
                        ctx.beginPath();
                        ctx.roundRect(0, -2, 250, 4, 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.restore();
                    }
                }

                // Секретная атака (косы сверху)
                if (secretAttackActive) {
                    for (const s of scytheRain) {
                        if (s.active) {
                            ctx.save();
                            ctx.translate(s.x, s.y);
                            ctx.rotate(s.rotation || 0);
                            
                            ctx.shadowColor = '#ff4444';
                            ctx.shadowBlur = 20;
                            
                            ctx.fillStyle = '#6a2a2a';
                            ctx.fillRect(-s.w/2, -s.h/2, s.w, s.h);
                            
                            for (let i = -s.h * 0.3; i < s.h * 0.3; i += s.h * 0.15) {
                                ctx.fillStyle = '#cc4444';
                                ctx.fillRect(-s.w/2 + 2, i - s.h * 0.05, s.w * 0.1, s.h * 0.1);
                                ctx.fillStyle = '#aa2266';
                                ctx.fillRect(-s.w/2 + 4, i + s.h * 0.05, s.w * 0.07, s.h * 0.1);
                            }
                            
                            ctx.shadowBlur = 15;
                            ctx.shadowColor = '#ff8844';
                            ctx.strokeStyle = 'rgba(255, 100, 50, 0.3)';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(-s.w/2, -s.h/2, s.w, s.h);
                            
                            ctx.restore();
                        }
                    }
                }

                ctx.shadowBlur = 0;

                if (gameWin) {
                    ctx.font = 'bold 44px "Segoe UI"';
                    ctx.fillStyle = '#f5d7b0';
                    ctx.shadowColor = '#ddaa44';
                    ctx.shadowBlur = 40;
                    if (gameResult === 'spare') {
                        ctx.fillText('💤 ПОБЕДА', 140, 220);
                    } else {
                        ctx.fillText('✧ ПОБЕДА ✧', 120, 220);
                    }
                    ctx.shadowBlur = 0;
                } else if (gameOver && !gameWin) {
                    ctx.font = 'bold 44px "Segoe UI"';
                    ctx.fillStyle = '#b34a4a';
                    ctx.shadowColor = '#aa2222';
                    ctx.shadowBlur = 40;
                    ctx.fillText('💀 ПАДЕНИЕ', 140, 220);
                    ctx.shadowBlur = 0;
                }

                if (!gameWin && !gameOver) {
                    ctx.fillStyle = '#1a2a1a';
                    ctx.fillRect(W-160, 20, 100, 10);
                    ctx.fillStyle = '#b34a4a';
                    const hpPercent = Math.max(0, bossHp / BOSS_MAX_HP);
                    ctx.fillRect(W-160, 20, 100 * hpPercent, 10);
                    ctx.strokeStyle = '#3a6a3a';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(W-160, 20, 100, 10);
                    ctx.fillStyle = '#8aaa7a';
                    ctx.font = '10px monospace';
                    ctx.fillText(isSansBattle ? 'САНС HP' : 'ДЖЕВИЛ HP', W-150, 16);
                    
                    ctx.fillStyle = '#1a1a2a';
                    ctx.fillRect(W-160, 35, 100, 8);
                    ctx.fillStyle = '#8a6acc';
                    const sleepPercent = Math.max(0, bossSleep / BOSS_MAX_SLEEP);
                    ctx.fillRect(W-160, 35, 100 * sleepPercent, 8);
                    ctx.strokeStyle = '#3a3a5a';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(W-160, 35, 100, 8);
                    ctx.fillStyle = '#8a7aaa';
                    ctx.font = '8px monospace';
                    ctx.fillText('💤 СОН', W-150, 33);
                }
            }

            // ----- ИНВЕНТАРЬ -----
            function addItem(name, desc, effect) {
                gameData.inventory.items.push({ name, desc, effect, id: Date.now() + Math.random() });
                saveGameData();
            }

            function equipItem(index, slot) {
                if (slot < 0 || slot > 1) return;
                if (gameData.inventory.equipped[slot] === index) {
                    gameData.inventory.equipped[slot] = null;
                } else {
                    for (let i = 0; i < 2; i++) {
                        if (i !== slot && gameData.inventory.equipped[i] === index) {
                            gameData.inventory.equipped[i] = null;
                        }
                    }
                    gameData.inventory.equipped[slot] = index;
                }
                saveGameData();
                applyEquipmentEffects();
                updateInventoryUI();
            }

            function applyEquipmentEffects() {
                player.maxHp = 120;
                player.hp = Math.min(player.hp, player.maxHp);
                player.damageBonus = 0;
                player.defenseBonus = 0;
                player.healBonus = 0;
                
                for (let slot = 0; slot < 2; slot++) {
                    const idx = gameData.inventory.equipped[slot];
                    if (idx !== null && gameData.inventory.items[idx]) {
                        const item = gameData.inventory.items[idx];
                        if (item.effect === 'doubleHp') {
                            player.maxHp = 240;
                            player.hp = Math.min(player.hp, player.maxHp);
                        } else if (item.effect === 'damageBonus') {
                            player.damageBonus = (player.damageBonus || 0) + 0.2;
                        } else if (item.effect === 'defenseBonus') {
                            player.defenseBonus = (player.defenseBonus || 0) + 0.15;
                        } else if (item.effect === 'healBonus') {
                            player.healBonus = (player.healBonus || 0) + 0.3;
                        }
                    }
                }
                updateHpDisplay();
            }

            function updateInventoryUI() {
                const list = document.getElementById('inventoryList');
                const slot1Label = document.getElementById('slot1Label');
                const slot2Label = document.getElementById('slot2Label');
                if (!list) return;
                
                const getSlotName = (idx) => {
                    if (idx === null) return 'пусто';
                    const item = gameData.inventory.items[idx];
                    return item ? item.name : 'пусто';
                };
                slot1Label.textContent = getSlotName(gameData.inventory.equipped[0]);
                slot2Label.textContent = getSlotName(gameData.inventory.equipped[1]);
                
                if (gameData.inventory.items.length === 0) {
                    list.innerHTML = '<div class="inventory-empty">Пусто...</div>';
                    return;
                }
                
                let html = '';
                gameData.inventory.items.forEach((item, index) => {
                    const isEquipped1 = gameData.inventory.equipped[0] === index;
                    const isEquipped2 = gameData.inventory.equipped[1] === index;
                    html += `
                        <div class="inventory-item">
                            <div>
                                <span class="item-name">${item.name}</span>
                                <span class="item-desc"> — ${item.desc}</span>
                            </div>
                            <div>
                                <button class="equip-btn ${isEquipped1 ? 'equipped' : ''}" data-index="${index}" data-slot="0">
                                    ${isEquipped1 ? '✅ СЛОТ 1' : '🔧 СЛОТ 1'}
                                </button>
                                <button class="equip-btn ${isEquipped2 ? 'equipped' : ''}" data-index="${index}" data-slot="1">
                                    ${isEquipped2 ? '✅ СЛОТ 2' : '🔧 СЛОТ 2'}
                                </button>
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
                
                list.querySelectorAll('.equip-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = parseInt(this.dataset.index);
                        const slot = parseInt(this.dataset.slot);
                        equipItem(index, slot);
                    });
                });
            }

            // ----- МАГАЗИН -----
            function updateShopUI() {
                const list = document.getElementById('shopList');
                if (!list) return;
                
                let html = '';
                for (const [id, food] of Object.entries(FOOD_ITEMS)) {
                    const count = gameData.inventory.food[id] || 0;
                    html += `
                        <div class="shop-item">
                            <div>
                                <span class="item-name">${food.name}</span>
                                <span class="item-desc"> — ${food.desc}</span>
                                <span class="food-counter">(${count} шт.)</span>
                            </div>
                            <div>
                                <span style="color:#f5d7b0;font-size:0.8rem;">💰${food.price}</span>
                                <button class="food-btn" data-food="${id}">КУПИТЬ</button>
                            </div>
                        </div>
                    `;
                }
                list.innerHTML = html;
                
                list.querySelectorAll('.food-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const foodId = this.dataset.food;
                        buyFood(foodId);
                    });
                });
            }

            // ----- МЕНЮ -----
            function showShop() {
                menu.style.display = 'none';
                shopMenu.style.display = 'block';
                updateShopUI();
                updateCoinsDisplay();
            }

            function hideShop() {
                shopMenu.style.display = 'none';
                menu.style.display = 'block';
            }

            function showInventory() {
                menu.style.display = 'none';
                inventoryMenu.style.display = 'block';
                updateInventoryUI();
            }

            function hideInventory() {
                inventoryMenu.style.display = 'none';
                menu.style.display = 'block';
            }

            function goToMenu() {
                if (frameId) {
                    cancelAnimationFrame(frameId);
                    frameId = null;
                }
                gameWrapper.classList.remove('active');
                menu.style.display = 'block';
                resetGame();
                draw();
                updateCoinsDisplay();
                updateSansButton();
            }

            // ----- БИТВА С САНСОМ -----
            function startSansBattle() {
                if (!gameData.sansUnlocked) return;
                isSansBattle = true;
                player.maxHp = 200;
                player.hp = 200;
                bossHp = 200;
                bossSleep = 200;
                menu.style.display = 'none';
                gameWrapper.classList.add('active');
                resetGame();
                statusDisplay.innerText = '💀 БИТВА С САНСОМ!';
                startAttackPhase();
                if (frameId) cancelAnimationFrame(frameId);
                lastTimestamp = 0;
                frameId = requestAnimationFrame(gameLoop);
            }

            // ----- ЦИКЛ -----
            function gameLoop(timestamp) {
                if (!lastTimestamp) lastTimestamp = timestamp;
                const delta = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
                lastTimestamp = timestamp;

                update(delta);
                draw();
                frameId = requestAnimationFrame(gameLoop);
            }

            function resetGame() {
                player.hp = player.maxHp;
                player.x = 280;
                player.y = GROUND_Y - PLAYER_RADIUS - 4;
                bossHp = isSansBattle ? 200 : 120;
                bossSleep = isSansBattle ? 200 : 150;
                bossPhase = 0;
                attacks = [];
                ducks = [];
                bones = [];
                gasterBlasters = [];
                scytheRain = [];
                attackPhase = false;
                attackTimer = 0;
                decisionPhase = false;
                decisionTimer = 0;
                gameOver = false;
                gameWin = false;
                gameResult = null;
                playerActionTaken = false;
                secretAttackActive = false;
                secretAttackTimer = 0;
                duckAttackActive = false;
                duckTimer = 0;
                spawnCounter = 0;
                scytheWaveActive = false;
                scytheWaveCooldown = 0;
                attackPattern = 0;
                attackBtn.disabled = true;
                spareBtn.disabled = true;
                foodBtn.disabled = true;
                updateHpDisplay();
                updateSleepDisplay();
                statusDisplay.innerText = isSansBattle ? '💀 САНС' : '⚔️ ПРИГОТОВИТЬСЯ';
                applyEquipmentEffects();
                updateFoodUI();
            }

            function startBattle() {
                isSansBattle = false;
                player.maxHp = 120;
                player.hp = 120;
                bossHp = 120;
                bossSleep = 150;
                menu.style.display = 'none';
                gameWrapper.classList.add('active');
                resetGame();

                setTimeout(() => {
                    if (!gameOver && !gameWin) {
                        attackPattern = 0;
                        startAttackPhase();
                        statusDisplay.innerText = '💢 ДЖЕВИЛ АТАКУЕТ: МАСТИ КАРТ';
                    }
                }, 600);

                if (frameId) cancelAnimationFrame(frameId);
                lastTimestamp = 0;
                frameId = requestAnimationFrame(gameLoop);
            }

            // ----- УПРАВЛЕНИЕ -----
            document.addEventListener('keydown', (e) => {
                const key = e.key;
                if (key === ' ' || key === 'Space') {
                    e.preventDefault();
                    keys.Space = true;
                }
                if (key in keys) {
                    e.preventDefault();
                    keys[key] = true;
                }
            });
            document.addEventListener('keyup', (e) => {
                const key = e.key;
                if (key === ' ' || key === 'Space') {
                    e.preventDefault();
                    keys.Space = false;
                }
                if (key in keys) {
                    e.preventDefault();
                    keys[key] = false;
                }
            });

            // Дополнительная функция для roundRect
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (typeof r === 'number') r = {tl: r, tr: r, br: r, bl: r};
                    const rad = typeof r === 'number' ? r : (r.tl || 0);
                    this.moveTo(x + rad, y);
                    this.arcTo(x + w, y, x + w, y + h, rad);
                    this.arcTo(x + w, y + h, x, y + h, rad);
                    this.arcTo(x, y + h, x, y, rad);
                    this.arcTo(x, y, x + w, y, rad);
                    return this;
                };
            }

            foodBtn.addEventListener('click', function() {
                if (gameOver || gameWin) return;
                const foodList = Object.entries(gameData.inventory.food).filter(([id, count]) => count > 0);
                if (foodList.length === 0) {
                    statusDisplay.innerText = '🍔 Нет еды!';
                    return;
                }
                const [foodId] = foodList[0];
                useFood(foodId);
            });

            startBtn.addEventListener('click', startBattle);
            sansBtn.addEventListener('click', startSansBattle);
            shopBtn.addEventListener('click', showShop);
            shopBackBtn.addEventListener('click', hideShop);
            inventoryBtn.addEventListener('click', showInventory);
            inventoryBackBtn.addEventListener('click', hideInventory);
            menuBtn.addEventListener('click', goToMenu);
            attackBtn.addEventListener('click', playerAttackAction);
            spareBtn.addEventListener('click', playerSpareAction);

            window.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space' || e.key.startsWith('Arrow')) {
                    e.preventDefault();
                }
            }, false);

            loadGameData();
            applyEquipmentEffects();
            resetGame();
            draw();
            updateCoinsDisplay();
            updateSansButton();
        })();
    </script>
</body>
</html>
