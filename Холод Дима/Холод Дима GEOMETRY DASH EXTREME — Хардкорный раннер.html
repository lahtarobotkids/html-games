<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🔺 GEOMETRY DASH EXTREME — Хардкорный раннер</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .game-wrapper {
      position: relative;
      width: 900px;
      height: 550px;
      max-width: 100vw;
      max-height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 2px solid #333;
      border-radius: 8px;
      box-shadow: 0 0 60px rgba(255, 0, 100, 0.4), 0 0 100px rgba(0, 200, 255, 0.2);
    }
    #ui-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    #top-hud {
      display: flex;
      justify-content: space-between;
      padding: 12px 20px;
    }
    .hud-item {
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 16px;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #level-select {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(15px);
      padding: 30px;
      border-radius: 24px;
      pointer-events: all;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 2px solid #ff00ff;
      box-shadow: 0 0 40px rgba(255,0,255,0.3);
      z-index: 20;
    }
    #level-select h2 {
      color: #ff00ff;
      text-align: center;
      margin-bottom: 10px;
      font-size: 1.8rem;
    }
    .level-btn {
      padding: 14px 24px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 14px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: 0.2s;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .level-btn:hover {
      background: rgba(255,0,255,0.2);
      border-color: #ff00ff;
      box-shadow: 0 0 20px rgba(255,0,255,0.3);
    }
    .level-difficulty {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 10px;
      background: rgba(0,0,0,0.4);
    }
    #message-center {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 2rem;
      font-weight: bold;
      text-shadow: 2px 2px 10px black;
      text-align: center;
    }
    #restart-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff0066;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 24px;
      cursor: pointer;
      pointer-events: all;
      z-index: 20;
      display: none;
      box-shadow: 0 6px 20px rgba(255,0,100,0.4);
    }
    #restart-btn:hover { background: #ff3388; }
  </style>
</head>
<body>
<div class="game-wrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="ui-layer">
    <div id="top-hud">
      <div class="hud-item">❤️ <span id="lives">3</span></div>
      <div class="hud-item">⭐ <span id="percent">0</span>%</div>
      <div class="hud-item">💀 <span id="deaths">0</span></div>
    </div>
    <div id="message-center"></div>
    <button id="restart-btn">🔄 ПРОДОЛЖИТЬ</button>
    <div id="level-select">
      <h2>🔺 ВЫБЕРИ УРОВЕНЬ</h2>
      <button class="level-btn" onclick="startLevel('stereo')">
        🎵 Stereo Madness <span class="level-difficulty" style="color:#4CAF50;">ЛЁГКИЙ</span>
      </button>
      <button class="level-btn" onclick="startLevel('backtrack')">
        🔙 Back On Track <span class="level-difficulty" style="color:#FFEB3B;">СРЕДНИЙ</span>
      </button>
      <button class="level-btn" onclick="startLevel('polargeist')">
        👻 Polargeist <span class="level-difficulty" style="color:#FF9800;">СЛОЖНЫЙ</span>
      </button>
      <button class="level-btn" onclick="startLevel('dryout')">
        🏜 Dry Out <span class="level-difficulty" style="color:#f44336;">ЭКСТРЕМ</span>
      </button>
      <button class="level-btn" onclick="startLevel('demons')">
        😈 DEMON PARK <span class="level-difficulty" style="color:#ff00ff;">ДЕМОН</span>
      </button>
    </div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const WIDTH = 900;
  const HEIGHT = 550;
  canvas.width = WIDTH;
  canvas.height = HEIGHT;

  // ==================== ИГРОВЫЕ ПЕРЕМЕННЫЕ ====================
  const player = {
    x: 180,
    y: 0,
    size: 38,
    vy: 0,
    isJumping: false,
    rotation: 0,
    trail: [],
    mode: 'cube', // cube, ship, ball, ufo
    gravity: 0.7,
    shipGravity: 0.4,
    color: '#00ffff'
  };

  let obstacles = [];
  let portals = [];
  let particles = [];
  let groundDecos = [];
  let speed = 6;
  let baseSpeed = 6;
  let distance = 0;
  let levelLength = 8000;
  let gameActive = false;
  let currentLevel = '';
  let lives = 3;
  let deaths = 0;
  let percent = 0;
  let frameCount = 0;
  let waveY = 0;
  let isShipMode = false;

  const GROUND_Y = 420;
  const GRAVITY = 0.7;
  const JUMP_FORCE = -13;

  // ==================== УРОВНИ ====================
  const levels = {
    stereo: {
      name: 'Stereo Madness',
      length: 6000,
      speed: 5,
      difficulty: 'easy',
      color: '#4CAF50',
      obstacles: 'basic'
    },
    backtrack: {
      name: 'Back On Track',
      length: 8000,
      speed: 6.5,
      difficulty: 'medium',
      color: '#FFEB3B',
      obstacles: 'mixed'
    },
    polargeist: {
      name: 'Polargeist',
      length: 9000,
      speed: 7.5,
      difficulty: 'hard',
      color: '#FF9800',
      obstacles: 'hard'
    },
    dryout: {
      name: 'Dry Out',
      length: 10000,
      speed: 8.5,
      difficulty: 'extreme',
      color: '#f44336',
      obstacles: 'extreme'
    },
    demons: {
      name: 'DEMON PARK',
      length: 12000,
      speed: 10,
      difficulty: 'demon',
      color: '#ff00ff',
      obstacles: 'demon'
    }
  };

  // ==================== ГЕНЕРАЦИЯ ПРЕПЯТСТВИЙ ====================
  function createSpike(x, y, width, height, color = '#ff4444') {
    return { x, y, width, height, type: 'spike', color, passed: false };
  }

  function createBlock(x, y, width, height, color = '#ff8800') {
    return { x, y, width, height, type: 'block', color, passed: false };
  }

  function createMovingSpike(x, y, width, height, color = '#ff00ff') {
    return { x, y, width, height, type: 'movingSpike', color, baseY: y, moveOffset: 0, moveSpeed: 2 + Math.random() * 3, passed: false };
  }

  function createPortal(x, y, type = 'ship') {
    return { x, y, width: 30, height: 60, type, color: type === 'ship' ? '#4488ff' : type === 'ball' ? '#ff8800' : '#44ff44', passed: false };
  }

  function generateLevel(levelName) {
    obstacles = [];
    portals = [];
    groundDecos = [];
    const level = levels[levelName];
    levelLength = level.length;
    baseSpeed = level.speed;
    speed = baseSpeed;
    distance = 0;
    percent = 0;
    player.mode = 'cube';
    player.y = GROUND_Y - player.size / 2;
    player.vy = 0;
    player.isJumping = false;
    player.rotation = 0;
    player.trail = [];
    isShipMode = false;
    gameActive = true;
    lives = level.difficulty === 'demon' ? 1 : 3;
    deaths = 0;

    const difficulty = level.difficulty;
    let gap = difficulty === 'demon' ? 200 : difficulty === 'extreme' ? 280 : difficulty === 'hard' ? 350 : 400;

    // Генерация препятствий
    for (let x = WIDTH; x < levelLength; x += gap + Math.random() * 150) {
      const rand = Math.random();
      
      if (difficulty === 'demon') {
        // Демонский уровень: всё сразу
        if (rand < 0.4) {
          obstacles.push(createSpike(x, GROUND_Y - 50, 30, 50, '#ff00ff'));
          obstacles.push(createSpike(x + 40, GROUND_Y - 70, 30, 70, '#ff00ff'));
          obstacles.push(createSpike(x + 80, GROUND_Y - 50, 30, 50, '#ff00ff'));
        } else if (rand < 0.7) {
          obstacles.push(createBlock(x, GROUND_Y - 45, 45, 45, '#ff4444'));
          obstacles.push(createMovingSpike(x + 100, GROUND_Y - 60, 25, 60, '#ff00ff'));
        } else {
          obstacles.push(createMovingSpike(x, GROUND_Y - 55, 30, 55, '#ff00ff'));
          obstacles.push(createSpike(x + 150, GROUND_Y - 50, 30, 50, '#ff4444'));
        }
        
        // Порталы
        if (Math.random() < 0.3) {
          portals.push(createPortal(x + 200, GROUND_Y - 30, Math.random() < 0.5 ? 'ship' : 'ball'));
        }
      } else if (difficulty === 'extreme') {
        if (rand < 0.5) {
          obstacles.push(createSpike(x, GROUND_Y - 50, 30, 50));
          obstacles.push(createSpike(x + 50, GROUND_Y - 50, 30, 50));
        } else {
          obstacles.push(createMovingSpike(x, GROUND_Y - 50, 28, 50));
        }
      } else if (difficulty === 'hard') {
        if (rand < 0.6) {
          obstacles.push(createSpike(x, GROUND_Y - 45, 28, 45));
        } else {
          obstacles.push(createBlock(x, GROUND_Y - 40, 40, 40, '#ff8800'));
        }
      } else {
        obstacles.push(createSpike(x, GROUND_Y - 40, 25, 40));
      }

      // Двойные препятствия
      if (Math.random() < 0.4 && difficulty !== 'easy') {
        obstacles.push(createSpike(x + 60, GROUND_Y - 45, 25, 45, '#ff8800'));
      }
    }

    // Порталы
    if (difficulty !== 'easy') {
      for (let x = WIDTH + 500; x < levelLength; x += 1500 + Math.random() * 1000) {
        portals.push(createPortal(x, GROUND_Y - 30, Math.random() < 0.6 ? 'ship' : 'ball'));
      }
    }

    // Декорации
    for (let x = 0; x < levelLength; x += 8) {
      if (Math.random() < 0.3) {
        groundDecos.push({ x, y: GROUND_Y + 5, size: 2 + Math.random() * 3, brightness: Math.random() });
      }
    }

    document.getElementById('level-select').style.display = 'none';
    document.getElementById('restart-btn').style.display = 'none';
    document.getElementById('message-center').textContent = '';
    updateUI();
  }

  // ==================== ФИЗИКА ====================
  function jump() {
    if (!gameActive) return;
    
    if (player.mode === 'cube') {
      if (!player.isJumping) {
        player.vy = JUMP_FORCE;
        player.isJumping = true;
        createJumpParticles();
      }
    } else if (player.mode === 'ship') {
      player.vy = -8;
      createJumpParticles();
    } else if (player.mode === 'ball') {
      player.vy = JUMP_FORCE * 1.3;
      player.isJumping = true;
      createJumpParticles();
    }
  }

  function releaseJump() {
    if (player.mode === 'ship') {
      player.vy = Math.max(player.vy, -2);
    }
  }

  function createJumpParticles() {
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: player.x, y: player.y + player.size/2,
        vx: (Math.random()-0.5)*5, vy: Math.random()*4+2,
        life: 0.4, maxLife: 0.4, size: 3+Math.random()*3,
        color: player.color
      });
    }
  }

  function updatePlayer() {
    if (player.mode === 'ship') {
      player.vy += player.shipGravity;
      player.y += player.vy;
      if (player.y > GROUND_Y - player.size/2) {
        player.y = GROUND_Y - player.size/2;
        player.vy = 0;
      }
      if (player.y < 50) player.y = 50;
    } else if (player.mode === 'ball') {
      player.vy += GRAVITY * 0.9;
      player.y += player.vy;
      if (player.y >= GROUND_Y - player.size/2) {
        player.y = GROUND_Y - player.size/2;
        player.vy = JUMP_FORCE * 1.3;
        createJumpParticles();
      }
    } else {
      player.vy += GRAVITY;
      player.y += player.vy;
      if (player.y >= GROUND_Y - player.size/2) {
        player.y = GROUND_Y - player.size/2;
        player.vy = 0;
        player.isJumping = false;
      }
    }

    // Вращение
    if (player.mode === 'cube') {
      player.rotation += player.vy * 0.03;
    } else {
      player.rotation = 0;
    }

    // Шлейф
    if (frameCount % 2 === 0) {
      player.trail.push({ x: player.x, y: player.y, size: player.size*0.5, life: 0.25, maxLife: 0.25 });
    }
    player.trail = player.trail.filter(t => { t.life -= 0.015; return t.life > 0; });
  }

  function updateObstacles() {
    obstacles.forEach(obs => {
      obs.x -= speed;
      if (obs.type === 'movingSpike') {
        obs.moveOffset = Math.sin(frameCount * 0.05 * obs.moveSpeed) * 40;
        obs.y = obs.baseY + obs.moveOffset;
      }
      if (!obs.passed && obs.x + obs.width < player.x) {
        obs.passed = true;
      }
    });
    obstacles = obstacles.filter(obs => obs.x > -100);

    portals.forEach(portal => {
      portal.x -= speed;
      if (!portal.passed && portal.x + portal.width < player.x) {
        portal.passed = true;
        if (portal.type === 'ship') {
          player.mode = 'ship';
          player.vy = 0;
          isShipMode = true;
        } else if (portal.type === 'ball') {
          player.mode = 'ball';
          player.vy = JUMP_FORCE * 1.3;
          isShipMode = false;
        } else {
          player.mode = 'cube';
          isShipMode = false;
        }
        showMessage(`🌀 ${portal.type.toUpperCase()} MODE!`, portal.color);
      }
    });
    portals = portals.filter(p => p.x > -100);

    groundDecos.forEach(d => d.x -= speed);
    groundDecos = groundDecos.filter(d => d.x > -10);
  }

  function checkCollisions() {
    const px = player.x - player.size/2 + 8;
    const py = player.y - player.size/2 + 8;
    const pw = player.size - 16;
    const ph = player.size - 16;

    for (const obs of obstacles) {
      const ox = obs.x - obs.width/2;
      const oy = obs.y - obs.height/2;
      const ow = obs.width;
      const oh = obs.height;

      if (px < ox + ow && px + pw > ox && py < oy + oh && py + ph > oy) {
        return true;
      }
    }
    if (player.y > GROUND_Y + 60 || player.y < -100) return true;
    return false;
  }

  // ==================== ОТРИСОВКА ====================
  function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
    grad.addColorStop(0, '#0a0a2e');
    grad.addColorStop(0.5, '#1a1a3e');
    grad.addColorStop(1, '#0a0a1e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Движущиеся линии
    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.lineWidth = 1;
    const gridOff = (distance * 0.3) % 50;
    for (let x = -gridOff; x < WIDTH; x += 50) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + 50, GROUND_Y);
      ctx.stroke();
    }

    // Частицы фона
    for (let i = 0; i < 40; i++) {
      const sx = ((i * 173 + 50) % WIDTH);
      const sy = ((i * 97 + 30) % (GROUND_Y - 40));
      const alpha = Math.sin(frameCount * 0.03 + i) * 0.3 + 0.4;
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fillRect(sx, sy, 2, 2);
    }
  }

  function drawGround() {
    ctx.fillStyle = '#1a1a3e';
    ctx.fillRect(0, GROUND_Y, WIDTH, HEIGHT - GROUND_Y);

    ctx.strokeStyle = '#4a4a8e';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#4a4a8e';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(WIDTH, GROUND_Y);
    ctx.stroke();
    ctx.shadowBlur = 0;

    groundDecos.forEach(d => {
      if (d.x > -5 && d.x < WIDTH + 5) {
        ctx.fillStyle = `rgba(255,255,255,${0.2+d.brightness*0.3})`;
        ctx.fillRect(d.x, d.y, d.size, d.size);
      }
    });

    const stripeOff = (distance * 2) % 80;
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    for (let x = -stripeOff; x < WIDTH; x += 80) {
      ctx.fillRect(x, GROUND_Y + 8, 40, 2);
    }
  }

  function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);

    // Шлейф
    player.trail.forEach(t => {
      const alpha = t.life / t.maxLife;
      ctx.fillStyle = `rgba(0,255,255,${alpha*0.3})`;
      ctx.fillRect(t.x-player.x-t.size/2, t.y-player.y-t.size/2, t.size, t.size);
    });

    ctx.shadowColor = player.color;
    ctx.shadowBlur = 20;
    ctx.rotate(player.rotation);

    if (player.mode === 'ship') {
      // Корабль
      ctx.fillStyle = '#4488ff';
      ctx.beginPath();
      ctx.moveTo(0, -player.size/2);
      ctx.lineTo(-player.size/2, player.size/2);
      ctx.lineTo(player.size/2, player.size/2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.moveTo(0, -player.size/4);
      ctx.lineTo(-player.size/4, player.size/4);
      ctx.lineTo(player.size/4, player.size/4);
      ctx.closePath();
      ctx.fill();
    } else if (player.mode === 'ball') {
      // Шар
      const grad = ctx.createRadialGradient(0, 0, player.size/6, 0, 0, player.size/2);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.5, '#ff8800');
      grad.addColorStop(1, '#cc4400');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, player.size/2, 0, Math.PI*2);
      ctx.fill();
    } else {
      // Куб
      const grad = ctx.createLinearGradient(-player.size/2, -player.size/2, player.size/2, player.size/2);
      grad.addColorStop(0, player.color);
      grad.addColorStop(1, '#0066ff');
      ctx.fillStyle = grad;
      ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
      
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(-player.size/4, -player.size/4, player.size/2, player.size/2);
      
      ctx.fillStyle = '#fff';
      ctx.fillRect(player.size/5, -player.size/5, player.size/5, player.size/5);
    }

    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawObstacles() {
    obstacles.forEach(obs => {
      if (obs.x < -60 || obs.x > WIDTH + 60) return;
      ctx.save();
      ctx.translate(obs.x, obs.y);
      ctx.shadowColor = obs.color;
      ctx.shadowBlur = 12;

      if (obs.type === 'spike' || obs.type === 'movingSpike') {
        ctx.fillStyle = obs.color;
        ctx.beginPath();
        ctx.moveTo(0, -obs.height/2);
        ctx.lineTo(-obs.width/2, obs.height/2);
        ctx.lineTo(obs.width/2, obs.height/2);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.moveTo(0, -obs.height/4);
        ctx.lineTo(-obs.width/4, obs.height/4);
        ctx.lineTo(obs.width/4, obs.height/4);
        ctx.closePath();
        ctx.fill();
      } else if (obs.type === 'block') {
        ctx.fillStyle = obs.color;
        ctx.fillRect(-obs.width/2, -obs.height/2, obs.width, obs.height);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(-obs.width/4, -obs.height/4, obs.width/2, obs.height/2);
      }

      ctx.shadowBlur = 0;
      ctx.restore();
    });

    // Порталы
    portals.forEach(portal => {
      if (portal.x < -40 || portal.x > WIDTH + 40) return;
      ctx.save();
      ctx.translate(portal.x, portal.y);
      ctx.shadowColor = portal.color;
      ctx.shadowBlur = 25;
      
      ctx.strokeStyle = portal.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, portal.width/2, 0, Math.PI*2);
      ctx.stroke();
      
      ctx.fillStyle = portal.color;
      ctx.beginPath();
      ctx.arc(0, 0, portal.width/4, 0, Math.PI*2);
      ctx.fill();
      
      ctx.shadowBlur = 0;
      ctx.restore();
    });
  }

  function drawParticles() {
    particles.forEach(p => {
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    });
    ctx.globalAlpha = 1;
  }

  function drawProgressBar() {
    const prog = Math.min(100, Math.floor((distance / levelLength) * 100));
    const barW = 250, barH = 8, barX = WIDTH/2 - barW/2, barY = 25;
    
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(barX, barY, barW, barH);
    
    const grad = ctx.createLinearGradient(barX, 0, barX+barW, 0);
    grad.addColorStop(0, '#00ffff');
    grad.addColorStop(0.5, '#ffd700');
    grad.addColorStop(1, '#ff0066');
    ctx.fillStyle = grad;
    ctx.fillRect(barX, barY, barW*(prog/100), barH);
  }

  // ==================== ИГРОВОЙ ЦИКЛ ====================
  function update() {
    if (!gameActive) return;
    frameCount++;
    distance += speed;
    percent = Math.floor((distance / levelLength) * 100);
    speed = baseSpeed + Math.floor(distance / 1500) * 0.4;
    speed = Math.min(14, speed);

    updatePlayer();
    updateObstacles();
    updateParticles();

    if (checkCollisions()) {
      die();
    }

    if (distance >= levelLength) {
      win();
    }

    updateUI();
  }

  function updateParticles() {
    particles = particles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.02;
      return p.life > 0;
    });
  }

  function die() {
    lives--;
    deaths++;
    updateUI();

    for (let i = 0; i < 40; i++) {
      particles.push({
        x: player.x, y: player.y,
        vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
        life: 0.8, maxLife: 0.8, size: 3+Math.random()*6,
        color: ['#ff0066','#ff8800','#ffd700','#ffffff'][Math.floor(Math.random()*4)]
      });
    }

    if (lives <= 0) {
      gameActive = false;
      document.getElementById('message-center').innerHTML = `💀 ВЫ ПРОИГРАЛИ<br><small>${percent}% пройдено</small>`;
      document.getElementById('restart-btn').style.display = 'block';
    } else {
      player.y = GROUND_Y - player.size/2;
      player.vy = 0;
      player.isJumping = false;
      player.rotation = 0;
      player.mode = 'cube';
      showMessage(`❤️ Осталось жизней: ${lives}`, '#ff4444');
    }
  }

  function win() {
    gameActive = false;
    document.getElementById('message-center').innerHTML = `🎉 УРОВЕНЬ ПРОЙДЕН!<br><small>${deaths} смертей</small>`;
    document.getElementById('restart-btn').style.display = 'block';
    document.getElementById('restart-btn').textContent = '🏆 В МЕНЮ';
  }

  function showMessage(msg, color = '#fff') {
    const el = document.getElementById('message-center');
    el.textContent = msg;
    el.style.color = color;
    setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 2000);
  }

  function updateUI() {
    document.getElementById('lives').textContent = lives;
    document.getElementById('percent').textContent = percent;
    document.getElementById('deaths').textContent = deaths;
  }

  function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);
    drawBackground();
    drawGround();
    drawObstacles();
    drawPlayer();
    drawParticles();
    drawProgressBar();
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // ==================== УПРАВЛЕНИЕ ====================
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      jump();
    }
  });

  window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      releaseJump();
    }
  });

  canvas.addEventListener('mousedown', jump);
  canvas.addEventListener('mouseup', releaseJump);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });
  canvas.addEventListener('touchend', releaseJump);

  document.getElementById('restart-btn').addEventListener('click', () => {
    if (document.getElementById('restart-btn').textContent.includes('МЕНЮ')) {
      document.getElementById('level-select').style.display = 'flex';
    }
    document.getElementById('restart-btn').style.display = 'none';
    document.getElementById('message-center').textContent = '';
    if (currentLevel) generateLevel(currentLevel);
    updateUI();
  });

  window.startLevel = function(levelName) {
    currentLevel = levelName;
    generateLevel(levelName);
    updateUI();
  };

  // Старт
  player.y = GROUND_Y - player.size / 2;
  gameActive = false;
  gameLoop();

  window.addEventListener('resize', () => {
    const wrapper = document.querySelector('.game-wrapper');
    const scale = Math.min(window.innerWidth/WIDTH, window.innerHeight/HEIGHT) * 0.95;
    wrapper.style.transform = `scale(${scale})`;
  });
  window.dispatchEvent(new Event('resize'));

  console.log('🔺 GEOMETRY DASH EXTREME! Выберите уровень и играйте!');
})();
</script>
</body>
</html>
