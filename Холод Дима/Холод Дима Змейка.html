<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🐍 МЕДЛЕННАЯ ЗМЕЙКА — Расслабляющая игра</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 50%, #0d1b2a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      user-select: none;
    }

    .game-container {
      background: rgba(10, 20, 30, 0.8);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 60px rgba(100, 200, 255, 0.1);
      border: 1px solid rgba(100, 200, 255, 0.15);
      text-align: center;
      max-width: 500px;
    }

    h1 {
      color: #a0d8ef;
      font-size: 2.2rem;
      margin-bottom: 5px;
      text-shadow: 0 0 30px rgba(100, 200, 255, 0.3);
      letter-spacing: 4px;
      font-weight: 300;
    }

    .subtitle {
      color: #7eb8da;
      font-size: 0.85rem;
      margin-bottom: 20px;
      opacity: 0.7;
      letter-spacing: 2px;
    }

    canvas {
      display: block;
      border-radius: 20px;
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.5), 0 10px 40px rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(100, 180, 220, 0.2);
      background: #0a141f;
    }

    .info-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 22px;
      border-radius: 25px;
      color: #c8e6f5;
      font-weight: 400;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      letter-spacing: 1px;
    }

    #score-val {
      color: #ffd700;
      font-size: 1.3rem;
      font-weight: 600;
    }

    #length-val {
      color: #7ec8e3;
      font-weight: 600;
    }

    #speed-val {
      color: #a0d8ef;
      font-weight: 600;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 26px;
      font-size: 0.95rem;
      font-weight: 500;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.4s ease;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.05);
      color: #c8e6f5;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    button:hover {
      background: rgba(100, 200, 255, 0.15);
      border-color: rgba(100, 200, 255, 0.4);
      box-shadow: 0 8px 25px rgba(100, 200, 255, 0.15);
      transform: translateY(-2px);
    }

    button.primary {
      background: rgba(100, 180, 220, 0.2);
      border-color: rgba(100, 200, 255, 0.3);
      color: #fff;
    }

    button.primary:hover {
      background: rgba(100, 200, 255, 0.3);
      box-shadow: 0 8px 30px rgba(100, 200, 255, 0.25);
    }

    .speed-selector {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      justify-content: center;
    }

    .speed-btn {
      padding: 8px 18px;
      font-size: 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.3s;
      background: rgba(255, 255, 255, 0.03);
      color: #8ab4cc;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .speed-btn.active {
      background: rgba(100, 200, 255, 0.2);
      color: #fff;
      border-color: rgba(100, 200, 255, 0.4);
    }

    .speed-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    #message-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      padding: 30px 40px;
      border-radius: 24px;
      text-align: center;
      color: white;
      display: none;
      z-index: 10;
      border: 1px solid rgba(255, 100, 100, 0.3);
      backdrop-filter: blur(10px);
    }

    #message-overlay h2 {
      color: #ff8888;
      font-weight: 300;
      font-size: 1.8rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    #message-overlay p {
      margin: 6px 0;
      color: #ccc;
    }

    @media (max-width: 500px) {
      .game-container {
        padding: 15px;
      }
      canvas {
        width: 100%;
        height: auto;
      }
      h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-container" style="position: relative;">
    <h1>🐍 ЗМЕЙКА</h1>
    <p class="subtitle">медленная • плавная • расслабляющая</p>

    <div class="speed-selector">
      <button class="speed-btn" onclick="setSpeed('verySlow')">🐢 Очень медленно</button>
      <button class="speed-btn active" onclick="setSpeed('slow')">🐌 Медленно</button>
      <button class="speed-btn" onclick="setSpeed('normal')">🚶 Нормально</button>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="message-overlay">
      <h2>💤 Игра окончена</h2>
      <p>Собрано: <span id="final-score">0</span></p>
      <p>Длина: <span id="final-length">3</span></p>
      <button class="primary" onclick="restartGame()" style="margin-top:12px;">🔄 Продолжить</button>
    </div>

    <div class="info-row">
      <div class="info-box">⭐ <span id="score-val">0</span></div>
      <div class="info-box">📏 <span id="length-val">3</span></div>
      <div class="info-box">🐢 <span id="speed-val">Медленно</span></div>
    </div>

    <div class="btn-row">
      <button onclick="togglePause()">⏯ Пауза</button>
      <button class="primary" onclick="restartGame()">🔄 Заново</button>
    </div>
  </div>

  <script>
    // ==================== НАСТРОЙКИ ====================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GRID = 20;
    const CELL = canvas.width / GRID;

    // ==================== ИГРОВЫЕ ПЕРЕМЕННЫЕ ====================
    let snake = [
      { x: 10, y: 10 },
      { x: 9, y: 10 },
      { x: 8, y: 10 }
    ];

    let food = { x: 15, y: 10 };
    let specialFood = null;
    let specialTimer = 0;

    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };

    let score = 0;
    let highScore = parseInt(localStorage.getItem('snakeSlowHighScore')) || 0;

    let gameRunning = true;
    let gamePaused = false;
    let gameOver = false;

    // Скорости (мс между ходами) — МЕДЛЕННЫЕ
    const speeds = {
      verySlow: 250,
      slow: 180,
      normal: 120
    };
    let currentSpeed = 'slow';
    let moveInterval = speeds.slow;

    let gameTimer = null;
    let particles = [];
    let frameCount = 0;
    let animationId = null;

    // ==================== ФУНКЦИИ ====================
    function randomFood() {
      const free = [];
      for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
          if (!snake.some(s => s.x === x && s.y === y)) {
            free.push({ x, y });
          }
        }
      }
      return free.length > 0 ? free[Math.floor(Math.random() * free.length)] : null;
    }

    function placeFood() {
      const pos = randomFood();
      if (pos) food = pos;
    }

    function placeSpecialFood() {
      if (Math.random() < 0.15) {
        const pos = randomFood();
        if (pos) {
          specialFood = pos;
          specialTimer = 100;
        }
      }
    }

    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x * CELL + CELL / 2,
          y: y * CELL + CELL / 2,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          life: 0.6 + Math.random() * 0.6,
          maxLife: 1,
          size: 2 + Math.random() * 4,
          color: color
        });
      }
    }

    function moveSnake() {
      if (!gameRunning || gamePaused || gameOver) return;

      dir = { ...nextDir };
      const head = {
        x: snake[0].x + dir.x,
        y: snake[0].y + dir.y
      };

      // Столкновение со стеной
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        endGame();
        return;
      }

      // Столкновение с собой
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      // Обычная еда
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        spawnParticles(food.x, food.y, '#ffd700', 8);
        placeFood();
        placeSpecialFood();
      }
      // Особая еда
      else if (specialFood && head.x === specialFood.x && head.y === specialFood.y) {
        score += 30;
        spawnParticles(specialFood.x, specialFood.y, '#88ccff', 12);
        specialFood = null;
        specialTimer = 0;
      }
      else {
        snake.pop();
      }

      updateUI();
    }

    function changeDirection(newDir) {
      const map = {
        'up': { x: 0, y: -1 },
        'down': { x: 0, y: 1 },
        'left': { x: -1, y: 0 },
        'right': { x: 1, y: 0 }
      };
      const nd = map[newDir];
      if (!nd) return;
      // Нельзя развернуться
      if (nd.x === -dir.x && nd.y === -dir.y) return;
      nextDir = nd;
    }

    function endGame() {
      gameRunning = false;
      gameOver = true;
      clearInterval(gameTimer);
      gameTimer = null;

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snakeSlowHighScore', highScore);
      }

      spawnParticles(snake[0].x, snake[0].y, '#ff8888', 20);

      document.getElementById('final-score').textContent = score;
      document.getElementById('final-length').textContent = snake.length;
      document.getElementById('message-overlay').style.display = 'block';
      updateUI();
    }

    function startTimer() {
      if (gameTimer) clearInterval(gameTimer);
      if (gameRunning && !gamePaused && !gameOver) {
        gameTimer = setInterval(moveSnake, moveInterval);
      }
    }

    function togglePause() {
      if (!gameRunning || gameOver) return;
      gamePaused = !gamePaused;
      if (gamePaused) {
        clearInterval(gameTimer);
        gameTimer = null;
      } else {
        startTimer();
      }
    }

    function restartGame() {
      clearInterval(gameTimer);
      gameTimer = null;

      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      specialFood = null;
      specialTimer = 0;
      particles = [];
      gameRunning = true;
      gamePaused = false;
      gameOver = false;

      document.getElementById('message-overlay').style.display = 'none';
      placeFood();
      startTimer();
      updateUI();
    }

    function setSpeed(speed) {
      currentSpeed = speed;
      moveInterval = speeds[speed];
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      const labels = {
        verySlow: '🐢 Очень медл.',
        slow: '🐌 Медленно',
        normal: '🚶 Нормально'
      };
      document.getElementById('speed-val').textContent = labels[speed];

      if (gameRunning && !gamePaused && !gameOver) {
        startTimer();
      }
    }

    function updateUI() {
      document.getElementById('score-val').textContent = score;
      document.getElementById('length-val').textContent = snake.length;
    }

    // ==================== ОТРИСОВКА ====================
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Фон с мягкой сеткой
      ctx.fillStyle = '#0a141f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(100, 180, 220, 0.03)';
      ctx.lineWidth = 1;
      for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
          ctx.strokeRect(x * CELL, y * CELL, CELL, CELL);
        }
      }

      // Змейка с плавными переходами
      snake.forEach((seg, i) => {
        const x = seg.x * CELL;
        const y = seg.y * CELL;
        const pad = 3;

        // Мягкий градиент
        const grad = ctx.createLinearGradient(x, y, x + CELL, y + CELL);
        if (i === 0) {
          grad.addColorStop(0, '#7ec8e3');
          grad.addColorStop(1, '#5ba8c8');
        } else {
          const t = i / snake.length;
          const r = Math.floor(60 + t * 60);
          const g = Math.floor(150 + t * 50);
          const b = Math.floor(180 + t * 20);
          grad.addColorStop(0, `rgb(${r},${g},${b})`);
          grad.addColorStop(1, `rgb(${r-20},${g-20},${b-20})`);
        }

        ctx.fillStyle = grad;
        ctx.shadowColor = i === 0 ? 'rgba(126,200,227,0.4)' : 'rgba(100,180,220,0.1)';
        ctx.shadowBlur = i === 0 ? 10 : 3;
        ctx.beginPath();
        ctx.roundRect(x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, 6);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Глаза головы
        if (i === 0) {
          ctx.fillStyle = '#fff';
          const es = CELL / 5;
          let ex1, ey1, ex2, ey2;
          if (dir.x === 1) {
            ex1 = x + CELL - 8 - es; ey1 = y + 6;
            ex2 = x + CELL - 8 - es; ey2 = y + CELL - 6 - es;
          } else if (dir.x === -1) {
            ex1 = x + 8; ey1 = y + 6;
            ex2 = x + 8; ey2 = y + CELL - 6 - es;
          } else if (dir.y === -1) {
            ex1 = x + 6; ey1 = y + 8;
            ex2 = x + CELL - 6 - es; ey2 = y + 8;
          } else {
            ex1 = x + 6; ey1 = y + CELL - 8 - es;
            ex2 = x + CELL - 6 - es; ey2 = y + CELL - 8 - es;
          }
          ctx.beginPath();
          ctx.arc(ex1 + es/2, ey1 + es/2, es/1.3, 0, Math.PI*2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(ex2 + es/2, ey2 + es/2, es/1.3, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#1a1a3a';
          ctx.beginPath();
          ctx.arc(ex1 + es/2, ey1 + es/2, es/3, 0, Math.PI*2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(ex2 + es/2, ey2 + es/2, es/3, 0, Math.PI*2);
          ctx.fill();
        }
      });

      // Обычная еда — яблоко
      const fx = food.x * CELL + CELL/2;
      const fy = food.y * CELL + CELL/2;
      const pulse = Math.sin(frameCount * 0.04) * 0.15 + 0.85;

      // Свечение
      const glow = ctx.createRadialGradient(fx, fy, CELL*0.2, fx, fy, CELL*0.7);
      glow.addColorStop(0, 'rgba(255,200,100,0.3)');
      glow.addColorStop(1, 'rgba(255,200,100,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(fx, fy, CELL*0.7, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#e8734a';
      ctx.beginPath();
      ctx.arc(fx, fy, CELL*0.35 * pulse, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#7ec8a0';
      ctx.beginPath();
      ctx.ellipse(fx + 1, fy - CELL*0.32, CELL*0.1, CELL*0.2, 0.4, 0, Math.PI*2);
      ctx.fill();

      // Особая еда — кристалл
      if (specialFood) {
        const sx = specialFood.x * CELL + CELL/2;
        const sy = specialFood.y * CELL + CELL/2;
        const spulse = Math.sin(frameCount * 0.06) * 0.2 + 0.8;

        const sglow = ctx.createRadialGradient(sx, sy, CELL*0.1, sx, sy, CELL*0.8);
        sglow.addColorStop(0, 'rgba(136,204,255,0.4)');
        sglow.addColorStop(1, 'rgba(136,204,255,0)');
        ctx.fillStyle = sglow;
        ctx.beginPath();
        ctx.arc(sx, sy, CELL*0.8, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#88ccff';
        ctx.shadowColor = '#88ccff';
        ctx.shadowBlur = 10 * spulse;
        ctx.beginPath();
        ctx.arc(sx, sy, CELL*0.3 * spulse, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#fff';
        ctx.font = `${CELL*0.5}px Arial`;
        ctx.textAlign = 'center';
        ctx.fillText('💠', sx, sy + CELL*0.18);
      }

      // Частицы
      for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Пауза
      if (gamePaused && gameRunning) {
        ctx.fillStyle = 'rgba(10,20,30,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#c8e6f5';
        ctx.font = '300 26px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('⏸ ПАУЗА', canvas.width/2, canvas.height/2);
      }
    }

    // ==================== ИГРОВОЙ ЦИКЛ ====================
    function gameLoop() {
      frameCount++;

      if (specialFood) {
        specialTimer--;
        if (specialTimer <= 0) {
          specialFood = null;
          specialTimer = 0;
        }
      }

      particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.015;
        return p.life > 0;
      });

      draw();
      animationId = requestAnimationFrame(gameLoop);
    }

    // ==================== УПРАВЛЕНИЕ ====================
    window.addEventListener('keydown', e => {
      const map = {
        'ArrowUp': 'up', 'ArrowDown': 'down',
        'ArrowLeft': 'left', 'ArrowRight': 'right',
        'KeyW': 'up', 'KeyS': 'down',
        'KeyA': 'left', 'KeyD': 'right'
      };
      if (map[e.code]) {
        e.preventDefault();
        changeDirection(map[e.code]);
      }
      if (e.code === 'Space') {
        e.preventDefault();
        if (gameOver) restartGame();
        else togglePause();
      }
      if (e.code === 'KeyP') togglePause();
    });

    // Свайпы
    let tsx = 0, tsy = 0;
    canvas.addEventListener('touchstart', e => {
      tsx = e.touches[0].clientX;
      tsy = e.touches[0].clientY;
    });
    canvas.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tsx;
      const dy = e.changedTouches[0].clientY - tsy;
      if (Math.abs(dx) > Math.abs(dy)) {
        changeDirection(dx > 0 ? 'right' : 'left');
      } else {
        changeDirection(dy > 0 ? 'down' : 'up');
      }
    });

    // Глобальные функции
    window.togglePause = togglePause;
    window.restartGame = restartGame;
    window.setSpeed = setSpeed;

    // ==================== СТАРТ ====================
    placeFood();
    startTimer();
    updateUI();
    gameLoop();

    console.log('🐍 МЕДЛЕННАЯ ЗМЕЙКА — расслабляйтесь и играйте!');
  </script>
</body>
</html>
